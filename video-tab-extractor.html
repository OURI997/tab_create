        });
        const rs = await flowDetectBars(small, Math.round(nativeW * k), f => setDetProgress(f));
        const blank = new Uint8Array(totalW);
        for (let x = 0; x < totalW; x++) blank[x] = rs.blank[Math.min(rs.blank.length - 1, Math.floor(x * k))] || 0;
        r = { ...rs, bars: rs.bars.map(b => Math.min(totalW - 1, Math.round(b / k))), blank, space: rs.space / k, total: totalW };
      } else {
        r = await flowDetectBars(chunks, nativeW, f => setDetProgress(f));
      }
      setDet(r); setBars(r.bars);
    } finally { setDetecting(false); }
  }
  // 마디를 지우거나 되돌릴 때 마디선을 다시 검출하지 않는다 — 손으로 고친 마디선이 사라져 처음부터 다시 해야 했다.
  // 결과(띠)마다 마디선을 기억해 두고, 지운 구간만큼 뒤쪽 마디선을 당긴다
  const barsMemoRef = useRef(new WeakMap());
  useEffect(() => {
    const memo = barsMemoRef.current;
    setSelIdx(null); setEditIdx(null);
    if (memo.has(result)) { const m = memo.get(result); setDet(m.det); setBars(m.bars); return; }
    if (result.lastCut && result.cutFrom && memo.has(result.cutFrom)) {
      const { a, b } = result.lastCut, cut = b - a;
      const m = memo.get(result.cutFrom);
      const nb = [];
      for (const x of m.bars) {
        const r = Math.round(x);
        if (r > a && r <= b) continue;
        const v = r > b ? x - cut : x;
        if (!nb.length || v > nb[nb.length - 1] + 1) nb.push(v);
      }
      let nd = m.det;
      if (nd) {
        let blank = nd.blank;
        if (blank && blank.length >= b) { const nbk = new Uint8Array(Math.max(1, blank.length - cut)); nbk.set(blank.subarray(0, a), 0); nbk.set(blank.subarray(b), a); blank = nbk; }
        nd = { ...nd, bars: nb, blank, total: totalW };
      }
      setDet(nd); setBars(nb);
      return;
    }
    detect();
  }, [result]);
  useEffect(() => { if (det) barsMemoRef.current.set(result, { det, bars }); }, [bars, det]);
  const [delFrom, setDelFrom] = useState('');
  const [delTo, setDelTo] = useState('');
  function deleteRange() {
    const nM = Math.max(0, bars.length - 1);
    const i = parseInt(delFrom, 10), j = delTo === '' ? i : parseInt(delTo, 10);
    if (!(i >= 1 && j >= i && j <= nM) || !ctx2.onDeleteMeasure) return;
    ctx2.onDeleteMeasure(bars[i - 1], bars[j]);
    setDelFrom(''); setDelTo('');
  }

  const videoUrl = useMemo(() => (videoFile ? URL.createObjectURL(videoFile) : null), [videoFile]);
  useEffect(() => () => { if (videoUrl) URL.revokeObjectURL(videoUrl); }, [videoUrl]);

  // ---- 시간 매핑: 스트립 x → 재생 시각 ----
  // 스트립 좌표 s의 내용이 재생바 열 p를 지나는 시각 = X(t) − X(첫 프레임) = s − p 가 되는 t (x(t)의 역변환)
  const playbar = useMemo(() => flowResolvePlaybar(track), [track]);
  const Xm = useMemo(() => {
    const out = [];
    let m = -Infinity;
    for (const v of track.X) { m = Math.max(m, v); out.push(m); }
    return out;
  }, [track]);
  const Xf = useMemo(() => flowInterpX(track, result.tFirst != null ? result.tFirst : track.t[track.k0]), [track, result]);
  const dur = track.t[track.t.length - 1];
  const tOf = s => {
    const p = playbar ? playbar.x : 0;
    const t = flowInvX(track.t, Xm, s - p + Xf) + (playbar ? 0 : offsetSec);
    return Math.max(0, Math.min(dur, t));
  };

  // ---- 그룹화 (기존 groupBarsByTargetWidth / groupByWidth와 같은 UI·기본값 규칙) ----
  const quality = useMemo(() => assessBarQuality(bars, totalW, nativeW, det ? det.weak : true), [bars, totalW, nativeW, det]);
  const measureW = useMemo(() => robustMeasureWidth(bars), [bars]);
  const autoGroupSize = quality.medianWidth ? Math.max(2, Math.min(6, Math.round(nativeW / quality.medianWidth))) : 4;
  const groupSize = groupSizeUser != null ? groupSizeUser : autoGroupSize;
  const maxBarsPerGroup = Math.max(maxBarsUser != null ? maxBarsUser : groupSize + 2, groupSize);
  const useBarGroups = bars.length >= 2 && (groupBasis === 'bar' || (groupBasis === 'auto' && !quality.low));
  let groups = [];
  if (det) {
    if (useBarGroups) groups = groupBarsByTargetWidth(bars, groupSize, maxBarsPerGroup);
    else groups = groupByWidth(totalW, groupSize, maxBarsPerGroup, measureW, nativeW, bars, det.blank, det.space);
  }
  const groupsMeta = groups.map((g, i) => {
    const start = tOf(g.startX);
    const end = i + 1 < groups.length ? tOf(groups[i + 1].startX) : tOf(g.endX);
    return { ...g, timeRange: { start, end: Math.max(start, end) } };
  });
  const thumbs = useMemo(
    () => groupsMeta.map(g => flowCropStrip(chunks, g.startX, g.endX).toDataURL('image/png')),
    // eslint-disable-next-line
    [chunks, JSON.stringify(groups.map(g => [g.startX, g.endX]))]
  );

  // ---- 이상치: 마디 길이(시간)가 중앙값의 ±40%를 벗어나는 마디 ----
  const measureTimes = [];
  for (let i = 0; i + 1 < bars.length; i++) measureTimes.push(tOf(bars[i + 1]) - tOf(bars[i]));
  const medDur = medianOf(measureTimes);
  const flagged = [];
  if (measureTimes.length >= 5 && medDur > 0) measureTimes.forEach((d, i) => { if (Math.abs(d / medDur - 1) > 0.4) flagged.push(i); });

  const warnings = useMemo(
    () => (det && det.staffFound ? uniStripWarnings(chunks, bars, det.space, ctx2.pieceRanges || []) : []),
    // eslint-disable-next-line
    [chunks, bars, det, ctx2.pieceRanges]
  );

  function commitBars(nb, newSel) { setBars(nb); setSelIdx(newSel != null ? newSel : null); }
  function deleteSelected() {
    if (selIdx == null) return;
    setBars(bars.filter((_, i) => i !== selIdx)); setSelIdx(null);
  }
  function scrollToX(x) {
    const el = scrollRef.current;
    if (el) el.scrollTo({ left: Math.max(0, x * scale - el.clientWidth / 2), behavior: 'smooth' });
  }
  function playFrom(range) {
    const v = pvRef.current;
    if (!v) return;
    v.muted = false;
    v.currentTime = range.start;
    stopAtRef.current = range.end;
    v.play().catch(() => {});
  }
  function onPvTime() {
    const v = pvRef.current;
    if (v && stopAtRef.current != null && v.currentTime >= stopAtRef.current) { v.pause(); stopAtRef.current = null; }
  }

  async function sendToBuilder() {
    setSending(true);
    try {
      const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
      const items = groupsMeta.map((g, idx) => {
        const c = flowCropStrip(chunks, g.startX, g.endX);
        // 전처리를 거쳤으면(검정 잉크·흰 배경) 반전/재처리 없이 그대로, 전처리를 껐으면 어두운 배경 여부로 invert 판단
        const processed = !!flowDefaults.removeBg;
        const invert = !processed && computeAvgLuminanceFromCanvas(c) < 128;
        return {
          id: 'uni_' + Date.now() + '_' + idx,
          type: 'image', src: c.toDataURL('image/png'),
          invert, override: processed ? { ...MERGED_ROW_NEUTRAL_OVERRIDE } : null,
          lyrics: { tags: [], areaHeightRatio: null },
          playheadExcluded: [], barLayout: null,
          stitchMeta: { source: 'uni', groupIndex: idx, barCount: g.count, byWidth: !!g.byWidth },
          timeRange: g.timeRange,
          videoSourceId: sourceId,
        };
      });
      if (sourceId && videoFile) await dbPut(VIDEO_SOURCE_KEY_PREFIX + sourceId, { videoBlob: videoFile, onsets: [], savedAt: Date.now() });
      await dbPut(VIDEO_IMPORT_KEY, { items, importedAt: Date.now() });
      window.location.href = 'tab-score-builder.html';
    } catch (err) {
      alert('전달 중 오류가 발생했습니다: ' + err.message);
      setSending(false);
    }
  }

  const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
  return (
    <div className="block">
      <div className="block-head"><span>2단계 — 마디 분할 · 시간 매핑 · 악보 빌더로 넘기기</span></div>
      {detecting && <p className="hint-text">마디선 검출 중... {Math.round(detProgress * 100)}%</p>}
      {det && (
        <p className="hint-text">
          {det.staffFound ? ('마디선 ' + bars.length + '개 (마디 ' + Math.max(0, bars.length - 1) + '개) · 연속도 임계 T=' + (det.T != null ? det.T.toFixed(2) : '-')) : '보표(오선)를 찾지 못했습니다.'}
          {det.staffFound && quality.low && <b style={{ color: '#c0392b' }}> · 마디 인식 신뢰도 낮음{det.weak ? ' (마디선 인식 약함)' : ''} — 폭 기준 그룹화로 자동 전환</b>}
          {' · 재생 시각 기준: '}{playbar ? ('재생바 ' + (playbar.source === 'user' ? '(지정) ' : '(자동 감지) ') + Math.round(playbar.x) + 'px') : '재생바 위치 없음 — 아래 슬라이더로 보정'}
        </p>
      )}
      <div className="toolbar">
        <button className="icon-btn" onClick={detect} disabled={detecting}>마디선 다시 검출 (수동 수정 초기화)</button>
        <button className="icon-btn" onClick={deleteSelected} disabled={selIdx == null}>선택한 마디선 삭제{selIdx != null ? ' (x=' + Math.round(bars[selIdx]) + ')' : ''}</button>
        {!playbar && (
          <label style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>시각 보정:
            <input type="range" min="-3" max="3" step="0.05" value={offsetSec} onChange={e => setOffsetSec(parseFloat(e.target.value))} />
            <span className="slider-label" style={{ margin: 0 }}>{offsetSec.toFixed(2)}초</span>
          </label>
        )}
      </div>
      <p className="hint-text" style={{ margin: '4px 0' }}>빈 곳 클릭 = 마디선 추가 · 마디선 클릭 = 선택(삭제 대상) · 드래그 = 위치 미세 조정 · 주황 음영 = 마디 길이(시간) 이상치</p>
      {flagged.length > 0 && (
        <div className="toolbar">
          <b style={{ color: '#e07000' }}>이상 의심 마디 {flagged.length}개 (마디선 누락·과다 의심):</b>
          {flagged.map((i, n) => (
            <button key={i} className="icon-btn" style={{ color: '#e07000', borderColor: '#e07000', fontWeight: 700 }}
              title={'마디 ' + (i + 1) + ' · ' + measureTimes[i].toFixed(2) + '초 (중앙값 ' + medDur.toFixed(2) + '초)'}
              onClick={() => { scrollToX(bars[i]); setSelIdx(i); }}>{CIRCLED[n] || n + 1}</button>
          ))}
        </div>
      )}
      {warnings.length > 0 && (
        <div className="toolbar">
          <b style={{ color: '#8e24aa' }}>누락 점검 경고 {warnings.length}개:</b>
          {warnings.map((w, n) => (
            <button key={n} className="icon-btn" style={{ color: '#8e24aa', borderColor: '#8e24aa' }} title={w.text}
              onClick={() => { scrollToX(bars[w.measureIdx]); setEditIdx(w.measureIdx); setSelIdx(null); if (ctx2.onEditEnter) ctx2.onEditEnter(w.measureIdx, bars[w.measureIdx], bars[w.measureIdx + 1]); }}>
              마디 {w.measureIdx + 1} — {w.text} (이 마디를 더블클릭해 편집)
            </button>
          ))}
        </div>
      )}
      <div className="toolbar">
        <span className="hint-text" style={{ margin: 0 }}>
          {editIdx != null ? ('편집 중: 마디 ' + (editIdx + 1) + ' — 초록 핸들을 끌면 이음새에서 잘린 구간 → 인접 조각 원본 가장자리 순으로 원본 픽셀을 가져오거나(바깥), 더 잘라 냅니다(안쪽)') : ('마디를 더블클릭하면 편집 모드(가장자리 조절' + (ctx2.onDeleteMeasure ? '·삭제' : '') + ')로 들어갑니다 · 띠 위 파란 숫자 = 마디 번호')}
        </span>
        {editIdx != null && <button className="icon-btn" style={{ color: '#c0392b', borderColor: '#c0392b' }} onClick={() => { if (ctx2.onDeleteMeasure) ctx2.onDeleteMeasure(bars[editIdx], bars[editIdx + 1]); setEditIdx(null); }}>삭제 (Delete)</button>}
        {editIdx != null && <button className="icon-btn" onClick={() => setEditIdx(null)}>편집 종료</button>}
        {ctx2.onDeleteMeasure && (
          <span style={{ display: 'inline-flex', alignItems: 'center', gap: 4 }}>
            <span className="slider-label" style={{ margin: 0 }}>마디 지우기:</span>
            <input type="number" min="1" max={Math.max(1, bars.length - 1)} value={delFrom} placeholder="번호" onChange={e => setDelFrom(e.target.value)} style={{ width: '4.5em' }} />
            <span>~</span>
            <input type="number" min="1" max={Math.max(1, bars.length - 1)} value={delTo} placeholder="(끝)" onChange={e => setDelTo(e.target.value)} style={{ width: '4.5em' }} />
            <button className="icon-btn" style={{ color: '#c0392b', borderColor: '#c0392b' }} onClick={deleteRange}
              disabled={!(parseInt(delFrom, 10) >= 1 && parseInt(delFrom, 10) <= bars.length - 1 && (delTo === '' || (parseInt(delTo, 10) >= parseInt(delFrom, 10) && parseInt(delTo, 10) <= bars.length - 1)))}>지우기</button>
          </span>
        )}
        <button className="icon-btn" onClick={() => ctx2.onUndo && ctx2.onUndo()} disabled={!ctx2.canUndo}>← 되돌리기</button>
        <button className="icon-btn" onClick={() => ctx2.onRedo && ctx2.onRedo()} disabled={!ctx2.canRedo}>다시 실행 →</button>
        {ctx2.msg && <span className="save-msg">{ctx2.msg}</span>}
      </div>
      <UniBarStrip chunks={chunks} totalW={totalW} H={H} scale={scale} bars={bars} flagged={flagged} warnIdx={warnings.map(w => w.measureIdx)} selIdx={selIdx} editIdx={editIdx}
        getPreview={ctx2.getPreview || null} highlight={ctx2.highlight || null} seams={ctx2.seams || []} onSeamDouble={j => ctx2.onSeamReset && ctx2.onSeamReset(j)}
        onSelect={i => setSelIdx(i)} onCommit={commitBars}
        onEdit={i => { setEditIdx(i); setSelIdx(null); if (ctx2.onEditEnter) ctx2.onEditEnter(i, bars[i], bars[i + 1]); }}
        onExtend={(edge, xEdge, d) => ctx2.onExtend && ctx2.onExtend(edge, xEdge, d, editIdx != null && bars[editIdx + 1] != null ? { left: bars[editIdx], right: bars[editIdx + 1] } : null)} scrollRef={scrollRef} />

      <div className="hr" />
      <div className="toolbar">
        <label>몇 마디씩 묶기(목표): <IntInput min={1} max={16} value={groupSize} onCommit={setGroupSizeUser} style={{ width: '4em' }} /></label>
        <label>그룹당 최대 마디수: <IntInput min={1} max={20} value={maxBarsPerGroup} onCommit={setMaxBarsUser} style={{ width: '4em' }} /></label>
        <label>그룹 기준:
          <select value={groupBasis} onChange={e => setGroupBasis(e.target.value)} style={{ width: 'auto', marginLeft: '6px' }}>
            <option value="auto">자동 (신뢰도 낮으면 폭 기준)</option>
            <option value="bar">마디선 기준</option>
            <option value="width">폭 기준</option>
          </select>
        </label>
        <span className="hint-text" style={{ margin: 0 }}>자동 기준: 화면 1장 분량{groupSizeUser == null ? ' (목표 ' + autoGroupSize + '마디, 최대 ' + (autoGroupSize + 2) + ')' : ''}</span>
        <span className="save-msg">{useBarGroups ? (Math.max(0, bars.length - 1) + '마디 → ' + groups.length + '개 그룹') : ('폭 기준 분할 → ' + groups.length + '개 그룹')}</span>
      </div>

      {videoUrl && (
        <video ref={pvRef} src={videoUrl} controls onTimeUpdate={onPvTime} style={{ maxWidth: '100%', maxHeight: '220px', background: '#000' }} />
      )}

      <div className="list">
        {groupsMeta.map((g, idx) => (
          <div key={idx} className="block">
            <div className="block-head">
              <span>
                그룹 {idx + 1}: {g.byWidth ? '폭 기준 분할' : (g.count + '마디')}
                <span className="save-msg"> · {g.timeRange.start.toFixed(2)}s ~ {g.timeRange.end.toFixed(2)}s</span>
              </span>
              <button className="icon-btn" onClick={() => playFrom(g.timeRange)} disabled={!videoUrl}>영상에서 확인</button>
            </div>
            {thumbs[idx] && <img src={thumbs[idx]} className="merge-preview-img" alt={'그룹 ' + (idx + 1)} />}
          </div>
        ))}
      </div>

      <div className="toolbar">
        <button onClick={sendToBuilder} disabled={sending || !groups.length}>{sending ? '전달 중...' : 'TAB 악보 만들기로 넘기기 (' + groups.length + '개) →'}</button>
      </div>
    </div>
  );
}

// 마디 단위 비교용 서명: 마디선 사이 구간(양끝 마디는 잘렸을 수 있어 제외)을 96×48 그레이로 줄인 샘플
function uniMeasureSigs(canvas, bars) {
  const sigs = [];
  const H = canvas.height;
  for (let i = 0; i + 1 < bars.length; i++) {
    const x0 = bars[i], x1 = bars[i + 1];
    if (x1 - x0 < 24) continue;
    const crop = flowCropStrip([canvas], x0, x1);
    const t = document.createElement('canvas');
    t.width = 96; t.height = 48;
    t.getContext('2d').drawImage(crop, 0, 0, crop.width, H, 0, 0, 96, 48);
    sigs.push(flowLowFromCanvas(t, 96, 0));
  }
  return sigs;
}
function uniSigMatch(a, b) {
  if (a.w !== b.w || a.h !== b.h) return 0;
  return flowNccAt(flowToZeroMeanRows(a), flowToZeroMeanRows(b), a.w, a.h, new Uint8Array(a.w), 0);
}

function UniExtract({ videoRef, videoFile, roi, rangeStart, rangeEnd, rate, segs, analysis, uniDefaults, autoRemove, removeMode, manualFrac, bgSeekRef, seekTRef, onBusy }) {
  const [busy, setBusy] = useState(false);
  const [progress, setProgress] = useState({ label: '', pct: 0 });
  const [msg, setMsg] = useState('');
  const [exSegs, setExSegs] = useState([]);
  const [repT, setRepT] = useState({});
  const [dupPage, setDupPage] = useState({});
  const [flowErr, setFlowErr] = useState({});
  const [version, setVersion] = useState(0);
  const [merged, setMerged] = useState(null);
  const [composing, setComposing] = useState(false);
  // 편집 상태 전체(이음새 trim/꼬리/슬라이더 {adj}, 조각 포함 토글 {include})를 하나의 undo/redo 스택(최대 100단계)으로 관리한다.
  const [edit, setEditState] = useState({ adj: {}, include: {}, cuts: [] });
  const editRef = useRef(edit); editRef.current = edit;
  const pastRef = useRef([]), futureRef = useRef([]);
  const [, setStackVer] = useState(0);
  const lastGestureRef = useRef(0);
  const { adj, include } = edit;
  const cuts = edit.cuts || [];
  const sig = JSON.stringify(include);
  const [editMsg, setEditMsg] = useState('');
  const [hl, setHl] = useState(null);           // 적용 직후 새로 들어온 구간 하이라이트 {j, dTrim, dTail}
  const [nccMap, setNccMap] = useState({});     // page 구간별 앞 page와의 영점 이동 NCC
  const [candPage, setCandPage] = useState({}); // duplicatePage지만 합성 스트립에 없는 마디가 있는 구간 → 포함 후보
  const hlTimer = useRef(null);
  const final = useMemo(
    () => (merged ? uniFinalize(merged, merged.sig === sig ? adj : {}, analysis.nativeW, merged.sig === sig ? cuts : []) : null),
    // eslint-disable-next-line
    [merged, adj, cuts, sig]
  );
  function pushPast() { pastRef.current = [...pastRef.current.slice(-99), editRef.current]; futureRef.current = []; setStackVer(v => v + 1); }
  function commit(next) { pushPast(); setEditState(next); }               // 한 번의 조작 = 한 단계
  function coalesced(next) {                                                 // 슬라이더 같은 연속 조작: 600ms 안의 변화는 한 단계로 묶는다
    const now = Date.now();
    if (now - lastGestureRef.current > 600) pushPast();
    lastGestureRef.current = now;
    setEditState(next);
  }
  function undo() {
    if (!pastRef.current.length) return;
    futureRef.current = [editRef.current, ...futureRef.current];
    const prev = pastRef.current[pastRef.current.length - 1];
    pastRef.current = pastRef.current.slice(0, -1);
    setEditState(prev); setStackVer(v => v + 1); setEditMsg('되돌렸습니다.');
  }
  function redo() {
    if (!futureRef.current.length) return;
    pastRef.current = [...pastRef.current, editRef.current];
    const nxt = futureRef.current[0];
    futureRef.current = futureRef.current.slice(1);
    setEditState(nxt); setStackVer(v => v + 1); setEditMsg('다시 실행했습니다.');
  }
  const undoRef = useRef(null), redoRef = useRef(null);
  undoRef.current = undo; redoRef.current = redo;
  useEffect(() => {
    function onKey(e) {
      const el = document.activeElement, tag = el && el.tagName;
      const typing = el && (tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable ||
        (tag === 'INPUT' && !['range', 'checkbox', 'radio', 'button'].includes(el.type)));
      if (typing) return; // 입력창에 포커스가 있으면 동작하지 않는다
      if (!(e.metaKey || e.ctrlKey)) return;
      const k = e.key.toLowerCase();
      if (k === 'z' && !e.shiftKey) { e.preventDefault(); undoRef.current(); }
      else if ((k === 'z' && e.shiftKey) || (k === 'y' && e.ctrlKey)) { e.preventDefault(); redoRef.current(); }
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  const prodRef = useRef({ page: {}, flow: {}, removal: null });
  const abortRef = useRef(false);
  const queueRef = useRef(Promise.resolve());
  const thumbRefs = useRef({});
  const repTimers = useRef({});
  const composeTokenRef = useRef(0);

  // 위쪽 영상 캔버스에 중간 프레임이 비치지 않도록 억제하고, 끝나면 시크 위치로 되돌리는 백그라운드 작업
  function enqueueBg(fn) {
    const p = queueRef.current.then(async () => {
      bgSeekRef.current = true;
      try { await fn(); }
      finally {
        bgSeekRef.current = false;
        const v = videoRef.current;
        if (v && v.videoWidth) { await seekSafe(v, seekTRef.current); v.dispatchEvent(new Event('seeked')); }
      }
    });
    queueRef.current = p.catch(() => {});
    return p;
  }

  async function extract() {
    const video = videoRef.current;
    if (!video) return;
    abortRef.current = false;
    setBusy(true); onBusy(true); setMerged(null); setMsg('');
    bgSeekRef.current = true;
    const list = segs.filter(s => s.kind === 'page' || s.kind === 'flow').map(s => ({ ...s }));
    const report = (label, f) => setProgress({ label, pct: Math.round(Math.max(0, Math.min(1, f)) * 100) });
    try {
      const prod = { page: {}, flow: {}, removal: null, band: null };
      prodRef.current = prod;
      // 고정 열 감지(flowDetectPlaybar)는 flow 구간과 '고정 열' 방식의 page에 필요하다 — 중앙값/돌출 방식의 page는 프레임에서 직접 찾는다
      if (autoRemove && (removeMode === 'column' || list.some(s => s.kind === 'flow'))) {
        report('재생바 감지 중...', 0);
        const det = await flowDetectPlaybar(video, roi, rangeStart, rangeEnd, uniDefaults, f => report('재생바 감지 중...', f * 0.1), () => true);
        if (det && det.cols.length && det.band) prod.removal = { cols: det.cols, band: det.band };
      }
      const pages = list.filter(s => s.kind === 'page');
      // 시간 중앙값: 빠른 재생 한 번으로 모든 page 구간의 프레임을 모은다(실패하거나 프레임이 모자란 구간만 아래에서 seek로 보충)
      let fastMedian = {};
      if (removeMode === 'median' && pages.length) {
        report('page 프레임 수집 중 (빠른 재생)...', 0.1);
        try { fastMedian = await uniCollectPageMedians(video, roi, pages, 9, abortRef, f => report('page 프레임 수집 중 (빠른 재생)...', 0.1 + 0.18 * f)); }
        catch (err) { fastMedian = {}; }
      }
      for (let i = 0; i < pages.length; i++) {
        if (abortRef.current) { setMsg('중단되었습니다.'); return; }
        const seg = pages[i];
        const t = seg.repT != null ? seg.repT : (seg.start + seg.end) / 2; // 대표 프레임 후보(diff가 가장 작은 지점)
        // 기본(시간 중앙값): 구간 [start+0.05, end-0.05]의 최대 15프레임 픽셀별 중앙값 — 재생바가 한 위치에 머무는 시간이 절반 미만이면 사라진다
        const raw = removeMode === 'median' ? (fastMedian[seg.id] || await uniMedianCapture(video, roi, seg, 9)) : await captureRepCanvas(video, roi, t);
        const rr = (autoRemove || manualFrac != null) ? uniRemovePlaybar(raw, { mode: removeMode, manualFrac, defaults: uniDefaults, globalRemoval: prod.removal }) : { cols: [] };
        prod.page[seg.id] = { raw, t, cols: rr.cols };
        if (rr.band && !prod.band) prod.band = rr.band;
        report('page 대표 프레임 캡처 ' + (i + 1) + '/' + pages.length, 0.1 + 0.2 * ((i + 1) / pages.length));
      }
      // 수동 지정 열은 flow 구간에도 적용(밴드는 page에서 찾은 것 사용)
      if (manualFrac != null && prod.band) prod.removal = { cols: [[manualFrac * analysis.nativeW - 2, manualFrac * analysis.nativeW + 2]], band: prod.band };
      const flows = list.filter(s => s.kind === 'flow');
      const ferr = {};
      for (let i = 0; i < flows.length; i++) {
        const seg = flows[i];
        try {
          const res = await flowRunPipeline({
            video, roi, playbarFrac: null, rate, medianObs: false, scrollDefaults: uniDefaults, abortRef,
            startT: seg.start, endT: seg.end, playbarRemoval: prod.removal,
            onProgress: (label, pct) => report('flow 구간 ' + (i + 1) + '/' + flows.length + ' — ' + label, 0.3 + 0.65 * ((i + pct / 100) / flows.length)),
          });
          if (!res) { setMsg('중단되었습니다.'); return; }
          prod.flow[seg.id] = { res };
        } catch (err) {
          if (abortRef.current) { setMsg('중단되었습니다.'); return; }
          prod.flow[seg.id] = { error: err.message };
          ferr[seg.id] = err.message;
        }
      }
      // 연속한 page 구간 둘의 대표 프레임(전처리 후) 영점 이동 NCC ≥ 0.98이면 duplicatePage — 뒤쪽을 기본 제외(토글로 복구)
      // dup[id] = 제외 사유: true/'same'(앞 페이지와 동일), 'faded'(페이드 중인 흐린 사본), 'noStaff'(오선이 없는 화면 — 광고·타이틀 등)
      const dup = {}, ncc = {};
      const stdOf = lowS => { let a = 0, q = 0; const g = lowS.gray; for (let i = 0; i < g.length; i++) { a += g[i]; q += g[i] * g[i]; } const m = a / g.length; return Math.sqrt(Math.max(0, q / g.length - m * m)); };
      let prev = null;
      for (const seg of list) {
        if (seg.kind === 'flow') { prev = null; continue; }
        const raw = prod.page[seg.id].raw;
        const low = uniProcessedLow(raw, uniDefaults);
        const rawLow = flowLowFromCanvas(raw, 480, 0);
        const cur = { id: seg.id, low, rawLow, std: stdOf(rawLow) };
        if (prev) {
          const v = uniZeroShiftNcc(prev.low, low);
          ncc[seg.id] = v;
          if (v >= 0.98) { dup[seg.id] = 'same'; continue; }
          // 페이드 인/아웃 도중에 잡힌 흐린 사본: 원본 밝기 구조는 같은데(NCC ≥ 0.9) 대비가 뚜렷이 낮다(< 70%) — 흐린 쪽을 제외
          const rv = uniZeroShiftNcc(prev.rawLow, rawLow);
          if (rv >= 0.9 && Math.min(prev.std, cur.std) < 0.7 * Math.max(prev.std, cur.std)) {
            if (cur.std < prev.std) { dup[seg.id] = 'faded'; continue; }
            dup[prev.id] = 'faded';
          }
        }
        prev = cur;
      }
      // 오선이 없는 화면(광고·타이틀·엔딩 카드) 제외 — 대부분(≥60%)의 page 조각에서 오선을 찾은 영상에서만 적용
      const pageIds = list.filter(sg => sg.kind === 'page').map(sg => sg.id);
      const hasBand = {};
      // 오선 판정은 두 가지로 — 전처리 기반(uniFindBand)과 원본 밝기의 가는 가로선 6줄(tabRoi 검출). 둘 다 못 찾을 때만 "오선 없음".
      for (const id of pageIds) hasBand[id] = !!uniFindBand(prod.page[id].raw, uniDefaults) || canvasHasTabStaff(prod.page[id].raw);
      const bandCount = pageIds.filter(id => hasBand[id]).length;
      if (pageIds.length >= 3 && bandCount >= pageIds.length * 0.6) for (const id of pageIds) if (!hasBand[id] && !dup[id]) dup[id] = 'noStaff';
      const inc = {};
      for (const seg of list) inc[seg.id] = seg.kind === 'page' ? !dup[seg.id] : !!(prod.flow[seg.id] && prod.flow[seg.id].res);
      pastRef.current = []; futureRef.current = []; setStackVer(v => v + 1);
      setEditState({ adj: {}, include: inc, cuts: [] });
      setExSegs(list); setDupPage(dup); setNccMap(ncc); setCandPage({}); setFlowErr(ferr);
      setRepT(Object.fromEntries(Object.entries(prod.page).map(([id, v]) => [id, v.t])));
      setVersion(v => v + 1);
      setMsg('추출 완료 — 아래에서 조각 포함 여부와 page 대표 프레임을 조정할 수 있습니다.');
    } catch (err) {
      setMsg('오류: ' + err.message);
    } finally {
      bgSeekRef.current = false;
      setBusy(false); onBusy(false);
      const v = videoRef.current;
      if (v) { v.pause(); v.muted = true; v.playbackRate = 1; await seekSafe(v, seekTRef.current); v.dispatchEvent(new Event('seeked')); }
    }
  }

  // 포함 여부/대표 프레임이 바뀌면 잠시 뒤 다시 합친다
  useEffect(() => {
    if (!exSegs.length) return;
    const tok = ++composeTokenRef.current;
    const id = setTimeout(async () => {
      setComposing(true);
      try {
        const res = await uniCompose({ segs: exSegs, include, products: prodRef.current, uniDefaults, nativeW: analysis.nativeW, allSegs: segs });
        if (res) res.sig = sig; // 이 합성이 어떤 포함 상태에서 만들어졌는지 — 이음새 보정(adj)은 같은 포함 상태에서만 적용된다
        if (tok === composeTokenRef.current) {
          setMerged(res);
          if (!res) setMsg('합칠 조각이 없습니다 — 포함된 조각이 없거나 추출에 실패했습니다. 조각 목록의 체크 상태와 영역(ROI)·전처리 설정을 확인하세요.');
        }
      } catch (err) {
        setMsg('합치기 오류: ' + err.message);
      } finally { setComposing(false); }
    }, 30); // 포함 토글·되돌리기는 즉시 전체를 다시 합성한다
    return () => clearTimeout(id);
  }, [exSegs, sig, version]);

  // 썸네일: 추출 직후와 대표 프레임/전처리 설정이 바뀔 때 갱신
  useEffect(() => {
    for (const seg of exSegs) if (seg.kind === 'page') {
      const pr = prodRef.current.page[seg.id];
      if (pr) uniDrawThumb(thumbRefs.current[seg.id], pr.raw, uniDefaults, pr.cols);
    }
  }, [exSegs, version, uniDefaults]);

  function changeRep(seg, t) {
    setRepT(p => ({ ...p, [seg.id]: t }));
    clearTimeout(repTimers.current[seg.id]);
    repTimers.current[seg.id] = setTimeout(() => {
      enqueueBg(async () => {
        const video = videoRef.current;
        const raw = await captureRepCanvas(video, roi, t);
        const rr = (autoRemove || manualFrac != null) ? uniRemovePlaybar(raw, { mode: removeMode, manualFrac, defaults: uniDefaults, globalRemoval: prodRef.current.removal }) : { cols: [] };
        prodRef.current.page[seg.id] = { raw, t, cols: rr.cols };
        uniDrawThumb(thumbRefs.current[seg.id], raw, uniDefaults, rr.cols); // 썸네일 즉시 갱신
        setVersion(v => v + 1);
      });
    }, 150);
  }

  // ---- 마디 가장자리 확장(편집 모드): 가장 가까운 이음새의 trim/꼬리를 조정 — 잘린 구간 → 인접 조각 원본 가장자리 순으로 복원 ----
  // 편집 모드 진입 로그 — 마디 [left,right], 모든 이음새의 stripX·trim·조각 id, 잘린 구간 매핑 개수
  function onEditEnter(i, left, right) {
    if (!final || !merged) return;
    // eslint-disable-next-line no-console
    console.log('[uni 마디 편집]', {
      measureIdx: i, left, right,
      seams: final.seamInfo.map(sm => ({ j: sm.j, stripX: sm.x, trim: sm.trim, cut: sm.cut, internal: sm.internal, pieceSegIds: merged.pieces[sm.j].segIds })),
      pieceCount: merged.pieces.length, trimmedMapCount: final.trimmed.length,
    });
  }
  // ---- 마디 가장자리 확장 ----
  // 후보 이음새: 마디 [left,right]를 좌우로 마디 1개 폭씩 넓힌 범위와 겹치는 이음새. 끄는 방향 쪽에서 가장 가까운 것을 고른다.
  function pickSeam(edge, xEdge, d, measure) {
    const mw = measure ? Math.max(1, measure.right - measure.left) : 400;
    const lo = (measure ? measure.left : xEdge) - mw, hi = (measure ? measure.right : xEdge) + mw;
    const cands = final.seamInfo.filter(sm => sm.x >= lo && sm.x <= hi);
    if (!cands.length) return null;
    const dir = d >= 0 ? 1 : -1;
    const ahead = cands.filter(sm => (sm.x - xEdge) * dir >= -2);
    const pool = ahead.length ? ahead : cands;
    return pool.reduce((m, c) => (!m || Math.abs(c.x - xEdge) < Math.abs(m.x - xEdge) ? c : m), null);
  }
  // 이음새 j에서 amount px를 가져오거나(outward) 더 자를 때의 새 trim/꼬리. 한계(limit)는 인접 조각의 전체 원본 폭까지:
  // ① 이음새에서 잘린 구간(앞부분/꼬리) → ② 인접 조각 원본 가장자리 (오른쪽 핸들은 뒤 조각, 왼쪽 핸들은 앞 조각 쪽부터)
  function computeEdit(sm, edge, amount, outward) {
    const j = sm.j, A = merged.pieces[j - 1], B = merged.pieces[j], e = final.eff[j];
    const leftW = B.leftExtra ? B.leftExtra.width : 0, rightW = A.rightExtra ? A.rightExtra.width : 0;
    let limit;
    if (outward) limit = Math.max(0, e.trim) + Math.max(0, -e.tail) + Math.max(0, leftW - Math.max(0, -e.trim)) + Math.max(0, rightW - Math.max(0, e.tail));
    else limit = edge === 'right' ? Math.max(0, Math.min(analysis.nativeW - 2, B.totalW - 1) - e.trim) : Math.max(0, e.tail + Math.min(analysis.nativeW, A.totalW - 1));
    const applied = Math.max(0, Math.min(amount, limit));
    let trim = e.trim, tail = e.tail, rest = applied, fromCut = 0, fromEdge = 0;
    if (outward) {
      if (trim > 0) { const r = Math.min(rest, trim); trim -= r; rest -= r; fromCut += r; }
      if (rest > 0 && tail < 0) { const r = Math.min(rest, -tail); tail += r; rest -= r; fromCut += r; }
      const capL = () => leftW - Math.max(0, -trim), capR = () => rightW - Math.max(0, tail);
      const useLeft = () => { const r = Math.min(rest, capL()); if (r > 0) { trim -= r; rest -= r; fromEdge += r; } };
      const useRight = () => { const r = Math.min(rest, capR()); if (r > 0) { tail += r; rest -= r; fromEdge += r; } };
      if (edge === 'right') { useLeft(); useRight(); } else { useRight(); useLeft(); }
    } else if (edge === 'right') trim = e.trim + applied;
    else tail = e.tail - applied;
    return { j, A, B, e, trim, tail, applied, limit, fromCut, fromEdge, outward };
  }
  function zeroReason(sm, r) {
    return sm.cut === 0 && r.e.trim <= 0 && r.e.tail >= 0
      ? '이음새는 있지만 잘린 구간이 0이고 인접 조각의 원본도 더 없습니다 (조각 끝).'
      : '조각 끝 — 인접 조각의 원본을 모두 가져왔습니다.';
  }
  // 드래그 중 실시간 미리보기: 상태는 바꾸지 않고, 이음새 구간만 부분 재합성한 그림(삽입 영역 + 밀리는 꼬리)을 돌려 준다
  function getPreview(edge, xEdge, dx, measure) {
    if (!final || !merged) return null;
    const outward = (edge === 'right' && dx > 0) || (edge === 'left' && dx < 0);
    const sm = pickSeam(edge, xEdge, dx, measure);
    if (!sm) return { noSeam: true, outward, amount: 0, limit: 0, reason: '이음새 없음 — 이 마디 주변(좌우 한 마디 폭)에 이음새가 없습니다' };
    const r = computeEdit(sm, edge, Math.abs(Math.round(dx)), outward);
    const p = final.offsets[sm.j], H = merged.H;
    const out = { outward, amount: r.applied, limit: r.limit, total: final.totalW, insert: null, leftEnd: p, tailFrom: p, shift: 0, reason: null };
    out.atLimit = outward && Math.abs(Math.round(dx)) >= r.limit;
    if (outward && r.limit === 0) out.reason = zeroReason(sm, r);
    if (outward && r.applied > 0) {
      const dTrim = Math.max(0, r.e.trim - r.trim), dTail = Math.max(0, r.tail - r.e.tail);
      const w = dTrim + dTail;
      const c = document.createElement('canvas'); c.width = Math.max(1, w); c.height = H;
      const ctx = c.getContext('2d');
      if (dTail > 0) ctx.drawImage(uniPieceCols(r.A, r.A.totalW + r.e.tail, r.A.totalW + r.tail, H), 0, 0);
      if (dTrim > 0) ctx.drawImage(uniPieceCols(r.B, r.trim, r.e.trim, H), dTail, 0);
      out.insert = c; out.shift = w;
    } else if (!outward && r.applied > 0) {
      out.shift = -r.applied;
      if (edge === 'right') out.tailFrom = p + r.applied; else out.leftEnd = p - r.applied;
    }
    return out;
  }
  // 바깥으로 가져온 B쪽 원본 가장자리가 현재 이음새(앞 조각 끝)와 이어지도록 NCC(잉크 연속성)로 정렬 오프셋을 구한다
  function alignDelta(j, newTrim) {
    try {
      const W = analysis.nativeW, H = merged.H, B = merged.pieces[j];
      const endX = final.offsets[j];
      const tailC = document.createElement('canvas'); tailC.width = W; tailC.height = H;
      const tctx = tailC.getContext('2d'); tctx.fillStyle = '#fff'; tctx.fillRect(0, 0, W, H);
      const crop = flowCropStrip(final.chunks, Math.max(0, endX - W), endX);
      tctx.drawImage(crop, W - crop.width, 0);
      const headC = uniPieceCols(B, newTrim, newTrim + W, H);
      const iA = tileInfoOf(tailC), iB = tileInfoOf(headC);
      const sys = iA.sys || iB.sys;
      if (!sys) return 0;
      const mask = new Uint8Array(H);
      for (const inf of [iA, iB]) if (inf.sys) for (let y = 0; y < H; y++) if (inf.sys.mask[y]) mask[y] = 1;
      const r = findCutSeamOffset(tileInk(iA.g), W, H, iA.xR, tileInk(iB.g), W, iB.xL, mask, sys.space);
      return r && r.match >= 4 ? r.d : 0;
    } catch (err) { return 0; }
  }
  function onExtend(edge, xEdge, d, measure) {
    if (!final || !merged) return;
    const outward = (edge === 'right' && d > 0) || (edge === 'left' && d < 0);
    const sm = pickSeam(edge, xEdge, d, measure);
    if (!sm) { setEditMsg('이 마디 주변에 이음새 없음 — 마디 좌우 한 마디 폭 안에 이음새가 없습니다 (이음새 마커는 스트립 위 삼각형).'); return; }
    const r = computeEdit(sm, edge, Math.abs(Math.round(d)), outward);
    if (r.applied <= 0) { setEditMsg(outward ? '원본 없음 — ' + zeroReason(sm, r) : '더 자를 수 없습니다.'); return; }
    let trim = r.trim;
    let delta = 0;
    if (outward && edge === 'right' && r.fromEdge > 0) {
      delta = alignDelta(r.j, trim);
      if (delta) trim = Math.max(-(r.B.leftExtra ? r.B.leftExtra.width : 0), Math.min(analysis.nativeW - 2, trim + delta));
    }
    commit({ ...edit, adj: { ...adj, [r.j]: { ...(adj[r.j] || {}), trim, tail: r.tail } } });
    if (outward) {
      setHl({ j: r.j, dTrim: Math.max(0, r.e.trim - trim), dTail: Math.max(0, r.tail - r.e.tail) });
      clearTimeout(hlTimer.current); hlTimer.current = setTimeout(() => setHl(null), 2000);
    }
    setEditMsg(outward
      ? ('이음새 ' + r.j + ': 잘린 구간 ' + r.fromCut + 'px + 조각 원본 가장자리 ' + r.fromEdge + 'px 복원' + (delta ? ' (NCC 정렬 ' + (delta > 0 ? '+' : '') + delta + 'px)' : '') + ' · 원본 한계 ' + r.limit + 'px')
      : ('이음새 ' + r.j + ': ' + r.applied + 'px 더 잘라 냄'));
  }
  // 마디 삭제: 그 마디 구간을 원본 조각 좌표 기준의 제외 구간으로 기록한다 — 재합성해도 유지되고 undo/redo 스택에 들어간다
  function onDeleteMeasure(left, right) {
    if (!final || !merged) return;
    const newCuts = [];
    for (const m of final.map) {
      const a = Math.max(left, m.s0), b = Math.min(right, m.s1);
      if (b <= a) continue;
      newCuts.push({ pieceIdx: m.pieceIdx, x0: m.x0 + (a - m.s0), x1: m.x0 + (b - m.s0) });
    }
    if (!newCuts.length) return;
    commit({ ...edit, cuts: [...cuts, ...newCuts] });
    setEditMsg('마디 삭제: ' + Math.round(right - left) + 'px 제거 — 뒤 마디를 앞으로 당겼습니다 (마디 감지·그룹·시간 매핑 재계산)');
  }

  // 조각 점검: 구간별 [조각 id, 포함 여부, zero-shift NCC, 합성 스트립에 이미 포함된 비율, 이음새에서 제거된 폭]을 console.log로 남기고,
  // duplicatePage로 제외된 조각은 마디 단위로 비교해 합성 스트립에 없는 마디가 있으면 '포함 후보'로 표시한다.
  const finalRef = useRef(null); finalRef.current = final;
  useEffect(() => {
    if (!merged || !finalRef.current || !exSegs.length) return;
    let cancelled = false;
    (async () => {
      const f0 = finalRef.current;
      const needed = exSegs.filter(sg => sg.kind === 'page' && dupPage[sg.id] && !include[sg.id]);
      let stripSigs = null;
      if (needed.length) {
        const det = await flowDetectBars(f0.chunks, analysis.nativeW, () => {});
        stripSigs = [];
        const xs = det.bars;
        for (let i = 0; i + 1 < xs.length; i++) if (xs[i + 1] - xs[i] >= 24) stripSigs.push(...uniMeasureSigs(flowCropStrip(f0.chunks, xs[i], xs[i + 1]), [0, xs[i + 1] - xs[i]]));
      }
      const cand = {};
      const rows = [];
      for (const sg of exSegs) {
        if (sg.kind !== 'page') continue;
        let ratio = null;
        if (stripSigs && dupPage[sg.id] && !include[sg.id]) {
          const pr = prodRef.current.page[sg.id];
          const c = cloneCanvas(pr.raw);
          scrollApplyPreprocInPlace(c, uniDecideOpts(c, uniDefaults));
          const inf = tileInfoOf(c);
          if (inf.sys) {
            const bx = detectBarsThroughSystem(inf.g, inf.sys, 0.8, inf.xL, 140, null, 0).bars.map(b => b.x);
            const mySigs = uniMeasureSigs(c, bx);
            let matched = 0;
            for (const ms of mySigs) if (stripSigs.some(ss => uniSigMatch(ms, ss) >= 0.9)) matched++;
            ratio = mySigs.length ? matched / mySigs.length : null;
            if (mySigs.length && matched < mySigs.length) cand[sg.id] = { missing: mySigs.length - matched, total: mySigs.length };
          }
        }
        const cb = merged.segContrib && merged.segContrib[sg.id];
        rows.push({ segId: sg.id, included: !!include[sg.id], zeroShiftNcc: nccMap[sg.id] != null ? +nccMap[sg.id].toFixed(3) : null, alreadyIncludedRatio: ratio, removedPx: cb ? cb.removed : null, contributionPx: cb ? cb.px : 0, droppedAsDuplicate: cb ? cb.dropped : null });
      }
      // eslint-disable-next-line no-console
      console.log('[uni 조각 점검] [조각 id, 포함 여부, zero-shift NCC, 합성 스트립에 이미 포함된 비율, 이음새 제거 폭]', rows);
      if (!cancelled) setCandPage(cand);
    })();
    return () => { cancelled = true; };
    // eslint-disable-next-line
  }, [merged]);

  // 이음새 마커 더블클릭: 그 이음새의 겹침/중복 제거를 0으로 되돌린다(원본 복원)
  function onSeamReset(j) {
    if (!final || !merged) return;
    const sm = final.seamInfo.find(x => x.j === j);
    if (!sm) return;
    const B = merged.pieces[j];
    const trim = sm.internal ? -Math.min(sm.cut, B.leftExtra ? B.leftExtra.width : 0) : 0; // 타일 사이 이음새는 이미 적용된 제거분만큼 원본 왼쪽을 되살린다
    commit({ ...edit, adj: { ...adj, [j]: { trim, tail: 0 } } });
    setEditMsg('이음새 ' + j + ': 겹침/중복 제거 0으로 되돌림 (원본 복원' + (sm.cut ? ', 잘린 구간 ' + sm.cut + 'px' : ', 잘린 구간이 0이었음') + ')');
  }
  const pieceIdxOf = {};
  if (merged) merged.pieces.forEach((p, i) => { pieceIdxOf[p.segIds[0]] = i; });

  function exportDebug() {
    if (!merged || !final) return;
    const sp = final.synth;
    const data = {
      sourceMap: final.map, trimmedRanges: final.trimmed, adjustments: adj,
      pieces: merged.pieces.map((p, i) => ({
        type: p.type, segIds: p.segIds, offset: final.offsets[i], totalW: p.totalW, hasLeftExtra: !!p.leftExtra, hasRightExtra: !!p.rightExtra, expectedMeasures: p.expect,
        join: i === 0 ? null : {
          auto: { state: merged.joinsAuto[i].state, trimLeftPx: merged.joinsAuto[i].trim, dupFixedPx: merged.joinsAuto[i].dupFixed, suspectMissing: !!merged.joinsAuto[i].suspect,
            seamSuspect: !!merged.joinsAuto[i].seamSuspect, suggestTrim: merged.joinsAuto[i].suggestTrim, margin: merged.joinsAuto[i].margin, overlap: merged.joinsAuto[i].ovl },
          effective: { trim: final.eff[i].trim, tail: final.eff[i].tail, manual: final.eff[i].manual },
        },
      })),
      segJoin: final.segJoin,
      timeMapping: sp.track.X.map((x, k) => ({ stripX: x, timeSec: sp.track.t[k] })), // 최종 시간 매핑 표 (스트립 x → 시각)
      timeMappingNote: 'flow 조각은 x(t) 역변환, page 조각은 구간 [start,end] 안 폭 비례 분배(추정)',
    };
    downloadBlobFile(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'uni_extract_debug.json');
  }

  const hasPlan = segs.some(s => s.kind === 'page' || s.kind === 'flow');
  return (
    <div className="block">
      <div className="block-head"><span>통합 추출 — page/flow 구간 자동 추출 + 이음</span></div>
      <p className="hint-text">
        위 구간 표를 확정한 뒤 실행하세요. page 구간은 대표 프레임(diff가 가장 작은 지점)을 캡처해 컷 전환 방식으로 이어 붙이고,
        flow 구간은 연속 이동형 파이프라인으로 스트립을 만든 뒤 조각 경계마다 중복 마디를 제거해 하나의 긴 스트립으로 합칩니다.
        컷/디졸브/미세 이동/완전정지 구간은 사용하지 않습니다.
      </p>
      <div className="toolbar">
        <button onClick={extract} disabled={busy || !hasPlan}>{busy ? '추출 중...' : '통합 추출'}</button>
        {busy && <button className="icon-btn" onClick={() => { abortRef.current = true; }}>중단</button>}
        <span className="save-msg">{busy ? (progress.label + ' — ' + progress.pct + '%') : msg}</span>
      </div>
      {busy && (
        <div style={{ height: '8px', background: 'var(--border)', borderRadius: '4px', overflow: 'hidden' }}>
          <div style={{ width: progress.pct + '%', height: '100%', background: 'var(--accent)' }} />
        </div>
      )}
      {exSegs.length > 0 && (
        <div>
          <div className="slider-label">조각 목록 — 포함 토글을 바꾸면 자동으로 다시 합쳐집니다{composing ? ' (합치는 중...)' : ''}</div>
          <div style={{ overflowX: 'auto' }}>
            <table style={{ width: '100%', borderCollapse: 'collapse', fontSize: '12px' }}>
              <thead><tr style={{ textAlign: 'left', borderBottom: '1px solid var(--border-strong)' }}>
                <th>포함</th><th>종류</th><th>시간(s)</th><th>신뢰도</th><th>이음 상태</th><th>page 대표 프레임</th>
              </tr></thead>
              <tbody>
                {exSegs.map(seg => (
                  <tr key={seg.id} style={{ borderBottom: '1px solid var(--border)', verticalAlign: 'top', opacity: include[seg.id] ? 1 : 0.55 }}>
                    <td><input type="checkbox" checked={!!include[seg.id]} disabled={seg.kind === 'flow' && !(prodRef.current.flow[seg.id] && prodRef.current.flow[seg.id].res)}
                      onChange={e => commit({ adj: {}, cuts: [], include: { ...include, [seg.id]: e.target.checked } })} /></td>
                    <td><span style={{ color: UNI_KIND_COLOR[seg.kind] }}>■ </span>{UNI_KIND_LABEL[seg.kind]}{dupPage[seg.id] ? (dupPage[seg.id] === 'faded' ? ' · 자동 제외: 흐린 사본(페이드 중)' : dupPage[seg.id] === 'noStaff' ? ' · 자동 제외: 오선 없음(악보 아님)' : ' · duplicatePage (앞 페이지와 동일)') : ''}</td>
                    <td>{seg.start.toFixed(2)} ~ {seg.end.toFixed(2)}</td>
                    <td>{seg.score.toFixed(2)}</td>
                    <td>
                      {merged && merged.segContrib && merged.segContrib[seg.id] && include[seg.id] && (
                        <div style={{ color: merged.segContrib[seg.id].dropped ? '#c0392b' : '#1e7d3c' }}>
                          합성 기여: {merged.segContrib[seg.id].dropped
                            ? '앞 조각과 동일해 전부 제거됨 (영향 없음)'
                            : '새로 추가 ' + merged.segContrib[seg.id].px + ' px' + (merged.segContrib[seg.id].removed ? ' (이음새에서 ' + merged.segContrib[seg.id].removed + 'px 제거)' : '')}
                        </div>
                      )}
                      {candPage[seg.id] && <div style={{ color: '#8e24aa', fontWeight: 700 }}>포함 후보: 합성 스트립에 없는 마디 {candPage[seg.id].missing}/{candPage[seg.id].total}개</div>}
                      {flowErr[seg.id] ? <span style={{ color: '#c0392b' }}>flow 추출 실패: {flowErr[seg.id]}</span>
                        : ((final && final.segJoin[seg.id]) || (include[seg.id] ? '' : '제외'))}
                      {final && pieceIdxOf[seg.id] > 0 && (() => {
                        const j = pieceIdxOf[seg.id], B = merged.pieces[j];
                        const mn = -(B.leftExtra ? B.leftExtra.width : 0), mx = Math.min(analysis.nativeW - 2, B.totalW - 1);
                        return (
                          <div>
                            {merged.joinsAuto[j].seamSuspect && <b style={{ color: '#c0392b' }}>이음새 의심 </b>}
                            <label style={{ fontSize: '11px' }}>겹침/중복 제거 폭
                              <input type="range" min={mn} max={mx} step="1" value={final.eff[j].trim} style={{ width: '180px' }}
                                onPointerDown={() => { lastGestureRef.current = 0; }}
                                onChange={e => coalesced({ ...edit, adj: { ...adj, [j]: { ...(adj[j] || {}), trim: parseInt(e.target.value) } } })} /> {final.eff[j].trim}px
                            </label>
                          </div>
                        );
                      })()}
                    </td>
                    <td>
                      {seg.kind === 'page' ? (
                        <div>
                          <canvas ref={el => { if (el) thumbRefs.current[seg.id] = el; }} style={{ maxWidth: '260px', border: '1px solid var(--border-strong)', display: 'block' }} />
                          <input type="range" min={seg.start} max={seg.end} step="0.05" value={repT[seg.id] != null ? repT[seg.id] : seg.start} style={{ width: '260px' }}
                            disabled={removeMode === 'median'} title={removeMode === 'median' ? '시간 중앙값 방식에서는 구간 전체의 중앙값을 쓰므로 대표 프레임을 고르지 않습니다' : ''}
                            onChange={e => changeRep(seg, parseFloat(e.target.value))} />
                          <span className="slider-label" style={{ margin: 0 }}> {(repT[seg.id] != null ? repT[seg.id] : seg.start).toFixed(2)}s</span>
                        </div>
                      ) : ''}
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
      )}
      {merged && final && (
        <div>
          <div className="slider-label">합쳐진 스트립 미리보기 — {final.synth.totalW}×{merged.H}px · 조각 {merged.pieces.length}개
            · page 조각의 시간은 구간 안 폭 비례 분배(추정), flow 조각은 x(t) 역변환</div>
          <div style={{ overflowX: 'auto', border: '1px solid var(--border-strong)', background: '#fff' }}>
            <div style={{ display: 'flex', width: 'max-content' }}>
              {final.synth.chunks.map((c, i) => <FlowChunkView key={i} chunk={c} scale={Math.min(1, 180 / merged.H)} />)}
            </div>
          </div>
          <div className="toolbar"><button className="icon-btn" onClick={exportDebug}>이음·시간 매핑 JSON 내보내기 (디버그)</button></div>
          {/* 마디 감지 · 묶기 · 빌더 전송은 연속 이동형 2단계(FlowStage2) 로직을 복사한 UniStage2 — 마디 더블클릭 편집·누락 경고 추가. 합쳐진 스트립(청크) + 스트립좌표→시각 트랙을 넘긴다 */}
          <UniStage2 result={final.synth} videoFile={videoFile} flowDefaults={uniDefaults}
            editCtx={{
              pieceRanges: final.ranges, onExtend, getPreview, onDeleteMeasure, onEditEnter, onSeamReset, canUndo: pastRef.current.length > 0, onUndo: undo, canRedo: futureRef.current.length > 0, onRedo: redo, msg: editMsg,
              highlight: hl && final && final.offsets[hl.j] != null ? { x0: final.offsets[hl.j] - hl.dTail, x1: final.offsets[hl.j] + hl.dTrim } : null,
              seams: final.seamInfo.map(sm => ({
                ...sm,
                tip: '잘린 구간 ' + sm.cut + ' px (겹침 ' + sm.overlap + ', 중복 ' + sm.dup + ')' + (sm.suspect ? ' · 이음새 의심(제안 ' + sm.suggest + 'px 미적용)' : '') + (sm.manual ? ' · 수동 조절됨(trim ' + sm.trim + 'px)' : '') + ' — 더블클릭하면 겹침/중복 제거를 0으로 되돌립니다',
              })),
            }} />
        </div>
      )}
    </div>
  );
}

// ================================================================================================
// 자동(신규) — 창 맞대기(모자이크) 엔진
// 영상의 모든 장면을 "긴 악보 띠를 들여다보는 창"으로 보고, 장면끼리 가로 이동량을 맞춰 하나의 띠로 붙인다.
// 페이지 전환·스크롤·연속 이동·점프 스크롤을 구분하지 않는다 — 구분 없이 한 번 재생으로 끝난다.
//  1) 이웃 장면(5fps)끼리 이동량 맞추기(-2%~35%, NCC ≥ 0.7) → 안정 구간(run)
//  2) 구간 사이: 앞 구간 마지막 장면 ↔ 뒤 구간 첫 장면 맞추기(-2%~95%, 오선 띠 + 전체 영역 NCC 평균).
//     NCC ≥ 0.65(공통 점프 폭 근처는 0.6) · 겹침 ≥ 8%면 겹쳐 붙이고, 아니면 뒤에 이어 붙인다(누락 의심 표시).
//  3) 띠의 64px 블록마다 그 블록을 덮는 장면들(최대 7장)의 픽셀 중앙값 → 재생바·스티커·잔상 제거
// ================================================================================================
const MOS_FPS = 5, MOS_REG_W = 480, MOS_OUT_W = 1280, MOS_RUN_NCC = 0.7, MOS_BLOCK = 64, MOS_MAX_COVER = 7;

// RGBA → 잉크(0/1): 밝은 배경은 어두운 글자(<150), 어두운 배경은 밝은 글자(>180). 색이 있는 픽셀(재생바·강조)은 제외
function mosInk(d, OW, y0, y1, dark) {
  const h = y1 - y0, ink = new Uint8Array(OW * h);
  for (let y = y0, p = 0; y < y1; y++) {
    let i = y * OW * 4;
    for (let x = 0; x < OW; x++, i += 4, p++) {
      const r = d[i], g = d[i + 1], b = d[i + 2];
      const mx = r > g ? (r > b ? r : b) : (g > b ? g : b), mn = r < g ? (r < b ? r : b) : (g < b ? g : b);
      if (mx - mn > 60) continue;
      const gr = 0.299 * r + 0.587 * g + 0.114 * b;
      if (dark ? gr > 180 : gr < 150) ink[p] = 1;
    }
  }
  return ink;
}
// 잉크 → 폭 W·높이 hh로 상자 축소, 행 평균 제거(오선 제거) → Int8(×127). frac = 잉크 비율
function mosDown(ink, OW, h, W, hh) {
  const sum = new Float32Array(W * hh), cnt = new Float32Array(W * hh);
  const xm = new Int32Array(OW);
  for (let x = 0; x < OW; x++) xm[x] = Math.min(W - 1, Math.floor(x * W / OW));
  let tot = 0;
  for (let y = 0; y < h; y++) {
    const by = Math.min(hh - 1, Math.floor(y * hh / h)) * W, r = y * OW;
    for (let x = 0; x < OW; x++) { const v = ink[r + x]; sum[by + xm[x]] += v; cnt[by + xm[x]] += 1; tot += v; }
  }
  const z = new Int8Array(W * hh);
  for (let y = 0; y < hh; y++) {
    let m = 0;
    const r = y * W;
    for (let x = 0; x < W; x++) { sum[r + x] = cnt[r + x] ? sum[r + x] / cnt[r + x] : 0; m += sum[r + x]; }
    m /= W;
    for (let x = 0; x < W; x++) z[r + x] = Math.round((sum[r + x] - m) * 127);
  }
  return { z, frac: tot / Math.max(1, OW * h) };
}
// 출력 해상도 잉크의 행 평균 제거(이동량 다듬기용)
function mosZeroMean(ink, OW, h) {
  const f = new Float32Array(OW * h);
  for (let y = 0; y < h; y++) {
    let m = 0;
    const r = y * OW;
    for (let x = 0; x < OW; x++) m += ink[r + x];
    m /= OW;
    for (let x = 0; x < OW; x++) f[r + x] = ink[r + x] - m;
  }
  return f;
}
// b(x) = a(x + s) 가정의 겹침 영역 NCC (s ≥ 0: 창이 오른쪽으로 s 이동)
function mosNcc(za, zb, W, h, s) {
  const n = W - Math.abs(s);
  if (n <= 0) return -1;
  let ab = 0, aa = 0, bb = 0;
  for (let y = 0; y < h; y++) {
    const r = y * W, ao = r + (s >= 0 ? s : 0), bo = r + (s >= 0 ? 0 : -s);
    for (let x = 0; x < n; x++) { const a = za[ao + x], b = zb[bo + x]; ab += a * b; aa += a * a; bb += b * b; }
  }
  if (aa < 1e-9 || bb < 1e-9) return -1;
  return ab / Math.sqrt(aa * bb);
}
// 열 프로파일 상관으로 이동량 후보 상위 k개(±1 포함)
function mosProfileCands(za, zb, W, h, smin, smax, k, out) {
  const pa = new Float32Array(W), pb = new Float32Array(W);
  for (let y = 0; y < h; y++) for (let x = 0; x < W; x++) { pa[x] += Math.abs(za[y * W + x]); pb[x] += Math.abs(zb[y * W + x]); }
  let ma = 0, mb = 0;
  for (let x = 0; x < W; x++) { ma += pa[x]; mb += pb[x]; }
  ma /= W; mb /= W;
  for (let x = 0; x < W; x++) { pa[x] -= ma; pb[x] -= mb; }
  const sc = [];
  for (let s = smin; s <= smax; s++) {
    const n = W - Math.abs(s);
    if (n < 16) { sc.push([-1, s]); continue; }
    let ab = 0, aa = 0, bb = 0;
    const ao = s >= 0 ? s : 0, bo = s >= 0 ? 0 : -s;
    for (let x = 0; x < n; x++) { const a = pa[ao + x], b = pb[bo + x]; ab += a * b; aa += a * a; bb += b * b; }
    const d = Math.sqrt(aa * bb);
    sc.push([d > 1e-9 ? ab / d : -1, s]);
  }
  sc.sort((p, q) => q[0] - p[0]);
  for (let i = 0; i < Math.min(k, sc.length); i++) for (const d of [-1, 0, 1]) out.add(sc[i][1] + d);
  return out;
}
// pred: 직전 이동량(같은 구간 안). 반복되는 마디 때문에 "한 마디 더 간" 위치도 거의 같은 점수가 나오므로,
// 1등과 0.04 이내인 후보 중 직전 이동량에 가장 가까운 것을 고른다 (스크롤 속도는 0.2초 사이에 거의 변하지 않는다)
function mosRegister(za, zb, W, h, smin, smax, pred) {
  const cands = new Set();
  for (let s = Math.max(smin, -3); s <= Math.min(smax, 3); s++) cands.add(s);
  if (pred != null) for (let s = Math.round(pred) - 4; s <= Math.round(pred) + 4; s++) cands.add(s);
  mosProfileCands(za, zb, W, h, smin, smax, 6, cands);
  let best = [-2, 0];
  const all = [];
  for (const s of [...cands].sort((a, b) => a - b)) {
    if (s < smin || s > smax || W - Math.abs(s) < 16) continue;
    const v = mosNcc(za, zb, W, h, s);
    all.push([v, s]);
    if (v > best[0] + 1e-6) best = [v, s];
  }
  if (pred != null) {
    let pick = best;
    for (const c of all) if (c[0] >= best[0] - 0.04 && Math.abs(c[1] - pred) < Math.abs(pick[1] - pred) - 2) pick = c;
    return pick;
  }
  return best;
}
// 오선 띠 NCC와 전체 영역(코드·마디 번호·가사 포함) NCC의 평균 — 반복 마디와 헷갈리지 않게
function mosRegister2(A, B, W, smin, smax) {
  const cands = new Set();
  mosProfileCands(A.low, B.low, W, A.hl, smin, smax, 6, cands);
  mosProfileCands(A.full, B.full, W, A.hf, smin, smax, 6, cands);
  if (A.ext) mosProfileCands(A.ext, B.ext, W, A.hf, smin, smax, 6, cands);
  let best = [-2, 0];
  for (const s of [...cands].sort((a, b) => a - b)) {
    if (s < smin || s > smax || W - Math.abs(s) < 16) continue;
    let v = 0.5 * (mosNcc(A.low, B.low, W, A.hl, s) + mosNcc(A.full, B.full, W, A.hf, s)), e = -1;
    // 띠 바깥 글자가 겹침 영역에 있으면 같은 비중으로 — 반복 마디에 한 마디 어긋나 붙는 것을 막는다
    if (A.ext) { e = mosNcc(A.ext, B.ext, W, A.hf, s); if (e > -1) v = (2 * v + e) / 3; }
    if (v > best[0] + 1e-6) best = [v, s, e];
  }
  return best;
}
// 출력 해상도에서 이동량 다듬기 (저해상도 이동량 × 배율의 누적 오차가 띠를 번지게 하는 것을 막는다)
function mosRefineV(fa, fb, OW, h, sc, r) {
  let best = [-2, sc];
  for (let s = sc - r; s <= sc + r; s++) {
    if (OW - Math.abs(s) < 16) continue;
    const v = mosNcc(fa, fb, OW, h, s);
    if (v > best[0] + 1e-6) best = [v, s];
  }
  return best; // [NCC, 이동량]
}
function mosRefine(fa, fb, OW, h, sc, r) { return mosRefineV(fa, fb, OW, h, sc, r)[1]; }
function mosMedianSmall(a, n) { // n ≤ 7, 삽입 정렬
  for (let i = 1; i < n; i++) { const v = a[i]; let j = i - 1; while (j >= 0 && a[j] > v) { a[j + 1] = a[j]; j--; } a[j + 1] = v; }
  return n & 1 ? a[n >> 1] : ((a[(n >> 1) - 1] + a[n >> 1]) >> 1);
}
// 구간 하나의 블록 bi를 덮는 장면들의 픽셀 중앙값 → Uint8Array(OH×B)
function mosRenderBlock(keys, bi, OW, OH, bg) {
  const B = MOS_BLOCK, bx = bi * B;
  let cov = keys.filter(k => k.x <= bx && k.x + OW >= bx + B);
  if (!cov.length) cov = keys.filter(k => k.x < bx + B && k.x + OW > bx);
  if (!cov.length) return null;
  if (cov.length > MOS_MAX_COVER) cov = Array.from({ length: MOS_MAX_COVER }, (_, i) => cov[Math.round(i * (cov.length - 1) / (MOS_MAX_COVER - 1))]);
  const out = new Uint8Array(OH * B), vals = new Int32Array(MOS_MAX_COVER);
  for (let xx = 0; xx < B; xx++) {
    const gx = bx + xx;
    for (let y = 0; y < OH; y++) {
      let n = 0;
      for (const k of cov) { const lx = gx - k.x; if (lx >= 0 && lx < OW) vals[n++] = k.gray[y * OW + lx]; }
      out[y * B + xx] = n ? mosMedianSmall(vals, n) : bg;
    }
  }
  return out;
}

// 화면에 고정된 배경 추정: 서로 다른 구간의 장면들(악보 내용은 다름)의 픽셀 중앙값. 밝은 바탕 기준으로 돌려 반환.
// 사진·그림 배경이 있을 때(오선 줄이 아닌 회색 영역이 4% 이상)만 쓴다 — 흰 바탕 영상은 null (지울 것이 없다)
function mosScreenBackground(samples, OW, OH, dark) {
  if (samples.length < 5) return null;
  const n = samples.length, bgv = new Uint8Array(OW * OH), tmp = new Uint8Array(n);
  for (let p = 0; p < bgv.length; p++) {
    for (let i = 0; i < n; i++) tmp[i] = samples[i][p];
    tmp.sort();
    bgv[p] = dark ? 255 - tmp[n >> 1] : tmp[n >> 1];
  }
  // 오선처럼 폭 전체에 걸친 어두운 행은 보호 (모든 장면에 같은 자리에 있는 진짜 악보 요소)
  const lineRow = new Uint8Array(OH);
  let busy = 0, cnt = 0;
  for (let y = 0; y < OH; y++) {
    let d = 0;
    for (let x = 0; x < OW; x++) if (bgv[y * OW + x] < 150) d++;
    if (d > OW * 0.5) { lineRow[y] = 1; continue; }
    for (let x = 0; x < OW; x++) { const v = bgv[y * OW + x]; if (v > 40 && v < 215) busy++; cnt++; }
  }
  const busyFrac = cnt ? busy / cnt : 0;
  if (busyFrac < 0.04) return null;
  return { bg: bgv, lineRow, busyFrac };
}

// 그림 배경 지우기(검은 탑햇): 닫힘(최대→최소 필터)과 원본의 차이 = 커널보다 가는 어두운 구조(오선·숫자·마디선·글자)만 남는다.
// 사진의 넓은 어두운 영역(머리카락·기타 그림자)은 커널보다 커서 사라진다. buf는 밝은 바탕 기준 그레이.
function mosTopHatClean(buf, w, h, k) {
  const r = k >> 1, tmp = new Uint8Array(w * h), clo = new Uint8Array(w * h);
  const pass = (src, dst, horiz, useMax) => {
    const n = horiz ? w : h, m = horiz ? h : w;
    for (let j = 0; j < m; j++) {
      for (let i = 0; i < n; i++) {
        let v = useMax ? 0 : 255;
        const a = Math.max(0, i - r), b = Math.min(n - 1, i + r);
        for (let q = a; q <= b; q++) {
          const x = horiz ? src[j * w + q] : src[q * w + j];
          if (useMax ? x > v : x < v) v = x;
        }
        if (horiz) dst[j * w + i] = v; else dst[i * w + j] = v;
      }
    }
  };
  pass(buf, tmp, true, true); pass(tmp, clo, false, true);   // 팽창(밝은 쪽 최대)
  pass(clo, tmp, true, false); pass(tmp, clo, false, false); // 침식 → 닫힘
  for (let p = 0; p < buf.length; p++) {
    const ink = clo[p] - buf[p];
    buf[p] = 255 - Math.min(255, Math.max(0, (ink - 25) * 2.2)) | 0;
  }
}

// 한 번 재생하면서 장면을 모으고 구간(run)을 만든다. 반환: 구간 목록 + 렌더된 블록
let mosRunSeq = 0;
// strict: 장면 나누기(사용자가 "이 장면 나누기")용 — 정지 장면에서 조금만 달라져도 새 장면으로 본다
// diag: 진단 기록 배열 — 장면마다 [시각, 저해상도 일치, 이동, 고해상도 일치, 코드줄 일치, 판정] (판정: J 이어짐, N 새 장면, B 빈 화면)
async function mosCollect(video, roi, { rate, startT, endT, abortRef, onProgress, motion, strict, forceDark, diag, stats, onNotice }) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const OW = Math.max(64, Math.min(MOS_OUT_W, Math.round(rw)));
  const OH = Math.max(16, Math.round(rh * OW / rw));
  const core = roi.core || { y0: roi.y0, y1: roi.y1 };
  const cy0 = Math.max(0, Math.min(OH - 8, Math.round((core.y0 * vh - ry0) * OH / rh)));
  const cy1 = Math.max(cy0 + 8, Math.min(OH, Math.round((core.y1 * vh - ry0) * OH / rh)));
  const hc = cy1 - cy0;
  const W = MOS_REG_W, k = W / OW;
  const hl = Math.max(8, Math.round(hc * k)), hf = Math.max(8, Math.round(OH * k));
  const kk = OW / W, rr = Math.ceil(kk) + 1;
  const cv = document.createElement('canvas'); cv.width = OW; cv.height = OH;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';
  // 배경 밝기: 오선 띠의 중앙값 (구간 3곳)
  const bandVals = [];
  for (const f of [0.3, 0.5, 0.7]) {
    await seekSafe(video, startT + (endT - startT) * f);
    ctx.drawImage(video, rx0, ry0, rw, rh, 0, 0, OW, OH);
    const d = ctx.getImageData(0, cy0, OW, hc).data;
    for (let i = 0; i < d.length; i += 4 * 7) bandVals.push(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);
  }
  bandVals.sort((a, b) => a - b);
  const dark = forceDark != null ? forceDark : bandVals.length ? bandVals[bandVals.length >> 1] < 128 : false;
  const bg = dark ? 0 : 255;
  const D3 = x => Math.round(x * 1000) / 1000;

  const runs = [];
  let cur = null, prev = null, nFrames = 0, nBlank = 0, bgSamples = [];
  const KEY_MOVE = Math.round(OW / 6);
  const flushRun = (final) => {
    const r = cur;
    if (!r) return;
    const keys = r.keys;
    if (final) {
      if (r.pend) { keys.push(r.pend); r.pend = null; }
      if (r.frames.length < 2) { cur = null; return; }
      // 멈춰 있는 장면: 앞뒤 0.6초(페이지가 바뀌며 앞 페이지와 겹쳐 보이는 순간)는 그리기에서 뺀다 — 코드 이름이 흐리게 겹쳐 나왔다
      {
        const ft0 = r.frames[0].t, ft1 = r.frames[r.frames.length - 1].t;
        const xsK = keys.map(q => q.x);
        if (r.nextBlock == null && Math.max(...xsK) - Math.min(...xsK) <= 4 && ft1 - ft0 > 2) {
          const mid = keys.filter(q => q.t >= ft0 + 0.6 && q.t <= ft1 - 0.6);
          if (mid.length >= 2) { keys.length = 0; keys.push(...mid); }
        }
      }
      let lo = Infinity, hi = -Infinity;
      for (const f of r.frames) { lo = Math.min(lo, f.x); hi = Math.max(hi, f.x + OW); }
      const b0 = r.nextBlock != null ? r.nextBlock : Math.floor(lo / MOS_BLOCK), b1 = Math.ceil(hi / MOS_BLOCK);
      for (let bi = b0; bi < b1; bi++) { const b = mosRenderBlock(keys, bi, OW, OH, bg); if (b) r.blocks.set(bi, b); }
      r.lo = lo; r.hi = hi;
      const xs = r.frames.map(f => f.x).sort((a, b) => a - b);
      r.xr = xs[xs.length >> 1];
      r.static = xs[xs.length - 1] - xs[0] <= 4;
      // 화면에 고정된 배경(사진·영상 배경) 추정용 표본: 구간마다 가운데 장면 하나
      bgSamples.push(keys[keys.length >> 1].gray);
      if (bgSamples.length > 40) bgSamples = bgSamples.filter((_, i) => i % 2 === 0);
      r.keys = null;
      const slim = q => ({ low: q.low, full: q.full, ext: q.ext, zf: q.zf });
      r.first = slim(r.first); r.last = slim(r.last);
      runs.push(r);
      cur = null;
      return;
    }
    // 긴 연속 이동 구간: 이미 지나간 블록을 미리 렌더하고 장면을 버려 메모리를 아낀다
    const frontier = r.frames[r.frames.length - 1].x - Math.ceil(0.05 * OW);
    if (r.nextBlock == null) r.nextBlock = Math.floor(Math.min(...keys.map(q => q.x)) / MOS_BLOCK);
    const upto = Math.floor(frontier / MOS_BLOCK);
    for (let bi = r.nextBlock; bi < upto; bi++) { const b = mosRenderBlock(keys, bi, OW, OH, bg); if (b) r.blocks.set(bi, b); }
    if (upto > r.nextBlock) r.nextBlock = upto;
    r.keys = keys.filter(q => q.x + OW > r.nextBlock * MOS_BLOCK);
  };
  const onFrame = t => {
    ctx.drawImage(video, rx0, ry0, rw, rh, 0, 0, OW, OH);
    const d = ctx.getImageData(0, 0, OW, OH).data;
    nFrames++;
    const inkC = mosInk(d, OW, cy0, cy1, dark);
    const lowR = mosDown(inkC, OW, hc, W, hl);
    if (lowR.frac < 0.001) { nBlank++; flushRun(true); prev = null; if (diag) diag.push([D3(t), null, null, null, null, 'B']); return; }
    const full = mosDown(mosInk(d, OW, 0, OH, dark), OW, OH, W, hf).z;
    // 오선 띠 바깥(코드 이름·마디 번호·가사)만 남긴 지도 — 반복되는 마디 패턴과 달리 마디마다 다르다
    const ext = full.slice(), ey0 = Math.floor(cy0 * hf / OH), ey1 = Math.ceil(cy1 * hf / OH);
    ext.fill(0, ey0 * W, Math.min(hf, ey1) * W);
    const fr = { t, low: lowR.z, full, ext, zf: mosZeroMean(inkC, OW, hc) };
    const gray = new Uint8Array(OW * OH);
    for (let i = 0, p = 0; p < gray.length; i += 4, p++) gray[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
    let joined = false, dv = null, ds = null, dref = null, de = null;
    if (cur && prev) {
      const dt = Math.max(0.05, t - prev.t), gapK = Math.max(1, dt / 0.2);
      const pred = cur.vel != null ? cur.vel * dt : null; // 저해상도 px
      const [v, s] = mosRegister(prev.low, fr.low, W, hl, -Math.round(0.02 * W), Math.round(0.35 * W), pred);
      // 갑자기 크게 넘어간 장면은 같은 구간으로 잇지 않는다 — 반복 마디 때문에 "한 마디 덜 간" 위치가 맞는 것처럼 보이기 쉬워서,
      // 큰 점프는 구간 사이 맞대기(코드 이름·마디 번호까지 보는 비교 + 공통 점프 폭)에 맡긴다
      const jumpLim = 0.12 * W * gapK;
      // 사용자가 "페이지 전환형"이라고 답했으면 장면 안에서 악보가 움직이지 않는다 — 3% 넘게 움직이면 새 장면으로 본다
      const sudden = motion === 'page' ? Math.abs(s) > 0.03 * W
        : pred != null ? Math.abs(s - pred) > jumpLim : Math.abs(s) > Math.min(0.35 * W, 0.2 * W * gapK);
      // 같은 장면인지 오선 띠만으로 판단하면, 리듬(스트로크 표시)이 같은 다른 페이지가 "같은 장면"으로 묶여 겹쳐 그려진다.
      // 띠 바깥(코드 이름·가사)도 같은 이동량에서 맞아야 같은 장면으로 본다
      let same = v >= MOS_RUN_NCC && !sudden;
      dv = v; ds = s;
      if (same) {
        const e = mosNcc(prev.ext, fr.ext, W, hf, s);
        de = e;
        // 정지 장면만 — 움직이는 영상은 제목·로고처럼 화면에 고정된 글자가 띠 바깥에 있어 값이 원래 낮다
        // (진단: Misty 끝부분처럼 천천히 흐르는 악보는 0.2초에 저해상도 5~9px만 움직인다 — 예전 기준(2% = 9.6px)으로는 '정지'로 보고
        //  강조색이 바뀐 것만으로 끊어 같은 마디가 여러 번 이어 붙었다 → 정지 판단은 2px 이하만)
        if (Math.abs(s) <= 2 && e > -1 && e < (strict ? 0.8 : 0.5)) same = false;
      }
      // 출력 해상도(숫자 하나하나가 보이는 해상도)에서도 맞아야 같은 장면. 저해상도에선 리듬 기둥·오선이 같은 다른 페이지가 0.9 넘게 나온다.
      // 실측(소수빈 영상): 같은 페이지 0.90~1.0, 페이지가 바뀐 순간 0.73~0.74
      let ref = null;
      if (same) {
        ref = mosRefineV(prev.zf, fr.zf, OW, hc, Math.round(s * kk), rr);
        const hist = cur.vr || [];
        const medv = hist.length >= 3 ? hist.slice().sort((a, b) => a - b)[hist.length >> 1] : 1;
        // 정지 장면(이동 2% 미만)에서만 적용 — 움직이는 장면은 흔들림·번짐으로 원래 값이 낮다
        dref = ref[0];
        if (Math.abs(s) <= 2 && Math.abs(ref[1]) <= Math.ceil(2 * kk) && (strict ? ref[0] < Math.max(0.88, medv - 0.04) : ref[0] < 0.82 && ref[0] < medv - 0.1)) same = false;
      }
      if (same) {
        const so = ref[1];
        if (Math.abs(s) <= 2 && Math.abs(so) <= Math.ceil(2 * kk)) { (cur.vr = cur.vr || []).push(ref[0]); if (cur.vr.length > 25) cur.vr.shift(); }
        let x = cur.frames[cur.frames.length - 1].x + so;
        // 위치 누적 오차 막기: 바로 앞 장면과의 이동량(정수 px)만 계속 더하면 반 픽셀씩 어긋남이 쌓여, 같은 곳을 여러 장면의 중앙값으로
        // 그릴 때 숫자가 두 겹으로 번진다 → 가장 최근 기준 장면(key)에 직접 맞춰 위치를 다시 잡는다
        const ak = cur.keys[cur.keys.length - 1];
        if (ak && ak.zf && Math.abs(x - ak.x) < OW * 0.7) {
          const ra = mosRefineV(ak.zf, fr.zf, OW, hc, Math.round(x - ak.x), 2);
          if (ra[0] >= 0.6) x = ak.x + ra[1];
        }
        cur.frames.push({ t, x });
        cur.vel = (so / kk) / dt;
        // 구간 첫 장면은 장면이 바뀌는 순간(앞 화면과 섞인 프레임)인 경우가 많다 — 바로 다음 장면이 같은 자리면 그것으로 바꾼다
        // (Neo Soul 영상: 줄이 바뀔 때 코드 이름이 두 겹으로 겹쳐 그려짐)
        if (cur.frames.length === 2 && cur.keys.length === 1 && Math.abs(x - cur.keys[0].x) <= 4) cur.keys[0] = { x, t, gray, zf: fr.zf };
        const near = cur.keys.filter(q => Math.abs(q.x - x) < KEY_MOVE);
        const lastKey = cur.keys[cur.keys.length - 1];
        if (!lastKey || Math.abs(x - lastKey.x) >= KEY_MOVE || (t - lastKey.t >= 1.0 && near.length < MOS_MAX_COVER)) { cur.keys.push({ x, t, gray, zf: fr.zf }); cur.pend = null; }
        else cur.pend = { x, t, gray, zf: fr.zf };
        cur.last = fr;
        joined = true;
        if (cur.keys.length > 24) flushRun(false);
      }
    }
    if (!joined) {
      flushRun(true);
      cur = { id: ++mosRunSeq, frames: [{ t, x: 0 }], keys: [{ x: 0, t, gray, zf: fr.zf }], pend: null, blocks: new Map(), first: fr, last: fr, nextBlock: null, vel: null };
    }
    if (diag) diag.push([D3(t), dv == null ? null : D3(dv), ds, dref == null ? null : D3(dref), de == null ? null : D3(de), joined ? 'J' : 'N']);
    prev = fr;
  };
  await flowPlayPass(video, {
    startT, endT, rate, maxRate: rate, minGap: 1 / MOS_FPS - 0.01, onFrame,
    onProgress: f => onProgress && onProgress(f), abortRef, stats,
    onRestart: () => { runs.length = 0; cur = null; prev = null; nFrames = 0; nBlank = 0; bgSamples = []; if (diag) diag.length = 0; },
    onNotice,
  });
  flushRun(true);
  return { runs, OW, OH, hc, hl, hf, W, kk, rr, dark, bg, nFrames, nBlank, screenBg: mosScreenBackground(bgSamples, OW, OH, dark) };
}

// 구간 사이 맞대기 → 띠 위 배치
// edits(사용자 손질): { excluded: {runId: true}, mode: {runId: 'append' | 'overlap'} } — mode는 "앞 장면과 어떻게 붙일지"
function mosPlace(col, motion, edits) {
  const { OW, hc, hl, hf, W, kk, rr } = col;
  const ex = (edits && edits.excluded) || {}, md = (edits && edits.mode) || {};
  const runs = col.runs.filter(r => !ex[r.id]);
  // 겹침 8% 미만은 찾지 않는다 — 좁은 띠끼리는 우연히 NCC가 높게 나와 진짜 겹침(30~60%)을 이기고 "이어 붙임 + 중복"이 된다
  const smin = -Math.round(0.02 * W), smax = Math.round(0.92 * W);
  const A = r => ({ low: r.last.low, full: r.last.full, ext: r.last.ext, hl, hf }), Bf = r => ({ low: r.first.low, full: r.first.full, ext: r.first.ext, hl, hf });
  const cand = [];
  for (let i = 1; i < runs.length; i++) cand.push(mosRegister2(A(runs[i - 1]), Bf(runs[i]), W, smin, smax));
  // 점프 스크롤: 확실한 맞대기(NCC ≥ 0.85, 겹침 ≥ 8%)가 3곳 이상이면 그 이동 폭의 중앙값 근처(±3%)에서 다시 맞춰 본다
  const conf = cand.filter(([v, s]) => v >= 0.85 && (W - s) / W >= 0.08 && s > 0.05 * W).map(c => c[1]).sort((a, b) => a - b);
  const D = conf.length >= 3 ? conf[(conf.length - 1) >> 1] : null;
  const place = [], joins = [];
  let end = 0;
  runs.forEach((r, ri) => {
    let off;
    if (ri === 0) off = 0;
    else {
      const p = runs[ri - 1];
      let [v, s, e] = cand[ri - 1];
      if (D != null && Math.abs(s - D) > 0.03 * W) {
        const [vD, sD, eD] = mosRegister2(A(p), Bf(r), W, Math.max(smin, D - Math.round(0.03 * W)), Math.min(smax, D + Math.round(0.03 * W)));
        if (vD >= 0.6 && vD >= v - 0.08) { v = vD; s = sD; e = eD; }
      }
      const overlap = (W - s) / W;
      const thr = D != null && Math.abs(s - D) <= 0.03 * W ? 0.6 : 0.65;
      // 겹쳐 붙이려면 코드 이름·가사도 맞아야 한다(있을 때). 거의 같은 자리(겹침 85%+)는 "같은 페이지가 다시 나온 것"이므로 아주 높은 일치만 인정
      // — 반복 페이지가 많은 페이지 전환 영상에서 다른 페이지가 위에 겹쳐 그려지던 문제
      const extOk = e <= -1 || e >= 0.5;
      const strongEnough = overlap < 0.85 || v >= 0.88;
      // 흐르던 악보가 잠깐 끊긴 경우(강조색 변화·흔들림): 앞 구간의 속도로 예상한 자리와 맞으면 겹친다.
      // 예전엔 겹침 85%+에 NCC 0.88을 요구해 Misty 끝부분(겹침 98%, NCC 0.84~0.87)이 계속 이어 붙어 같은 마디가 반복됐다
      const gapT0 = r.frames[0].t - p.frames[p.frames.length - 1].t;
      const pMoving = p.vel != null && Math.abs(p.vel) * 0.2 >= 2 && (p.hi - p.lo - OW) >= 0.05 * OW;
      const contPred = pMoving ? p.vel * gapT0 : null;
      const continues = motion !== 'page' && contPred != null && gapT0 <= 0.7 && v >= 0.7 && extOk
        && Math.abs(s - contPred) <= Math.max(4, 0.04 * W);
      const autoOverlap = continues || (v >= thr && overlap >= 0.08 && extOk && strongEnough && (motion !== 'page' || (overlap >= 0.95 && v >= 0.9)));
      const want = md[r.id] === 'overlap' ? true : md[r.id] === 'append' ? false : autoOverlap;
      if (want) {
        const so = mosRefine(p.last.zf, r.first.zf, OW, hc, Math.round(s * kk), rr);
        off = place[ri - 1] + p.frames[p.frames.length - 1].x + so;
        joins.push({ type: 'overlap', ncc: v, overlap, x: off, runId: r.id, manual: !!md[r.id], auto: autoOverlap ? 'overlap' : 'append' });
      } else {
        off = end;
        // 앞뒤 장면이 전혀 다르면(0.2초 사이에 바뀜) 페이지 전환 — 이어 붙이는 게 정상.
        // 점프 스크롤(공통 폭이 있는 영상)이거나, 움직이는 구간 사이에 장면이 0.6초 넘게 비면 누락 의심
        const moving = q => q.hi - q.lo - OW >= OW * 0.25;
        const gapT = r.frames[0].t - p.frames[p.frames.length - 1].t;
        joins.push({ type: 'append', ncc: v, x: off, runId: r.id, manual: !!md[r.id], auto: autoOverlap ? 'overlap' : 'append',
          suspect: !md[r.id] && (D != null || ((moving(p) || moving(r)) && gapT > 0.6)) });
      }
    }
    place.push(off);
    end = Math.max(end, off + r.hi);
  });
  const lo = Math.min(0, ...runs.map((r, i) => place[i] + r.lo));
  return { runs, place: place.map(p => p - lo), joins: joins.map(j => ({ ...j, x: j.x - lo })), total: Math.max(1, Math.ceil(end - lo)), D };
}

// 띠 그리기 → 청크(≤6000px) + 스트립 좌표↔시각 트랙
// 멈춰 있는 장면(페이지)을 원본 해상도로 다시 잡는다 — 페이지 전환형과 같은 방식(정답 악보 7곡으로 검증).
// 분석(맞대기)은 1280px로 하지만, 그대로 그리면 4K 영상에서 숫자·코드 이름이 작아지고 흐려졌다.
// 장면마다 가운데 두 시점(40%·60%, 페이지가 바뀌는 앞뒤 0.6초 제외)을 잡아 픽셀 중앙값(2장이면 평균).
async function mosCaptureNative(video, roi, col, runs, onProg) {
  const { rw, rh, rx0, ry0 } = roiRectPx(video, roi);
  if (!col.native) {
    const NW = Math.min(2560, Math.round(rw));
    if (NW < col.OW * 1.15) return false; // 원본이 분석 해상도와 비슷하면 다시 잡을 이유가 없다
    const sc = NW / col.OW;
    col.native = { sc, NW, NH: Math.round(col.OH * sc) };
  }
  const { NW, NH } = col.native;
  const cv = document.createElement('canvas'); cv.width = NW; cv.height = NH;
  const g = cv.getContext('2d', { willReadFrequently: true });
  g.imageSmoothingQuality = 'high';
  const todo = runs.filter(r => r.static && !r.native);
  for (let i = 0; i < todo.length; i++) {
    const r = todo[i], t0 = r.frames[0].t, t1 = r.frames[r.frames.length - 1].t;
    const a = t1 - t0 > 2 ? t0 + 0.6 : t0, b = t1 - t0 > 2 ? t1 - 0.6 : t1;
    const grays = [];
    for (const f of [0.4, 0.6]) {
      await seekTo(video, a + (b - a) * f);
      g.drawImage(video, rx0, ry0, rw, rh, 0, 0, NW, NH);
      const d = g.getImageData(0, 0, NW, NH).data, gr = new Uint8Array(NW * NH);
      for (let p = 0, k = 0; p < gr.length; p++, k += 4) gr[p] = (0.299 * d[k] + 0.587 * d[k + 1] + 0.114 * d[k + 2]) | 0;
      grays.push(gr);
    }
    const out = grays[0];
    if (grays.length > 1) for (let p = 0; p < out.length; p++) out[p] = (out[p] + grays[1][p]) >> 1;
    r.native = out;
    if (onProg) onProg(i + 1, todo.length);
  }
  return true;
}

// 띠 그리기 → 청크(≤6000px) + 스트립 좌표↔시각 트랙.
// col.native가 있으면 원본 해상도 배율(sc)로 그린다: 다시 잡은 장면은 그 그림을, 나머지(움직이는 장면)는 블록을 확대해서.
function mosRender(col, pl, preproc) {
  const { OW, OH, dark } = col;
  const runs = pl.runs || col.runs;
  const B = MOS_BLOCK, sc = col.native ? col.native.sc : 1;
  const H = col.native ? col.native.NH : OH;
  const total = Math.max(1, Math.ceil(pl.total * sc));
  const lightOf = v => (dark ? 255 - v : v);
  // 장면별 그림(밝은 바탕 기준)을 한 번만 만든다
  const runCanvas = r => {
    if (r._cv && r._cvSc === sc) return r._cv;
    let c;
    if (r.native && col.native) {
      const { NW, NH } = col.native;
      c = document.createElement('canvas'); c.width = NW; c.height = NH;
      const im = c.getContext('2d').createImageData(NW, NH);
      for (let p = 0, i = 0; p < r.native.length; p++, i += 4) { const v = lightOf(r.native[p]); im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255; }
      c.getContext('2d').putImageData(im, 0, 0);
      c._x0 = r.xr;
    } else {
      let b0 = Infinity, b1 = -Infinity;
      for (const bi of r.blocks.keys()) { b0 = Math.min(b0, bi); b1 = Math.max(b1, bi + 1); }
      if (!isFinite(b0)) return null;
      const w = (b1 - b0) * B;
      c = document.createElement('canvas'); c.width = w; c.height = OH;
      const im = c.getContext('2d').createImageData(w, OH);
      im.data.fill(255);
      for (const [bi, blk] of r.blocks) {
        const x0 = (bi - b0) * B;
        for (let y = 0; y < OH; y++) for (let xx = 0; xx < B; xx++) {
          const v = lightOf(blk[y * B + xx]), i = (y * w + x0 + xx) * 4;
          im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
        }
      }
      c.getContext('2d').putImageData(im, 0, 0);
      c._x0 = b0 * B;
    }
    r._cv = c; r._cvSc = sc;
    return c;
  };
  // 구간마다 세로 위치 맞추기: 영상이 줄마다 악보를 몇 px씩 위아래로 다르게 놓는 경우(Neo Soul: ±5px)
  // 띠의 오선이 세 겹으로 어긋나 마디선 검출이 통째로 실패했다 → 행별 잉크 분포가 첫 구간과 가장 잘 맞는 높이로 옮긴다
  const rowProf = rc => {
    const w = rc.width, h = rc.height, d = rc.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data;
    const pr = new Float32Array(h);
    const step = Math.max(1, Math.floor(w / 1500));
    for (let y = 0; y < h; y++) { let c = 0, n = 0; for (let x = 0; x < w; x += step) { if (d[(y * w + x) * 4] < 128) c++; n++; } pr[y] = c / n; }
    let m = 0; for (const v of pr) m += v; m /= h;
    for (let y = 0; y < h; y++) pr[y] -= m;
    return pr;
  };
  const dys = runs.map(() => 0);
  {
    let ref = null, refH = 0;
    runs.forEach((r, ri) => {
      const rc = runCanvas(r);
      if (!rc) return;
      const pr = rowProf(rc);
      if (!ref) { ref = pr; refH = rc.height; return; }
      const k = rc.height / refH, lim = Math.round(rc.height * 0.08);
      let best = -Infinity, bd = 0;
      for (let dy = -lim; dy <= lim; dy++) {
        let sum = 0;
        for (let y = 0; y < rc.height; y++) { const yr = Math.round((y + dy) / k); if (yr >= 0 && yr < refH) sum += pr[y] * ref[yr]; }
        if (sum > best) { best = sum; bd = dy; }
      }
      dys[ri] = bd * (H / rc.height);
    });
  }
  const CH = 6000, chunks = [];
  for (let c0 = 0; c0 < total; c0 += CH) {
    const cw = Math.min(CH, total - c0);
    const c = document.createElement('canvas'); c.width = cw; c.height = H;
    const g = c.getContext('2d');
    g.fillStyle = '#fff'; g.fillRect(0, 0, cw, H);
    g.imageSmoothingQuality = 'high';
    runs.forEach((r, ri) => {
      const rc = runCanvas(r);
      if (!rc) return;
      const isNative = !!(r.native && col.native);
      const gx = Math.round((pl.place[ri] + rc._x0) * sc) - c0;
      const gw = isNative ? rc.width : Math.round(rc.width * sc);
      if (gx + gw <= 0 || gx >= cw) return;
      g.drawImage(rc, gx, Math.round(dys[ri]), gw, H);
    });
    // 흑백 처리는 정답 악보 7곡으로 검증된 페이지 전환형과 같은 방식: 임계값 + 그림 배경 지우기(얼룩이 있을 때만) + 잡티 제거.
    // 예전 방식(화면 배경 빼기·오선 복원·탑햇 전체 적용)은 숫자를 배경으로 지우거나, 오선을 굵게 칠해 줄 위 숫자를 덮었다
    if (preproc) {
      const P = VIDEO_DEFAULTS_INIT, im2 = g.getImageData(0, 0, cw, H);
      // 부드러운 경계(softness)는 0 — 원본 해상도의 가는 오선·마디선이 연회색으로 남아 마디선 검출(밝기 140 미만만 선으로 봄)이 실패했다
      applyThreshold(im2, P.threshold, false, 0);
      cleanPictureBackground(im2, cw, H);
      if (P.despeckle) despeckleBinary(im2, cw, H, P.despeckleSize);
      g.putImageData(im2, 0, 0);
    }
    chunks.push(c);
  }
  // 시간: 정지 구간은 창 전체를 구간 시간에 비례 분배, 움직이는 구간은 창 가운데가 지나가는 시각
  const pts = [];
  runs.forEach((r, ri) => {
    const base = pl.place[ri], f = r.frames, t0 = f[0].t, t1 = f[f.length - 1].t;
    pts.push([(base + r.lo) * sc, t0]);
    if (r.hi - r.lo - OW >= OW * 0.25) for (const q of f) pts.push([(base + q.x + OW / 2) * sc, q.t]);
    pts.push([(base + r.hi) * sc, t1]);
  });
  pts.sort((a, b) => a[0] - b[0]);
  const T = [], S = [];
  for (const [s, t] of pts) {
    const k = T.length - 1;
    if (k >= 0 && (t < T[k] || s <= S[k])) { if (t > T[k]) T[k] = t; continue; }
    T.push(t); S.push(s);
  }
  if (!T.length) { T.push(0); S.push(0); }
  const track = { t: T, X: S, k0: 0, k1: T.length - 1, totalW: total, nativeW: Math.round(OW * sc), barCols: [0, 0], staticRanges: [] };
  return { chunks, totalW: total, H, stats: {}, tFirst: T[0], track, scale: sc };
}

// 장면 하나의 미리보기(가로로 긴 작은 그림) — 장면 목록에서 손으로 고칠 때 쓴다
function mosRunThumb(col, r, h) {
  const B = MOS_BLOCK, OH = col.OH, sc = h / OH;
  const b0 = Math.floor(r.lo / B), b1 = Math.ceil(r.hi / B), w = (b1 - b0) * B;
  const c = document.createElement('canvas'); c.width = w; c.height = OH;
  const g = c.getContext('2d'), im = g.createImageData(w, OH);
  im.data.fill(255);
  for (const [bi, blk] of r.blocks) {
    const x0 = (bi - b0) * B;
    if (x0 < 0 || x0 >= w) continue;
    for (let y = 0; y < OH; y++) for (let xx = 0; xx < B; xx++) {
      let v = blk[y * B + xx]; if (col.dark) v = 255 - v;
      const i = (y * w + x0 + xx) * 4; im.data[i] = im.data[i + 1] = im.data[i + 2] = v;
    }
  }
  g.putImageData(im, 0, 0);
  const o = document.createElement('canvas'); o.width = Math.max(1, Math.round(w * sc)); o.height = Math.round(h);
  const og = o.getContext('2d'); og.imageSmoothingQuality = 'high'; og.drawImage(c, 0, 0, o.width, o.height);
  return o.toDataURL('image/png');
}

// 마디 삭제: 스트립 [a, b) 열을 잘라내고 트랙도 당긴다
function mosCutStrip(result, a, b) {
  a = Math.max(0, Math.round(a)); b = Math.min(result.totalW, Math.round(b));
  if (b <= a) return result;
  const builder = flowChunkBuilder(result.H, 6000);
  let x = 0;
  for (const c of result.chunks) {
    const c0 = x, c1 = x + c.width;
    if (a > c0) builder.append(c, 0, Math.min(c1, a) - c0);
    if (b < c1) builder.append(c, Math.max(b, c0) - c0, c1 - Math.max(b, c0));
    x = c1;
  }
  const chunks = builder.finish(), totalW = builder.total();
  const T = [], S = [], tr = result.track;
  tr.X.forEach((s, i) => {
    if (s >= a && s < b) return;
    const ns = s >= b ? s - (b - a) : s;
    if (S.length && ns <= S[S.length - 1]) return;
    T.push(tr.t[i]); S.push(ns);
  });
  if (!T.length) { T.push(0); S.push(0); }
  return { ...result, chunks, totalW, track: { ...tr, t: T, X: S, k1: T.length - 1, totalW }, tFirst: T[0], lastCut: { a, b }, cutFrom: result };
}

function MosaicStep({ videoRef, onModeBack }) {
  const [videoFile, setVideoFile] = useState(null);
  const [videoLoaded, setVideoLoaded] = useState(false);
  const [duration, setDuration] = useState(0);
  const [rangeStart, setRangeStart] = useState(0);
  const [rangeEnd, setRangeEnd] = useState(0);
  const [roi, setRoi] = useState(null);
  const [rate, setRate] = useState(4);
  const [cleanBg, setCleanBg] = useState(true);
  // 영상만으로 헷갈리는 부분은 사용자에게 묻는다 (모르면 '자동')
  const [askAbove, setAskAbove] = useState('auto');   // 악보 위 코드 이름·다이어그램
  const [askBelow, setAskBelow] = useState('auto');   // 악보 아래 가사
  const [askMotion, setAskMotion] = useState('auto'); // 흐름 / 페이지 전환
  const roiOpts = useMemo(() => ({ above: askAbove, below: askBelow }), [askAbove, askBelow]);
  const [running, setRunning] = useState(false);
  const [pct, setPct] = useState(0);
  const [msg, setMsg] = useState('영상 파일을 선택하세요.');
  const [result, setResult] = useState(null);
  const [info, setInfo] = useState(null);
  const [hist, setHist] = useState({ past: [], future: [] });
  const abortRef = useRef(false);
  const bgSeekRef = useRef(false);
  // 손으로 고치기: 마지막 분석 결과(장면 목록)와 사용자 손질
  const colRef = useRef(null);
