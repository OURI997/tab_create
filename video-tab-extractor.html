    const c = Math.round(playbarFrac * w), r = Math.max(1, Math.ceil(4 / scale));
    for (let x = Math.max(0, c - r); x <= Math.min(w - 1, c + r); x++) mask[x] = 1;
    barCols = [(c - r) * scale, (c + r + 1) * scale];
  }
  const tArr = [samples[0].t], shiftNative = [0], conf = [1], interp = [false], margin = [1];
  let vPrev = null; // 저해상도 px/s
  let prevF = flowToZeroMeanRows(samples[0]);
  for (let k = 1; k < n; k++) {
    if (abortRef && abortRef.current) return null;
    const curF = flowToZeroMeanRows(samples[k]);
    const dt = Math.max(1e-3, samples[k].t - samples[k - 1].t);
    let sMin, sMax;
    if (vPrev == null) { sMin = 0; sMax = 0.2 * w; }
    else { const e = vPrev * dt; sMin = Math.max(0, e * 0.5 - 1); sMax = e * 1.5 + Math.max(2, 0.03 * w); }
    let r = flowFindShift(prevF, curF, w, h, mask, sMin, sMax);
    if (!r.ok && vPrev != null) {
      const wide = flowFindShift(prevF, curF, w, h, mask, 0, 0.3 * w); // 속도가 급변했을 수 있어 한 번 넓혀 재시도
      if (wide.ok) r = wide;
    }
    let sLow, isInterp = false;
    if (r.ok) { sLow = r.shift; vPrev = sLow / dt; }
    else { sLow = vPrev != null ? vPrev * dt : 0; isInterp = true; } // 쉼표·내용 없음 구간: 직전 속도로 보간
    tArr.push(samples[k].t); shiftNative.push(sLow * scale); conf.push(r.peak); margin.push(r.margin); interp.push(isInterp);
    prevF = curF;
    if (k % 40 === 0) { if (onProgress) onProgress(k / n); await flowYield(); }
  }
  const X = [0];
  for (let k = 1; k < n; k++) X.push(X[k - 1] + shiftNative[k]);
  // 영상 앞뒤 정지 구간(이동 0) 제외 — 신뢰할 수 있는 샘플에서 이동이 있는 첫/마지막 구간
  const moving = k => !interp[k] && shiftNative[k] > 0.3 * scale;
  let k0 = -1, k1 = -1;
  for (let k = 1; k < n; k++) if (moving(k)) { k0 = k - 1; break; }
  for (let k = n - 1; k >= 1; k--) if (moving(k)) { k1 = k; break; }
  if (k0 < 0 || k1 <= k0) return null;
  const staticRanges = [];
  let sx = -1;
  for (let x = 0; x <= w; x++) {
    if (x < w && staticLow[x]) { if (sx < 0) sx = x; }
    else if (sx >= 0) { staticRanges.push([sx * scale, x * scale]); sx = -1; }
  }
  return { t: tArr, X, shiftNative, conf, margin, interp, k0, k1, staticRanges, barCols, nativeW, scale, w0: w };
}

function flowInterpX(track, t) {
  const T = track.t, X = track.X;
  if (t <= T[0]) return X[0];
  if (t >= T[T.length - 1]) return X[X.length - 1];
  let lo = 0, hi = T.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= t) lo = m; else hi = m; }
  const f = (t - T[lo]) / Math.max(1e-9, T[hi] - T[lo]);
  return X[lo] + f * (X[hi] - X[lo]);
}

// ---- 2패스: 새로 들어온 폭만큼의 열 슬라이스를 원본 해상도로 이어 붙임 ----
// 긴 스트립은 캔버스 최대 크기를 넘을 수 있어 폭 6000px 단위의 조각(chunk) 목록으로 만든다.
function flowChunkBuilder(h, chunkW) {
  const chunks = [];
  let cur = null, curW = 0;
  const startChunk = () => {
    cur = document.createElement('canvas');
    cur.width = chunkW; cur.height = h;
    const c = cur.getContext('2d');
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, chunkW, h);
    curW = 0;
    chunks.push(cur);
  };
  return {
    append(src, sx, sw) {
      sw = Math.round(sw); sx = Math.round(sx);
      while (sw > 0) {
        if (!cur || curW >= chunkW) startChunk();
        const take = Math.min(sw, chunkW - curW);
        cur.getContext('2d').drawImage(src, sx, 0, take, h, curW, 0, take, h);
        curW += take; sx += take; sw -= take;
      }
    },
    pad(sw) {
      sw = Math.round(sw);
      while (sw > 0) {
        if (!cur || curW >= chunkW) startChunk();
        const take = Math.min(sw, chunkW - curW);
        curW += take; sw -= take; // 흰색 그대로
      }
    },
    finish() {
      if (cur && curW < chunkW) {
        const t = document.createElement('canvas');
        t.width = Math.max(1, curW); t.height = h;
        t.getContext('2d').drawImage(cur, 0, 0);
        chunks[chunks.length - 1] = t;
      }
      return chunks;
    },
    total() { return (chunks.length - 1) * chunkW + curW; },
  };
}

// 슬라이스 소스 위치(u0): 기본은 ROI 오른쪽 가장자리 직전의 깨끗한 구간(오른쪽 10~35% → 소스 [0.65W, 0.90W], u0=0.90W).
// 재생바/정적 열과 겹치면 겹치지 않는 쪽으로 옮긴다(오른쪽으로 옮길 수 있으면 오른쪽, 아니면 왼쪽).
function flowChooseSourceEdge(W, maxDelta, barRanges) {
  const winW = Math.min(W * 0.35, Math.max(maxDelta, 4));
  const hits = u0 => barRanges.some(([a, b]) => b + 2 > u0 - winW && a - 2 < u0);
  const def = Math.round(W * 0.9);
  if (!barRanges.length || !hits(def)) return def;
  const right = Math.round(Math.max(...barRanges.map(r => r[1])) + 2 + winW);
  if (right <= W && !hits(right)) return right;
  const left = Math.round(Math.min(...barRanges.map(r => r[0])) - 2);
  if (left >= winW && !hits(left)) return left;
  return def;
}

async function flowRebuildStrip({ video, roi, track, medianObs, rate, abortRef, onProgress, prepareEdge }) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const W = Math.max(1, Math.round(rw)), H = Math.max(1, Math.round(rh));
  const confShifts = [];
  for (let k = track.k0 + 1; k <= track.k1; k++) if (!track.interp[k]) confShifts.push(track.shiftNative[k]);
  confShifts.sort((a, b) => a - b);
  const maxDelta = confShifts.length ? confShifts[Math.floor(confShifts.length * 0.95)] : W * 0.1;
  const barRanges = track.staticRanges.map(r => [r[0], r[1]]);
  if (track.barCols) barRanges.push(track.barCols);
  const u0 = Math.max(2, Math.min(W - 1, flowChooseSourceEdge(W, maxDelta, barRanges)));
  const builder = flowChunkBuilder(H, 6000);
  const pool = [];
  for (let i = 0; i < 4; i++) { const c = document.createElement('canvas'); c.width = W; c.height = H; pool.push(c); }
  let poolIdx = 0;
  const tStart = track.t[track.k0], tEnd = track.t[track.k1];
  const Xref = track.X[track.k0];
  let Gprev = null, last = null, gaps = 0, frames = 0, tFirst = null;
  const hist = []; // medianObs용: [{cap, G}]

  const medianSlice = (prev, center, next, wj, wn) => {
    const out = document.createElement('canvas');
    out.width = wj; out.height = H;
    const octx = out.getContext('2d');
    const img = octx.createImageData(wj, H);
    const read = (f, sx) => {
      if (!f || sx < 0 || sx + wj > W) return null;
      return f.cap.getContext('2d').getImageData(sx, 0, wj, H).data;
    };
    const cen = read(center, u0 - wj);
    const pre = prev ? read(prev, u0) : null; // 직전 프레임은 같은 내용이 오른쪽(+wj)에 있다
    const nxt = (next && wn >= 0) ? read(next, u0 - wj - wn) : null;
    const srcs = [cen, pre, nxt].filter(Boolean);
    const v = [0, 0, 0];
    for (let i = 0; i < img.data.length; i++) {
      if (srcs.length === 1) { img.data[i] = srcs[0][i]; continue; }
      for (let j = 0; j < srcs.length; j++) v[j] = srcs[j][i];
      const arr = srcs.length === 2 ? [v[0], v[1]] : [v[0], v[1], v[2]];
      arr.sort((a, b) => a - b);
      img.data[i] = arr[srcs.length === 2 ? 1 : 1];
    }
    octx.putImageData(img, 0, 0);
    return out;
  };

  const emitMedianFor = (idx, finalFlush) => {
    // hist[idx]를 중심으로, 이전/다음 프레임과 픽셀별 중앙값
    const c = hist[idx];
    const p = idx > 0 ? hist[idx - 1] : null, nx = idx + 1 < hist.length ? hist[idx + 1] : null;
    const wj = c.G - (p ? p.G : c.G);
    if (wj <= 0) return;
    const w2 = Math.min(wj, u0);
    if (wj > w2) { builder.pad(wj - w2); gaps += wj - w2; }
    const wn = nx ? nx.G - c.G : -1;
    builder.append(medianSlice(p, c, nx, w2, wn), 0, w2);
  };

  const onFrame = t => {
    if (t < tStart - 1e-6 || t > tEnd + 0.25) return;
    const cap = pool[poolIdx++ % pool.length];
    cap.getContext('2d').drawImage(video, rx0, ry0, rw, rh, 0, 0, W, H);
    const G = Math.round(flowInterpX(track, t) - Xref);
    frames++;
    last = cap;
    if (Gprev == null) {
      if (prepareEdge) prepareEdge(cap); // 재생바 자동 제거(첫 화면 왼쪽 부분)
      builder.append(cap, 0, u0); // 처음 화면에서 u0 왼쪽(이미 화면에 있던 부분)
      tFirst = t;
      Gprev = G;
      if (medianObs) hist.push({ cap, G });
      return;
    }
    if (medianObs) {
      hist.push({ cap, G });
      if (hist.length >= 3) { emitMedianFor(hist.length - 2); if (hist.length > 3) hist.shift(); }
      Gprev = G;
      return;
    }
    const w = G - Gprev;
    if (w > 0) {
      const w2 = Math.min(w, u0);
      if (w > w2) { builder.pad(w - w2); gaps += w - w2; }
      builder.append(cap, u0 - w2, w2);
      Gprev = G; // 서브픽셀 오차는 누적 정수 위치(G)에 이월된다
    }
  };

  await flowPlayPass(video, {
    startT: Math.max(0, tStart - 0.05), endT: tEnd + 0.25, rate, minGap: 0.1, abortRef, onFrame,
    onProgress: f => onProgress && onProgress(f),
  });
  if (abortRef && abortRef.current) return null;
  if (!last) throw new Error('스트립 재구성 중 프레임을 얻지 못했습니다.');
  if (medianObs && hist.length >= 2) emitMedianFor(hist.length - 1, true);
  if (prepareEdge) prepareEdge(last); // 재생바 자동 제거(마지막 화면 오른쪽 부분)
  builder.append(last, u0, W - u0); // 마지막 화면에서 u0 오른쪽(아직 지나가지 않은 부분)
  return { chunks: builder.finish(), totalW: builder.total(), H, u0, maxDelta, gaps, frames, barRanges, tFirst };
}

// ---- 전체 파이프라인 ----
async function flowRunPipeline({ video, roi, playbarFrac, rate, medianObs, scrollDefaults, abortRef, onProgress, startT, endT, playbarRemoval }) {
  const { rw, rh } = roiRectPx(video, roi);
  const nativeW = Math.round(rw);
  const dur = video.duration;
  const usedRvfc = flowRvfcSupported(video);
  const samples = [];
  const cap = flowMakeLowCapture(video, roi, 480);
  const t0 = performance.now();
  let lastPct = -1;
  const report = (label, f, lo, hi) => {
    const pct = Math.round((lo + (hi - lo) * Math.max(0, Math.min(1, f))) * 100);
    if (pct !== lastPct) { lastPct = pct; onProgress(label, pct); }
  };
  await flowPlayPass(video, {
    startT: startT != null ? startT : 0, endT: endT != null ? endT : dur, rate, minGap: 0.1, abortRef,
    onFrame: t => samples.push(cap(t)),
    onProgress: f => report('1/3 이동량 추적용 프레임 수집 (순차 재생)', f, 0, 0.35),
  });
  if (abortRef.current) return null;
  if (samples.length < 6) throw new Error('수집된 프레임이 너무 적습니다.');
  const track = await flowTrackMotion(samples, nativeW, playbarFrac, abortRef, f => report('2/3 이동량 계산 (NCC)', f, 0.35, 0.5));
  if (abortRef.current) return null;
  if (!track) throw new Error('가로 이동이 감지되지 않았습니다. ROI(영역)나 영상을 확인하세요.');
  const strip = await flowRebuildStrip({
    video, roi, track, medianObs, rate, abortRef,
    prepareEdge: playbarRemoval ? (c => flowRemovePlaybarCanvas(c, playbarRemoval.cols, playbarRemoval.band)) : null,
    onProgress: f => report('3/3 스트립 재구성 (순차 재생)', f, 0.5, 0.92),
  });
  if (!strip) return null;
  // 전처리: 원본 해상도에서 조각별로 (반전 여부는 첫 조각 기준으로 전체에 동일 적용). 임계값·잡티 제거·선 복원은 기존 함수 그대로.
  onProgress('전처리 적용 중...', 93);
  const sd = scrollDefaults;
  const avg = computeAvgLuminanceFromCanvas(strip.chunks[0]);
  const opts = { ...sd, invertMode: sd.invertMode === 'auto' ? (avg < 128 ? 'on' : 'off') : sd.invertMode };
  for (let i = 0; i < strip.chunks.length; i++) {
    scrollApplyPreprocInPlace(strip.chunks[i], opts);
    await flowYield();
  }
  onProgress('완료', 100);
  const confCnt = track.interp.slice(track.k0 + 1, track.k1 + 1).filter(Boolean).length;
  return {
    track, chunks: strip.chunks, totalW: strip.totalW, H: strip.H, tFirst: strip.tFirst,
    stats: {
      duration: dur, samples: samples.length, usedRvfc, rate, elapsed: (performance.now() - t0) / 1000,
      motionStart: track.t[track.k0], motionEnd: track.t[track.k1],
      lowConfCount: confCnt, moveSamples: track.k1 - track.k0,
      u0: strip.u0, maxDelta: strip.maxDelta, gaps: strip.gaps, medianObs,
      staticRanges: track.staticRanges, barCols: track.barCols,
    },
  };
}

// x(t) 그래프 — 위: 누적 이동량(px), 아래: 속도(px/s). 신뢰도 낮은(보간된) 구간은 붉은 음영, 제외된 앞/뒤 정지 구간은 회색 음영.
function flowDrawGraph(canvas, track) {
  const w = canvas.width = canvas.clientWidth || 800;
  const h = canvas.height = 260;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const T = track.t, n = T.length;
  const t0 = T[0], t1 = T[n - 1];
  const px = t => 40 + ((t - t0) / Math.max(1e-9, t1 - t0)) * (w - 50);
  const topY0 = 10, topY1 = 120, botY0 = 140, botY1 = 250;
  const Xmax = Math.max(1, track.X[n - 1]);
  const speed = track.shiftNative.map((s, k) => (k === 0 ? 0 : s / Math.max(1e-3, T[k] - T[k - 1])));
  const Vmax = Math.max(1, ...speed) * 1.1;
  // 음영
  for (let k = 1; k < n; k++) {
    const xa = px(T[k - 1]), xb = px(T[k]);
    if (k <= track.k0 || k > track.k1) { ctx.fillStyle = 'rgba(150,150,150,0.18)'; ctx.fillRect(xa, topY0, xb - xa, botY1 - topY0); }
    else if (track.interp[k]) { ctx.fillStyle = 'rgba(220,50,50,0.25)'; ctx.fillRect(xa, topY0, xb - xa, botY1 - topY0); }
  }
  ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
  ctx.strokeRect(40, topY0, w - 50, topY1 - topY0);
  ctx.strokeRect(40, botY0, w - 50, botY1 - botY0);
  ctx.strokeStyle = '#3c3489'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const x = px(T[k]), y = topY1 - (track.X[k] / Xmax) * (topY1 - topY0);
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.strokeStyle = '#1e7d3c';
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const x = px(T[k]), y = botY1 - (speed[k] / Vmax) * (botY1 - botY0);
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = '#555'; ctx.font = '11px sans-serif';
  ctx.fillText('누적 이동량 ' + Math.round(Xmax) + 'px', 44, topY0 + 12);
  ctx.fillText('속도 (최대 ' + Math.round(Vmax) + ' px/s)', 44, botY0 + 12);
  ctx.fillText(t0.toFixed(1) + 's', 40, h - 1);
  ctx.fillText(t1.toFixed(1) + 's', w - 40, h - 1);
}

function FlowChunkView({ chunk, scale }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    cv.width = Math.max(1, Math.round(chunk.width * scale));
    cv.height = Math.max(1, Math.round(chunk.height * scale));
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(chunk, 0, 0, cv.width, cv.height);
  }, [chunk, scale]);
  return <canvas ref={ref} style={{ display: 'block', flex: '0 0 auto' }} />;
}

// ---- 연속 이동형: 재생바 자동 감지 / 제거 ----
// 캔버스를 저해상도 그레이 샘플로 (정적 열 감지 입력). maxW를 크게 잡아야 좁은(≤6px) 열이 팽창 후에도 좁게 남는다.
function flowLowFromCanvas(c, maxW, t) {
  const scale = Math.min(1, maxW / c.width);
  const w = Math.max(8, Math.round(c.width * scale)), h = Math.max(4, Math.round(c.height * scale));
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const ctx = tmp.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(c, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const gray = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) gray[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
  return { t, gray, w, h };
}

// ROI·추출 구간 안 약 20개 시각을 샘플링해 기존 정적 열 감지(flowDetectStaticCols)를 실행하고, 좁은(≤6px) 정적 열 중
// 오선 밴드 위/아래 바깥으로 오선 간격×0.6 이상 끊김 없이 튀어나온 것만 재생바로 판정한다. (악보와 함께 움직이는
// 기둥·빔은 정적이 아니라 대상이 아니다.) 반환: { cols:[[x0,x1],...], band:{top,bottom,space}|null, nativeW }
async function flowDetectPlaybar(video, roi, startT, endT, defaults, onProgress, isCurrent) {
  const N = 20;
  const samples = [], natives = [];
  for (let i = 0; i < N; i++) {
    if (!isCurrent()) return null;
    const t = startT + (endT - startT) * (i + 0.5) / N;
    const c = await captureRepCanvas(video, roi, t);
    samples.push(flowLowFromCanvas(c, 1200, t));
    if (i % 4 === 0) natives.push(c);
    if (onProgress) onProgress((i + 1) / N);
  }
  const w0 = samples[0].w, h0 = samples[0].h;
  const nativeW = natives[0].width;
  const scale = nativeW / w0;
  const mask = flowDetectStaticCols(samples, w0, h0);
  const ranges = [];
  let sx = -1;
  for (let x = 0; x <= w0; x++) {
    if (x < w0 && mask[x]) { if (sx < 0) sx = x; }
    else if (sx >= 0) { ranges.push([sx * scale, x * scale]); sx = -1; }
  }
  const narrow = ranges.filter(r => (r[1] - r[0]) <= 6 + 2 * scale); // 팽창(±1열)으로 넓어진 만큼 여유
  const bands = [];
  const hits = narrow.map(() => 0);
  let seen = 0;
  for (const c of natives) {
    const pc = cloneCanvas(c);
    const avg = computeAvgLuminanceFromCanvas(pc);
    scrollApplyPreprocInPlace(pc, { ...defaults, removeBg: true, invertMode: defaults.invertMode === 'auto' ? (avg < 128 ? 'on' : 'off') : defaults.invertMode });
    const g = scrollGetFullGrayData(pc);
    const sys = detectStaffSystem(g, 0.3, 140);
    if (!sys) continue;
    seen++;
    bands.push({ top: sys.main.top, bottom: sys.main.bottom, space: sys.space });
    const lim = Math.max(2, Math.round(sys.space * 2));
    narrow.forEach((r, k) => {
      let best = 0;
      for (let x = Math.max(0, Math.floor(r[0])); x <= Math.min(g.w - 1, Math.ceil(r[1])); x++) {
        best = Math.max(best, contiguousInk(g, x, sys.main.top - 1, -1, lim, 128), contiguousInk(g, x, sys.main.bottom + 1, 1, lim, 128));
      }
      if (best >= sys.space * 0.6) hits[k]++;
    });
  }
  const band = bands.length ? {
    top: Math.round(medianOf(bands.map(b => b.top))), bottom: Math.round(medianOf(bands.map(b => b.bottom))), space: medianOf(bands.map(b => b.space)),
  } : null;
  const cols = narrow.filter((r, k) => seen > 0 && hits[k] >= Math.max(1, Math.ceil(seen * 0.3))).map(r => [r[0], r[1]]);
  return { cols, band, nativeW, narrowCount: narrow.length };
}

// 재생바 제거(원본 해상도, 전처리 전): 오선 밴드 바깥은 배경색(양옆 비재생바 열의 색)으로 덮고, 밴드 안은 양옆 비재생바
// 열(2~3px)에서 가로로 보간해 채운다. 이어지는 전처리의 오선 줄 복원이 줄 행을 마무리한다.
function flowRemovePlaybarCanvas(canvas, cols, band) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const avgCols = (y, xa, xb) => {
    let r = 0, g = 0, b = 0, n = 0;
    for (let x = Math.max(0, xa); x <= Math.min(w - 1, xb); x++) { const i = (y * w + x) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    return n ? [r / n, g / n, b / n] : null;
  };
  for (const [a, b] of cols) {
    const x0 = Math.max(0, Math.floor(a) - 1), x1 = Math.min(w - 1, Math.ceil(b) + 1);
    for (let y = 0; y < h; y++) {
      const inBand = y >= band.top - 1 && y <= band.bottom + 1;
      const lc = avgCols(y, x0 - 3, x0 - 1), rc = avgCols(y, x1 + 1, x1 + 3);
      if (!lc && !rc) continue;
      for (let x = x0; x <= x1; x++) {
        const i = (y * w + x) * 4;
        let c;
        if (!lc) c = rc; else if (!rc) c = lc;
        else if (inBand) { const t = (x - x0 + 1) / (x1 - x0 + 2); c = [lc[0] * (1 - t) + rc[0] * t, lc[1] * (1 - t) + rc[1] * t, lc[2] * (1 - t) + rc[2] * t]; }
        else c = lc;
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

// 추출 구간 썸네일 — ROI가 있으면 ROI 사각형만 잘라(비율 유지, 가로 400px) 그리고 박스는 그리지 않는다. ROI가 없으면 전체 프레임.
function flowDrawRoiThumb(canvasEl, video, roi) {
  if (!roi) { drawVideoFrameWithRoi(canvasEl, video, null); return; }
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  if (!(rw > 0 && rh > 0)) return;
  canvasEl.width = 400;
  canvasEl.height = Math.max(1, Math.round(400 * rh / rw));
  canvasEl.getContext('2d').drawImage(video, rx0, ry0, rw, rh, 0, 0, canvasEl.width, canvasEl.height);
}

function flowCaptureCurrent(video, roi) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(rw)); c.height = Math.max(1, Math.round(rh));
  c.getContext('2d').drawImage(video, rx0, ry0, rw, rh, 0, 0, c.width, c.height);
  return c;
}

function FlowStep({ videoRef, flowDefaults, setFlowDefaults, onModeBack }) {
  const [videoFile, setVideoFile] = useState(null);
  const [videoLoaded, setVideoLoaded] = useState(false);
  const [duration, setDuration] = useState(0);
  const [seekT, setSeekT] = useState(0);
  const [rangeStart, setRangeStart] = useState(0);
  const [rangeEnd, setRangeEnd] = useState(0);
  const [roi, setRoi] = useState(null);
  const [playbarFrac, setPlaybarFrac] = useState(null); // 수동 지정(선택) — 미리보기에서 클릭한 열 (ROI 폭 대비 0~1)
  const [detected, setDetected] = useState(null);       // 재생바 자동 감지 결과 {cols, band}
  const [detectMsg, setDetectMsg] = useState('');
  const [autoRemove, setAutoRemove] = useState(true);
  const [rate, setRate] = useState(2);
  const [medianObs, setMedianObs] = useState(false);
  const [playing, setPlaying] = useState(false);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({ label: '', pct: 0 });
  const [msg, setMsg] = useState('연속 이동형 영상 파일을 선택하세요.');
  const [result, setResult] = useState(null);
  const abortRef = useRef(false);
  const graphRef = useRef(null);

  // 최신 값을 항상 ref로 참조 — 슬라이더/드래그 중 stale closure로 ROI·설정이 되돌아가지 않게 한다
  const roiRef = useRef(null), defaultsRef = useRef(flowDefaults), pbRef = useRef(null);
  const seekTRef = useRef(0), rangeRef = useRef({ s: 0, e: 0 });
  const detectedRef = useRef(null), autoRemoveRef = useRef(true), bandRef = useRef(null);
  const playingRef = useRef(false), runningRef = useRef(false);
  const queueRef = useRef(Promise.resolve());
  const userSeekGen = useRef(0); // 사용자가 직접 seek한 횟수 — 백그라운드 작업 도중 사용자가 움직였는지 판단
  const bgSeekRef = useRef(false); // 사용자가 시크바를 움직이지 않았는데 일어나는 백그라운드 seek 중 — 위 영상 캔버스 갱신 억제
  const jobRef = useRef({ pending: false, again: false });
  const detTokenRef = useRef(0);
  const ppRawRef = useRef(null), ppProcRef = useRef(null), thumbStartRef = useRef(null), thumbEndRef = useRef(null);
  useEffect(() => { roiRef.current = roi; }, [roi]);
  useEffect(() => { defaultsRef.current = flowDefaults; }, [flowDefaults]);
  useEffect(() => { pbRef.current = playbarFrac; }, [playbarFrac]);
  useEffect(() => { seekTRef.current = seekT; }, [seekT]);
  useEffect(() => { rangeRef.current = { s: rangeStart, e: rangeEnd }; }, [rangeStart, rangeEnd]);
  useEffect(() => { detectedRef.current = detected; if (detected && detected.band) bandRef.current = detected.band; }, [detected]);
  useEffect(() => { autoRemoveRef.current = autoRemove; }, [autoRemove]);
  useEffect(() => { runningRef.current = running; }, [running]);
  // 'play' 가드: 사용자가 ▶/재생 확인을 눌러 playingRef가 true인 경우와 분석 패스의 내부 재생이 아니면 즉시 멈춘다
  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const guard = () => { if (!playingRef.current && !flowInternalPlayRef.current) v.pause(); };
    v.addEventListener('play', guard);
    return () => v.removeEventListener('play', guard);
  }, []);

  // 같은 <video> 하나를 미리보기·썸네일·감지·재생 확인이 함께 쓰므로 모든 seek 작업을 한 줄로 직렬화한다
  function enqueue(fn) {
    const p = queueRef.current.then(fn);
    queueRef.current = p.catch(() => {});
    return p;
  }

  // 사용자 조작으로 시크 위치를 옮기는 공통 경로 (시크바, 구간 핸들, 구간 초기화, 재생 확인) — 백그라운드 억제와 무관하게
  // 캔버스가 그 시각의 프레임으로 갱신된다.
  function userSeek(t) {
    userSeekGen.current++;
    seekTRef.current = t;
    setSeekT(t);
    requestRefresh();
  }

  // 백그라운드 seek 작업(썸네일·재생바 감지 등): 작업 중에는 영상 캔버스가 중간 프레임을 그리지 않게 억제하고,
  // 끝나면 그 시점의 최신 시크 위치로 되돌려 한 번 그린다. 작업 도중 사용자가 seek했다면 복구 seek은 건너뛴다.
  function bgEnqueue(fn) {
    return enqueue(async () => {
      const gen0 = userSeekGen.current;
      bgSeekRef.current = true;
      try {
        await fn();
      } finally {
        bgSeekRef.current = false;
        const v = videoRef.current;
        if (userSeekGen.current === gen0 && v && v.videoWidth && !playingRef.current && !runningRef.current) {
          await seekSafe(v, seekTRef.current);
          v.dispatchEvent(new Event('seeked')); // 시크바 위치 프레임으로 캔버스를 한 번 다시 그린다
        }
      }
    });
  }

  // 지금 적용될 재생바 제거 설정 (수동 지정이 있으면 그 열, 아니면 자동 감지된 열)
  function getRemoval() {
    const v = videoRef.current;
    if (!v || !v.videoWidth) return { on: false, cols: [], band: null };
    const W = Math.round(roiRectPx(v, roiRef.current).rw);
    const cols = pbRef.current != null ? [[pbRef.current * W - 2, pbRef.current * W + 2]] : (detectedRef.current ? detectedRef.current.cols : []);
    return { on: autoRemoveRef.current && cols.length > 0 && !!bandRef.current, cols, band: bandRef.current };
  }

  // 전처리 미리보기 — 추출과 같은 함수·같은 값(재생바 제거 → 반전 판정 → scrollApplyPreprocInPlace)을 원본 해상도로 적용한 뒤
  // 표시용으로만 축소한다.
  function drawPreviewNow() {
    const video = videoRef.current;
    const raw = ppRawRef.current, proc = ppProcRef.current;
    if (!video || !video.videoWidth || !raw || !proc) return;
    const full = flowCaptureCurrent(video, roiRef.current);
    const sd = defaultsRef.current;
    const decide = cv => {
      const avg = computeAvgLuminanceFromCanvas(cv);
      return { ...sd, invertMode: sd.invertMode === 'auto' ? (avg < 128 ? 'on' : 'off') : sd.invertMode };
    };
    // 오선 밴드(재생바 제거의 기준) — 원본 프레임을 임시로 이진화해 찾는다
    const probe = cloneCanvas(full);
    scrollApplyPreprocInPlace(probe, { ...decide(probe), removeBg: true });
    const sys = detectStaffSystem(scrollGetFullGrayData(probe), 0.3, 140);
    if (sys) bandRef.current = { top: sys.main.top, bottom: sys.main.bottom, space: sys.space };
    const rem = getRemoval();
    const work = cloneCanvas(full);
    if (rem.on) flowRemovePlaybarCanvas(work, rem.cols, rem.band);
    scrollApplyPreprocInPlace(work, decide(work));
    drawDownscaledStaged(full, raw, 800);
    drawDownscaledStaged(work, proc, 800);
    // 감지/지정된 재생바 열을 점선으로 표시
    const k = proc.width / full.width;
    for (const cv of [raw, proc]) {
      const ctx = cv.getContext('2d');
      ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5;
      ctx.strokeStyle = rem.on ? '#e03030' : 'rgba(224,48,48,0.5)';
      for (const [a, b] of rem.cols) {
        for (const x of [a * k, (b + 1) * k]) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke(); }
      }
      ctx.setLineDash([]);
    }
  }
  // 현재 시크 위치로 이동한 뒤 미리보기 갱신 (진행 중인 작업이 있으면 한 번만 더 돌도록 합친다)
  function requestRefresh() {
    if (runningRef.current || playingRef.current) return;
    const j = jobRef.current;
    if (j.pending) { j.again = true; return; }
    j.pending = true;
    enqueue(async () => {
      do {
        j.again = false;
        const v = videoRef.current;
        if (v && v.videoWidth && !runningRef.current && !playingRef.current) {
          await seekSafe(v, seekTRef.current);
          drawPreviewNow();
        }
      } while (j.again);
      j.pending = false;
    });
  }

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const video = videoRef.current;
    video.src = URL.createObjectURL(file);
    setVideoLoaded(false); setRoi(null); setPlaybarFrac(null); setResult(null); setDetected(null); setDetectMsg('');
    setVideoFile(file);
    video.onloadedmetadata = async () => {
      setVideoLoaded(true);
      setDuration(video.duration);
      setSeekT(0); seekTRef.current = 0;
      setRangeStart(0); setRangeEnd(video.duration);
      setMsg('영상 로드됨: ' + video.duration.toFixed(2) + '초, ' + video.videoWidth + 'x' + video.videoHeight + '. 악보가 지나가는 영역(ROI)을 드래그로 지정하세요.');
      await seekSafe(video, 0.001); // 워밍업 재생 없이 seek만으로 첫 프레임을 그린다
      await seekTo(video, 0);
      requestRefresh();
    };
  }

  // ---- (a) 영상 확인: 재생/일시정지 + 시크바 ----
  function stopPlay() {
    const v = videoRef.current;
    playingRef.current = false; setPlaying(false);
    if (v) { v.pause(); v.muted = true; }
    requestRefresh();
  }
  function startPlay(stopAt) {
    const v = videoRef.current;
    if (!v || !videoLoaded || runningRef.current) return;
    v.muted = false;
    playingRef.current = true; setPlaying(true);
    let lastUi = 0;
    const tick = () => {
      if (!playingRef.current) return;
      v.dispatchEvent(new Event('seeked')); // ROI 지정 캔버스가 현재 프레임으로 다시 그려지게 한다
      const t = v.currentTime, now = performance.now();
      if (now - lastUi > 200) { lastUi = now; seekTRef.current = t; setSeekT(t); }
      if (v.ended || v.paused || (stopAt != null && t >= stopAt)) { stopPlay(); return; }
      requestAnimationFrame(tick);
    };
    v.play().then(() => requestAnimationFrame(tick)).catch(() => stopPlay());
  }
  async function onSeek(e) {
    const t = parseFloat(e.target.value);
    if (playingRef.current) stopPlay();
    userSeek(t);
  }
  // (c) 해당 지점 재생 확인: 그 지점으로 이동해 3초 재생
  function playCheck(t) {
    if (playingRef.current) stopPlay();
    userSeekGen.current++; // 사용자 조작 — 진행 중인 백그라운드 작업의 복구 seek이 덮어쓰지 않게 한다
    seekTRef.current = t; setSeekT(t);
    enqueue(async () => {
      const v = videoRef.current;
      try {
        await seekSafe(v, t);
        seekTRef.current = t; setSeekT(t);
        startPlay(t + 3);
      } catch (err) {
        stopPlay();
      }
    });
  }

  // (c) 추출 구간 썸네일 — 시작/끝 지점의 프레임(ROI 박스 표시)
  useEffect(() => {
    if (!videoLoaded || running || playing) return;
    const id = setTimeout(() => {
      bgEnqueue(async () => {
        const v = videoRef.current;
        for (const [cvRef, t] of [[thumbStartRef, rangeRef.current.s], [thumbEndRef, rangeRef.current.e]]) {
          if (!v || !cvRef.current) continue;
          await seekSafe(v, t);
          flowDrawRoiThumb(cvRef.current, v, roiRef.current);
        }
      }).then(() => requestRefresh());
    }, 350);
    return () => clearTimeout(id);
  }, [rangeStart, rangeEnd, roi, videoLoaded]);

  // 설정(전처리·재생바 제거)/ROI가 바뀌면 100ms 디바운스로 미리보기 갱신
  useEffect(() => {
    if (!videoLoaded) return;
    const id = setTimeout(requestRefresh, 100);
    return () => clearTimeout(id);
  }, [roi, flowDefaults, videoLoaded, playbarFrac, autoRemove, detected]);

  // 재생바 자동 감지 — ROI/추출 구간이 바뀐 뒤 잠시 기다렸다가 ~20개 시각 샘플링(진행 표시)
  useEffect(() => {
    if (!videoLoaded || !roi || running || playing || rangeEnd - rangeStart < 0.5) return; // ROI 지정 전에는 감지하지 않는다
    const token = ++detTokenRef.current;
    const id = setTimeout(() => {
      bgEnqueue(async () => {
        if (token !== detTokenRef.current) return;
        setDetectMsg('재생바 감지 중... 0%');
        const res = await flowDetectPlaybar(
          videoRef.current, roiRef.current, rangeRef.current.s, rangeRef.current.e, defaultsRef.current,
          f => setDetectMsg('재생바 감지 중... ' + Math.round(f * 100) + '%'), () => token === detTokenRef.current
        );
        if (!res || token !== detTokenRef.current) return;
        setDetected(res);
        if (res.band) bandRef.current = res.band;
        if (res.cols.length) setAutoRemove(true);
        setDetectMsg(res.cols.length ? ('재생바 ' + res.cols.length + '곳 감지됨 (' + res.cols.map(r => Math.round(r[0]) + '~' + Math.round(r[1]) + 'px').join(', ') + ')') : '재생바가 감지되지 않았습니다 (필요하면 미리보기에서 열을 직접 클릭하세요)');
      }).then(() => requestRefresh());
    }, 800);
    return () => clearTimeout(id);
  }, [roi, rangeStart, rangeEnd, videoLoaded]);

  function onPreviewClick(e) {
    const r = e.currentTarget.getBoundingClientRect();
    setPlaybarFrac(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)));
  }

  async function run() {
    const video = videoRef.current;
    if (!video || !videoLoaded) return;
    if (rangeEnd - rangeStart < 1) { setMsg('추출 구간이 너무 짧습니다 (1초 이상).'); return; }
    abortRef.current = false;
    if (playingRef.current) stopPlay();
    detTokenRef.current++; // 진행 중인 감지는 폐기
    runningRef.current = true; // 새 미리보기/감지 작업이 끼어들지 않게 먼저 막고, 진행 중인 작업이 끝나길 기다린다
    await queueRef.current;
    setRunning(true); setResult(null); setMsg('분석 중...');
    const rem = getRemoval();
    try {
      const out = await flowRunPipeline({
        video, roi, playbarFrac, rate, medianObs, scrollDefaults: flowDefaults, abortRef,
        startT: rangeStart, endT: rangeEnd, playbarRemoval: rem.on ? { cols: rem.cols, band: rem.band } : null,
        onProgress: (label, pct) => setProgress({ label, pct }),
      });
      if (out) { setResult(out); setMsg('완료'); } else setMsg('중단되었습니다.');
    } catch (err) {
      setMsg('오류: ' + err.message);
    } finally {
      runningRef.current = false;
      playingRef.current = false;
      setRunning(false);
      video.pause(); video.muted = true; video.playbackRate = 1;
      requestRefresh();
    }
  }

  useEffect(() => { if (result && graphRef.current) flowDrawGraph(graphRef.current, result.track); }, [result]);

  async function downloadStrip() {
    if (!result) return;
    if (result.totalW <= 30000) {
      const cv = document.createElement('canvas');
      cv.width = result.totalW; cv.height = result.H;
      const ctx = cv.getContext('2d');
      let x = 0;
      for (const c of result.chunks) { ctx.drawImage(c, x, 0); x += c.width; }
      await downloadCanvasPng(cv, 'flow_strip.png');
    } else {
      // 한 장으로 만들기엔 너무 길어(브라우저 캔버스 한계) 조각별로 내려받는다
      for (let i = 0; i < result.chunks.length; i++) {
        await downloadCanvasPng(result.chunks[i], 'flow_strip_part' + (i + 1) + '.png');
        await new Promise(r => setTimeout(r, 300));
      }
    }
  }

  const st = result && result.stats;
  const viewScale = result ? Math.min(1, 180 / result.H) : 1;
  const disabledAll = running;
  return (
    <div>
      <div className="block">
        <div className="block-head"><span>연속 이동형 — 영역 지정 · 이동량 추적 · 스트립 재구성</span></div>
        <p className="hint-text">
          악보가 멈춤 없이 가로로 계속 흐르는 영상용입니다(오른쪽에서 들어와 왼쪽으로 나감). 영상을 확인하고, 악보가 지나가는 영역을
          드래그로 지정한 뒤, 추출 구간과 전처리를 확인하고 시작하면 영상을 순차 재생하며 프레임 간 이동량을 추적해 악보 전체를
          하나의 긴 스트립으로 이어 붙입니다.
        </p>
        <div className="controls">
          <label>영상 파일: <input type="file" accept="video/*" onChange={handleFileChange} disabled={disabledAll} /></label>
          <label>재생 속도(분석):
            <select value={rate} onChange={e => setRate(parseFloat(e.target.value))} disabled={disabledAll} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="1">1배</option><option value="2">2배</option><option value="3">3배 (최대)</option>
            </select>
          </label>
          <label><input type="checkbox" checked={medianObs} onChange={e => setMedianObs(e.target.checked)} disabled={disabledAll} /> 현재 음표 강조 번짐 보정(여러 프레임 중앙값)</label>
        </div>

        <div className="slider-label" style={{ marginTop: '8px' }}>① 영상 확인 · 영역(ROI) 지정 — 영상 위에서 드래그</div>
        <ScrollRoiPicker videoRef={videoRef} videoLoaded={videoLoaded} roi={roi} setRoi={setRoi} suppressRef={bgSeekRef} />
        <div className="toolbar">
          <button className="icon-btn" disabled={!videoLoaded || disabledAll} onClick={() => (playing ? stopPlay() : startPlay(null))}>{playing ? '❚❚ 일시정지' : '▶ 재생'}</button>
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            <input type="range" min="0" max={duration || 0} step="0.05" value={seekT} disabled={!videoLoaded || disabledAll} style={{ flex: 1 }} onChange={onSeek} />
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>{seekT.toFixed(2)}s / {duration.toFixed(1)}s</span>
          </label>
        </div>

        <div className="slider-label" style={{ marginTop: '8px' }}>② 추출 구간 — {rangeStart.toFixed(2)}s ~ {rangeEnd.toFixed(2)}s (분석은 이 구간만 사용)</div>
        {videoLoaded && <MiniRangeTimeline duration={duration} start={rangeStart} end={rangeEnd} onChange={(a, b, which) => {
          if (running) return;
          if (playingRef.current) stopPlay();
          setRangeStart(a); setRangeEnd(b);
          userSeek(which === 'end' ? b : a); // 움직인 핸들의 시각으로 위쪽 영상을 이동
        }} />}
        {videoLoaded && (
          <div className="row" style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
            <div>
              <div className="slider-label">시작 지점 ({rangeStart.toFixed(2)}s)</div>
              <canvas ref={thumbStartRef} style={{ maxWidth: '100%', border: '1px solid var(--border-strong)' }} />
              <div><button className="icon-btn" disabled={disabledAll} onClick={() => playCheck(rangeStart)}>여기서 재생 확인</button></div>
            </div>
            <div>
              <div className="slider-label">끝 지점 ({rangeEnd.toFixed(2)}s)</div>
              <canvas ref={thumbEndRef} style={{ maxWidth: '100%', border: '1px solid var(--border-strong)' }} />
              <div><button className="icon-btn" disabled={disabledAll} onClick={() => playCheck(Math.max(rangeStart, rangeEnd - 3))}>끝 3초 재생 확인</button></div>
            </div>
          </div>
        )}
        <div className="toolbar"><button className="icon-btn" disabled={!videoLoaded || disabledAll} onClick={() => { if (playingRef.current) stopPlay(); setRangeStart(0); setRangeEnd(duration); userSeek(0); }}>구간 초기화(전체)</button>
          <button className="icon-btn" disabled={!roi || disabledAll} onClick={() => setRoi(null)}>영역 초기화</button></div>
      </div>

      <ScrollPreprocPanel scrollDefaults={flowDefaults} setScrollDefaults={setFlowDefaults} />

      <div className="block">
        <div className="block-head"><span>③ 전처리 미리보기 (현재 시크 위치 · 선택한 ROI)</span></div>
        <div className="toolbar">
          <label><input type="checkbox" checked={autoRemove} onChange={e => setAutoRemove(e.target.checked)} disabled={disabledAll} /> 재생바 자동 제거</label>
          <button className="icon-btn" onClick={() => setPlaybarFrac(null)} disabled={playbarFrac == null || disabledAll}>수동 지정 해제</button>
          <span className="save-msg">{detectMsg}{playbarFrac != null ? ' · 수동 지정: ROI 폭의 ' + (playbarFrac * 100).toFixed(1) + '%' : ''}</span>
        </div>
        <p className="hint-text" style={{ margin: '4px 0' }}>
          빨간 점선 = 재생바로 감지/지정된 열(제거 대상). 감지가 틀렸으면 아래 "전처리 후" 이미지에서 재생바 열을 직접 클릭하세요(수동 지정이 우선).
          설정을 바꾸면 곧바로 이 미리보기가 바뀌며, 분석은 이 미리보기와 똑같은 처리를 합니다.
        </p>
        <div className="row" style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
          <div style={{ maxWidth: '100%' }}>
            <div className="slider-label">원본 (ROI 크롭)</div>
            <canvas ref={ppRawRef} style={{ maxWidth: '100%', height: 'auto', border: '1px solid var(--border-strong)' }} />
          </div>
          <div style={{ maxWidth: '100%' }}>
            <div className="slider-label">전처리 후 (클릭 = 재생바 열 지정)</div>
            <canvas ref={ppProcRef} onClick={onPreviewClick} style={{ maxWidth: '100%', height: 'auto', border: '1px solid var(--border-strong)', cursor: 'crosshair' }} />
          </div>
        </div>
      </div>

      <div className="toolbar">
        <button className="icon-btn" onClick={onModeBack} disabled={running}>← 모드</button>
        <button onClick={run} disabled={!videoLoaded || running}>{running ? '진행 중...' : '이동량 추적 + 스트립 재구성 시작'}</button>
        {running && <button className="icon-btn" onClick={() => { abortRef.current = true; }}>중단</button>}
        <span className="save-msg">{running ? (progress.label + ' — ' + progress.pct + '%') : msg}</span>
      </div>
      {running && (
        <div style={{ height: '8px', background: 'var(--border)', borderRadius: '4px', overflow: 'hidden' }}>
          <div style={{ width: progress.pct + '%', height: '100%', background: 'var(--accent)' }} />
        </div>
      )}

      {result && (
        <div className="block">
          <div className="block-head"><span>결과 확인 — 이동량 x(t)와 재구성 스트립</span></div>
          <p className="hint-text">
            이동 구간 {st.motionStart.toFixed(2)}s ~ {st.motionEnd.toFixed(2)}s (앞뒤 정지 구간 제외) · 샘플 {st.samples}개 · 신뢰도 낮아 보간된 구간 {st.lowConfCount}/{st.moveSamples}개 ·
            평균 속도 {Math.round((result.track.X[result.track.k1] - result.track.X[result.track.k0]) / Math.max(1e-6, st.motionEnd - st.motionStart))}px/s ·
            스트립 {result.totalW}×{result.H}px · 처리 {st.elapsed.toFixed(1)}초 ({st.usedRvfc ? '순차 재생' : 'seek 폴백'}, {st.rate}배)
          </p>
          <p className="hint-text">
            슬라이스 소스 위치: ROI 폭의 {Math.round(st.u0 / (result.track.nativeW) * 100)}% 지점 직전 · 최대 프레임당 이동 {Math.round(st.maxDelta)}px ·
            자동 감지된 정적 열 {st.staticRanges.length}곳{st.staticRanges.length ? ' (' + st.staticRanges.map(r => Math.round(r[0]) + '~' + Math.round(r[1])).join(', ') + 'px)' : ''}
            {st.barCols ? ' · 지정한 재생바 ' + Math.round(st.barCols[0]) + '~' + Math.round(st.barCols[1]) + 'px' : ''}
            {st.gaps ? <b style={{ color: '#c0392b' }}> · 한 프레임 이동량이 슬라이스 소스보다 커서 빈 구간 {st.gaps}px 발생 (재생 속도를 낮춰 다시 시도하세요)</b> : ''}
          </p>
          <canvas ref={graphRef} style={{ width: '100%', height: '260px', border: '1px solid var(--border-strong)', background: '#fff' }} />
          <p className="hint-text">회색 음영 = 제외된 앞/뒤 정지 구간 · 붉은 음영 = 신뢰도가 낮아 직전 속도로 보간한 구간</p>
          <div style={{ overflowX: 'auto', border: '1px solid var(--border-strong)', background: '#fff' }}>
            <div style={{ display: 'flex', width: 'max-content' }}>
              {result.chunks.map((c, i) => <FlowChunkView key={i} chunk={c} scale={viewScale} />)}
            </div>
          </div>
          <div className="toolbar">
            <button onClick={downloadStrip}>스트립 PNG 다운로드{result.totalW > 30000 ? ' (너무 길어 ' + result.chunks.length + '개 조각으로 분할)' : ''}</button>
            <button className="icon-btn" onClick={() => setResult(null)}>결과 닫기</button>
          </div>
        </div>
      )}

      {result && <FlowStage2 result={result} videoFile={videoFile} flowDefaults={flowDefaults} />}
    </div>
  );
}

// ================================================================================================
// 연속 이동형 2단계 — 마디 분할 + 악보 빌더로 넘기기. 1단계 결과(스트립 조각 목록, x(t))를 입력으로만 쓴다.
// ================================================================================================

// 스트립 전체 좌표 [x0,x1) 구간을 조각 목록에서 잘라 한 장으로 이어 그린다 (조각 경계에 걸쳐도 연속)
function flowCropStrip(chunks, x0, x1) {
  x0 = Math.max(0, Math.round(x0));
  const H = chunks[0].height;
  const w = Math.max(1, Math.round(x1) - x0);
  const out = document.createElement('canvas');
  out.width = w; out.height = H;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, H);
  let base = 0;
  for (const c of chunks) {
    const cs = base, ce = base + c.width;
    const a = Math.max(x0, cs), b = Math.min(x0 + w, ce);
    if (b > a) ctx.drawImage(c, a - cs, 0, b - a, H, a - x0, 0, b - a, H);
    base = ce;
  }
  return out;
}

// 조각별로 기존 마디선 검출(detectStaffSystem / detectBarsThroughSystem — 밴드 정확 일치·재생바 제외 규칙 포함)을
// 실행하고 전체 좌표로 합친다. 조각 경계 ±(오선 간격×3)는 인접 조각을 이어 붙인 확장 캔버스에서 검사하고, 각 마디선은
// 그것이 속한 조각 한 곳에서만 채택해(소유권) 경계에서 갈라지거나 중복되지 않게 한다. 헤더 제외는 첫 조각만.
async function flowDetectBars(chunks, nativeW, onProgress) {
  const starts = [];
  let total = 0;
  for (const c of chunks) { starts.push(total); total += c.width; }
  const g0 = scrollGetFullGrayData(chunks[0]);
  const sys0 = detectStaffSystem(g0, 0.3, 140);
  const blank = new Uint8Array(total);
  if (!sys0) return { bars: [], weak: true, staffFound: false, blank, space: 12, total, T: null };
  const space = sys0.space;
  const margin = Math.max(40, Math.round(space * 3));
  const ext = i => {
    const x0 = Math.max(0, starts[i] - margin), x1 = Math.min(total, starts[i] + chunks[i].width + margin);
    return { canvas: flowCropStrip(chunks, x0, x1), x0 };
  };
  // 연속도 임계 T: 첫 조각에서 0.9부터 0.05씩 낮추며 마디 수가 기대치 이상이 될 때까지 (기존 자동 규칙과 동일), 전체에 동일 적용
  const e0 = ext(0);
  const gE = scrollGetFullGrayData(e0.canvas);
  const sysE = detectStaffSystem(gE, 0.3, 140);
  const leftE = sysE ? staffLeftEdge(gE, sysE) : 0;
  const expectMin = 0.5 * nativeW / (space * 10);
  let T = 0.9, weak = false;
  if (sysE) {
    let res = null;
    for (const t of [0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.55, 0.5]) {
      T = t;
      res = detectBarsThroughSystem(gE, sysE, T, leftE, 140, null, 20);
      if (res.bars.length >= expectMin) break;
    }
    weak = !res || res.bars.length < expectMin;
  } else weak = true;
  const all = [];
  for (let i = 0; i < chunks.length; i++) {
    const e = i === 0 ? { canvas: e0.canvas, x0: 0 } : ext(i);
    const g = i === 0 ? gE : scrollGetFullGrayData(e.canvas);
    const sys = i === 0 ? sysE : detectStaffSystem(g, 0.3, 140);
    if (sys) {
      const r = detectBarsThroughSystem(g, sys, T, staffLeftEdge(g, sys), 140, null, i === 0 ? 20 : 0);
      const lo = starts[i], hi = starts[i] + chunks[i].width;
      for (const b of r.bars) {
        const gx = b.x + e.x0;
        if (gx >= lo && gx < hi) all.push({ x: gx, score: b.score, gapConn: b.gapConn });
      }
      const bl = computeBlankColumns(g, sys, 140);
      for (let gx = lo; gx < hi; gx++) { const lx = gx - e.x0; if (lx >= 0 && lx < bl.length) blank[gx] = bl[lx]; }
    }
    if (onProgress) onProgress((i + 1) / chunks.length);
    await flowYield();
  }
  all.sort((p, q) => p.x - q.x);
  // 경계 근처에서 같은 마디선이 약간 다른 위치로 두 번 잡힌 경우 정리 + 기존 이웃 정리 규칙
  const tol = Math.max(3, space * 0.4);
  const merged = [];
  for (const b of all) {
    const last = merged[merged.length - 1];
    if (last && b.x - last.x <= tol) { if (b.score > last.score) merged[merged.length - 1] = b; }
    else merged.push(b);
  }
  const kept = pruneCloseBarObjs(merged);
  let bars = [staffLeftEdge(g0, sys0), ...kept.map(b => b.x)];
  if (total - 1 - bars[bars.length - 1] > space * 4) bars.push(total - 1);
  return { bars, weak, staffFound: true, blank, space, total, T };
}

// 재생바 열(원본 해상도 px): 지정했으면 그 열, 아니면 정적 열 중 ROI 가장자리가 아닌 좁은 열이 정확히 하나일 때 그 열
function flowResolvePlaybar(track) {
  const W = track.nativeW;
  if (track.barCols) return { x: (track.barCols[0] + track.barCols[1]) / 2, source: 'user' };
  const cands = track.staticRanges.filter(r => r[0] > W * 0.02 && r[1] < W * 0.98 && (r[1] - r[0]) <= W * 0.04);
  if (cands.length === 1) return { x: (cands[0][0] + cands[0][1]) / 2, source: 'auto' };
  return null;
}

// 누적 이동량 X가 target에 처음 도달하는 시각 (x(t)의 역변환). X는 단조 증가하도록 보정해서 쓴다.
function flowInvX(T, Xm, target) {
  const n = T.length;
  if (target <= Xm[0]) return T[0];
  if (target >= Xm[n - 1]) return T[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (Xm[m] >= target) hi = m; else lo = m; }
  const dx = Xm[hi] - Xm[lo];
  return T[lo] + (dx > 1e-9 ? (target - Xm[lo]) / dx : 0) * (T[hi] - T[lo]);
}

// 스트립 위 마디선 오버레이 + 수동 보정: 빈 곳 클릭 = 추가, 마디선 클릭 = 선택(삭제 대상), 드래그 = 위치 미세 조정.
// 드래그 중에는 화면 위치만 갱신하고, 놓을 때 한 번만 상위로 커밋해서 그룹이 재계산된다.
function FlowBarStrip({ chunks, totalW, H, scale, bars, flagged, selIdx, onSelect, onCommit, scrollRef }) {
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const latest = useRef({});
  latest.current = { bars, onCommit, onSelect, scale, totalW };
  useEffect(() => {
    function onMove(e) {
      const d = dragRef.current;
      if (!d) return;
      const dx = e.clientX - d.startClient;
      if (!d.moved && Math.abs(dx) < 3) return;
      d.moved = true;
      d.x = Math.max(0, Math.min(latest.current.totalW - 1, d.origX + dx / latest.current.scale));
      setDrag({ i: d.i, x: d.x });
    }
    function onUp() {
      const d = dragRef.current;
      dragRef.current = null;
      if (!d) return;
      setDrag(null);
      const L = latest.current;
      if (d.moved) {
        const nb = L.bars.slice();
        nb[d.i] = Math.round(d.x);
        nb.sort((a, b) => a - b);
        L.onCommit(nb, nb.indexOf(Math.round(d.x)));
      } else L.onSelect(d.i);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
  }, []);
  function onBgClick(e) {
    if (e.target !== e.currentTarget) return;
    const r = e.currentTarget.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) / scale);
    const nb = [...bars, x].sort((a, b) => a - b);
    onCommit(nb, nb.indexOf(x));
  }
  return (
    <div ref={scrollRef} style={{ overflowX: 'auto', border: '1px solid var(--border-strong)', background: '#fff' }}>
      <div style={{ position: 'relative', width: Math.round(totalW * scale), height: Math.round(H * scale) }}>
        <div style={{ display: 'flex', position: 'absolute', left: 0, top: 0 }}>
          {chunks.map((c, i) => <FlowChunkView key={i} chunk={c} scale={scale} />)}
        </div>
        <div onClick={onBgClick} style={{ position: 'absolute', left: 0, top: 0, right: 0, bottom: 0, cursor: 'copy' }}>
          {flagged.map(i => bars[i + 1] != null && (
            <div key={'f' + i} style={{ position: 'absolute', left: bars[i] * scale, width: (bars[i + 1] - bars[i]) * scale, top: 0, bottom: 0, background: 'rgba(255,140,0,0.25)', pointerEvents: 'none' }} />
          ))}
          {bars.map((b, i) => {
            const x = drag && drag.i === i ? drag.x : b;
            const sel = i === selIdx;
            return (
              <div key={i}
                onPointerDown={e => { e.preventDefault(); e.stopPropagation(); dragRef.current = { i, startClient: e.clientX, origX: b, moved: false, x: b }; }}
                style={{ position: 'absolute', left: x * scale - 5, width: 10, top: 0, bottom: 0, cursor: 'ew-resize' }}>
                <div style={{ position: 'absolute', left: 4, width: sel ? 3 : 2, top: 0, bottom: 0, background: sel ? '#ff9500' : '#e02020', pointerEvents: 'none' }} />
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function FlowStage2({ result, videoFile, flowDefaults }) {
  const { chunks, totalW, H, track, stats } = result;
  const nativeW = track.nativeW;
  const [det, setDet] = useState(null);
  const [detecting, setDetecting] = useState(false);
  const [detProgress, setDetProgress] = useState(0);
  const [bars, setBars] = useState([]);
  const [selIdx, setSelIdx] = useState(null);
  const [groupSizeUser, setGroupSizeUser] = useState(null);
  const [maxBarsUser, setMaxBarsUser] = useState(null);
  const [groupBasis, setGroupBasis] = useState('auto');
  const [offsetSec, setOffsetSec] = useState(0);
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);
  const pvRef = useRef(null);
  const stopAtRef = useRef(null);
  const scale = Math.min(1, 180 / H);

  async function detect() {
    setDetecting(true); setDetProgress(0); setSelIdx(null);
    try {
      const r = await flowDetectBars(chunks, nativeW, f => setDetProgress(f));
      setDet(r); setBars(r.bars);
    } finally { setDetecting(false); }
  }
  useEffect(() => { detect(); }, [result]);

  const videoUrl = useMemo(() => (videoFile ? URL.createObjectURL(videoFile) : null), [videoFile]);
  useEffect(() => () => { if (videoUrl) URL.revokeObjectURL(videoUrl); }, [videoUrl]);

  // ---- 시간 매핑: 스트립 x → 재생 시각 ----
  // 스트립 좌표 s의 내용이 재생바 열 p를 지나는 시각 = X(t) − X(첫 프레임) = s − p 가 되는 t (x(t)의 역변환)
  const playbar = useMemo(() => flowResolvePlaybar(track), [track]);
  const Xm = useMemo(() => {
    const out = [];
    let m = -Infinity;
    for (const v of track.X) { m = Math.max(m, v); out.push(m); }
    return out;
  }, [track]);
  const Xf = useMemo(() => flowInterpX(track, result.tFirst != null ? result.tFirst : track.t[track.k0]), [track, result]);
  const dur = track.t[track.t.length - 1];
  const tOf = s => {
    const p = playbar ? playbar.x : 0;
    const t = flowInvX(track.t, Xm, s - p + Xf) + (playbar ? 0 : offsetSec);
    return Math.max(0, Math.min(dur, t));
  };

  // ---- 그룹화 (기존 groupBarsByTargetWidth / groupByWidth와 같은 UI·기본값 규칙) ----
  const quality = useMemo(() => assessBarQuality(bars, totalW, nativeW, det ? det.weak : true), [bars, totalW, nativeW, det]);
  const measureW = useMemo(() => robustMeasureWidth(bars), [bars]);
  const autoGroupSize = quality.medianWidth ? Math.max(2, Math.min(6, Math.round(nativeW / quality.medianWidth))) : 4;
  const groupSize = groupSizeUser != null ? groupSizeUser : autoGroupSize;
  const maxBarsPerGroup = Math.max(maxBarsUser != null ? maxBarsUser : groupSize + 2, groupSize);
  const useBarGroups = bars.length >= 2 && (groupBasis === 'bar' || (groupBasis === 'auto' && !quality.low));
  let groups = [];
  if (det) {
    if (useBarGroups) groups = groupBarsByTargetWidth(bars, groupSize, maxBarsPerGroup);
    else groups = groupByWidth(totalW, groupSize, maxBarsPerGroup, measureW, nativeW, bars, det.blank, det.space);
  }
  const groupsMeta = groups.map((g, i) => {
    const start = tOf(g.startX);
    const end = i + 1 < groups.length ? tOf(groups[i + 1].startX) : tOf(g.endX);
    return { ...g, timeRange: { start, end: Math.max(start, end) } };
  });
  const thumbs = useMemo(
    () => groupsMeta.map(g => flowCropStrip(chunks, g.startX, g.endX).toDataURL('image/png')),
    // eslint-disable-next-line
    [chunks, JSON.stringify(groups.map(g => [g.startX, g.endX]))]
  );

  // ---- 이상치: 마디 길이(시간)가 중앙값의 ±40%를 벗어나는 마디 ----
  const measureTimes = [];
  for (let i = 0; i + 1 < bars.length; i++) measureTimes.push(tOf(bars[i + 1]) - tOf(bars[i]));
  const medDur = medianOf(measureTimes);
  const flagged = [];
  if (measureTimes.length >= 5 && medDur > 0) measureTimes.forEach((d, i) => { if (Math.abs(d / medDur - 1) > 0.4) flagged.push(i); });

  function commitBars(nb, newSel) { setBars(nb); setSelIdx(newSel != null ? newSel : null); }
  function deleteSelected() {
    if (selIdx == null) return;
    setBars(bars.filter((_, i) => i !== selIdx)); setSelIdx(null);
  }
  function scrollToX(x) {
    const el = scrollRef.current;
    if (el) el.scrollTo({ left: Math.max(0, x * scale - el.clientWidth / 2), behavior: 'smooth' });
  }
  function playFrom(range) {
    const v = pvRef.current;
    if (!v) return;
    v.muted = false;
    v.currentTime = range.start;
    stopAtRef.current = range.end;
    v.play().catch(() => {});
  }
  function onPvTime() {
    const v = pvRef.current;
    if (v && stopAtRef.current != null && v.currentTime >= stopAtRef.current) { v.pause(); stopAtRef.current = null; }
  }

  async function sendToBuilder() {
    setSending(true);
    try {
      const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
      const items = groupsMeta.map((g, idx) => {
        const c = flowCropStrip(chunks, g.startX, g.endX);
        // 전처리를 거쳤으면(검정 잉크·흰 배경) 반전/재처리 없이 그대로, 전처리를 껐으면 어두운 배경 여부로 invert 판단
        const processed = !!flowDefaults.removeBg;
        const invert = !processed && computeAvgLuminanceFromCanvas(c) < 128;
        return {
          id: 'flow_' + Date.now() + '_' + idx,
          type: 'image', src: c.toDataURL('image/png'),
          invert, override: processed ? { ...MERGED_ROW_NEUTRAL_OVERRIDE } : null,
          lyrics: { tags: [], areaHeightRatio: null },
          playheadExcluded: [], barLayout: null,
          stitchMeta: { source: 'flow', groupIndex: idx, barCount: g.count, byWidth: !!g.byWidth },
          timeRange: g.timeRange,
          videoSourceId: sourceId,
        };
      });
      if (sourceId && videoFile) await dbPut(VIDEO_SOURCE_KEY_PREFIX + sourceId, { videoBlob: videoFile, onsets: [], savedAt: Date.now() });
      await dbPut(VIDEO_IMPORT_KEY, { items, importedAt: Date.now() });
      window.location.href = 'tab-score-builder.html';
    } catch (err) {
      alert('전달 중 오류가 발생했습니다: ' + err.message);
      setSending(false);
    }
  }

  const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
  return (
    <div className="block">
      <div className="block-head"><span>2단계 — 마디 분할 · 시간 매핑 · 악보 빌더로 넘기기</span></div>
      {detecting && <p className="hint-text">마디선 검출 중... {Math.round(detProgress * 100)}%</p>}
      {det && (
        <p className="hint-text">
          {det.staffFound ? ('마디선 ' + bars.length + '개 (마디 ' + Math.max(0, bars.length - 1) + '개) · 연속도 임계 T=' + (det.T != null ? det.T.toFixed(2) : '-')) : '보표(오선)를 찾지 못했습니다.'}
          {det.staffFound && quality.low && <b style={{ color: '#c0392b' }}> · 마디 인식 신뢰도 낮음{det.weak ? ' (마디선 인식 약함)' : ''} — 폭 기준 그룹화로 자동 전환</b>}
          {' · 재생 시각 기준: '}{playbar ? ('재생바 ' + (playbar.source === 'user' ? '(지정) ' : '(자동 감지) ') + Math.round(playbar.x) + 'px') : '재생바 위치 없음 — 아래 슬라이더로 보정'}
        </p>
      )}
      <div className="toolbar">
        <button className="icon-btn" onClick={detect} disabled={detecting}>마디선 다시 검출 (수동 수정 초기화)</button>
        <button className="icon-btn" onClick={deleteSelected} disabled={selIdx == null}>선택한 마디선 삭제{selIdx != null ? ' (x=' + Math.round(bars[selIdx]) + ')' : ''}</button>
        {!playbar && (
          <label style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>시각 보정:
            <input type="range" min="-3" max="3" step="0.05" value={offsetSec} onChange={e => setOffsetSec(parseFloat(e.target.value))} />
            <span className="slider-label" style={{ margin: 0 }}>{offsetSec.toFixed(2)}초</span>
          </label>
        )}
      </div>
      <p className="hint-text" style={{ margin: '4px 0' }}>빈 곳 클릭 = 마디선 추가 · 마디선 클릭 = 선택(삭제 대상) · 드래그 = 위치 미세 조정 · 주황 음영 = 마디 길이(시간) 이상치</p>
      {flagged.length > 0 && (
        <div className="toolbar">
          <b style={{ color: '#e07000' }}>이상 의심 마디 {flagged.length}개 (마디선 누락·과다 의심):</b>
          {flagged.map((i, n) => (
            <button key={i} className="icon-btn" style={{ color: '#e07000', borderColor: '#e07000', fontWeight: 700 }}
              title={'마디 ' + (i + 1) + ' · ' + measureTimes[i].toFixed(2) + '초 (중앙값 ' + medDur.toFixed(2) + '초)'}
              onClick={() => { scrollToX(bars[i]); setSelIdx(i); }}>{CIRCLED[n] || n + 1}</button>
          ))}
        </div>
      )}
      <FlowBarStrip chunks={chunks} totalW={totalW} H={H} scale={scale} bars={bars} flagged={flagged} selIdx={selIdx}
        onSelect={i => setSelIdx(i)} onCommit={commitBars} scrollRef={scrollRef} />

      <div className="hr" />
      <div className="toolbar">
        <label>몇 마디씩 묶기(목표): <input type="number" min="1" max="16" value={groupSize}
          onChange={e => setGroupSizeUser(Math.max(1, parseInt(e.target.value) || 1))} style={{ width: '4em' }} /></label>
        <label>그룹당 최대 마디수: <input type="number" min="1" max="20" value={maxBarsPerGroup}
          onChange={e => setMaxBarsUser(Math.max(1, parseInt(e.target.value) || 1))} style={{ width: '4em' }} /></label>
        <label>그룹 기준:
          <select value={groupBasis} onChange={e => setGroupBasis(e.target.value)} style={{ width: 'auto', marginLeft: '6px' }}>
            <option value="auto">자동 (신뢰도 낮으면 폭 기준)</option>
            <option value="bar">마디선 기준</option>
            <option value="width">폭 기준</option>
          </select>
        </label>
        <span className="hint-text" style={{ margin: 0 }}>자동 기준: 화면 1장 분량{groupSizeUser == null ? ' (목표 ' + autoGroupSize + '마디, 최대 ' + (autoGroupSize + 2) + ')' : ''}</span>
        <span className="save-msg">{useBarGroups ? (Math.max(0, bars.length - 1) + '마디 → ' + groups.length + '개 그룹') : ('폭 기준 분할 → ' + groups.length + '개 그룹')}</span>
      </div>

      {videoUrl && (
        <video ref={pvRef} src={videoUrl} controls onTimeUpdate={onPvTime} style={{ maxWidth: '100%', maxHeight: '220px', background: '#000' }} />
      )}

      <div className="list">
        {groupsMeta.map((g, idx) => (
          <div key={idx} className="block">
            <div className="block-head">
              <span>
                그룹 {idx + 1}: {g.byWidth ? '폭 기준 분할' : (g.count + '마디')}
                <span className="save-msg"> · {g.timeRange.start.toFixed(2)}s ~ {g.timeRange.end.toFixed(2)}s</span>
              </span>
              <button className="icon-btn" onClick={() => playFrom(g.timeRange)} disabled={!videoUrl}>영상에서 확인</button>
            </div>
            {thumbs[idx] && <img src={thumbs[idx]} className="merge-preview-img" alt={'그룹 ' + (idx + 1)} />}
          </div>
        ))}
      </div>

      <div className="toolbar">
        <button onClick={sendToBuilder} disabled={sending || !groups.length}>{sending ? '전달 중...' : 'TAB 악보 만들기로 넘기기 (' + groups.length + '개) →'}</button>
      </div>
    </div>
  );
}

function App() {
  // 1단계: 모드 선택. 'page'(페이지 전환형, 기존 로직 그대로) | 'scroll'(스크롤형, 새 모드) | null(선택 전).
  const [mode, setMode] = useState(null);

  const videoRef = useRef(null);
  const [step, setStep] = useState('capture');
  const [frames, setFrames] = useState([]);
  const [selectedFrameIds, setSelectedFrameIds] = useState(new Set());
  const [items, setItems] = useState([]);
  const [defaults, setDefaults] = useState(VIDEO_DEFAULTS_INIT);
  const [onsets, setOnsets] = useState([]);
  const [videoFile, setVideoFile] = useState(null);
  const [videoSourceId, setVideoSourceId] = useState(null);

  // 스크롤형 전용 상태 — 페이지 전환형의 videoRef/frames/items 등과 완전히 분리된 별도 트리.
  const scrollVideoRef = useRef(null);
  // 연속 이동형 전용 — 별도 <video>와 전처리 설정(스크롤형 설정과 독립)
  const flowVideoRef = useRef(null);
  const [flowDefaults, setFlowDefaults] = useState(SCROLL_DEFAULTS_INIT);
  const [scrollPhase, setScrollPhase] = useState('capture'); // 'capture' (2단계 수동 부분) | 'result' (4~5단계)
  const [scrollDefaults, setScrollDefaults] = useState(SCROLL_DEFAULTS_INIT);
  const [scrollCapture, setScrollCapture] = useState(null); // ScrollCaptureStep의 onDone 결과

  async function goToPreprocess() {
    const selected = frames.filter(f => selectedFrameIds.has(f.id));
    // One id shared by every item built from this extraction session, so the (possibly large) video
    // file + onsets are stored ONCE in tab-score-builder.html's IndexedDB and referenced by id, not
    // duplicated per TAB block.
    const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
    setVideoSourceId(sourceId);
    const built = await Promise.all(selected.map(async f => {
      const img = await loadImage(f.dataUrl);
      const avg = sampleAvgLuminance(img);
      return {
        id: f.id, type: 'image', src: f.dataUrl,
        invert: avg < 128, override: null,
        lyrics: { tags: [], areaHeightRatio: null },
        playheadExcluded: [], barLayout: null, stitchMeta: null,
        // Which span of the source video this page covers, and which stored video source it came
        // from — carried all the way to tab-score-builder.html so the syllable-placement onset-snap
        // mode (a later stage) knows what audio range to play and which onsets apply.
        timeRange: { start: f.segStartT, end: f.segEndT },
        videoSourceId: sourceId,
      };
    }));
    setItems(built);
    setStep('preprocess');
  }

  return (
    <div className="app">
      {/* Always rendered here at the App root (never inside a step wrapper that gets hidden) — a
          <video> nested inside a display:none ancestor can fail to decode frames in Safari even
          when the video element's own styles only make it visually tiny/transparent. Two separate
          elements (one per mode) so switching modes never confuses one mode's seek state with the
          other's — harmless to keep both mounted since only one mode is ever actually driven. */}
      <video ref={videoRef} muted className="hidden-video" />
      <video ref={scrollVideoRef} muted className="hidden-video" />
      <video ref={flowVideoRef} muted playsInline className="hidden-video" />

      <div className="titlebar">
        <h1>영상에서 TAB 추출</h1>

      </div>

      <div className="notice-banner">
        <div>
          <b>안내:</b> 화면이 통째로 바뀌는 <b>"페이지 전환형"</b>과 화면이 계속 흐르듯 넘어가는 <b>"스크롤형"</b> TAB 영상을
          지원합니다 (투명 오버레이형은 아직 지원하지 않습니다). 모든 처리는 이 브라우저 안에서만 이뤄지고, 영상이나 이미지를 서버로
          전송하지 않습니다.
        </div>
      </div>

      {mode === null && (
        <div className="block">
          <div className="block-head"><span>1단계 — 영상 종류 선택</span></div>
          <p className="hint-text">영상이 어떤 방식으로 넘어가는지에 따라 처리 방식이 완전히 다릅니다 — 맞는 쪽을 골라주세요.</p>
          <div className="mode-card-row">
            <button className="mode-card" onClick={() => setMode('page')}>
              <div className="mode-card-title">페이지 전환형</div>
              <div className="mode-card-desc">화면이 통째로 다음 페이지로 넘어가는 영상</div>
            </button>
            <button className="mode-card" onClick={() => setMode('scroll')}>
              <div className="mode-card-title">스크롤형</div>
              <div className="mode-card-desc">화면이 멈추지 않고 계속 옆/위로 흘러가듯 넘어가는 영상</div>
            </button>
            <button className="mode-card" onClick={() => setMode('flow')}>
              <div className="mode-card-title">연속 이동형</div>
              <div className="mode-card-desc">악보가 멈춤 없이 계속 흐르는 영상</div>
            </button>
          </div>
        </div>
      )}

      {mode === 'page' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className={step === 'capture' ? 'step active' : 'step'}>1. 영역 지정 · 추출</span>
            <span className="arrow">→</span>
            <span className={step === 'select' ? 'step active' : 'step'}>2. 프레임 선택</span>
            <span className="arrow">→</span>
            <span className={step === 'preprocess' ? 'step active' : 'step'}>3. 전처리 · 전달</span>
          </div>

          {/* Each step stays mounted (display:none when inactive, not unmounted) so its state — loaded
              video, ROI, diff analysis, per-frame overrides — survives moving back and forth. */}
          <div style={{ display: step === 'capture' ? 'block' : 'none' }}>
            <CaptureStep videoRef={videoRef} frames={frames} setFrames={setFrames}
              onsets={onsets} setOnsets={setOnsets} videoFile={videoFile} setVideoFile={setVideoFile}
              onNext={() => { setSelectedFrameIds(new Set(frames.map(f => f.id))); setStep('select'); }} />
          </div>
          <div style={{ display: step === 'select' ? 'block' : 'none' }}>
            <SelectStep frames={frames} selectedFrameIds={selectedFrameIds} setSelectedFrameIds={setSelectedFrameIds}
              onBack={() => setStep('capture')} onNext={goToPreprocess} />
          </div>
          <div style={{ display: step === 'preprocess' ? 'block' : 'none' }}>
            <PreprocessStep items={items} setItems={setItems} defaults={defaults} setDefaults={setDefaults}
              videoFile={videoFile} onsets={onsets} videoSourceId={videoSourceId}
              onBack={() => setStep('select')} />
          </div>
        </React.Fragment>
      )}

      {mode === 'scroll' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className={scrollPhase === 'capture' ? 'step active' : 'step'}>2. 영역 지정 · 스크롤 구간 조정</span>
            <span className="arrow">→</span>
            <span className={scrollPhase === 'result' ? 'step active' : 'step'}>4~5. 결과 · 재조정 · 전달</span>
          </div>
          <div style={{ display: scrollPhase === 'capture' ? 'block' : 'none' }}>
            <ScrollCaptureStep videoRef={scrollVideoRef} scrollDefaults={scrollDefaults} setScrollDefaults={setScrollDefaults}
              onDone={result => { setScrollCapture(result); setScrollPhase('result'); }}
              onModeBack={() => setMode(null)} />
          </div>
          {scrollPhase === 'result' && scrollCapture && (
            <div style={{ display: 'block' }}>
              <ScrollResultStep videoRef={scrollVideoRef} scrollCapture={scrollCapture} scrollDefaults={scrollDefaults}
                onBack={() => setScrollPhase('capture')} onModeBack={() => setMode(null)} />
            </div>
          )}
        </React.Fragment>
      )}

      {mode === 'flow' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className="step active">연속 이동형 1단계 · 이동량 추적 + 스트립 재구성</span>
          </div>
          <FlowStep videoRef={flowVideoRef} flowDefaults={flowDefaults} setFlowDefaults={setFlowDefaults} onModeBack={() => setMode(null)} />
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
