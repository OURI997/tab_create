    </div>
  );
}

// ================================================================================================
// 연속 이동형 2단계 — 마디 분할 + 악보 빌더로 넘기기. 1단계 결과(스트립 조각 목록, x(t))를 입력으로만 쓴다.
// ================================================================================================

// 스트립 전체 좌표 [x0,x1) 구간을 조각 목록에서 잘라 한 장으로 이어 그린다 (조각 경계에 걸쳐도 연속)
function flowCropStrip(chunks, x0, x1) {
  x0 = Math.max(0, Math.round(x0));
  const H = chunks[0].height;
  const w = Math.max(1, Math.round(x1) - x0);
  const out = document.createElement('canvas');
  out.width = w; out.height = H;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, w, H);
  let base = 0;
  for (const c of chunks) {
    const cs = base, ce = base + c.width;
    const a = Math.max(x0, cs), b = Math.min(x0 + w, ce);
    if (b > a) ctx.drawImage(c, a - cs, 0, b - a, H, a - x0, 0, b - a, H);
    base = ce;
  }
  return out;
}

// 조각별로 기존 마디선 검출(detectStaffSystem / detectBarsThroughSystem — 밴드 정확 일치·재생바 제외 규칙 포함)을
// 실행하고 전체 좌표로 합친다. 조각 경계 ±(오선 간격×3)는 인접 조각을 이어 붙인 확장 캔버스에서 검사하고, 각 마디선은
// 그것이 속한 조각 한 곳에서만 채택해(소유권) 경계에서 갈라지거나 중복되지 않게 한다. 헤더 제외는 첫 조각만.
// 첫 마디선 검출에서 제외할 머리 부분(TAB 표시·박자표) 폭 — 오선 간격 기준. 20이면 못갖춘마디(Misty 첫 마디)의 마디선까지 지워졌다
const FLOW_HEADER_SPACES = 10;
async function flowDetectBars(chunks, nativeW, onProgress) {
  const starts = [];
  let total = 0;
  for (const c of chunks) { starts.push(total); total += c.width; }
  const g0 = scrollGetFullGrayData(chunks[0]);
  const sys0 = detectStaffSystem(g0, 0.3, 140);
  const blank = new Uint8Array(total);
  if (!sys0) return { bars: [], weak: true, staffFound: false, blank, space: 12, total, T: null };
  const space = sys0.space;
  const margin = Math.max(40, Math.round(space * 3));
  const ext = i => {
    const x0 = Math.max(0, starts[i] - margin), x1 = Math.min(total, starts[i] + chunks[i].width + margin);
    return { canvas: flowCropStrip(chunks, x0, x1), x0 };
  };
  // 연속도 임계 T: 첫 조각에서 0.9부터 0.05씩 낮추며 마디 수가 기대치 이상이 될 때까지 (기존 자동 규칙과 동일), 전체에 동일 적용
  const e0 = ext(0);
  const gE = scrollGetFullGrayData(e0.canvas);
  const sysE = detectStaffSystem(gE, 0.3, 140);
  const leftE = sysE ? staffLeftEdge(gE, sysE) : 0;
  const expectMin = 0.5 * nativeW / (space * 10);
  let T = 0.9, weak = false;
  if (sysE) {
    let res = null;
    for (const t of [0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.55, 0.5]) {
      T = t;
      res = detectBarsThroughSystem(gE, sysE, T, leftE, 140, null, FLOW_HEADER_SPACES);
      if (res.bars.length >= expectMin) break;
    }
    weak = !res || res.bars.length < expectMin;
  } else weak = true;
  const all = [];
  for (let i = 0; i < chunks.length; i++) {
    const e = i === 0 ? { canvas: e0.canvas, x0: 0 } : ext(i);
    const g = i === 0 ? gE : scrollGetFullGrayData(e.canvas);
    // 띠는 한 줄이라 오선 위치가 모든 조각에서 같다. 조각마다 다시 찾으면 코드 그림(가로줄 격자)이 많은 조각에서 실패해
    // 그 조각의 마디선을 통째로 놓쳤다(Misty 마지막 2천 px에서 5개) → 못 찾거나 위치가 다르면 첫 조각의 오선을 쓴다
    let sys = i === 0 ? sysE : detectStaffSystem(g, 0.3, 140);
    if (i > 0 && sysE && (!sys || Math.abs(sys.main.top - sysE.main.top) > sysE.space || Math.abs(sys.main.bottom - sysE.main.bottom) > sysE.space)) sys = sysE;
    if (sys) {
      const r = detectBarsThroughSystem(g, sys, T, i === 0 ? staffLeftEdge(g, sys) : 0, 140, null, i === 0 ? FLOW_HEADER_SPACES : 0);
      const lo = starts[i], hi = starts[i] + chunks[i].width;
      for (const b of r.bars) {
        const gx = b.x + e.x0;
        if (gx >= lo && gx < hi) all.push({ x: gx, score: b.score, gapConn: b.gapConn });
      }
      const bl = computeBlankColumns(g, sys, 140);
      for (let gx = lo; gx < hi; gx++) { const lx = gx - e.x0; if (lx >= 0 && lx < bl.length) blank[gx] = bl[lx]; }
    }
    if (onProgress) onProgress((i + 1) / chunks.length);
    await flowYield();
  }
  all.sort((p, q) => p.x - q.x);
  // 경계 근처에서 같은 마디선이 약간 다른 위치로 두 번 잡힌 경우 정리 + 기존 이웃 정리 규칙
  const tol = Math.max(3, space * 0.4);
  const merged = [];
  for (const b of all) {
    const last = merged[merged.length - 1];
    if (last && b.x - last.x <= tol) { if (b.score > last.score) merged[merged.length - 1] = b; }
    else merged.push(b);
  }
  const kept = pruneCloseBarObjs(merged);
  let bars = [staffLeftEdge(g0, sys0), ...kept.map(b => b.x)];
  if (total - 1 - bars[bars.length - 1] > space * 4) bars.push(total - 1);
  return { bars, weak, staffFound: true, blank, space, total, T };
}

// 재생바 열(원본 해상도 px): 지정했으면 그 열, 아니면 정적 열 중 ROI 가장자리가 아닌 좁은 열이 정확히 하나일 때 그 열
function flowResolvePlaybar(track) {
  const W = track.nativeW;
  if (track.barCols) return { x: (track.barCols[0] + track.barCols[1]) / 2, source: 'user' };
  const cands = track.staticRanges.filter(r => r[0] > W * 0.02 && r[1] < W * 0.98 && (r[1] - r[0]) <= W * 0.04);
  if (cands.length === 1) return { x: (cands[0][0] + cands[0][1]) / 2, source: 'auto' };
  return null;
}

// 누적 이동량 X가 target에 처음 도달하는 시각 (x(t)의 역변환). X는 단조 증가하도록 보정해서 쓴다.
function flowInvX(T, Xm, target) {
  const n = T.length;
  if (target <= Xm[0]) return T[0];
  if (target >= Xm[n - 1]) return T[n - 1];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (Xm[m] >= target) hi = m; else lo = m; }
  const dx = Xm[hi] - Xm[lo];
  return T[lo] + (dx > 1e-9 ? (target - Xm[lo]) / dx : 0) * (T[hi] - T[lo]);
}

// 스트립 위 마디선 오버레이 + 수동 보정: 빈 곳 클릭 = 추가, 마디선 클릭 = 선택(삭제 대상), 드래그 = 위치 미세 조정.
// 드래그 중에는 화면 위치만 갱신하고, 놓을 때 한 번만 상위로 커밋해서 그룹이 재계산된다.
function FlowBarStrip({ chunks, totalW, H, scale, bars, flagged, selIdx, onSelect, onCommit, scrollRef }) {
  const [drag, setDrag] = useState(null);
  const dragRef = useRef(null);
  const latest = useRef({});
  latest.current = { bars, onCommit, onSelect, scale, totalW };
  useEffect(() => {
    function onMove(e) {
      const d = dragRef.current;
      if (!d) return;
      const dx = e.clientX - d.startClient;
      if (!d.moved && Math.abs(dx) < 3) return;
      d.moved = true;
      d.x = Math.max(0, Math.min(latest.current.totalW - 1, d.origX + dx / latest.current.scale));
      setDrag({ i: d.i, x: d.x });
    }
    function onUp() {
      const d = dragRef.current;
      dragRef.current = null;
      if (!d) return;
      setDrag(null);
      const L = latest.current;
      if (d.moved) {
        const nb = L.bars.slice();
        nb[d.i] = Math.round(d.x);
        nb.sort((a, b) => a - b);
        L.onCommit(nb, nb.indexOf(Math.round(d.x)));
      } else L.onSelect(d.i);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
  }, []);
  function onBgClick(e) {
    if (e.target !== e.currentTarget) return;
    const r = e.currentTarget.getBoundingClientRect();
    const x = Math.round((e.clientX - r.left) / scale);
    const nb = [...bars, x].sort((a, b) => a - b);
    onCommit(nb, nb.indexOf(x));
  }
  return (
    <div ref={scrollRef} style={{ overflowX: 'auto', border: '1px solid var(--border-strong)', background: '#fff' }}>
      <div style={{ position: 'relative', width: Math.round(totalW * scale), height: Math.round(H * scale) }}>
        <div style={{ display: 'flex', position: 'absolute', left: 0, top: 0 }}>
          {chunks.map((c, i) => <FlowChunkView key={i} chunk={c} scale={scale} />)}
        </div>
        <div onClick={onBgClick} style={{ position: 'absolute', left: 0, top: 0, right: 0, bottom: 0, cursor: 'copy' }}>
          {flagged.map(i => bars[i + 1] != null && (
            <div key={'f' + i} style={{ position: 'absolute', left: bars[i] * scale, width: (bars[i + 1] - bars[i]) * scale, top: 0, bottom: 0, background: 'rgba(255,140,0,0.25)', pointerEvents: 'none' }} />
          ))}
          {bars.map((b, i) => {
            const x = drag && drag.i === i ? drag.x : b;
            const sel = i === selIdx;
            return (
              <div key={i}
                onPointerDown={e => { e.preventDefault(); e.stopPropagation(); dragRef.current = { i, startClient: e.clientX, origX: b, moved: false, x: b }; }}
                style={{ position: 'absolute', left: x * scale - 5, width: 10, top: 0, bottom: 0, cursor: 'ew-resize' }}>
                <div style={{ position: 'absolute', left: 4, width: sel ? 3 : 2, top: 0, bottom: 0, background: sel ? '#ff9500' : '#e02020', pointerEvents: 'none' }} />
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

function FlowStage2({ result, videoFile, flowDefaults }) {
  const { chunks, totalW, H, track, stats } = result;
  const nativeW = track.nativeW;
  const [det, setDet] = useState(null);
  const [detecting, setDetecting] = useState(false);
  const [detProgress, setDetProgress] = useState(0);
  const [bars, setBars] = useState([]);
  const [selIdx, setSelIdx] = useState(null);
  const [groupSizeUser, setGroupSizeUser] = useState(null);
  const [maxBarsUser, setMaxBarsUser] = useState(null);
  const [groupBasis, setGroupBasis] = useState('auto');
  const [offsetSec, setOffsetSec] = useState(0);
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);
  const pvRef = useRef(null);
  const stopAtRef = useRef(null);
  const scale = Math.min(1, 180 / H);

  async function detect() {
    setDetecting(true); setDetProgress(0); setSelIdx(null);
    try {
      const r = await flowDetectBars(chunks, nativeW, f => setDetProgress(f));
      setDet(r); setBars(r.bars);
    } finally { setDetecting(false); }
  }
  useEffect(() => { detect(); }, [result]);

  const videoUrl = useMemo(() => (videoFile ? URL.createObjectURL(videoFile) : null), [videoFile]);
  useEffect(() => () => { if (videoUrl) URL.revokeObjectURL(videoUrl); }, [videoUrl]);

  // ---- 시간 매핑: 스트립 x → 재생 시각 ----
  // 스트립 좌표 s의 내용이 재생바 열 p를 지나는 시각 = X(t) − X(첫 프레임) = s − p 가 되는 t (x(t)의 역변환)
  const playbar = useMemo(() => flowResolvePlaybar(track), [track]);
  const Xm = useMemo(() => {
    const out = [];
    let m = -Infinity;
    for (const v of track.X) { m = Math.max(m, v); out.push(m); }
    return out;
  }, [track]);
  const Xf = useMemo(() => flowInterpX(track, result.tFirst != null ? result.tFirst : track.t[track.k0]), [track, result]);
  const dur = track.t[track.t.length - 1];
  const tOf = s => {
    const p = playbar ? playbar.x : 0;
    const t = flowInvX(track.t, Xm, s - p + Xf) + (playbar ? 0 : offsetSec);
    return Math.max(0, Math.min(dur, t));
  };

  // ---- 그룹화 (기존 groupBarsByTargetWidth / groupByWidth와 같은 UI·기본값 규칙) ----
  const quality = useMemo(() => assessBarQuality(bars, totalW, nativeW, det ? det.weak : true), [bars, totalW, nativeW, det]);
  const measureW = useMemo(() => robustMeasureWidth(bars), [bars]);
  const autoGroupSize = quality.medianWidth ? Math.max(2, Math.min(6, Math.round(nativeW / quality.medianWidth))) : 4;
  const groupSize = groupSizeUser != null ? groupSizeUser : autoGroupSize;
  const maxBarsPerGroup = Math.max(maxBarsUser != null ? maxBarsUser : groupSize + 2, groupSize);
  const useBarGroups = bars.length >= 2 && (groupBasis === 'bar' || (groupBasis === 'auto' && !quality.low));
  let groups = [];
  if (det) {
    if (useBarGroups) groups = groupBarsByTargetWidth(bars, groupSize, maxBarsPerGroup);
    else groups = groupByWidth(totalW, groupSize, maxBarsPerGroup, measureW, nativeW, bars, det.blank, det.space);
  }
  const groupsMeta = groups.map((g, i) => {
    const start = tOf(g.startX);
    const end = i + 1 < groups.length ? tOf(groups[i + 1].startX) : tOf(g.endX);
    return { ...g, timeRange: { start, end: Math.max(start, end) } };
  });
  const thumbs = useMemo(
    () => groupsMeta.map(g => flowCropStrip(chunks, g.startX, g.endX).toDataURL('image/png')),
    // eslint-disable-next-line
    [chunks, JSON.stringify(groups.map(g => [g.startX, g.endX]))]
  );

  // ---- 이상치: 마디 길이(시간)가 중앙값의 ±40%를 벗어나는 마디 ----
  const measureTimes = [];
  for (let i = 0; i + 1 < bars.length; i++) measureTimes.push(tOf(bars[i + 1]) - tOf(bars[i]));
  const medDur = medianOf(measureTimes);
  const flagged = [];
  if (measureTimes.length >= 5 && medDur > 0) measureTimes.forEach((d, i) => { if (Math.abs(d / medDur - 1) > 0.4) flagged.push(i); });

  function commitBars(nb, newSel) { setBars(nb); setSelIdx(newSel != null ? newSel : null); }
  function deleteSelected() {
    if (selIdx == null) return;
    setBars(bars.filter((_, i) => i !== selIdx)); setSelIdx(null);
  }
  function scrollToX(x) {
    const el = scrollRef.current;
    if (el) el.scrollTo({ left: Math.max(0, x * scale - el.clientWidth / 2), behavior: 'smooth' });
  }
  function playFrom(range) {
    const v = pvRef.current;
    if (!v) return;
    v.muted = false;
    v.currentTime = range.start;
    stopAtRef.current = range.end;
    v.play().catch(() => {});
  }
  function onPvTime() {
    const v = pvRef.current;
    if (v && stopAtRef.current != null && v.currentTime >= stopAtRef.current) { v.pause(); stopAtRef.current = null; }
  }

  async function sendToBuilder() {
    setSending(true);
    try {
      const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
      const items = groupsMeta.map((g, idx) => {
        const c = flowCropStrip(chunks, g.startX, g.endX);
        // 전처리를 거쳤으면(검정 잉크·흰 배경) 반전/재처리 없이 그대로, 전처리를 껐으면 어두운 배경 여부로 invert 판단
        const processed = !!flowDefaults.removeBg;
        const invert = !processed && computeAvgLuminanceFromCanvas(c) < 128;
        return {
          id: 'flow_' + Date.now() + '_' + idx,
          type: 'image', src: c.toDataURL('image/png'),
          invert, override: processed ? { ...MERGED_ROW_NEUTRAL_OVERRIDE } : null,
          lyrics: { tags: [], areaHeightRatio: null },
          playheadExcluded: [], barLayout: null,
          stitchMeta: { source: 'flow', groupIndex: idx, barCount: g.count, byWidth: !!g.byWidth },
          timeRange: g.timeRange,
          videoSourceId: sourceId,
        };
      });
      if (sourceId && videoFile) await dbPut(VIDEO_SOURCE_KEY_PREFIX + sourceId, { videoBlob: videoFile, onsets: [], savedAt: Date.now() });
      await dbPut(VIDEO_IMPORT_KEY, { items, importedAt: Date.now() });
      window.location.href = 'tab-score-builder.html';
    } catch (err) {
      alert('전달 중 오류가 발생했습니다: ' + err.message);
      setSending(false);
    }
  }

  const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
  return (
    <div className="block">
      <div className="block-head"><span>2단계 — 마디 분할 · 시간 매핑 · 악보 빌더로 넘기기</span></div>
      {detecting && <p className="hint-text">마디선 검출 중... {Math.round(detProgress * 100)}%</p>}
      {det && (
        <p className="hint-text">
          {det.staffFound ? ('마디선 ' + bars.length + '개 (마디 ' + Math.max(0, bars.length - 1) + '개) · 연속도 임계 T=' + (det.T != null ? det.T.toFixed(2) : '-')) : '보표(오선)를 찾지 못했습니다.'}
          {det.staffFound && quality.low && <b style={{ color: '#c0392b' }}> · 마디 인식 신뢰도 낮음{det.weak ? ' (마디선 인식 약함)' : ''} — 폭 기준 그룹화로 자동 전환</b>}
          {' · 재생 시각 기준: '}{playbar ? ('재생바 ' + (playbar.source === 'user' ? '(지정) ' : '(자동 감지) ') + Math.round(playbar.x) + 'px') : '재생바 위치 없음 — 아래 슬라이더로 보정'}
        </p>
      )}
      <div className="toolbar">
        <button className="icon-btn" onClick={detect} disabled={detecting}>마디선 다시 검출 (수동 수정 초기화)</button>
        <button className="icon-btn" onClick={deleteSelected} disabled={selIdx == null}>선택한 마디선 삭제{selIdx != null ? ' (x=' + Math.round(bars[selIdx]) + ')' : ''}</button>
        {!playbar && (
          <label style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>시각 보정:
            <input type="range" min="-3" max="3" step="0.05" value={offsetSec} onChange={e => setOffsetSec(parseFloat(e.target.value))} />
            <span className="slider-label" style={{ margin: 0 }}>{offsetSec.toFixed(2)}초</span>
          </label>
        )}
      </div>
      <p className="hint-text" style={{ margin: '4px 0' }}>빈 곳 클릭 = 마디선 추가 · 마디선 클릭 = 선택(삭제 대상) · 드래그 = 위치 미세 조정 · 주황 음영 = 마디 길이(시간) 이상치</p>
      {flagged.length > 0 && (
        <div className="toolbar">
          <b style={{ color: '#e07000' }}>이상 의심 마디 {flagged.length}개 (마디선 누락·과다 의심):</b>
          {flagged.map((i, n) => (
            <button key={i} className="icon-btn" style={{ color: '#e07000', borderColor: '#e07000', fontWeight: 700 }}
              title={'마디 ' + (i + 1) + ' · ' + measureTimes[i].toFixed(2) + '초 (중앙값 ' + medDur.toFixed(2) + '초)'}
              onClick={() => { scrollToX(bars[i]); setSelIdx(i); }}>{CIRCLED[n] || n + 1}</button>
          ))}
        </div>
      )}
      <FlowBarStrip chunks={chunks} totalW={totalW} H={H} scale={scale} bars={bars} flagged={flagged} selIdx={selIdx}
        onSelect={i => setSelIdx(i)} onCommit={commitBars} scrollRef={scrollRef} />

      <div className="hr" />
      <div className="toolbar">
        <label>몇 마디씩 묶기(목표): <IntInput min={1} max={16} value={groupSize} onCommit={setGroupSizeUser} style={{ width: '4em' }} /></label>
        <label>그룹당 최대 마디수: <IntInput min={1} max={20} value={maxBarsPerGroup} onCommit={setMaxBarsUser} style={{ width: '4em' }} /></label>
        <label>그룹 기준:
          <select value={groupBasis} onChange={e => setGroupBasis(e.target.value)} style={{ width: 'auto', marginLeft: '6px' }}>
            <option value="auto">자동 (신뢰도 낮으면 폭 기준)</option>
            <option value="bar">마디선 기준</option>
            <option value="width">폭 기준</option>
          </select>
        </label>
        <span className="hint-text" style={{ margin: 0 }}>자동 기준: 화면 1장 분량{groupSizeUser == null ? ' (목표 ' + autoGroupSize + '마디, 최대 ' + (autoGroupSize + 2) + ')' : ''}</span>
        <span className="save-msg">{useBarGroups ? (Math.max(0, bars.length - 1) + '마디 → ' + groups.length + '개 그룹') : ('폭 기준 분할 → ' + groups.length + '개 그룹')}</span>
      </div>

      {videoUrl && (
        <video ref={pvRef} src={videoUrl} controls onTimeUpdate={onPvTime} style={{ maxWidth: '100%', maxHeight: '220px', background: '#000' }} />
      )}

      <div className="list">
        {groupsMeta.map((g, idx) => (
          <div key={idx} className="block">
            <div className="block-head">
              <span>
                그룹 {idx + 1}: {g.byWidth ? '폭 기준 분할' : (g.count + '마디')}
                <span className="save-msg"> · {g.timeRange.start.toFixed(2)}s ~ {g.timeRange.end.toFixed(2)}s</span>
              </span>
              <button className="icon-btn" onClick={() => playFrom(g.timeRange)} disabled={!videoUrl}>영상에서 확인</button>
            </div>
            {thumbs[idx] && <img src={thumbs[idx]} className="merge-preview-img" alt={'그룹 ' + (idx + 1)} />}
          </div>
        ))}
      </div>

      <div className="toolbar">
        <button onClick={sendToBuilder} disabled={sending || !groups.length}>{sending ? '전달 중...' : 'TAB 악보 만들기로 넘기기 (' + groups.length + '개) →'}</button>
      </div>
    </div>
  );
}

// ================================================================================================
// 통합(자동 감지) 모드 — A단계: 구간 분류 + 타임라인 시각화
// 영상을 한 번 순차 재생하며 ROI 저해상도 프레임을 모으고, 인접 프레임 쌍마다 diff / 가로 이동량(dx) / 신뢰도를 계산해
// 구간을 정지(static) · 연속 이동(flow) · 컷 전환(cut)으로 나눈다. 구간별 악보 추출·이음·빌더 전송은 B단계.
// 기존 헬퍼(flowPlayPass, flowMakeLowCapture, flowFindShift, flowToZeroMeanRows, flowDetectStaticCols, seekSafe,
// ScrollRoiPicker, MiniRangeTimeline)는 호출만 하고 이 모드 전용 함수는 모두 uni 접두어로 독립 구현한다.
// ================================================================================================

const UNI_KIND_LABEL = { static: '완전정지', page: '페이지(고정)', flow: '연속 이동', nudge: '미세 이동', cut: '컷', dissolve: '디졸브', slide: '슬라이드' };
const UNI_KIND_COLOR = { static: '#b5b5b5', page: '#a8dcae', flow: '#4a7bd0', nudge: '#a9bfe8', cut: '#b71c1c', dissolve: '#e53935', slide: '#ef9a9a' };
const uniIsTrans = k => k === 'cut' || k === 'dissolve' || k === 'slide' || k === 'nudge'; // 전환성 이벤트 (추출 대상이 아님)
function uniClamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function uniQuantile(sortedArr, p) { return sortedArr.length ? sortedArr[Math.floor(p * (sortedArr.length - 1))] : 0; }
// ---- 프레임 쌍별 측정: diff, peak0(이동 0에서의 상관), 최적 dx와 신뢰도, residual / alignGain ----
// residual = 이전 프레임을 dx만큼 이동해 겹친 영역의 평균 절대 차이, alignGain = residual / diff (작을수록 이동으로 잘 설명됨)
function uniResidual(a, b, w, h, mask, s) {
  let sum = 0, n = 0;
  for (let y = 0; y < h; y++) {
    const base = y * w;
    for (let x = 0; x < w - s; x++) {
      if (mask[x] || mask[x + s]) continue;
      sum += Math.abs(a[base + x + s] - b[base + x]);
      n++;
    }
  }
  return n ? sum / n : 0;
}

async function uniAnalyze({ video, roi, startT, endT, rate, abortRef, onProgress }) {
  const samples = [];
  // 자동 지정 영역이면 움직임 판정은 TAB 오선 띠(core)만으로 한다 — 추출은 코드·가사까지 포함한 전체 영역으로 한다
  const aroi = roi && roi.core ? { x0: roi.x0, x1: roi.x1, y0: roi.core.y0, y1: roi.core.y1 } : roi;
  const cap = flowMakeLowCapture(video, aroi, 480);
  await flowPlayPass(video, {
    startT, endT, rate, minGap: 0.1, abortRef,
    onFrame: t => samples.push(cap(t)),
    onProgress: f => onProgress('1/2 프레임 수집 (순차 재생)', f * 0.5),
  });
  if (abortRef.current) return null;
  if (samples.length < 4) throw new Error('수집된 프레임이 너무 적습니다. 추출 구간을 늘려 보세요.');
  const { w, h } = samples[0];
  const nativeW = Math.round(roiRectPx(video, roi).rw);
  const scale = nativeW / w;
  const mask = flowDetectStaticCols(samples, w, h); // 재생바 등 정적 열은 이동량 계산에서 제외
  const recs = [];
  let prevF = flowToZeroMeanRows(samples[0]);
  let vPrev = null; // 저해상도 px/s
  for (let k = 1; k < samples.length; k++) {
    if (abortRef.current) return null;
    const a = samples[k - 1].gray, b = samples[k].gray;
    let sum = 0;
    for (let i = 0; i < a.length; i++) sum += Math.abs(a[i] - b[i]);
    const diff = sum / a.length;
    const curF = flowToZeroMeanRows(samples[k]);
    const dt = Math.max(1e-3, samples[k].t - samples[k - 1].t);
    const peak0 = flowNccAt(prevF, curF, w, h, mask, 0); // 이동 0에서의 상관 — 고정 페이지 판별의 기준
    let r, residual = diff, alignGain = 1;
    if (peak0 >= 0.85 || diff < 0.5) {
      // 고정 페이지(또는 변화 없는 빈 화면): 이동량 탐색이 필요 없다
      r = { shift: 0, peak: peak0, second: 0, margin: 1 };
      vPrev = null;
    } else {
      if (vPrev == null) r = flowFindShift(prevF, curF, w, h, mask, 0, 0.3 * w);
      else {
        const e = vPrev * dt;
        r = flowFindShift(prevF, curF, w, h, mask, Math.max(0, e * 0.5 - 1), e * 1.5 + Math.max(2, 0.03 * w));
      }
      if (r.peak < 0.5 || r.margin < 0.1) { // 속도가 급변했을 수 있어 넓은 범위로 한 번 더
        const wide = flowFindShift(prevF, curF, w, h, mask, 0, 0.3 * w);
        if (wide.peak > r.peak) r = wide;
      }
      const sInt = Math.max(0, Math.min(w - 8, Math.round(r.shift)));
      residual = uniResidual(a, b, w, h, mask, sInt);
      alignGain = diff > 1e-6 ? residual / diff : 1;
      if (r.peak >= 0.5 && r.margin >= 0.1 && r.shift > 0.8) vPrev = r.shift / dt; else vPrev = null;
    }
    recs.push({
      t0: samples[k - 1].t, t: samples[k].t, dt, diff, dxLow: r.shift, dxNative: r.shift * scale,
      speed: (r.shift * scale) / dt, peak: r.peak, second: r.second, margin: r.margin, peak0, residual, alignGain,
    });
    prevF = curF;
    if (k % 40 === 0) { onProgress('2/2 구간 분류용 이동량 계산', 0.5 + 0.5 * (k / samples.length)); await flowYield(); }
  }
  return { recs, scale, nativeW, w, h, usedRvfc: flowRvfcSupported(video) };
}

// ---- 프레임 쌍별 라벨/점수 (판별은 diff 절대값이 아니라 peak0 기준) ----
//  peak0 ≥ 0.85            → page (diff < staticThr면 hold, 아니면 playhead). trans/flow/cut이 될 수 없다.
//  peak0 < 0.85            → 정렬 분석: flow = alignGain < 0.35 AND |속도| ≤ ROI폭×0.6 px/초 AND 최적 dx의 peak ≥ 0.85
//                            그 외 peak0 < 0.5 → cut (peak 값과 무관), 0.5~0.85 → mid(디졸브 후보)
function uniLabelPairs(recs, nativeW) {
  const sorted = recs.map(r => r.diff).sort((a, b) => a - b);
  const med = uniQuantile(sorted, 0.5), p10 = uniQuantile(sorted, 0.1);
  const staticThr = uniClamp(2 * p10, 0.5, 4); // hold(완전히 같은 화면) 판별용 — 이동/전환 판별에는 쓰지 않는다
  const pageThr = 0.85, cutPeak0 = 0.5, maxSpeedFrac = 0.6, minDx = 0.8;
  const maxSpeed = maxSpeedFrac * nativeW;
  for (const r of recs) {
    if (r.peak0 >= pageThr) {
      r.label = 'page';
      r.sub = r.diff < staticThr ? 'hold' : 'playhead';
      r.score = uniClamp(r.peak0, 0.3, 1);
      continue;
    }
    if (r.diff < staticThr) { r.label = 'static'; r.score = uniClamp(1 - r.diff / staticThr, 0.3, 1); continue; } // 내용 상관이 없는 빈 화면 등
    const flowOk = r.dxLow >= minDx && r.alignGain < 0.35 && Math.abs(r.speed) <= maxSpeed && r.peak >= 0.85;
    if (flowOk) { r.label = 'flow'; r.score = uniClamp(Math.min(r.peak, 1 - r.alignGain), 0.3, 1); }
    else if (r.peak0 < cutPeak0) { r.label = 'cut'; r.score = uniClamp(1 - Math.max(0, r.peak0), 0.3, 1); }
    else { r.label = 'mid'; r.score = 0.5; }
  }
  return { med, p10, staticThr, pageThr, cutPeak0, maxSpeedFrac, maxSpeed, minDx };
}

function uniSegPairs(recs, start, end) { return recs.filter(r => r.t > start + 1e-6 && r.t0 < end - 1e-6); }
function uniLabelOfKind(kind) { return kind === 'dissolve' ? 'mid' : (kind === 'nudge' ? 'flow' : kind); }
function uniMatchScore(label, kind, score) {
  if (label === uniLabelOfKind(kind)) return score;
  if ((kind === 'dissolve' || kind === 'slide') && label === 'flow') return 0.6;
  return 0.2;
}

// flow 구간 검증: 길이 ≥1초, 속도 변동계수 CV < 0.5, 상관 peak ≥0.85인 쌍이 대부분(≥70%), 총 이동량 ≥ ROI 폭의 20%
function uniFlowEvidence(pairs, start, end, nativeW) {
  const flowPairs = pairs.filter(p => p.label === 'flow');
  const speeds = flowPairs.map(p => p.speed);
  const mean = speeds.length ? speeds.reduce((s, v) => s + v, 0) / speeds.length : 0;
  const sd = speeds.length > 1 ? Math.sqrt(speeds.reduce((s, v) => s + (v - mean) * (v - mean), 0) / speeds.length) : 0;
  const cv = mean > 0 ? sd / mean : 9;
  const total = flowPairs.reduce((s, p) => s + p.dxNative, 0);
  const peakFrac = pairs.length ? pairs.filter(p => p.peak >= 0.85).length / pairs.length : 0;
  const len = end - start;
  const ok = len >= 1.0 && cv < 0.5 && peakFrac >= 0.7 && total >= 0.2 * nativeW && flowPairs.length >= 2;
  return { ok, cv, total, peakFrac, speed: mean, len };
}

// 구간 만들기:
//  1) 쌍 라벨 런 (연속된 컷 간격은 하나의 cut 이벤트로 합쳐진다)
//  2) 흡수는 flow 안에 끼어 있는 짧은(<0.4초) page 조각만 — 컷·flow·dissolve 이벤트는 길이와 무관하게 절대 흡수하지 않는다
//  3) flow 검증, mid 런은 2~4개 간격 + diff 단조 증가일 때만 확정 dissolve(아니면 확인 필요)
//  4) page 구간 무결성 검증: 안에 peak0 < 0.85 간격이 있으면 그 지점에서 분할
function uniBuildSegments(recs, minLen, ctx) {
  let runs = [];
  for (const r of recs) {
    const last = runs[runs.length - 1];
    if (last && last.kind === r.label) last.end = r.t;
    else runs.push({ kind: r.label, start: r.t0, end: r.t });
  }
  const mergeSame = () => {
    const out = [];
    for (const r of runs) {
      const last = out[out.length - 1];
      if (last && last.kind === r.kind) last.end = r.end; else out.push({ ...r });
    }
    runs = out;
  };
  for (let guard = 0; guard < 300; guard++) {
    let idx = -1, best = Infinity;
    runs.forEach((r, i) => {
      if (r.kind !== 'page') return;
      const len = r.end - r.start;
      const prev = runs[i - 1], next = runs[i + 1];
      if (len < minLen && len < best && ((prev && prev.kind === 'flow') || (next && next.kind === 'flow'))) { idx = i; best = len; }
    });
    if (idx < 0) break;
    const prev = runs[idx - 1], next = runs[idx + 1];
    const pf = prev && prev.kind === 'flow', nf = next && next.kind === 'flow';
    if (pf && nf) { prev.end = next.end; runs.splice(idx, 2); }
    else if (pf) { prev.end = runs[idx].end; runs.splice(idx, 1); }
    else { next.start = runs[idx].start; runs.splice(idx, 1); }
    mergeSame();
  }
  mergeSame();
  let segs = runs.map(r => ({ kind: r.kind === 'mid' ? 'dissolve' : r.kind, start: r.start, end: r.end, manual: false, _mid: r.kind === 'mid' }));
  // page 구간 무결성 — peak0 < 0.85 간격이 섞여 있으면 라벨 경계에서 분할
  const split = [];
  for (const sg of segs) {
    if (sg.kind !== 'page') { split.push(sg); continue; }
    const pairs = uniSegPairs(recs, sg.start, sg.end);
    if (pairs.every(p => p.peak0 >= 0.85)) { split.push(sg); continue; }
    let cur = null;
    for (const p of pairs) {
      const kind = p.peak0 >= 0.85 ? 'page' : (p.label === 'mid' ? 'dissolve' : (p.label === 'page' ? 'cut' : p.label));
      if (cur && cur.kind === kind) cur.end = p.t; else { cur = { kind, start: p.t0, end: p.t, manual: false, _mid: kind === 'dissolve' }; split.push(cur); }
    }
  }
  segs = split;
  for (const sg of segs) {
    const pairs = uniSegPairs(recs, sg.start, sg.end);
    if (sg.kind === 'flow') {
      const ev = uniFlowEvidence(pairs, sg.start, sg.end, ctx.nativeW);
      if (!ev.ok) {
        // 길이 < 1초 또는 총 이동 < ROI 폭의 20%면 미세 이동(nudge) — 추출 대상에서 제외. 그 외 미달은 확인 필요
        if (ev.len < 1.0 || ev.total < 0.2 * ctx.nativeW) sg.kind = 'nudge'; else sg.weakFlow = true;
      }
    } else if (sg.kind === 'dissolve' && sg._mid) {
      const d = pairs.map(p => p.diff);
      let mono = d.length >= 2 && d.length <= 4;
      for (let i = 1; mono && i < d.length; i++) if (d[i] < d[i - 1] * 0.9) mono = false;
      if (!mono) sg.weakDissolve = true; // 2~4개 간격 + diff 단조 증가가 아니면 확인 필요
    }
  }
  segs.forEach((sg, i) => { sg.id = i + 1; });
  uniAnnotateSegments(recs, segs, ctx);
  return segs;
}

// 인접한 전환성 이벤트(cut/dissolve)들 — 사이의 hold/page 구간이 0.5초 이하이면 '복합 전환'으로 묶는다.
function uniFindComposites(segs, recs) {
  const isEv = s => s.kind === 'cut' || s.kind === 'dissolve' || s.kind === 'nudge'; // nudge/cut/dissolve + 사이 hold(≤0.5초) = 복합 전환
  const comps = [];
  let i = 0;
  while (i < segs.length) {
    if (!isEv(segs[i])) { i++; continue; }
    let j = i;
    for (;;) {
      const n1 = segs[j + 1], n2 = segs[j + 2];
      if (n1 && isEv(n1)) { j++; continue; }
      if (n1 && (n1.kind === 'page' || n1.kind === 'static') && (n1.end - n1.start) <= 0.5 && n2 && isEv(n2)) { j += 2; continue; }
      break;
    }
    if (j > i) {
      const events = segs.slice(i, j + 1).filter(isEv).map(e => {
        const pairs = uniSegPairs(recs, e.start, e.end);
        return {
          start: e.start, end: e.end, kind: e.kind,
          diff: pairs.length ? pairs.reduce((a, p) => a + p.diff, 0) / pairs.length : 0,
          peak0: pairs.length ? Math.min(...pairs.map(p => p.peak0)) : null,
        };
      });
      comps.push({ id: comps.length + 1, start: segs[i].start, end: segs[j].end, firstIdx: i, lastIdx: j, events });
    }
    i = j + 1;
  }
  return comps;
}

// 통계(속도·변동계수·총 이동량·점수), page의 세부(hold/playhead)·대표 프레임 후보, 앞뒤 맥락, 복합 전환 표시, '확인 필요'
function uniAnnotateSegments(recs, segs, ctx) {
  segs.forEach((s, i) => {
    const pairs = uniSegPairs(recs, s.start, s.end);
    const ev = uniFlowEvidence(pairs, s.start, s.end, ctx.nativeW);
    s.speed = ev.speed; s.cv = ev.cv === 9 ? 0 : ev.cv; s.total = ev.total;
    s.score = pairs.length ? pairs.reduce((a, p) => a + uniMatchScore(p.label, s.kind, p.score), 0) / pairs.length : 0.3;
    s.subKind = null; s.repT = null; s.repNote = null; s.compId = null;
    if (s.kind === 'page' && pairs.length) {
      const meanDiff = pairs.reduce((a, p) => a + p.diff, 0) / pairs.length;
      s.subKind = meanDiff < ctx.thr.staticThr ? 'hold' : 'playhead';
      const best = pairs.reduce((m, p) => (!m || p.diff < m.diff ? p : m), null);
      s.repT = best ? (best.t0 + best.t) / 2 : null; // 대표 프레임 후보 시각: diff가 가장 작은 지점
    }
    if (s.kind === 'page' || s.kind === 'static') {
      const prev = segs[i - 1], next = segs[i + 1];
      if (prev && uniIsTrans(prev.kind)) s.ctxKind = '전환 직후';
      else if ((prev && prev.kind === 'flow') || (next && next.kind === 'flow')) s.ctxKind = 'flow 안';
      else s.ctxKind = '단독';
    } else s.ctxKind = null;
    s.flagged = !s.manual && (s.score < 0.6 || !!s.weakFlow || !!s.weakDissolve || (s.kind === 'flow' && s.cv > 0.5));
  });
  const comps = uniFindComposites(segs, recs);
  for (const c of comps) {
    for (let k = c.firstIdx; k <= c.lastIdx; k++) segs[k].compId = c.id;
    const before = segs[c.firstIdx - 1], after = segs[c.lastIdx + 1];
    if (before && before.kind === 'page') before.repNote = '복합 전환 ' + c.id + ' 앞';
    if (after && after.kind === 'page') after.repNote = '복합 전환 ' + c.id + ' 뒤';
  }
  return comps;
}

// ---- 타임라인: 영상 전체 길이 가로 띠 (시크바와 같은 시간축). 클릭 = 그 시각으로 이동, 경계 드래그 = 구간 경계 조정 ----
function UniTimeline({ segs, duration, seekT, selIdx, onSelect, onSeek, onBoundary }) {
  const wrapRef = useRef(null);
  const dragRef = useRef(null);
  const latest = useRef({});
  latest.current = { segs, duration, onBoundary };
  useEffect(() => {
    function onMove(e) {
      const d = dragRef.current;
      if (!d || !wrapRef.current) return;
      const rect = wrapRef.current.getBoundingClientRect();
      const L = latest.current;
      let t = ((e.clientX - rect.left) / rect.width) * L.duration;
      const a = L.segs[d.i], b = L.segs[d.i + 1];
      if (!a || !b) return;
      t = Math.max(a.start + 0.1, Math.min(b.end - 0.1, t));
      L.onBoundary(d.i, t);
    }
    function onUp() { dragRef.current = null; }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
  }, []);
  const D = duration || 1;
  const pct = t => (t / D * 100) + '%';
  const timeAt = e => {
    const rect = wrapRef.current.getBoundingClientRect();
    return Math.max(0, Math.min(D, ((e.clientX - rect.left) / rect.width) * D));
  };
  return (
    <div>
      <div ref={wrapRef} onClick={e => onSeek(timeAt(e))}
        style={{ position: 'relative', height: '42px', background: 'repeating-linear-gradient(45deg,#f2f2f2,#f2f2f2 6px,#e6e6e6 6px,#e6e6e6 12px)', border: '1px solid var(--border-strong)', cursor: 'pointer' }}>
        {segs.map((s, i) => (
          <div key={s.id} title={UNI_KIND_LABEL[s.kind] + ' ' + s.start.toFixed(2) + '~' + s.end.toFixed(2) + 's · 신뢰도 ' + s.score.toFixed(2)}
            onClick={e => { e.stopPropagation(); onSelect(i); onSeek(timeAt(e)); }}
            style={{
              position: 'absolute', left: pct(s.start), width: pct(s.end - s.start), top: 0, bottom: 0,
              background: UNI_KIND_COLOR[s.kind], opacity: uniIsTrans(s.kind) ? 1 : 0.85,
              outline: s.flagged ? '2px dashed #ff9500' : (i === selIdx ? '2px solid #111' : 'none'), outlineOffset: '-2px',
              minWidth: uniIsTrans(s.kind) ? '3px' : undefined,
            }} />
        ))}
        {segs.slice(0, -1).map((s, i) => (
          <div key={'b' + i}
            onPointerDown={e => { e.preventDefault(); e.stopPropagation(); dragRef.current = { i }; }}
            onClick={e => e.stopPropagation()}
            style={{ position: 'absolute', left: 'calc(' + pct(s.end) + ' - 5px)', width: '10px', top: 0, bottom: 0, cursor: 'ew-resize', zIndex: 2 }}>
            <div style={{ position: 'absolute', left: '4px', width: '2px', top: 0, bottom: 0, background: 'rgba(0,0,0,0.45)', pointerEvents: 'none' }} />
          </div>
        ))}
        <div style={{ position: 'absolute', left: pct(seekT), top: 0, bottom: 0, width: '2px', background: '#111', zIndex: 3, pointerEvents: 'none' }} />
      </div>
      <div className="slider-label" style={{ display: 'flex', justifyContent: 'space-between', margin: '2px 0' }}>
        <span>0s</span><span>{(D / 2).toFixed(1)}s</span><span>{D.toFixed(1)}s</span>
      </div>
      <div className="slider-label" style={{ margin: 0 }}>
        <span style={{ color: UNI_KIND_COLOR.page }}>■</span> 페이지(고정) · <span style={{ color: UNI_KIND_COLOR.flow }}>■</span> 연속 이동 · <span style={{ color: UNI_KIND_COLOR.static }}>■</span> 완전정지 ·
        전환: <span style={{ color: UNI_KIND_COLOR.cut }}>■</span> 컷 <span style={{ color: UNI_KIND_COLOR.dissolve }}>■</span> 디졸브 <span style={{ color: UNI_KIND_COLOR.slide }}>■</span> 슬라이드 ·
        <span style={{ color: '#ff9500' }}>┅</span> 확인 필요(주황 점선) · 빗금 = 분석하지 않은 구간 · 경계를 드래그하면 조정
      </div>
    </div>
  );
}

function UniStep({ videoRef, onModeBack }) {
  const [videoFile, setVideoFile] = useState(null);
  const [videoLoaded, setVideoLoaded] = useState(false);
  const [duration, setDuration] = useState(0);
  const [seekT, setSeekT] = useState(0);
  const [rangeStart, setRangeStart] = useState(0);
  const [rangeEnd, setRangeEnd] = useState(0);
  const [roi, setRoi] = useState(null);
  const [rate, setRate] = useState(2);
  const [playing, setPlaying] = useState(false);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({ label: '', pct: 0 });
  const [msg, setMsg] = useState('영상 파일을 선택하세요.');
  const [uniDefaults, setUniDefaults] = useState(SCROLL_DEFAULTS_INIT); // 통합 모드 전용 전처리 설정
  const [autoRemove, setAutoRemove] = useState(true);                      // 재생바 자동 제거
  const [removeMode, setRemoveMode] = useState('median');                   // 재생바 제거 방식: median(기본) / column(고정 열, flow용) / protrusion(돌출)
  const [manualFrac, setManualFrac] = useState(null);                       // 수동 지정한 재생바 열 (ROI 폭 대비 0~1)
  const ppRawRef = useRef(null), ppProcRef = useRef(null);
  const defaultsRef = useRef(null), autoRemoveRef = useRef(true), removeModeRef = useRef('median'), manualRef = useRef(null);
  const previewPendingRef = useRef(false), previewAgainRef = useRef(false);
  const [analysis, setAnalysis] = useState(null); // { recs, thr, scale, nativeW, ... }
  const [segs, setSegs] = useState([]);
  const [selIdx, setSelIdx] = useState(null);
  const abortRef = useRef(false);
  const seekTRef = useRef(0), roiRef = useRef(null);
  const playingRef = useRef(false), runningRef = useRef(false);
  const bgSeekRef = useRef(false); // 분석 중 재생되는 프레임이 위쪽 영상 캔버스에 비치지 않게 억제
  const seekPendingRef = useRef(false);
  const analysisRef = useRef(null);
  useEffect(() => { roiRef.current = roi; }, [roi]);
  useEffect(() => { analysisRef.current = analysis; }, [analysis]);
  useEffect(() => { runningRef.current = running; }, [running]);
  useEffect(() => { defaultsRef.current = uniDefaults; }, [uniDefaults]);
  useEffect(() => { autoRemoveRef.current = autoRemove; }, [autoRemove]);
  useEffect(() => { removeModeRef.current = removeMode; }, [removeMode]);
  useEffect(() => { manualRef.current = manualFrac; }, [manualFrac]);

  // 전처리 미리보기(원본 ROI 크롭 / 전처리 후) — 추출과 같은 함수(uniRemovePlaybar, uniDecideOpts, scrollApplyPreprocInPlace)를
  // 원본 해상도로 적용한 뒤 표시용으로만 축소한다. 분석·추출 중에는 갱신하지 않는다.
  function uniPreviewNow() {
    const video = videoRef.current, raw = ppRawRef.current, proc = ppProcRef.current;
    if (!video || !video.videoWidth || !raw || !proc) return;
    const full = flowCaptureCurrent(video, roiRef.current);
    const work = cloneCanvas(full);
    let cols = [];
    if (autoRemoveRef.current || manualRef.current != null) {
      // 한 프레임만 보는 미리보기에서는 '고정 열' 방식을 쓸 수 없어 프레임별 돌출 감지로 대신 보여 준다
      cols = uniRemovePlaybar(work, { mode: removeModeRef.current === 'column' ? 'protrusion' : removeModeRef.current, manualFrac: manualRef.current, defaults: defaultsRef.current, globalRemoval: null }).cols;
    }
    scrollApplyPreprocInPlace(work, uniDecideOpts(work, defaultsRef.current));
    drawDownscaledStaged(full, raw, 800);
    drawDownscaledStaged(work, proc, 800);
    const k = proc.width / full.width;
    for (const cv of [raw, proc]) {
      const ctx = cv.getContext('2d');
      ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; ctx.strokeStyle = '#e03030';
      for (const [a, b] of cols) for (const x of [a * k, (b + 1) * k]) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke(); }
      ctx.setLineDash([]);
    }
  }
  async function previewJob() {
    if (previewPendingRef.current) { previewAgainRef.current = true; return; }
    previewPendingRef.current = true;
    try {
      do {
        previewAgainRef.current = false;
        const v = videoRef.current;
        if (!v || !v.videoWidth || runningRef.current || playingRef.current) break;
        bgSeekRef.current = true; // 미리보기용 seek이 위쪽 영상 캔버스에 비치지 않게
        try { await seekSafe(v, seekTRef.current); uniPreviewNow(); }
        finally { bgSeekRef.current = false; v.dispatchEvent(new Event('seeked')); } // 시크 위치 프레임으로 한 번 다시 그림
      } while (previewAgainRef.current);
    } finally { previewPendingRef.current = false; }
  }
  useEffect(() => {
    if (!videoLoaded) return;
    const id = setTimeout(previewJob, 100); // 설정이 바뀌면 100ms 디바운스로 즉시 갱신
    return () => clearTimeout(id);
  }, [roi, uniDefaults, autoRemove, removeMode, manualFrac, videoLoaded, seekT, running]);

  // 'play' 가드: 사용자가 ▶를 눌렀거나 분석 패스(flowInternalPlayRef)가 재생 중일 때만 허용
  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const guard = () => { if (!playingRef.current && !flowInternalPlayRef.current) v.pause(); };
    v.addEventListener('play', guard);
    return () => v.removeEventListener('play', guard);
  }, []);

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const video = videoRef.current;
    video.src = URL.createObjectURL(file);
    setUniDefaults(DEFAULT_PREPROC); // 새 영상 — 전처리 초기값으로
    setVideoLoaded(false); setRoi(null); setAnalysis(null); setSegs([]); setSelIdx(null); setManualFrac(null);
    setVideoFile(file);
    video.onloadedmetadata = async () => {
      setVideoLoaded(true);
      setDuration(video.duration);
      setSeekT(0); seekTRef.current = 0;
      setRangeStart(0); setRangeEnd(video.duration);
      setMsg('영상 로드됨: ' + video.duration.toFixed(2) + '초, ' + video.videoWidth + 'x' + video.videoHeight + '. 악보 영역(ROI)을 드래그로 지정하세요.');
      await seekSafe(video, 0.001); // 자동 재생 없이 seek만으로 첫 프레임을 그린다
      await seekTo(video, 0);
    };
  }

  // 사용자 시크(시크바·구간 핸들·타임라인 클릭): 최신 요청만 반영되도록 합쳐서 seek
  function userSeek(t) {
    t = Math.max(0, Math.min(duration || t, t));
    seekTRef.current = t;
    setSeekT(t);
    if (seekPendingRef.current) return;
    seekPendingRef.current = true;
    (async () => {
      let done;
      do {
        done = seekTRef.current;
        const v = videoRef.current;
        if (v && v.videoWidth && !runningRef.current) await seekSafe(v, done);
      } while (done !== seekTRef.current);
      seekPendingRef.current = false;
    })();
  }
  function stopPlay() {
    const v = videoRef.current;
    playingRef.current = false; setPlaying(false);
    if (v) { v.pause(); v.muted = true; }
  }
  function startPlay() {
    const v = videoRef.current;
    if (!v || !videoLoaded || runningRef.current) return;
    v.muted = false;
    playingRef.current = true; setPlaying(true);
    let lastUi = 0;
    const tick = () => {
      if (!playingRef.current) return;
      v.dispatchEvent(new Event('seeked')); // ROI 지정 캔버스를 현재 프레임으로 다시 그린다
      const t = v.currentTime, now = performance.now();
      if (now - lastUi > 200) { lastUi = now; seekTRef.current = t; setSeekT(t); }
      if (v.ended || v.paused) { stopPlay(); return; }
      requestAnimationFrame(tick);
    };
    v.play().then(() => requestAnimationFrame(tick)).catch(() => stopPlay());
  }

  async function run() {
    const video = videoRef.current;
    if (!video || !videoLoaded) return;
    if (rangeEnd - rangeStart < 1) { setMsg('추출 구간이 너무 짧습니다 (1초 이상).'); return; }
    if (playingRef.current) stopPlay();
    abortRef.current = false;
    runningRef.current = true; bgSeekRef.current = true;
    setRunning(true); setAnalysis(null); setSegs([]); setSelIdx(null); setMsg('구간 분석 중...');
    try {
      const out = await uniAnalyze({
        video, roi, startT: rangeStart, endT: rangeEnd, rate, abortRef,
        onProgress: (label, f) => setProgress({ label, pct: Math.round(f * 100) }),
      });
      if (out) {
        const thr = uniLabelPairs(out.recs, out.nativeW);
        const built = uniBuildSegments(out.recs, 0.4, { nativeW: out.nativeW, thr });
        setAnalysis({ ...out, thr });
        setSegs(built);
        setMsg('완료: 구간 ' + built.length + '개 (확인 필요 ' + built.filter(s => s.flagged).length + '개)');
      } else setMsg('중단되었습니다.');
    } catch (err) {
      setMsg('오류: ' + err.message);
    } finally {
      runningRef.current = false; playingRef.current = false;
      video.pause(); video.muted = true; video.playbackRate = 1;
      bgSeekRef.current = false;
      setRunning(false);
      await seekSafe(video, seekTRef.current); // 분석이 끝나면 시크바 위치의 프레임으로 되돌린다
      video.dispatchEvent(new Event('seeked'));
    }
  }

  // ---- 수동 편집 ----
  function changeKind(i, kind) {
    const A = analysisRef.current;
    setSegs(prev => {
      const next = prev.map((s, k) => (k === i ? { ...s, kind, manual: true } : s));
      if (A) uniAnnotateSegments(A.recs, next, { nativeW: A.nativeW, thr: A.thr });
      return next;
    });
  }
  function moveBoundary(i, t) {
    const A = analysisRef.current;
    setSegs(prev => {
      const next = prev.map(s => ({ ...s }));
      next[i].end = t; next[i + 1].start = t;
      next[i].manual = true; next[i + 1].manual = true;
      if (A) uniAnnotateSegments(A.recs, next, { nativeW: A.nativeW, thr: A.thr });
      return next;
    });
  }
  function exportDebug() {
    if (!analysis) return;
    const data = {
      params: { roi, startT: rangeStart, endT: rangeEnd, rate, nativeW: analysis.nativeW, lowW: analysis.w, scale: analysis.scale, thresholds: analysis.thr },
      frames: analysis.recs.map(r => ({
        t0: r.t0, t: r.t, diff: r.diff, dxLow: r.dxLow, dxNative: r.dxNative, speedPxPerSec: r.speed,
        peak: r.peak, second: r.second, margin: r.margin, peak0: r.peak0, residual: r.residual, alignGain: r.alignGain, label: r.label, sub: r.sub || null, score: r.score,
      })),
      segments: segs.map(s => ({
        start: s.start, end: s.end, kind: s.kind, subKind: s.subKind, context: s.ctxKind, score: s.score, speed: s.speed,
        speedCV: s.cv, totalMovePx: s.total, repFrameCandidate: s.repT, repNote: s.repNote, compositeId: s.compId, flagged: !!s.flagged, manual: !!s.manual,
      })),
      compositeTransitions: uniFindComposites(segs, analysis.recs),
    };
    downloadBlobFile(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }), 'uni_frames_debug.json');
  }

  return (
    <div>
      <div className="block">
        <div className="block-head"><span>통합(자동 감지) — A단계: 구간 분류 + 타임라인</span></div>
        <p className="hint-text">
          영상을 한 번 순차 재생하며 프레임 간 차이(diff)와 가로 이동량·신뢰도를 계산해 구간을 정지 / 연속 이동 / 컷 전환으로 자동 분류합니다.

            (diff 중앙값 {analysis.thr.med.toFixed(2)}) · 최소 구간 0.4초(흡수는 flow 안의 짧은 page 조각만, 컷·flow·dissolve는 흡수하지 않음) · 연속 이동 인정: 길이 ≥1초 · 속도 CV &lt; 0.5 · peak ≥ 0.85가 대부분 · 총 이동 ≥ ROI 폭 20%

                      </select>

                    <td>{[s.subKind, s.ctxKind, s.compId ? '복합 전환 #' + s.compId : null].filter(Boolean).join(' · ')}</td>

                    <td>{(s.kind === 'flow' || s.kind === 'slide') ? (Math.round(s.speed) + ' px/s · CV ' + s.cv.toFixed(2) + ' · ' + Math.round(s.total) + 'px') : '-'}</td>
                    <td>{s.repT != null ? s.repT.toFixed(2) + 's' : ''}{s.repNote ? ' (' + s.repNote + ')' : ''}</td>

      {analysis && segs.length > 0 && (

          segs={segs} analysis={analysis} uniDefaults={uniDefaults} autoRemove={autoRemove} removeMode={removeMode} manualFrac={manualFrac}
          bgSeekRef={bgSeekRef} seekTRef={seekTRef} onBusy={v => { runningRef.current = v; setRunning(v); }} />

}

// ================================================================================================
// 통합(자동 감지) 모드 — B단계: 구간별 자동 추출 + 이음
// page 구간은 대표 프레임을 캡처해 컷 전환 로직(buildCutFrames)으로 이어 붙이고, flow 구간은 연속 이동형 파이프라인
// (flowRunPipeline → flowTrackMotion/flowRebuildStrip)으로 스트립을 만든 뒤, 조각 경계마다 findSeamOverlap /
// detectSeamDuplicate로 중복 마디를 제거하며 하나의 긴 스트립으로 합친다. 기존 함수는 호출만 한다.
// ================================================================================================

function uniDecideOpts(canvas, defaults) {
  const avg = computeAvgLuminanceFromCanvas(canvas);
  return { ...defaults, invertMode: defaults.invertMode === 'auto' ? (avg < 128 ? 'on' : 'off') : defaults.invertMode };
}
// 원본 캡처를 (전처리 후) 저해상도 그레이 샘플로 — 대표 프레임 비교용
function uniProcessedLow(raw, defaults) {
  const c = cloneCanvas(raw);
  scrollApplyPreprocInPlace(c, uniDecideOpts(c, defaults));
  return flowLowFromCanvas(c, 480, 0);
}
function uniZeroShiftNcc(sa, sb) {
  if (sa.w !== sb.w || sa.h !== sb.h) return 0;
  return flowNccAt(flowToZeroMeanRows(sa), flowToZeroMeanRows(sb), sa.w, sa.h, new Uint8Array(sa.w), 0);
}
function uniDrawThumb(canvasEl, raw, defaults, cols) {
  if (!canvasEl || !raw) return;
  const c = cloneCanvas(raw);
  scrollApplyPreprocInPlace(c, uniDecideOpts(c, defaults));
  drawDownscaledStaged(c, canvasEl, 420);
  if (cols && cols.length) { // 감지/지정한 재생바 열을 점선으로 표시
    const k = canvasEl.width / raw.width, ctx = canvasEl.getContext('2d');
    ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5; ctx.strokeStyle = '#e03030';
    for (const [a, b] of cols) for (const x of [a * k, (b + 1) * k]) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvasEl.height); ctx.stroke(); }
    ctx.setLineDash([]);
  }
}

// ---- 재생바 제거 (page 구간: 재생바가 움직이므로 고정 열 감지가 통하지 않는다) ----
// 오선 밴드(top/bottom/space) — 원본 캡처를 임시로 이진화해 찾는다
function uniFindBand(canvas, defaults) {
  const probe = cloneCanvas(canvas);
  scrollApplyPreprocInPlace(probe, { ...uniDecideOpts(probe, defaults), removeBg: true });
  const sys = detectStaffSystem(scrollGetFullGrayData(probe), 0.3, 140);
  return sys ? { top: sys.main.top, bottom: sys.main.bottom, space: sys.space } : null;
}
// 돌출 감지: 이진화 전 원본 밝기가 배경과 일정 이상(35) 다른 열 중, 밴드 안을 거의 끊김 없이(≥90%) 덮고 밴드 바깥으로
// 0.6·space 이상 이어지는 좁은(≤10px) 세로 열. 회색(밝기 ~170)처럼 연한 재생바도 배경 대비 차이로 잡는다.
// (줄기·마디선은 밴드 전체를 덮지 않거나 밴드 밖으로 나가지 않아 제외된다.)
function uniDetectProtrusion(canvas, defaults) {
  const band = uniFindBand(canvas, defaults);
  if (!band) return { cols: [], band: null };
  const g = scrollGetFullGrayData(canvas);
  const W = g.w;
  const samp = [];
  for (let i = 0; i < g.gray.length; i += 7) samp.push(g.gray[i]);
  samp.sort((a, b) => a - b);
  const bg = samp[samp.length >> 1];
  const thr = 35, lim = Math.max(2, Math.round(band.space * 2)), need = band.space * 0.6;
  const bandH = band.bottom - band.top + 1;
  const diffAt = (x, y) => Math.abs(g.gray[y * W + x] - bg) >= thr;
  const ok = new Uint8Array(W);
  for (let x = 0; x < W; x++) {
    let cov = 0;
    for (let y = band.top; y <= band.bottom; y++) if (diffAt(x, y)) cov++;
    if (cov / bandH < 0.9) continue;
    let up = 0, gap = 0;
    for (let k = 1; k <= lim; k++) { const y = band.top - k; if (y < 0) break; if (diffAt(x, y)) { up = k; gap = 0; } else if (++gap > 1) break; }
    let down = 0; gap = 0;
    for (let k = 1; k <= lim; k++) { const y = band.bottom + k; if (y >= g.h) break; if (diffAt(x, y)) { down = k; gap = 0; } else if (++gap > 1) break; }
    if (Math.max(up, down) >= need) ok[x] = 1;
  }
  const cols = [];
  let sx = -1;
  for (let x = 0; x <= W; x++) {
    if (x < W && ok[x]) { if (sx < 0) sx = x; }
    else if (sx >= 0) { if (x - sx <= 10) cols.push([sx, x - 1]); sx = -1; }
  }
  return { cols, band };
}
// 선택한 방식으로 재생바를 지운다(제자리 수정). 수동 지정 열이 있으면 그것이 우선.
//  mode 'column' = 고정 열 감지(flow용: globalRemoval), 그 외(median/protrusion) = 프레임별 돌출 감지
function uniRemovePlaybar(canvas, { mode, manualFrac, defaults, globalRemoval }) {
  let cols = [], band = null;
  if (manualFrac != null) {
    band = uniFindBand(canvas, defaults);
    if (band) cols = [[manualFrac * canvas.width - 2, manualFrac * canvas.width + 2]];
  } else if (mode === 'column') {
    if (globalRemoval) { cols = globalRemoval.cols; band = globalRemoval.band; }
  } else {
    const d = uniDetectProtrusion(canvas, defaults);
    cols = d.cols; band = d.band;
  }
  if (cols.length && band) flowRemovePlaybarCanvas(canvas, cols, band);
  return { cols: band ? cols : [], band };
}
// 시간 중앙값: page 구간의 [start+0.05, end-0.05]에서 최대 15프레임을 균등 샘플해 픽셀별 중앙값 (dx=0이라 정렬 불필요)
async function uniMedianCapture(video, roi, seg, maxN) {
  const a = seg.start + 0.05, b = seg.end - 0.05;
  if (b - a < 0.1) return captureRepCanvas(video, roi, (seg.start + seg.end) / 2);
  const n = Math.max(1, Math.min(maxN, Math.floor((b - a) / 0.1) + 1));
  const caps = [];
  for (let i = 0; i < n; i++) caps.push(await captureRepCanvas(video, roi, n === 1 ? (a + b) / 2 : a + (b - a) * i / (n - 1)));
  return caps.length >= 3 ? medianOfCanvases(caps) : caps[0];
}

// 모든 page 구간의 시간 중앙값 프레임을 "빠른 재생 한 번"으로 모은다 — 구간마다 최대 15번씩 seek하던 방식(페이지당 수 초)을 대신한다.
// 구간별로 [start+0.05, end−0.05]에 고르게 놓은 목표 시각을 지나는 첫 프레임을 집고(구간당 최대 maxN장), 구간이 끝나면 바로 중앙값을
// 계산해 원본 프레임들은 버린다(메모리 절약). page 구간 사이가 3초 넘게 떨어져 있으면(긴 flow 구간 등) 재생으로 건너지 않고 seek로 넘어간다.
// 반환: { [seg.id]: canvas } — 프레임을 3장 미만으로 모은 구간은 빠진다(호출부가 seek 방식으로 보충).
const UNI_MEDIAN_RATE = 4;
async function uniCollectPageMedians(video, roi, pages, maxN, abortRef, onProgress) {
  const out = {};
  if (!flowRvfcSupported(video) || !pages.length) return out;
  const plan = pages.map(seg => {
    const a = seg.start + 0.05, b = seg.end - 0.05;
    if (b - a < 0.1) return null;
    const n = Math.max(1, Math.min(maxN, Math.floor((b - a) / 0.1) + 1));
    const targets = [];
    for (let i = 0; i < n; i++) targets.push(n === 1 ? (a + b) / 2 : a + (b - a) * i / (n - 1));
    return { seg, a, b, targets, next: 0, caps: [] };
  }).filter(Boolean).sort((p, q) => p.a - q.a);
  if (!plan.length) return out;
  // 가까이 붙은 구간끼리 묶어 한 번에 재생
  const runs = [];
  for (const p of plan) {
    const last = runs[runs.length - 1];
    if (last && p.a - last[last.length - 1].b <= 3) last.push(p); else runs.push([p]);
  }
  const total = plan.length;
  let finished = 0;
  const flush = p => {
    if (p.done) return;
    p.done = true;
    if (p.caps.length >= 3) out[p.seg.id] = medianOfCanvases(p.caps);
    p.caps = [];
    finished++;
    if (onProgress) onProgress(finished / total);
  };
  for (const run of runs) {
    if (abortRef && abortRef.current) break;
    let k = 0;
    await flowPlayPass(video, {
      startT: Math.max(0, run[0].a - 0.05), endT: run[run.length - 1].b + 0.05, rate: UNI_MEDIAN_RATE, maxRate: UNI_MEDIAN_RATE, minGap: 0, abortRef,
      onFrame: t => {
        while (k < run.length && t > run[k].b) { flush(run[k]); k++; }
        if (k >= run.length) return;
        const p = run[k];
        if (t < p.a || p.next >= p.targets.length || t < p.targets[p.next]) return;
        p.caps.push(flowCaptureCurrent(video, roi));
        while (p.next < p.targets.length && p.targets[p.next] <= t) p.next++; // 건너뛴 목표는 이 프레임으로 대신한다
      },
    });
    for (const p of run) flush(p);
  }
  return out;
}

// 조각 꼬리/머리 — 오른쪽/왼쪽 정렬한 ROI 폭(W)짜리 캔버스. 이음 탐지(findSeamOverlap)는 같은 폭의 타일 두 장을 입력으로 받는다.
function uniTail(piece, W, H) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  const crop = flowCropStrip(piece.chunks, Math.max(0, piece.totalW - W), piece.totalW);
  ctx.drawImage(crop, W - crop.width, 0);
  return c;
}
function uniHead(piece, W, H) {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, H);
  ctx.drawImage(flowCropStrip(piece.chunks, 0, Math.min(piece.totalW, W)), 0, 0);
  return c;
}

// 창 맞대기(registration): 앞 조각의 마지막 화면(tail, 폭 W)과 뒤 조각의 첫 화면(head, 폭 W)이 "같은 장면이 s만큼 왼쪽으로 밀린 것"인지
// 직접 맞춰 본다 — head(x) = tail(x + s). 시간상 붙어 있는 두 조각(흐르던 악보가 잠깐 끊겼다 이어짐, 정지 페이지 뒤에 같은 화면에서
// 흐르기 시작 등)은 화면이 거의 같으므로 NCC가 1에 가깝게 나오고, 겹침 폭(W − s)을 정확히 알 수 있다. 음악적으로 같은 마디가
// 반복되는 것과 헷갈리지 않도록 s는 maxFrac·W 이하로만 찾는다(호출부: 사이에 '컷'이 있으면 0.08, 없으면 0.5).
// 반환: { s(원본 px), ncc } 또는 null(맞는 위치 없음)
const UNI_REG_MIN_NCC = 0.8;
function uniRegisterWindows(tail, head, maxFrac) {
  if (!tail || !head || tail.width !== head.width || tail.height !== head.height || !(maxFrac > 0)) return null;
  const W = tail.width;
  const la = flowLowFromCanvas(tail, 480, 0), lb = flowLowFromCanvas(head, 480, 0);
  const za = flowToZeroMeanRows(la), zb = flowToZeroMeanRows(lb);
  const w = la.w, h = la.h, noMask = new Uint8Array(w);
  const sMax = Math.min(w - 16, Math.floor(w * maxFrac));
  let best = -2, bestS = 0;
  for (let sh = 0; sh <= sMax; sh++) {
    const v = flowNccAt(za, zb, w, h, noMask, sh);
    if (v > best + 1e-6) { best = v; bestS = sh; } // 동률이면 작은 이동을 택한다
  }
  if (best < UNI_REG_MIN_NCC) return null;
  // 원본 해상도(최대 1920폭)에서 ±(축소 배율+1)px 범위로 다듬기
  const k = W / w;
  let s0 = Math.round(bestS * k);
  if (k > 1.01) {
    const fa = flowLowFromCanvas(tail, 1920, 0), fb = flowLowFromCanvas(head, 1920, 0);
    const k2 = W / fa.w, zfa = flowToZeroMeanRows(fa), zfb = flowToZeroMeanRows(fb), m2 = new Uint8Array(fa.w);
    const c = Math.round(bestS * k / k2), r = Math.ceil(k / k2) + 1;
    let bv = -2, bs = c;
    for (let sh = Math.max(0, c - r); sh <= Math.min(fa.w - 16, c + r); sh++) {
      const v = flowNccAt(zfa, zfb, fa.w, fa.h, m2, sh);
      if (v > bv + 1e-6) { bv = v; bs = sh; }
    }
    s0 = Math.round(bs * k2);
  }
  return { s: Math.max(0, Math.min(W - 1, s0)), ncc: best };
}

// 정해진 이동 폭 근처(s0 ± r, 원본 px)에서만 창 맞대기를 해 본다 — 반환 { s, ncc } 또는 null(minNcc 미만)
function uniRegisterNear(tail, head, s0, r, minNcc) {
  if (!tail || !head || tail.width !== head.width || tail.height !== head.height) return null;
  const W = tail.width;
  const fa = flowLowFromCanvas(tail, 960, 0), fb = flowLowFromCanvas(head, 960, 0);
  const k = W / fa.w, za = flowToZeroMeanRows(fa), zb = flowToZeroMeanRows(fb), mask = new Uint8Array(fa.w);
  const c = Math.round(s0 / k), rr = Math.max(2, Math.ceil(r / k));
  let best = -2, bs = c;
  for (let sh = Math.max(0, c - rr); sh <= Math.min(fa.w - 16, c + rr); sh++) {
    const v = flowNccAt(za, zb, fa.w, fa.h, mask, sh);
    if (v > best + 1e-6) { best = v; bs = sh; }
  }
  if (best < minNcc) return null;
  return { s: Math.max(0, Math.min(W - 1, Math.round(bs * k))), ncc: best };
}

// 조각 경계 분석(자동 결정은 보수적): 겹침 제거 폭이 ROI 폭의 30%를 넘거나 1·2위 후보의 IoU 격차(margin)가 작으면(<0.15) 자동으로
// 지우지 않고 '이음새 의심'으로 플래그한다(제안 폭은 suggestTrim에 남겨 슬라이더로 적용할 수 있게). 잘려 나갈 픽셀은 버리지 않고
// 조각 원본을 그대로 보관하므로(uniFinalize가 매번 다시 합성), trim은 언제든 되돌릴 수 있다.
function uniAnalyzeJoins(pieces, W, H) {
  const joins = [{ state: 'first', trim: 0 }];
  for (let i = 1; i < pieces.length; i++) {
    const A = pieces[i - 1], B = pieces[i];
    if (B.internalJoin) { joins.push({ ...B.internalJoin }); continue; }
    const join = { state: 'butt', suspect: true, seamSuspect: false, trim: 0, suggestTrim: 0, ovl: null, dupFixed: 0, suggestDup: 0, margin: null };
    const tailA = uniTail(A, W, H), headB = uniHead(B, W, H);
    // 1순위: 창 맞대기 — 두 화면이 같은 장면의 연속이면 겹침 폭을 바로 안다(오선·마디 검출에 의존하지 않음)
    const reg = B.regFrac ? uniRegisterWindows(tailA, headB, B.regFrac) : null;
    if (reg) {
      join.trim = Math.max(0, Math.min(W - reg.s, Math.min(W, B.totalW) - 2));
      join.state = 'overlap'; join.suspect = false; join.registered = true; join.margin = 1;
      join.ovl = { status: 'overlap', px: join.trim, iou: reg.ncc, why: 'registered', cands: [] };
      joins.push(join);
      continue;
    }
    const iA = tileInfoOf(tailA), iB = tileInfoOf(headB);
    if (iA.sys || iB.sys) {
      const mask = new Uint8Array(H);
      for (const inf of [iA, iB]) if (inf.sys) for (let y = 0; y < H; y++) if (inf.sys.mask[y]) mask[y] = 1;
      const space = (iA.sys || iB.sys).space;
      const ov = findSeamOverlap(iA, iB, tailA, headB, mask, space);
      join.ovl = { status: ov.status, px: ov.px || 0, iou: ov.iou != null ? ov.iou : null, why: ov.why || null, cands: ov.cands };
      if (ov.status === 'overlap') {
        const t = Math.max(0, Math.min(W - 2, iA.xR + 1 - ov.s));
        const sorted = (ov.cands || []).slice().sort((p, q) => q.iou - p.iou);
        const second = sorted.find(c => Math.abs(c.s - ov.s) > 4);
        join.margin = second ? ov.iou - second.iou : 1;
        join.suggestTrim = t;
        if (t > 0.3 * W || join.margin < 0.15) { join.state = 'seam-suspect'; join.seamSuspect = true; } // 자동 제거하지 않는다
        else { join.trim = t; join.state = 'overlap'; join.suspect = false; }
      } else join.state = ov.status === 'unverifiable' ? 'butt-unverifiable' : 'butt';
      const bEnd = Math.min(W - 1, iB.xR);
      if (join.trim < bEnd - 10) {
        const dd = detectSeamDuplicate(iA, iB, iA.xR, join.trim, bEnd, mask, space, W);
        if (dd.status === 'dup' && join.trim + dd.d < W - 5) {
          if (dd.d > 0.3 * W) { join.suggestDup = dd.d; join.seamSuspect = true; join.state = 'seam-suspect'; }
          else { join.trim += dd.d; join.dupFixed = dd.d; join.suspect = false; }
        }
      }
    } else join.state = 'butt-unverifiable';
    joins.push(join);
  }
  return joins;
}

function uniPasteStrip(chunks, canvas, x0) {
  let base = 0;
  for (const c of chunks) {
    const cs = base, ce = base + c.width;
    const a = Math.max(x0, cs), b = Math.min(x0 + canvas.width, ce);
    if (b > a) c.getContext('2d').drawImage(canvas, a - x0, 0, b - a, c.height, a - cs, 0, b - a, c.height);
    base = ce;
  }
}
// 조각 로컬 좌표 [a,b)의 픽셀을 한 장으로 — x<0은 왼쪽 원본 가장자리(leftExtra), 0~totalW는 조각, ≥totalW는 오른쪽 원본 가장자리(rightExtra)
function uniPieceCols(p, a, b, H) {
  const w = Math.max(1, Math.round(b - a));
  const c = document.createElement('canvas');
  c.width = w; c.height = H;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, w, H);
  const lw = p.leftExtra ? p.leftExtra.width : 0;
  const put = (src, sx, sw, dx) => { if (sw > 0) ctx.drawImage(src, sx, 0, sw, H, dx, 0, sw, H); };
  // 왼쪽 가장자리
  const l0 = Math.max(a, -lw), l1 = Math.min(b, 0);
  if (l1 > l0 && p.leftExtra) put(p.leftExtra, lw + l0, l1 - l0, l0 - a);
  // 조각 본체
  const m0 = Math.max(a, 0), m1 = Math.min(b, p.totalW);
  if (m1 > m0) {
    let base = 0;
    for (const ch of p.chunks) {
      const cs = base, ce = base + ch.width;
      const lo = Math.max(m0, cs), hi = Math.min(m1, ce);
      if (hi > lo) put(ch, lo - cs, hi - lo, lo - a);
      base = ce;
    }
  }
  // 오른쪽 가장자리
  const r0 = Math.max(a, p.totalW), r1 = Math.min(b, p.totalW + (p.rightExtra ? p.rightExtra.width : 0));
  if (r1 > r0 && p.rightExtra) put(p.rightExtra, r0 - p.totalW, r1 - r0, r0 - a);
  return c;
}

// 이음새 접합 구간의 오선 복원 — 검출된 이음새 주변에서만, 1회만 칠한다. planStaffRestore(→ detectStaffRowsFromGray)가 돌려준 줄 두께가
// 실제보다 두꺼울 수 있어(밀집한 마디에서 인접 행의 잉크가 클러스터에 섞임), 구간 안 행별 어두움을 재서 핵심 행(원본 두께)만 칠한다.
function uniRepairStaff(chunks, x, W, totalW, tag) {
  const half = Math.round(W * 0.5);
  const x0 = Math.max(0, Math.round(x - half)), x1 = Math.min(totalW, Math.round(x + half));
  if (x1 - x0 < 20) return;
  const c = flowCropStrip(chunks, x0, x1);
  const ctx = c.getContext('2d');
  const img = ctx.getImageData(0, 0, c.width, c.height);
  const plan = planStaffRestore(img.data, c.width, c.height, false);
  if (!plan.length) return;
  const seamLocal = x - x0;
  const reach = Math.max(40, Math.round(W * 0.12));
  const logLines = [];
  const active = [];
  for (const row of plan) {
    const before = row.y1 - row.y0 + 1;
    row.segs = row.segs.map(([a, b]) => [Math.max(a, seamLocal - reach), Math.min(b, seamLocal + reach)]).filter(([a, b]) => b - a >= 4);
    if (!row.segs.length) continue;
    const frac = [];
    for (let y = row.y0; y <= row.y1; y++) {
      let dark = 0, tot = 0;
      for (const [a, b] of row.segs) for (let xx = a; xx <= b; xx++) { tot++; if (img.data[(y * c.width + xx) * 4] < 128) dark++; }
      frac.push(tot ? dark / tot : 0);
    }
    const mx = Math.max(...frac);
    let ymin = -1, ymax = -1;
    frac.forEach((f, k) => { if (f >= Math.max(0.05, mx * 0.6)) { if (ymin < 0) ymin = k; ymax = k; } });
    if (ymin >= 0) { const oy0 = row.y0; row.y0 = oy0 + ymin; row.y1 = oy0 + ymax; }
    logLines.push({ y0: row.y0, y1: row.y1, thicknessBefore: before, thicknessAfter: row.y1 - row.y0 + 1 });
    active.push(row);
  }
  if (active.length) paintStaffRestore(img, c.width, active); // 1회만
  ctx.putImageData(img, 0, 0);
  uniPasteStrip(chunks, c, x0);
  // eslint-disable-next-line no-console
  console.log('[uni 오선 복원]', { tag: tag || 'seam', seamStripX: Math.round(x), lines: logLines, paintCalls: active.length ? 1 : 0 });
}

// 조각 목록 + 이음새 설정(자동 + 수동 보정 adj) + 삭제 구간(cuts)으로 하나의 스트립을 합성하고 시간 매핑을 만든다. 항상 원본 조각에서 새로 만든다.
//  adj[i] = { trim?: 뒤 조각(i)의 앞쪽 trim(px, 음수면 그 조각 원본 왼쪽 가장자리에서 더 가져옴), tail?: 앞 조각(i-1)의 꼬리
//            (px, 양수면 그 조각 원본 오른쪽 가장자리에서 더 가져오고, 음수면 꼬리를 더 자름) }
//  cuts = [{ pieceIdx, x0, x1 }]  원본 조각 좌표 기준의 제외 구간 (마디 삭제)
function uniFinalize(merged, adj, nativeW, cuts) {
  cuts = cuts || [];
  const { pieces, joinsAuto, H } = merged;
  const eff = joinsAuto.map((j, i) => {
    const a = adj[i] || {};
    return { ...j, trim: a.trim != null ? a.trim : j.trim, tail: a.tail != null ? a.tail : 0, manual: a.trim != null || a.tail != null };
  });
  const builder = flowChunkBuilder(H, 6000);
  const offsets = [], ranges = [], map = [], trimmed = [], effTrim = [], effTail = [], seamX = [], pRanges = [], joints = [];
  pieces.forEach((p, i) => {
    const trim = i === 0 ? 0 : eff[i].trim;
    const tail = i + 1 < pieces.length ? eff[i + 1].tail : 0;
    const startS = builder.total();
    offsets.push(startS);
    const leftW = p.leftExtra ? p.leftExtra.width : 0, rightW = p.rightExtra ? p.rightExtra.width : 0;
    const lo = trim < 0 ? -Math.min(-trim, leftW) : trim;
    let cut = 0;
    if (tail < 0) cut = Math.min(-tail, Math.max(0, p.totalW - 1 - Math.max(0, lo)));
    const ta = tail > 0 ? Math.min(tail, rightW) : 0;
    const hi = p.totalW - cut + ta;
    // 삭제 구간을 빼고 남은 로컬 구간들
    const myCuts = cuts.filter(c => c.pieceIdx === i).sort((u, v) => u.x0 - v.x0);
    const keep = [];
    let cur = lo;
    for (const c of myCuts) {
      const c0 = Math.max(c.x0, lo), c1 = Math.min(c.x1, hi);
      if (c1 <= c0) continue;
      if (c0 > cur) keep.push([cur, c0]);
      cur = Math.max(cur, c1);
    }
    if (cur < hi) keep.push([cur, hi]);
    const myRanges = [];
    keep.forEach(([r0, r1], idx) => {
      const s0 = builder.total();
      if (idx > 0) joints.push(s0); // 삭제로 이어 붙이는 접합 위치 — 오선을 이어 준다
      // 로컬 [r0,r1)을 왼쪽 가장자리 / 본체 / 오른쪽 가장자리 영역으로 나눠 그린다
      const l1 = Math.min(r1, 0);
      if (l1 > r0 && p.leftExtra) { builder.append(p.leftExtra, leftW + r0, l1 - r0); map.push({ s0: builder.total() - (l1 - r0), s1: builder.total(), pieceIdx: i, type: 'left-extra', x0: r0, x1: l1 }); }
      const m0 = Math.max(r0, 0), m1 = Math.min(r1, p.totalW);
      if (m1 > m0) {
        const ms = builder.total();
        let base = 0;
        for (const ch of p.chunks) {
          const cs = base, ce = base + ch.width;
          const a2 = Math.max(m0, cs), b2 = Math.min(m1, ce);
          if (b2 > a2) builder.append(ch, a2 - cs, b2 - a2);
          base = ce;
        }
        map.push({ s0: ms, s1: builder.total(), pieceIdx: i, type: 'piece', x0: m0, x1: m1 });
      }
      const rr0 = Math.max(r0, p.totalW);
      if (r1 > rr0 && p.rightExtra) { const rs = builder.total(); builder.append(p.rightExtra, rr0 - p.totalW, r1 - rr0); map.push({ s0: rs, s1: builder.total(), pieceIdx: i, type: 'right-extra', x0: rr0, x1: r1 }); }
      myRanges.push({ lo: r0, hi: r1, s: s0 });
    });
    pRanges.push(myRanges);
    if (lo > 0) trimmed.push({ pieceIdx: i, joinIdx: i, x0: 0, x1: lo, kind: '이음새에서 잘린 앞부분' });
    if (cut > 0) trimmed.push({ pieceIdx: i, joinIdx: i + 1, x0: p.totalW - cut, x1: p.totalW, kind: '이음새에서 잘린 꼬리' });
    for (const c of myCuts) trimmed.push({ pieceIdx: i, joinIdx: null, x0: c.x0, x1: c.x1, kind: '마디 삭제로 제외' });
    effTrim.push(lo); effTail.push(ta > 0 ? ta : -cut);
    ranges.push({ type: p.type, s0: startS, s1: builder.total(), expect: p.expect || 0, pieceIdx: i, groupId: p.groupId || null });
    seamX.push(startS + (lo < 0 ? -lo : 0));
  });
  const chunks = builder.finish();
  const totalW = builder.total();
  eff.forEach((j, i) => { if (i > 0 && j.manual) uniRepairStaff(chunks, offsets[i], nativeW, totalW, 'seam ' + i); });
  joints.forEach((x, k) => uniRepairStaff(chunks, x, nativeW, totalW, 'cut-joint ' + (k + 1)));

  // 시간 매핑: 조각 로컬 좌표 → 시각 (flow: x(t) 역변환, page: 타일의 [start,end] 구간 안에서 폭 비례 — 추정). 확장/잘림은 가장자리 값으로 고정.
  const T = [], S = [];
  const push = (s, t) => {
    const k = T.length - 1;
    if (k >= 0) { t = Math.max(t, T[k]); s = Math.max(s, S[k]); }
    T.push(t); S.push(s);
  };
  pieces.forEach((p, i) => {
    let tAt;
    if (p.type === 'flow') {
      const tr = p.track;
      const Xm = []; let m = -Infinity;
      for (const v of tr.X) { m = Math.max(m, v); Xm.push(m); }
      const Xf = flowInterpX(tr, p.tFirst != null ? p.tFirst : tr.t[tr.k0]);
      const pb = flowResolvePlaybar(tr);
      const pbx = pb ? pb.x : 0;
      tAt = xl => flowInvX(tr.t, Xm, xl - pbx + Xf);
    } else {
      tAt = p.tAt;
    }
    for (const rg of pRanges[i]) {
      const len = Math.max(1, rg.hi - rg.lo);
      for (let x = 0; x < len; x += 40) push(rg.s + x, tAt(rg.lo + x));
      push(rg.s + len, tAt(rg.hi));
    }
  });
  if (!T.length) { T.push(0); S.push(0); }
  const track = { t: T, X: S, k0: 0, k1: T.length - 1, totalW, nativeW, barCols: [0, 0], staticRanges: [] };
  const synth = { chunks, totalW, H, stats: {}, tFirst: T[0], track }; // 스트립 좌표 s ↔ 시각 t (x(t) 역변환 형태)

  const segJoin = { ...merged.segJoinPage };
  pieces.forEach((p, i) => {
    if (i === 0) return;
    const j = eff[i];
    let txt;
    if (j.manual) txt = '수동 조절: 앞 trim ' + effTrim[i] + 'px' + (effTail[i] ? ', 앞 조각 꼬리 ' + (effTail[i] > 0 ? '+' : '') + effTail[i] + 'px' : '');
    else if (j.state === 'overlap') txt = '겹침 ' + j.trim + 'px 제거' + (j.dupFixed ? ' · 중복 ' + j.dupFixed + 'px 제거' : '');
    else if (j.state === 'seam-suspect') txt = '이음새 의심 — 겹침 제안 ' + j.suggestTrim + 'px' + (j.suggestDup ? ' / 중복 제안 ' + j.suggestDup + 'px' : '') + '(자동 제거 안 함, 슬라이더로 조절)';
    else txt = j.state === 'butt' ? 'butt join (누락 의심)' : 'butt join (누락 의심 · 판단 불가)';
    segJoin[p.segIds[0]] = '앞 조각과: ' + txt;
  });
  // 같은 page 묶음의 조각 범위는 하나로 합쳐 누락 점검에 쓴다 (기대 마디 수는 묶음 단위)
  const grouped = [];
  for (const r of ranges) {
    const last = grouped[grouped.length - 1];
    if (r.groupId && last && last.groupId === r.groupId) { last.s1 = r.s1; last.expect = Math.max(last.expect, r.expect); }
    else grouped.push({ ...r });
  }
  // 이음새 정보(마커·툴팁·원본 복원용): 잘린 구간 N px = 겹침 A + 중복 B
  const seamInfo = pieces.map((p, i) => {
    if (i === 0) return null;
    const j = joinsAuto[i];
    const A = j.internal ? j.cutOverlap : (j.state === 'overlap' ? Math.max(0, j.trim - j.dupFixed) : 0);
    const B = j.internal ? j.cutDup : (j.dupFixed || 0);

}

// 합친 악보의 누락 점검: 마지막 마디가 겹세로줄(굵은 선 또는 가는 선 둘)로 끝나는지
function uniEndsWithDoubleBar(chunks, space) {
  const total = chunks.reduce((s, c) => s + c.width, 0);
  const w = Math.min(total, Math.max(60, Math.round(space * 10)));
  const g = scrollGetFullGrayData(flowCropStrip(chunks, total - w, total));
  const sys = detectStaffSystem(g, 0.3, 140);
  if (!sys) return null;
  const cover = computeBarCoverage(g, sys.main.top, sys.main.bottom, 140);
  const cl = [];
  let cur = null;
  for (let x = 0; x < cover.length; x++) {
    if (cover[x] >= 0.8) { if (cur && x - cur.x1 <= 1) cur.x1 = x; else { if (cur) cl.push(cur); cur = { x0: x, x1: x }; } }
  }
  if (cur) cl.push(cur);
  if (!cl.length) return false;
  const last = cl[cl.length - 1];
  if (last.x1 - last.x0 + 1 > space * 0.6) return true; // 굵은 선
  const prev = cl[cl.length - 2];
  return !!(prev && last.x0 - prev.x1 <= space * 2.5);
}
// 경고 목록: { measureIdx, text }  (경고가 뜬 마디에는 편집 모드 진입 안내를 같이 표시)
function uniStripWarnings(chunks, bars, space, ranges) {
  const out = [];
  if (bars.length >= 2) {
    const e = uniEndsWithDoubleBar(chunks, space || 10);
    if (e === false) out.push({ measureIdx: bars.length - 2, text: '마지막 마디가 겹세로줄로 끝나지 않습니다 — 끝이 잘렸을 수 있음' });
  }
  for (const r of ranges) {
    if (r.type !== 'page' || !r.expect) continue;
    let count = 0, lastI = -1;
    for (let i = 0; i + 1 < bars.length; i++) if (bars[i] >= r.s0 - 8 && bars[i + 1] <= r.s1 + 8) { count++; lastI = i; }
    if (count < r.expect) out.push({ measureIdx: Math.max(0, lastI >= 0 ? lastI : 0), text: '조각 ' + (r.pieceIdx + 1) + ': 대표 프레임의 마디 수 ' + r.expect + '개 > 합성 스트립 ' + count + '개 — 누락 의심' });
  }
  return out;
}

// 마디선 오버레이 + 수동 보정 (FlowBarStrip 기반) + 마디 더블클릭 편집 모드: 편집 중인 마디의 좌우 가장자리 핸들을 끌면 원본 픽셀을
// 더 가져오거나(바깥으로) 줄인다(안쪽으로). 빈 곳 한 번 클릭 = 마디선 추가(더블클릭과 구분하려고 250ms 지연).

function UniBarStrip({ chunks, totalW, H, scale, bars, flagged, warnIdx, selIdx, editIdx, highlight, getPreview, seams, onSeamDouble, onSelect, onCommit, onEdit, onExtend, scrollRef }) {

// 포함된 구간들로 조각(page 묶음 / flow)을 만든다 (합성은 uniFinalize — 이음새 보정을 바꿀 때마다 원본 조각으로 다시 한다)

      });
      // 원본 보존 + 이음새 편집 가능화: page 묶음을 (중복이 아닌) 타일 하나당 조각 하나로 나눈다. 각 조각은 실제로 쓰인 구간
      // [srcX, srcX+len)만 chunks로 갖고, 쓰이지 않은(이음새에서 잘린) 양옆 타일 픽셀은 leftExtra/rightExtra로 보관한다.
      // 타일 사이 이음새는 buildCutFrames가 이미 결정한 겹침/중복 제거를 그대로 internalJoin으로 기록한다(재분석 안 함).
      built.frames.forEach((f, k) => {
        const o = f.ovl;
        segContrib[ids[k]] = f.dup ? { px: 0, dropped: true, removed: 0 } : { px: f.len, dropped: false, removed: (o && o.kind === 'overlap' ? o.px : 0) + (f.dupFixed || 0) };
      });
      const gid = ++uniGroupSeq;
      let groupExpect = 0;
      for (const f of built.frames) {
        if (f.dup) continue;
        const inf = tileInfoOf(f.canvas);
        if (!inf.sys) continue;
        const bs = detectBarsThroughSystem(inf.g, inf.sys, 0.8, inf.xL, 140, null, 0).bars.filter(bb => bb.x >= inf.xL && bb.x <= inf.xR);
        groupExpect = Math.max(groupExpect, Math.max(0, bs.length - 1)); // 누락 점검용: 대표 프레임(타일)에서 센 마디 수의 최댓값
      }
      let firstReal = true;
      built.frames.forEach((f, k) => {
        if (f.dup) return;
        const H0 = f.canvas.height;
        const used = document.createElement('canvas');
        used.width = Math.max(1, f.len); used.height = H0;
        used.getContext('2d').drawImage(f.canvas, f.srcX, 0, f.len, H0, 0, 0, f.len, H0);
        const lw = f.srcX, rw = f.canvas.width - (f.srcX + f.len); // 인접 조각의 전체 원본 폭까지 가져올 수 있게 보관
        let leftExtra = null, rightExtra = null;
        if (lw > 0) { leftExtra = document.createElement('canvas'); leftExtra.width = lw; leftExtra.height = H0; leftExtra.getContext('2d').drawImage(f.canvas, f.srcX - lw, 0, lw, H0, 0, 0, lw, H0); }
        if (rw > 0) { rightExtra = document.createElement('canvas'); rightExtra.width = rw; rightExtra.height = H0; rightExtra.getContext('2d').drawImage(f.canvas, f.srcX + f.len, 0, rw, H0, 0, 0, rw, H0); }
        const t0 = f.t0 != null ? f.t0 : group[k].seg.start, t1 = f.t1 != null ? f.t1 : group[k].seg.end;
        const o = f.ovl;
        const cutOverlap = o && o.kind === 'overlap' ? o.px : 0, cutDup = f.dupFixed || 0;
        pieces.push({
          type: 'page', segIds: [ids[k]], chunks: [used], totalW: used.width, fallbackT: t0,
          tAt: x => t0 + (Math.max(0, Math.min(used.width, x)) / used.width) * (t1 - t0), // 타일 안 폭 비례(추정)
          leftExtra, rightExtra, groupId: gid, expect: firstReal ? groupExpect : 0, internal: !firstReal, regFrac: firstReal ? groupRegFrac : 0,
          internalJoin: firstReal ? null : {
            state: cutOverlap > 0 ? 'overlap' : 'butt', suspect: !(cutOverlap > 0), seamSuspect: false, trim: 0, suggestTrim: 0,
            ovl: o ? { status: o.kind, px: o.px || 0, iou: o.iou != null ? o.iou : null, why: o.why || null, cands: o.cands } : null,
            dupFixed: cutDup, suggestDup: 0, margin: null, internal: true, cutOverlap, cutDup,
          },
        });
        firstReal = false;
      });
    } else {
      // 어느 타일에서도 오선을 찾지 못함 — 이음 분석 없이 전처리한 타일을 그대로 이어 붙인다(결과가 아예 안 나오는 것보다 낫다).
      const gid = ++uniGroupSeq;
      group.forEach((g, gi) => {
        const c = cloneCanvas(g.raw);
        scrollApplyPreprocInPlace(c, uniDecideOpts(c, uniDefaults));
        segJoinPage[g.seg.id] = '오선 미검출 — 그대로 이어 붙임';
        segContrib[g.seg.id] = { px: c.width, dropped: false, removed: 0 };
        const t0 = g.seg.start, t1 = g.seg.end;
        pieces.push({ type: 'page', segIds: [g.seg.id], chunks: [c], totalW: c.width, fallbackT: t0,
          tAt: x => t0 + (Math.max(0, Math.min(c.width, x)) / c.width) * (t1 - t0),
          leftExtra: null, rightExtra: null, groupId: gid, expect: 0, internal: false, internalJoin: null, regFrac: gi === 0 ? groupRegFrac : regFracBetween(group[gi - 1].seg, g.seg) });
      });
    }
    group = [];
  };
  for (const seg of segs) {
    if (!include[seg.id]) continue;
    if (seg.kind === 'page') {
      const pr = products.page[seg.id];
      if (pr) group.push({ seg, raw: pr.raw, t: pr.t });
    } else if (seg.kind === 'flow') {
      await flush();
      const fp = products.flow[seg.id];
      if (fp && fp.res) segContrib[seg.id] = { px: fp.res.totalW, dropped: false, removed: 0 };
      if (fp && fp.res) {
        pieces.push({ type: 'flow', segIds: [seg.id], chunks: fp.res.chunks, totalW: fp.res.totalW, track: fp.res.track, tFirst: fp.res.tFirst, leftExtra: null, rightExtra: null, expect: 0, regFrac: regFracBetween(lastSeg, seg) });
        lastSeg = seg;
      }
    }
  }
  await flush();
  if (!pieces.length) return null;
  const H = pieces[0].chunks[0].height;
  const joinsAuto = uniAnalyzeJoins(pieces, nativeW, H);
  return { pieces, joinsAuto, segJoinPage, segContrib, H };
}


// 통합 모드용 2단계 — FlowStage2(수정 금지)를 복사해 마디 더블클릭 편집·누락 경고를 더한 것. 마디 감지·그룹화·시간 매핑·빌더 전송 로직은 같다.
function UniStage2({ result, videoFile, flowDefaults, editCtx }) {
  const { chunks, totalW, H, track, stats } = result;
  const nativeW = track.nativeW;
  const [det, setDet] = useState(null);
  const [detecting, setDetecting] = useState(false);
  const [detProgress, setDetProgress] = useState(0);
  const [bars, setBars] = useState([]);
  const [selIdx, setSelIdx] = useState(null);
  const [groupSizeUser, setGroupSizeUser] = useState(null);
  const [maxBarsUser, setMaxBarsUser] = useState(null);
  const [groupBasis, setGroupBasis] = useState('auto');
  const [offsetSec, setOffsetSec] = useState(0);
  const [sending, setSending] = useState(false);
  const scrollRef = useRef(null);
  const pvRef = useRef(null);
  const stopAtRef = useRef(null);
  const scale = Math.min(1, 180 / H);
  const [editIdx, setEditIdx] = useState(null);
  const ctx2 = editCtx || {};
  const editIdxRef = useRef(null), barsRef = useRef([]), delRef = useRef(null);
  editIdxRef.current = editIdx; barsRef.current = bars;
  delRef.current = () => { const i = editIdxRef.current, bs = barsRef.current; if (i != null && bs[i + 1] != null && ctx2.onDeleteMeasure) { ctx2.onDeleteMeasure(bs[i], bs[i + 1]); setEditIdx(null); } };
  useEffect(() => {
    function onKey(e) { // Delete/Backspace = 편집 중인 마디 삭제 (입력창에 포커스가 있으면 제외)
      if (e.key !== 'Delete' && e.key !== 'Backspace') return;
      if (editIdxRef.current == null) return;
      const el = document.activeElement, tag = el && el.tagName;
      if (el && (tag === 'TEXTAREA' || tag === 'SELECT' || el.isContentEditable || (tag === 'INPUT' && !['range', 'checkbox', 'radio', 'button'].includes(el.type)))) return;
      e.preventDefault();
      delRef.current();
    }
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  async function detect() {
    setDetecting(true); setDetProgress(0); setSelIdx(null); setEditIdx(null);
    try {
      // 높이가 큰 띠(자동 모드가 페이지를 원본 해상도로 다시 잡은 경우)는 마디선 검출만 높이 ~320px 축소본에서 하고 위치를 되돌린다.
      // 원본 해상도에선 마디선이 1px로 가늘어 연속도 검사에서 빠졌다 (소수빈 4K: 62개 중 56개만 잡힘)
      const k = H > 420 ? 320 / H : 1;
      let r;
      if (k < 1) {
        const small = chunks.map(c => {
          const o = document.createElement('canvas');
          o.width = Math.max(1, Math.round(c.width * k)); o.height = Math.round(H * k);
          const g = o.getContext('2d'); g.imageSmoothingQuality = 'high'; g.drawImage(c, 0, 0, o.width, o.height);
          return o;
