          </div>
        </div>
      )}
    </div>
  );
}

// ================================================================================================
// ==== SCROLL MODE (새 모드) — scroll-stitch-test.html에서 검증된 알고리즘을 그대로 이식.
// 겹침 탐색(NCC)/마디선 기하 검출은 프로토타입 그대로이고, "N마디씩 그룹핑"만 이번 스펙대로
// (고정 마디수가 아니라 목표 픽셀폭 기반으로) 새로 작성했다. 전처리는 이 파일 상단의 기존
// applyThreshold/despeckleBinary/detectPlayheadRuns/removePlayheadRuns를 그대로 재사용한다
// (재구현 없음) — scrollApplyPreprocInPlace는 그 원시 함수들을 drawProcessed와 동일한 순서로
// "제자리에서"(크롭 없이) 적용하는 아주 얇은 래퍼일 뿐이다.
// 페이지 전환형(CaptureStep/SelectStep/PreprocessStep, drawProcessed, effectiveImageSettings 등)은
// 이 섹션에서 전혀 건드리지 않는다 — 이름 충돌이 있는 것만(detectStaffBand) 접두사를 바꿨다.
// ================================================================================================

const SCROLL_PLAYHEAD_HUE_DEFAULT = 210;
const SCROLL_PLAYHEAD_HUE_TOLERANCE_DEFAULT = 35;
const SCROLL_PLAYHEAD_SAT_MIN_DEFAULT = 0.35;

const SCROLL_DEFAULTS_INIT = {
  removeBg: true, invertMode: 'auto', threshold: 110, softness: 12,
  despeckle: true, despeckleSize: 3,
  playheadRemove: false, playheadColor: null, // null = SCROLL_PLAYHEAD_* 기본값 사용
};

// drawProcessed와 동일한 순서(재생 커서 제거 → 배경 threshold[+자동 반전 판단] → 잡티 제거)로,
// 이미 원본 해상도로 캡처된 canvas에 "크롭 없이 제자리에서" 적용한다 — 대표 프레임은 스티칭 전에
// 반드시 이 순서(원본 해상도에서 전처리 먼저, 축소는 나중)를 지켜야 스페클 노이즈가 생기지 않는다.
// ---- 오선 줄 복원 (전처리) ----
// 임계값을 적용하기 전 그레이 이미지의 행별 평균 어두움 프로파일에서, 주변 행보다 뚜렷이 어두운 행(피크)을 오선 후보로
// 잡는다. 간격이 일정(±15%)한 5~6줄 묶음이 확인되면(4줄 + 규칙적인 위치의 옅은 피크 1줄도 인정) 그 행들은 임계값과
// 무관하게 가로로 연속된 구간을 잉크로 복원한다 — 맨 위·맨 아래 줄이 옅어도 살아남는다.
function detectStaffRowsFromGray(d, w, h, invert) {
  const prof = new Float32Array(h);
  for (let y = 0; y < h; y++) {
    let sum = 0;
    const base = y * w * 4;
    for (let x = 0; x < w; x++) {
      const i = base + x * 4;
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      sum += invert ? lum : 255 - lum;
    }
    prof[y] = sum / (w * 255);
  }
  const con = new Float32Array(h);
  for (let y = 0; y < h; y++) {
    const vals = [];
    for (let k = -8; k <= 8; k++) {
      if (Math.abs(k) <= 2) continue;
      const yy = y + k;
      if (yy >= 0 && yy < h) vals.push(prof[yy]);
    }
    vals.sort((p, q) => p - q);
    con[y] = prof[y] - (vals.length ? vals[vals.length >> 1] : 0);
  }
  const cluster = thr => {
    const out = [];
    let cur = null;
    for (let y = 0; y < h; y++) {
      if (con[y] >= thr) {
        if (cur && y - cur.y1 <= 1) { cur.y1 = y; if (con[y] > cur.peak) { cur.peak = con[y]; cur.py = y; } }
        else { if (cur) out.push(cur); cur = { y0: y, y1: y, peak: con[y], py: y }; }
      }
    }
    if (cur) out.push(cur);
    for (const l of out) l.y = (l.y0 + l.y1) / 2;
    return out;
  };
  const strong = cluster(0.12);
  if (strong.length < 4) return [];
  const weak = cluster(0.03);
  const groups = [];
  let i = 0;
  while (i < strong.length) {
    let best = null;
    for (let j = i + 1; j < strong.length; j++) {
      const d0 = strong[j].y - strong[i].y;
      if (d0 < 3) continue;
      if (d0 > h / 4) break;
      const chain = [i, j];
      let avg = d0, last = j;
      while (chain.length < 6) {
        let found = -1;
        for (let k = last + 1; k < strong.length; k++) {
          const gap = strong[k].y - strong[last].y;
          if (gap > avg * 1.15) break;
          if (gap >= avg * 0.85) { found = k; break; }
        }
        if (found < 0) break;
        chain.push(found);
        avg = (strong[found].y - strong[i].y) / (chain.length - 1);
        last = found;
      }
      if (chain.length >= 4 && (!best || chain.length > best.chain.length)) best = { chain, d: avg };
    }
    if (!best) { i++; continue; }
    groups.push(best);
    i = best.chain[best.chain.length - 1] + 1;
  }
  const rows = [];
  for (const gr of groups) {
    const ls = gr.chain.map(k => ({ y0: strong[k].y0, y1: strong[k].y1, weakAdded: false }));
    const thick = Math.max(1, Math.round(medianOf(gr.chain.map(k => strong[k].y1 - strong[k].y0 + 1))));
    const findWeak = target => {
      let bestW = null;
      for (const wk of weak) {
        if (Math.abs(wk.py - target) <= gr.d * 0.15 && (!bestW || wk.peak > bestW.peak)) bestW = wk;
      }
      return bestW;
    };
    const firstY = (ls[0].y0 + ls[0].y1) / 2, lastY = (ls[ls.length - 1].y0 + ls[ls.length - 1].y1) / 2;
    if (ls.length < 6) {
      const up = findWeak(firstY - gr.d), dn = findWeak(lastY + gr.d);
      const need = ls.length === 4 ? 0.03 : 0.06; // 4줄 → 5줄은 옅은 피크도 인정, 5줄 → 6줄(TAB)은 조금 더 뚜렷할 때만
      const cand = [up, dn].filter(c => c && c.peak >= need).sort((p, q) => q.peak - p.peak)[0];
      if (cand) {
        const y0 = cand.py - Math.floor((thick - 1) / 2);
        const nl = { y0, y1: y0 + thick - 1, weakAdded: true };
        if (cand === up) ls.unshift(nl); else ls.push(nl);
      }
    }
    if (ls.length < 5) continue;
    for (const l of ls) rows.push({ y0: Math.max(0, l.y0), y1: Math.min(h - 1, l.y1), d: gr.d, weakAdded: l.weakAdded });
  }
  return rows;
}

// 임계값 적용 전 그레이에서 줄 행별로 "가로로 연속된 선 구간"을 계획한다 (줄 행 vs 줄 사이 중간 행의 국소 대비).
function planStaffRestore(d, w, h, invert) {
  const rows = detectStaffRowsFromGray(d, w, h, invert);
  const ink = (x, y) => {
    const i = (y * w + x) * 4;
    const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
    return (invert ? lum : 255 - lum) / 255;
  };
  const minRun = Math.max(12, Math.round(w * 0.05));
  return rows.map(r => {
    const half = Math.max(2, Math.round(r.d / 2));
    const refRows = [r.y0 - half, r.y1 + half].filter(y => y >= 0 && y < h);
    const marks = new Uint8Array(w);
    for (let x = 0; x < w; x++) {
      let la = 0;
      for (let y = r.y0; y <= r.y1; y++) la += ink(x, y);
      la /= (r.y1 - r.y0 + 1);
      let ref = 0;
      for (const y of refRows) ref += ink(x, y);
      ref = refRows.length ? ref / refRows.length : 0;
      if (la - ref >= 0.05) marks[x] = 1;
    }
    const gapMax = Math.max(3, Math.round(r.d * 0.6));
    const segs = [];
    let x = 0;
    while (x < w) {
      if (!marks[x]) { x++; continue; }
      let e = x, gap = 0;
      for (let k = x + 1; k < w; k++) {
        if (marks[k]) { e = k; gap = 0; } else if (++gap > gapMax) break;
      }
      if (e - x + 1 >= minRun) segs.push([x, e]);
      x = e + 1;
    }
    return { y0: r.y0, y1: r.y1, weakAdded: r.weakAdded, segs };
  });
}

// 임계값·잡티 제거가 끝난 뒤 계획된 구간을 잉크(검정)로 복원. 복원으로 새로 검게 된 비율이 5% 이상이면 restored.
function paintStaffRestore(imageData, w, plan) {
  const dd = imageData.data;
  return plan.map(r => {
    let added = 0, total = 0;
    for (const [xa, xb] of r.segs) {
      for (let y = r.y0; y <= r.y1; y++) {
        for (let x = xa; x <= xb; x++) {
          const i = (y * w + x) * 4;
          total++;
          if (dd[i] > 127) added++;
          dd[i] = dd[i + 1] = dd[i + 2] = 0; dd[i + 3] = 255;
        }
      }
    }
    const rowsN = r.y1 - r.y0 + 1;
    return { y0: r.y0, y1: r.y1, weakAdded: r.weakAdded, restored: added / Math.max(1, rowsN * w) >= 0.05, added };
  });
}

// 반환: 복원 정보 [{y0,y1,restored,weakAdded}] 또는 null (디버그 오버레이용)
function scrollApplyPreprocInPlace(canvas, opts) {
  if (!opts.removeBg && !opts.playheadRemove) return null;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  if (opts.playheadRemove) {
    const imageData = ctx.getImageData(0, 0, w, h);
    const band = opts.playheadColor || {
      hue: SCROLL_PLAYHEAD_HUE_DEFAULT, hueTolerance: SCROLL_PLAYHEAD_HUE_TOLERANCE_DEFAULT, satMin: SCROLL_PLAYHEAD_SAT_MIN_DEFAULT,
    };
    const runs = detectPlayheadRuns(imageData, w, h, band);
    removePlayheadRuns(imageData, w, h, runs, [], { r: 255, g: 255, b: 255 });
    ctx.putImageData(imageData, 0, 0);
  }
  let info = null;
  if (opts.removeBg) {
    const avg = computeAvgLuminanceFromCanvas(canvas);
    const invert = opts.invertMode === 'auto' ? (avg < 128) : (opts.invertMode === 'on');
    const imageData = ctx.getImageData(0, 0, w, h);
    // 기존 임계값·번짐·잡티 제거는 그대로 두고, 오선 행에만 보정을 추가한다
    const plan = opts.restoreStaff === false ? null : planStaffRestore(imageData.data, w, h, invert);
    applyThreshold(imageData, opts.threshold, invert, opts.softness || 0);
    if (opts.despeckle) despeckleBinary(imageData, w, h, opts.despeckleSize || 0);
    if (plan && plan.length) info = paintStaffRestore(imageData, w, plan);
    ctx.putImageData(imageData, 0, 0);
  }
  return info;
}

// 표시(미리보기)용으로만 쓰는 고품질 축소 — 브라우저의 drawImage 한 번으로 큰 비율(예: 7~8배)을
// 한꺼번에 축소하면 이진화된 가는 선/도트에서 무아레(지글거림)가 두드러진다. 목표 폭의 2배보다
// 클 동안 절반씩 반복해서 줄이면(각 단계가 대략 박스 필터처럼 작동) 훨씬 매끄럽다. destCanvas에
// 그리는 게 전부이고 원본(srcCanvas)은 건드리지 않으므로, 실제 저장/스티칭에 쓰는 원본 해상도
// 데이터에는 영향이 없다.
function drawDownscaledStaged(srcCanvas, destCanvas, targetW) {
  let cur = srcCanvas;
  while (cur.width > targetW * 2) {
    const half = document.createElement('canvas');
    half.width = Math.max(1, Math.round(cur.width / 2));
    half.height = Math.max(1, Math.round(cur.height / 2));
    half.getContext('2d').drawImage(cur, 0, 0, half.width, half.height);
    cur = half;
  }
  const scale = Math.min(1, targetW / cur.width);
  destCanvas.width = Math.max(1, Math.round(cur.width * scale));
  destCanvas.height = Math.max(1, Math.round(cur.height * scale));
  destCanvas.getContext('2d').drawImage(cur, 0, 0, destCanvas.width, destCanvas.height);
}

// ---- NCC 기반 겹침 탐색 + 이어붙이기 — scroll-stitch-test.html에서 그대로 이식 ----

function scrollGetGray(canvas, maxDim) {
  const w0 = canvas.width, h0 = canvas.height;
  const scale = maxDim ? Math.min(1, maxDim / Math.max(w0, h0)) : 1;
  const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(canvas, 0, 0, w, h);
  const data = c.getContext('2d').getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  }
  return { gray, w, h, scale };
}

function scrollNcc(arrA, arrB, n) {
  let meanA = 0, meanB = 0;
  for (let i = 0; i < n; i++) { meanA += arrA[i]; meanB += arrB[i]; }
  meanA /= n; meanB /= n;
  let num = 0, denA = 0, denB = 0;
  for (let i = 0; i < n; i++) {
    const da = arrA[i] - meanA, db = arrB[i] - meanB;
    num += da * db; denA += da * da; denB += db * db;
  }
  if (denA < 1e-6 || denB < 1e-6) return -1;
  return num / Math.sqrt(denA * denB);
}

function scrollScoreShift(gA, gB, direction, s, W, H) {
  const bufA = [], bufB = [];
  if (direction === 'vertical') {
    const overlapH = H - s;
    if (overlapH < 4) return null;
    for (let y = 0; y < overlapH; y++) {
      const yA = y + s, yB = y;
      for (let x = 0; x < W; x++) {
        bufA.push(gA.gray[yA * gA.w + x]);
        bufB.push(gB.gray[yB * gB.w + x]);
      }
    }
  } else {
    const overlapW = W - s;
    if (overlapW < 4) return null;
    for (let x = 0; x < overlapW; x++) {
      const xA = x + s, xB = x;
      for (let y = 0; y < H; y++) {
        bufA.push(gA.gray[y * gA.w + xA]);
        bufB.push(gB.gray[y * gB.w + xB]);
      }
    }
  }
  return scrollNcc(bufA, bufB, bufA.length);
}

// 최소-겹침 편향 버그 방지: 최고 NCC 대비 tolerance(0.03) 이내인 shift들 중 "가장 작은 shift"
// (=가장 많이 겹치는 지점)를 채택 — 단순 최대NCC 채택 금지 (탐색범위 s는 오름차순이므로 첫 번째
// 통과 항목이 곧 가장 작은 shift다).
// 스크롤 축 방향 평균 제거 — 오선은 스크롤 방향으로 계속 이어지는 선이라 어느 shift에서나 겹쳐 보여
// NCC 바닥값을 깔아버린다. 선(행/열)마다 그 선 위의 평균을 빼면 오선(및 균일한 줄)이 사라지고 음표
// 등 실제 내용만 남는다. direction이 horizontal이면 행별(x방향) 평균, vertical이면 열별(y방향) 평균.
function scrollRemoveAxisMean(g, direction) {
  const { gray, w, h } = g;
  if (direction === 'vertical') {
    for (let x = 0; x < w; x++) {
      let m = 0;
      for (let y = 0; y < h; y++) m += gray[y * w + x];
      m /= h;
      for (let y = 0; y < h; y++) gray[y * w + x] -= m;
    }
  } else {
    for (let y = 0; y < h; y++) {
      let m = 0;
      const base = y * w;
      for (let x = 0; x < w; x++) m += gray[base + x];
      m /= w;
      for (let x = 0; x < w; x++) gray[base + x] -= m;
    }
  }
}

// 재생바/하이라이트 열만 중립화한다. 마디선은 정렬 단서이므로 지우지 않는다 — 가로 스크롤에서는 보표 밴드를
// 먼저 찾아, 밴드 밖으로 끊김 없이 0.6 staff space 이상 삐져나오는 선만 재생바로 본다. 보표를 못 찾는
// 경우(저해상도 등)에만 예전 규칙(높이의 85% 이상이 어두운 열)을 쓴다.
function scrollFullLineMask(gA, gB, direction) {
  const len = direction === 'vertical' ? Math.min(gA.h, gB.h) : Math.min(gA.w, gB.w);
  const mask = new Uint8Array(len);
  for (const g of [gA, gB]) {
    const sys = direction === 'vertical' ? null : detectStaffSystem(g, 0.3, 140);
    for (let i = 0; i < len; i++) {
      if (sys) {
        const lim = Math.max(2, Math.round(sys.space * 2));
        const prot = Math.max(
          contiguousInk(g, i, sys.main.top - 1, -1, lim, 128),
          contiguousInk(g, i, sys.main.bottom + 1, 1, lim, 128)
        );
        if (prot >= sys.space * 0.6) mask[i] = 1;
        continue;
      }
      let dark = 0;
      if (direction === 'vertical') { for (let x = 0; x < g.w; x++) if (g.gray[i * g.w + x] < 128) dark++; if (dark / g.w >= 0.85) mask[i] = 1; }
      else { for (let y = 0; y < g.h; y++) if (g.gray[y * g.w + i] < 128) dark++; if (dark / g.h >= 0.85) mask[i] = 1; }
    }
  }
  return mask;
}
function scrollApplyLineMask(gA, gB, mask, direction) {
  for (const g of [gA, gB]) {
    for (let i = 0; i < mask.length; i++) {
      if (!mask[i]) continue;
      if (direction === 'vertical') { for (let x = 0; x < g.w; x++) g.gray[i * g.w + x] = 0; }
      else { for (let y = 0; y < g.h; y++) g.gray[y * g.w + i] = 0; }
    }
  }
}

// opts: { removeStaff, maskPlaybar, minShift, maxShift, maxDim } — minShift/maxShift는 원본 해상도 px 단위(생략하면
// 기존처럼 전체 길이의 15%~85%). 기존 호출(opts 없음)은 동작이 완전히 동일하다.
function scrollFindBestShift(canvasA, canvasB, direction, opts) {
  opts = opts || {};
  const SEARCH_MAXDIM = opts.maxDim || 220;
  const gA = scrollGetGray(canvasA, SEARCH_MAXDIM);
  const gB = scrollGetGray(canvasB, SEARCH_MAXDIM);
  // 재생바 열 제외: 높이(폭)의 85% 이상이 어두운 선은 오선·내용이 아니라 재생바/마디선이므로 양쪽 모두에서 중립화
  const lineMask = opts.maskPlaybar ? scrollFullLineMask(gA, gB, direction) : null;
  if (opts.removeStaff) { scrollRemoveAxisMean(gA, direction); scrollRemoveAxisMean(gB, direction); }
  if (lineMask) scrollApplyLineMask(gA, gB, lineMask, direction);
  const W = Math.min(gA.w, gB.w), H = Math.min(gA.h, gB.h);

  const totalLen = direction === 'vertical' ? H : W;
  let minLen = Math.max(2, Math.round(totalLen * 0.15));
  let maxLen = Math.round(totalLen * 0.85);
  if (opts.minShift != null) minLen = Math.max(1, Math.round(opts.minShift * gA.scale));
  if (opts.maxShift != null) maxLen = Math.min(totalLen - 1, Math.max(minLen, Math.round(opts.maxShift * gA.scale)));

  const scores = [];
  for (let s = minLen; s <= maxLen; s++) {
    const sc = scrollScoreShift(gA, gB, direction, s, W, H);
    if (sc !== null) scores.push({ s, ncc: sc });
  }
  if (scores.length === 0) return { shift: 0, score: -1, ok: false };

  let bestNcc = -Infinity;
  for (const it of scores) if (it.ncc > bestNcc) bestNcc = it.ncc;

  const TOLERANCE = 0.03;
  let chosen = scores[0];
  for (const it of scores) {
    if (it.ncc >= bestNcc - TOLERANCE) { chosen = it; break; }
  }

  const shiftFull = Math.round(chosen.s / gA.scale);
  return { shift: shiftFull, score: chosen.ncc, ok: chosen.ncc > 0.5 };
}

function scrollFindBestShiftAuto(canvasA, canvasB) {
  const v = scrollFindBestShift(canvasA, canvasB, 'vertical');
  const h = scrollFindBestShift(canvasA, canvasB, 'horizontal');
  if (h.score > v.score) return { direction: 'horizontal', ...h };
  return { direction: 'vertical', ...v };
}

// 중복 프레임 스킵: shift=0 상태(오프셋 탐색 없이 전체 프레임)에서 NCC ≥ 0.9면 "실제 스크롤
// 없었음"으로 보고 해당 쌍을 스티칭에서 완전히 제외한다.
const SCROLL_DUP_SIMILARITY_THRESHOLD = 0.9;
function scrollIsDuplicateFrame(canvasA, canvasB, removeStaff) {
  const SEARCH_MAXDIM = 220;
  const gA = scrollGetGray(canvasA, SEARCH_MAXDIM);
  const gB = scrollGetGray(canvasB, SEARCH_MAXDIM);
  if (removeStaff) { scrollRemoveAxisMean(gA, 'horizontal'); scrollRemoveAxisMean(gB, 'horizontal'); }
  const W = Math.min(gA.w, gB.w), H = Math.min(gA.h, gB.h);
  const bufA = [], bufB = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      bufA.push(gA.gray[y * gA.w + x]);
      bufB.push(gB.gray[y * gB.w + x]);
    }
  }
  const sim = scrollNcc(bufA, bufB, bufA.length);
  return { isDup: sim >= SCROLL_DUP_SIMILARITY_THRESHOLD, sim };
}

// ---- 보표 구조 + 마디선(bar-line) 기하 검출 ----
// 줄 간격(staff space) 기준으로 5선/6선 보표를 묶고, 인접 보표(간격 1.5~6 staff space)는 하나의
// 시스템(큰 보표)으로 병합한다. 마디선은 시스템 밴드 높이를 거의 끊김 없이 덮는 가늘고 고립된 세로
// 획만 인정한다(화음 덩어리·줄기 제외). OCR/ML 없음. (예전 detectStaffYBand/detectBarLines는 이
// 구조 인식으로 대체되어 제거됨.)

function scrollGetFullGrayData(canvas) {
  const ctx = canvas.getContext('2d');
  const { width: W, height: H } = canvas;
  const data = ctx.getImageData(0, 0, W, H).data;
  const gray = new Float32Array(W * H);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  }
  return { gray, w: W, h: H };
}

function medianOf(arr) {
  if (!arr.length) return 0;
  const s = [...arr].sort((a, b) => a - b);
  return s[Math.floor(s.length / 2)];
}

// 두 보표 사이(위 보표 마지막 줄 yFrom ~ 아래 보표 첫 줄 yTo)를 세로로 잇는 연속 획의 최대 열 커버리지(0~1).
// 실제 영상은 마디선이 흐리거나 끊기므로 완화된 기준(어두움 임계 180, 3px 끊김 허용)으로 센다.
function staffConnectionScore(g, yFrom, yTo) {
  const len = yTo - yFrom + 1;
  if (len <= 0) return 0;
  let best = 0;
  for (let x = 0; x < g.w; x++) {
    let runStart = -1, lastDark = -1, colBest = 0;
    for (let y = yFrom; y <= yTo; y++) {
      if (g.gray[y * g.w + x] < 180) {
        if (runStart < 0 || y - lastDark > 4) runStart = y;
        lastDark = y;
        if (lastDark - runStart + 1 > colBest) colBest = lastDark - runStart + 1;
      }
    }
    if (colBest > best) best = colBest;
    if (best >= len) break;
  }
  return Math.min(1, best / len);
}

// lineFrac: 한 행에서 어두운 픽셀 비율이 이 이상이면 오선 후보 행(완화된 값 권장). 일부 줄이 연해서
// 빠져도 등간격(약 2배 간격이면 빠진 줄 1개로 간주)으로 보충한다.
function detectStaffSystem(g, lineFrac, darkThresh) {
  darkThresh = darkThresh || 140;
  const rowDark = new Float32Array(g.h);
  for (let y = 0; y < g.h; y++) {
    let cnt = 0;
    const base = y * g.w;
    for (let x = 0; x < g.w; x++) if (g.gray[base + x] < darkThresh) cnt++;
    rowDark[y] = cnt / g.w;
  }
  const lines = [];
  let cur = null;
  for (let y = 0; y < g.h; y++) {
    if (rowDark[y] >= lineFrac) {
      if (cur && y - cur.y1 <= 2) cur.y1 = y;
      else { if (cur) lines.push(cur); cur = { y0: y, y1: y }; }
    }
  }
  if (cur) lines.push(cur);
  // 줄 두께 포함: 줄 행 바로 바깥의 옅은 가장자리 행(임계의 절반 이상)도 줄에 포함, 행별 어두움 비율 기록
  for (const l of lines) {
    for (let k = 0; k < 2 && l.y0 - 1 >= 0 && rowDark[l.y0 - 1] >= lineFrac * 0.5; k++) l.y0--;
    for (let k = 0; k < 2 && l.y1 + 1 < g.h && rowDark[l.y1 + 1] >= lineFrac * 0.5; k++) l.y1++;
    l.y = (l.y0 + l.y1) / 2;
    let r = 0;
    for (let y = l.y0; y <= l.y1; y++) if (rowDark[y] > r) r = rowDark[y];
    l.ratio = r;
  }
  if (lines.length < 4) return null;

  const gaps = [];
  for (let i = 1; i < lines.length; i++) gaps.push(lines[i].y - lines[i - 1].y);
  const sortedGaps = [...gaps].sort((a, b) => a - b);
  const minGap = sortedGaps.find(v => v >= 3) || sortedGaps[0];
  const space = medianOf(gaps.filter(v => v >= minGap * 0.75 && v <= minGap * 1.3)) || minGap;
  if (!(space >= 2)) return null;

  const staves = [];
  let chain = [lines[0]];
  for (let i = 1; i < lines.length; i++) {
    const gap = lines[i].y - lines[i - 1].y;
    if (gap <= space * 1.45) {
      chain.push(lines[i]);
    } else if (gap >= space * 1.7 && gap <= space * 2.3 && chain.length <= 5) {
      const my = Math.round((lines[i - 1].y + lines[i].y) / 2);
      chain.push({ y: my, y0: my, y1: my, synth: true });
      chain.push(lines[i]);
    } else {
      staves.push(chain);
      chain = [lines[i]];
    }
  }
  staves.push(chain);
  // 밴드 보강: 줄 수가 5(또는 TAB 6)에서 1개 모자라면 규칙적인 간격(±15%) 위치의 위·아래에서 어두움 비율 ≥ 0.15인 줄이
  // 있는지 확인해 포함한다. 밴드 top/bottom은 첫 줄의 윗가장자리·마지막 줄의 아랫가장자리(줄 두께 포함).
  for (const st of staves) {
    if (st.length !== 4 && st.length !== 5) continue;
    const gs = [];
    for (let i = 1; i < st.length; i++) gs.push(st[i].y - st[i - 1].y);
    const sp = medianOf(gs);
    if (!(sp >= 2)) continue;
    const tryFind = cy => {
      const lo = Math.max(0, Math.round(cy - sp * 0.15)), hi = Math.min(g.h - 1, Math.round(cy + sp * 0.15));
      let by = -1, br = 0;
      for (let y = lo; y <= hi; y++) if (rowDark[y] > br) { br = rowDark[y]; by = y; }
      if (by < 0 || br < 0.15) return null;
      let y0 = by, y1 = by;
      while (y0 - 1 >= 0 && rowDark[y0 - 1] >= 0.075 && by - y0 < 2) y0--;
      while (y1 + 1 < g.h && rowDark[y1 + 1] >= 0.075 && y1 - by < 2) y1++;
      return { y: (y0 + y1) / 2, y0, y1, ratio: br, weak: true };
    };
    const up = tryFind(st[0].y - sp), dn = tryFind(st[st.length - 1].y + sp);
    const cand = [up, dn].filter(Boolean).sort((p, q) => q.ratio - p.ratio)[0];
    if (cand) { if (cand === up) st.unshift(cand); else st.push(cand); }
  }
  const valid = staves.filter(s => s.length >= 5 && s.length <= 6);
  if (!valid.length) return null;

  const systems = [];
  const splitScores = [];
  let sys = null;
  for (const st of valid) {
    const firstY = st[0].y, lastY = st[st.length - 1].y;
    if (sys) {
      const gapToPrev = firstY - sys.lastLineY;
      if (gapToPrev >= space * 1.5 && gapToPrev <= space * 15) {
        // 위아래로 인접한 보표(간격 ≤15배)는 기본적으로 한 시스템. 연결 획이 전혀 없을 때(점수 < 0.3)만
        // 별개 시스템(ROI에 서로 다른 줄이 들어온 경우)으로 분리한다.
        const conn = staffConnectionScore(g, sys.bottom, st[0].y0);
        if (conn >= 0.3) {
          sys.staves.push(st); sys.bottom = st[st.length - 1].y1; sys.lastLineY = lastY;
          sys.connScores.push(conn);
          continue;
        }
        splitScores.push(conn);
      }
    }
    sys = { staves: [st], top: st[0].y0, bottom: st[st.length - 1].y1, lastLineY: lastY, connScores: [] };
    systems.push(sys);
  }
  for (const s of systems) {
    s.lines = [];
    for (const st of s.staves) for (const l of st) s.lines.push(l);
    s.lineCount = s.lines.filter(l => !l.synth).length;
  }
  let main = systems[0];
  for (const s of systems) {
    if (s.lineCount > main.lineCount || (s.lineCount === main.lineCount && (s.bottom - s.top) > (main.bottom - main.top))) main = s;
  }
  const pad = Math.max(1, Math.round(space * 0.15));
  const mask = new Uint8Array(g.h); // 모든 시스템의 오선 행 (공백 열 판정에서 오선을 잉크로 보지 않기 위함)
  for (const sy of systems) for (const l of sy.lines) {
    for (let y = Math.max(0, l.y0 - pad); y <= Math.min(g.h - 1, l.y1 + pad); y++) mask[y] = 1;
  }
  return { systems, main, space, mask, connScores: main.connScores, splitScores, rowDark };
}

function staffLeftEdge(g, sys) {
  const lns = sys.main.lines.filter(l => !l.synth);
  for (let x = 0; x < g.w; x++) {
    let c = 0;
    for (const l of lns) {
      for (let y = Math.max(0, l.y0 - 1); y <= Math.min(g.h - 1, l.y1 + 1); y++) {
        if (g.gray[y * g.w + x] < 140) { c++; break; }
      }
    }
    if (c >= lns.length * 0.5) return x;
  }
  return 0;
}

// 열별 "밴드 높이 대비 가장 긴 수직 연속 획 비율" (1~2px 끊김 허용)
function computeBarCoverage(g, top, bottom, darkThresh) {
  const band = Math.max(1, bottom - top + 1);
  const cover = new Float32Array(g.w);
  for (let x = 0; x < g.w; x++) {
    let best = 0, runStart = -1, lastDark = -1;
    for (let y = top; y <= bottom; y++) {
      if (g.gray[y * g.w + x] < darkThresh) {
        if (runStart < 0 || y - lastDark > 3) runStart = y;
        lastDark = y;
        const len = lastDark - runStart + 1;
        if (len > best) best = len;
      }
    }
    cover[x] = best / band;
  }
  return cover;
}

// ---- 마디선 = "시스템 전체 관통선" ----
// 열별로 각 오선 구간(줄 5~6개 범위)의 어두운 픽셀 연속도를 단마다 따로 계산한다(단 사이 간격 구간은 제외).
// 시스템의 모든 단에서 연속도 ≥ T인 열을 후보로 보고, 단마다 찾은 x는 ±max(3px, 오선 간격×0.4) 안에서
// 같은 선으로 병합(x 평균). 선 두께 1~6px 허용(겹마디선·반복기호 포함). 단 사이 간격 구간의 연속도도
// ≥0.7이면 신뢰도 가점(통과 여부에는 영향 없음). 1단 악보도 같은 기준(그 단 전체 관통).
function columnRunFraction(g, x, y0, y1, darkThresh) {
  const len = y1 - y0 + 1;
  if (len <= 0) return 0;
  let best = 0, runStart = -1, lastDark = -1;
  for (let y = y0; y <= y1; y++) {
    if (g.gray[y * g.w + x] < darkThresh) {
      if (runStart < 0 || y - lastDark > 3) runStart = y;
      lastDark = y;
      if (lastDark - runStart + 1 > best) best = lastDark - runStart + 1;
    }
  }
  return best / len;
}

// 이웃 후보 간격이 마디 폭 중앙값의 0.35배 미만이면 점수가 높은 쪽만 유지 (후보 5개 미만이면 생략)
function pruneCloseBarObjs(list) {
  let cur = list.slice();
  for (let iter = 0; iter < 100 && cur.length >= 5; iter++) {
    const gaps = [];
    for (let i = 1; i < cur.length; i++) gaps.push(cur[i].x - cur[i - 1].x);
    const med = medianOf(gaps);
    let worst = -1, worstGap = Infinity;
    for (let i = 0; i < gaps.length; i++) if (gaps[i] < med * 0.35 && gaps[i] < worstGap) { worst = i; worstGap = gaps[i]; }
    if (worst < 0) break;
    cur.splice(cur[worst + 1].score > cur[worst].score ? worst : worst + 1, 1);
  }
  return cur;
}

// 같은 내용(전역 x)을 본 프레임들 중 그 위치에 밴드 높이의 선이 보이는 비율 — 재생바는 한 프레임에서만 보인다
const scrollFrameGrayCache = new WeakMap();
function scrollFrameGray(canvas) {
  let v = scrollFrameGrayCache.get(canvas);
  if (!v) { v = scrollGetFullGrayData(canvas); scrollFrameGrayCache.set(canvas, v); }
  return v;
}
function barPersistence(frames, x, bandTop, bandBottom, darkThresh) {
  let obs = 0, seen = 0;
  for (const f of frames) {
    if (f.dup) continue;
    const u = Math.round(x - f.start + f.srcX);
    if (u < 3 || u >= f.canvas.width - 3) continue;
    const gf = scrollFrameGray(f.canvas);
    let hit = false;
    for (let du = -2; du <= 2 && !hit; du++) if (columnRunFraction(gf, u + du, bandTop, bandBottom, darkThresh) >= 0.7) hit = true;
    obs++;
    if (hit) seen++;
  }
  return { obs, seen };
}
// 밴드 가장자리(edgeY)에서 바깥쪽으로 끊김 없이(1px 허용) 이어지는 잉크 길이 (limit까지)
function contiguousInk(g, x, edgeY, dirSign, limit, darkThresh) {
  let len = 0, gap = 0;
  for (let k = 0; k < limit; k++) {
    const y = edgeY + dirSign * k;
    if (y < 0 || y >= g.h) break;
    if (g.gray[y * g.w + x] < darkThresh) { len = k + 1; gap = 0; }
    else if (++gap > 1) break;
  }
  return len;
}
// 씨앗 y에서 위/아래로 (2px 끊김 허용) 이어지는 어두운 구간의 끝
function runExtentFrom(g, x, ySeed, darkThresh) {
  let y0 = Math.round(ySeed), found = false;
  for (let d = 0; d < 6 && !found; d++) {
    for (const yy of [y0 + d, y0 - d]) if (yy >= 0 && yy < g.h && g.gray[yy * g.w + x] < darkThresh) { y0 = yy; found = true; break; }
  }
  if (!found) return null;
  let top = y0, bot = y0, gap = 0;
  for (let y = y0 - 1; y >= 0; y--) { if (g.gray[y * g.w + x] < darkThresh) { top = y; gap = 0; } else if (++gap > 2) break; }
  gap = 0;
  for (let y = y0 + 1; y < g.h; y++) { if (g.gray[y * g.w + x] < darkThresh) { bot = y; gap = 0; } else if (++gap > 2) break; }
  return { top, bot };
}

function detectBarsThroughSystem(g, sys, T, left, darkThresh, frames, headerSpaces) {
  const space = sys.space, staves = sys.main.staves, K = staves.length;
  const tol = Math.max(3, space * 0.4);
  const bands = staves.map(st => [st[0].y0, st[st.length - 1].y1]);
  const members = [];
  bands.forEach(([y0, y1], k) => {
    const cv = computeBarCoverage(g, y0, y1, darkThresh);
    let cur = null;
    const flush = () => {
      if (!cur) return;
      const w = cur.x1 - cur.x0 + 1;
      if (w >= 1 && w <= 6) members.push({ x: (cur.x0 + cur.x1) / 2, k, cov: cur.cov });
    };
    for (let x = 0; x < g.w; x++) {
      if (cv[x] >= T) {
        if (cur && x - cur.x1 <= 1) { cur.x1 = x; cur.cov = Math.max(cur.cov, cv[x]); }
        else { flush(); cur = { x0: x, x1: x, cov: cv[x] }; }
      }
    }
    flush();
  });
  members.sort((a, b) => a.x - b.x);
  const groups = [];
  for (const m of members) {
    const last = groups[groups.length - 1];
    if (last && m.x - last.lastX <= tol) { last.items.push(m); last.lastX = m.x; }
    else groups.push({ items: [m], lastX: m.x });
  }
  const cand = groups.length;
  const passed = [];
  let protruded = 0, endMismatch = 0, notPersistent = 0;
  for (const gr of groups) {
    if (new Set(gr.items.map(m => m.k)).size < K) continue;
    const x = gr.items.reduce((s, m) => s + m.x, 0) / gr.items.length;
    const cov = gr.items.reduce((s, m) => s + m.cov, 0) / gr.items.length;
    let gapConn = false;
    if (K > 1) {
      gapConn = true;
      for (let j = 0; j < K - 1 && gapConn; j++) {
        const y0 = bands[j][1] + 1, y1 = bands[j + 1][0] - 1;
        let best = 0;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = Math.round(x) + dx;
          if (xx >= 0 && xx < g.w) best = Math.max(best, columnRunFraction(g, xx, y0, y1, darkThresh));
        }
        if (best < 0.7) gapConn = false;
      }
    }
    // 재생바 제거 — 마디선은 시스템 밴드(맨 위 줄 ~ 맨 아래 줄)에서 시작해 끝나며 밴드 밖으로 나가지 않는다
    const px = Math.round(x);
    const bandTop = sys.main.top, bandBottom = sys.main.bottom;
    const tolEnd = Math.max(2, space * 0.3);
    const protrude = Math.max(
      contiguousInk(g, px, bandTop - 1, -1, Math.round(space * 2), darkThresh),
      contiguousInk(g, px, bandBottom + 1, 1, Math.round(space * 2), darkThresh)
    );
    if (protrude >= space * 0.6) { protruded++; continue; }
    let endsOk = false;
    for (let dx = -1; dx <= 1 && !endsOk; dx++) {
      const xx = px + dx;
      if (xx < 0 || xx >= g.w) continue;
      const e1 = runExtentFrom(g, xx, (staves[0][0].y0 + staves[0][staves[0].length - 1].y1) / 2, darkThresh);
      const lastSt = staves[K - 1];
      const e2 = runExtentFrom(g, xx, (lastSt[0].y0 + lastSt[lastSt.length - 1].y1) / 2, darkThresh);
      if (e1 && e2 && Math.abs(e1.top - bandTop) <= tolEnd && Math.abs(e2.bot - bandBottom) <= tolEnd) endsOk = true;
    }
    if (!endsOk) { endMismatch++; continue; }
    if (frames) {
      const ps = barPersistence(frames, x, bandTop, bandBottom, darkThresh);
      if (ps.obs >= 2 && ps.seen / ps.obs < 0.7) { notPersistent++; continue; }
    }
    passed.push({ x: px, score: cov + (gapConn ? 0.05 : 0), gapConn });
  }
  // 헤더(첫 타일 악보 왼쪽 오선 간격×20) 제외, 제외 후 0이면 범위를 절반으로 재시도
  const run = hs => passed.filter(b => b.x >= left + space * hs);
  const H0 = headerSpaces == null ? 20 : headerSpaces;
  let kept = run(H0);
  if (!kept.length && passed.length) kept = run(H0 / 2);
  const afterHeader = kept.length;
  kept = pruneCloseBarObjs(kept);
  return { bars: kept, stats: { cand, allStaff: passed.length, afterHeader, afterPrune: kept.length, T, protruded, endMismatch, notPersistent } };
}

// 품질 점수 — 마디 폭이 중앙값의 0.4~2.5배 안인 비율, "ROI 폭당 마디 수"(1~8 밖이면 의심)
function assessBarQuality(bars, totalLen, viewLen, weak) {
  const measureCount = Math.max(0, bars.length - 1);
  if (measureCount < 1) return { low: true, widthOk: 0, perView: 0, measureCount, medianWidth: null, weak: !!weak };
  const widths = [];
  for (let i = 0; i < measureCount; i++) widths.push(bars[i + 1] - bars[i]);
  const med = medianOf(widths);
  const widthOk = widths.filter(w => w >= med * 0.4 && w <= med * 2.5).length / widths.length;
  const perView = viewLen ? measureCount / (totalLen / viewLen) : null;
  const low = !!weak || widthOk < 0.7 || (perView != null && (perView < 1 || perView > 8));
  return { low, widthOk, perView, measureCount, medianWidth: med, weak: !!weak };
}

// staffThresh(슬라이더, 기본 0.6)는 줄 검출 비율의 1/2로 환산해 완화해서 쓴다. barThresh가 null이면 자동:
// T를 0.9에서 0.05씩 낮추며(최저 0.5) 마디 수가 "ROI 폭 ÷ (오선 간격×10)"의 0.5배 이상이 되면 멈춘다.
// 그래도 부족하면 weak(마디선 인식 약함) — 결과 화면이 폭 기준 그룹화로 자동 전환한다(마디선 0개여도 진행 가능).
// 입력은 오버레이 없는 깨끗한 stitched canvas여야 한다.
function detectStaffAndBars(canvas, staffThresh, barThresh, viewLen, frames) {
  const g = scrollGetFullGrayData(canvas);
  const darkThresh = 140;
  const sys = detectStaffSystem(g, Math.max(0.05, staffThresh * 0.5), darkThresh);
  if (!sys) {
    return {
      staffLines: [], bars: [], barInfos: [], staffFound: false, system: null, gray: g, stats: null,
      threshUsed: barThresh == null ? 0.9 : barThresh, auto: barThresh == null,
      quality: { low: true, widthOk: 0, perView: 0, measureCount: 0, medianWidth: null, weak: true },
    };
  }
  const left = staffLeftEdge(g, sys);
  const auto = barThresh == null;
  let res, T, weak = false;
  if (!auto) {
    T = barThresh;
    res = detectBarsThroughSystem(g, sys, T, left, darkThresh, frames);
  } else {
    const expectMin = viewLen ? 0.5 * viewLen / (sys.space * 10) : 1;
    for (const t of [0.9, 0.85, 0.8, 0.75, 0.7, 0.65, 0.6, 0.55, 0.5]) {
      T = t;
      res = detectBarsThroughSystem(g, sys, T, left, darkThresh, frames);
      if (res.bars.length >= expectMin) break;
    }
    weak = res.bars.length < expectMin;
  }
  // 시스템 시작(오선 시작 x)을 첫 경계로 둔다 — 첫 마디는 음자리표·조표·박자표 헤더를 포함한다
  const barInfos = [{ kind: 'start' }, ...res.bars.map(b => ({ kind: 'bar', gapConn: b.gapConn, score: b.score }))];
  let bars = [left, ...res.bars.map(b => b.x)];
  if (bars.length && (canvas.width - bars[bars.length - 1]) > canvas.width * 0.02) {
    bars = [...bars, canvas.width - 1];
    barInfos.push({ kind: 'end' });
  }
  return {
    staffLines: sys.main.lines.map(l => l.y), bars, barInfos, staffFound: true, system: sys, gray: g, stats: res.stats,
    threshUsed: T, auto, quality: assessBarQuality(bars, canvas.width, viewLen, weak),
  };
}

// ---- 폭 기준 분할(마디 인식 신뢰도가 낮을 때의 자동 폴백) ----
function robustMeasureWidth(bars) {
  if (bars.length < 4) return null;
  const widths = [];
  for (let i = 0; i < bars.length - 1; i++) widths.push(bars[i + 1] - bars[i]);
  const med = medianOf(widths);
  const good = widths.filter(w => w >= med * 0.6 && w <= med * 1.6);
  return good.length >= 3 ? medianOf(good) : med;
}

// '세로 공백 열' — 스티치 이미지 전체 높이(보표 위아래 고음·저음 음표, 레저선, 아르페지오 물결선, 8va 포함)에서
// 오선 행만 제외하고 잉크가 하나도 없는 열
function computeBlankColumns(g, sys, darkThresh) {
  const blank = new Uint8Array(g.w);
  for (let x = 0; x < g.w; x++) {
    let ink = false;
    for (let y = 0; y < g.h; y++) {
      if (!(sys && sys.mask[y]) && g.gray[y * g.w + x] < darkThresh) { ink = true; break; }
    }
    blank[x] = ink ? 0 : 1;
  }
  return blank;
}

// target 근처에서 가장 가까운 공백 열 구간의 중앙 (없으면 null)
function nearestBlankCenter(target, lo, hi, blank) {
  lo = Math.max(0, Math.ceil(lo)); hi = Math.min(blank.length - 1, Math.floor(hi));
  let best = null, bestD = Infinity;
  let x = lo;
  while (x <= hi) {
    if (blank[x]) {
      let e = x;
      while (e + 1 <= hi && blank[e + 1]) e++;
      const c = Math.floor((x + e) / 2);
      if (Math.abs(c - target) < bestD) { bestD = Math.abs(c - target); best = c; }
      x = e + 1;
    } else x++;
  }
  return best;
}

// 경계는 음표·기호를 가르지 않도록 항상 공백 열을 우선한다. 마디선이 목표 근처에 있으면 그 마디선 바로 옆
// 공백 열(±2 staff space)로, 없으면 목표 근처의 가장 가까운 공백 열로. 공백 열이 전혀 없을 때만 마디선/목표 위치.
function snapGroupBoundary(target, minX, radius, bars, blank, space) {
  let bar = null, bestD = Infinity;
  for (const b of bars) {
    const d = Math.abs(b - target);
    if (b > minX && d <= radius && d < bestD) { bar = b; bestD = d; }
  }
  if (bar != null) {
    const near = nearestBlankCenter(bar, bar - space * 2, bar + space * 2, blank);
    if (near != null && near > minX) return near;
  }
  const c = nearestBlankCenter(target, Math.max(minX, target - radius), target + radius, blank);
  if (c != null) return c;
  return bar != null ? bar : Math.round(target);
}

// 목표 폭 = N × 견고하게 추정한 마디 폭(추정 불가 시 ROI 폭). 경계는 목표 폭 근처에서 마디선 우선,
// 없으면 가장 가까운 세로 공백 열.
function groupByWidth(totalLen, targetN, maxBars, measureW, viewLen, bars, blank, space) {
  const n = Math.max(1, targetN);
  let targetW = measureW ? measureW * n : (viewLen || totalLen);
  if (measureW && maxBars) targetW = Math.min(targetW, measureW * Math.max(1, maxBars));
  targetW = Math.max(8, targetW);
  const out = [];
  let x = 0;
  while (x < totalLen - 1) {
    const target = x + targetW;
    let end;
    if (target >= totalLen - targetW * 0.35) end = totalLen;
    else end = snapGroupBoundary(target, x + targetW * 0.3, targetW * 0.5, bars, blank, space || 8);
    end = Math.min(totalLen, Math.max(Math.round(end), Math.round(x) + 1));
    out.push({ startIdx: out.length, endIdx: out.length + 1, startX: Math.round(x), endX: end, count: null, byWidth: true });
    x = end;
  }
  return out;
}

// ---- 컷 이음새 검증 (마디 검출 후) ----
function hasDuplicateTrace(g, sys, pos) {
  const W = Math.max(12, Math.round(sys.space * 3));
  if (pos - W < 0 || pos + W > g.w) return false;
  let a = 0, both = 0, either = 0;
  for (let y = sys.main.top; y <= sys.main.bottom; y++) {
    if (sys.mask[y]) continue;
    for (let j = 0; j < W; j++) {
      const l = g.gray[y * g.w + pos - W + j] < 128, r = g.gray[y * g.w + pos + j] < 128;
      if (l || r) either++;
      if (l && r) both++;
      if (l) a++;
    }
  }
  return a >= 8 && either > 0 && both / either >= 0.85;
}

// 이음새를 낀 마디 폭이 전체 중앙값의 0.4~2.5배인지, 이음새 양쪽에 같은 내용이 반복되는 흔적이
// 없는지. 통과 못 한 컷 이음새만 flagged.
function validateCutSeams(seams, bars, det, qualityLow) {
  const widths = [];
  for (let i = 0; i < bars.length - 1; i++) widths.push(bars[i + 1] - bars[i]);
  const med = medianOf(widths);
  return seams.map(s => {
    if (!s.cut || s.dup) return { flagged: false };
    let reason = null;
    let widthRatio = null;
    if (med > 0 && bars.length >= 3) {
      for (let j = 0; j < bars.length - 1; j++) {
        if (s.pos > bars[j] + 2 && s.pos < bars[j + 1] - 2) { widthRatio = (bars[j + 1] - bars[j]) / med; break; }
      }
    }
    if (qualityLow) {
      // 마디 인식 품질이 낮으면 마디 폭 판정은 쓰지 않고(과검출로 정상 이음새까지 연쇄 실패하므로) 경계 연속성 점수만 본다
      if (s.weight >= 4 && s.score != null && s.score < 0.4) reason = '이음새 경계 연속성 낮음';
    } else if (widthRatio != null && (widthRatio < 0.4 || widthRatio > 2.5)) {
      reason = '이음새를 낀 마디 폭이 비정상';
    }
    if (!reason && det.system && det.gray && hasDuplicateTrace(det.gray, det.system, s.pos)) reason = '이음새 양쪽에 같은 내용이 반복됨';
    return { flagged: !!reason, reason, widthRatio };
  });
}

// ---- N마디씩 그룹핑 — 프로토타입의 단순 고정-N 슬라이싱을 이번 스펙대로 교체 ----
// N은 고정값이 아니라 "목표값": 목표 픽셀폭 = 이 영상의 평균 마디 폭 × N (해상도 무관, 영상마다
// 자동 계산). 각 마디선 경계에서, 누적 폭이 목표폭에 가장 가까워지는 마디 수(1~maxBarsPerGroup)를
// 그리디하게 선택 — 그래서 목표 N에서 ±1마디 정도는 자연스럽게 유동적으로 허용된다.
function groupBarsByTargetWidth(bars, targetN, maxBarsPerGroup) {
  maxBarsPerGroup = Math.max(1, maxBarsPerGroup || 8);
  const measureCount = bars.length - 1;
  if (measureCount <= 0) return [];
  const barWidths = [];
  for (let i = 0; i < measureCount; i++) barWidths.push(bars[i + 1] - bars[i]);
  const avgBarWidth = barWidths.reduce((a, b) => a + b, 0) / measureCount;
  const targetPx = avgBarWidth * Math.max(1, targetN);

  const groups = [];
  let i = 0;
  while (i < measureCount) {
    const upper = Math.min(maxBarsPerGroup, measureCount - i);
    let bestCount = 1, bestDiff = Infinity;
    for (let c = 1; c <= upper; c++) {
      const w = bars[i + c] - bars[i];
      const diff = Math.abs(w - targetPx);
      if (diff < bestDiff) { bestDiff = diff; bestCount = c; }
    }
    groups.push({ startIdx: i, endIdx: i + bestCount, startX: bars[i], endX: bars[i + bestCount], count: bestCount });
    i += bestCount;
  }
  return groups;
}

// ---- burst(스크롤 이벤트) 그룹핑 — diffs[i]는 times[i]→times[i+1] 전환 ----
function groupScrollBursts(diffs, threshold) {
  const movingIdx = [];
  for (let i = 0; i < diffs.length; i++) if (diffs[i] > threshold) movingIdx.push(i + 1);
  const bursts = [];
  let cur = null;
  for (const mi of movingIdx) {
    if (cur && mi - cur.end <= 1) cur.end = mi;
    else { if (cur) bursts.push(cur); cur = { start: mi, end: mi }; }
  }
  if (cur) bursts.push(cur);
  return bursts;
}

// 각 burst 전/후 프레임(정지 상태) + 처음/끝 프레임, 중복 제거 — 정렬된 고유 인덱스 배열
function scrollRepIndices(times, bursts) {
  const idxs = new Set([0, times.length - 1]);
  for (const b of bursts) {
    idxs.add(Math.max(0, b.start - 1));
    idxs.add(Math.min(times.length - 1, b.end + 1));
  }
  return [...idxs].sort((a, b) => a - b);
}

// burst 지속시간이 다른 burst들 대비 이상치인지 (평균 대비 표준편차 1.5배 초과)
function flagOutlierBursts(bursts, times) {
  const durations = bursts.map(b => times[Math.min(times.length - 1, b.end + 1)] - times[Math.max(0, b.start - 1)]);
  const mean = durations.reduce((a, b) => a + b, 0) / Math.max(1, durations.length);
  const variance = durations.reduce((a, b) => a + (b - mean) * (b - mean), 0) / Math.max(1, durations.length);
  const std = Math.sqrt(variance);
  return bursts.map((b, i) => ({
    ...b, duration: durations[i],
    isOutlier: std > 0 && Math.abs(durations[i] - mean) > 1.5 * std,
  }));
}

// ---- 부드러운 스크롤용: 전처리 → 방향 감지 → NCC 이음 (조각 목록 반환) ----
// refineHook(seamIdx, medianShift, direction): 저신뢰(NCC<0.7) 이음새를 촘촘한 연속 프레임 정합으로
// 다시 계산해 {shift,score,ok}를 돌려주거나 null(교체 안 함). 신뢰 높은 이웃 이음새의 중앙값을 기준으로
// 탐색 범위를 제한하기 위해 첫 패스가 끝난 뒤에 호출한다.
async function runScrollStage3(repFrames, scrollDefaults, directionPref, refineHook) {
  // 1) 전처리 — 반드시 원본 해상도에서 먼저 (다운스케일은 스티칭 탐색(scrollGetGray)에서만)
  for (const f of repFrames) { f.orig = cloneCanvas(f.canvas); f.staffPre = scrollApplyPreprocInPlace(f.canvas, scrollDefaults); } // orig: 디버그 내보내기용 전처리 전 원본

  // 2) 방향 자동 감지 (첫 프레임 쌍 기준, 이후 동일 방향 유지) + 스티칭
  let direction = directionPref;
  let directionNcc = null;
  if (direction === 'auto' || !direction) {
    if (repFrames.length >= 2) {
      const test = scrollFindBestShiftAuto(repFrames[0].canvas, repFrames[1].canvas);
      direction = test.direction;
      directionNcc = test.score;
    } else {
      direction = 'vertical';
    }
  }

  const seamDecisions = [];
  for (let i = 0; i < repFrames.length - 1; i++) {
    const a = repFrames[i].canvas, b = repFrames[i + 1].canvas;
    const dup = scrollIsDuplicateFrame(a, b);
    if (dup.isDup) { seamDecisions.push({ i, shift: 0, score: dup.sim, dup: true, ok: true }); continue; }
    const { shift, score, ok } = scrollFindBestShift(a, b, direction);
    seamDecisions.push({ i, shift, score, dup: false, ok });
  }

  if (refineHook) {
    const goodShifts = seamDecisions.filter(d => !d.dup && d.score >= 0.7).map(d => d.shift);
    if (goodShifts.length) {
      const med = medianOf(goodShifts);
      for (let k = 0; k < seamDecisions.length; k++) {
        const d = seamDecisions[k];
        if (d.dup || d.score >= 0.7) continue;
        let r = null;
        try { r = await refineHook(d.i, med, direction); } catch (err) { r = null; }
        if (r) seamDecisions[k] = { ...d, shift: r.shift, score: r.score, ok: r.ok, refined: true };
      }
    }
  }

  const first = repFrames[0].canvas;
  const fullLen = direction === 'vertical' ? first.height : first.width;
  const frames = [newScrollFrame({ canvas: first, orig: repFrames[0].orig, staffPre: repFrames[0].staffPre, t: repFrames[0].time, srcX: 0, len: fullLen, score: null, ok: true })];
  for (let i = 0; i < seamDecisions.length; i++) {
    const d = seamDecisions[i];
    const bCanvas = repFrames[i + 1].canvas;
    const bLen = direction === 'vertical' ? bCanvas.height : bCanvas.width;
    const len = Math.min(bLen, Math.max(1, d.shift));
    frames.push(newScrollFrame({
      canvas: bCanvas, orig: repFrames[i + 1].orig, staffPre: repFrames[i + 1].staffPre, t: repFrames[i + 1].time,
      srcX: d.dup ? 0 : bLen - len, len: d.dup ? 0 : len,
      dup: d.dup, score: d.score, ok: d.ok, shift: d.shift,
    }));
  }
  return { direction, directionNcc, frames };
}

// ==== 컷 전환(타일링) 이음 ====
// 화면이 부드럽게 밀리지 않고 "컷"으로 통째로 넘어가며 이전 화면과 겹침이 없는 영상용. NCC 겹침 탐색
// 대신: 정지 구간(타일)마다 1장 → 오선이 실제로 그려진 구간만 트리밍 → 이동량 0으로 맞대어 붙이되
// 이음새를 가로지르는 잉크(줄기·빔·음표머리)의 연속성으로 미세 오프셋 δ를 고른다. (가로 방향 전용)

function downloadBlobFile(blob, name) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}
function downloadCanvasPng(canvas, name) {
  return new Promise(res => canvas.toBlob(b => { downloadBlobFile(b, name); res(); }, 'image/png'));
}

// ---- 단계별 소요 시간 계측 (결과 화면의 접기 영역에 표시) ----
let captureCounter = 0, cacheHitCounter = 0;
const scrollProf = { stages: {}, diff: null };
async function profRun(name, fn) {
  const t0 = performance.now(), k0 = seekCounter, c0 = captureCounter, h0 = cacheHitCounter;
  try {
    return await fn();
  } finally {
    const r = scrollProf.stages[name] || (scrollProf.stages[name] = { sec: 0, seeks: 0, captures: 0, hits: 0 });
    r.sec += (performance.now() - t0) / 1000;
    r.seeks += seekCounter - k0; r.captures += captureCounter - c0; r.hits += cacheHitCounter - h0;
  }
}

// ---- 영상 프레임 캡처 캐시: 키 = 영상 + ROI + 시각(1/30초 반올림). 최근 60장 LRU(+메모리 상한). 캐시에는 원본
// (전처리 전) 캡처를 두고, 호출자가 제자리에서 전처리해도 캐시가 오염되지 않도록 항상 복사본을 돌려준다.
const frameCache = new Map();
let frameCacheBytes = 0;
const FRAME_CACHE_MAX = 60, FRAME_CACHE_MAX_BYTES = 400 * 1024 * 1024;
function cloneCanvas(c) {
  const o = document.createElement('canvas');
  o.width = c.width; o.height = c.height;
  o.getContext('2d').drawImage(c, 0, 0);
  return o;
}
async function captureRepCanvas(video, roi, t) {
  const roiKey = roi ? [roi.x0, roi.y0, roi.x1, roi.y1].map(v => v.toFixed(4)).join(',') : 'full';
  const key = (video.currentSrc || '') + '|' + roiKey + '|' + Math.round(t * 30);
  const hit = frameCache.get(key);
  if (hit) {
    frameCache.delete(key); frameCache.set(key, hit); // LRU 갱신
    cacheHitCounter++;
    return cloneCanvas(hit);
  }
  await seekTo(video, t); // waitForFramePresented를 포함한 기존 seek 대기 유지
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(rw)); c.height = Math.max(1, Math.round(rh));
  c.getContext('2d').drawImage(video, rx0, ry0, rw, rh, 0, 0, c.width, c.height);
  captureCounter++;
  frameCache.set(key, c);
  frameCacheBytes += c.width * c.height * 4;
  while (frameCache.size > FRAME_CACHE_MAX || (frameCacheBytes > FRAME_CACHE_MAX_BYTES && frameCache.size > 1)) {
    const oldest = frameCache.keys().next().value;
    const oc = frameCache.get(oldest);
    frameCacheBytes -= oc.width * oc.height * 4;
    frameCache.delete(oldest);
  }
  return cloneCanvas(c);
}

// burst 전/후 화면을 한 장이 아니라 인접 최대 3장의 픽셀별 중앙값으로 만든다(움직이는 재생 표시 제거).
async function medianRepCanvas(video, roi, times, idx, dir, scrollDefaults) {
  const caps = [];
  for (let k = 0; k < 3; k++) {
    const i = idx + dir * k;
    if (i < 0 || i >= times.length) break;
    caps.push(await captureRepCanvas(video, roi, times[i]));
  }
  const c = caps.length >= 3 ? medianOfCanvases(caps) : caps[0];
  scrollApplyPreprocInPlace(c, scrollDefaults);
  return c;
}

// burst별 전환 유형 판별. 컷 = (a) 전환이 샘플 1스텝 안에 끝나 중간 프레임이 없고 (b) 오선 제거 + 재생바 열
// 제외 후 NCC가 유의미한 shift를 못 찾고 (c) A의 오른쪽 끝(화면 폭 10~50%)과 B의 왼쪽 끝이 어떤 shift에서도
// 큰 겹침으로 이어지는 스크롤이 아님. 방향이 auto면 가로·세로 둘 다 확인한다.
// kind: 'cut'(컷 burst 비율 > 0.9, 다중 샘플 burst 없음) | 'smooth' | 'ambiguous'(비율 0.5~0.9 또는 다중 샘플 burst가 섞임)
async function classifyCutBursts(video, roi, times, bursts, scrollDefaults, directionPref) {
  if (!bursts.length || directionPref === 'vertical') return { kind: 'smooth', cutCount: 0, multi: 0, ratio: 0, flags: [] };
  const dirs = directionPref === 'horizontal' ? ['horizontal'] : ['horizontal', 'vertical'];
  const flags = [];
  let multi = 0;
  for (const b of bursts) {
    if (b.end !== b.start) { flags.push(false); multi++; continue; }
    const A = await medianRepCanvas(video, roi, times, Math.max(0, b.start - 1), -1, scrollDefaults);
    const B = await medianRepCanvas(video, roi, times, Math.min(times.length - 1, b.end + 1), 1, scrollDefaults);
    // 1스텝에 끝난 전환에서 NCC가 "큰 겹침(60% 초과)"의 실제 스크롤을 찾았을 때만 컷이 아니다. 겹침이 없거나
    // 작은 겹침(5~60%, 컷 전환 후 앞 화면 마지막 마디가 다시 나오는 경우)이면 컷으로 두고, 겹침 여부는
    // 이음매 단위 탐지(findSeamOverlap)가 이어붙이는 단계에서 결정한다.
    const bigOverlapScroll = dirs.some(d => {
      const r = scrollFindBestShift(A, B, d, { removeStaff: true, maskPlaybar: true });
      const L = d === 'vertical' ? A.height : A.width;
      return r.ok && (1 - r.shift / L) > 0.6;
    });
    flags.push(!bigOverlapScroll);
  }
  const cutCount = flags.filter(Boolean).length;
  const ratio = cutCount / bursts.length;
  let kind;
  if (cutCount === 0) kind = 'smooth';
  else if ((ratio >= 0.5 && ratio <= 0.9) || multi > 0) kind = 'ambiguous';
  else if (ratio > 0.9) kind = 'cut';
  else kind = 'smooth';
  return { kind, cutCount, multi, ratio, flags };
}

// 정지 구간(타일) 정의: 각 타일의 대표 시각은 구간 중앙, 시간 구간 [t0,t1]은 컷 시각으로 고정
// (컷은 time[b.start-1]과 time[b.start] 사이에서 일어남), tA~tB는 완전히 정지한 샘플 구간.
function buildCutTileDefs(times, bursts) {
  const defs = [];
  const n = times.length;
  let startIdx = 0, prevT1 = times[0];
  for (let k = 0; k <= bursts.length; k++) {
    const b = bursts[k];
    const endIdx = b ? Math.max(0, b.start - 1) : n - 1;
    const t1 = b ? (times[endIdx] + times[Math.min(n - 1, endIdx + 1)]) / 2 : times[n - 1];
    if (endIdx >= startIdx) {
      const centerIdx = Math.round((startIdx + endIdx) / 2);
      defs.push({ startIdx, endIdx, tA: times[startIdx], tB: times[endIdx], time: times[centerIdx], t0: prevT1, t1 });
    }
    prevT1 = t1;
    if (b) startIdx = b.end + (b.end === b.start ? 0 : 1);
  }
  return defs;
}

// 정지 구간 [startIdx,endIdx]에서 중앙값용 샘플 인덱스: 구간 앞·뒤 10%(최소 1샘플)를 제외한 전 구간에서 최대 7장을
// 고르게 뽑는다. 남은 샘플이 3개 미만이면 구간 중앙 1장만 쓴다.
function pickMedianIndices(startIdx, endIdx) {
  const n = endIdx - startIdx + 1;
  const trim = Math.max(1, Math.floor(n * 0.1));
  const lo = startIdx + trim, hi = endIdx - trim;
  const usable = [];
  for (let i = lo; i <= hi; i++) usable.push(i);
  if (usable.length < 3) return [Math.round((startIdx + endIdx) / 2)];
  const cnt = usable.length >= 7 ? 7 : (usable.length >= 5 ? 5 : 3);
  const out = [];
  for (let i = 0; i < cnt; i++) out.push(usable[Math.round(i * (usable.length - 1) / (cnt - 1))]);
  return out;
}

// 같은 크기 canvas들의 픽셀별(채널별) 중앙값 canvas. 짝수 개면 위쪽 중앙값.
function medianOfCanvases(canvases) {
  const w = canvases[0].width, h = canvases[0].height;
  const datas = canvases.map(c => c.getContext('2d').getImageData(0, 0, w, h).data);
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  const octx = out.getContext('2d');
  const img = octx.createImageData(w, h);
  const n = datas.length, mid = Math.floor(n / 2);
  const buf = new Array(n);
  for (let i = 0; i < img.data.length; i++) {
    for (let k = 0; k < n; k++) buf[k] = datas[k][i];
    buf.sort((a, b) => a - b);
    img.data[i] = buf[mid];
  }
  octx.putImageData(img, 0, 0);
  return out;
}

// 타일 한 장의 오선 구조 + 오선이 실제로 그려진 x 구간(트리밍 범위)
function analyzeTileStaff(canvas) {
  const g = scrollGetFullGrayData(canvas);
  const sys = detectStaffSystem(g, 0.3, 140);
  let xL = 0, xR = g.w - 1;
  if (sys) {
    const lns = sys.main.lines.filter(l => !l.synth);
    let l0 = -1, r0 = -1;
    for (let x = 0; x < g.w; x++) {
      let c = 0;
      for (const l of lns) {
        for (let y = Math.max(0, l.y0 - 1); y <= Math.min(g.h - 1, l.y1 + 1); y++) {
          if (g.gray[y * g.w + x] < 140) { c++; break; }
        }
      }
      if (c >= lns.length * 0.5) { if (l0 < 0) l0 = x; r0 = x; }
    }
    if (l0 >= 0) { xL = l0; xR = r0; }
  }
  return { g, sys, xL, xR, touchL: xL <= 1, touchR: xR >= g.w - 2 };
}

function tileInk(g) {
  const ink = new Uint8Array(g.w * g.h);
  for (let i = 0; i < ink.length; i++) ink[i] = g.gray[i] < 128 ? 1 : 0;
  return ink;
}

// 프레임 k의 오른쪽 끝(aEnd)과 프레임 k+1의 왼쪽 끝(xLB+d)을 맞댔을 때, 오선 행을 제외한 잉크가 이음새를
// 가로질러 이어지는 정도(둘 다 잉크=일치, 한쪽만=불일치). δ ∈ ±(오선 간격×3).
function findCutSeamOffset(inkA, wA, hA, aEnd, inkB, wB, xLB, mask, space) {
  const D = Math.max(3, Math.round(space * 3));
  const m = 3;
  let best = null;
  for (let d = -D; d <= D; d++) {
    const bStart = xLB + d;
    if (bStart < 0 || bStart >= wB) continue;
    let match = 0, mism = 0;
    for (let y = 0; y < hA; y++) {
      if (mask[y]) continue;
      let a = 0, b = 0;
      for (let j = 0; j < m; j++) {
        const xa = aEnd - j;
        if (xa >= 0 && xa < wA && inkA[y * wA + xa]) a = 1;
        const xb = bStart + j;
        if (xb >= 0 && xb < wB && inkB[y * wB + xb]) b = 1;
      }
      if (a && b) match++; else if (a !== b) mism++;
    }
    const score = match - 0.5 * mism;
    if (!best || score > best.score + 1e-9 || (Math.abs(score - best.score) < 1e-9 && Math.abs(d) < Math.abs(best.d))) {
      best = { d, score, match, mism };
    }
  }
  return best;
}

function weightedMedian(items) {
  const arr = items.filter(i => i.w > 0).sort((a, b) => a.v - b.v);
  if (!arr.length) return 0;
  const tot = arr.reduce((s, i) => s + i.w, 0);
  let acc = 0;
  for (const it of arr) { acc += it.w; if (acc >= tot / 2) return it.v; }
  return arr[arr.length - 1].v;
}

// ---- 이음매 단위 겹침 탐지 (컷 전환인데 앞 화면 마지막 마디가 다음 화면에 다시 나오는 영상) ----
// 비교 영역은 오선 밴드만이 아니라 타일 전체 높이(오선 줄 행만 제외) — 코드명·마디 번호·연주 기호도 단서로 쓴다.
// 영역이 커진 만큼 재생바 열(밴드를 넘는 선)은 양쪽 타일에서 마스킹한다. 마디선은 마스킹하지 않는다.

// 잉크 이진 배열 + ±1px 팽창본
function tileInkSet(info) {
  if (info.inkSet) return info.inkSet;
  const { w, h } = info.g;
  const ink = tileInk(info.g);
  const dil = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (!ink[y * w + x]) continue;
      for (let dy = -1; dy <= 1; dy++) {
        const yy = y + dy;
        if (yy < 0 || yy >= h) continue;
        for (let dx = -1; dx <= 1; dx++) {
          const xx = x + dx;
          if (xx >= 0 && xx < w) dil[yy * w + xx] = 1;
        }
      }
    }
  }
  info.inkSet = { ink, dil, w, h };
  return info.inkSet;
}

// 재생바 열: 보표 밴드 밖으로 끊김 없이 0.6 staff space 이상 삐져나오는 열
function tileFullInfo(info) {
  if (info.playCols) return info;
  const g = info.g;
  info.playCols = new Uint8Array(g.w);
  if (info.sys) {
    const sp = info.sys.space, lim = Math.max(2, Math.round(sp * 2));
    for (let x = 0; x < g.w; x++) {
      const prot = Math.max(
        contiguousInk(g, x, info.sys.main.top - 1, -1, lim, 128),
        contiguousInk(g, x, info.sys.main.bottom + 1, 1, lim, 128)
      );
      if (prot >= sp * 0.6) info.playCols[x] = 1;
    }
  }
  return info;
}
const tileInfoCache = new WeakMap();
function tileInfoOf(canvas) {
  let v = tileInfoCache.get(canvas);
  if (!v) { v = analyzeTileStaff(canvas); tileFullInfo(v); tileInkSet(v); tileInfoCache.set(canvas, v); }
  return v;
}

// 잉크 최소 기준은 max(60px, 오선 간격²×0.5) + 연결 성분 3개 이상, 채택 IoU ≥ 0.85.
// "판단 불가"면 한 단계 완화(잉크 40px, IoU ≥ 0.9)해 재시도한다.
function overlapLevels(space) {
  return [
    { minInk: Math.max(60, space * space * 0.5), iou: 0.85 },
    { minInk: 40, iou: 0.9 },
  ];
}

// 영역 내 A 잉크의 연결 성분 개수 (cap에 도달하면 중단)
function countRegionComponents(set, xs, xe, mask, colMask, cap) {
  const { ink, w, h } = set;
  const seen = new Uint8Array(w * h);
  const stack = [];
  let comps = 0;
  for (let y = 0; y < h && comps < cap; y++) {
    if (mask[y]) continue;
    for (let x = xs; x <= xe && comps < cap; x++) {
      const p = y * w + x;
      if (!ink[p] || seen[p] || (colMask && colMask[x])) continue;
      comps++;
      seen[p] = 1; stack.push(p);
      while (stack.length) {
        const q = stack.pop();
        const qx = q % w, qy = (q - qx) / w;
        for (let dy = -1; dy <= 1; dy++) {
          const yy = qy + dy;
          if (yy < 0 || yy >= h || mask[yy]) continue;
          for (let dx = -1; dx <= 1; dx++) {
            const xx = qx + dx;
            if (xx < xs || xx > xe) continue;
            const pp = yy * w + xx;
            if (ink[pp] && !seen[pp] && !(colMask && colMask[xx])) { seen[pp] = 1; stack.push(pp); }
          }
        }
      }
    }
  }
  return comps;
}

// 정렬 관계: B의 로컬 x좌표 u는 A의 x = u + s. 겹침 영역(타일 전체 높이, 오선 줄 행·재생바 열 제외)에서 ±1px 팽창을
// 허용한 잉크 일치율(IoU). 영역이 4열 미만이면 null.
function verifyOverlap(infoA, infoB, setA, setB, s, mask) {
  const w = setA.w, h = setA.h;
  const xs = Math.max(infoA.xL, infoB.xL + s, 0), xe = Math.min(infoA.xR, infoB.xR + s, w - 1);
  if (xe - xs + 1 < 4) return null;
  let nA = 0, nB = 0, mA = 0, mB = 0;
  for (let y = 0; y < h; y++) {
    if (mask[y]) continue;
    const row = y * w;
    for (let x = xs; x <= xe; x++) {
      const u = x - s;
      if (u < 0 || u >= w || infoA.playCols[x] || infoB.playCols[u]) continue;
      const a = setA.ink[row + x], b = setB.ink[row + u];
      if (a) { nA++; if (setB.dil[row + u]) mA++; }
      if (b) { nB++; if (setA.dil[row + x]) mB++; }
    }
  }
  return { iou: (mA + mB) / Math.max(1, nA + nB), ink: Math.max(nA, nB), xs, xe };
}

// 보조 탐색(b): maxDim 900 잉크 이진 이미지(타일 전체 높이)로 겹침 폭 3~95% 범위의 shift 후보 상위 3개
function coarseOverlapCandidates(canvasA, canvasB, mask) {
  const gA = scrollGetGray(canvasA, 900), gB = scrollGetGray(canvasB, 900);
  const sc = gA.scale, w2 = Math.min(gA.w, gB.w), h2 = Math.min(gA.h, gB.h);
  const inkA = new Uint8Array(w2 * h2), inkB = new Uint8Array(w2 * h2);
  const rows = [];
  for (let y = 0; y < h2; y++) {
    if (mask[Math.min(mask.length - 1, Math.round(y / sc))]) continue;
    rows.push(y);
    for (let x = 0; x < w2; x++) {
      inkA[y * w2 + x] = gA.gray[y * gA.w + x] < 160 ? 1 : 0;
      inkB[y * w2 + x] = gB.gray[y * gB.w + x] < 160 ? 1 : 0;
    }
  }
  const sMin = Math.round(w2 * 0.05), sMax = Math.round(w2 * 0.97);
  const scores = [];
  for (let sp = sMin; sp <= sMax; sp++) {
    const ow = w2 - sp;
    let m = 0, na = 0, nb = 0;
    for (const y of rows) {
      const row = y * w2;
      for (let x = 0; x < ow; x++) {
        const a = inkA[row + sp + x], b = inkB[row + x];
        na += a; nb += b; m += a & b;
      }
    }
    if (na + nb >= 20) scores.push({ sp, score: m / Math.max(1, na + nb - m) });
  }
  scores.sort((p, q) => q.score - p.score);
  const picked = [];
  for (const c of scores) {
    if (c.score < 0.3) break;
    if (picked.every(p => Math.abs(p.sp - c.sp) > 4)) picked.push(c);
    if (picked.length >= 3) break;
  }
  return picked.map(c => Math.round(c.sp / sc));
}

// 후보 목록 → 판정. 채택 조건: IoU ≥ lvl.iou, 연결 성분 ≥ 3, 후보가 둘 이상이면 2위(shift 차 4px 초과)보다 0.1 이상 높음.
function decideOverlap(cands, lvl, infoA, setA, mask) {
  const ver = cands.filter(c => c.ink >= lvl.minInk).sort((p, q) => q.iou - p.iou);
  if (!ver.length) return { status: 'unverifiable', why: '잉크 부족' };
  const b1 = ver[0];
  if (b1.iou < lvl.iou) return { status: 'none' };
  if (countRegionComponents(setA, b1.xs, b1.xe, mask, infoA.playCols, 3) < 3) return { status: 'unverifiable', why: '구조(연결 성분) 부족' };
  const second = ver.find(c => Math.abs(c.s - b1.s) > 4);
  if (second && b1.iou - second.iou < 0.1) return { status: 'unverifiable', why: '후보 모호' };
  return { status: 'overlap', best: b1 };
}

// 반환: { status: 'overlap'|'none'|'unverifiable', s, px(겹친 폭), iou, ink, cands:[상위 3개 {s,iou,ink,src,weak}] }
function findSeamOverlap(infoA, infoB, canvasA, canvasB, mask, space) {
  const W = infoA.g.w;
  if (!infoA.sys && !infoB.sys) return { status: 'unverifiable', cands: [] };
  tileFullInfo(infoA); tileFullInfo(infoB);
  const setA = tileInkSet(infoA), setB = tileInkSet(infoB);
  const lo = Math.round(W * 0.03), hi = Math.round(W * 0.95);
  const levels = overlapLevels(space);
  const cands = [];
  const seen = new Set();
  const evalS = (sv, src) => {
    if (seen.has(sv)) return;
    seen.add(sv);
    const ow = infoA.xR - (infoB.xL + sv) + 1;
    if (ow < lo || ow > hi) return;
    const r = verifyOverlap(infoA, infoB, setA, setB, sv, mask);
    if (r) cands.push({ s: sv, iou: r.iou, ink: r.ink, xs: r.xs, xe: r.xe, src });
  };
  const bestOf = () => cands.filter(c => c.ink >= levels[1].minInk).reduce((m, c) => (!m || c.iou > m.iou ? c : m), null);
  // (a) 마디선 x좌표 쌍의 차 (밴드 정확 일치 규칙을 통과한 마디선만, 재생바 제외)
  if (infoA.sys && infoB.sys) {
    const barsA = detectBarsThroughSystem(infoA.g, infoA.sys, 0.8, infoA.xL, 140, null, 0).bars.map(b => b.x);
    const barsB = detectBarsThroughSystem(infoB.g, infoB.sys, 0.8, infoB.xL, 140, null, 0).bars.map(b => b.x);
    for (const xa of barsA) for (const xb of barsB) evalS(xa - xb, 'bar');
  }
  let best = bestOf();
  // (b) 마디선이 없거나 후보 검증에 모두 실패하면 maxDim 900 잉크 이진 탐색
  if (!best || best.iou < levels[0].iou) {
    for (const sv of coarseOverlapCandidates(canvasA, canvasB, mask)) {
      for (let d = -3; d <= 3; d++) evalS(sv + d, 'ncc');
    }
    best = bestOf();
  }
  if (best) {
    for (let d = -2; d <= 2; d++) evalS(best.s + d, best.src); // 정밀 보정
  }
  // 판정: 기본 기준 → 판단 불가면 한 단계 완화해 재시도
  let dec = decideOverlap(cands, levels[0], infoA, setA, mask);
  if (dec.status === 'unverifiable') {
    const d2 = decideOverlap(cands, levels[1], infoA, setA, mask);
    dec = d2.status === 'unverifiable' ? dec : d2;
  }
  const top = cands.slice().sort((p, q) => q.iou - p.iou).slice(0, 3).map(c => ({ s: c.s, iou: c.iou, ink: c.ink, src: c.src, weak: c.ink < levels[0].minInk }));
  if (dec.status === 'overlap') {
    const b = dec.best;
    return { status: 'overlap', s: b.s, px: infoA.xR - (infoB.xL + b.s) + 1, iou: b.iou, ink: b.ink, cands: top };
  }
  return { status: dec.status, why: dec.why, cands: top };
}

// 사후 중복 검사: 이음매 왼쪽 끝 d열(A의 마지막 그려진 열까지)과 오른쪽 처음 d열(B의 첫 그려진 열부터)이 같은 마디(잉크
// 일치)인지, d = 폭 5~40%. 타일 전체 높이(오선 줄·재생바 제외)에서 비교. 반환 {status:'dup'|'ok'|'unverifiable', d, iou}
function detectSeamDuplicate(infoA, infoB, aEnd, bStart, bEnd, mask, space, W) {
  tileFullInfo(infoA); tileFullInfo(infoB);
  const setA = tileInkSet(infoA), setB = tileInkSet(infoB);
  const w = setA.w, h = setA.h;
  const cands = [];
  for (let d = Math.round(W * 0.05); d <= Math.round(W * 0.4); d += 2) {
    if (aEnd - d + 1 < 0 || bStart + d - 1 > bEnd) continue;
    let nA = 0, nB = 0, mA = 0, mB = 0;
    for (let y = 0; y < h; y++) {
      if (mask[y]) continue;
      const row = y * w;
      for (let k = 0; k < d; k++) {
        const xa = aEnd - d + 1 + k, xb = bStart + k;
        if (infoA.playCols[xa] || infoB.playCols[xb]) continue;
        const a = setA.ink[row + xa], b = setB.ink[row + xb];
        if (a) { nA++; if (setB.dil[row + xb]) mA++; }
        if (b) { nB++; if (setA.dil[row + xa]) mB++; }
      }
    }
    cands.push({ d, iou: (mA + mB) / Math.max(1, nA + nB), ink: Math.max(nA, nB), xs: aEnd - d + 1, xe: aEnd });
  }
  for (const lvl of overlapLevels(space)) {
    const ver = cands.filter(c => c.ink >= lvl.minInk).sort((p, q) => q.iou - p.iou);
    if (!ver.length) continue;
    const b1 = ver[0];
    if (b1.iou >= lvl.iou && countRegionComponents(setA, b1.xs, b1.xe, mask, infoA.playCols, 3) >= 3) return { status: 'dup', d: b1.d, iou: b1.iou };
    return { status: 'ok' };
  }
  return { status: 'unverifiable' };
}

// tiles: [{canvas, t, t0, t1}] → 조각 목록(타일 하나당 조각 하나, 중복 타일은 dup) 또는 null(오선을 못 찾음)
// 이음 방식은 이음매마다 독립 결정: 겹침 확정이면 겹친 폭만큼 B 왼쪽을 잘라 이어 붙이고, 겹침 없음이면
// butt-join(연속성 점수로 고른 공통 δ). 타일 경계 양쪽 2px는 트림해 연한 회색 세로선을 없앤다.
async function buildCutFrames(tiles, scrollDefaults) {
  for (const tl of tiles) { tl.orig = cloneCanvas(tl.canvas); tl.staffPre = scrollApplyPreprocInPlace(tl.canvas, scrollDefaults); }
  const infos = tiles.map(tl => analyzeTileStaff(tl.canvas));
  const withSys = infos.filter(i => i.sys);
  if (!withSys.length) return null;
  const w = tiles[0].canvas.width, h = tiles[0].canvas.height;
  const space = medianOf(withSys.map(i => i.sys.space));
  const mask = new Uint8Array(h);
  for (const i of withSys) for (let y = 0; y < h; y++) if (i.sys.mask[y]) mask[y] = 1;
  const bandSys = withSys[0].sys;
  const band = { top: bandSys.main.top, bottom: bandSys.main.bottom };

  // 중복 타일(같은 화면이 반복) — 오선 제거 후 NCC로 판정해 오선만 같은 서로 다른 화면을 중복으로 오인하지 않게
  const dupFlags = tiles.map(() => false);
  const keep = [0];
  for (let k = 1; k < tiles.length; k++) {
    const d = scrollIsDuplicateFrame(tiles[keep[keep.length - 1]].canvas, tiles[k].canvas, true);
    if (d.isDup) dupFlags[k] = true; else keep.push(k);
  }

  const inkCache = {};
  const inkOf = idx => (inkCache[idx] || (inkCache[idx] = tileInk(infos[idx].g)));
  const pairRes = {};
  const wm = [];
  for (let j = 1; j < keep.length; j++) {
    const a = keep[j - 1], b = keep[j];
    const ov = findSeamOverlap(infos[a], infos[b], tiles[a].canvas, tiles[b].canvas, mask, space);
    const r = findCutSeamOffset(inkOf(a), w, h, infos[a].xR, inkOf(b), w, infos[b].xL, mask, space);
    pairRes[b] = { ov, r };
    if (ov.status !== 'overlap' && r) wm.push({ v: r.d, w: r.match >= 4 ? r.match : 0 });
  }
  const common = Math.round(weightedMedian(wm));

  const lastKept = keep[keep.length - 1];
  const TRIM = 2;
  const frames = [];
  let lastReal = null, prevKeptIdx = null;
  for (let k = 0; k < tiles.length; k++) {
    const tl = tiles[k], inf = infos[k];
    if (dupFlags[k]) {
      if (lastReal) lastReal.t1 = tl.t1;
      frames.push(newScrollFrame({ canvas: tl.canvas, orig: tl.orig, staffPre: tl.staffPre, t: tl.t, srcX: 0, len: 0, dup: true, cut: true, t0: tl.t0, t1: tl.t1, score: 1, ok: true }));
      continue;
    }
    const first = k === keep[0];
    const e = inf.xR - (k === lastKept ? 0 : TRIM);
    const pr = pairRes[k];
    let srcX, score = null, weight = 0, delta = 0, ovl = null;
    if (first) {
      srcX = inf.xL;
    } else if (pr && pr.ov.status === 'overlap') {
      const aEnd = infos[prevKeptIdx].xR - TRIM;
      srcX = Math.max(inf.xL, aEnd - pr.ov.s + 1);
      score = pr.ov.iou; weight = pr.ov.ink;
      ovl = { kind: 'overlap', px: pr.ov.px, iou: pr.ov.iou, cands: pr.ov.cands };
    } else {
      srcX = Math.max(0, Math.min(e, inf.xL + common + TRIM));
      delta = common;
      score = pr && pr.r ? pr.r.match / Math.max(1, pr.r.match + pr.r.mism) : null;
      weight = pr && pr.r ? pr.r.match : 0;
      ovl = { kind: pr ? pr.ov.status : 'none', px: 0, why: pr ? pr.ov.why : null, cands: pr ? pr.ov.cands : [] };
    }
    srcX = Math.min(srcX, Math.max(0, e));
    const f = newScrollFrame({
      canvas: tl.canvas, orig: tl.orig, staffPre: tl.staffPre, t: tl.t, srcX, len: Math.max(1, e - srcX + 1), cut: true, t0: tl.t0, t1: tl.t1,
      score, ok: true, weight, delta, ovl,
    });
    frames.push(f);
    lastReal = f;
    prevKeptIdx = k;
  }

  // 사후 중복 검사 — 이음매 양쪽 5~40% 구간이 같은 마디면 중복 의심: 겹침 탐지가 놓친 것이므로 중복 폭만큼
  // B 왼쪽을 잘라 자동 수정하고, 그래도 남으면 dupSuspect로 표시(주황 깃발 대상)
  const realFrames = frames.filter(f => !f.dup);
  for (let j = 1; j < keep.length; j++) {
    const fp = realFrames[j - 1], fc = realFrames[j];
    const ia = keep[j - 1], ib = keep[j];
    for (let pass = 0; pass < 2; pass++) {
      const dd = detectSeamDuplicate(infos[ia], infos[ib], fp.srcX + fp.len - 1, fc.srcX, fc.srcX + fc.len - 1, mask, space, w);
      if (dd.status !== 'dup') break;
      if (pass === 0 && fc.len - dd.d >= 1) {
        fc.srcX += dd.d; fc.len -= dd.d;
        fc.dupFixed = (fc.dupFixed || 0) + dd.d;
      } else {
        fc.dupSuspect = true;
        break;
      }
    }
  }
  const both = withSys.filter(i => i.touchL && i.touchR).length;
  return { frames, notes: { roiNarrow: both / withSys.length >= 0.5, commonDelta: common, space } };
}

// ---- 대표 프레임 추출 + 이어붙이기 (메인 파이프라인과 구간 재스캔이 공유) ----
// 반환: { mode:'cut'|'smooth', direction, directionNcc, rawFrames, frameLen, segments, notes, typeInfo }
// 컷 전용 로직(오선 트리밍·타일링·중앙값 타일)은 extractCutResult 안에만 있고, 부드러운 스크롤 경로
// (extractSmoothResult)는 그것을 전혀 거치지 않는다.

async function extractCutResult({ video, roi, times, bursts, scrollDefaults, log }) {
  log('컷 전환(타일링) 처리 — 정지 구간별로 대표 프레임을 추출합니다...');
  const defs = buildCutTileDefs(times, bursts);
  const tiles = [];
  await profRun('캡처', async () => {
    for (let k = 0; k < defs.length; k++) {
      // 정지 구간 안 서로 다른 시각 3~7장의 픽셀별 중앙값 — 움직이는 재생 표시(색·모양 무관)가 사라진다
      const idxs = pickMedianIndices(defs[k].startIdx, defs[k].endIdx);
      const caps = [];
      for (const ix of idxs) caps.push(await captureRepCanvas(video, roi, times[ix]));
      const c = caps.length > 1 ? medianOfCanvases(caps) : caps[0];
      tiles.push({ canvas: c, t: defs[k].time, t0: defs[k].t0, t1: defs[k].t1 });
      log('타일 추출 중... ' + (k + 1) + '/' + defs.length);
    }
  });
  const built = await profRun('이음', () => buildCutFrames(tiles, scrollDefaults));
  if (!built || !built.frames.length) return null;
  return {
    mode: 'cut', direction: 'horizontal', directionNcc: null, rawFrames: built.frames,
    frameLen: tiles[0].canvas.width,
    segments: defs.map((d, i) => ({ tA: d.tA, tB: d.tB, frameIdx: i })),
    notes: built.notes,
  };
}

async function extractSmoothResult({ video, roi, times, bursts, scrollDefaults, direction, log }) {
  const repIdx = scrollRepIndices(times, bursts);
  log('대표 프레임 ' + repIdx.length + '장 추출 중...');
  const repFrames = [];
  await profRun('캡처', async () => {
    for (let k = 0; k < repIdx.length; k++) {
      const t = times[repIdx[k]];
      repFrames.push({ time: t, canvas: await captureRepCanvas(video, roi, t) });
      log('대표 프레임 추출 중... ' + (k + 1) + '/' + repIdx.length);
    }
  });

  // 저신뢰 seam 재정합(부드러운 스크롤 한정): 해당 burst를 1/20초 간격으로 촘촘히 샘플링해 연속 프레임끼리
  // NCC 정합 후 오프셋을 누적. 탐색 범위는 신뢰 높은 이웃 seam 중앙값 ±30%.
  const refineHook = async (seamIdx, medianShift, dir) => {
    const a = repIdx[seamIdx], b = repIdx[seamIdx + 1];
    const burst = bursts.find(bu => (bu.start - 1) === a && (bu.end + 1) === b);
    if (!burst || !(medianShift > 0)) return null;
    const tA = times[a], tB = times[b];
    const step = Math.max(1 / 20, (tB - tA) / 40);
    const fine = [];
    for (let t = tA; t < tB; t += step) fine.push(t);
    fine.push(tB);
    if (fine.length < 3) return null;
    log('저신뢰 이음새 재정합 중... (' + tA.toFixed(1) + 's~' + tB.toFixed(1) + 's)');
    const cs = [];
    for (const t of fine) {
      const c = await captureRepCanvas(video, roi, t);
      scrollApplyPreprocInPlace(c, scrollDefaults);
      cs.push(c);
    }
    let total = 0, minScore = 1;
    for (let j = 0; j < cs.length - 1; j++) {
      const z = scrollIsDuplicateFrame(cs[j], cs[j + 1]);
      const r = scrollFindBestShift(cs[j], cs[j + 1], dir, { minShift: 1, maxShift: Math.ceil(medianShift * 1.3), maxDim: 400 });
      if (z.sim >= r.score) continue;
      total += r.shift;
      if (r.score < minScore) minScore = r.score;
    }
    if (total < medianShift * 0.7 || total > medianShift * 1.3) return null;
    return { shift: total, score: minScore, ok: minScore > 0.5 };
  };

  log('전처리 · 이어붙이기 진행 중...');
  const stage3 = await profRun('이음', () => runScrollStage3(repFrames, scrollDefaults, direction, refineHook));
  const frameLen = stage3.direction === 'vertical' ? repFrames[0].canvas.height : repFrames[0].canvas.width;
  return {
    mode: 'smooth', direction: stage3.direction, directionNcc: stage3.directionNcc, rawFrames: stage3.frames,
    frameLen, segments: smoothMarkerSegments(repIdx, times, bursts), notes: {},
  };
}

// 두 결과 중 더 나은 쪽을 고르기 위한 점수 — 이음매 검증 통과율(0.4) + 이음매 양쪽 내용 중복 없음(0.3) +
// 마디 폭 균일성(0.3)
function scoreStitchResult(rawFrames, direction, viewLen) {
  const lay = renderFrames(rawFrames, direction);
  const det = detectStaffAndBars(lay.canvas, 0.6, null, viewLen, direction === 'vertical' ? null : lay.placed);
  if (!det.staffFound) return { score: 0, passRate: 0, dupFrac: 1, widthOk: 0, unverFrac: 0 };
  const checks = validateCutSeams(lay.seams, det.bars, det, det.quality.low);
  let tot = 0, pass = 0;
  lay.seams.forEach((sm, i) => {
    if (sm.dup) return;
    tot++;
    const flagged = sm.cut ? checks[i].flagged : (sm.score != null && sm.score < 0.7);
    if (!flagged) pass++;
  });
  // 내용 중복 비율은 개선된 detectSeamDuplicate(타일 전체 높이)로 전체 이음매에서 계산한다.
  let pairs = 0, dupN = 0, unverN = 0;
  if (direction !== 'vertical') {
    const real = lay.placed.filter(f => !f.dup);
    for (let j = 1; j < real.length; j++) {
      const fp = real[j - 1], fc = real[j];
      if (fp.canvas.width !== fc.canvas.width || fp.canvas.height !== fc.canvas.height) continue;
      const ia = tileInfoOf(fp.canvas), ib = tileInfoOf(fc.canvas);
      if (!ia.sys && !ib.sys) { pairs++; unverN++; continue; }
      const mask = new Uint8Array(fp.canvas.height);
      for (const inf of [ia, ib]) if (inf.sys) for (let y = 0; y < mask.length; y++) if (inf.sys.mask[y]) mask[y] = 1;
      const space = (ia.sys || ib.sys).space;
      const dd = detectSeamDuplicate(ia, ib, fp.srcX + fp.len - 1, fc.srcX, fc.srcX + fc.len - 1, mask, space, fp.canvas.width);
      pairs++;
      if (dd.status === 'dup') dupN++;
      else if (dd.status === 'unverifiable' || (fc.ovl && fc.ovl.kind === 'unverifiable')) unverN++;
    }
  }
  const passRate = tot ? pass / tot : 1;
  const dupFrac = pairs ? dupN / pairs : 0;
  const unverFrac = pairs ? unverN / pairs : 0;
  const widthOk = det.quality.measureCount >= 1 ? det.quality.widthOk : 0;
  let score = 0.4 * passRate + 0.3 * (1 - dupFrac) + 0.3 * widthOk;
  // 판단 불가 이음매가 20%를 넘으면 크게 감점 (만점 불가)
  if (unverFrac > 0.2) score = Math.min(score * 0.6, 0.55);
  return { score, passRate, dupFrac, widthOk, unverFrac };
}

// transition: 'auto' | 'smooth' | 'cut'
async function extractAndStitch({ video, roi, times, bursts, scrollDefaults, direction, transition, log }) {
  log = log || (() => {});
  transition = transition || 'auto';
  const ctx = { video, roi, times, bursts, scrollDefaults, direction, log };
  const withInfo = (r, info) => ({ ...r, typeInfo: { requested: transition, ...info } });
  const smoothFallback = async reason => withInfo(await extractSmoothResult(ctx), { decided: 'smooth', reason });

  if (transition === 'smooth') return smoothFallback('사용자 지정: 부드러운 스크롤(NCC 겹침)');
  if (transition === 'cut') {
    if (direction !== 'vertical') {
      const r = await extractCutResult(ctx);
      if (r) return withInfo(r, { decided: 'cut', reason: '사용자 지정: 컷 전환(타일링)' });
    }
    return smoothFallback('사용자 지정 컷 전환을 적용할 수 없어(세로 스크롤이거나 오선 미검출) 부드러운 스크롤(NCC)로 대체');
  }

  const cls = await profRun('분류', () => classifyCutBursts(video, roi, times, bursts, scrollDefaults, direction));
  const pct = Math.round(cls.ratio * 100);
  const stat = '컷 burst ' + cls.cutCount + '/' + bursts.length + '개(' + pct + '%)' + (cls.multi ? ', 다중 샘플 burst ' + cls.multi + '개' : '');
  if (cls.kind === 'smooth') {
    return smoothFallback('자동: ' + stat + ' — ' + (cls.cutCount === 0 ? '화면 끝 겹침이 확인되어' : '컷 비율이 낮아') + ' 부드러운 스크롤(NCC)로 판정');
  }
  if (cls.kind === 'cut') {
    const r = await extractCutResult(ctx);
    if (r) return withInfo(r, { decided: 'cut', reason: '자동: ' + stat + ' — 겹침 없음이 확인되어 컷 전환(타일링)으로 판정' });
    return smoothFallback('자동: 컷으로 판정됐으나 오선을 찾지 못해 부드러운 스크롤(NCC)로 대체');
  }
  // 애매함 — 둘 다 만들어 이음매 검증 통과율·내용 중복·마디 폭 균일성으로 점수를 매겨 더 좋은 쪽을 선택
  log('유형이 애매해 컷/NCC 결과를 모두 만들어 비교합니다...');
  const cutR = await extractCutResult(ctx);
  const smR = await extractSmoothResult(ctx);
  if (!cutR) return withInfo(smR, { decided: 'smooth', reason: '자동(애매): 컷 결과를 만들 수 없어(오선 미검출) NCC 선택' });
  const sc = scoreStitchResult(cutR.rawFrames, 'horizontal', cutR.frameLen);
  const ss = scoreStitchResult(smR.rawFrames, smR.direction, smR.frameLen);
  const pickCut = sc.score > ss.score;
  const fmt = x => '점수 ' + x.score.toFixed(2) + ' (이음매 통과 ' + Math.round(x.passRate * 100) + '%, 내용 중복 ' + Math.round(x.dupFrac * 100) + '%, 판단 불가 ' + Math.round(x.unverFrac * 100) + '%, 마디 폭 균일 ' + Math.round(x.widthOk * 100) + '%)';
  return withInfo(pickCut ? cutR : smR, {
    decided: pickCut ? 'cut' : 'smooth',
    reason: '자동(애매): ' + stat + ' → 둘 다 생성해 비교 — 컷 ' + fmt(sc) + ' vs NCC ' + fmt(ss) + ' → ' + (pickCut ? '컷 전환' : '부드러운 스크롤(NCC)') + ' 선택',
    scores: { cut: sc, smooth: ss },
  });
}

// 추출 + 재생 표시 추적까지의 전체 파이프라인 (최초 실행과 "이 유형으로 다시 만들기"가 공유)
async function buildScrollResult({ video, roi, times, bursts, scrollDefaults, direction, transition, log }) {
  log = log || (() => {});
  scrollProf.stages = {};
  const tAll = performance.now();
  const ex = await extractAndStitch({ video, roi, times, bursts, scrollDefaults, direction, transition, log });
  const lay = renderFrames(ex.rawFrames, ex.direction);
  // 마디별 정밀 시간 동기화 — 실패해도(표시 없음/신뢰도 부족) 결과 화면이 조각 모델 폴백을 쓴다.
  log('재생 위치 표시 추적 중 (있는 경우 마디별 시간을 더 정밀하게 맞춥니다)...');
  let markerData = null;
  try {
    let cnt = 0;
    const { rawPoints } = await profRun('재생표시', () => detectPlaybackMarker({
      video, roi, direction: ex.direction, segments: ex.segments, frames: lay.placed, frameLen: ex.frameLen,
      onProgress: () => { cnt++; if (cnt % 5 === 0) log('재생 위치 표시 추적 중... (' + cnt + '개 샘플)'); },
    }));
    markerData = { rawPoints, ...validateMarkerTrack(markerPointsToGlobal(rawPoints, lay.placed)) };
  } catch (err) {
    markerData = null;
  }
  const profile = {
    stages: JSON.parse(JSON.stringify(scrollProf.stages)), diff: scrollProf.diff ? { ...scrollProf.diff } : null,
    pipelineSec: (performance.now() - tAll) / 1000, videoDuration: video.duration || 0,
  };
  return { ex, markerData, profile };
}

// ---- 그룹 수동 오버라이드용 "구간 재스캔(미니 스티칭)" — 위 파이프라인(diff 샘플링 → burst 탐지 →
// 컷/부드러운 판별 → 대표 프레임 → 이어붙이기)을 임의의 [startT, endT] 구간에만 그대로 다시 돌린다.
// diffThreshold가 null/undefined면 메인 분석 화면과 같은 방식(최대 diff의 35%)으로 자동 추정해 반환한다.
async function runMiniStitchForRange(video, roi, startT, endT, diffThreshold, scrollDefaults, directionPref, stepSec) {
  const step = stepSec || 0.15;
  const s = Math.max(0, Math.min(startT, video.duration));
  const e = Math.max(s + step, Math.min(endT, video.duration));
  const times = [], diffs = [];
  let prevSample = null;
  let t = s;
  while (t < e) {
    await seekTo(video, t);
    const sample = getRoiPixelsForDiff(video, roi);
    times.push(t);
    if (prevSample) diffs.push(diffScore(prevSample, sample));
    prevSample = sample;
    t += step;
  }
  if (times[times.length - 1] < e - 1e-6) {
    await seekTo(video, e);
    const sample = getRoiPixelsForDiff(video, roi);
    times.push(e);
    if (prevSample) diffs.push(diffScore(prevSample, sample));
  }
  const maxObserved = Math.max(...diffs, 0.1);
  const threshold = diffThreshold != null ? diffThreshold : maxObserved * 0.35;
  const bursts = groupScrollBursts(diffs, threshold);
  const ex = await extractAndStitch({ video, roi, times, bursts, scrollDefaults, direction: directionPref });
  const lay = renderFrames(ex.rawFrames, ex.direction);
  return {
    rawFrames: ex.rawFrames, direction: ex.direction, mode: ex.mode, canvas: lay.canvas,
    repCount: ex.rawFrames.length, bursts, times, diffs, maxObserved, threshold, startT: s, endT: e,
  };
}

// ---- ROI 드래그 선택 UI — CaptureStep과 같은 패턴(별도 컴포넌트로 분리해 스크롤/페이지 두
// 플로우가 각자의 캔버스 ref를 갖게 함, 상태 공유 없음) ----
function ScrollRoiPicker({ videoRef, videoLoaded, roi, setRoi, suppressRef }) {
  const roiCanvasRef = useRef(null);
  const roiBoxRef = useRef(null);
  const dragStartRef = useRef(null);
  const roiRef = useRef(null);

  function drawRoiBoxOverlay() {
    const box = roiBoxRef.current, canvas = roiCanvasRef.current;
    if (!box || !canvas) return;
    const r = roiRef.current;
    if (!r) { box.style.display = 'none'; return; }
    const rect = canvas.getBoundingClientRect();
    box.style.left = (r.x0 * rect.width) + 'px';
    box.style.top = (r.y0 * rect.height) + 'px';
    box.style.width = ((r.x1 - r.x0) * rect.width) + 'px';
    box.style.height = ((r.y1 - r.y0) * rect.height) + 'px';
    box.style.display = 'block';
  }
  useEffect(() => { roiRef.current = roi; drawRoiBoxOverlay(); }, [roi]);
  useEffect(() => {
    window.addEventListener('resize', drawRoiBoxOverlay);
    return () => window.removeEventListener('resize', drawRoiBoxOverlay);
  }, []);

  function redrawFrame() {
    if (suppressRef && suppressRef.current) return; // 백그라운드 seek 중에는 그 프레임을 그리지 않는다 (선택 prop)
    const video = videoRef.current, canvas = roiCanvasRef.current;
    if (!video || !canvas || !video.videoWidth) return;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    drawRoiBoxOverlay();
  }
  useEffect(() => { if (videoLoaded) redrawFrame(); }, [videoLoaded]);
  // Exposes a redraw hook the parent can call after every scrub seek (video pixels change but this
  // component isn't otherwise re-rendered by a scrub).
  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    video.addEventListener('seeked', redrawFrame);
