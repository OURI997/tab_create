<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영상에서 TAB 추출</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  :root{
    --bg:#faf8f3;
    --card:#ffffff;
    --border:#ddd8cc;
    --border-strong:#bdb6a4;
    --text:#1a1a1a;
    --text2:#6b6b63;
    --accent:#3c3489;
    --accent-bg:#eeedfe;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  .app{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
  .titlebar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px;}
  .titlebar h1{flex:1;font-family:Georgia,"Noto Serif KR",serif;font-size:22px;font-weight:600;margin:0;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  button{
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;
  }
  button:hover{background:var(--accent-bg);}
  button:disabled{opacity:0.4;cursor:default;}
  .icon-btn{padding:6px 8px;font-size:13px;}
  .nav-link{border:1px solid var(--border-strong);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;}
  .nav-link:hover{background:var(--accent-bg);}
  .save-msg{font-size:13px;color:var(--accent);}
  .block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--text2);gap:10px;}
  .merge-preview-img{max-width:100%;display:block;background:#fff;border:1px solid var(--border);border-radius:8px;margin-top:6px;}
  canvas.preview{width:100%;display:block;background:#fff;border:1px solid var(--border);border-radius:8px;}
  .adv-toggle-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text2);gap:8px;}
  .controls{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .controls label{display:flex;align-items:center;gap:8px;font-size:13px;}
  .slider-label{font-size:12px;color:var(--text2);margin-bottom:4px;}
  input[type=range]{width:100%;}
  input[type=number]{border:1px solid var(--border-strong);border-radius:8px;padding:5px 6px;font-size:13px;width:70px;}
  select{border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;font-size:13px;background:var(--card);color:var(--text);width:100%;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .hr{border:none;border-top:1px solid var(--border);margin:4px 0;}

  .notice-banner{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;
    padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--text);
  }
  .notice-banner b{color:var(--accent);}

  .mode-card-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .mode-card{
    flex:1;min-width:220px;text-align:left;background:var(--card);border:2px solid var(--border-strong);
    border-radius:12px;padding:18px;cursor:pointer;font-family:inherit;
  }
  .mode-card:hover{border-color:var(--accent);background:var(--accent-bg);}
  .mode-card .mode-card-title{font-size:16px;font-weight:700;margin-bottom:6px;}
  .mode-card .mode-card-desc{font-size:12.5px;color:var(--text2);line-height:1.5;}

  .step-nav{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--text2);}
  .step-nav .step{padding:4px 10px;border-radius:999px;border:1px solid var(--border);}
  .step-nav .step.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:600;}
  .step-nav .arrow{color:var(--border-strong);}

  .hint-text{font-size:12.5px;color:var(--text2);line-height:1.6;margin:0 0 8px;}

  /* Kept in the layout (not display:none) so hidden-video frame decoding still works in Safari etc —
     only visually hidden via near-zero size/opacity. Always rendered at the App root so it is never
     nested inside a step wrapper that gets hidden during step navigation. */
  video.hidden-video{position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.01;pointer-events:none;}

  .roi-wrap{position:relative;display:inline-block;margin:10px 0;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;max-width:100%;}
  .roi-canvas{display:block;max-width:100%;cursor:crosshair;background:#000;}
  .roi-box{position:absolute;border:2px solid #e74c3c;background:rgba(231,76,60,0.15);display:none;pointer-events:none;}
  .chart-canvas{width:100%;height:120px;border:1px solid var(--border);border-radius:8px;margin:10px 0;background:#fff;display:block;}

  .progress-bar-wrap{position:relative;width:100%;height:22px;border:1px solid var(--border-strong);border-radius:999px;background:var(--accent-bg);overflow:hidden;margin:8px 0;}
  .progress-bar-fill{position:absolute;top:0;left:0;bottom:0;background:var(--accent);transition:width 0.15s ease-out;}
  .progress-bar-label{position:relative;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text);}

  .range-slider-track{position:relative;height:28px;background:var(--border);border-radius:999px;margin:10px 2px 18px;}
  .range-slider-fill{position:absolute;top:0;bottom:0;background:var(--accent-bg);border:1px solid var(--accent);border-radius:999px;}
  .range-slider-handle{
    position:absolute;top:50%;width:22px;height:22px;border-radius:50%;
    background:#ffffff;border:2px solid var(--accent);transform:translate(-50%,-50%);
    cursor:grab;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,0.25);z-index:1;
  }
  .range-slider-handle:active{cursor:grabbing;}

  .thumb-grid{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;}
  .thumb-card{position:relative;width:180px;border:1px solid var(--border-strong);border-radius:8px;padding:6px;background:var(--card);}
  .thumb-card.view-only{cursor:zoom-in;}
  .thumb-card.view-only:hover{border-color:var(--accent);}
  .thumb-card.selectable{display:block;cursor:pointer;}
  .thumb-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
  .thumb-card img{width:100%;display:block;border-radius:4px;background:#fff;}
  .thumb-card input[type=checkbox]{position:absolute;top:10px;left:10px;width:18px;height:18px;z-index:2;}
  .thumb-meta{font-size:11px;color:var(--text2);margin-top:4px;text-align:center;}

  .preview-modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;
  }
  .preview-modal{
    background:var(--card);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.3);
    width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .preview-modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);
  }
  .preview-modal-body{overflow:auto;padding:12px;background:#f4f2ea;}
  .preview-modal-body img{width:100%;display:block;background:#fff;}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useMemo } = React;

// ==== copied (near-)verbatim from tab-score-builder.html so preprocessing here reproduces exactly
// what will happen after handoff — these two files are fully independent static pages with no shared
// module system, so duplication is the deliberate architecture (same pattern index.html already uses). ====

const DB_NAME = 'tab_score_builder_db';
const STORE_NAME = 'scores';
// Matches tab-score-builder.html's own VIDEO_IMPORT_KEY exactly — same database, same store, this
// page only ever writes this one key right before navigating over.
const VIDEO_IMPORT_KEY = '__video_import__';
// One entry per extraction session, keyed by VIDEO_SOURCE_KEY_PREFIX + a generated id (see
// App.goToPreprocess) — holds the original video file (for on-demand audio decode/playback later, in
// tab-score-builder.html's syllable-placement mode) plus its detected onsets, stored once and shared
// by every TAB item built from that same video rather than duplicated per item.
const VIDEO_SOURCE_KEY_PREFIX = '__video_source__';

function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(STORE_NAME)) {
        req.result.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function sampleAvgLuminance(img) {
  const c = document.createElement('canvas');
  const w = 60;
  const h = Math.max(1, Math.round((60 * img.naturalHeight) / img.naturalWidth));
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let sum = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    n++;
  }
  return sum / n;
}

function smoothstep(edge0, edge1, x) {
  if (edge0 === edge1) return x < edge0 ? 0 : 1;
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function applyThreshold(imageData, threshold, invert, softness) {
  const d = imageData.data;
  const lo = threshold - softness;
  const hi = threshold + softness;
  for (let i = 0; i < d.length; i += 4) {
    const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const t = smoothstep(lo, hi, lum);
    const v = invert ? 255 * (1 - t) : 255 * t;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
}

function despeckleBinary(imageData, w, h, maxArea) {
  if (!maxArea || maxArea <= 0) return;
  const data = imageData.data;
  const total = w * h;
  const visited = new Uint8Array(total);
  const stack = new Int32Array(total);
  const isInk = (idx) => data[idx*4] < 128;
  for (let start = 0; start < total; start++) {
    if (visited[start] || !isInk(start)) continue;
    let sp = 0;
    stack[sp++] = start; visited[start] = 1;
    let head = 0;
    while (head < sp) {
      const p = stack[head++];
      const x = p % w, y = (p - x) / w | 0;
      if (x > 0) { const n = p-1; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (x < w-1) { const n = p+1; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (y > 0) { const n = p-w; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (y < h-1) { const n = p+w; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
    }
    if (sp <= maxArea) {
      for (let i = 0; i < sp; i++) {
        const idx = stack[i]*4;
        data[idx]=255; data[idx+1]=255; data[idx+2]=255;
      }
    }
  }
}

// Copied verbatim from tab-score-builder.html (rgbToHsv/hueDist/scanVerticalRuns/detectPlayheadRuns/
// removePlayheadRuns) — used only by the new scroll-mode pipeline further down this file, through its
// own applyPreprocInPlace. The page-transition flow's drawProcessed above never calls these (see its
// comment).
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  return { h, s, v: max };
}
function hueDist(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}
function scanVerticalRuns(imageData, w, h, isMatchFn, minRunRatio, maxRunWidthPx) {
  const d = imageData.data;
  const colMatch = new Uint8Array(w);
  for (let x = 0; x < w; x++) {
    let hits = 0;
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      if (isMatchFn(d[i], d[i + 1], d[i + 2])) hits++;
    }
    colMatch[x] = (hits / h) >= minRunRatio ? 1 : 0;
  }
  const runs = [];
  let x = 0;
  while (x < w) {
    if (!colMatch[x]) { x++; continue; }
    const startX = x;
    while (x < w && colMatch[x]) x++;
    const endX = x;
    if (!maxRunWidthPx || (endX - startX) <= maxRunWidthPx) {
      runs.push({ startX, endX, centerXPct: ((startX + endX) / 2 / w) * 100 });
    }
  }
  return runs;
}
function detectPlayheadRuns(imageData, w, h, colorBand) {
  const band = colorBand || { hue: 210, hueTolerance: 35, satMin: 0.35 };
  const isMatch = (r, g, b) => {
    const { h: hue, s: sat } = rgbToHsv(r, g, b);
    return sat >= band.satMin && hueDist(hue, band.hue) <= band.hueTolerance;
  };
  const runs = scanVerticalRuns(imageData, w, h, isMatch, 0.6, 14);
  return runs.map(r => ({ ...r, key: Math.round(r.centerXPct * 2) / 2 }));
}
function removePlayheadRuns(imageData, w, h, runs, excludedKeys, fillColor) {
  const fill = fillColor || { r: 255, g: 255, b: 255 };
  const excluded = new Set(excludedKeys || []);
  const d = imageData.data;
  for (const run of runs) {
    if (excluded.has(run.key)) continue;
    const x0 = Math.max(0, run.startX - 1), x1 = Math.min(w, run.endX + 1);
    for (let y = 0; y < h; y++) {
      for (let x = x0; x < x1; x++) {
        const i = (y * w + x) * 4;
        d[i] = fill.r; d[i + 1] = fill.g; d[i + 2] = fill.b; d[i + 3] = 255;
      }
    }
  }
}
// avg luminance from an already-captured canvas (not an Image element) — same downscale+average
// approach as sampleAvgLuminance above, adapted for the scroll pipeline's canvas-based frames instead
// of re-wrapping them as <img> elements just to reuse that function.
function computeAvgLuminanceFromCanvas(canvas) {
  const w = 60;
  const h = Math.max(1, Math.round((60 * canvas.height) / canvas.width));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(canvas, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let sum = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]; n++; }
  return sum / n;
}

function clampPct(v) { return Math.min(100, Math.max(0, v || 0)); }
function clampCropPair(a, b) {
  a = clampPct(a); b = clampPct(b);
  const maxSum = 90;
  if (a + b > maxSum) {
    const ratio = maxSum / (a + b);
    a = Math.floor(a * ratio);
    b = Math.floor(b * ratio);
  }
  return [a, b];
}

// drawProcessed itself is copied verbatim from tab-score-builder.html. Its s.playheadRemove branch
// stays dead code here (the page-transition flow's own settings always set playheadRemove:false,
// since playhead removal isn't exposed in THAT flow's UI — out of scope for it) — but
// detectPlayheadRuns/removePlayheadRuns themselves ARE copied below (also verbatim from
// tab-score-builder.html), because the new scroll-mode pipeline further down this file does use
// them, through its own separate applyPreprocInPlace, not through this function.
function drawProcessed(canvas, img, s) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const [cropTop, cropBottom] = clampCropPair(s.cropTop, s.cropBottom);
  const [cropLeft, cropRight] = clampCropPair(s.cropLeft, s.cropRight);
  const sx = Math.floor(W * cropLeft / 100);
  const sy = Math.floor(H * cropTop / 100);
  const sw = Math.max(1, Math.floor(W * (100 - cropLeft - cropRight) / 100));
  const sh = Math.max(1, Math.floor(H * (100 - cropTop - cropBottom) / 100));
  canvas.width = sw; canvas.height = sh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  if (s.playheadRemove) {
    // unreachable in this page — see comment above
  }
  if (s.removeBg) {
    const imageData = ctx.getImageData(0, 0, sw, sh);
    applyThreshold(imageData, s.threshold, s.invert, s.softness || 0);
    if (s.despeckle) despeckleBinary(imageData, sw, sh, s.despeckleSize || 0);
    ctx.putImageData(imageData, 0, 0);
  }
}

// Same shape/logic as tab-score-builder.html's effectiveImageSettings — crop and playhead removal
// are fixed at "off" since this page doesn't expose UI for them (out of scope for this task); the
// fields still exist so drawProcessed's contract matches exactly.
function effectiveImageSettings(item, defaults) {
  const o = item.override;
  if (o) {
    return {
      removeBg: o.removeBg, invert: o.invert, threshold: o.threshold, softness: o.softness,
      despeckle: o.despeckle, despeckleSize: o.despeckleSize,
      playheadRemove: false, playheadColor: null,
      cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
    };
  }
  return {
    removeBg: defaults.removeBg, invert: item.invert, threshold: defaults.threshold, softness: defaults.softness,
    despeckle: defaults.despeckle, despeckleSize: defaults.despeckleSize,
    playheadRemove: false, playheadColor: null,
    cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
  };
}

const VIDEO_DEFAULTS_INIT = {
  removeBg: true, invertMode: 'auto', threshold: 140, softness: 18,
  despeckle: true, despeckleSize: 3,
};

// ==== new for this page: video capture / ROI diff detection ====

// Diff sampling stays small+downscaled (cheap, noise-tolerant). Representative-frame capture below
// uses a SEPARATE canvas at the ROI's own native resolution — no downscaling — since that becomes the
// actual TAB source image handed off to tab-score-builder.
const DIFF_SAMPLE_MAXDIM = 160;
const diffSampleCanvas = document.createElement('canvas');
const diffSampleCtx = diffSampleCanvas.getContext('2d', { willReadFrequently: true });
const roiCaptureCanvas = document.createElement('canvas');
const roiCaptureCtx = roiCaptureCanvas.getContext('2d');

function roiRectPx(video, roi) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const rx0 = roi ? roi.x0 * vw : 0;
  const ry0 = roi ? roi.y0 * vh : 0;
  const rw = roi ? (roi.x1 - roi.x0) * vw : vw;
  const rh = roi ? (roi.y1 - roi.y0) * vh : vh;
  return { rx0, ry0, rw, rh };
}

function getRoiPixelsForDiff(video, roi) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const scale = Math.min(1, DIFF_SAMPLE_MAXDIM / Math.max(rw, rh));
  const outW = Math.max(1, Math.round(rw * scale));
  const outH = Math.max(1, Math.round(rh * scale));
  diffSampleCanvas.width = outW; diffSampleCanvas.height = outH;
  diffSampleCtx.drawImage(video, rx0, ry0, rw, rh, 0, 0, outW, outH);
  return diffSampleCtx.getImageData(0, 0, outW, outH).data;
}

// ==== onset (sound-start) detection — spectral flux, reused from the verified onset-detect-test.html
// prototype: FFT magnitude spectrum per frame, positive-change flux between adjacent frames, adaptive
// local-mean+stddev threshold for peak picking, then merge candidates closer than the minimum gap. ====

function nextPow2(n) { let p = 1; while (p < n) p *= 2; return p; }

// Iterative radix-2 FFT (real input, magnitude spectrum only) — identical to the prototype's.
function fftMagnitude(real) {
  const n = real.length;
  const re = Float64Array.from(real);
  const im = new Float64Array(n);
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let curWr = 1, curWi = 0;
      for (let j = 0; j < len / 2; j++) {
        const ur = re[i + j], ui = im[i + j];
        const vr = re[i + j + len/2] * curWr - im[i + j + len/2] * curWi;
        const vi = re[i + j + len/2] * curWi + im[i + j + len/2] * curWr;
        re[i + j] = ur + vr; im[i + j] = ui + vi;
        re[i + j + len/2] = ur - vr; im[i + j + len/2] = ui - vi;
        const nWr = curWr * wr - curWi * wi;
        curWi = curWr * wi + curWi * wr;
        curWr = nWr;
      }
    }
  }
  const mags = new Float64Array(n / 2);
  for (let i = 0; i < n / 2; i++) mags[i] = Math.hypot(re[i], im[i]);
  return mags;
}

// Returns onset times in seconds, ABSOLUTE within monoData's own timeline — if monoData is decoded
// from the whole original video file (not a cropped segment), these are directly usable as
// video-absolute timestamps, which is what downstream syllable placement needs regardless of how the
// video later gets split into pages or merged into rows.
function detectOnsets(monoData, sampleRate) {
  const FRAME_SIZE = 1024, HOP = 512;
  const SENSITIVITY = 1.5, MIN_GAP_SEC = 0.12; // prototype's verified defaults, not exposed as UI here
  const win = new Float64Array(FRAME_SIZE);
  for (let i = 0; i < FRAME_SIZE; i++) win[i] = 0.5 - 0.5 * Math.cos(2 * Math.PI * i / (FRAME_SIZE - 1));

  const numFrames = Math.max(0, Math.floor((monoData.length - FRAME_SIZE) / HOP));
  const flux = new Float64Array(numFrames);
  let prevMag = null;
  const frameBuf = new Float64Array(FRAME_SIZE);
  for (let f = 0; f < numFrames; f++) {
    const start = f * HOP;
    for (let i = 0; i < FRAME_SIZE; i++) frameBuf[i] = monoData[start + i] * win[i];
    const mag = fftMagnitude(frameBuf);
    if (prevMag) {
      let sum = 0;
      for (let k = 0; k < mag.length; k++) { const d = mag[k] - prevMag[k]; if (d > 0) sum += d; }
      flux[f] = sum;
    }
    prevMag = mag;
  }

  const maxFlux = Math.max(...flux, 1e-9);
  for (let i = 0; i < flux.length; i++) flux[i] /= maxFlux;

  const minGapFrames = Math.max(1, Math.round(MIN_GAP_SEC * sampleRate / HOP));
  const W = 20;
  const candidates = [];
  for (let i = 2; i < flux.length - 2; i++) {
    const lo = Math.max(0, i - W), hi = Math.min(flux.length, i + W);
    let mean = 0;
    for (let k = lo; k < hi; k++) mean += flux[k];
    mean /= (hi - lo);
    let variance = 0;
    for (let k = lo; k < hi; k++) variance += (flux[k] - mean) ** 2;
    const std = Math.sqrt(variance / (hi - lo));
    const threshold = mean + SENSITIVITY * std;
    const isLocalPeak = flux[i] > flux[i-1] && flux[i] >= flux[i+1];
    if (isLocalPeak && flux[i] > threshold && flux[i] > 0.02) candidates.push({ frame: i, score: flux[i] });
  }

  candidates.sort((a, b) => a.frame - b.frame);
  const filtered = [];
  for (const c of candidates) {
    if (filtered.length === 0 || c.frame - filtered[filtered.length - 1].frame >= minGapFrames) {
      filtered.push(c);
    } else if (c.score > filtered[filtered.length - 1].score) {
      filtered[filtered.length - 1] = c;
    }
  }
  return filtered.map(c => (c.frame * HOP) / sampleRate);
}

// Decodes the full audio track of a video/audio File and runs onset detection on it. Returns
// { onsets: number[], duration: number } — duration comes straight from the decoded buffer, matching
// the video's own duration closely enough for range-clamping purposes. Resolves to { onsets: [],
// duration: 0 } (never rejects) on any decode failure — e.g. a video with no audio track — since
// onset data is an enhancement, not a hard requirement for the rest of the pipeline to work.
async function decodeAudioOnsets(file) {
  try {
    const arrayBuf = await file.arrayBuffer();
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const audioBuffer = await ctx.decodeAudioData(arrayBuf);
    const ch0 = audioBuffer.getChannelData(0);
    let monoData = ch0;
    if (audioBuffer.numberOfChannels > 1) {
      const ch1 = audioBuffer.getChannelData(1);
      monoData = new Float32Array(ch0.length);
      for (let i = 0; i < ch0.length; i++) monoData[i] = (ch0[i] + ch1[i]) / 2;
    }
    const onsets = detectOnsets(monoData, audioBuffer.sampleRate);
    return { onsets, duration: audioBuffer.duration };
  } catch (err) {
    console.warn('온셋 감지용 오디오 디코딩 실패 (온셋 없이 계속 진행):', err);
    return { onsets: [], duration: 0 };
  }
}

function diffScore(a, b) {
  let sum = 0;
  const n = a.length / 4;
  for (let i = 0; i < a.length; i += 4) {
    const lumA = 0.299*a[i] + 0.587*a[i+1] + 0.114*a[i+2];
    const lumB = 0.299*b[i] + 0.587*b[i+1] + 0.114*b[i+2];
    sum += Math.abs(lumA - lumB);
  }
  return sum / n;
}

// Requirement: representative frames are the ROI cropped at the video's OWN native resolution, no
// downscaling — this is the actual image handed off to tab-score-builder, so quality matters here.
function captureRoiNative(video, roi) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const w = Math.max(1, Math.round(rw)), h = Math.max(1, Math.round(rh));
  roiCaptureCanvas.width = w; roiCaptureCanvas.height = h;
  roiCaptureCtx.drawImage(video, rx0, ry0, rw, rh, 0, 0, w, h);
  return { dataUrl: roiCaptureCanvas.toDataURL('image/png'), w, h };
}

// After 'seeked' fires, the decoder has not always actually PRESENTED the new frame's pixels yet —
// confirmed by direct testing here: drawImage(video,...) right after 'seeked' can still read the
// PREVIOUS frame's content, especially on videos with long static holds (sparse keyframes), which TAB
// captures — the exact target content for this page — commonly are. requestVideoFrameCallback fires
// precisely when a new frame is composited (including from a programmatic seek while paused), so it's
// preferred; a bounded timeout fallback guarantees this never hangs even if rVFC is unsupported or
// doesn't fire for some edge case.
function waitForFramePresented(video) {
  return new Promise(resolve => {
    let done = false;
    const finish = () => { if (done) return; done = true; resolve(); };
    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(finish);
    setTimeout(finish, 150);
  });
}

function seekTo(video, t) {
  return new Promise(resolve => {
    const onSeeked = () => {
      video.removeEventListener('seeked', onSeeked);
      waitForFramePresented(video).then(resolve);
    };
    video.addEventListener('seeked', onSeeked);
    video.currentTime = t;
  });
}

function Lightbox({ src, onClose }) {
  if (!src) return null;
  return (
    <div className="preview-modal-backdrop" onClick={onClose}>
      <div className="preview-modal" onClick={e => e.stopPropagation()}>
        <div className="preview-modal-head">
          <span>프레임 크게 보기</span>
          <button className="icon-btn" onClick={onClose}>닫기</button>
        </div>
        <div className="preview-modal-body"><img src={src} alt="프레임 크게 보기" /></div>
      </div>
    </div>
  );
}

function CaptureStep({ videoRef, frames, setFrames, onsets, setOnsets, videoFile, setVideoFile, onNext }) {
  const roiCanvasRef = useRef(null);
  const roiBoxRef = useRef(null);
  const chartRef = useRef(null);
  const dragStartRef = useRef(null);
  const roiRef = useRef(null);
  const seekBusyRef = useRef(false);
  const pendingSeekRef = useRef(null);
  const rangeTrackRef = useRef(null);
  const rangeDragRef = useRef(null); // 'start' | 'end' | null, which handle (if any) is being dragged
  const rangeStartRef = useRef(0);
  const rangeEndRef = useRef(0);
  const durationRef = useRef(0);

  const [videoLoaded, setVideoLoaded] = useState(false);
  const [duration, setDuration] = useState(0);
  const [seekT, setSeekT] = useState(0);
  const [roi, setRoi] = useState(null);
  const [stepSec, setStepSec] = useState(0.3);
  const [rangeStart, setRangeStart] = useState(0);
  const [rangeEnd, setRangeEnd] = useState(0);
  const [analysis, setAnalysis] = useState(null);
  const [threshold, setThreshold] = useState(0);
  const [thresholdRange, setThresholdRange] = useState({ min: 0, max: 50, step: 0.1 });
  const [analyzing, setAnalyzing] = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(0);
  const [extracting, setExtracting] = useState(false);
  const [statusMsg, setStatusMsg] = useState('영상 파일을 선택하세요.');
  const [lightboxSrc, setLightboxSrc] = useState(null);
  const [onsetDetecting, setOnsetDetecting] = useState(false);

  function log(msg) { setStatusMsg(msg); }

  function drawRoiBoxOverlay() {
    const box = roiBoxRef.current, canvas = roiCanvasRef.current;
    if (!box || !canvas) return;
    const r = roiRef.current;
    if (!r) { box.style.display = 'none'; return; }
    const rect = canvas.getBoundingClientRect();
    box.style.left = (r.x0 * rect.width) + 'px';
    box.style.top = (r.y0 * rect.height) + 'px';
    box.style.width = ((r.x1 - r.x0) * rect.width) + 'px';
    box.style.height = ((r.y1 - r.y0) * rect.height) + 'px';
    box.style.display = 'block';
  }
  useEffect(() => { roiRef.current = roi; drawRoiBoxOverlay(); }, [roi]);
  useEffect(() => {
    window.addEventListener('resize', drawRoiBoxOverlay);
    return () => window.removeEventListener('resize', drawRoiBoxOverlay);
  }, []);

  useEffect(() => { rangeStartRef.current = rangeStart; }, [rangeStart]);
  useEffect(() => { rangeEndRef.current = rangeEnd; }, [rangeEnd]);
  useEffect(() => { durationRef.current = duration; }, [duration]);

  function startRangeDrag(e, which) {
    e.preventDefault();
    rangeDragRef.current = which;
  }
  // Subscribed once (refs carry the live values) so dragging never has to re-attach listeners mid-drag.
  // Reuses requestScrub — the SAME scrub path the "영상 상태 확인" slider uses — so previewing a handle's
  // current position while dragging goes through the identical seekTo() call, never a second one.
  useEffect(() => {
    function onMove(e) {
      const which = rangeDragRef.current;
      const dur = durationRef.current;
      if (!which || !rangeTrackRef.current || !dur) return;
      const rect = rangeTrackRef.current.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let t = pct * dur;
      if (which === 'start') {
        t = Math.max(0, Math.min(t, rangeEndRef.current - 0.1));
        setRangeStart(t);
      } else {
        t = Math.min(dur, Math.max(t, rangeStartRef.current + 0.1));
        setRangeEnd(t);
      }
      setSeekT(t);
      requestScrub(t);
    }
    function onUp() { rangeDragRef.current = null; }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
  }, []);

  function drawChart(times, diffs, th) {
    const canvas = chartRef.current;
    if (!canvas || !diffs || diffs.length === 0) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth;
    const h = canvas.height = 120;
    ctx.clearRect(0, 0, w, h);
    // Always scaled to the actual observed max — never to the threshold — so the graph stays honest
    // regardless of where the threshold slider currently sits.
    const maxDiff = Math.max(...diffs, 1) * 1.15;
    ctx.strokeStyle = '#3c3489';
    ctx.beginPath();
    diffs.forEach((d, i) => {
      const x = (i / Math.max(1, diffs.length - 1)) * w;
      const y = h - (d / maxDiff) * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const ty = h - (th / maxDiff) * h;
    ctx.strokeStyle = '#cc3333';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(w, ty); ctx.stroke();
    ctx.setLineDash([]);
  }
  useEffect(() => { if (analysis) drawChart(analysis.times, analysis.diffs, threshold); }, [threshold, analysis]);

  async function showFrameAt(t) {
    const video = videoRef.current;
    await seekTo(video, Math.min(t, Math.max(0, video.duration - 0.05)));
    const canvas = roiCanvasRef.current;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    drawRoiBoxOverlay();
  }

  function requestScrub(t) {
    pendingSeekRef.current = t;
    if (seekBusyRef.current) return;
    seekBusyRef.current = true;
    (async () => {
      while (pendingSeekRef.current != null) {
        const target = pendingSeekRef.current;
        pendingSeekRef.current = null;
        await showFrameAt(target);
      }
      seekBusyRef.current = false;
    })();
  }

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const video = videoRef.current;
    video.src = URL.createObjectURL(file);
    setVideoLoaded(false);
    setRoi(null);
    setAnalysis(null);
    setFrames([]);
    setVideoFile(file);
    setOnsets([]);
    video.onloadedmetadata = async () => {
      setVideoLoaded(true);
      setDuration(video.duration);
      setSeekT(0);
      setRangeStart(0);
      setRangeEnd(video.duration);
      log('영상 로드됨: ' + video.duration.toFixed(2) + '초, ' + video.videoWidth + 'x' + video.videoHeight);
      // Wakes the decoder — without this, a video that's only ever been visually hidden can fail to
      // decode frames on first seek in some browsers (Safari in particular).
      try { await video.play(); video.pause(); } catch (err) { /* autoplay policy — safe to ignore */ }
      await showFrameAt(0);
    };
  }

  function onSeekSliderChange(e) {
    const t = parseFloat(e.target.value);
    setSeekT(t);
    requestScrub(t);
  }

  function canvasPoint(e) {
    const canvas = roiCanvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY, scaleX, scaleY };
  }
  function onRoiMouseDown(e) { dragStartRef.current = canvasPoint(e); }
  function onRoiMouseMove(e) {
    if (!dragStartRef.current) return;
    const cur = canvasPoint(e);
    const box = roiBoxRef.current;
    const x0 = Math.min(dragStartRef.current.x, cur.x) / cur.scaleX;
    const y0 = Math.min(dragStartRef.current.y, cur.y) / cur.scaleY;
    const w = Math.abs(cur.x - dragStartRef.current.x) / cur.scaleX;
    const h = Math.abs(cur.y - dragStartRef.current.y) / cur.scaleY;
    box.style.left = x0 + 'px'; box.style.top = y0 + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.display = 'block';
  }
  useEffect(() => {
    function onUp(e) {
      if (!dragStartRef.current) return;
      const canvas = roiCanvasRef.current;
      const start = dragStartRef.current;
      dragStartRef.current = null;
      const cur = canvasPoint(e);
      const curX = Math.max(0, Math.min(canvas.width, cur.x));
      const curY = Math.max(0, Math.min(canvas.height, cur.y));
      const x0 = Math.min(start.x, curX), x1 = Math.max(start.x, curX);
      const y0 = Math.min(start.y, curY), y1 = Math.max(start.y, curY);
      if (x1 - x0 < 5 || y1 - y0 < 5) return; // too small — treat as an accidental click, not a drag
      setRoi({ x0: x0 / canvas.width, y0: y0 / canvas.height, x1: x1 / canvas.width, y1: y1 / canvas.height });
    }
    window.addEventListener('mouseup', onUp);
    return () => window.removeEventListener('mouseup', onUp);
  }, []);

  async function analyze() {
    if (!videoLoaded) { log('영상을 먼저 선택하세요.'); return; }
    setAnalyzing(true);
    setAnalyzeProgress(0);
    setFrames([]);

    // Onset detection runs independently of (and concurrently with) the page-transition diff loop
    // below — it's a one-time whole-file audio decode + FFT pass, unrelated to the ROI/ threshold/
    // seek work the diff loop does, so there's no reason to block on it or repeat it on every re-run
    // of "분석 시작" for the same file.
    if (videoFile && onsets.length === 0 && !onsetDetecting) {
      setOnsetDetecting(true);
      decodeAudioOnsets(videoFile).then(result => {
        setOnsets(result.onsets);
        setOnsetDetecting(false);
      }).catch(() => setOnsetDetecting(false));
    }

    const video = videoRef.current;
    const step = parseFloat(stepSec) || 0.3;
    // Only the user-selected range is sampled — defaults to the whole video (0..duration) when no
    // range has been narrowed, so intro/outro noise outside the actual TAB content never has a chance
    // to get mistaken for a page transition.
    const rangeS = Math.max(0, Math.min(rangeStart, video.duration));
    const rangeE = Math.max(rangeS, Math.min(rangeEnd || video.duration, video.duration));
    const totalSteps = Math.max(1, Math.ceil((rangeE - rangeS) / step));
    const times = [], diffs = [];
    let prevSample = null;
    try {
      let t = rangeS, idx = 0;
      while (t < rangeE) {
        await seekTo(video, t);
        const sample = getRoiPixelsForDiff(video, roiRef.current);
        // Every sampled timestamp (including the very first, at rangeS) goes into `times` — the
        // first sample used to be dropped here (only used to seed `prevSample`), which silently
        // shifted `times[0]` to rangeS+step instead of rangeS itself. Since extractSegments always
        // starts its first segment at index 0, that made the FIRST segment's start time wrong by a
        // full sampling step (or worse) on every extraction — the source of the reported first-image
        // timeRange bug. diffs[i] now means "the diff between times[i] and times[i+1]" (one shorter
        // than times, as it must be), instead of the old "diff ending at times[i]" convention that
        // this record-the-first-sample fix would otherwise silently break extractSegments' indexing.
        times.push(t);
        if (prevSample) diffs.push(diffScore(prevSample, sample));
        prevSample = sample;
        idx++;
        setAnalyzeProgress(Math.min(100, Math.round((idx / totalSteps) * 100)));
        if (idx % 10 === 0) log('분석 중... ' + t.toFixed(1) + 's / ' + rangeE.toFixed(1) + 's');
        t += step;
      }
      setAnalyzeProgress(100);
      setAnalysis({ times, diffs });
      const maxObserved = Math.max(...diffs, 0.1);
      setThresholdRange({ min: 0, max: maxObserved * 1.3, step: Math.max(0.001, maxObserved / 200) });
      const initialThreshold = maxObserved * 0.5;
      setThreshold(initialThreshold);
      // [DIAG-timeRange] TEMPORARY — for diagnosing the "timeRange start off by several seconds"
      // report. Not a behavior change; safe to remove once the root cause is confirmed. Shows every
      // sampled timestamp/diff pair so a real transition that scored BELOW the auto threshold
      // (maxObserved*0.5) — and therefore got silently absorbed into the previous segment — is
      // visible directly, instead of only seeing the final (possibly wrong) segment boundaries.
      console.log('[DIAG-timeRange] analyze() range', { rangeS, rangeE, step, sampleCount: times.length });
      console.log('[DIAG-timeRange] initialThreshold (maxObserved*0.5) =', initialThreshold, 'maxObserved =', maxObserved);
      console.table(times.slice(0, -1).map((t, i) => ({ i, time: t.toFixed(3), diff: diffs[i], overInitialThreshold: diffs[i] > initialThreshold })));
      log('diff 계산 완료. 관측된 값 범위: 최소 ' + Math.min(...diffs).toFixed(2) + ' ~ 최대 ' + maxObserved.toFixed(2)
        + '. 아래 슬라이더로 임계값을 조절하고 "대표 프레임 다시 뽑기"를 눌러보세요.');
    } catch (err) {
      log('분석 중 오류: ' + err.message);
    } finally {
      setAnalyzing(false);
    }
  }

  function extractSegments(th) {
    const { times, diffs } = analysis;
    const cutIndices = [];
    for (let i = 0; i < diffs.length; i++) if (diffs[i] > th) cutIndices.push(i);
    const segments = [];
    let segStart = 0;
    for (const ci of cutIndices) { if (ci > segStart) segments.push([segStart, ci]); segStart = ci + 1; }
    if (segStart < times.length) segments.push([segStart, times.length - 1]);
    return segments;
  }

  async function reextract() {
    if (!analysis) { log('먼저 "분석 시작"으로 diff를 계산하세요.'); return; }
    setExtracting(true);
    try {
      const { times } = analysis;
      const segments = extractSegments(threshold);
      // [DIAG-timeRange] TEMPORARY — see the matching note in analyze(). Shows exactly which
      // sample-index range each extracted frame's segStartT/segEndT came from, at the threshold
      // actually used for this run.
      console.log('[DIAG-timeRange] extractSegments threshold =', threshold);
      console.table(segments.map(([s, e], i) => ({ frame: i, segStartIdx: s, segEndIdx: e, segStartT: times[s].toFixed(3), segEndT: times[e].toFixed(3) })));
      log('임계값 ' + threshold.toFixed(2) + ' 적용: 안정 구간 ' + segments.length + '개. 대표 프레임(지정 영역, 원본 해상도)을 추출합니다...');
      const video = videoRef.current;
      const newFrames = [];
      for (let s = 0; s < segments.length; s++) {
        const [segStartIdx, segEndIdx] = segments[s];
        const repIdx = Math.max(segStartIdx, segEndIdx - 1);
        const repTime = times[repIdx] != null ? times[repIdx] : times[segStartIdx];
        await seekTo(video, repTime);
        const captured = captureRoiNative(video, roiRef.current);
        newFrames.push({
          id: 'f_' + Date.now() + '_' + s,
          dataUrl: captured.dataUrl, w: captured.w, h: captured.h,
          segStartT: times[segStartIdx], segEndT: times[segEndIdx], repT: repTime,
        });
      }
      setFrames(newFrames);
      log('완료. 임계값 ' + threshold.toFixed(2) + ' 기준, 대표 프레임 ' + newFrames.length + '장 추출됨. 결과가 마음에 안 들면 슬라이더를 조절해서 다시 뽑아보세요.');
    } catch (err) {
      log('추출 중 오류: ' + err.message);
    } finally {
      setExtracting(false);
    }
  }

  return (
    <div>
      <div className="block">
        <div className="block-head"><span>1단계 — 영상에서 TAB 영역 지정 및 대표 프레임 추출</span></div>
        <p className="hint-text">
          영상 파일을 선택하면 첫 프레임이 아래에 표시됩니다. 그 위에서 <b>TAB 숫자/코드가 나오는 영역을 마우스로 드래그해서 지정</b>하세요
          (영상마다 TAB 위치 비율이 다르므로 직접 지정해야 합니다 — 지정하지 않으면 화면 전체를 사용합니다).
          아래 "영상 상태 확인" 슬라이더로 다른 시점도 확인하며 영역을 잡을 수 있습니다.

function SelectStep({ frames, selectedFrameIds, setSelectedFrameIds, onBack, onNext }) {
  function toggle(id) {
    setSelectedFrameIds(prev => {
      const next = new Set(prev);

      return next;
    });
  }
  return (
    <div>
      <div className="block">
        <div className="block-head"><span>2단계 — 악보로 쓸 프레임 선택</span></div>
        <p className="hint-text">실제로 악보에 쓸 프레임만 체크하세요. 필요 없는 프레임(장면 전환 중 어중간한 프레임 등)은 해제하면 됩니다.</p>
        <div className="toolbar">
          <button className="icon-btn" onClick={() => setSelectedFrameIds(new Set(frames.map(f => f.id)))}>전체 선택</button>
          <button className="icon-btn" onClick={() => setSelectedFrameIds(new Set())}>전체 해제</button>
          <span className="save-msg">{selectedFrameIds.size} / {frames.length}장 선택됨</span>
        </div>
        <div className="thumb-grid">
          {frames.map((f, i) => (
            <label key={f.id} className={selectedFrameIds.has(f.id) ? 'thumb-card selectable selected' : 'thumb-card selectable'}>
              <input type="checkbox" checked={selectedFrameIds.has(f.id)} onChange={() => toggle(f.id)} />
              <img src={f.dataUrl} alt={'프레임 ' + (i + 1)} />
              <div className="thumb-meta">#{i + 1} · {f.repT.toFixed(1)}s</div>
            </label>
          ))}
        </div>
      </div>
      <div className="toolbar">
        <button className="icon-btn" onClick={onBack}>← 이전</button>

      </div>
    </div>
  );
}

const FrameCard = React.memo(function FrameCard({ item, index, defaults, onChange }) {
  const canvasRef = useRef(null);
  const imgRef = useRef(null);
  const [advanced, setAdvanced] = useState(!!item.override);
  const eff = effectiveImageSettings(item, defaults);

  useEffect(() => {
    let active = true;
    loadImage(item.src).then(img => {
      if (!active) return;
      imgRef.current = img;
      redraw();
    });
    return () => { active = false; };
  }, [item.src]);

  useEffect(() => { redraw(); });

  function redraw() {
    if (!imgRef.current || !canvasRef.current) return;
    drawProcessed(canvasRef.current, imgRef.current, effectiveImageSettings(item, defaults));
  }

  function updateOverride(patch) {
    const base = item.override || eff;
    onChange({ ...item, override: { ...base, ...patch } });
  }
  function enableAdvanced() {
    setAdvanced(true);
    if (!item.override) onChange({ ...item, override: { ...eff } });
  }
  function clearOverride() {
    setAdvanced(false);
    onChange({ ...item, override: null });
  }

  return (
    <div className="block">
      <div className="block-head"><span>프레임 {index + 1}</span></div>
      <canvas ref={canvasRef} className="preview" />
      <div className="controls">

          </div>
        ) : (
          <React.Fragment>
            <div className="adv-toggle-row">
              <span>이 프레임만의 고급 설정 사용 중</span>
              <button className="icon-btn" onClick={clearOverride}>기본값 따르기로 되돌리기</button>
            </div>
            <label>
              <input type="checkbox" checked={eff.removeBg} onChange={e => updateOverride({ removeBg: e.target.checked })} />

                  <input type="checkbox" checked={eff.invert} onChange={e => updateOverride({ invert: e.target.checked })} />

                <div>

                  <input type="range" min="0" max="255" step="1" value={eff.threshold}
                    onChange={e => updateOverride({ threshold: Number(e.target.value) })} />

                  <div className="slider-label">부드러운 경계 — 안티앨리어싱 유지 ({eff.softness})</div>
                  <input type="range" min="0" max="60" step="1" value={eff.softness}
                    onChange={e => updateOverride({ softness: Number(e.target.value) })} />
                </div>
                <label>
                  <input type="checkbox" checked={eff.despeckle} onChange={e => updateOverride({ despeckle: e.target.checked })} />
                  잡티(고립 노이즈) 제거

// ---- "N장씩 합치기" (batch merge) — copied verbatim from tab-score-builder.html so the two pages'
// merge behavior/output stay byte-for-byte identical. Only the exclude-range sub-feature (not part
// of this page's spec) was left out; group-size, inter-piece gap and the front-2-images preview are
// all reused as-is. See tab-score-builder.html for the extensive design-rationale comments.
const STAFF_LINE_LUM_THRESHOLD = 235;
const STAFF_WOBBLE_BAND_PX = 4;
const STAFF_GAP_TOLERANCE_PX = 20;
const STAFF_MIN_SPAN_FRACTION = 0.3;
const STAFF_MIN_SPAN_FLOOR_PX = 90;
const STAFF_MAX_GROUP_THICKNESS = STAFF_WOBBLE_BAND_PX * 2 + 6;
const STAFF_GAP_Y_TOLERANCE = 0.25;
const STAFF_MIN_X_OVERLAP_FRACTION = 0.6;

function detectStaffBand(imageData, w, h) {
  const d = imageData.data;
  const isDark = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      isDark[y * w + x] = lum < STAFF_LINE_LUM_THRESHOLD ? 1 : 0;
    }
  }
  const minSpan = Math.max(STAFF_MIN_SPAN_FLOOR_PX, w * STAFF_MIN_SPAN_FRACTION);
  const rowLeft = new Int32Array(h).fill(-1);
  const rowRight = new Int32Array(h).fill(-1);
  const rowLen = new Int32Array(h);
  const bandOr = new Uint8Array(w);
  for (let y = 0; y < h; y++) {
    const lo = Math.max(0, y - STAFF_WOBBLE_BAND_PX), hi = Math.min(h - 1, y + STAFF_WOBBLE_BAND_PX);
    bandOr.fill(0);
    for (let yy = lo; yy <= hi; yy++) {
      const rowOff = yy * w;
      for (let x = 0; x < w; x++) if (isDark[rowOff + x]) bandOr[x] = 1;
    }
    let bestStart = -1, bestEnd = -1, bestLen = 0;
    let x = 0;
    while (x < w) {
      if (!bandOr[x]) { x++; continue; }
      const start = x;
      let gap = 0, xe = x;
      while (xe < w) {
        if (bandOr[xe]) { gap = 0; xe++; }
        else { gap++; if (gap > STAFF_GAP_TOLERANCE_PX) break; xe++; }
      }
      let end = xe;
      while (end > start && !bandOr[end - 1]) end--;
      if (end - start > bestLen) { bestLen = end - start; bestStart = start; bestEnd = end; }
      x = xe;
    }
    if (bestLen >= minSpan) { rowLeft[y] = bestStart; rowRight[y] = bestEnd; rowLen[y] = bestLen; }
  }
  const groups = [];
  let y = 0;
  while (y < h) {
    if (rowLen[y] === 0) { y++; continue; }
    const start = y;
    while (y < h && rowLen[y] > 0) y++;
    const end = y;
    if (end - start > STAFF_MAX_GROUP_THICKNESS) continue;
    let peakY = start;
    for (let yy = start + 1; yy < end; yy++) if (rowLen[yy] > rowLen[peakY]) peakY = yy;
    groups.push({ y: (start + end - 1) / 2, left: rowLeft[peakY], right: rowRight[peakY] });
  }
  if (groups.length < 6) return null;
  let best = null;
  for (let i = 0; i < groups.length; i++) {
    for (let j = i + 1; j < groups.length; j++) {
      const gap = groups[j].y - groups[i].y;
      if (gap <= 0) continue;
      const chain = [groups[i]];
      let ok = true;
      for (let k = 1; k < 6; k++) {
        const target = groups[i].y + gap * k;
        let closest = null, closestDiff = Infinity;
        for (const g of groups) {
          const diff = Math.abs(g.y - target);
          if (diff < closestDiff) { closestDiff = diff; closest = g; }
        }
        if (closest === null || closestDiff > gap * STAFF_GAP_Y_TOLERANCE) { ok = false; break; }
        chain.push(closest);
      }
      if (!ok || chain.length !== 6) continue;
      const lefts = chain.map(c => c.left), rights = chain.map(c => c.right);
      const overlapLeft = Math.max(...lefts), overlapRight = Math.min(...rights);
      const avgSpan = chain.reduce((s, c) => s + (c.right - c.left), 0) / 6;
      if (avgSpan <= 0 || (overlapRight - overlapLeft) < avgSpan * STAFF_MIN_X_OVERLAP_FRACTION) continue;
      const gaps = [];
      for (let k = 1; k < 6; k++) gaps.push(chain[k].y - chain[k - 1].y);
      const meanGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      const variance = gaps.reduce((a, b) => a + (b - meanGap) * (b - meanGap), 0) / gaps.length;
      const confidence = 1 / (1 + variance);
      if (!best || confidence > best.confidence) {
        best = {
          staffTop: chain[0].y, staffBottom: chain[5].y,
          staffLeft: overlapLeft, staffRight: overlapRight,
          lineYs: chain.map(c => c.y), confidence,
        };
      }
    }
  }
  return best;
}

function resolvedSrc(item) {
  return (item.barLayout && item.barLayout.appliedSrc) || item.src;
}

const MERGED_ROW_NEUTRAL_OVERRIDE = {
  removeBg: false, invert: false, threshold: 140, softness: 0,
  despeckle: false, despeckleSize: 0,
  playheadRemove: false, playheadColor: null,
  cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
};
const MERGE_GAP_MIN_PCT = -10;
const MERGE_GAP_MAX_PCT = 5;

function computeMergeSeamPositions(pieces, gapPct) {
  const xs = [];
  let x = 0;
  for (let i = 0; i < pieces.length; i++) {
    if (i > 0) {
      const prev = pieces[i - 1], cur = pieces[i];
      const refW = (prev.contentRight + cur.contentRight) / 2;
      x = (xs[i - 1] + prev.contentRight) + Math.round((gapPct / 100) * refW);
    }
    xs.push(x);
    x += pieces[i].w;
  }
  return { xs, totalW: x };
}

async function mergeImagesIntoRow(sourceItems, defaults, gapPct) {
  gapPct = gapPct || 0;
  const processed = [];
  for (const it of sourceItems) {
    const img = await loadImage(resolvedSrc(it));
    const canvas = document.createElement('canvas');
    drawProcessed(canvas, img, effectiveImageSettings(it, defaults));
    const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    const staff = detectStaffBand(imageData, canvas.width, canvas.height);
    processed.push({ item: it, canvas, staff });
  }

  const ref = processed.find(p => p.staff);
  const refSpacing = ref ? (ref.staff.staffBottom - ref.staff.staffTop) / 5 : null;

  const scaled = processed.map(p => {
    let scale = 1;
    if (refSpacing && p.staff) {
      const spacing = (p.staff.staffBottom - p.staff.staffTop) / 5;
      if (spacing > 0) scale = refSpacing / spacing;
    }
    const w = Math.max(1, Math.round(p.canvas.width * scale));
    const h = Math.max(1, Math.round(p.canvas.height * scale));
    const staffTopScaled = p.staff ? p.staff.staffTop * scale : null;
    const staffLeftNative = p.staff ? p.staff.staffLeft : null;
    const contentLeft = p.staff ? p.staff.staffLeft * scale : null;
    const contentRight = p.staff ? p.staff.staffRight * scale : null;
    return { item: p.item, canvas: p.canvas, w, h, staffTopScaled, staffLeftNative, contentLeft, contentRight };
  });

  const knownTops = scaled.map(s => s.staffTopScaled).filter(v => v != null);
  const refTop = knownTops.length ? Math.max(...knownTops) : 0;
  const withOffsets = scaled.map(s => ({
    ...s, offsetY: s.staffTopScaled != null ? Math.round(refTop - s.staffTopScaled) : 0,
  }));

  const trimmed = withOffsets.map((s, i) => {
    const trimNative = (i > 0 && s.staffLeftNative != null) ? s.staffLeftNative : 0;
    const trimScaled = (i > 0 && s.contentLeft != null) ? s.contentLeft : 0;
    const w = s.w - trimScaled;
    const contentRight = s.contentRight != null ? (s.contentRight - trimScaled) : w;
    return { ...s, fullW: s.w, w, contentRight, trimNative, trimScaled };
  });

  const { xs, totalW: seamTotalW } = computeMergeSeamPositions(trimmed, gapPct);
  const totalW = Math.max(1, seamTotalW);
  const totalH = Math.max(...trimmed.map(s => s.offsetY + s.h));

  const out = document.createElement('canvas');
  out.width = totalW;
  out.height = Math.max(1, totalH);
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);

  const mergedTags = [];
  trimmed.forEach((s, i) => {
    const x = xs[i];
    const srcW = s.canvas.width - s.trimNative;
    ctx.drawImage(s.canvas, s.trimNative, 0, srcW, s.canvas.height, x, s.offsetY, s.w, s.h);
    const conceptualFullX = x - s.trimScaled;
    const tags = (s.item.lyrics && s.item.lyrics.tags) || [];
    for (const t of tags) {
      const localXPx = (t.xPct / 100) * s.fullW;
      const globalXPct = ((conceptualFullX + localXPx) / totalW) * 100;
      mergedTags.push({ ...t, id: Date.now() + '_' + Math.random().toString(36).slice(2), xPct: globalXPct });
    }
  });

  const areaHeightRatios = sourceItems
    .map(it => (it.lyrics && it.lyrics.areaHeightRatio) || 0)
    .filter(v => v > 0);
  const areaHeightRatio = areaHeightRatios.length ? Math.max(...areaHeightRatios) : null;

  // Union of every source piece's own video time range — a merged block covers everything its
  // pieces covered, from the earliest start to the latest end. Only computed when EVERY source item
  // carries a timeRange (always true for items coming out of this page's own extraction flow).
  const ranges = sourceItems.map(it => it.timeRange).filter(Boolean);
  const timeRange = ranges.length === sourceItems.length
    ? { start: Math.min(...ranges.map(r => r.start)), end: Math.max(...ranges.map(r => r.end)) }
    : null;
  // [DIAG-timeRange] TEMPORARY — see the matching note in analyze(). Shows each source piece's OWN
  // timeRange going into this merge, and the min/max union actually produced, so a wrong per-piece
  // value (from the extraction stage) can be told apart from a wrong union calculation here.
  console.log('[DIAG-timeRange] mergeImagesIntoRow sourceItems', ranges.map(r => ({ start: r.start, end: r.end })));
  console.log('[DIAG-timeRange] mergeImagesIntoRow union result', timeRange);
  const videoSourceId = sourceItems.length && sourceItems.every(it => it.videoSourceId === sourceItems[0].videoSourceId)
    ? sourceItems[0].videoSourceId
    : null;

  // 0-based indices (within sourceItems) whose staff detection failed — these pieces got NEITHER
  // the scale correction NOR the content-boundary trim/overlap (both derive from the same
  // detectStaffBand result), and silently fell back to plain edge-to-edge concatenation at their
  // own native scale. Returned so the caller can tell the user exactly which pieces this happened
  // to, instead of a single generic flag that only implies the scale side of it.
  const missingStaffIndices = processed.map((p, i) => (p.staff ? null : i)).filter(i => i !== null);

  return {
    canvas: out,
    lyrics: { tags: mergedTags, areaHeightRatio },
    anyStaffMissing: missingStaffIndices.length > 0,
    missingStaffIndices,
    timeRange, videoSourceId,
  };
}

function padCanvasRightTo(canvas, targetWidth) {
  if (canvas.width >= targetWidth) return canvas;
  const out = document.createElement('canvas');
  out.width = targetWidth; out.height = canvas.height;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(canvas, 0, 0);
  return out;
}

function chunkForBatchMerge(list, n) {
  const groups = [];
  for (let i = 0; i < list.length; i += n) groups.push(list.slice(i, i + n));
  return groups;
}

function PreprocessStep({ items, setItems, defaults, setDefaults, videoFile, onsets, videoSourceId, onBack }) {
  const [sending, setSending] = useState(false);
  // 'settings' (전처리 조정) → 'choose' (그대로 넘기기 vs N장씩 합치기) → 'merge' (합치기 설정, choose에서 진입).
  // Defaults collapsed for this page's global-settings panel specifically — scoped to the video
  // extraction path only, tab-score-builder.html's own native flow keeps its panel expanded as before.
  const [phase, setPhase] = useState('settings');
  const [settingsOpen, setSettingsOpen] = useState(false);
  const [mergeGroupSize, setMergeGroupSize] = useState(2);
  const [mergeGapPct, setMergeGapPct] = useState(0);
  const [merging, setMerging] = useState(false);
  const [mergePreviewSrc, setMergePreviewSrc] = useState(null);
  const [mergePreviewBusy, setMergePreviewBusy] = useState(false);
  function update(patch) { setDefaults(prev => ({ ...prev, ...patch })); }
  function updateItem(id, next) { setItems(prev => prev.map(it => it.id === id ? next : it)); }

  // Live preview of the first 2 images that would be grouped, so the gap/overlap setting can be
  // sanity-checked before running the (irreversible) batch merge — reused from tab-score-builder.html.
  useEffect(() => {
    let cancelled = false;
    if (phase !== 'merge' || items.length < 2) { setMergePreviewSrc(null); return; }
    setMergePreviewBusy(true);
    const timer = setTimeout(async () => {
      try {
        const result = await mergeImagesIntoRow(items.slice(0, 2), defaults, mergeGapPct);
        if (cancelled) return;
        setMergePreviewSrc(result.canvas.toDataURL('image/png'));
      } finally {
        if (!cancelled) setMergePreviewBusy(false);
      }
    }, 350);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [phase, items, mergeGapPct, defaults]);

  async function handleBatchMerge() {
    const n = Math.max(2, Math.floor(mergeGroupSize) || 2);
    const groups = chunkForBatchMerge(items, n);
    const lastGroup = groups[groups.length - 1];
    const lastIsPartial = lastGroup.length < n;

    setMerging(true);
    try {
      const mergedResults = [];
      for (const group of groups) {
        const result = await mergeImagesIntoRow(group, defaults, mergeGapPct);
        mergedResults.push(result);
      }

      if (lastIsPartial) {
        const fullWidths = groups
          .map((g, i) => (g.length === n ? mergedResults[i].canvas.width : null))
          .filter(w => w != null);
        if (fullWidths.length > 0) {
          const avgFullWidth = Math.round(fullWidths.reduce((a, b) => a + b, 0) / fullWidths.length);
          const lastCanvas = mergedResults[mergedResults.length - 1].canvas;
          mergedResults[mergedResults.length - 1] = {
            ...mergedResults[mergedResults.length - 1],
            canvas: padCanvasRightTo(lastCanvas, avgFullWidth),
          };
        }
      }

      const newBlocks = mergedResults.map((result, i) => ({
        id: Date.now() + '_' + Math.random().toString(36).slice(2) + '_' + i,
        type: 'image', src: result.canvas.toDataURL('image/png'),
        invert: false, override: { ...MERGED_ROW_NEUTRAL_OVERRIDE },
        lyrics: result.lyrics,
        playheadExcluded: [], barLayout: null, stitchMeta: null,
        timeRange: result.timeRange, videoSourceId: result.videoSourceId,
      }));

      const staffMissingGroupNumbers = mergedResults
        .map((result, i) => (result.anyStaffMissing ? i + 1 : null))
        .filter(n => n !== null);
      if (staffMissingGroupNumbers.length > 0) {
        alert(
          staffMissingGroupNumbers.join(', ') + '번째 그룹은 일부 이미지의 보표선을 인식하지 못해, '
          + '크기 보정과 겹침(콘텐츠 경계 기준 자르기) 보정을 모두 건너뛰고 원본 폭 그대로 합쳐졌습니다 — TAB 악보 만들기 화면에서 결과를 확인해주세요.'
        );
      }

      await handleSend(newBlocks);
    } catch (err) {
      console.error(err);
      alert('합치기 중 오류가 발생했습니다.');
      setMerging(false);
    }
  }

  async function handleSend(itemsOverride) {
    const sourceList = itemsOverride || items;
    setSending(true);
    try {
      // Bake each item's RESOLVED settings (global default or override, whichever applies) into a
      // concrete override — so what was previewed here is exactly what appears after handoff,
      // regardless of whatever tab-score-builder.html's OWN global defaults happen to be set to.
      // Merged blocks (itemsOverride) already carry their own neutral override + resolved fields, so
      // this only re-bakes for the "그대로 넘기기" (per-frame, unmerged) path.
      const finalItems = sourceList.map(it => {
        const eff = itemsOverride ? it.override : effectiveImageSettings(it, defaults);
        return {
          id: it.id, type: 'image', src: it.src,
          invert: itemsOverride ? it.invert : eff.invert, override: itemsOverride ? it.override : { ...eff },
          lyrics: it.lyrics || { tags: [], areaHeightRatio: null },
          playheadExcluded: [], barLayout: null, stitchMeta: null,
          timeRange: it.timeRange || null,
          videoSourceId: it.videoSourceId || null,
        };
      });
      // Persist the original video + detected onsets ONCE per video, shared by every item
      // extracted from it (keyed by videoSourceId), so lyric-placement playback can reach it later.
      if (videoSourceId && videoFile) {
        await dbPut(VIDEO_SOURCE_KEY_PREFIX + videoSourceId, {
          videoBlob: videoFile,
          onsets,
          savedAt: Date.now(),
        });
      }
      await dbPut(VIDEO_IMPORT_KEY, { items: finalItems, importedAt: Date.now() });
      window.location.href = 'tab-score-builder.html';
    } catch (err) {
      alert('전달 중 오류가 발생했습니다: ' + err.message);
      setSending(false);
    }
  }

  return (
    <div>
      {phase === 'settings' && (
        <React.Fragment>
          <div className="block">
            <div className="block-head">
              <span>3단계 — 전처리 (배경 제거 · 부드러운 경계 · 잡티 제거)</span>
              <button className="icon-btn" onClick={() => setSettingsOpen(o => !o)}>{settingsOpen ? '접기' : '펼치기'}</button>
            </div>
            {settingsOpen && (
              <React.Fragment>
                <p className="hint-text">tab-score-builder.html과 동일한 방식입니다 — 아래 기본값이 모든 프레임에 실시간 적용되고, 특정 프레임만 다르게 하려면 그 프레임의 "고급 설정 사용"을 누르세요.</p>
                <div className="controls">
                  <label>
                    <input type="checkbox" checked={defaults.removeBg} onChange={e => update({ removeBg: e.target.checked })} />
                    배경 제거 기본 사용
                  </label>
                  <div>
                    <div className="slider-label">어두운 배경 처리</div>
                    <select value={defaults.invertMode} onChange={e => update({ invertMode: e.target.value })}>
                      <option value="auto">자동 감지</option>
                      <option value="on">항상 반전 (어두운 사진 배경)</option>
                      <option value="off">항상 일반 (밝은/흰 배경)</option>
                    </select>
                  </div>
                  <div>
                    <div className="slider-label">배경 제거 강도 ({defaults.threshold})</div>
                    <input type="range" min="0" max="255" step="1" value={defaults.threshold}
                      onChange={e => update({ threshold: Number(e.target.value) })} />
                  </div>
                  <div>
                    <div className="slider-label">부드러운 경계 — 안티앨리어싱 유지 ({defaults.softness})</div>
                    <input type="range" min="0" max="60" step="1" value={defaults.softness}
                      onChange={e => update({ softness: Number(e.target.value) })} />
                  </div>
                  <label>
                    <input type="checkbox" checked={defaults.despeckle} onChange={e => update({ despeckle: e.target.checked })} />
                    잡티(고립 노이즈) 제거
                  </label>
                  {defaults.despeckle && (
                    <div>
                      <div className="slider-label">제거할 잡티 크기 ({defaults.despeckleSize}px 이하)</div>
                      <input type="range" min="1" max="12" step="1" value={defaults.despeckleSize}
                        onChange={e => update({ despeckleSize: Number(e.target.value) })} />
                    </div>
                  )}
                </div>
              </React.Fragment>
            )}
          </div>

          <div className="list">
            {items.map((it, i) => (
              <FrameCard key={it.id} item={it} index={i} defaults={defaults} onChange={next => updateItem(it.id, next)} />
            ))}
          </div>

          <div className="toolbar">
            <button className="icon-btn" onClick={onBack} disabled={sending}>← 이전</button>
            <button onClick={() => setPhase('choose')} disabled={items.length === 0}>다음 →</button>
          </div>
        </React.Fragment>
      )}

      {phase === 'choose' && (
        <div className="block">
          <div className="block-head"><span>다음 단계 선택 — {items.length}장</span></div>
          <p className="hint-text">각 프레임을 TAB 이미지 1장씩 그대로 전달하거나, 여러 장을 한 줄로 묶어 전달할 수 있습니다. 마디선 자동 인식/재배열은 이번 단계에서 지원하지 않습니다.</p>
          <div className="toolbar">
            <button className="icon-btn" onClick={() => setPhase('settings')} disabled={sending}>← 이전</button>
            <button onClick={() => handleSend()} disabled={sending}>
              {sending ? '전달 중...' : '그대로 TAB으로 넘기기 (' + items.length + '장) →'}
            </button>
            <button className="icon-btn" onClick={() => setPhase('merge')} disabled={sending || items.length < 2}>
              N장씩 합치기
            </button>
          </div>
        </div>
      )}

      {phase === 'merge' && (
        <div className="block">
          <div className="block-head"><span>N장씩 합치기</span></div>
          <div className="controls">
            <div>
              <span className="slider-label" style={{ margin: 0 }}>
                <input type="number" min="2" max={Math.max(2, items.length)} step="1" value={mergeGroupSize}
                  onChange={e => setMergeGroupSize(e.target.value)} style={{ width: '4em' }} />
                장씩 순서대로 합치기 ({items.length}장 → {Math.ceil(items.length / Math.max(2, Math.floor(mergeGroupSize) || 2))}개 그룹)
              </span>
            </div>
            <div>
              <div className="slider-label">조각 사이 간격 ({mergeGapPct}%, 각 조각 폭 기준 — 음수면 겹쳐서 이어붙임)</div>
              <input type="range" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                onChange={e => setMergeGapPct(Number(e.target.value))} />
              <input type="number" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                onChange={e => setMergeGapPct(Number(e.target.value))} style={{ width: '4em' }} />
            </div>
          </div>
          {(mergePreviewSrc || mergePreviewBusy) && (
            <div className="controls">
              <span className="slider-label">앞부분 미리보기{mergePreviewBusy ? ' (갱신 중...)' : ''} — 겹치는 부분에 마디 내용이 가려지지 않는지 확인하세요</span>
              {mergePreviewSrc && <img src={mergePreviewSrc} alt="합치기 미리보기" className="merge-preview-img" />}
            </div>
          )}
          <div className="toolbar">
            <button className="icon-btn" onClick={() => setPhase('choose')} disabled={merging || sending}>← 이전</button>
            <button onClick={handleBatchMerge} disabled={merging || sending}>
              {(merging || sending) ? '합치는 중...' : '합치기 진행 →'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

// ================================================================================================
// ==== SCROLL MODE (새 모드) — scroll-stitch-test.html에서 검증된 알고리즘을 그대로 이식.
// 겹침 탐색(NCC)/마디선 기하 검출은 프로토타입 그대로이고, "N마디씩 그룹핑"만 이번 스펙대로
// (고정 마디수가 아니라 목표 픽셀폭 기반으로) 새로 작성했다. 전처리는 이 파일 상단의 기존
// applyThreshold/despeckleBinary/detectPlayheadRuns/removePlayheadRuns를 그대로 재사용한다
// (재구현 없음) — scrollApplyPreprocInPlace는 그 원시 함수들을 drawProcessed와 동일한 순서로
// "제자리에서"(크롭 없이) 적용하는 아주 얇은 래퍼일 뿐이다.
// 페이지 전환형(CaptureStep/SelectStep/PreprocessStep, drawProcessed, effectiveImageSettings 등)은
// 이 섹션에서 전혀 건드리지 않는다 — 이름 충돌이 있는 것만(detectStaffBand) 접두사를 바꿨다.
// ================================================================================================

const SCROLL_PLAYHEAD_HUE_DEFAULT = 210;
const SCROLL_PLAYHEAD_HUE_TOLERANCE_DEFAULT = 35;
const SCROLL_PLAYHEAD_SAT_MIN_DEFAULT = 0.35;

const SCROLL_DEFAULTS_INIT = {
  removeBg: true, invertMode: 'auto', threshold: 110, softness: 12,
  despeckle: true, despeckleSize: 3,
  playheadRemove: false, playheadColor: null, // null = SCROLL_PLAYHEAD_* 기본값 사용
};

// drawProcessed와 동일한 순서(재생 커서 제거 → 배경 threshold[+자동 반전 판단] → 잡티 제거)로,
// 이미 원본 해상도로 캡처된 canvas에 "크롭 없이 제자리에서" 적용한다 — 대표 프레임은 스티칭 전에
// 반드시 이 순서(원본 해상도에서 전처리 먼저, 축소는 나중)를 지켜야 스페클 노이즈가 생기지 않는다.
function scrollApplyPreprocInPlace(canvas, opts) {
  if (!opts.removeBg && !opts.playheadRemove) return;
  const ctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  if (opts.playheadRemove) {
    const imageData = ctx.getImageData(0, 0, w, h);
    const band = opts.playheadColor || {
      hue: SCROLL_PLAYHEAD_HUE_DEFAULT, hueTolerance: SCROLL_PLAYHEAD_HUE_TOLERANCE_DEFAULT, satMin: SCROLL_PLAYHEAD_SAT_MIN_DEFAULT,
    };
    const runs = detectPlayheadRuns(imageData, w, h, band);
    removePlayheadRuns(imageData, w, h, runs, [], { r: 255, g: 255, b: 255 });
    ctx.putImageData(imageData, 0, 0);
  }
  if (opts.removeBg) {
    const avg = computeAvgLuminanceFromCanvas(canvas);
    const invert = opts.invertMode === 'auto' ? (avg < 128) : (opts.invertMode === 'on');
    const imageData = ctx.getImageData(0, 0, w, h);
    applyThreshold(imageData, opts.threshold, invert, opts.softness || 0);
    if (opts.despeckle) despeckleBinary(imageData, w, h, opts.despeckleSize || 0);
    ctx.putImageData(imageData, 0, 0);
  }
}

// 표시(미리보기)용으로만 쓰는 고품질 축소 — 브라우저의 drawImage 한 번으로 큰 비율(예: 7~8배)을
// 한꺼번에 축소하면 이진화된 가는 선/도트에서 무아레(지글거림)가 두드러진다. 목표 폭의 2배보다
// 클 동안 절반씩 반복해서 줄이면(각 단계가 대략 박스 필터처럼 작동) 훨씬 매끄럽다. destCanvas에
// 그리는 게 전부이고 원본(srcCanvas)은 건드리지 않으므로, 실제 저장/스티칭에 쓰는 원본 해상도
// 데이터에는 영향이 없다.
function drawDownscaledStaged(srcCanvas, destCanvas, targetW) {
  let cur = srcCanvas;
  while (cur.width > targetW * 2) {
    const half = document.createElement('canvas');
    half.width = Math.max(1, Math.round(cur.width / 2));
    half.height = Math.max(1, Math.round(cur.height / 2));
    half.getContext('2d').drawImage(cur, 0, 0, half.width, half.height);
    cur = half;
  }
  const scale = Math.min(1, targetW / cur.width);
  destCanvas.width = Math.max(1, Math.round(cur.width * scale));
  destCanvas.height = Math.max(1, Math.round(cur.height * scale));
  destCanvas.getContext('2d').drawImage(cur, 0, 0, destCanvas.width, destCanvas.height);
}

// ---- NCC 기반 겹침 탐색 + 이어붙이기 — scroll-stitch-test.html에서 그대로 이식 ----

function scrollGetGray(canvas, maxDim) {
  const w0 = canvas.width, h0 = canvas.height;
  const scale = maxDim ? Math.min(1, maxDim / Math.max(w0, h0)) : 1;
  const w = Math.max(1, Math.round(w0 * scale)), h = Math.max(1, Math.round(h0 * scale));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  c.getContext('2d').drawImage(canvas, 0, 0, w, h);
  const data = c.getContext('2d').getImageData(0, 0, w, h).data;
  const gray = new Float32Array(w * h);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  }
  return { gray, w, h, scale };
}

function scrollNcc(arrA, arrB, n) {
  let meanA = 0, meanB = 0;
  for (let i = 0; i < n; i++) { meanA += arrA[i]; meanB += arrB[i]; }
  meanA /= n; meanB /= n;
  let num = 0, denA = 0, denB = 0;
  for (let i = 0; i < n; i++) {
    const da = arrA[i] - meanA, db = arrB[i] - meanB;
    num += da * db; denA += da * da; denB += db * db;
  }
  if (denA < 1e-6 || denB < 1e-6) return -1;
  return num / Math.sqrt(denA * denB);
}

function scrollScoreShift(gA, gB, direction, s, W, H) {
  const bufA = [], bufB = [];
  if (direction === 'vertical') {
    const overlapH = H - s;
    if (overlapH < 4) return null;
    for (let y = 0; y < overlapH; y++) {
      const yA = y + s, yB = y;
      for (let x = 0; x < W; x++) {
        bufA.push(gA.gray[yA * gA.w + x]);
        bufB.push(gB.gray[yB * gB.w + x]);
      }
    }
  } else {
    const overlapW = W - s;
    if (overlapW < 4) return null;
    for (let x = 0; x < overlapW; x++) {
      const xA = x + s, xB = x;
      for (let y = 0; y < H; y++) {
        bufA.push(gA.gray[y * gA.w + xA]);
        bufB.push(gB.gray[y * gB.w + xB]);
      }
    }
  }
  return scrollNcc(bufA, bufB, bufA.length);
}

// 최소-겹침 편향 버그 방지: 최고 NCC 대비 tolerance(0.03) 이내인 shift들 중 "가장 작은 shift"
// (=가장 많이 겹치는 지점)를 채택 — 단순 최대NCC 채택 금지 (탐색범위 s는 오름차순이므로 첫 번째
// 통과 항목이 곧 가장 작은 shift다).
function scrollFindBestShift(canvasA, canvasB, direction) {
  const SEARCH_MAXDIM = 220;
  const gA = scrollGetGray(canvasA, SEARCH_MAXDIM);
  const gB = scrollGetGray(canvasB, SEARCH_MAXDIM);
  const W = Math.min(gA.w, gB.w), H = Math.min(gA.h, gB.h);

  const totalLen = direction === 'vertical' ? H : W;
  const minLen = Math.max(2, Math.round(totalLen * 0.15));
  const maxLen = Math.round(totalLen * 0.85);

  const scores = [];
  for (let s = minLen; s <= maxLen; s++) {
    const sc = scrollScoreShift(gA, gB, direction, s, W, H);
    if (sc !== null) scores.push({ s, ncc: sc });
  }
  if (scores.length === 0) return { shift: 0, score: -1, ok: false };

  let bestNcc = -Infinity;
  for (const it of scores) if (it.ncc > bestNcc) bestNcc = it.ncc;

  const TOLERANCE = 0.03;
  let chosen = scores[0];
  for (const it of scores) {
    if (it.ncc >= bestNcc - TOLERANCE) { chosen = it; break; }
  }

  const shiftFull = Math.round(chosen.s / gA.scale);
  return { shift: shiftFull, score: chosen.ncc, ok: chosen.ncc > 0.5 };
}

function scrollFindBestShiftAuto(canvasA, canvasB) {
  const v = scrollFindBestShift(canvasA, canvasB, 'vertical');
  const h = scrollFindBestShift(canvasA, canvasB, 'horizontal');
  if (h.score > v.score) return { direction: 'horizontal', ...h };
  return { direction: 'vertical', ...v };
}

// 중복 프레임 스킵: shift=0 상태(오프셋 탐색 없이 전체 프레임)에서 NCC ≥ 0.9면 "실제 스크롤
// 없었음"으로 보고 해당 쌍을 스티칭에서 완전히 제외한다.
const SCROLL_DUP_SIMILARITY_THRESHOLD = 0.9;
function scrollIsDuplicateFrame(canvasA, canvasB) {
  const SEARCH_MAXDIM = 220;
  const gA = scrollGetGray(canvasA, SEARCH_MAXDIM);
  const gB = scrollGetGray(canvasB, SEARCH_MAXDIM);
  const W = Math.min(gA.w, gB.w), H = Math.min(gA.h, gB.h);
  const bufA = [], bufB = [];
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      bufA.push(gA.gray[y * gA.w + x]);
      bufB.push(gB.gray[y * gB.w + x]);
    }
  }
  const sim = scrollNcc(bufA, bufB, bufA.length);
  return { isDup: sim >= SCROLL_DUP_SIMILARITY_THRESHOLD, sim };
}

// ---- 마디선(bar-line) 기하 검출 — scroll-stitch-test.html에서 그대로 이식 (OCR/ML 없음) ----
// detectStaffBand라는 이름은 이 파일의 기존 배치-합치기(mergeImagesIntoRow) 기능에 이미 쓰이고
//있어(다른 알고리즘) detectStaffYBand로만 이름을 바꿨다 — 로직 자체는 프로토타입과 동일하다.

function scrollGetFullGrayData(canvas) {
  const ctx = canvas.getContext('2d');
  const { width: W, height: H } = canvas;
  const data = ctx.getImageData(0, 0, W, H).data;
  const gray = new Float32Array(W * H);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    gray[p] = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
  }
  return { gray, w: W, h: H };
}

function detectStaffYBand(g, darkThresh, staffLineFrac) {
  const rowDark = new Float32Array(g.h);
  for (let y = 0; y < g.h; y++) {
    let cnt = 0;
    const base = y * g.w;
    for (let x = 0; x < g.w; x++) {
      if (g.gray[base + x] < darkThresh) cnt++;
    }
    rowDark[y] = cnt / g.w;
  }
  const candidates = [];
  for (let y = 0; y < g.h; y++) if (rowDark[y] >= staffLineFrac) candidates.push(y);
  const lines = [];
  let cluster = [];
  for (let i = 0; i < candidates.length; i++) {
    if (cluster.length === 0 || candidates[i] - cluster[cluster.length - 1] <= 2) {
      cluster.push(candidates[i]);
    } else {
      lines.push(Math.round(cluster.reduce((a, b) => a + b, 0) / cluster.length));
      cluster = [candidates[i]];
    }
  }
  if (cluster.length) lines.push(Math.round(cluster.reduce((a, b) => a + b, 0) / cluster.length));
  return lines;
}

function detectBarLines(g, top, bottom, darkThresh, barFrac) {
  const pad = Math.max(1, Math.round((bottom - top) * 0.03));
  const y0 = Math.max(0, top - pad), y1 = Math.min(g.h - 1, bottom + pad);
  const span = y1 - y0 + 1;
  const colFrac = new Float32Array(g.w);
  for (let x = 0; x < g.w; x++) {
    let cnt = 0;
    for (let y = y0; y <= y1; y++) {
      if (g.gray[y * g.w + x] < darkThresh) cnt++;
    }
    colFrac[x] = cnt / span;
  }
  const candidates = [];
  for (let x = 0; x < g.w; x++) if (colFrac[x] >= barFrac) candidates.push(x);

  const merged = [];
  let cluster = [];
  for (let i = 0; i < candidates.length; i++) {
    if (cluster.length === 0 || candidates[i] - cluster[cluster.length - 1] <= 3) {
      cluster.push(candidates[i]);
    } else {
      merged.push(Math.round(cluster.reduce((a, b) => a + b, 0) / cluster.length));
      cluster = [candidates[i]];
    }
  }
  if (cluster.length) merged.push(Math.round(cluster.reduce((a, b) => a + b, 0) / cluster.length));

  if (merged.length >= 3) {
    const gaps = [];
    for (let i = 1; i < merged.length; i++) gaps.push(merged[i] - merged[i - 1]);
    const sortedGaps = [...gaps].sort((a, b) => a - b);
    const medianGap = sortedGaps[Math.floor(sortedGaps.length / 2)] || 1;
    const minGap = medianGap * 0.3;
    const filtered = [merged[0]];
    for (let i = 1; i < merged.length; i++) {
      if (merged[i] - filtered[filtered.length - 1] < minGap) continue;
      filtered.push(merged[i]);
    }
    return filtered;
  }
  return merged;
}

// staffThresh/barThresh를 결과 화면 슬라이더로 실시간 조정할 수 있어야 해서(재클릭 없이 즉시
// 재검출), 마디선 검출을 한 번만 도는 runScrollStage3에서 분리해 이 함수로 뽑아뒀다 — 항상 이
// 함수 하나만 거치므로 "이름을 바꾸는 과정에서 실제 호출부 연결이 끊기는" 종류의 문제가 다시
// 생길 여지가 없다(호출부가 하나뿐). 입력은 반드시 seam 표시선 등 오버레이가 없는 깨끗한
// stitched canvas여야 한다 — runScrollStage3의 out은 애초에 그런 오버레이를 그리지 않는 clean
// canvas라서 (프로토타입과 달리 별도 cleanOut이 필요 없음) 그대로 넘기면 된다.
function detectStaffAndBars(canvas, staffThresh, barThresh) {
  const g = scrollGetFullGrayData(canvas);
  const darkThresh = 140;
  const staffLines = detectStaffYBand(g, darkThresh, staffThresh);
  let bars = [];
  if (staffLines.length >= 2) {
