  const [edits, setEdits] = useState({ excluded: {}, mode: {} });
  const [sceneList, setSceneList] = useState(null); // [{id, t0, t1, thumb, join, auto, excluded}]
  const [paused, setPaused] = useState(false);
  const diagRef = useRef(null);
  const [seekT, setSeekT] = useState(0);
  const seekTRef = useRef(0), seekPendingRef = useRef(false), runningRef = useRef(false);
  useEffect(() => { runningRef.current = running; }, [running]);
  // 영상 넘겨보기: 슬라이더를 빠르게 움직여도 마지막 위치만 seek (ROI 선택 화면은 'seeked' 때마다 다시 그려진다)
  function userSeek(t) {
    t = Math.max(0, Math.min(duration || t, t));

    seekPendingRef.current = true;

      let done;
      do {
        done = seekTRef.current;
        const v = videoRef.current;
        if (v && v.videoWidth && !runningRef.current) await seekSafe(v, done);
      } while (done !== seekTRef.current);

  }

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];

    setVideoLoaded(false); setRoi(null); setResult(null); setInfo(null); setHist({ past: [], future: [] });
    setVideoFile(file);

      setVideoLoaded(true);

      if (video.videoHeight > 1300) setRate(2);
      setDuration(video.duration);
      setRangeStart(0); setRangeEnd(video.duration);
      setSeekT(0); seekTRef.current = 0;
      setMsg('영상 로드됨: ' + video.duration.toFixed(1) + '초, ' + video.videoWidth + 'x' + video.videoHeight + '. TAB이 잘 보이는 장면에서 영상 위를 드래그해 TAB 영역(코드 이름·가사 포함)을 지정한 뒤 "자동 추출"을 누르세요.');

      await seekTo(video, 0);
    };
  }

  // 장면 목록 + 사용자 손질 → 배치 → 띠 그리기 → 화면 갱신
  function build(col, ed, timing) {
    const pl = mosPlace(col, askMotion, ed);
    const res = mosRender(col, pl, cleanBg ? DEFAULT_PREPROC : null);
    const nAppend = pl.joins.filter(j => j.type === 'append').length, nSuspect = pl.joins.filter(j => j.suspect).length;
    setInfo(prev => ({
      ...(prev || {}), ...(timing || {}),
      frames: col.nFrames, blank: col.nBlank, runs: pl.runs.length, overlap: pl.joins.length - nAppend, append: nAppend, suspect: nSuspect,
      width: res.totalW, H: res.H, screenBg: 0, native: col.native ? Math.round(col.native.NW) : 0, D: pl.D, dark: col.dark,
      seams: pl.joins.map((j, i) => ({
        j: i + 1, x: Math.round(j.x * (res.scale || 1)), suspect: !!j.suspect, manual: !!j.manual,
        tip: (j.manual ? '[직접 지정] ' : '') + (j.type === 'overlap' ? '겹쳐 붙임 (겹침 ' + Math.round(j.overlap * 100) + '%' : j.suspect ? '이어 붙임 — 앞뒤 장면이 맞지 않음, 누락 의심 (' : '이어 붙임 — 페이지 전환 (') + ' · NCC ' + j.ncc.toFixed(2) + ')',
      })),
    }));
    setResult(res);
    setHist({ past: [], future: [] });
    const jById = {};
    pl.joins.forEach(j => { jById[j.runId] = j; });
    setSceneList(col.runs.map(r => ({
      id: r.id, t0: r.frames[0].t, t1: r.frames[r.frames.length - 1].t,
      thumb: r._thumb || (r._thumb = mosRunThumb(col, r, 64)),
      join: jById[r.id] ? jById[r.id].type : null, auto: jById[r.id] ? jById[r.id].auto : null,
      excluded: !!(ed.excluded || {})[r.id], mode: (ed.mode || {})[r.id] || 'auto',
    })));
    if (window.__mosDbg) window.__mosResult = { res, joins: pl.joins, runs: pl.runs.map(r => ({ t0: r.frames[0].t, t1: r.frames[r.frames.length - 1].t, lo: r.lo, hi: r.hi })) };
    if (diagRef.current) diagRef.current.result = {
      runs: col.runs.map(r => ({ id: r.id, t0: r.frames[0].t, t1: r.frames[r.frames.length - 1].t, n: r.frames.length, lo: r.lo, hi: r.hi, static: r.static })),
      joins: pl.joins.map(j => ({ runId: j.runId, type: j.type, auto: j.auto, ncc: Math.round(j.ncc * 1000) / 1000, overlap: j.overlap, manual: j.manual })),
      D: pl.D, width: res.totalW, H: res.H, edits: ed,
    };
    return res;
  }

  async function run() {
    const video = videoRef.current;
    if (!video || !roi) return;
    abortRef.current = false;
    setRunning(true); setPct(0); setResult(null); setInfo(null); setSceneList(null); setHist({ past: [], future: [] });
    const ed0 = { excluded: {}, mode: {} };
    setEdits(ed0); colRef.current = null;
    bgSeekRef.current = true;

      roi, rate, range: [rangeStart, rangeEnd], answers: { above: askAbove, below: askBelow, motion: askMotion }, cleanBg,
      play: stats, frames: diag,
    };
    const baseTitle = document.title;
    try {
      setMsg('영상을 한 번 재생하며 장면을 맞추는 중... (이 탭을 열어 두세요 — 다른 탭으로 가면 일시정지됩니다)');
      const col = await mosCollect(video, roi, {
        rate, startT: rangeStart, endT: Math.max(rangeStart, rangeEnd - 0.02), abortRef, motion: askMotion, diag, stats,
        onNotice: m => setMsg(m),
        onProgress: f => { const p = Math.round(f * 90); setPct(p); document.title = '(' + p + '%) ' + baseTitle; },
      });
      diagRef.current.collect = { frames: col.nFrames, blank: col.nBlank, runs: col.runs.length, OW: col.OW, OH: col.OH, dark: col.dark, screenBg: !!col.screenBg, ms: Math.round(performance.now() - t0) };
      if (abortRef.current) { setMsg('중단됨 — "진단 파일 받기"로 지금까지의 기록을 받을 수 있습니다'); return; }
      if (!col.runs.length) { setMsg('악보 장면을 찾지 못했습니다 — TAB 영역을 다시 지정해 보세요.'); return; }
      // 페이지처럼 멈춰 있는 장면이 대부분이면 그 장면들을 원본 해상도로 다시 잡는다 (4K에서 숫자가 깨지던 문제)

      const pz = stats.pauses ? ' · 일시정지 ' + stats.pauses + '번' : '';

  // 손으로 고치기

  }
  // 장면 나누기: 그 시간만 다시 재생하며, 조금만 달라져도 새 장면으로 나눈다 (두 페이지가 한 장면으로 묶였을 때)
  async function splitScene(id) {
    const col = colRef.current, video = videoRef.current;

    if (idx < 0) return;
    const r = col.runs[idx];

      });

    } catch (err) {

      bgSeekRef.current = false; setRunning(false);
    }
  }
  function downloadDiag() {
    const d = diagRef.current;
    if (!d) return;
    const blob = new Blob([JSON.stringify(d)], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'tab-auto-diagnostic-' + new Date().toISOString().slice(0, 19).replace(/[:T]/g, '-') + '.json';
    document.body.appendChild(a); a.click(); a.remove();

  }

  // 마디 삭제 · 되돌리기 — 스냅샷 = { result, seams }
  function onDeleteMeasure(a, b) {
    if (!result || !info) return;
    const cut = Math.round(b) - Math.round(a);
    setHist({ past: [...hist.past, { result, seams: info.seams }], future: [] });
    setResult(mosCutStrip(result, a, b));
    setInfo({ ...info, seams: info.seams.filter(sm => sm.x < a || sm.x >= b).map(sm => (sm.x >= b ? { ...sm, x: sm.x - cut } : sm)) });
  }
  function undo() {
    if (!hist.past.length) return;
    const p = hist.past[hist.past.length - 1];
    setHist({ past: hist.past.slice(0, -1), future: [{ result, seams: info.seams }, ...hist.future] });

  }
  function redo() {
    if (!hist.future.length) return;
    const n = hist.future[0];
    setHist({ past: [...hist.past, { result, seams: info.seams }], future: hist.future.slice(1) });
    setResult(n.result); setInfo({ ...info, seams: n.seams });
  }

  return (
    <div>
      <div className="block">
        <div className="block-head"><span>자동 (신규) — 영상 종류를 고르지 않고 한 번에 추출</span></div>
        <p className="hint-text">
          페이지 전환·스크롤·연속 이동·점프 스크롤이 섞여 있어도 같은 방식으로 처리합니다. 모든 장면을 "긴 악보 띠를 들여다보는 창"으로 보고,
          장면끼리 가로 이동량을 맞춰 하나의 띠로 붙입니다. 영상은 한 번만 재생하며, 같은 자리를 비춘 여러 장면의 중앙값으로 재생바·스티커·잔상을 지웁니다.
        </p>
        <div className="controls">
          <label>영상 파일: <input type="file" accept="video/*" onChange={handleFileChange} disabled={running} /></label>
          <label>분석 배속:
            <select value={rate} onChange={e => setRate(parseFloat(e.target.value))} disabled={running} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="2">2배 (느린 PC)</option><option value="4">4배 (기본)</option><option value="8">8배 (빠름)</option>
            </select>
          </label>
          <label><input type="checkbox" checked={cleanBg} onChange={e => setCleanBg(e.target.checked)} disabled={running} /> 배경 정리(흑백)</label>
        </div>
        <div className="slider-label" style={{ marginTop: '8px' }}>TAB 영역 — 영상 위를 드래그해 지정하세요 (코드 이름·가사까지 포함, 옆의 코드 다이어그램 상자·자막은 빼기)</div>
        <div className="mos-ask">
          <div className="slider-label" style={{ marginTop: '8px' }}>영상에 대해 알려주세요 — 모르면 '자동'으로 두면 됩니다</div>
          {[
            ['악보가 어떻게 넘어가나요?', askMotion, setAskMotion, [['auto', '자동/섞임'], ['flow', '흘러감(스크롤)'], ['page', '페이지가 바뀜']]],
          ].map(([q, val, set, opts]) => (
            <div key={q} className="mos-ask-row">
              <span>{q}</span>
              <span className="seg">
                {opts.map(([k, label]) => (
                  <button key={k} className={'seg-btn' + (val === k ? ' on' : '')} disabled={running} onClick={() => set(k)}>{label}</button>
                ))}
              </span>
            </div>
          ))}
        </div>
        <ScrollRoiPicker videoRef={videoRef} videoLoaded={videoLoaded} roi={roi} setRoi={setRoi} suppressRef={bgSeekRef} roiOpts={roiOpts} />
        {videoLoaded && (
          <>
            <div className="toolbar">
              <button className="icon-btn" disabled={running} onClick={() => userSeek(seekT - 5)}>◀ 5초</button>
              <button className="icon-btn" disabled={running} onClick={() => userSeek(seekT - 1)}>◀ 1초</button>
              <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
                <input type="range" min="0" max={duration || 0} step="0.05" value={seekT} disabled={running} style={{ flex: 1 }}
                  onChange={e => userSeek(parseFloat(e.target.value))} />
                <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>{seekT.toFixed(1)}s / {duration.toFixed(1)}s</span>
              </label>
              <button className="icon-btn" disabled={running} onClick={() => userSeek(seekT + 1)}>1초 ▶</button>
              <button className="icon-btn" disabled={running} onClick={() => userSeek(seekT + 5)}>5초 ▶</button>
            </div>
            <p className="hint-text" style={{ margin: '2px 0 0' }}>슬라이더로 영상을 넘겨 TAB이 잘 보이는 장면을 찾은 뒤, 영상 위에서 드래그해 TAB 영역을 지정하세요.</p>
            <div className="slider-label" style={{ marginTop: '8px' }}>추출 구간 — {rangeStart.toFixed(1)}s ~ {rangeEnd.toFixed(1)}s</div>
            <MiniRangeTimeline duration={duration} start={rangeStart} end={rangeEnd} onChange={(a, b, which) => { if (!running) { setRangeStart(a); setRangeEnd(b); userSeek(which === 'end' ? b : a); } }} />
          </>
        )}
      </div>
      <div className="toolbar">
        <button className="icon-btn" onClick={onModeBack} disabled={running}>← 모드</button>
        <button onClick={run} disabled={!videoLoaded || !roi || running}>{running ? '추출 중...' : '자동 추출'}</button>
        {running && <button className="icon-btn" onClick={() => { abortRef.current = true; }}>중단</button>}
        {!running && diagRef.current && <button className="icon-btn" onClick={downloadDiag} title="문제가 있을 때 이 파일을 보내주시면 같은 상황을 재현할 수 있습니다">진단 파일 받기</button>}
        <span className="save-msg">{running ? msg + ' — ' + pct + '%' : msg}</span>
      </div>
      {running && (
        <div style={{ height: '8px', background: 'var(--border)', borderRadius: '4px', overflow: 'hidden' }}>
          <div style={{ width: pct + '%', height: '100%', background: 'var(--accent)' }} />
        </div>
      )}
      {result && info && (
        <div className="block">
          <div className="block-head"><span>합쳐진 악보 띠</span></div>
          <p className="hint-text">
            장면 {info.frames}개 · 안정 구간 {info.runs}개 · 겹쳐 붙임 {info.overlap}곳 · 이어 붙임 {info.append}곳{info.suspect ? ' (그중 누락 의심 ' + info.suspect + '곳 — 띠 위 빨간 표시를 확인하세요)' : ''}
            {info.D != null ? ' · 점프 폭 ' + Math.round(info.D / MOS_REG_W * 100) + '%' : ''}{info.native ? ' · 페이지를 원본 해상도(가로 ' + info.native + 'px)로 다시 잡음' : ''} · {result.totalW}×{result.H}px ·
            재생 {(info.collectS || 0).toFixed(1)}초 + 합치기 {(info.buildS || 0).toFixed(1)}초
          </p>
          {sceneList && (
            <details className="mos-scenes" open={sceneList.length <= 60}>
              <summary>장면 목록 — 손으로 고치기 ({sceneList.filter(x => !x.excluded).length}/{sceneList.length}개 사용)</summary>
              <p className="hint-text" style={{ margin: '6px 0' }}>
                자동 판단이 틀렸을 때 고칩니다. <b>빼기</b>: 필요 없는 장면(제목·광고·흐린 잔상) 제외 ·
                <b> 앞과 붙이기</b>: 앞 장면과 같은 내용이 겹치면 "겹치기", 새 페이지면 "이어 붙이기" ·
                <b> 나누기</b>: 서로 다른 페이지가 한 장면으로 묶였을 때(글자가 겹쳐 보임) 그 시간만 다시 읽어 나눕니다. 바꾸면 띠가 바로 다시 만들어집니다.
              </p>
              <div className="mos-scene-grid">
                {sceneList.map((sc, i) => (
                  <div key={sc.id} className={'mos-scene' + (sc.excluded ? ' off' : '')}>
                    <div className="mos-scene-head">
                      <b>#{i + 1}</b> <span>{sc.t0.toFixed(1)}–{sc.t1.toFixed(1)}초</span>
                      <button className="icon-btn" disabled={running} onClick={() => userSeek(sc.t0 + 0.1)} title="위 영상 화면을 이 장면으로">보기</button>
                    </div>
                    <img src={sc.thumb} alt="" />
                    <div className="mos-scene-ctl">
                      <label><input type="checkbox" checked={!sc.excluded} disabled={running} onChange={() => toggleExclude(sc.id)} /> 사용</label>
                      {i > 0 && (
                        <select value={sc.mode} disabled={running || sc.excluded} onChange={e => setJoinMode(sc.id, e.target.value)}
                          title="앞 장면과 어떻게 붙일지">
                          <option value="auto">앞과: 자동({sc.auto === 'overlap' ? '겹치기' : '이어 붙이기'})</option>
                          <option value="append">앞과: 이어 붙이기</option>
                          <option value="overlap">앞과: 겹치기</option>
                        </select>
                      )}
                      <button className="icon-btn" disabled={running || sc.excluded} onClick={() => splitScene(sc.id)}>나누기</button>
                    </div>
                  </div>
                ))}
              </div>
            </details>
          )}
          <UniStage2 result={result} videoFile={videoFile} flowDefaults={DEFAULT_PREPROC}
            editCtx={{ onDeleteMeasure, canUndo: hist.past.length > 0, onUndo: undo, canRedo: hist.future.length > 0, onRedo: redo, seams: info.seams }} />
        </div>
      )}
    </div>
  );
}

function App() {
  // 1단계: 모드 선택. 'page'(페이지 전환형, 기존 로직 그대로) | 'scroll'(스크롤형, 새 모드) | null(선택 전).
  const [mode, setMode] = useState(null);

  const videoRef = useRef(null);
  const [step, setStep] = useState('capture');
  const [frames, setFrames] = useState([]);
  const [selectedFrameIds, setSelectedFrameIds] = useState(new Set());
  const [items, setItems] = useState([]);
  const [defaults, setDefaults] = useState(VIDEO_DEFAULTS_INIT);
  const [onsets, setOnsets] = useState([]);
  const [videoFile, setVideoFile] = useState(null);
  const [videoSourceId, setVideoSourceId] = useState(null);

  // 스크롤형 전용 상태 — 페이지 전환형의 videoRef/frames/items 등과 완전히 분리된 별도 트리.
  const scrollVideoRef = useRef(null);
  // 연속 이동형 전용 — 별도 <video>와 전처리 설정(스크롤형 설정과 독립)
  const flowVideoRef = useRef(null);
  // 통합(자동 감지) 모드 전용 <video>
  const uniVideoRef = useRef(null);
  // 자동(신규) 모드 전용 <video>
  const mosVideoRef = useRef(null);
  const [flowDefaults, setFlowDefaults] = useState(SCROLL_DEFAULTS_INIT);
  const [scrollPhase, setScrollPhase] = useState('capture'); // 'capture' (2단계 수동 부분) | 'result' (4~5단계)
  const [scrollDefaults, setScrollDefaults] = useState(SCROLL_DEFAULTS_INIT);
  useEffect(() => { setScrollDefaults(DEFAULT_PREPROC); setFlowDefaults(DEFAULT_PREPROC); setDefaults(VIDEO_DEFAULTS_INIT); }, [mode]); // 모드를 바꾸면 전처리도 초기값으로
  const [scrollCapture, setScrollCapture] = useState(null); // ScrollCaptureStep의 onDone 결과

  async function goToPreprocess() {
    const selected = frames.filter(f => selectedFrameIds.has(f.id));
    // One id shared by every item built from this extraction session, so the (possibly large) video
    // file + onsets are stored ONCE in tab-score-builder.html's IndexedDB and referenced by id, not
    // duplicated per TAB block.
    const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
    setVideoSourceId(sourceId);
    const built = await Promise.all(selected.map(async f => {
      const img = await loadImage(f.dataUrl);
      const avg = sampleAvgLuminance(img);
      return {
        id: f.id, type: 'image', src: f.dataUrl,
        invert: avg < 128, override: null,
        lyrics: { tags: [], areaHeightRatio: null },
        playheadExcluded: [], barLayout: null, stitchMeta: null,
        // Which span of the source video this page covers, and which stored video source it came
        // from — carried all the way to tab-score-builder.html so the syllable-placement onset-snap
        // mode (a later stage) knows what audio range to play and which onsets apply.
        timeRange: { start: f.segStartT, end: f.segEndT },
        videoSourceId: sourceId,
        repT: f.repT, roi: f.roi || null, // "이 페이지만 영역 다시 잡기"용
      };
    }));
    setItems(built);
    setStep('preprocess');
  }

  return (
    <div className="app">
      {/* Always rendered here at the App root (never inside a step wrapper that gets hidden) — a
          <video> nested inside a display:none ancestor can fail to decode frames in Safari even
          when the video element's own styles only make it visually tiny/transparent. Two separate
          elements (one per mode) so switching modes never confuses one mode's seek state with the
          other's — harmless to keep both mounted since only one mode is ever actually driven. */}
      <video ref={videoRef} muted className="hidden-video" />
      <video ref={scrollVideoRef} muted className="hidden-video" />
      <video ref={flowVideoRef} muted playsInline className="hidden-video" />
      <video ref={uniVideoRef} muted playsInline className="hidden-video" />
      <video ref={mosVideoRef} muted playsInline className="hidden-video" />

      <div className="titlebar">
        <h1>영상에서 TAB 추출</h1>
        <a className="nav-link" href="tab-score-builder.html">TAB 악보 결합 도구 →</a>
      </div>

      <div className="notice-banner">
        <div>
          <b>안내:</b> 처음이면 <b>자동 (신규)</b>를 쓰세요 — 영상 종류를 고르지 않고 한 번 재생으로 추출합니다. 기존 <b>페이지 전환형</b>, <b>스크롤형</b>, <b>연속 이동형</b>,
          <b>통합 · 자동 감지</b> 모드도 그대로 있습니다 (투명 오버레이형은 아직 지원하지 않습니다). 모든 처리는 이 브라우저 안에서만 이뤄지고, 영상이나 이미지를 서버로
          전송하지 않습니다.
        </div>
      </div>

      {mode === null && (
        <div className="block">
          <div className="block-head"><span>1단계 — 영상 종류 선택</span></div>
          <p className="hint-text">영상이 어떤 방식으로 넘어가는지에 따라 처리 방식이 완전히 다릅니다 — 맞는 쪽을 골라주세요.</p>
          <div className="mode-card-row" style={{ marginBottom: '10px' }}>
            <button className="mode-card" onClick={() => setMode('mosaic')} style={{ borderColor: 'var(--accent)' }}>
              <div className="mode-card-title">자동 (신규 · 추천)</div>
              <div className="mode-card-desc">영상 종류를 고를 필요 없음 — 페이지 전환·스크롤·연속 이동·점프 스크롤을 한 번 재생으로 자동 처리</div>
            </button>
          </div>
          <div className="mode-card-row">
            <button className="mode-card" onClick={() => setMode('page')}>
              <div className="mode-card-title">페이지 전환형</div>
              <div className="mode-card-desc">화면이 통째로 다음 페이지로 넘어가는 영상</div>
            </button>
            <button className="mode-card" onClick={() => setMode('scroll')}>
              <div className="mode-card-title">스크롤형</div>
              <div className="mode-card-desc">화면이 멈추지 않고 계속 옆/위로 흘러가듯 넘어가는 영상</div>
            </button>
            <button className="mode-card" onClick={() => setMode('flow')}>
              <div className="mode-card-title">연속 이동형</div>
              <div className="mode-card-desc">악보가 멈춤 없이 계속 흐르는 영상</div>
            </button>
          </div>
          <div className="mode-card-row" style={{ marginTop: '10px' }}>
            <button className="mode-card" onClick={() => setMode('uni')}>
              <div className="mode-card-title">통합 (자동 감지)</div>
              <div className="mode-card-desc">정지·연속 이동·컷 전환이 섞여 있어도 구간을 자동으로 나눠서 처리</div>
            </button>
          </div>
        </div>
      )}

      {mode === 'page' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className={step === 'capture' ? 'step active' : 'step'}>1. 영역 지정 · 추출</span>
            <span className="arrow">→</span>
            <span className={step === 'select' ? 'step active' : 'step'}>2. 프레임 선택</span>
            <span className="arrow">→</span>
            <span className={step === 'preprocess' ? 'step active' : 'step'}>3. 전처리 · 전달</span>
          </div>

          {/* Each step stays mounted (display:none when inactive, not unmounted) so its state — loaded
              video, ROI, diff analysis, per-frame overrides — survives moving back and forth. */}
          <div style={{ display: step === 'capture' ? 'block' : 'none' }}>
            <CaptureStep videoRef={videoRef} frames={frames} setFrames={setFrames}
              onsets={onsets} setOnsets={setOnsets} videoFile={videoFile} setVideoFile={setVideoFile}
              onNext={() => { setSelectedFrameIds(new Set(frames.map(f => f.id))); setStep('select'); }} />
          </div>
          <div style={{ display: step === 'select' ? 'block' : 'none' }}>
            <SelectStep frames={frames} selectedFrameIds={selectedFrameIds} setSelectedFrameIds={setSelectedFrameIds}
              onBack={() => setStep('capture')} onNext={goToPreprocess} />
          </div>
          <div style={{ display: step === 'preprocess' ? 'block' : 'none' }}>
            <PreprocessStep items={items} setItems={setItems} defaults={defaults} setDefaults={setDefaults}
              videoRef={videoRef} videoFile={videoFile} onsets={onsets} videoSourceId={videoSourceId}
              onBack={() => setStep('select')} />
          </div>
        </React.Fragment>
      )}

      {mode === 'scroll' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className={scrollPhase === 'capture' ? 'step active' : 'step'}>2. 영역 지정 · 스크롤 구간 조정</span>
            <span className="arrow">→</span>
            <span className={scrollPhase === 'result' ? 'step active' : 'step'}>4~5. 결과 · 재조정 · 전달</span>
          </div>
          <div style={{ display: scrollPhase === 'capture' ? 'block' : 'none' }}>
            <ScrollCaptureStep videoRef={scrollVideoRef} scrollDefaults={scrollDefaults} setScrollDefaults={setScrollDefaults}
              onDone={result => { setScrollCapture(result); setScrollPhase('result'); }}
              onModeBack={() => setMode(null)} />
          </div>
          {scrollPhase === 'result' && scrollCapture && (
            <div style={{ display: 'block' }}>
              <ScrollResultStep videoRef={scrollVideoRef} scrollCapture={scrollCapture} scrollDefaults={scrollDefaults}
                onBack={() => setScrollPhase('capture')} onModeBack={() => setMode(null)} />
            </div>
          )}
        </React.Fragment>
      )}

      {mode === 'mosaic' && (
        <MosaicStep videoRef={mosVideoRef} onModeBack={() => setMode(null)} />
      )}
      {mode === 'uni' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className="step active">통합(자동 감지) · 구간 분류 → 통합 추출 → 마디 편집 · 전달</span>
          </div>
          <UniStep videoRef={uniVideoRef} onModeBack={() => setMode(null)} />
        </React.Fragment>
      )}

      {mode === 'flow' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className="step active">연속 이동형 1단계 · 이동량 추적 + 스트립 재구성</span>
          </div>
          <FlowStep videoRef={flowVideoRef} flowDefaults={flowDefaults} setFlowDefaults={setFlowDefaults} onModeBack={() => setMode(null)} />
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
