    const top = staffLines[0], bottom = staffLines[staffLines.length - 1];
    bars = detectBarLines(g, top, bottom, darkThresh, barThresh);
    if (bars.length && (canvas.width - bars[bars.length - 1]) > canvas.width * 0.02) {
      bars = [...bars, canvas.width - 1];
    }
  }
  return { staffLines, bars, staffFound: staffLines.length >= 2 };
}

// ---- N마디씩 그룹핑 — 프로토타입의 단순 고정-N 슬라이싱을 이번 스펙대로 교체 ----
// N은 고정값이 아니라 "목표값": 목표 픽셀폭 = 이 영상의 평균 마디 폭 × N (해상도 무관, 영상마다
// 자동 계산). 각 마디선 경계에서, 누적 폭이 목표폭에 가장 가까워지는 마디 수(1~maxBarsPerGroup)를
// 그리디하게 선택 — 그래서 목표 N에서 ±1마디 정도는 자연스럽게 유동적으로 허용된다.
function groupBarsByTargetWidth(bars, targetN, maxBarsPerGroup) {
  maxBarsPerGroup = Math.max(1, maxBarsPerGroup || 8);
  const measureCount = bars.length - 1;
  if (measureCount <= 0) return [];
  const barWidths = [];
  for (let i = 0; i < measureCount; i++) barWidths.push(bars[i + 1] - bars[i]);
  const avgBarWidth = barWidths.reduce((a, b) => a + b, 0) / measureCount;
  const targetPx = avgBarWidth * Math.max(1, targetN);

  const groups = [];
  let i = 0;
  while (i < measureCount) {
    const upper = Math.min(maxBarsPerGroup, measureCount - i);
    let bestCount = 1, bestDiff = Infinity;
    for (let c = 1; c <= upper; c++) {
      const w = bars[i + c] - bars[i];
      const diff = Math.abs(w - targetPx);
      if (diff < bestDiff) { bestDiff = diff; bestCount = c; }
    }
    groups.push({ startIdx: i, endIdx: i + bestCount, startX: bars[i], endX: bars[i + bestCount], count: bestCount });
    i += bestCount;
  }
  return groups;
}

// ---- burst(스크롤 이벤트) 그룹핑 — diffs[i]는 times[i]→times[i+1] 전환 ----
function groupScrollBursts(diffs, threshold) {
  const movingIdx = [];
  for (let i = 0; i < diffs.length; i++) if (diffs[i] > threshold) movingIdx.push(i + 1);
  const bursts = [];
  let cur = null;
  for (const mi of movingIdx) {
    if (cur && mi - cur.end <= 1) cur.end = mi;
    else { if (cur) bursts.push(cur); cur = { start: mi, end: mi }; }
  }
  if (cur) bursts.push(cur);
  return bursts;
}

// 각 burst 전/후 프레임(정지 상태) + 처음/끝 프레임, 중복 제거 — 정렬된 고유 인덱스 배열
function scrollRepIndices(times, bursts) {
  const idxs = new Set([0, times.length - 1]);
  for (const b of bursts) {
    idxs.add(Math.max(0, b.start - 1));
    idxs.add(Math.min(times.length - 1, b.end + 1));
  }
  return [...idxs].sort((a, b) => a - b);
}

// burst 지속시간이 다른 burst들 대비 이상치인지 (평균 대비 표준편차 1.5배 초과)
function flagOutlierBursts(bursts, times) {
  const durations = bursts.map(b => times[Math.min(times.length - 1, b.end + 1)] - times[Math.max(0, b.start - 1)]);
  const mean = durations.reduce((a, b) => a + b, 0) / Math.max(1, durations.length);
  const variance = durations.reduce((a, b) => a + (b - mean) * (b - mean), 0) / Math.max(1, durations.length);
  const std = Math.sqrt(variance);
  return bursts.map((b, i) => ({
    ...b, duration: durations[i],
    isOutlier: std > 0 && Math.abs(durations[i] - mean) > 1.5 * std,
  }));
}

// ---- 대표 프레임 확정 즉시: 전처리 → 스티칭 → 마디선 검출 (4단계 자동 실행, 재클릭 없음) ----
async function runScrollStage3(repFrames, scrollDefaults, directionPref) {
  // 1) 전처리 — 반드시 원본 해상도에서 먼저 (despeckle 대상 canvas는 이미 captureRoiNative로
  // 원본 해상도로 캡처됨. 다운스케일은 스티칭 탐색(scrollGetGray)에서만, 별도의 축소 사본으로.)
  for (const f of repFrames) scrollApplyPreprocInPlace(f.canvas, scrollDefaults);

  // 2) 방향 자동 감지 (첫 프레임 쌍 기준, 이후 동일 방향 유지) + 스티칭
  let direction = directionPref;
  let directionNcc = null;
  if (direction === 'auto' || !direction) {
    if (repFrames.length >= 2) {
      const test = scrollFindBestShiftAuto(repFrames[0].canvas, repFrames[1].canvas);
      direction = test.direction;
      directionNcc = test.score;
    } else {
      direction = 'vertical';
    }
  }

  const first = repFrames[0].canvas;
  const crossLen = direction === 'vertical' ? first.width : first.height;
  // First pass: decide shift/score/dup for every seam WITHOUT drawing anything yet, so totalLen
  // (needed to size the output canvas) is known before allocating it.
  const seamDecisions = [];
  let totalLen = direction === 'vertical' ? first.height : first.width;
  for (let i = 0; i < repFrames.length - 1; i++) {
    const a = repFrames[i].canvas, b = repFrames[i + 1].canvas;
    const dup = scrollIsDuplicateFrame(a, b);
    if (dup.isDup) { seamDecisions.push({ i, shift: 0, score: dup.sim, dup: true, ok: true }); continue; }
    const { shift, score, ok } = scrollFindBestShift(a, b, direction);
    seamDecisions.push({ i, shift, score, dup: false, ok });
    totalLen += Math.max(1, shift);
  }

  const out = document.createElement('canvas');
  if (direction === 'vertical') { out.width = crossLen; out.height = totalLen; }
  else { out.width = totalLen; out.height = crossLen; }
  const octx = out.getContext('2d');
  octx.fillStyle = '#ffffff';
  octx.fillRect(0, 0, out.width, out.height);

  // Second pass: actually draw, recording each seam's `pos` — the pixel coordinate (along the
  // stitch axis) IN THE FINAL CANVAS where that seam's boundary sits — so the result screen can
  // later tell which N-bar GROUP (a range of x-coordinates) a given seam's low NCC score falls
  // into, to highlight that specific group as low-confidence.
  let cursor = 0;
  if (direction === 'vertical') { octx.drawImage(first, 0, cursor); cursor += first.height; }
  else { octx.drawImage(first, cursor, 0); cursor += first.width; }
  const seams = [];
  for (let i = 0; i < seamDecisions.length; i++) {
    const d = seamDecisions[i];
    seams.push({ ...d, pos: cursor });
    if (d.dup) continue;
    const bCanvas = repFrames[i + 1].canvas;
    const shift = Math.max(1, d.shift);
    if (direction === 'vertical') {
      const srcY = Math.max(0, bCanvas.height - shift);
      const h = bCanvas.height - srcY;
      octx.drawImage(bCanvas, 0, srcY, bCanvas.width, h, 0, cursor, bCanvas.width, h);
      cursor += h;
    } else {
      const srcX = Math.max(0, bCanvas.width - shift);
      const w = bCanvas.width - srcX;
      octx.drawImage(bCanvas, srcX, 0, w, bCanvas.height, cursor, 0, w, bCanvas.height);
      cursor += w;
    }
  }

  // 3) 마디(bar-line) 검출은 여기서 한 번만 하지 않는다 — staffThresh/barThresh를 결과 화면에서
  // 슬라이더로 바꿀 때마다 재검출해야 하므로, 그 하나의 공용 함수(detectStaffAndBars)를 결과 화면이
  // 직접 호출한다. 여기서는 깨끗한(오버레이 없는) stitched canvas만 돌려준다.
  return { direction, directionNcc, canvas: out, seams };
}
// ---- ROI 드래그 선택 UI — CaptureStep과 같은 패턴(별도 컴포넌트로 분리해 스크롤/페이지 두
// 플로우가 각자의 캔버스 ref를 갖게 함, 상태 공유 없음) ----
function ScrollRoiPicker({ videoRef, videoLoaded, roi, setRoi }) {
  const roiCanvasRef = useRef(null);
  const roiBoxRef = useRef(null);
  const dragStartRef = useRef(null);
  const roiRef = useRef(null);

  function drawRoiBoxOverlay() {
    const box = roiBoxRef.current, canvas = roiCanvasRef.current;
    if (!box || !canvas) return;
    const r = roiRef.current;
    if (!r) { box.style.display = 'none'; return; }
    const rect = canvas.getBoundingClientRect();
    box.style.left = (r.x0 * rect.width) + 'px';
    box.style.top = (r.y0 * rect.height) + 'px';
    box.style.width = ((r.x1 - r.x0) * rect.width) + 'px';
    box.style.height = ((r.y1 - r.y0) * rect.height) + 'px';
    box.style.display = 'block';
  }
  useEffect(() => { roiRef.current = roi; drawRoiBoxOverlay(); }, [roi]);
  useEffect(() => {
    window.addEventListener('resize', drawRoiBoxOverlay);
    return () => window.removeEventListener('resize', drawRoiBoxOverlay);
  }, []);

  function redrawFrame() {
    const video = videoRef.current, canvas = roiCanvasRef.current;
    if (!video || !canvas || !video.videoWidth) return;
    canvas.width = video.videoWidth; canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    drawRoiBoxOverlay();
  }
  useEffect(() => { if (videoLoaded) redrawFrame(); }, [videoLoaded]);
  // Exposes a redraw hook the parent can call after every scrub seek (video pixels change but this
  // component isn't otherwise re-rendered by a scrub).
  useEffect(() => {
    const video = videoRef.current;
    if (!video) return;
    video.addEventListener('seeked', redrawFrame);
    return () => video.removeEventListener('seeked', redrawFrame);
  }, [videoLoaded]);

  function canvasPoint(e) {
    const canvas = roiCanvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY, scaleX, scaleY };
  }
  function onDown(e) { dragStartRef.current = canvasPoint(e); }
  function onMove(e) {
    if (!dragStartRef.current) return;
    const cur = canvasPoint(e);
    const box = roiBoxRef.current;
    const x0 = Math.min(dragStartRef.current.x, cur.x) / cur.scaleX;
    const y0 = Math.min(dragStartRef.current.y, cur.y) / cur.scaleY;
    const w = Math.abs(cur.x - dragStartRef.current.x) / cur.scaleX;
    const h = Math.abs(cur.y - dragStartRef.current.y) / cur.scaleY;
    box.style.left = x0 + 'px'; box.style.top = y0 + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.display = 'block';
  }
  useEffect(() => {
    function onUp(e) {
      if (!dragStartRef.current) return;
      const canvas = roiCanvasRef.current;
      const start = dragStartRef.current;
      dragStartRef.current = null;
      const cur = canvasPoint(e);
      const curX = Math.max(0, Math.min(canvas.width, cur.x));
      const curY = Math.max(0, Math.min(canvas.height, cur.y));
      const x0 = Math.min(start.x, curX), x1 = Math.max(start.x, curX);
      const y0 = Math.min(start.y, curY), y1 = Math.max(start.y, curY);
      if (x1 - x0 < 5 || y1 - y0 < 5) return;
      setRoi({ x0: x0 / canvas.width, y0: y0 / canvas.height, x1: x1 / canvas.width, y1: y1 / canvas.height });
    }
    window.addEventListener('mouseup', onUp);
    return () => window.removeEventListener('mouseup', onUp);
  }, []);

  return (
    <div className="roi-wrap">
      <canvas ref={roiCanvasRef} className="roi-canvas" onMouseDown={onDown} onMouseMove={onMove} />
      <div ref={roiBoxRef} className="roi-box" />
    </div>
  );
}

// 전처리 설정 패널 — PreprocessStep의 배경제거 컨트롤과 같은 UI 패턴 + 플레이헤드 제거(스크롤
// 모드에서만 노출, 페이지 전환형 쪽 defaults 오브젝트/UI는 건드리지 않음).
function ScrollPreprocPanel({ scrollDefaults, setScrollDefaults }) {
  const [open, setOpen] = useState(false);
  function update(patch) { setScrollDefaults(prev => ({ ...prev, ...patch })); }
  const band = scrollDefaults.playheadColor || {
    hue: SCROLL_PLAYHEAD_HUE_DEFAULT, hueTolerance: SCROLL_PLAYHEAD_HUE_TOLERANCE_DEFAULT, satMin: SCROLL_PLAYHEAD_SAT_MIN_DEFAULT,
  };
  return (
    <div className="block">
      <div className="block-head">
        <span>전처리 설정 (배경 제거 · 잡티 제거 · 재생 커서 제거)</span>
        <button className="icon-btn" onClick={() => setOpen(o => !o)}>{open ? '접기' : '펼치기'}</button>
      </div>
      {open && (
        <div className="controls">
          <label>
            <input type="checkbox" checked={scrollDefaults.removeBg} onChange={e => update({ removeBg: e.target.checked })} />
            배경 제거 (사진 배경 → 흰색)
          </label>
          {scrollDefaults.removeBg && (
            <React.Fragment>
              <div>
                <div className="slider-label">어두운 배경 처리</div>
                <select value={scrollDefaults.invertMode} onChange={e => update({ invertMode: e.target.value })}>
                  <option value="auto">자동 감지</option>
                  <option value="on">항상 반전 (어두운 사진 배경)</option>
                  <option value="off">항상 일반 (밝은/흰 배경)</option>
                </select>
              </div>
              <div>
                <div className="slider-label">배경 제거 강도 ({scrollDefaults.threshold})</div>
                <input type="range" min="0" max="255" step="1" value={scrollDefaults.threshold}
                  onChange={e => update({ threshold: Number(e.target.value) })} />
              </div>
              <div>
                <div className="slider-label">부드러운 경계 ({scrollDefaults.softness})</div>
                <input type="range" min="0" max="60" step="1" value={scrollDefaults.softness}
                  onChange={e => update({ softness: Number(e.target.value) })} />
              </div>
              <label>
                <input type="checkbox" checked={scrollDefaults.despeckle} onChange={e => update({ despeckle: e.target.checked })} />
                잡티(고립 노이즈) 제거
              </label>
              {scrollDefaults.despeckle && (
                <div>
                  <div className="slider-label">제거할 잡티 크기 ({scrollDefaults.despeckleSize}px 이하)</div>
                  <input type="range" min="1" max="12" step="1" value={scrollDefaults.despeckleSize}
                    onChange={e => update({ despeckleSize: Number(e.target.value) })} />
                </div>
              )}
            </React.Fragment>
          )}
          <label>
            <input type="checkbox" checked={scrollDefaults.playheadRemove}
              onChange={e => update({ playheadRemove: e.target.checked })} />
            재생 커서(플레이헤드) 색 제거
          </label>
          {scrollDefaults.playheadRemove && (
            <div className="row" style={{ display: 'flex', gap: '8px', flexWrap: 'wrap' }}>
              <label>색상(Hue 0~360): <input type="number" value={band.hue} min="0" max="360"
                onChange={e => update({ playheadColor: { ...band, hue: Number(e.target.value) } })} /></label>
              <label>허용범위: <input type="number" value={band.hueTolerance} min="1" max="180"
                onChange={e => update({ playheadColor: { ...band, hueTolerance: Number(e.target.value) } })} /></label>
              <label>최소채도: <input type="number" value={band.satMin} step="0.05" min="0" max="1"
                onChange={e => update({ playheadColor: { ...band, satMin: Number(e.target.value) } })} /></label>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ScrollCaptureStep({ videoRef, scrollDefaults, setScrollDefaults, onDone, onModeBack }) {
  const durationRef = useRef(0);
  const rangeTrackRef = useRef(null);
  const rangeDragRef = useRef(null); // 'start' | 'end' | null
  const rangeStartRef = useRef(0);
  const rangeEndRef = useRef(0);
  // roi/scrollDefaults를 ref로도 미러링 — 아래 range-drag용 useEffect는 deps=[](pointermove/up을
  // 드래그 내내 딱 한 번만 붙여야 하므로)라서, 거기서 부르는 onMove가 "마운트 시점의" roi/
  // scrollDefaults를 닫아버리는 stale closure가 된다(updatePreprocPreview 자체는 매 렌더 새로
  // 만들어지지만, onMove가 붙잡고 있는 건 마운트 시점의 그 함수 하나뿐). updatePreprocPreview가
  // roi/scrollDefaults를 직접 읽지 않고 이 ref들의 .current만 읽게 하면, 어느 렌더의 onMove가
  // 호출되든 항상 최신 값을 보게 된다.
  const roiRef = useRef(null);
  const scrollDefaultsRef = useRef(null);
  const [videoFile, setVideoFile] = useState(null);
  const [videoLoaded, setVideoLoaded] = useState(false);
  const [duration, setDuration] = useState(0);
  const [seekT, setSeekT] = useState(0);
  const [rangeStart, setRangeStart] = useState(0);
  const [rangeEnd, setRangeEnd] = useState(0);
  const [roi, setRoi] = useState(null);
  const [direction, setDirection] = useState('auto');
  const [stepSec, setStepSec] = useState(0.2);
  const [analysis, setAnalysis] = useState(null); // {times, diffs}
  const [threshold, setThreshold] = useState(10);
  const [thresholdRange, setThresholdRange] = useState({ min: 0, max: 50, step: 0.1 });
  const [analyzing, setAnalyzing] = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(0);
  const [confirming, setConfirming] = useState(false);
  const [statusMsg, setStatusMsg] = useState('스크롤형 영상 파일을 선택하세요.');
  const chartRef = useRef(null);
  const ppRawRef = useRef(null);
  const ppProcessedRef = useRef(null);

  useEffect(() => { durationRef.current = duration; }, [duration]);
  useEffect(() => { rangeStartRef.current = rangeStart; }, [rangeStart]);
  useEffect(() => { rangeEndRef.current = rangeEnd; }, [rangeEnd]);
  useEffect(() => { roiRef.current = roi; }, [roi]);
  useEffect(() => { scrollDefaultsRef.current = scrollDefaults; }, [scrollDefaults]);

  function log(msg) { setStatusMsg(msg); }

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const video = videoRef.current;
    video.src = URL.createObjectURL(file);
    setVideoLoaded(false);
    setRoi(null);
    setAnalysis(null);
    setVideoFile(file);
    video.onloadedmetadata = async () => {
      setVideoLoaded(true);
      setDuration(video.duration);
      setSeekT(0);
      setRangeStart(0);
      setRangeEnd(video.duration);
      log('영상 로드됨: ' + video.duration.toFixed(2) + '초, ' + video.videoWidth + 'x' + video.videoHeight + '. TAB 영역을 드래그로 지정하세요.');
      try { await video.play(); video.pause(); } catch (err) {}
      await seekTo(video, 0);
      updatePreprocPreview();
    };
  }

  async function onSeekSliderChange(e) {
    const t = parseFloat(e.target.value);
    setSeekT(t);
    await seekTo(videoRef.current, t);
    updatePreprocPreview();
  }

  function startRangeDrag(e, which) {
    e.preventDefault();
    rangeDragRef.current = which;
  }
  useEffect(() => {
    async function onMove(e) {
      const which = rangeDragRef.current;
      const dur = durationRef.current;
      if (!which || !rangeTrackRef.current || !dur) return;
      const rect = rangeTrackRef.current.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let t = pct * dur;
      if (which === 'start') {
        t = Math.max(0, Math.min(t, rangeEndRef.current - 0.1));
        setRangeStart(t);
      } else {
        t = Math.min(dur, Math.max(t, rangeStartRef.current + 0.1));
        setRangeEnd(t);
      }
      setSeekT(t);
      await seekTo(videoRef.current, t);
      updatePreprocPreview();
    }
    function onUp() { rangeDragRef.current = null; }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
  }, []);

  // 전/후 비교 미리보기 — ROI/설정을 바꿀 때 확인 없이도 결과를 가늠할 수 있게, "원본(ROI 크롭만)"과
  // "전처리 후"를 현재 프레임 기준으로 나란히 보여준다. 반드시 원본 해상도로 처리한 뒤 표시용으로만
  // 축소한다(despeckle 스펙클 노이즈 방지 — 스티칭 단계와 동일한 순서). 실제 저장/스티칭에 쓰이는
  // 원본 해상도 데이터(captured, full)는 이 함수 밖으로 나가지 않으므로 아래 단계적 축소는 순수히
  // "여기서 어떻게 보여줄지"에만 영향을 준다.
  function updatePreprocPreview() {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const captured = captureRoiNative(video, roiRef.current); // 원본 해상도 크롭
    const raw = ppRawRef.current, processed = ppProcessedRef.current;
    if (!raw || !processed) return;
    loadImage(captured.dataUrl).then(img => {
      const full = document.createElement('canvas');
      full.width = img.naturalWidth; full.height = img.naturalHeight;
      full.getContext('2d').drawImage(img, 0, 0);
      drawDownscaledStaged(full, raw, 420);

      const processedFull = document.createElement('canvas');
      processedFull.width = img.naturalWidth; processedFull.height = img.naturalHeight;
      processedFull.getContext('2d').drawImage(img, 0, 0);
      scrollApplyPreprocInPlace(processedFull, scrollDefaultsRef.current); // 원본 해상도에서 처리
      drawDownscaledStaged(processedFull, processed, 420); // 표시용으로만, 2배씩 단계적으로 축소
    });
  }
  // ROI나 전처리 설정이 바뀔 때마다 갱신 — 드래그 중 과도하게 자주 다시 그리지 않도록 살짝 debounce.
  useEffect(() => {
    if (!videoLoaded) return;
    const t = setTimeout(updatePreprocPreview, 150);
    return () => clearTimeout(t);
  }, [roi, scrollDefaults, videoLoaded]);

  function drawChart(times, diffs, th) {
    const canvas = chartRef.current;
    if (!canvas || !diffs || diffs.length === 0) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth;
    const h = canvas.height = 120;
    ctx.clearRect(0, 0, w, h);
    const maxDiff = Math.max(...diffs, 1) * 1.15;
    ctx.strokeStyle = '#3c3489';
    ctx.beginPath();
    diffs.forEach((d, i) => {
      const x = (i / Math.max(1, diffs.length - 1)) * w;
      const y = h - (d / maxDiff) * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const ty = h - (th / maxDiff) * h;
    ctx.strokeStyle = '#cc3333';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(w, ty); ctx.stroke();
    ctx.setLineDash([]);
  }
  useEffect(() => { if (analysis) drawChart(analysis.times, analysis.diffs, threshold); }, [threshold, analysis]);

  async function analyze() {
    if (!videoLoaded) { log('영상을 먼저 선택하세요.'); return; }
    setAnalyzing(true);
    setAnalyzeProgress(0);
    setAnalysis(null);
    const video = videoRef.current;
    const step = parseFloat(stepSec) || 0.2;
    // 트림된 구간(rangeStart~rangeEnd) 안에서만 분석 — 페이지 전환형 CaptureStep과 동일하게, 불필요한
    // 인트로/아웃트로가 diff/burst 판정에 끼어들지 않도록 기본값은 영상 전체(0~duration)로 시작한다.
    const rangeS = Math.max(0, Math.min(rangeStart, video.duration));
    const rangeE = Math.max(rangeS, Math.min(rangeEnd || video.duration, video.duration));
    const totalSteps = Math.max(1, Math.ceil((rangeE - rangeS) / step));
    const times = [], diffs = [];
    let prevSample = null;
    let lastProgress = -1; // 프로토타입(순수 JS)과 달리 React는 상태가 바뀔 때마다 이 컴포넌트
    // 트리 전체를 다시 렌더링한다 — 매 스텝마다(초당 수십 번) setAnalyzeProgress를 부르면 값이
    // 실제로는 안 바뀐 프레임에서도 리렌더가 도는 게 체감 속도 저하의 큰 부분이었다. 표시되는
    // 정수 %가 실제로 바뀔 때만 갱신해서 리렌더 횟수를 총 진행 스텝 수(수백 번일 수 있음)에서
    // 100번 이하로 줄인다.
    try {
      let t = rangeS, idx = 0;
      while (t < rangeE) {
        await seekTo(video, t);
        const sample = getRoiPixelsForDiff(video, roi);
        times.push(t);
        if (prevSample) diffs.push(diffScore(prevSample, sample));
        prevSample = sample;
        idx++;
        const pct = Math.min(100, Math.round((idx / totalSteps) * 100));
        if (pct !== lastProgress) { lastProgress = pct; setAnalyzeProgress(pct); }
        if (idx % 10 === 0) log('분석 중... ' + t.toFixed(1) + 's / ' + rangeE.toFixed(1) + 's');
        t += step;
      }
      setAnalyzeProgress(100);
      setAnalysis({ times, diffs });
      const maxObserved = Math.max(...diffs, 0.1);
      setThresholdRange({ min: 0, max: maxObserved * 1.3, step: Math.max(0.001, maxObserved / 200) });
      const initialThreshold = maxObserved * 0.35;
      setThreshold(initialThreshold);
      const bursts = groupScrollBursts(diffs, initialThreshold);
      log('분석 완료. 스크롤(이동) ' + bursts.length + '회 감지 → 대표 프레임 ' + scrollRepIndices(times, bursts).length + '장 예상. 슬라이더로 임계값을 조절해보세요.');
    } catch (err) {
      log('분석 중 오류: ' + err.message);
    } finally {
      setAnalyzing(false);
    }
  }

  const bursts = analysis ? groupScrollBursts(analysis.diffs, threshold) : [];
  const repCount = analysis ? scrollRepIndices(analysis.times, bursts).length : 0;

  async function confirmAndRun() {
    if (!analysis) return;
    setConfirming(true);
    try {
      const { times } = analysis;
      const repIdx = scrollRepIndices(times, bursts);
      log('대표 프레임 ' + repIdx.length + '장 추출 중...');
      const video = videoRef.current;
      const repFrames = [];
      for (let k = 0; k < repIdx.length; k++) {
        const t = times[repIdx[k]];
        await seekTo(video, t);
        const captured = captureRoiNative(video, roi);
        const img = await loadImage(captured.dataUrl);
        const c = document.createElement('canvas');
        c.width = captured.w; c.height = captured.h;
        c.getContext('2d').drawImage(img, 0, 0);
        repFrames.push({ time: t, canvas: c });
        log('대표 프레임 추출 중... ' + (k + 1) + '/' + repIdx.length);
      }
      log('전처리 · 이어붙이기 진행 중...');
      const stage3 = await runScrollStage3(repFrames, scrollDefaults, direction);
      const flaggedBursts = flagOutlierBursts(bursts, times);
      onDone({
        videoFile, roi, direction: stage3.direction, directionNcc: stage3.directionNcc,
        repFrameTimes: repFrames.map(f => f.time),
        stitchedCanvas: stage3.canvas, seams: stage3.seams, bursts: flaggedBursts,
      });
    } catch (err) {
      log('처리 중 오류: ' + err.message);
      setConfirming(false);
    }
  }

  return (
    <div>
      <div className="block">
        <div className="block-head"><span>스크롤형 — TAB 영역 지정 및 대표 프레임 추출</span></div>
        <p className="hint-text">
          화면이 계속 흐르듯 넘어가는(스크롤형) 영상용입니다. 영상을 고른 뒤 TAB 영역을 드래그로 지정하고,
          "분석 시작"으로 이동/정지 구간을 계산한 다음 임계값 슬라이더로 스크롤 구간을 조정하세요.
          "대표 프레임 확정"을 누르면 전처리 → 이어붙이기까지 자동으로 이어서 진행되고, 마디선 검출은
          다음 화면에서 슬라이더로 직접 조정하며 확인할 수 있습니다.
        </p>
        <div className="controls">
          <label>영상 파일: <input type="file" accept="video/*" onChange={handleFileChange} /></label>
          <label>스크롤 방향:
            <select value={direction} onChange={e => setDirection(e.target.value)} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="auto">자동 감지 (첫 이음매로 판단)</option>
              <option value="vertical">세로 스크롤</option>
              <option value="horizontal">가로 스크롤</option>
            </select>
          </label>
        </div>

        <ScrollRoiPicker videoRef={videoRef} videoLoaded={videoLoaded} roi={roi} setRoi={setRoi} />
        <div className="slider-label">
          {roi
            ? ('지정된 영역: 가로 ' + (roi.x0 * 100).toFixed(0) + '%~' + (roi.x1 * 100).toFixed(0) + '%, 세로 ' + (roi.y0 * 100).toFixed(0) + '%~' + (roi.y1 * 100).toFixed(0) + '%')
            : '아직 영역을 지정하지 않았습니다. (지정하지 않으면 화면 전체로 분석합니다)'}
        </div>

        <div className="toolbar">
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            영상 상태 확인:
            <input type="range" min="0" max={duration || 0} step="0.1" value={seekT} disabled={!videoLoaded}
              style={{ flex: 1 }} onChange={onSeekSliderChange} />
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>{seekT.toFixed(1)}s / {duration.toFixed(1)}s</span>
          </label>
        </div>

        <div className="slider-label" style={{ marginTop: '10px' }}>
          분석할 구간 선택 — {rangeStart.toFixed(1)}s ~ {rangeEnd.toFixed(1)}s (비워두면 영상 전체가 대상 — 불필요한 인트로/아웃트로를
          빼면 스크롤(burst) 판정이 더 정확해집니다)
        </div>
        {videoLoaded && (
          <div className="range-slider-track" ref={rangeTrackRef}>
            <div className="range-slider-fill" style={{
              left: (rangeStart / duration * 100) + '%',
              width: ((rangeEnd - rangeStart) / duration * 100) + '%',
            }} />
            <div className="range-slider-handle" style={{ left: (rangeStart / duration * 100) + '%' }}
              onPointerDown={e => startRangeDrag(e, 'start')} title={'시작: ' + rangeStart.toFixed(1) + 's'} />
            <div className="range-slider-handle" style={{ left: (rangeEnd / duration * 100) + '%' }}
              onPointerDown={e => startRangeDrag(e, 'end')} title={'끝: ' + rangeEnd.toFixed(1) + 's'} />
          </div>
        )}
        <div className="toolbar">
          <button className="icon-btn" onClick={() => { setRangeStart(0); setRangeEnd(duration); }} disabled={!videoLoaded}>구간 초기화(전체)</button>
          <button className="icon-btn" onClick={() => setRoi(null)} disabled={!roi}>영역 초기화</button>
        </div>
      </div>

      <ScrollPreprocPanel scrollDefaults={scrollDefaults} setScrollDefaults={setScrollDefaults} />

      {videoLoaded && (
        <div className="block">
          <div className="block-head"><span>전처리 전/후 미리보기 (현재 프레임 기준)</span></div>
          <p className="hint-text">ROI를 지정하거나 위 전처리 설정을 바꾸면 자동으로 갱신됩니다. 실제로는 항상 원본 해상도로 처리한 뒤 여기서는 표시용으로만 축소합니다.</p>
          <div className="row" style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
            <div>
              <div className="slider-label">원본 (ROI 크롭만)</div>
              <canvas ref={ppRawRef} style={{ maxWidth: '420px', height: 'auto', border: '1px solid var(--border-strong)' }} />
            </div>
            <div>
              <div className="slider-label">전처리 후</div>
              <canvas ref={ppProcessedRef} style={{ maxWidth: '420px', height: 'auto', border: '1px solid var(--border-strong)' }} />
            </div>
          </div>
        </div>
      )}

      <div className="block">
        <div className="toolbar">
          <label>샘플링 간격(초): <input type="number" value={stepSec} step="0.05" min="0.02" onChange={e => setStepSec(e.target.value)} style={{ width: '4em' }} /></label>
          <button onClick={analyze} disabled={!videoLoaded || analyzing}>{analyzing ? '분석 중...' : '분석 시작 (diff 계산)'}</button>
        </div>
        {analyzing && (
          <div className="progress-bar-wrap">
            <div className="progress-bar-fill" style={{ width: analyzeProgress + '%' }} />
            <div className="progress-bar-label">{analyzeProgress}%</div>
          </div>
        )}
        {analysis && (
          <div className="toolbar">
            <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>전환(스크롤) 판정 임계값</span>
              <input type="range" min={thresholdRange.min} max={thresholdRange.max} step={thresholdRange.step}
                value={threshold} style={{ flex: 1 }} onChange={e => setThreshold(parseFloat(e.target.value))} />
              <span className="slider-label" style={{ margin: 0 }}>{threshold.toFixed(2)}</span>
            </label>
            <span className="save-msg">스크롤 {bursts.length}회 → 대표 프레임 {repCount}장 예상</span>
          </div>
        )}
        <div className="slider-label" style={{ whiteSpace: 'pre-wrap' }}>{statusMsg}</div>
        <canvas ref={chartRef} className="chart-canvas" />
      </div>

      <div className="toolbar">
        <button className="icon-btn" onClick={onModeBack} disabled={confirming}>← 모드 다시 선택</button>
        <button onClick={confirmAndRun} disabled={!analysis || confirming}>
          {confirming ? '처리 중...' : '대표 프레임 확정 (이어서 자동 진행) →'}
        </button>
      </div>
    </div>
  );
}
function frameTimeRangeForSpan(seams, repFrameTimes, spanStart, spanEnd) {
  const boundaries = [0, ...seams.map(s => s.pos)];
  let minT = Infinity, maxT = -Infinity;
  for (let k = 0; k < repFrameTimes.length; k++) {
    const segStart = boundaries[k] != null ? boundaries[k] : 0;
    const segEnd = k + 1 < boundaries.length ? boundaries[k + 1] : Infinity;
    if (segEnd > spanStart && segStart < spanEnd) {
      minT = Math.min(minT, repFrameTimes[k]);
      maxT = Math.max(maxT, repFrameTimes[k]);
    }
  }
  if (!isFinite(minT)) return { start: repFrameTimes[0], end: repFrameTimes[repFrameTimes.length - 1] };
  return { start: minT, end: maxT };
}

// 그룹(마디 범위)의 신뢰도 = 그 범위와 겹치는 이음매(seam)들 중 최저 NCC. 겹치는 이음매가 없으면
// (그룹이 이음매 없이 한 대표 프레임 안에만 있으면) 신뢰도 문제 없음(=1)으로 본다.
function groupConfidence(seams, startX, endX) {
  let minScore = 1;
  let any = false;
  for (const s of seams) {
    if (s.pos > startX - 1 && s.pos < endX + 1) { any = true; if (s.score < minScore) minScore = s.score; }
  }
  return any ? minScore : 1;
}

function cropCanvasRegion(canvas, x0, y0, x1, y1) {
  const w = Math.max(1, Math.round(x1 - x0)), h = Math.max(1, Math.round(y1 - y0));
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(canvas, x0, y0, w, h, 0, 0, w, h);
  return out;
}

// 그룹 목록(현재 N/축 기준)에서 각 그룹의 표시용 canvas를 잘라낸다 — direction에 따라 폭 방향으로
// 자르는지 높이 방향으로 자르는지가 다르다.
function cropGroupCanvas(stitchedCanvas, direction, group) {
  if (direction === 'vertical') {
    return cropCanvasRegion(stitchedCanvas, 0, group.startX, stitchedCanvas.width, group.endX);
  }
  return cropCanvasRegion(stitchedCanvas, group.startX, 0, group.endX, stitchedCanvas.height);
}

// ---- 5단계: 이미지 업로드 후 크롭 (수동 오버라이드 옵션 b) ----
function ImageCropPicker({ src, crop, setCrop }) {
  const canvasRef = useRef(null);
  const boxRef = useRef(null);
  const dragStartRef = useRef(null);
  const [natural, setNatural] = useState(null);

  useEffect(() => {
    if (!src) return;
    loadImage(src).then(img => {
      setNatural({ w: img.naturalWidth, h: img.naturalHeight });
      const canvas = canvasRef.current;
      const maxW = 700;
      const scale = Math.min(1, maxW / img.naturalWidth);
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    });
  }, [src]);

  function canvasPoint(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
  }
  function onDown(e) { dragStartRef.current = canvasPoint(e); }
  function onMove(e) {
    if (!dragStartRef.current) return;
    const cur = canvasPoint(e);
    const box = boxRef.current;
    const canvas = canvasRef.current;
    const x0 = Math.min(dragStartRef.current.x, cur.x) * canvas.width;
    const y0 = Math.min(dragStartRef.current.y, cur.y) * canvas.height;
    const w = Math.abs(cur.x - dragStartRef.current.x) * canvas.width;
    const h = Math.abs(cur.y - dragStartRef.current.y) * canvas.height;
    box.style.left = x0 + 'px'; box.style.top = y0 + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.display = 'block';
  }
  useEffect(() => {
    function onUp(e) {
      if (!dragStartRef.current || !natural) return;
      const start = dragStartRef.current;
      dragStartRef.current = null;
      const cur = canvasPoint(e);
      const x0 = Math.max(0, Math.min(1, Math.min(start.x, cur.x)));
      const x1 = Math.max(0, Math.min(1, Math.max(start.x, cur.x)));
      const y0 = Math.max(0, Math.min(1, Math.min(start.y, cur.y)));
      const y1 = Math.max(0, Math.min(1, Math.max(start.y, cur.y)));
      if (x1 - x0 < 0.01 || y1 - y0 < 0.01) return;
      setCrop({ x0, y0, x1, y1 });
    }
    window.addEventListener('mouseup', onUp);
    return () => window.removeEventListener('mouseup', onUp);
  }, [natural]);

  return (
    <div className="roi-wrap">
      <canvas ref={canvasRef} className="roi-canvas" onMouseDown={onDown} onMouseMove={onMove} />
      <div ref={boxRef} className="roi-box" style={crop ? {
        display: 'block',
        left: (crop.x0 * 100) + '%', top: (crop.y0 * 100) + '%',
        width: ((crop.x1 - crop.x0) * 100) + '%', height: ((crop.y1 - crop.y0) * 100) + '%',
      } : undefined} />
    </div>
  );
}

// ---- 5단계: 저신뢰 그룹 보완용 "이 구간 다시 만들기" ----
function GroupOverridePanel({ videoRef, scrollDefaults, roi, onApply, onCancel }) {
  const [mode, setMode] = useState('scrub'); // 'scrub' | 'upload'
  // scrub 방식
  const [seekT, setSeekT] = useState(0);
  const [duration, setDuration] = useState(videoRef.current ? videoRef.current.duration || 0 : 0);
  const [scrubRoi, setScrubRoi] = useState(roi);
  // upload 방식
  const [uploadSrc, setUploadSrc] = useState(null);
  const [uploadCrop, setUploadCrop] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    const video = videoRef.current;
    if (video && video.duration) setDuration(video.duration);
  }, []);

  async function onSeek(e) {
    const t = parseFloat(e.target.value);
    setSeekT(t);
    await seekTo(videoRef.current, t);
  }

  async function applyFromScrub() {
    if (!scrubRoi) { alert('영역을 드래그로 지정하세요.'); return; }
    setBusy(true);
    try {
      const captured = captureRoiNative(videoRef.current, scrubRoi);
      const img = await loadImage(captured.dataUrl);
      const c = document.createElement('canvas');
      c.width = captured.w; c.height = captured.h;
      c.getContext('2d').drawImage(img, 0, 0);
      scrollApplyPreprocInPlace(c, scrollDefaults);
      onApply(c.toDataURL('image/png'));
    } finally {
      setBusy(false);
    }
  }

  function onUploadFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploadSrc(URL.createObjectURL(file));
    setUploadCrop(null);
  }

  async function applyFromUpload() {
    if (!uploadSrc) { alert('이미지를 먼저 선택하세요.'); return; }
    setBusy(true);
    try {
      const img = await loadImage(uploadSrc);
      const crop = uploadCrop || { x0: 0, y0: 0, x1: 1, y1: 1 };
      const sx = Math.round(crop.x0 * img.naturalWidth), sy = Math.round(crop.y0 * img.naturalHeight);
      const sw = Math.max(1, Math.round((crop.x1 - crop.x0) * img.naturalWidth));
      const sh = Math.max(1, Math.round((crop.y1 - crop.y0) * img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = sw; c.height = sh;
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      scrollApplyPreprocInPlace(c, scrollDefaults);
      onApply(c.toDataURL('image/png'));
    } finally {
      setBusy(false);
    }
  }

  return (
    <div className="block" style={{ borderColor: 'var(--accent)' }}>
      <div className="block-head"><span>이 구간 다시 만들기</span></div>
      <div className="toolbar">
        <button className={mode === 'scrub' ? 'icon-btn' : 'icon-btn'} style={mode === 'scrub' ? { borderColor: 'var(--accent)', color: 'var(--accent)' } : undefined} onClick={() => setMode('scrub')}>영상에서 다시 크롭</button>
        <button style={mode === 'upload' ? { borderColor: 'var(--accent)', color: 'var(--accent)' } : undefined} className="icon-btn" onClick={() => setMode('upload')}>로컬 이미지 업로드</button>
      </div>
      {mode === 'scrub' ? (
        <React.Fragment>
          <div className="toolbar">
            <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
              구간 스크럽:
              <input type="range" min="0" max={duration || 0} step="0.1" value={seekT} style={{ flex: 1 }} onChange={onSeek} />
              <span className="slider-label" style={{ margin: 0 }}>{seekT.toFixed(1)}s</span>
            </label>
          </div>
          <ScrollRoiPicker videoRef={videoRef} videoLoaded={true} roi={scrubRoi} setRoi={setScrubRoi} />
          <div className="toolbar">
            <button onClick={applyFromScrub} disabled={busy}>{busy ? '처리 중...' : '이 프레임으로 대체'}</button>
          </div>
        </React.Fragment>
      ) : (
        <React.Fragment>
          <div className="controls">
            <label>이미지 파일: <input type="file" accept="image/*" onChange={onUploadFile} /></label>
          </div>
          {uploadSrc && <ImageCropPicker src={uploadSrc} crop={uploadCrop} setCrop={setUploadCrop} />}
          <div className="toolbar">
            <button onClick={applyFromUpload} disabled={busy || !uploadSrc}>{busy ? '처리 중...' : '이 이미지로 대체'}</button>
          </div>
        </React.Fragment>
      )}
      <div className="toolbar">
        <button className="icon-btn" onClick={onCancel} disabled={busy}>취소</button>
      </div>
    </div>
  );
}

function ScrollResultStep({ videoRef, scrollCapture, scrollDefaults, onBack, onModeBack }) {
  const { videoFile, roi, direction, directionNcc, repFrameTimes, stitchedCanvas, seams, bursts } = scrollCapture;
  // "몇 마디씩 묶기(목표)"의 기본값 — 사용자가 아직 직접 입력하지 않았다면(null) 이미 감지된 총
  // 마디 수를 그대로 따라가며 채워둔다(감지 결과가 바뀌면 같이 갱신). 한 번이라도 직접 타이핑하면
  // 그 이후로는 항상 사용자가 입력한 값을 그대로 쓴다 — wholeImageFallback과 동일한 패턴.
  const [groupSizeUser, setGroupSizeUser] = useState(null);
  const [maxBarsPerGroup, setMaxBarsPerGroup] = useState(8);
  const [overrides, setOverrides] = useState({}); // key `${startIdx}-${endIdx}` -> dataUrl
  const [overrideOpenKey, setOverrideOpenKey] = useState(null);
  const [sending, setSending] = useState(false);
  const groupResultRef = useRef(null);

  // 마디선 감지 임계값 — 재클릭 없이 슬라이더로 바로 조정 가능해야 하므로 여기서 상태로 갖고
  // 있다가, detectStaffAndBars 하나만(재이름 과정에서 다른 호출부가 남아있을 여지 자체가 없음)
  // 항상 거쳐서 재검출한다. 슬라이더를 드래그하는 동안 매 틱마다 O(전체 픽셀) 재계산이 도는 걸
  // 막기 위해 표시값(Input)과 실제 계산에 쓰는 값(Thresh)을 분리해 살짝 debounce한다.
  const [staffThreshInput, setStaffThreshInput] = useState(0.6);
  const [barThreshInput, setBarThreshInput] = useState(0.85);
  const [staffThresh, setStaffThresh] = useState(0.6);
  const [barThresh, setBarThresh] = useState(0.85);
  useEffect(() => {
    const t = setTimeout(() => { setStaffThresh(staffThreshInput); setBarThresh(barThreshInput); }, 200);
    return () => clearTimeout(t);
  }, [staffThreshInput, barThreshInput]);

  const detection = useMemo(
    () => detectStaffAndBars(stitchedCanvas, staffThresh, barThresh),
    [stitchedCanvas, staffThresh, barThresh]
  );
  const bars = detection.bars;
  const staffFound = detection.staffFound;
  const measureCount = Math.max(0, bars.length - 1);
  const groupSize = groupSizeUser != null ? groupSizeUser : Math.max(1, measureCount || 4);

  // 마디선이 0개(또는 부족)여도 다음 단계를 막지 않는다 — "마디선 없이 스티칭 결과 전체를 그대로
  // 하나의 이미지로 사용" 폴백. 사용자가 아직 이 체크박스를 직접 만지지 않았다면 마디가 1개 미만일
  // 때 자동으로 제안(선택)해두고, 한 번이라도 직접 바꾸면 그 이후로는 마디 수와 무관하게 사용자
  // 선택을 그대로 따른다.
  const [wholeImageFallback, setWholeImageFallback] = useState(null);
  const effectiveFallback = wholeImageFallback !== null ? wholeImageFallback : measureCount < 1;
  const stitchAxisLen = direction === 'vertical' ? stitchedCanvas.height : stitchedCanvas.width;

  // 파라미터(N, 최대 마디수, 임계값, 폴백)를 바꾸면 버튼 재클릭 없이 여기서 즉시 재계산(리플로우) —
  // 스티칭은 다시 하지 않고 캐시된 stitchedCanvas를 그대로 재사용한다.
  const groups = effectiveFallback
    ? [{ startIdx: 0, endIdx: measureCount, startX: 0, endX: stitchAxisLen, count: measureCount || null, whole: true }]
    : groupBarsByTargetWidth(bars, groupSize, maxBarsPerGroup);

  const groupsWithMeta = groups.map((g, idx) => {
    const confidence = groupConfidence(seams, g.startX, g.endX);
    const key = g.whole ? 'whole' : (g.startIdx + '-' + g.endIdx);
    const override = overrides[key];
    const timeRange = frameTimeRangeForSpan(seams, repFrameTimes, g.startX, g.endX);
    return { ...g, key, confidence, lowConfidence: confidence < 0.7, override, timeRange };
  });

  const outlierBursts = bursts.filter(b => b.isOutlier);

  function applyOverride(key, dataUrl) {
    setOverrides(prev => ({ ...prev, [key]: dataUrl }));
    setOverrideOpenKey(null);
  }

  async function handleSendToScoreBuilder() {
    setSending(true);
    try {
      const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
      const finalItems = groupsWithMeta.map((g, idx) => {
        const canvas = g.override ? null : cropGroupCanvas(stitchedCanvas, direction, g);
        const src = g.override || canvas.toDataURL('image/png');
        return {
          id: 'scroll_' + Date.now() + '_' + idx,
          type: 'image', src,
          invert: false, override: { ...MERGED_ROW_NEUTRAL_OVERRIDE },
          lyrics: { tags: [], areaHeightRatio: null },
          playheadExcluded: [], barLayout: null,
          stitchMeta: {
            source: 'scroll', direction, directionNcc, groupIndex: idx,
            barRange: [g.startIdx, g.endIdx], barCount: g.count, confidence: g.confidence,
            manuallyReplaced: !!g.override,
          },
          timeRange: g.timeRange,
          videoSourceId: sourceId,
        };
      });
      if (sourceId && videoFile) {
        await dbPut(VIDEO_SOURCE_KEY_PREFIX + sourceId, { videoBlob: videoFile, onsets: [], savedAt: Date.now() });
      }
      await dbPut(VIDEO_IMPORT_KEY, { items: finalItems, importedAt: Date.now() });
      window.location.href = 'tab-score-builder.html';
    } catch (err) {
      alert('전달 중 오류가 발생했습니다: ' + err.message);
      setSending(false);
    }
  }

  return (
    <div>
      <div className="block">
        <div className="block-head"><span>결과 — 이어붙이기 · 마디선 · 그룹 (재조정 가능)</span></div>
        <p className="hint-text">
          방향: {direction === 'vertical' ? '세로' : '가로'} 스크롤{directionNcc != null ? ' (첫 이음매 NCC=' + directionNcc.toFixed(3) + ')' : ''} ·
          이어붙인 프레임 {repFrameTimes.length}장
        </p>
        {outlierBursts.length > 0 && (
          <p className="hint-text" style={{ color: '#c0392b' }}>
            ⚠ 다른 구간보다 유독 길거나 짧은 스크롤 구간이 {outlierBursts.length}개 있습니다 (아래 그룹 중 테두리가 강조된 곳을 확인하세요).
          </p>
        )}

        <div className="hr" />
        <div className="toolbar">
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>6선 감지 임계값</span>
            <input type="range" min="0.1" max="0.95" step="0.01" value={staffThreshInput} style={{ flex: 1 }}
              onChange={e => setStaffThreshInput(parseFloat(e.target.value))} />
            <span className="slider-label" style={{ margin: 0 }}>{staffThreshInput.toFixed(2)}</span>
          </label>
        </div>
        <div className="toolbar">
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>마디선 감지 임계값</span>
            <input type="range" min="0.1" max="0.98" step="0.01" value={barThreshInput} style={{ flex: 1 }}
              onChange={e => setBarThreshInput(parseFloat(e.target.value))} />
            <span className="slider-label" style={{ margin: 0 }}>{barThreshInput.toFixed(2)}</span>
          </label>
        </div>
        <p className="hint-text" style={{ margin: '4px 0' }}>
          {staffFound ? ('6선 감지됨 · 마디선 ' + bars.length + '개 (마디 ' + measureCount + '개) 검출됨') : '6선을 찾지 못했습니다.'}
          {measureCount < 1 && ' — 마디선이 부족합니다. 임계값을 낮춰보거나, 아래 "마디선 없이 전체 사용"을 켜세요.'}
        </p>
        <div className="toolbar">
          <label><input type="checkbox" checked={effectiveFallback} onChange={e => setWholeImageFallback(e.target.checked)} />
            마디선 없이 스티칭 결과 전체를 그대로 하나의 이미지로 사용</label>
        </div>

        <div className="hr" />
        <div className="toolbar">
          <label>몇 마디씩 묶기(목표): <input type="number" min="1" max="16" value={groupSize} disabled={effectiveFallback}
            onChange={e => setGroupSizeUser(Math.max(1, parseInt(e.target.value) || 1))} style={{ width: '4em' }} /></label>
          <label>그룹당 최대 마디수: <input type="number" min="1" max="20" value={maxBarsPerGroup} disabled={effectiveFallback}
            onChange={e => setMaxBarsPerGroup(Math.max(1, parseInt(e.target.value) || 1))} style={{ width: '4em' }} /></label>
          <span className="save-msg">{measureCount}마디 → {groups.length}개 그룹</span>
        </div>
      </div>

      <div className="list" ref={groupResultRef}>
        {(() => {
          // 마지막(또는 마디 수가 적은) 그룹이 확대되어 보이지 않도록 — 모든 그룹에 같은
          // displayScale(px 단위)을 적용한다. 가장 "긴"(스티칭 축 기준) 그룹 기준으로 한 번만
          // 계산해서 전체에 동일 적용 (prototype의 groupBtn 미리보기 로직과 동일한 방식).
          function nativeSize(g) {
            return direction === 'vertical'
              ? { w: stitchedCanvas.width, h: g.endX - g.startX }
              : { w: g.endX - g.startX, h: stitchedCanvas.height };
          }
          const containerW = (groupResultRef.current && groupResultRef.current.clientWidth) || 900;
          const widestW = Math.max(1, ...groupsWithMeta.map(g => nativeSize(g).w));
          const displayScale = Math.min(1, containerW / widestW);
          return groupsWithMeta.map((g, idx) => {
            const canvas = g.override ? null : cropGroupCanvas(stitchedCanvas, direction, g);
            const src = g.override || (canvas && canvas.toDataURL('image/png'));
            const nsize = nativeSize(g);
            const imgStyle = g.override
              ? undefined // 수동 대체 이미지는 원본 크롭과 크기 계약이 다를 수 있어 기본(max-width:100%)로 표시
              : { width: Math.round(nsize.w * displayScale) + 'px', height: Math.round(nsize.h * displayScale) + 'px', maxWidth: 'none' };
            return (
              <div key={g.key} className="block" style={g.lowConfidence ? { borderColor: '#c0392b', borderWidth: '2px' } : undefined}>
                <div className="block-head">
                  <span>
                    그룹 {idx + 1}: {g.whole ? '전체 (마디선 미사용)' : (g.count + '마디')}
                    {g.lowConfidence && <b style={{ color: '#c0392b' }}> · 저신뢰 구간 (NCC {g.confidence.toFixed(2)})</b>}
                    {g.override && <span className="save-msg"> · 수동으로 다시 만듦</span>}
                  </span>
                  <button className="icon-btn" onClick={() => setOverrideOpenKey(overrideOpenKey === g.key ? null : g.key)}>
                    이 구간 다시 만들기
                  </button>
                </div>
                {src && <img src={src} className="merge-preview-img" style={imgStyle} alt={'그룹 ' + (idx + 1)} />}
                {overrideOpenKey === g.key && (
                  <GroupOverridePanel videoRef={videoRef} scrollDefaults={scrollDefaults} roi={roi}
                    onApply={dataUrl => applyOverride(g.key, dataUrl)}
                    onCancel={() => setOverrideOpenKey(null)} />
                )}
              </div>
            );
          });
        })()}
      </div>

      <div className="toolbar">
        <button className="icon-btn" onClick={onBack} disabled={sending}>← 대표 프레임 다시 고르기</button>
        <button className="icon-btn" onClick={onModeBack} disabled={sending}>모드 다시 선택</button>
        <button onClick={handleSendToScoreBuilder} disabled={sending}>
          {sending ? '전달 중...' : 'TAB 악보 만들기로 넘기기 (' + groups.length + '개) →'}
        </button>
      </div>
    </div>
  );
}

function App() {
  // 1단계: 모드 선택. 'page'(페이지 전환형, 기존 로직 그대로) | 'scroll'(스크롤형, 새 모드) | null(선택 전).
  const [mode, setMode] = useState(null);

  const videoRef = useRef(null);
  const [step, setStep] = useState('capture');
  const [frames, setFrames] = useState([]);
  const [selectedFrameIds, setSelectedFrameIds] = useState(new Set());
  const [items, setItems] = useState([]);
  const [defaults, setDefaults] = useState(VIDEO_DEFAULTS_INIT);
  const [onsets, setOnsets] = useState([]);
  const [videoFile, setVideoFile] = useState(null);
  const [videoSourceId, setVideoSourceId] = useState(null);

  // 스크롤형 전용 상태 — 페이지 전환형의 videoRef/frames/items 등과 완전히 분리된 별도 트리.
  const scrollVideoRef = useRef(null);
  const [scrollPhase, setScrollPhase] = useState('capture'); // 'capture' (2단계 수동 부분) | 'result' (4~5단계)
  const [scrollDefaults, setScrollDefaults] = useState(SCROLL_DEFAULTS_INIT);
  const [scrollCapture, setScrollCapture] = useState(null); // ScrollCaptureStep의 onDone 결과

  async function goToPreprocess() {
    const selected = frames.filter(f => selectedFrameIds.has(f.id));
    // One id shared by every item built from this extraction session, so the (possibly large) video
    // file + onsets are stored ONCE in tab-score-builder.html's IndexedDB and referenced by id, not
    // duplicated per TAB block.
    const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
    setVideoSourceId(sourceId);
    const built = await Promise.all(selected.map(async f => {
      const img = await loadImage(f.dataUrl);
      const avg = sampleAvgLuminance(img);
      return {
        id: f.id, type: 'image', src: f.dataUrl,
        invert: avg < 128, override: null,
        lyrics: { tags: [], areaHeightRatio: null },
        playheadExcluded: [], barLayout: null, stitchMeta: null,
        // Which span of the source video this page covers, and which stored video source it came
        // from — carried all the way to tab-score-builder.html so the syllable-placement onset-snap
        // mode (a later stage) knows what audio range to play and which onsets apply.
        timeRange: { start: f.segStartT, end: f.segEndT },
        videoSourceId: sourceId,
      };
    }));
    setItems(built);
    setStep('preprocess');
  }

  return (
    <div className="app">
      {/* Always rendered here at the App root (never inside a step wrapper that gets hidden) — a
          <video> nested inside a display:none ancestor can fail to decode frames in Safari even
          when the video element's own styles only make it visually tiny/transparent. Two separate
          elements (one per mode) so switching modes never confuses one mode's seek state with the
          other's — harmless to keep both mounted since only one mode is ever actually driven. */}
      <video ref={videoRef} muted className="hidden-video" />
      <video ref={scrollVideoRef} muted className="hidden-video" />

      <div className="titlebar">
        <h1>영상에서 TAB 추출</h1>
        <a className="nav-link" href="tab-score-builder.html">TAB 악보 결합 도구 →</a>
      </div>

      <div className="notice-banner">
        <div>
          <b>안내:</b> 화면이 통째로 바뀌는 <b>"페이지 전환형"</b>과 화면이 계속 흐르듯 넘어가는 <b>"스크롤형"</b> TAB 영상을
          지원합니다 (투명 오버레이형은 아직 지원하지 않습니다). 모든 처리는 이 브라우저 안에서만 이뤄지고, 영상이나 이미지를 서버로
          전송하지 않습니다.
        </div>
      </div>

      {mode === null && (
        <div className="block">
          <div className="block-head"><span>1단계 — 영상 종류 선택</span></div>
          <p className="hint-text">영상이 어떤 방식으로 넘어가는지에 따라 처리 방식이 완전히 다릅니다 — 맞는 쪽을 골라주세요.</p>
          <div className="mode-card-row">
            <button className="mode-card" onClick={() => setMode('page')}>
              <div className="mode-card-title">페이지 전환형</div>
              <div className="mode-card-desc">화면이 통째로 다음 페이지로 넘어가는 영상</div>
            </button>
            <button className="mode-card" onClick={() => setMode('scroll')}>
              <div className="mode-card-title">스크롤형</div>
              <div className="mode-card-desc">화면이 멈추지 않고 계속 옆/위로 흘러가듯 넘어가는 영상</div>
            </button>
          </div>
        </div>
      )}

      {mode === 'page' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className={step === 'capture' ? 'step active' : 'step'}>1. 영역 지정 · 추출</span>
            <span className="arrow">→</span>
            <span className={step === 'select' ? 'step active' : 'step'}>2. 프레임 선택</span>
            <span className="arrow">→</span>
            <span className={step === 'preprocess' ? 'step active' : 'step'}>3. 전처리 · 전달</span>
          </div>

          {/* Each step stays mounted (display:none when inactive, not unmounted) so its state — loaded
              video, ROI, diff analysis, per-frame overrides — survives moving back and forth. */}
          <div style={{ display: step === 'capture' ? 'block' : 'none' }}>
            <CaptureStep videoRef={videoRef} frames={frames} setFrames={setFrames}
              onsets={onsets} setOnsets={setOnsets} videoFile={videoFile} setVideoFile={setVideoFile}
              onNext={() => { setSelectedFrameIds(new Set(frames.map(f => f.id))); setStep('select'); }} />
          </div>
          <div style={{ display: step === 'select' ? 'block' : 'none' }}>
            <SelectStep frames={frames} selectedFrameIds={selectedFrameIds} setSelectedFrameIds={setSelectedFrameIds}
              onBack={() => setStep('capture')} onNext={goToPreprocess} />
          </div>
          <div style={{ display: step === 'preprocess' ? 'block' : 'none' }}>
            <PreprocessStep items={items} setItems={setItems} defaults={defaults} setDefaults={setDefaults}
              videoFile={videoFile} onsets={onsets} videoSourceId={videoSourceId}
              onBack={() => setStep('select')} />
          </div>
        </React.Fragment>
      )}

      {mode === 'scroll' && (
        <React.Fragment>
          <div className="step-nav">
            <button className="icon-btn" onClick={() => setMode(null)} style={{ marginRight: '4px' }}>← 모드</button>
            <span className={scrollPhase === 'capture' ? 'step active' : 'step'}>2. 영역 지정 · 스크롤 구간 조정</span>
            <span className="arrow">→</span>
            <span className={scrollPhase === 'result' ? 'step active' : 'step'}>4~5. 결과 · 재조정 · 전달</span>
          </div>
          <div style={{ display: scrollPhase === 'capture' ? 'block' : 'none' }}>
            <ScrollCaptureStep videoRef={scrollVideoRef} scrollDefaults={scrollDefaults} setScrollDefaults={setScrollDefaults}
              onDone={result => { setScrollCapture(result); setScrollPhase('result'); }}
              onModeBack={() => setMode(null)} />
          </div>
          {scrollPhase === 'result' && scrollCapture && (
            <div style={{ display: 'block' }}>
              <ScrollResultStep videoRef={scrollVideoRef} scrollCapture={scrollCapture} scrollDefaults={scrollDefaults}
                onBack={() => setScrollPhase('capture')} onModeBack={() => setMode(null)} />
            </div>
          )}
        </React.Fragment>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
