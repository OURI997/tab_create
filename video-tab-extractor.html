      candidates: (B.ovl && B.ovl.cands) ? B.ovl.cands.map(c => ({ shift: c.s, iou: c.iou, ink: c.ink, source: c.src, weakInk: !!c.weak })) : [],
    };
    const pause = ms => new Promise(r => setTimeout(r, ms));
    const files = [
      ['seam' + n + '_A_original.png', A.orig || A.canvas], ['seam' + n + '_A_processed.png', A.canvas],
      ['seam' + n + '_B_original.png', B.orig || B.canvas], ['seam' + n + '_B_processed.png', B.canvas],
    ];
    for (const [name, cv] of files) { await downloadCanvasPng(cv, name); await pause(250); }
    downloadBlobFile(new Blob([JSON.stringify(meta, null, 2)], { type: 'application/json' }), 'seam' + n + '_debug.json');
  }

  async function rebuildWithType(type) {
    const video = videoRef.current;
    if (!video) return;
    setRebuilding(true);
    setRebuildMsg('다시 만드는 중...');
    try {
      const r = await buildScrollResult({
        video, roi, times: scrollCapture.times, bursts: scrollCapture.rawBursts, scrollDefaults,
        direction: scrollCapture.directionPref, transition: type, log: setRebuildMsg,
      });
      setRawFrames(r.ex.rawFrames);
      setBuilt({
        direction: r.ex.direction, directionNcc: r.ex.directionNcc, mode: r.ex.mode, frameLen: r.ex.frameLen,
        notes: r.ex.notes, typeInfo: r.ex.typeInfo, markerRaw: r.markerData, profile: r.profile,
      });
      setOverrides({}); setOverrideOpenKey(null); setSeamSel(null); setWholeImageFallback(null);
      setRebuildMsg('');
    } catch (err) {
      setRebuildMsg('다시 만들기 오류: ' + err.message);
    } finally {
      setRebuilding(false);
    }
  }

  function nudgeSeam(d) {
    if (!curSeam) return;
    setRawFrames(prev => adjustCutSeam(prev, curSeam.i, d, seamAdjAll));
  }
  function onSeamKey(e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    nudgeSeam(e.key === 'ArrowLeft' ? step : -step);
  }

  async function handleSendToScoreBuilder() {
    setSending(true);
    try {
      const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
      const finalItems = groupsWithMeta.map((g, idx) => {
        const canvas = g.override ? null : cropGroupCanvas(stitchedCanvas, direction, g);
        const src = g.override || canvas.toDataURL('image/png');
        return {
          id: 'scroll_' + Date.now() + '_' + idx,
          type: 'image', src,
          invert: false, override: { ...MERGED_ROW_NEUTRAL_OVERRIDE },
          lyrics: { tags: [], areaHeightRatio: null },
          playheadExcluded: [], barLayout: null,
          stitchMeta: {
            source: 'scroll', direction, directionNcc, groupIndex: idx, transition: mode,
            barRange: [g.startIdx, g.endIdx], barCount: g.count, byWidth: !!g.byWidth, confidence: g.confidence,
            manuallyReplaced: !!g.override,
          },
          timeRange: g.timeRange,
          videoSourceId: sourceId,
        };
      });
      if (sourceId && videoFile) {
        await dbPut(VIDEO_SOURCE_KEY_PREFIX + sourceId, { videoBlob: videoFile, onsets: [], savedAt: Date.now() });
      }
      await dbPut(VIDEO_IMPORT_KEY, { items: finalItems, importedAt: Date.now() });
      window.location.href = 'tab-score-builder.html';
    } catch (err) {
      alert('전달 중 오류가 발생했습니다: ' + err.message);
      setSending(false);
    }
  }

  const barSliderValue = barAuto ? detection.threshUsed : barThreshInput;

  return (
    <div>
      <div className="block">
        <div className="block-head"><span>결과 — 이어붙이기 · 마디선 · 그룹 (재조정 가능)</span></div>
        <p className="hint-text">
          방향: {direction === 'vertical' ? '세로' : '가로'} 스크롤{directionNcc != null ? ' (첫 이음매 NCC=' + directionNcc.toFixed(3) + ')' : ''} ·
          전환 방식: {mode === 'cut' ? '컷 전환(타일링, 맞대어 붙이기)' : '부드러운 스크롤(NCC 겹침)'} ·
          이어붙인 조각 {rawFrames.length}개 ·{' '}
          {markerData && markerData.confident
            ? <span className="badge badge-precise">정밀 동기화됨 (재생 표시 감지 · 추적점 {markerData.count}개)</span>
            : <span className="badge badge-estimate">추정값 (재생 표시 없음 — {mode === 'cut' ? '타일 내 선형 보간' : '구간별 보간'}){markerData ? ' · 추적점 ' + markerData.count + '개(부족)' : ''}</span>}
        </p>
        <div className="toolbar">
          <label>영상 유형:
            <select value={typeChoice} onChange={e => setTypeChoice(e.target.value)} disabled={rebuilding} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="auto">자동</option>
              <option value="smooth">부드러운 스크롤</option>
              <option value="cut">컷 전환</option>
            </select>
          </label>
          <button className="icon-btn" onClick={() => rebuildWithType(typeChoice)} disabled={rebuilding}>{rebuilding ? '다시 만드는 중...' : '이 유형으로 다시 만들기'}</button>
          {rebuildMsg && <span className="save-msg">{rebuildMsg}</span>}
        </div>
        {profile && (() => {
          const st = profile.stages || {};
          const barsSec = barsProfRef.current, grpSec = groupProfRef.current;
          const pipeKeys = ['분류', '캡처', '이음', '재생표시'];
          const pipeSum = pipeKeys.reduce((a, k) => a + (st[k] ? st[k].sec : 0), 0);
          const other = Math.max(0, profile.pipelineSec - pipeSum) + grpSec;
          const total = (profile.diff ? profile.diff.sec : 0) + profile.pipelineSec + barsSec + grpSec;
          const rows = [
            ['diff 스캔', profile.diff], ['burst 분류', st['분류']], ['타일 대표 프레임 캡처', st['캡처']],
            ['타일 이음(겹침 탐지 포함)', st['이음']], ['재생 표시 추적', st['재생표시']],
            ['마디선 검출', { sec: barsSec, seeks: 0, captures: 0, hits: 0 }], ['그룹화·기타', { sec: other, seeks: 0, captures: 0, hits: 0 }],
          ];
          return (
            <details>
              <summary className="slider-label" style={{ cursor: 'pointer' }}>
                단계별 소요 시간 — 총 {total.toFixed(1)}초{profile.videoDuration ? ' (영상 ' + profile.videoDuration.toFixed(1) + '초 대비 ' + (total / profile.videoDuration).toFixed(2) + '배)' : ''}
              </summary>
              <div style={{ fontSize: '12px' }}>
                {rows.map(([name, r]) => (
                  <div key={name}>{name}: {r ? r.sec.toFixed(2) : '0.00'}초 · seek {r ? r.seeks : 0}회 · 캡처 {r ? r.captures : 0}회{r && r.hits ? ' (캐시 재사용 ' + r.hits + '회)' : ''}</div>
                ))}
              </div>
            </details>
          );
        })()}
        {seamsInfo.some(x => x.cut && !x.dup) && (
          <p className="hint-text" style={{ margin: '4px 0' }}>
            겹침 확정 {seamsInfo.filter(x => x.cut && !x.dup && x.ovl && x.ovl.kind === 'overlap').length} / 없음 {seamsInfo.filter(x => x.cut && !x.dup && x.ovl && x.ovl.kind === 'none').length} / 판단 불가 {seamsInfo.filter(x => x.cut && !x.dup && x.ovl && x.ovl.kind === 'unverifiable').length}
          </p>
        )}
        {typeInfo && <p className="hint-text" style={{ margin: '4px 0' }}>선택된 유형: <b>{typeInfo.decided === 'cut' ? '컷 전환(타일링)' : '부드러운 스크롤(NCC)'}</b> — {typeInfo.reason}</p>}
        {notes && notes.roiNarrow && (
          <p className="hint-text" style={{ color: '#c0392b' }}>
            ⚠ 오선이 영역(ROI) 양쪽 끝까지 닿아 있습니다. 지정한 영역이 뷰어의 악보 영역보다 좁아 이음새에서 내용이 빠질 수 있으니, 영역을 더 넓게 지정해서 다시 시도하세요.
          </p>
        )}
        {outlierBursts.length > 0 && (
          <p className="hint-text" style={{ color: '#c0392b' }}>
            ⚠ 다른 구간보다 유독 길거나 짧은 스크롤 구간이 {outlierBursts.length}개 있습니다 (아래 그룹 중 테두리가 강조된 곳을 확인하세요).
          </p>
        )}

        <div className="hr" />
        <div className="toolbar">
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>6선 감지 임계값</span>
            <input type="range" min="0.1" max="0.95" step="0.01" value={staffThreshInput} style={{ flex: 1 }}
              onChange={e => setStaffThreshInput(parseFloat(e.target.value))} />
            <span className="slider-label" style={{ margin: 0 }}>{staffThreshInput.toFixed(2)}</span>
          </label>
        </div>
        <div className="toolbar">
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>마디선 연속도 임계값</span>
            <input type="range" min="0.5" max="1" step="0.01" value={barSliderValue} style={{ flex: 1 }}
              onChange={e => { setBarAuto(false); setBarThreshInput(parseFloat(e.target.value)); }} />
            <span className="slider-label" style={{ margin: 0 }}>{barSliderValue.toFixed(2)}{barAuto ? ' (자동)' : ''}</span>
          </label>
          <label><input type="checkbox" checked={barAuto} onChange={e => setBarAuto(e.target.checked)} /> 자동 보정</label>
        </div>
        <p className="hint-text" style={{ margin: '4px 0' }}>
          {staffFound ? ('보표 구조 인식됨 · 보표 ' + detection.system.main.staves.length + '개 · 마디선 ' + bars.length + '개 (마디 ' + measureCount + '개) 검출됨') : '보표(오선)를 찾지 못했습니다.'}
          {staffFound && (' · 보표 간 연결 점수: ' + (detection.system.connScores.length
            ? detection.system.connScores.map(c => c.toFixed(2)).join(', ')
            : (detection.system.splitScores.length ? ('연결 획 없음 → 분리됨 (' + detection.system.splitScores.map(c => c.toFixed(2)).join(', ') + ')') : '단일 보표')))}
          {staffFound && (
            <span><br />검출된 오선 줄 (y좌표 · 행별 어두움 비율): {detection.system.main.lines.map((l, k) =>
              (k > 0 ? ' / ' : '') + Math.round(l.y) + ' (' + (l.ratio != null ? l.ratio.toFixed(2) : '-') + ')' + (l.weak ? ' 보강' : '') + (isRestoredY(l.y) ? ' 복원' : '')).join('')}
              · 밴드 {Math.round(detection.system.main.top)}~{Math.round(detection.system.main.bottom)}</span>
          )}
          {staffFound && detection.stats && (
            <span><br />마디선 검출: 후보 {detection.stats.cand} → 단별 통과 {detection.stats.allStaff} → 헤더제외 후 {detection.stats.afterHeader} → 정리 후 {detection.stats.afterPrune} (삐져나옴으로 제외 {detection.stats.protruded}개 / 지속성으로 제외 {detection.stats.notPersistent}개 / 양 끝 불일치 {detection.stats.endMismatch}개) (사용 T={detection.threshUsed.toFixed(2)}{detection.auto ? ' 자동' : ' 수동'})</span>
          )}
          {staffFound && quality.weak && <b style={{ color: '#c0392b' }}> · 마디선 인식 약함 — 폭 기준 그룹화로 자동 전환</b>}
          {staffFound && quality.low && !quality.weak && (
            <b style={{ color: '#c0392b' }}> · 마디 인식 신뢰도 낮음
              ({quality.measureCount < 1 ? '마디선 없음' : ('폭 정상 비율 ' + Math.round(quality.widthOk * 100) + '%' + (quality.perView != null ? ', ROI 폭당 ' + quality.perView.toFixed(1) + '마디' : ''))})
              {!effectiveFallback && !useBarGroups && ' — 폭 기준 분할로 자동 전환됨'}
            </b>
          )}
        </p>
        <div className="toolbar">
          <label><input type="checkbox" checked={effectiveFallback} onChange={e => setWholeImageFallback(e.target.checked)} />
            마디선 없이 스티칭 결과 전체를 그대로 하나의 이미지로 사용</label>
          <label><input type="checkbox" checked={showOverlay} onChange={e => setShowOverlay(e.target.checked)} /> 디버그 오버레이 표시</label>
          <button className="icon-btn" onClick={() => stitchedCanvas.toBlob(blob => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'stitched-original.png';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          }, 'image/png')}>스티치 원본 PNG 다운로드 (디버그)</button>
        </div>
        {fixSeams.length > 0 ? (
          <div className="toolbar">
            <b style={{ color: '#e07000' }}>수정 필요 이음매 {fixSeams.length}개:</b>
            {fixSeams.map((s, n) => (
              <button key={s.i} className="icon-btn" title={s.reason || ('NCC ' + (s.score != null ? s.score.toFixed(2) : '-'))}
                style={{ color: '#e07000', borderColor: '#e07000', fontWeight: 700, background: curSeam && curSeam.i === s.i ? '#fff1de' : undefined }}
                onClick={() => selectSeam(s.i)}>{circled(n + 1)}</button>
            ))}
          </div>
        ) : (seamsInfo.some(s => !s.dup) && <p className="hint-text" style={{ margin: '4px 0', color: '#1e7d3c' }}>수정 필요한 이음매 없음 (모든 이음매가 검증 통과)</p>)}
        {showOverlay && (
          <div ref={stripScrollRef} style={{ overflowX: 'auto', border: '1px solid var(--border-strong)', background: '#fff' }}>
            <div style={{ position: 'relative', width: stripW, paddingTop: 22 }}>
              <canvas ref={overlayRef} style={{ display: 'block' }} />
              {fixSeams.map((s, n) => {
                const sel = curSeam && curSeam.i === s.i;
                return (
                  <React.Fragment key={s.i}>
                    <div style={{ position: 'absolute', left: s.pos * overlayScale - (sel ? 2 : 1), top: 22, width: sel ? 4 : 2, height: stripH, background: 'rgba(240,128,0,0.9)', pointerEvents: 'none' }} />
                    <button onClick={() => selectSeam(s.i)} title={s.reason || 'NCC 낮음'}
                      style={{ position: 'absolute', left: s.pos * overlayScale, top: 0, transform: 'translateX(-50%)', fontSize: sel ? 18 : 12, fontWeight: 700, color: '#fff', background: '#f08000', border: 'none', borderRadius: 4, padding: '0 5px', lineHeight: '20px', cursor: 'pointer', whiteSpace: 'nowrap' }}>
                      ▼{n + 1}
                    </button>
                  </React.Fragment>
                );
              })}
            </div>
          </div>
        )}
        <details open={fixSeams.length > 0}>
          <summary className="slider-label" style={{ cursor: 'pointer' }}>이음매 점수 목록 ({seamsInfo.length}개, 정상 포함 — 실패 기준을 같이 표시)</summary>
          <div style={{ fontSize: '12px' }}>
            {seamsInfo.map(s => {
              let scoreText, criterion;
              if (s.dup) { scoreText = '중복 타일(제외됨)'; criterion = '-'; }
              else if (s.cut) {
                scoreText = (s.score == null || !(s.weight >= 4)) ? ('연속도 판단 보류 (가중 ' + (s.weight || 0) + ')') : ('연속도 ' + s.score.toFixed(2) + ' (가중 ' + s.weight + ')');
                criterion = (quality.low ? '실패 기준: 연속도 < 0.40 (가중 ≥ 4) 또는 내용 중복' : '실패 기준: 낀 마디 폭이 중앙값의 0.4~2.5배 밖 또는 내용 중복')
                  + (s.widthRatio != null ? ' · 마디 폭 비 ' + s.widthRatio.toFixed(2) : '');
                const o = s.ovl;
                const ovText = s.dupSuspect ? '중복 의심 (자동 수정 실패)'
                  : (s.dupFixed ? ('중복 의심 → 자동 수정 (' + s.dupFixed + 'px 제거)')
                    : (o && o.kind === 'overlap' ? ('겹침 ' + o.px + 'px 제거 (IoU ' + o.iou.toFixed(2) + ')')
                      : (o && o.kind === 'unverifiable' ? ('겹침 판단 불가' + (o.why ? '(' + o.why + ')' : '') + ' — 맞대어 붙임, 확인 필요') : '겹침 없음')));
                scoreText = ovText + ' · ' + scoreText;
                if (o && o.cands && o.cands.length) {
                  criterion += ' · 후보: ' + o.cands.map(c => 'shift ' + c.s + ' / IoU ' + c.iou.toFixed(2) + ' / 잉크 ' + c.ink + ' (' + (c.src === 'bar' ? '마디선' : 'NCC') + (c.weak ? ', 잉크 부족' : '') + ')').join(' ; ');
                }
              } else { scoreText = 'NCC ' + (s.score != null ? s.score.toFixed(2) : '-'); criterion = '실패 기준: NCC < 0.70'; }
              return (
                <div key={s.i} onClick={() => !s.dup && selectSeam(s.i)}
                  style={{ padding: '2px 4px', cursor: s.dup ? 'default' : 'pointer', color: s.needsFix ? '#c05000' : undefined, fontWeight: s.needsFix ? 700 : 400 }}>
                  #{s.i + 1} · {s.cut ? '컷' : 'NCC'} · x={Math.round(s.pos)}px · {scoreText} · {criterion} · {s.dup ? '제외' : (s.needsFix ? ('수정 필요' + (s.reason ? ' (' + s.reason + ')' : '')) : '정상')}
                  {!s.dup && <button className="icon-btn" style={{ marginLeft: '8px', fontSize: '11px' }} onClick={e => { e.stopPropagation(); exportSeamDebug(s); }}>디버그 내보내기</button>}
                </div>
              );
            })}
          </div>
        </details>
        {showOverlay && <p className="hint-text" style={{ margin: '4px 0' }}>파랑 = 사용된 시스템의 각 보표 밴드(회색 = 다른 시스템) · 빨강 = 모든 단 통과 마디선 / 진한 빨강 = 단 사이 간격까지 연속 · 초록 = 이음새 위치 · 주황 깃발 = 수정 필요 이음새 (화면 표시용, 내보내는 이미지에는 포함되지 않음)</p>}

        <div className="hr" />
        <div className="toolbar">
          <label>몇 마디씩 묶기(목표): <IntInput min={1} max={16} value={groupSize} disabled={effectiveFallback} onCommit={setGroupSizeUser} style={{ width: '4em' }} /></label>
          <label>그룹당 최대 마디수: <IntInput min={1} max={20} value={maxBarsPerGroup} disabled={effectiveFallback} onCommit={setMaxBarsUser} style={{ width: '4em' }} /></label>
          <span className="hint-text" style={{ margin: 0 }}>자동 기준: 화면 1장 분량{groupSizeUser == null ? ' (목표 ' + autoGroupSize + '마디, 최대 ' + (autoGroupSize + 2) + ')' : ''}</span>
          <label>그룹 기준:
            <select value={groupBasis} onChange={e => setGroupBasis(e.target.value)} disabled={effectiveFallback} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="auto">자동 (신뢰도 낮으면 폭 기준)</option>
              <option value="bar">마디선 기준</option>
              <option value="width">폭 기준</option>
            </select>
          </label>
          <span className="save-msg">{effectiveFallback ? '전체 1개 그룹' : (useBarGroups ? (measureCount + '마디 → ' + groups.length + '개 그룹') : ('폭 기준 분할 → ' + groups.length + '개 그룹'))}</span>
        </div>
      </div>

      {fixSeams.length > 0 && curSeam && (
        <div className="block" style={{ borderColor: '#c0392b' }} ref={zoomBlockRef}>
          <div className="block-head"><span>이음새 미세 조정 — 수정 필요 이음새 {fixSeams.length}개</span></div>
          <p className="hint-text">
            선택한 이음새 {circled(fixSeams.findIndex(s => s.i === curSeam.i) + 1)}: {curSeam.reason || ('NCC ' + (curSeam.score != null ? curSeam.score.toFixed(2) : '-') + ' (기준 0.70 미만)')}. 아래 확대 미리보기를 클릭한 뒤 ←/→ 키(1px, Shift+키는 10px) 또는 버튼으로 오른쪽 타일의 위치를 맞추세요. 초록선이 현재 이음새입니다.
          </p>
          <div className="toolbar">
            {fixSeams.map((s, n) => (
              <button key={s.i} className="icon-btn" style={s.i === curSeam.i ? { borderColor: 'var(--accent)', color: 'var(--accent)' } : undefined}
                onClick={() => selectSeam(s.i)}>{circled(n + 1)} 이음새 {s.i + 1}</button>
            ))}
          </div>
          <div tabIndex={0} onKeyDown={onSeamKey} style={{ outline: 'none' }}>
            <SeamZoom canvas={stitchedCanvas} pos={curSeam.pos} space={detection.system ? detection.system.space : 12} />
          </div>
          <div className="toolbar">
            <button className="icon-btn" onClick={() => nudgeSeam(10)}>⇤ 10px</button>
            <button className="icon-btn" onClick={() => nudgeSeam(1)}>← 1px</button>
            <button className="icon-btn" onClick={() => nudgeSeam(-1)}>→ 1px</button>
            <button className="icon-btn" onClick={() => nudgeSeam(-10)}>10px ⇥</button>
            <label><input type="radio" checked={seamAdjAll} onChange={() => setSeamAdjAll(true)} /> 전체 이음새에 적용</label>
            <label><input type="radio" checked={!seamAdjAll} onChange={() => setSeamAdjAll(false)} /> 이 이음새만</label>
          </div>
        </div>
      )}

      <div className="toolbar">
        <label><input type="checkbox" checked={showAllFix} onChange={e => setShowAllFix(e.target.checked)} /> 모든 그룹에 수동 보정 버튼 표시 (기본: 자동 처리로 해결 안 된 그룹에만 표시)</label>
      </div>

      <div className="list" ref={groupResultRef}>
        {(() => {
          // 마지막(또는 마디 수가 적은) 그룹이 확대되어 보이지 않도록 — 모든 그룹에 같은 displayScale(px 단위)을 적용.
          function nativeSize(g) {
            return direction === 'vertical'
              ? { w: stitchedCanvas.width, h: g.endX - g.startX }
              : { w: g.endX - g.startX, h: stitchedCanvas.height };
          }
          const containerW = (groupResultRef.current && groupResultRef.current.clientWidth) || 900;
          const widestW = Math.max(1, ...groupsWithMeta.map(g => nativeSize(g).w));
          const displayScale = Math.min(1, containerW / widestW);
          return groupsWithMeta.map((g, idx) => {
            const canvas = g.override ? null : cropGroupCanvas(stitchedCanvas, direction, g);
            const src = g.override || (canvas && canvas.toDataURL('image/png'));
            const nsize = nativeSize(g);
            const imgStyle = g.override
              ? undefined
              : { width: Math.round(nsize.w * displayScale) + 'px', height: Math.round(nsize.h * displayScale) + 'px', maxWidth: 'none' };
            const flagged = g.lowConfidence || g.suspect;
            return (
              <div key={g.key} className="block" style={flagged ? { borderColor: '#c0392b', borderWidth: '2px' } : undefined}>
                <div className="block-head">
                  <span>
                    그룹 {idx + 1}: {g.whole ? '전체 (마디선 미사용)' : (g.byWidth ? '폭 기준 분할' : (g.count + '마디'))}
                    <span className="save-msg"> · {g.timeRange.start.toFixed(2)}s ~ {g.timeRange.end.toFixed(2)}s</span>
                    {g.lowConfidence && <b style={{ color: '#c0392b' }}> · 저신뢰 구간 ({seamsV.some(s => s.cut && s.flagged && s.pos > g.startX - 1 && s.pos < g.endX + 1) ? '이음새 검증 실패' : 'NCC ' + g.confidence.toFixed(2)})</b>}
                    {g.suspect && <b style={{ color: '#c0392b' }}> · 누락 의심 (시간 대비 내용량 불일치)</b>}
                    {g.override && <span className="save-msg"> · 수동으로 다시 만듦</span>}
                  </span>
                  {(flagged || showAllFix) && (
                    <button className="icon-btn" onClick={() => setOverrideOpenKey(overrideOpenKey === g.key ? null : g.key)}>
                      이 구간 다시 만들기
                    </button>
                  )}
                </div>
                {src && <img src={src} className="merge-preview-img" style={imgStyle} alt={'그룹 ' + (idx + 1)} />}
                {overrideOpenKey === g.key && (
                  <GroupOverridePanel videoRef={videoRef} scrollDefaults={scrollDefaults} roi={roi}
                    direction={direction} timeRange={g.timeRange} groupImgSrc={src}
                    timeAtFrac={frac => timeForGlobalX(markerData, placed, g.startX + frac * (g.endX - g.startX))}
                    onApply={dataUrl => applyOverride(g.key, dataUrl)}
                    onApplyStitch={applyStitchPatch}
                    onCancel={() => setOverrideOpenKey(null)} />
                )}
              </div>
            );
          });
        })()}
      </div>

      <div className="toolbar">
        <button className="icon-btn" onClick={onBack} disabled={sending}>← 대표 프레임 다시 고르기</button>
        <button className="icon-btn" onClick={onModeBack} disabled={sending}>모드 다시 선택</button>
        <button onClick={handleSendToScoreBuilder} disabled={sending}>
          {sending ? '전달 중...' : 'TAB 악보 만들기로 넘기기 (' + groups.length + '개) →'}
        </button>
      </div>
    </div>
  );
}

// ================================================================================================
// 연속 이동형(flow) 모드 — 악보가 멈춤 없이 가로로 계속 흐르는 영상 (오른쪽에서 들어와 왼쪽으로 나감)
// 1단계: 이동량 추적 + 악보 스트립 재구성. 기존 페이지전환형/스크롤형 로직은 건드리지 않고(공용 함수는 호출만)
// 이 모드 전용 함수는 모두 flow 접두어로 독립 구현한다.
// ================================================================================================

const flowInternalPlayRef = { current: false }; // 분석 패스(rVFC)가 내부적으로 재생 중임을 알리는 플래그
function flowRvfcSupported(video) { return typeof video.requestVideoFrameCallback === 'function'; }
function flowYield() { return new Promise(r => setTimeout(r, 0)); }

// 순차 재생 기반 프레임 수집 — requestVideoFrameCallback으로 프레임이 실제로 표시될 때마다 호출되며 미디어 시간
// 간격 ≥ minGap인 프레임만 onFrame(mediaTime)으로 넘긴다(seek 금지: 시작 위치를 잡을 때 한 번만 seek).
// 미지원 브라우저는 기존 seek 방식으로 폴백한다.
// 분석용 재생 패스 (모든 모드 공통)
//  - 탭이 가려지면(다른 탭·창 최소화) 브라우저가 영상을 멈추거나 프레임을 주지 않는다(사파리·크롬 모두).
//    → 가려지는 즉시 일시정지하고, 돌아오면 마지막으로 읽은 시점부터 이어서 재생한다. onPause(true/false)로 화면에 알린다.
//  - 감시: 보이는 상태에서 3초 넘게 프레임이 안 오면 다시 재생, 그래도 안 되면 조금 건너뛴다. 끝 근처면 끝낸다 (멈춤 방지)
//  - 배속 자동 조절: 장면 간격이 목표(minGap)의 2배를 넘으면(4K 등 디코딩이 못 따라감) 배속을 낮춘다
//  - stats: { pauses, stalls, rateChanges:[{t, rate}], gaps }
function flowPauseNotice(on) {
  let el = document.getElementById('analysis-pause-notice');
  if (on) {
    if (!el) {
      el = document.createElement('div');
      el.id = 'analysis-pause-notice';
      el.style.cssText = 'position:fixed;left:50%;top:12px;transform:translateX(-50%);z-index:9999;background:#b45309;color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;box-shadow:0 4px 14px rgba(0,0,0,.25);max-width:90vw;text-align:center';
      document.body.appendChild(el);
    }
    el.textContent = '다른 탭으로 이동해 분석을 일시정지했습니다 — 이 탭에서 이어서 진행합니다';
    el.style.display = 'block';
    clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; }, 6000);
  } else if (el) {
    el.textContent = '분석을 이어서 진행합니다';
    clearTimeout(el._t); el._t = setTimeout(() => { el.style.display = 'none'; }, 2500);
  }
}
// 화면 지문: 영상 전체를 16×9로 줄인 밝기 값을 숫자 하나로 — "같은 그림이 다시 나왔는지"만 본다
const flowFpCanvas = typeof document !== 'undefined' ? document.createElement('canvas') : null;
function flowFrameFingerprint(video) {
  const c = flowFpCanvas; c.width = 16; c.height = 9;
  const g = c.getContext('2d', { willReadFrequently: true });
  g.drawImage(video, 0, 0, 16, 9);
  const d = g.getImageData(0, 0, 16, 9).data;
  let h = 2166136261;
  for (let i = 0; i < d.length; i += 4) { h ^= (d[i] + d[i + 1] + d[i + 2]); h = Math.imul(h, 16777619); }
  return h >>> 0;
}
// 한 장씩 이동하며 읽기 (빠른 재생을 못 쓰는 브라우저·상황용) — 느리지만 확실하다
async function flowSeekPass(video, { startT, endT, minGap, onFrame, onProgress, abortRef, st }) {
  const span = Math.max(0.001, endT - startT);
  for (let t = startT; t <= endT && !(abortRef && abortRef.current); t += minGap) {
    await seekRobust(video, t);
    onFrame(t); st.frames++;
    if (onProgress) onProgress((t - startT) / span);
  }
}
async function flowPlayPass(video, { startT, endT, rate, minGap, onFrame, onProgress, abortRef, maxRate, onPause, stats, onRestart, onNotice }) {
  onPause = onPause || flowPauseNotice;
  const span = Math.max(0.001, endT - startT);
  const st = stats || {};
  const nested = !!(stats && stats._nested);
  if (!nested) { st.pauses = 0; st.stalls = 0; st.rateChanges = []; st.frames = 0; st.staleFallback = false; st.sparseFallback = false; }
  if (!flowRvfcSupported(video)) {
    await flowSeekPass(video, { startT, endT, minGap, onFrame, onProgress, abortRef, st });
    return;
  }
  video.muted = true;
  let curRate = Math.max(0.25, Math.min(maxRate || 3, rate || 1));
  video.playbackRate = curRate;
  st.rateChanges.push({ t: startT, rate: curRate });
  let sparse = false;
  flowInternalPlayRef.current = true; // 분석 패스의 내부 재생 — play 가드가 막지 않게 한다
  let failure = null;
  let onVis = null, watchdog = null;
  try {
    await seekSafe(video, startT);
    await new Promise(resolve => {
      let last = -Infinity, done = false, hiddenPaused = false, resuming = false;
      let lastCbWall = performance.now(), stallTries = 0, pending = false;
      const gaps = [];
      // 사파리(4K 등)는 빠른 재생 중 화면을 읽으면 대부분 '예전에 그려 둔 같은 장면'을 돌려주고 가끔만 진짜 장면을 준다
      // (진단: 7초마다 바뀌는 페이지가 10초에 한 번만 바뀐 것으로 읽힘 → 대표 프레임 1장). 지문이 A→B→A로 정확히 되돌아가는 일이
      // 두 번 생기면 이 상태로 보고, 빠른 재생을 멈춘 뒤 처음부터 한 장씩 이동하며 읽는다
      const fps = [];
      let aba = 0;
      const req = () => { if (!pending && !done) { pending = true; video.requestVideoFrameCallback(cb); } };
      const finish = () => {
        if (done) return;
        done = true;
        video.pause();
        video.removeEventListener('ended', finish);
        resolve();
      };
      video.addEventListener('ended', finish);
      const resumeFrom = async t => {
        if (done || resuming) return;
        resuming = true;
        try {
          await seekSafe(video, Math.max(startT, t));
          video.playbackRate = curRate;
          req();
          await video.play().catch(() => {});
          lastCbWall = performance.now();
        } finally { resuming = false; }
      };
      onVis = () => {
        if (done) return;
        if (document.hidden) {
          if (!hiddenPaused) { hiddenPaused = true; st.pauses++; video.pause(); onPause && onPause(true); }
        } else if (hiddenPaused) {
          hiddenPaused = false; onPause && onPause(false);
          resumeFrom(last > -Infinity ? last : startT);
        }
      };
      document.addEventListener('visibilitychange', onVis);
      watchdog = setInterval(() => {
        if (done || hiddenPaused || resuming) return;
        if (abortRef && abortRef.current) { finish(); return; }
        if (performance.now() - lastCbWall < 3000) return;
        const t = Math.max(last, video.currentTime || 0);
        if (t >= endT - 0.5 || video.ended) { finish(); return; } // 끝 근처에서 멈춤 → 끝낸다
        st.stalls++;
        stallTries++;
        if (stallTries > 4) { finish(); return; }
        // 1·2회: 그 자리에서 다시 재생, 3회 이상: 조금 건너뛰어 재생
        resumeFrom(stallTries <= 2 ? t : t + minGap * 2 * stallTries);
      }, 1000);
      const cb = (now, meta) => {
        pending = false;
        if (done) return;
        lastCbWall = performance.now();
        if (abortRef && abortRef.current) { finish(); return; }
        if (hiddenPaused) return;
        const t = meta.mediaTime;
        if (t - last >= minGap) {
          if (last > -Infinity && t > last) {
            gaps.push(t - last);
            // 사파리는 빠른 재생(2배 이상)에서 일부 영상의 중간 프레임을 아예 건너뛰고 몇 초에 한 장만 준다
            // (진단: 4배속, 59초 영상에서 약 5초 간격으로 12장 → 흐르는 악보를 이어 붙일 수 없음 → "TAB 영역을 다시 지정").
            // 처음 4장 간격이 0.5초(또는 목표의 3배)를 넘으면 바로 멈추고 1배속으로 처음부터 다시 읽는다
            if ((curRate > 1 || nested) && st.frames >= 4 && st.frames <= 12) {
              const recent = gaps.slice(-4).sort((x, y) => x - y);
              const med = (recent[1] + recent[2]) / 2;
              if (recent.length >= 4 && med > Math.max(0.5, minGap * 3)) { sparse = true; finish(); return; }
            }
            if (gaps.length >= 12) {
              const g = gaps.slice().sort((x, y) => x - y)[gaps.length >> 1];
              gaps.length = 0;
              if (g > minGap * 2 && curRate > 1) {
                curRate = Math.max(1, Math.round(curRate * 0.7 * 10) / 10);
                video.playbackRate = curRate;
                st.rateChanges.push({ t, rate: curRate });
              }
            }
          }
          last = t;
          stallTries = 0;
          try {
            const fp = flowFrameFingerprint(video);
            fps.push(fp);
            const n = fps.length;
            if (n >= 3 && fps[n - 3] === fps[n - 1] && fps[n - 2] !== fps[n - 1]) aba++;
            if (aba >= 2) { st.staleFallback = true; finish(); return; }
          } catch (e) { /* 지문 실패는 무시 */ }
          try { onFrame(t); st.frames++; } catch (err) { failure = err; finish(); return; }
          if (onProgress) onProgress(Math.min(1, (t - startT) / span));
        }
        if (t >= endT) { finish(); return; }
        req();
      };
      req();
      if (document.hidden) { hiddenPaused = true; st.pauses++; onPause && onPause(true); }
      else video.play().catch(err => { failure = err; finish(); });
    });
  } finally {
    // 정상 종료·에러·취소 모두 항상 복구
    if (onVis) document.removeEventListener('visibilitychange', onVis);
    if (watchdog) clearInterval(watchdog);
    flowInternalPlayRef.current = false;
    video.pause(); video.muted = true; video.playbackRate = 1;
  }
  if (failure) throw failure;
  if (sparse && nested && !(abortRef && abortRef.current)) {
    // 1배속에서도 몇 초에 한 장 → 처리가 재생을 못 따라가는 경우: 한 장씩 이동하며 읽는다
    if (onNotice) onNotice('1배속에서도 장면을 건너뛰어 한 장씩 이동하며 읽습니다 — 시간이 더 걸립니다');
    if (onRestart) onRestart();
    st.frames = 0; st.seekFallback = true;
    await flowSeekPass(video, { startT, endT, minGap: Math.max(minGap, 0.1), onFrame, onProgress, abortRef, st });
    return;
  }
  if (sparse && !(abortRef && abortRef.current)) {
    st.sparseFallback = true;
    const note = '이 브라우저는 빠르게 재생하면 영상 장면을 몇 초에 한 장만 읽어서(사파리에서 생김) 1배속으로 처음부터 다시 읽습니다 — 시간이 더 걸립니다';
    if (onNotice) onNotice(note); else console.warn(note);
    if (onRestart) onRestart();
    st.frames = 0;
    st._nested = true;
    try {
      await flowPlayPass(video, { startT, endT, rate: 1, maxRate: 1, minGap, onFrame, onProgress, abortRef, onPause, stats: st, onRestart, onNotice });
    } finally { delete st._nested; }
    return;
  }
  if (st.staleFallback && !(abortRef && abortRef.current)) {
    const note = '이 브라우저는 빠르게 재생하는 영상의 화면을 제대로 읽지 못해(사파리·4K에서 생김) 한 장씩 이동하며 다시 읽습니다 — 시간이 더 걸립니다';
    if (onNotice) onNotice(note); else console.warn(note);
    if (onRestart) onRestart();
    st.frames = 0;
    await flowSeekPass(video, { startT, endT, minGap, onFrame, onProgress, abortRef, st });
  }
}

// ---- 1패스: ROI를 저해상도 그레이로 수집 ----
function flowMakeLowCapture(video, roi, maxW) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const scale = Math.min(1, maxW / rw);
  const w = Math.max(8, Math.round(rw * scale)), h = Math.max(4, Math.round(rh * scale));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  return t => {
    ctx.drawImage(video, rx0, ry0, rw, rh, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    const gray = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) gray[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
    return { t, gray, w, h };
  };
}

// 오선 행 평균 제거(기존 scrollRemoveAxisMean과 같은 방식: 행별 평균을 빼서 오선을 없앰) — 행 단위 Float32 배열로
function flowToZeroMeanRows(sample) {
  const { gray, w, h } = sample;
  const f = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    let m = 0;
    const b = y * w;
    for (let x = 0; x < w; x++) m += gray[b + x];
    m /= w;
    for (let x = 0; x < w; x++) f[b + x] = gray[b + x] - m;
  }
  return f;
}

// 정적 열 자동 감지 — "이웃 열은 크게 변하는데 프레임 간 거의 변하지 않는 열"(재생바, 좌우 잘림 경계, 고정 오버레이)
function flowDetectStaticCols(samples, w, h) {
  const mask = new Uint8Array(w);
  const n = samples.length;
  if (n < 6) return mask;
  const diffs = [];
  for (let k = 1; k < n; k++) {
    let sum = 0;
    const a = samples[k - 1].gray, b = samples[k].gray;
    for (let i = 0; i < a.length; i += 4) sum += Math.abs(a[i] - b[i]);
    diffs.push({ k, v: sum });
  }
  diffs.sort((p, q) => q.v - p.v);
  const picked = [];
  for (const d of diffs) {
    if (picked.length >= 60) break;
    if (picked.every(p => Math.abs(p - d.k) >= 3)) picked.push(d.k);
  }
  if (picked.length < 5) return mask;
  const tc = new Float64Array(w);
  for (const k of picked) {
    const fa = flowToZeroMeanRows(samples[k - 1]), fb = flowToZeroMeanRows(samples[k]);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) tc[x] += Math.abs(fb[y * w + x] - fa[y * w + x]);
  }
  for (let x = 0; x < w; x++) tc[x] /= (picked.length * h);
  const isStatic = new Uint8Array(w);
  for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let dx = -10; dx <= 10; dx++) {
      if (Math.abs(dx) <= 2) continue;
      const xx = x + dx;
      if (xx >= 0 && xx < w) { s += tc[xx]; c++; }
    }
    const ref = c ? s / c : 0;
    if (ref >= 2 && tc[x] < 0.25 * ref) isStatic[x] = 1;
  }
  for (let x = 0; x < w; x++) if (isStatic[x] || (x > 0 && isStatic[x - 1]) || (x + 1 < w && isStatic[x + 1])) mask[x] = 1;
  return mask;
}

// B(x) = A(x + s) 관계(내용이 왼쪽으로 s만큼 이동)에서의 NCC. 마스크된 열(정적 열)은 양쪽에서 제외.
function flowNccAt(a, b, w, h, mask, s) {
  let num = 0, da = 0, db = 0;
  const xe = w - s;
  for (let y = 0; y < h; y++) {
    const base = y * w;
    for (let x = 0; x < xe; x++) {
      if (mask[x] || mask[x + s]) continue;
      const va = a[base + x + s], vb = b[base + x];
      num += va * vb; da += va * va; db += vb * vb;
    }
  }
  if (da < 1e-6 || db < 1e-6) return -1;
  return num / Math.sqrt(da * db);
}

// 정수 shift 범위 탐색 + 포물선 보정(서브픽셀) + 신뢰도(피크 NCC, 2위 피크와의 차이)
function flowFindShift(a, b, w, h, mask, sMin, sMax) {
  sMin = Math.max(0, Math.floor(sMin));
  sMax = Math.min(w - 8, Math.ceil(sMax));
  if (sMax < sMin) sMax = sMin;
  const lo = Math.max(0, sMin - 1), hi = Math.min(w - 8, sMax + 1);
  const vals = [];
  for (let s = lo; s <= hi; s++) vals.push(flowNccAt(a, b, w, h, mask, s));
  let bi = 0;
  for (let i = 1; i < vals.length; i++) if (vals[i] > vals[bi]) bi = i;
  const peak = vals[bi];
  let second = -1;
  for (let i = 0; i < vals.length; i++) if (Math.abs(i - bi) >= 3 && vals[i] > second) second = vals[i];
  let shift = lo + bi;
  if (bi > 0 && bi < vals.length - 1) {
    const l = vals[bi - 1], r = vals[bi + 1], den = l - 2 * peak + r;
    if (Math.abs(den) > 1e-9) shift += Math.max(-0.5, Math.min(0.5, 0.5 * (l - r) / den));
  }
  const margin = peak - Math.max(second, 0);
  return { shift, peak, second, margin, ok: peak >= 0.5 && margin >= 0.1 };
}

// 샘플 시각들에서 누적 이동량 x(t)(원본 해상도 px)를 구한다.
async function flowTrackMotion(samples, nativeW, playbarFrac, abortRef, onProgress) {
  const n = samples.length;
  const w = samples[0].w, h = samples[0].h;
  const scale = nativeW / w;
  const staticLow = flowDetectStaticCols(samples, w, h);
  const mask = new Uint8Array(staticLow);
  let barCols = null;
  if (playbarFrac != null) {
    const c = Math.round(playbarFrac * w), r = Math.max(1, Math.ceil(4 / scale));
    for (let x = Math.max(0, c - r); x <= Math.min(w - 1, c + r); x++) mask[x] = 1;
    barCols = [(c - r) * scale, (c + r + 1) * scale];
  }
  const tArr = [samples[0].t], shiftNative = [0], conf = [1], interp = [false], margin = [1];
  let vPrev = null; // 저해상도 px/s
  let prevF = flowToZeroMeanRows(samples[0]);
  for (let k = 1; k < n; k++) {
    if (abortRef && abortRef.current) return null;
    const curF = flowToZeroMeanRows(samples[k]);
    const dt = Math.max(1e-3, samples[k].t - samples[k - 1].t);
    let sMin, sMax;
    if (vPrev == null) { sMin = 0; sMax = 0.2 * w; }
    else { const e = vPrev * dt; sMin = Math.max(0, e * 0.5 - 1); sMax = e * 1.5 + Math.max(2, 0.03 * w); }
    let r = flowFindShift(prevF, curF, w, h, mask, sMin, sMax);
    if (!r.ok && vPrev != null) {
      const wide = flowFindShift(prevF, curF, w, h, mask, 0, 0.3 * w); // 속도가 급변했을 수 있어 한 번 넓혀 재시도
      if (wide.ok) r = wide;
    }
    let sLow, isInterp = false;
    if (r.ok) { sLow = r.shift; vPrev = sLow / dt; }
    else { sLow = vPrev != null ? vPrev * dt : 0; isInterp = true; } // 쉼표·내용 없음 구간: 직전 속도로 보간
    tArr.push(samples[k].t); shiftNative.push(sLow * scale); conf.push(r.peak); margin.push(r.margin); interp.push(isInterp);
    prevF = curF;
    if (k % 40 === 0) { if (onProgress) onProgress(k / n); await flowYield(); }
  }
  const X = [0];
  for (let k = 1; k < n; k++) X.push(X[k - 1] + shiftNative[k]);
  // 영상 앞뒤 정지 구간(이동 0) 제외 — 신뢰할 수 있는 샘플에서 이동이 있는 첫/마지막 구간
  const moving = k => !interp[k] && shiftNative[k] > 0.3 * scale;
  let k0 = -1, k1 = -1;
  for (let k = 1; k < n; k++) if (moving(k)) { k0 = k - 1; break; }
  for (let k = n - 1; k >= 1; k--) if (moving(k)) { k1 = k; break; }
  if (k0 < 0 || k1 <= k0) return null;
  const staticRanges = [];
  let sx = -1;
  for (let x = 0; x <= w; x++) {
    if (x < w && staticLow[x]) { if (sx < 0) sx = x; }
    else if (sx >= 0) { staticRanges.push([sx * scale, x * scale]); sx = -1; }
  }
  return { t: tArr, X, shiftNative, conf, margin, interp, k0, k1, staticRanges, barCols, nativeW, scale, w0: w };
}

function flowInterpX(track, t) {
  const T = track.t, X = track.X;
  if (t <= T[0]) return X[0];
  if (t >= T[T.length - 1]) return X[X.length - 1];
  let lo = 0, hi = T.length - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (T[m] <= t) lo = m; else hi = m; }
  const f = (t - T[lo]) / Math.max(1e-9, T[hi] - T[lo]);
  return X[lo] + f * (X[hi] - X[lo]);
}

// ---- 2패스: 새로 들어온 폭만큼의 열 슬라이스를 원본 해상도로 이어 붙임 ----
// 긴 스트립은 캔버스 최대 크기를 넘을 수 있어 폭 6000px 단위의 조각(chunk) 목록으로 만든다.
function flowChunkBuilder(h, chunkW) {
  const chunks = [];
  let cur = null, curW = 0;
  const startChunk = () => {
    cur = document.createElement('canvas');
    cur.width = chunkW; cur.height = h;
    const c = cur.getContext('2d');
    c.fillStyle = '#ffffff'; c.fillRect(0, 0, chunkW, h);
    curW = 0;
    chunks.push(cur);
  };
  return {
    append(src, sx, sw) {
      sw = Math.round(sw); sx = Math.round(sx);
      while (sw > 0) {
        if (!cur || curW >= chunkW) startChunk();
        const take = Math.min(sw, chunkW - curW);
        cur.getContext('2d').drawImage(src, sx, 0, take, h, curW, 0, take, h);
        curW += take; sx += take; sw -= take;
      }
    },
    pad(sw) {
      sw = Math.round(sw);
      while (sw > 0) {
        if (!cur || curW >= chunkW) startChunk();
        const take = Math.min(sw, chunkW - curW);
        curW += take; sw -= take; // 흰색 그대로
      }
    },
    finish() {
      if (cur && curW < chunkW) {
        const t = document.createElement('canvas');
        t.width = Math.max(1, curW); t.height = h;
        t.getContext('2d').drawImage(cur, 0, 0);
        chunks[chunks.length - 1] = t;
      }
      return chunks;
    },
    total() { return (chunks.length - 1) * chunkW + curW; },
  };
}

// 슬라이스 소스 위치(u0): 기본은 ROI 오른쪽 가장자리 직전의 깨끗한 구간(오른쪽 10~35% → 소스 [0.65W, 0.90W], u0=0.90W).
// 재생바/정적 열과 겹치면 겹치지 않는 쪽으로 옮긴다(오른쪽으로 옮길 수 있으면 오른쪽, 아니면 왼쪽).
function flowChooseSourceEdge(W, maxDelta, barRanges) {
  const winW = Math.min(W * 0.35, Math.max(maxDelta, 4));
  const hits = u0 => barRanges.some(([a, b]) => b + 2 > u0 - winW && a - 2 < u0);
  const def = Math.round(W * 0.9);
  if (!barRanges.length || !hits(def)) return def;
  const right = Math.round(Math.max(...barRanges.map(r => r[1])) + 2 + winW);
  if (right <= W && !hits(right)) return right;
  const left = Math.round(Math.min(...barRanges.map(r => r[0])) - 2);
  if (left >= winW && !hits(left)) return left;
  return def;
}

async function flowRebuildStrip({ video, roi, track, medianObs, rate, abortRef, onProgress, prepareEdge }) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const W = Math.max(1, Math.round(rw)), H = Math.max(1, Math.round(rh));
  const confShifts = [];
  for (let k = track.k0 + 1; k <= track.k1; k++) if (!track.interp[k]) confShifts.push(track.shiftNative[k]);
  confShifts.sort((a, b) => a - b);
  const maxDelta = confShifts.length ? confShifts[Math.floor(confShifts.length * 0.95)] : W * 0.1;
  const barRanges = track.staticRanges.map(r => [r[0], r[1]]);
  if (track.barCols) barRanges.push(track.barCols);
  const u0 = Math.max(2, Math.min(W - 1, flowChooseSourceEdge(W, maxDelta, barRanges)));
  const builder = flowChunkBuilder(H, 6000);
  const pool = [];
  for (let i = 0; i < 4; i++) { const c = document.createElement('canvas'); c.width = W; c.height = H; pool.push(c); }
  let poolIdx = 0;
  const tStart = track.t[track.k0], tEnd = track.t[track.k1];
  const Xref = track.X[track.k0];
  let Gprev = null, last = null, gaps = 0, frames = 0, tFirst = null;
  const hist = []; // medianObs용: [{cap, G}]

  const medianSlice = (prev, center, next, wj, wn) => {
    const out = document.createElement('canvas');
    out.width = wj; out.height = H;
    const octx = out.getContext('2d');
    const img = octx.createImageData(wj, H);
    const read = (f, sx) => {
      if (!f || sx < 0 || sx + wj > W) return null;
      return f.cap.getContext('2d').getImageData(sx, 0, wj, H).data;
    };
    const cen = read(center, u0 - wj);
    const pre = prev ? read(prev, u0) : null; // 직전 프레임은 같은 내용이 오른쪽(+wj)에 있다
    const nxt = (next && wn >= 0) ? read(next, u0 - wj - wn) : null;
    const srcs = [cen, pre, nxt].filter(Boolean);
    const v = [0, 0, 0];
    for (let i = 0; i < img.data.length; i++) {
      if (srcs.length === 1) { img.data[i] = srcs[0][i]; continue; }
      for (let j = 0; j < srcs.length; j++) v[j] = srcs[j][i];
      const arr = srcs.length === 2 ? [v[0], v[1]] : [v[0], v[1], v[2]];
      arr.sort((a, b) => a - b);
      img.data[i] = arr[srcs.length === 2 ? 1 : 1];
    }
    octx.putImageData(img, 0, 0);
    return out;
  };

  const emitMedianFor = (idx, finalFlush) => {
    // hist[idx]를 중심으로, 이전/다음 프레임과 픽셀별 중앙값
    const c = hist[idx];
    const p = idx > 0 ? hist[idx - 1] : null, nx = idx + 1 < hist.length ? hist[idx + 1] : null;
    const wj = c.G - (p ? p.G : c.G);
    if (wj <= 0) return;
    const w2 = Math.min(wj, u0);
    if (wj > w2) { builder.pad(wj - w2); gaps += wj - w2; }
    const wn = nx ? nx.G - c.G : -1;
    builder.append(medianSlice(p, c, nx, w2, wn), 0, w2);
  };

  const onFrame = t => {
    if (t < tStart - 1e-6 || t > tEnd + 0.25) return;
    const cap = pool[poolIdx++ % pool.length];
    cap.getContext('2d').drawImage(video, rx0, ry0, rw, rh, 0, 0, W, H);
    const G = Math.round(flowInterpX(track, t) - Xref);
    frames++;
    last = cap;
    if (Gprev == null) {
      if (prepareEdge) prepareEdge(cap); // 재생바 자동 제거(첫 화면 왼쪽 부분)
      builder.append(cap, 0, u0); // 처음 화면에서 u0 왼쪽(이미 화면에 있던 부분)
      tFirst = t;
      Gprev = G;
      if (medianObs) hist.push({ cap, G });
      return;
    }
    if (medianObs) {
      hist.push({ cap, G });
      if (hist.length >= 3) { emitMedianFor(hist.length - 2); if (hist.length > 3) hist.shift(); }
      Gprev = G;
      return;
    }
    const w = G - Gprev;
    if (w > 0) {
      const w2 = Math.min(w, u0);
      if (w > w2) { builder.pad(w - w2); gaps += w - w2; }
      builder.append(cap, u0 - w2, w2);
      Gprev = G; // 서브픽셀 오차는 누적 정수 위치(G)에 이월된다
    }
  };

  await flowPlayPass(video, {
    startT: Math.max(0, tStart - 0.05), endT: tEnd + 0.25, rate, minGap: 0.1, abortRef, onFrame,
    onProgress: f => onProgress && onProgress(f),
  });
  if (abortRef && abortRef.current) return null;
  if (!last) throw new Error('스트립 재구성 중 프레임을 얻지 못했습니다.');
  if (medianObs && hist.length >= 2) emitMedianFor(hist.length - 1, true);
  if (prepareEdge) prepareEdge(last); // 재생바 자동 제거(마지막 화면 오른쪽 부분)
  builder.append(last, u0, W - u0); // 마지막 화면에서 u0 오른쪽(아직 지나가지 않은 부분)
  return { chunks: builder.finish(), totalW: builder.total(), H, u0, maxDelta, gaps, frames, barRanges, tFirst };
}

// ---- 전체 파이프라인 ----
async function flowRunPipeline({ video, roi, playbarFrac, rate, medianObs, scrollDefaults, abortRef, onProgress, startT, endT, playbarRemoval }) {
  const { rw, rh } = roiRectPx(video, roi);
  const nativeW = Math.round(rw);
  const dur = video.duration;
  const usedRvfc = flowRvfcSupported(video);
  const samples = [];
  const cap = flowMakeLowCapture(video, roi, 480);
  const t0 = performance.now();
  let lastPct = -1;
  const report = (label, f, lo, hi) => {
    const pct = Math.round((lo + (hi - lo) * Math.max(0, Math.min(1, f))) * 100);
    if (pct !== lastPct) { lastPct = pct; onProgress(label, pct); }
  };
  await flowPlayPass(video, {
    startT: startT != null ? startT : 0, endT: endT != null ? endT : dur, rate, minGap: 0.1, abortRef,
    onFrame: t => samples.push(cap(t)),
    onProgress: f => report('1/3 이동량 추적용 프레임 수집 (순차 재생)', f, 0, 0.35),
  });
  if (abortRef.current) return null;
  if (samples.length < 6) throw new Error('수집된 프레임이 너무 적습니다.');
  const track = await flowTrackMotion(samples, nativeW, playbarFrac, abortRef, f => report('2/3 이동량 계산 (NCC)', f, 0.35, 0.5));
  if (abortRef.current) return null;
  if (!track) throw new Error('가로 이동이 감지되지 않았습니다. ROI(영역)나 영상을 확인하세요.');
  const strip = await flowRebuildStrip({
    video, roi, track, medianObs, rate, abortRef,
    prepareEdge: playbarRemoval ? (c => flowRemovePlaybarCanvas(c, playbarRemoval.cols, playbarRemoval.band)) : null,
    onProgress: f => report('3/3 스트립 재구성 (순차 재생)', f, 0.5, 0.92),
  });
  if (!strip) return null;
  // 전처리: 원본 해상도에서 조각별로 (반전 여부는 첫 조각 기준으로 전체에 동일 적용). 임계값·잡티 제거·선 복원은 기존 함수 그대로.
  onProgress('전처리 적용 중...', 93);
  const sd = scrollDefaults;
  const avg = computeAvgLuminanceFromCanvas(strip.chunks[0]);
  const opts = { ...sd, invertMode: sd.invertMode === 'auto' ? (avg < 128 ? 'on' : 'off') : sd.invertMode };
  for (let i = 0; i < strip.chunks.length; i++) {
    scrollApplyPreprocInPlace(strip.chunks[i], opts);
    await flowYield();
  }
  onProgress('완료', 100);
  const confCnt = track.interp.slice(track.k0 + 1, track.k1 + 1).filter(Boolean).length;
  return {
    track, chunks: strip.chunks, totalW: strip.totalW, H: strip.H, tFirst: strip.tFirst,
    stats: {
      duration: dur, samples: samples.length, usedRvfc, rate, elapsed: (performance.now() - t0) / 1000,
      motionStart: track.t[track.k0], motionEnd: track.t[track.k1],
      lowConfCount: confCnt, moveSamples: track.k1 - track.k0,
      u0: strip.u0, maxDelta: strip.maxDelta, gaps: strip.gaps, medianObs,
      staticRanges: track.staticRanges, barCols: track.barCols,
    },
  };
}

// x(t) 그래프 — 위: 누적 이동량(px), 아래: 속도(px/s). 신뢰도 낮은(보간된) 구간은 붉은 음영, 제외된 앞/뒤 정지 구간은 회색 음영.
function flowDrawGraph(canvas, track) {
  const w = canvas.width = canvas.clientWidth || 800;
  const h = canvas.height = 260;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, w, h);
  const T = track.t, n = T.length;
  const t0 = T[0], t1 = T[n - 1];
  const px = t => 40 + ((t - t0) / Math.max(1e-9, t1 - t0)) * (w - 50);
  const topY0 = 10, topY1 = 120, botY0 = 140, botY1 = 250;
  const Xmax = Math.max(1, track.X[n - 1]);
  const speed = track.shiftNative.map((s, k) => (k === 0 ? 0 : s / Math.max(1e-3, T[k] - T[k - 1])));
  const Vmax = Math.max(1, ...speed) * 1.1;
  // 음영
  for (let k = 1; k < n; k++) {
    const xa = px(T[k - 1]), xb = px(T[k]);
    if (k <= track.k0 || k > track.k1) { ctx.fillStyle = 'rgba(150,150,150,0.18)'; ctx.fillRect(xa, topY0, xb - xa, botY1 - topY0); }
    else if (track.interp[k]) { ctx.fillStyle = 'rgba(220,50,50,0.25)'; ctx.fillRect(xa, topY0, xb - xa, botY1 - topY0); }
  }
  ctx.strokeStyle = '#999'; ctx.lineWidth = 1;
  ctx.strokeRect(40, topY0, w - 50, topY1 - topY0);
  ctx.strokeRect(40, botY0, w - 50, botY1 - botY0);
  ctx.strokeStyle = '#3c3489'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const x = px(T[k]), y = topY1 - (track.X[k] / Xmax) * (topY1 - topY0);
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.strokeStyle = '#1e7d3c';
  ctx.beginPath();
  for (let k = 0; k < n; k++) {
    const x = px(T[k]), y = botY1 - (speed[k] / Vmax) * (botY1 - botY0);
    if (k === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();
  ctx.fillStyle = '#555'; ctx.font = '11px sans-serif';
  ctx.fillText('누적 이동량 ' + Math.round(Xmax) + 'px', 44, topY0 + 12);
  ctx.fillText('속도 (최대 ' + Math.round(Vmax) + ' px/s)', 44, botY0 + 12);
  ctx.fillText(t0.toFixed(1) + 's', 40, h - 1);
  ctx.fillText(t1.toFixed(1) + 's', w - 40, h - 1);
}

function FlowChunkView({ chunk, scale }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    cv.width = Math.max(1, Math.round(chunk.width * scale));
    cv.height = Math.max(1, Math.round(chunk.height * scale));
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(chunk, 0, 0, cv.width, cv.height);
  }, [chunk, scale]);
  return <canvas ref={ref} style={{ display: 'block', flex: '0 0 auto' }} />;
}

// ---- 연속 이동형: 재생바 자동 감지 / 제거 ----
// 캔버스를 저해상도 그레이 샘플로 (정적 열 감지 입력). maxW를 크게 잡아야 좁은(≤6px) 열이 팽창 후에도 좁게 남는다.
function flowLowFromCanvas(c, maxW, t) {
  const scale = Math.min(1, maxW / c.width);
  const w = Math.max(8, Math.round(c.width * scale)), h = Math.max(4, Math.round(c.height * scale));
  const tmp = document.createElement('canvas');
  tmp.width = w; tmp.height = h;
  const ctx = tmp.getContext('2d', { willReadFrequently: true });
  ctx.drawImage(c, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  const gray = new Uint8Array(w * h);
  for (let i = 0, p = 0; i < d.length; i += 4, p++) gray[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
  return { t, gray, w, h };
}

// ROI·추출 구간 안 약 20개 시각을 샘플링해 기존 정적 열 감지(flowDetectStaticCols)를 실행하고, 좁은(≤6px) 정적 열 중
// 오선 밴드 위/아래 바깥으로 오선 간격×0.6 이상 끊김 없이 튀어나온 것만 재생바로 판정한다. (악보와 함께 움직이는
// 기둥·빔은 정적이 아니라 대상이 아니다.) 반환: { cols:[[x0,x1],...], band:{top,bottom,space}|null, nativeW }
async function flowDetectPlaybar(video, roi, startT, endT, defaults, onProgress, isCurrent) {
  const N = 20;
  const samples = [], natives = [];
  for (let i = 0; i < N; i++) {
    if (!isCurrent()) return null;
    const t = startT + (endT - startT) * (i + 0.5) / N;
    const c = await captureRepCanvas(video, roi, t);
    samples.push(flowLowFromCanvas(c, 1200, t));
    if (i % 4 === 0) natives.push(c);
    if (onProgress) onProgress((i + 1) / N);
  }
  const w0 = samples[0].w, h0 = samples[0].h;
  const nativeW = natives[0].width;
  const scale = nativeW / w0;
  const mask = flowDetectStaticCols(samples, w0, h0);
  const ranges = [];
  let sx = -1;
  for (let x = 0; x <= w0; x++) {
    if (x < w0 && mask[x]) { if (sx < 0) sx = x; }
    else if (sx >= 0) { ranges.push([sx * scale, x * scale]); sx = -1; }
  }
  const narrow = ranges.filter(r => (r[1] - r[0]) <= 6 + 2 * scale); // 팽창(±1열)으로 넓어진 만큼 여유
  const bands = [];
  const hits = narrow.map(() => 0);
  let seen = 0;
  for (const c of natives) {
    const pc = cloneCanvas(c);
    const avg = computeAvgLuminanceFromCanvas(pc);
    scrollApplyPreprocInPlace(pc, { ...defaults, removeBg: true, invertMode: defaults.invertMode === 'auto' ? (avg < 128 ? 'on' : 'off') : defaults.invertMode });
    const g = scrollGetFullGrayData(pc);
    const sys = detectStaffSystem(g, 0.3, 140);
    if (!sys) continue;
    seen++;
    bands.push({ top: sys.main.top, bottom: sys.main.bottom, space: sys.space });
    const lim = Math.max(2, Math.round(sys.space * 2));
    narrow.forEach((r, k) => {
      let best = 0;
      for (let x = Math.max(0, Math.floor(r[0])); x <= Math.min(g.w - 1, Math.ceil(r[1])); x++) {
        best = Math.max(best, contiguousInk(g, x, sys.main.top - 1, -1, lim, 128), contiguousInk(g, x, sys.main.bottom + 1, 1, lim, 128));
      }
      if (best >= sys.space * 0.6) hits[k]++;
    });
  }
  const band = bands.length ? {
    top: Math.round(medianOf(bands.map(b => b.top))), bottom: Math.round(medianOf(bands.map(b => b.bottom))), space: medianOf(bands.map(b => b.space)),
  } : null;
  const cols = narrow.filter((r, k) => seen > 0 && hits[k] >= Math.max(1, Math.ceil(seen * 0.3))).map(r => [r[0], r[1]]);
  return { cols, band, nativeW, narrowCount: narrow.length };
}

// 재생바 제거(원본 해상도, 전처리 전): 오선 밴드 바깥은 배경색(양옆 비재생바 열의 색)으로 덮고, 밴드 안은 양옆 비재생바
// 열(2~3px)에서 가로로 보간해 채운다. 이어지는 전처리의 오선 줄 복원이 줄 행을 마무리한다.
function flowRemovePlaybarCanvas(canvas, cols, band) {
  const w = canvas.width, h = canvas.height;
  const ctx = canvas.getContext('2d');
  const img = ctx.getImageData(0, 0, w, h);
  const d = img.data;
  const avgCols = (y, xa, xb) => {
    let r = 0, g = 0, b = 0, n = 0;
    for (let x = Math.max(0, xa); x <= Math.min(w - 1, xb); x++) { const i = (y * w + x) * 4; r += d[i]; g += d[i + 1]; b += d[i + 2]; n++; }
    return n ? [r / n, g / n, b / n] : null;
  };
  for (const [a, b] of cols) {
    const x0 = Math.max(0, Math.floor(a) - 1), x1 = Math.min(w - 1, Math.ceil(b) + 1);
    for (let y = 0; y < h; y++) {
      const inBand = y >= band.top - 1 && y <= band.bottom + 1;
      const lc = avgCols(y, x0 - 3, x0 - 1), rc = avgCols(y, x1 + 1, x1 + 3);
      if (!lc && !rc) continue;
      for (let x = x0; x <= x1; x++) {
        const i = (y * w + x) * 4;
        let c;
        if (!lc) c = rc; else if (!rc) c = lc;
        else if (inBand) { const t = (x - x0 + 1) / (x1 - x0 + 2); c = [lc[0] * (1 - t) + rc[0] * t, lc[1] * (1 - t) + rc[1] * t, lc[2] * (1 - t) + rc[2] * t]; }
        else c = lc;
        d[i] = c[0]; d[i + 1] = c[1]; d[i + 2] = c[2];
      }
    }
  }
  ctx.putImageData(img, 0, 0);
}

// 추출 구간 썸네일 — ROI가 있으면 ROI 사각형만 잘라(비율 유지, 가로 400px) 그리고 박스는 그리지 않는다. ROI가 없으면 전체 프레임.
function flowDrawRoiThumb(canvasEl, video, roi) {
  if (!roi) { drawVideoFrameWithRoi(canvasEl, video, null); return; }
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  if (!(rw > 0 && rh > 0)) return;
  canvasEl.width = 400;
  canvasEl.height = Math.max(1, Math.round(400 * rh / rw));
  canvasEl.getContext('2d').drawImage(video, rx0, ry0, rw, rh, 0, 0, canvasEl.width, canvasEl.height);
}

function flowCaptureCurrent(video, roi) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(rw)); c.height = Math.max(1, Math.round(rh));
  c.getContext('2d').drawImage(video, rx0, ry0, rw, rh, 0, 0, c.width, c.height);
  return c;
}

function FlowStep({ videoRef, flowDefaults, setFlowDefaults, onModeBack }) {
  const [videoFile, setVideoFile] = useState(null);
  const [videoLoaded, setVideoLoaded] = useState(false);
  const [duration, setDuration] = useState(0);
  const [seekT, setSeekT] = useState(0);
  const [rangeStart, setRangeStart] = useState(0);
  const [rangeEnd, setRangeEnd] = useState(0);
  const [roi, setRoi] = useState(null);
  const [playbarFrac, setPlaybarFrac] = useState(null); // 수동 지정(선택) — 미리보기에서 클릭한 열 (ROI 폭 대비 0~1)
  const [detected, setDetected] = useState(null);       // 재생바 자동 감지 결과 {cols, band}
  const [detectMsg, setDetectMsg] = useState('');
  const [autoRemove, setAutoRemove] = useState(true);
  const [rate, setRate] = useState(2);
  const [medianObs, setMedianObs] = useState(false);
  const [playing, setPlaying] = useState(false);
  const [running, setRunning] = useState(false);
  const [progress, setProgress] = useState({ label: '', pct: 0 });
  const [msg, setMsg] = useState('연속 이동형 영상 파일을 선택하세요.');
  const [result, setResult] = useState(null);
  const abortRef = useRef(false);
  const graphRef = useRef(null);

  // 최신 값을 항상 ref로 참조 — 슬라이더/드래그 중 stale closure로 ROI·설정이 되돌아가지 않게 한다
  const roiRef = useRef(null), defaultsRef = useRef(flowDefaults), pbRef = useRef(null);
  const seekTRef = useRef(0), rangeRef = useRef({ s: 0, e: 0 });
  const detectedRef = useRef(null), autoRemoveRef = useRef(true), bandRef = useRef(null);
  const playingRef = useRef(false), runningRef = useRef(false);
  const queueRef = useRef(Promise.resolve());
  const userSeekGen = useRef(0); // 사용자가 직접 seek한 횟수 — 백그라운드 작업 도중 사용자가 움직였는지 판단
  const bgSeekRef = useRef(false); // 사용자가 시크바를 움직이지 않았는데 일어나는 백그라운드 seek 중 — 위 영상 캔버스 갱신 억제
  const jobRef = useRef({ pending: false, again: false });
  const detTokenRef = useRef(0);
  const ppRawRef = useRef(null), ppProcRef = useRef(null), thumbStartRef = useRef(null), thumbEndRef = useRef(null);
  useEffect(() => { roiRef.current = roi; }, [roi]);
  useEffect(() => { defaultsRef.current = flowDefaults; }, [flowDefaults]);
  useEffect(() => { pbRef.current = playbarFrac; }, [playbarFrac]);
  useEffect(() => { seekTRef.current = seekT; }, [seekT]);
  useEffect(() => { rangeRef.current = { s: rangeStart, e: rangeEnd }; }, [rangeStart, rangeEnd]);
  useEffect(() => { detectedRef.current = detected; if (detected && detected.band) bandRef.current = detected.band; }, [detected]);
  useEffect(() => { autoRemoveRef.current = autoRemove; }, [autoRemove]);
  useEffect(() => { runningRef.current = running; }, [running]);
  // 'play' 가드: 사용자가 ▶/재생 확인을 눌러 playingRef가 true인 경우와 분석 패스의 내부 재생이 아니면 즉시 멈춘다
  useEffect(() => {
    const v = videoRef.current;
    if (!v) return;
    const guard = () => { if (!playingRef.current && !flowInternalPlayRef.current) v.pause(); };
    v.addEventListener('play', guard);
    return () => v.removeEventListener('play', guard);
  }, []);

  // 같은 <video> 하나를 미리보기·썸네일·감지·재생 확인이 함께 쓰므로 모든 seek 작업을 한 줄로 직렬화한다
  function enqueue(fn) {
    const p = queueRef.current.then(fn);
    queueRef.current = p.catch(() => {});
    return p;
  }

  // 사용자 조작으로 시크 위치를 옮기는 공통 경로 (시크바, 구간 핸들, 구간 초기화, 재생 확인) — 백그라운드 억제와 무관하게
  // 캔버스가 그 시각의 프레임으로 갱신된다.
  function userSeek(t) {
    userSeekGen.current++;
    seekTRef.current = t;
    setSeekT(t);
    requestRefresh();
  }

  // 백그라운드 seek 작업(썸네일·재생바 감지 등): 작업 중에는 영상 캔버스가 중간 프레임을 그리지 않게 억제하고,
  // 끝나면 그 시점의 최신 시크 위치로 되돌려 한 번 그린다. 작업 도중 사용자가 seek했다면 복구 seek은 건너뛴다.
  function bgEnqueue(fn) {
    return enqueue(async () => {
      const gen0 = userSeekGen.current;
      bgSeekRef.current = true;
      try {
        await fn();
      } finally {
        bgSeekRef.current = false;
        const v = videoRef.current;
        if (userSeekGen.current === gen0 && v && v.videoWidth && !playingRef.current && !runningRef.current) {
          await seekSafe(v, seekTRef.current);
          v.dispatchEvent(new Event('seeked')); // 시크바 위치 프레임으로 캔버스를 한 번 다시 그린다
        }
      }
    });
  }

  // 지금 적용될 재생바 제거 설정 (수동 지정이 있으면 그 열, 아니면 자동 감지된 열)
  function getRemoval() {
    const v = videoRef.current;
    if (!v || !v.videoWidth) return { on: false, cols: [], band: null };
    const W = Math.round(roiRectPx(v, roiRef.current).rw);
    const cols = pbRef.current != null ? [[pbRef.current * W - 2, pbRef.current * W + 2]] : (detectedRef.current ? detectedRef.current.cols : []);
    return { on: autoRemoveRef.current && cols.length > 0 && !!bandRef.current, cols, band: bandRef.current };
  }

  // 전처리 미리보기 — 추출과 같은 함수·같은 값(재생바 제거 → 반전 판정 → scrollApplyPreprocInPlace)을 원본 해상도로 적용한 뒤
  // 표시용으로만 축소한다.
  function drawPreviewNow() {
    const video = videoRef.current;
    const raw = ppRawRef.current, proc = ppProcRef.current;
    if (!video || !video.videoWidth || !raw || !proc) return;
    const full = flowCaptureCurrent(video, roiRef.current);
    const sd = defaultsRef.current;
    const decide = cv => {
      const avg = computeAvgLuminanceFromCanvas(cv);
      return { ...sd, invertMode: sd.invertMode === 'auto' ? (avg < 128 ? 'on' : 'off') : sd.invertMode };
    };
    // 오선 밴드(재생바 제거의 기준) — 원본 프레임을 임시로 이진화해 찾는다
    const probe = cloneCanvas(full);
    scrollApplyPreprocInPlace(probe, { ...decide(probe), removeBg: true });
    const sys = detectStaffSystem(scrollGetFullGrayData(probe), 0.3, 140);
    if (sys) bandRef.current = { top: sys.main.top, bottom: sys.main.bottom, space: sys.space };
    const rem = getRemoval();
    const work = cloneCanvas(full);
    if (rem.on) flowRemovePlaybarCanvas(work, rem.cols, rem.band);
    scrollApplyPreprocInPlace(work, decide(work));
    drawDownscaledStaged(full, raw, 800);
    drawDownscaledStaged(work, proc, 800);
    // 감지/지정된 재생바 열을 점선으로 표시
    const k = proc.width / full.width;
    for (const cv of [raw, proc]) {
      const ctx = cv.getContext('2d');
      ctx.setLineDash([4, 3]); ctx.lineWidth = 1.5;
      ctx.strokeStyle = rem.on ? '#e03030' : 'rgba(224,48,48,0.5)';
      for (const [a, b] of rem.cols) {
        for (const x of [a * k, (b + 1) * k]) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, cv.height); ctx.stroke(); }
      }
      ctx.setLineDash([]);
    }
  }
  // 현재 시크 위치로 이동한 뒤 미리보기 갱신 (진행 중인 작업이 있으면 한 번만 더 돌도록 합친다)
  function requestRefresh() {
    if (runningRef.current || playingRef.current) return;
    const j = jobRef.current;
    if (j.pending) { j.again = true; return; }
    j.pending = true;
    enqueue(async () => {
      do {
        j.again = false;
        const v = videoRef.current;
        if (v && v.videoWidth && !runningRef.current && !playingRef.current) {
          await seekSafe(v, seekTRef.current);
          drawPreviewNow();
        }
      } while (j.again);
      j.pending = false;
    });
  }

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const video = videoRef.current;
    video.src = URL.createObjectURL(file);
    setFlowDefaults(DEFAULT_PREPROC); // 새 영상 — 전처리 초기값으로
    setVideoLoaded(false); setRoi(null); setPlaybarFrac(null); setResult(null); setDetected(null); setDetectMsg('');
    setVideoFile(file);
    video.onloadedmetadata = async () => {
      setVideoLoaded(true);
      setDuration(video.duration);
      setSeekT(0); seekTRef.current = 0;
      setRangeStart(0); setRangeEnd(video.duration);
      setMsg('영상 로드됨: ' + video.duration.toFixed(2) + '초, ' + video.videoWidth + 'x' + video.videoHeight + '. 악보가 지나가는 영역(ROI)을 드래그로 지정하세요.');
      await seekSafe(video, 0.001); // 워밍업 재생 없이 seek만으로 첫 프레임을 그린다
      await seekTo(video, 0);
      requestRefresh();
    };
  }

  // ---- (a) 영상 확인: 재생/일시정지 + 시크바 ----
  function stopPlay() {
    const v = videoRef.current;
    playingRef.current = false; setPlaying(false);
    if (v) { v.pause(); v.muted = true; }
    requestRefresh();
  }
  function startPlay(stopAt) {
    const v = videoRef.current;
    if (!v || !videoLoaded || runningRef.current) return;
    v.muted = false;
    playingRef.current = true; setPlaying(true);
    let lastUi = 0;
    const tick = () => {
      if (!playingRef.current) return;
      v.dispatchEvent(new Event('seeked')); // ROI 지정 캔버스가 현재 프레임으로 다시 그려지게 한다
      const t = v.currentTime, now = performance.now();
      if (now - lastUi > 200) { lastUi = now; seekTRef.current = t; setSeekT(t); }
      if (v.ended || v.paused || (stopAt != null && t >= stopAt)) { stopPlay(); return; }
      requestAnimationFrame(tick);
    };
    v.play().then(() => requestAnimationFrame(tick)).catch(() => stopPlay());
  }
  async function onSeek(e) {
    const t = parseFloat(e.target.value);
    if (playingRef.current) stopPlay();
    userSeek(t);
  }
  // (c) 해당 지점 재생 확인: 그 지점으로 이동해 3초 재생
  function playCheck(t) {
    if (playingRef.current) stopPlay();
    userSeekGen.current++; // 사용자 조작 — 진행 중인 백그라운드 작업의 복구 seek이 덮어쓰지 않게 한다
    seekTRef.current = t; setSeekT(t);
    enqueue(async () => {
      const v = videoRef.current;
      try {
        await seekSafe(v, t);
        seekTRef.current = t; setSeekT(t);
        startPlay(t + 3);
      } catch (err) {
        stopPlay();
      }
    });
  }

  // (c) 추출 구간 썸네일 — 시작/끝 지점의 프레임(ROI 박스 표시)
  useEffect(() => {
    if (!videoLoaded || running || playing) return;
    const id = setTimeout(() => {
      bgEnqueue(async () => {
        const v = videoRef.current;
        for (const [cvRef, t] of [[thumbStartRef, rangeRef.current.s], [thumbEndRef, rangeRef.current.e]]) {
          if (!v || !cvRef.current) continue;
          await seekSafe(v, t);
          flowDrawRoiThumb(cvRef.current, v, roiRef.current);
        }
      }).then(() => requestRefresh());
    }, 350);
    return () => clearTimeout(id);
  }, [rangeStart, rangeEnd, roi, videoLoaded]);

  // 설정(전처리·재생바 제거)/ROI가 바뀌면 100ms 디바운스로 미리보기 갱신
  useEffect(() => {
    if (!videoLoaded) return;
    const id = setTimeout(requestRefresh, 100);
    return () => clearTimeout(id);
  }, [roi, flowDefaults, videoLoaded, playbarFrac, autoRemove, detected]);

  // 재생바 자동 감지 — ROI/추출 구간이 바뀐 뒤 잠시 기다렸다가 ~20개 시각 샘플링(진행 표시)
  useEffect(() => {
    if (!videoLoaded || !roi || running || playing || rangeEnd - rangeStart < 0.5) return; // ROI 지정 전에는 감지하지 않는다
    const token = ++detTokenRef.current;
    const id = setTimeout(() => {
      bgEnqueue(async () => {
        if (token !== detTokenRef.current) return;
        setDetectMsg('재생바 감지 중... 0%');
        const res = await flowDetectPlaybar(
          videoRef.current, roiRef.current, rangeRef.current.s, rangeRef.current.e, defaultsRef.current,
          f => setDetectMsg('재생바 감지 중... ' + Math.round(f * 100) + '%'), () => token === detTokenRef.current
        );
        if (!res || token !== detTokenRef.current) return;
        setDetected(res);
        if (res.band) bandRef.current = res.band;
        if (res.cols.length) setAutoRemove(true);
        setDetectMsg(res.cols.length ? ('재생바 ' + res.cols.length + '곳 감지됨 (' + res.cols.map(r => Math.round(r[0]) + '~' + Math.round(r[1]) + 'px').join(', ') + ')') : '재생바가 감지되지 않았습니다 (필요하면 미리보기에서 열을 직접 클릭하세요)');
      }).then(() => requestRefresh());
    }, 800);
    return () => clearTimeout(id);
  }, [roi, rangeStart, rangeEnd, videoLoaded]);

  function onPreviewClick(e) {
    const r = e.currentTarget.getBoundingClientRect();
    setPlaybarFrac(Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)));
  }

  async function run() {
    const video = videoRef.current;
    if (!video || !videoLoaded) return;
    if (rangeEnd - rangeStart < 1) { setMsg('추출 구간이 너무 짧습니다 (1초 이상).'); return; }
    abortRef.current = false;
    if (playingRef.current) stopPlay();
    detTokenRef.current++; // 진행 중인 감지는 폐기
    runningRef.current = true; // 새 미리보기/감지 작업이 끼어들지 않게 먼저 막고, 진행 중인 작업이 끝나길 기다린다
    await queueRef.current;
    setRunning(true); setResult(null); setMsg('분석 중...');
    const rem = getRemoval();
    try {
      const out = await flowRunPipeline({
        video, roi, playbarFrac, rate, medianObs, scrollDefaults: flowDefaults, abortRef,
        startT: rangeStart, endT: rangeEnd, playbarRemoval: rem.on ? { cols: rem.cols, band: rem.band } : null,
        onProgress: (label, pct) => setProgress({ label, pct }),
      });
      if (out) { setResult(out); setMsg('완료'); } else setMsg('중단되었습니다.');
    } catch (err) {
      setMsg('오류: ' + err.message);
    } finally {
      runningRef.current = false;
      playingRef.current = false;
      setRunning(false);
      video.pause(); video.muted = true; video.playbackRate = 1;
      requestRefresh();
    }
  }

  useEffect(() => { if (result && graphRef.current) flowDrawGraph(graphRef.current, result.track); }, [result]);

  async function downloadStrip() {
    if (!result) return;
    if (result.totalW <= 30000) {
      const cv = document.createElement('canvas');
      cv.width = result.totalW; cv.height = result.H;
      const ctx = cv.getContext('2d');
      let x = 0;
      for (const c of result.chunks) { ctx.drawImage(c, x, 0); x += c.width; }
      await downloadCanvasPng(cv, 'flow_strip.png');
    } else {
      // 한 장으로 만들기엔 너무 길어(브라우저 캔버스 한계) 조각별로 내려받는다
      for (let i = 0; i < result.chunks.length; i++) {
        await downloadCanvasPng(result.chunks[i], 'flow_strip_part' + (i + 1) + '.png');
        await new Promise(r => setTimeout(r, 300));
      }
    }
  }

  const st = result && result.stats;
  const viewScale = result ? Math.min(1, 180 / result.H) : 1;
  const disabledAll = running;
  return (
    <div>
      <div className="block">
        <div className="block-head"><span>연속 이동형 — 영역 지정 · 이동량 추적 · 스트립 재구성</span></div>
        <p className="hint-text">
          악보가 멈춤 없이 가로로 계속 흐르는 영상용입니다(오른쪽에서 들어와 왼쪽으로 나감). 영상을 확인하고, 악보가 지나가는 영역을
          드래그로 지정한 뒤, 추출 구간과 전처리를 확인하고 시작하면 영상을 순차 재생하며 프레임 간 이동량을 추적해 악보 전체를
          하나의 긴 스트립으로 이어 붙입니다.
        </p>
        <div className="controls">
          <label>영상 파일: <input type="file" accept="video/*" onChange={handleFileChange} disabled={disabledAll} /></label>
          <label>재생 속도(분석):
            <select value={rate} onChange={e => setRate(parseFloat(e.target.value))} disabled={disabledAll} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="1">1배</option><option value="2">2배</option><option value="3">3배 (최대)</option>
            </select>
          </label>
          <label><input type="checkbox" checked={medianObs} onChange={e => setMedianObs(e.target.checked)} disabled={disabledAll} /> 현재 음표 강조 번짐 보정(여러 프레임 중앙값)</label>
        </div>

        <div className="slider-label" style={{ marginTop: '8px' }}>① 영상 확인 · 영역(ROI) 지정 — 영상 위에서 드래그</div>
        <ScrollRoiPicker videoRef={videoRef} videoLoaded={videoLoaded} roi={roi} setRoi={setRoi} suppressRef={bgSeekRef} />
        <div className="toolbar">
          <button className="icon-btn" disabled={!videoLoaded || disabledAll} onClick={() => (playing ? stopPlay() : startPlay(null))}>{playing ? '❚❚ 일시정지' : '▶ 재생'}</button>
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            <input type="range" min="0" max={duration || 0} step="0.05" value={seekT} disabled={!videoLoaded || disabledAll} style={{ flex: 1 }} onChange={onSeek} />
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>{seekT.toFixed(2)}s / {duration.toFixed(1)}s</span>
          </label>
        </div>

        <div className="slider-label" style={{ marginTop: '8px' }}>② 추출 구간 — {rangeStart.toFixed(2)}s ~ {rangeEnd.toFixed(2)}s (분석은 이 구간만 사용)</div>
        {videoLoaded && <MiniRangeTimeline duration={duration} start={rangeStart} end={rangeEnd} onChange={(a, b, which) => {
          if (running) return;
          if (playingRef.current) stopPlay();
          setRangeStart(a); setRangeEnd(b);
          userSeek(which === 'end' ? b : a); // 움직인 핸들의 시각으로 위쪽 영상을 이동
        }} />}
        {videoLoaded && (
          <div className="row" style={{ display: 'flex', flexDirection: 'column', gap: '10px' }}>
            <div>
              <div className="slider-label">시작 지점 ({rangeStart.toFixed(2)}s)</div>
              <canvas ref={thumbStartRef} style={{ maxWidth: '100%', border: '1px solid var(--border-strong)' }} />
              <div><button className="icon-btn" disabled={disabledAll} onClick={() => playCheck(rangeStart)}>여기서 재생 확인</button></div>
            </div>
            <div>
              <div className="slider-label">끝 지점 ({rangeEnd.toFixed(2)}s)</div>

          설정을 바꾸면 곧바로 이 미리보기가 바뀌며, 분석은 이 미리보기와 똑같은 처리를 합니다.

          <div style={{ overflowX: 'auto', border: '1px solid var(--border-strong)', background: '#fff' }}>
            <div style={{ display: 'flex', width: 'max-content' }}>

            </div>
          </div>
          <div className="toolbar">
            <button onClick={downloadStrip}>스트립 PNG 다운로드{result.totalW > 30000 ? ' (너무 길어 ' + result.chunks.length + '개 조각으로 분할)' : ''}</button>
