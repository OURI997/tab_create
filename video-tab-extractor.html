    return () => video.removeEventListener('seeked', redrawFrame);
  }, [videoLoaded]);

  function canvasPoint(e) {
    const canvas = roiCanvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY, scaleX, scaleY };
  }
  function onDown(e) { dragStartRef.current = canvasPoint(e); }
  function onMove(e) {
    if (!dragStartRef.current) return;
    const cur = canvasPoint(e);
    const box = roiBoxRef.current;
    const x0 = Math.min(dragStartRef.current.x, cur.x) / cur.scaleX;
    const y0 = Math.min(dragStartRef.current.y, cur.y) / cur.scaleY;
    const w = Math.abs(cur.x - dragStartRef.current.x) / cur.scaleX;
    const h = Math.abs(cur.y - dragStartRef.current.y) / cur.scaleY;
    box.style.left = x0 + 'px'; box.style.top = y0 + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.display = 'block';
  }
  useEffect(() => {
    function onUp(e) {
      if (!dragStartRef.current) return;
      const canvas = roiCanvasRef.current;
      const start = dragStartRef.current;
      dragStartRef.current = null;
      const cur = canvasPoint(e);
      const curX = Math.max(0, Math.min(canvas.width, cur.x));
      const curY = Math.max(0, Math.min(canvas.height, cur.y));
      const x0 = Math.min(start.x, curX), x1 = Math.max(start.x, curX);
      const y0 = Math.min(start.y, curY), y1 = Math.max(start.y, curY);
      if (x1 - x0 < 5 || y1 - y0 < 5) return;
      setRoi({ x0: x0 / canvas.width, y0: y0 / canvas.height, x1: x1 / canvas.width, y1: y1 / canvas.height });
    }
    window.addEventListener('mouseup', onUp);
    return () => window.removeEventListener('mouseup', onUp);
  }, []);

  return (
    <div className="roi-wrap">
      <canvas ref={roiCanvasRef} className="roi-canvas" onMouseDown={onDown} onMouseMove={onMove} />
      <div ref={roiBoxRef} className="roi-box" />
    </div>
  );
}

function ScrollCaptureStep({ videoRef, scrollDefaults, setScrollDefaults, onDone, onModeBack }) {
  const durationRef = useRef(0);
  const rangeTrackRef = useRef(null);
  const rangeDragRef = useRef(null); // 'start' | 'end' | null
  const rangeStartRef = useRef(0);
  const rangeEndRef = useRef(0);
  // roi/scrollDefaults를 ref로도 미러링 — 아래 range-drag용 useEffect는 deps=[](pointermove/up을
  // 드래그 내내 딱 한 번만 붙여야 하므로)라서, 거기서 부르는 onMove가 "마운트 시점의" roi/
  // scrollDefaults를 닫아버리는 stale closure가 된다(updatePreprocPreview 자체는 매 렌더 새로

  // roi/scrollDefaults를 직접 읽지 않고 이 ref들의 .current만 읽게 하면, 어느 렌더의 onMove가
  // 호출되든 항상 최신 값을 보게 된다.
  const roiRef = useRef(null);
  const scrollDefaultsRef = useRef(null);
  const [videoFile, setVideoFile] = useState(null);

  const [duration, setDuration] = useState(0);

    setRoi(null);
    setAnalysis(null);
    setVideoFile(file);
    video.onloadedmetadata = async () => {
      setVideoLoaded(true);
      setDuration(video.duration);
      setSeekT(0);
      setRangeStart(0);
      setRangeEnd(video.duration);
      log('영상 로드됨: ' + video.duration.toFixed(2) + '초, ' + video.videoWidth + 'x' + video.videoHeight + '. TAB 영역을 드래그로 지정하세요.');
      await seekSafe(video, 0.001); // 워밍업 재생 없이 seek만으로 첫 프레임을 그린다
      await seekTo(video, 0);
      updatePreprocPreview();
    };
  }

  async function onSeekSliderChange(e) {
    const t = parseFloat(e.target.value);
    setSeekT(t);
    await seekTo(videoRef.current, t);
    updatePreprocPreview();
  }

  function startRangeDrag(e, which) {
    e.preventDefault();
    rangeDragRef.current = which;
  }
  useEffect(() => {
    async function onMove(e) {
      const which = rangeDragRef.current;
      const dur = durationRef.current;
      if (!which || !rangeTrackRef.current || !dur) return;
      const rect = rangeTrackRef.current.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let t = pct * dur;
      if (which === 'start') {
        t = Math.max(0, Math.min(t, rangeEndRef.current - 0.1));
        setRangeStart(t);
      } else {
        t = Math.min(dur, Math.max(t, rangeStartRef.current + 0.1));
        setRangeEnd(t);
      }
      setSeekT(t);
      await seekTo(videoRef.current, t);
      updatePreprocPreview();
    }
    function onUp() { rangeDragRef.current = null; }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
  }, []);

  // 전/후 비교 미리보기 — ROI/설정을 바꿀 때 확인 없이도 결과를 가늠할 수 있게, "원본(ROI 크롭만)"과
  // "전처리 후"를 현재 프레임 기준으로 나란히 보여준다. 반드시 원본 해상도로 처리한 뒤 표시용으로만
  // 축소한다(despeckle 스펙클 노이즈 방지 — 스티칭 단계와 동일한 순서). 실제 저장/스티칭에 쓰이는
  // 원본 해상도 데이터(captured, full)는 이 함수 밖으로 나가지 않으므로 아래 단계적 축소는 순수히
  // "여기서 어떻게 보여줄지"에만 영향을 준다.
  function updatePreprocPreview() {
    const video = videoRef.current;
    if (!video || !video.videoWidth) return;
    const captured = captureRoiNative(video, roiRef.current); // 원본 해상도 크롭
    const raw = ppRawRef.current, processed = ppProcessedRef.current;
    if (!raw || !processed) return;
    loadImage(captured.dataUrl).then(img => {
      const full = document.createElement('canvas');
      full.width = img.naturalWidth; full.height = img.naturalHeight;
      full.getContext('2d').drawImage(img, 0, 0);
      drawDownscaledStaged(full, raw, 420);

      const processedFull = document.createElement('canvas');
      processedFull.width = img.naturalWidth; processedFull.height = img.naturalHeight;
      processedFull.getContext('2d').drawImage(img, 0, 0);
      scrollApplyPreprocInPlace(processedFull, scrollDefaultsRef.current); // 원본 해상도에서 처리
      drawDownscaledStaged(processedFull, processed, 420); // 표시용으로만, 2배씩 단계적으로 축소
    });
  }
  // ROI나 전처리 설정이 바뀔 때마다 갱신 — 드래그 중 과도하게 자주 다시 그리지 않도록 살짝 debounce.
  useEffect(() => {
    if (!videoLoaded) return;
    const t = setTimeout(updatePreprocPreview, 150);
    return () => clearTimeout(t);
  }, [roi, scrollDefaults, videoLoaded]);

  function drawChart(times, diffs, th) {
    const canvas = chartRef.current;
    if (!canvas || !diffs || diffs.length === 0) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth;
    const h = canvas.height = 120;
    ctx.clearRect(0, 0, w, h);
    const maxDiff = Math.max(...diffs, 1) * 1.15;
    ctx.strokeStyle = '#3c3489';
    ctx.beginPath();
    diffs.forEach((d, i) => {
      const x = (i / Math.max(1, diffs.length - 1)) * w;
      const y = h - (d / maxDiff) * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const ty = h - (th / maxDiff) * h;
    ctx.strokeStyle = '#cc3333';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(w, ty); ctx.stroke();
    ctx.setLineDash([]);
  }
  useEffect(() => { if (analysis) drawChart(analysis.times, analysis.diffs, threshold); }, [threshold, analysis]);

  async function analyze() {
    if (!videoLoaded) { log('영상을 먼저 선택하세요.'); return; }
    setAnalyzing(true);
    setAnalyzeProgress(0);
    setAnalysis(null);
    const video = videoRef.current;
    const step = parseFloat(stepSec) || 0.2;
    // 트림된 구간(rangeStart~rangeEnd) 안에서만 분석 — 페이지 전환형 CaptureStep과 동일하게, 불필요한
    // 인트로/아웃트로가 diff/burst 판정에 끼어들지 않도록 기본값은 영상 전체(0~duration)로 시작한다.
    const rangeS = Math.max(0, Math.min(rangeStart, video.duration));
    const rangeE = Math.max(rangeS, Math.min(rangeEnd || video.duration, video.duration));
    const totalSteps = Math.max(1, Math.ceil((rangeE - rangeS) / step));
    const times = [], diffs = [];
    let prevSample = null;
    let lastProgress = -1; // 프로토타입(순수 JS)과 달리 React는 상태가 바뀔 때마다 이 컴포넌트
    // 트리 전체를 다시 렌더링한다 — 매 스텝마다(초당 수십 번) setAnalyzeProgress를 부르면 값이
    // 실제로는 안 바뀐 프레임에서도 리렌더가 도는 게 체감 속도 저하의 큰 부분이었다. 표시되는
    // 정수 %가 실제로 바뀔 때만 갱신해서 리렌더 횟수를 총 진행 스텝 수(수백 번일 수 있음)에서
    // 100번 이하로 줄인다.
    const profT0 = performance.now(), profK0 = seekCounter;
    try {
      let t = rangeS, idx = 0;
      while (t < rangeE) {
        await seekTo(video, t);
        const sample = getRoiPixelsForDiff(video, roi);
        times.push(t);
        if (prevSample) diffs.push(diffScore(prevSample, sample));
        prevSample = sample;
        idx++;
        const pct = Math.min(100, Math.round((idx / totalSteps) * 100));
        if (pct !== lastProgress) { lastProgress = pct; setAnalyzeProgress(pct); }
        if (idx % 10 === 0) log('분석 중... ' + t.toFixed(1) + 's / ' + rangeE.toFixed(1) + 's');
        t += step;
      }
      scrollProf.diff = { sec: (performance.now() - profT0) / 1000, seeks: seekCounter - profK0, captures: times.length, hits: 0 };
      setAnalyzeProgress(100);
      setAnalysis({ times, diffs });
      const maxObserved = Math.max(...diffs, 0.1);
      setThresholdRange({ min: 0, max: maxObserved * 1.3, step: Math.max(0.001, maxObserved / 200) });
      const initialThreshold = maxObserved * 0.35;
      setThreshold(initialThreshold);
      const bursts = groupScrollBursts(diffs, initialThreshold);
      log('분석 완료. 스크롤(이동) ' + bursts.length + '회 감지 → 대표 프레임 ' + scrollRepIndices(times, bursts).length + '장 예상. 슬라이더로 임계값을 조절해보세요.');
    } catch (err) {
      log('분석 중 오류: ' + err.message);
    } finally {
      setAnalyzing(false);
    }
  }

  const bursts = analysis ? groupScrollBursts(analysis.diffs, threshold) : [];
  const repCount = analysis ? scrollRepIndices(analysis.times, bursts).length : 0;

  async function confirmAndRun() {
    if (!analysis) return;
    setConfirming(true);
    try {
      const { times } = analysis;
      const video = videoRef.current;
      const { ex, markerData, profile } = await buildScrollResult({ video, roi, times, bursts, scrollDefaults, direction, transition, log });
      onDone({
        videoFile, roi, direction: ex.direction, directionNcc: ex.directionNcc, mode: ex.mode,
        rawFrames: ex.rawFrames, frameLen: ex.frameLen, bursts: flagOutlierBursts(bursts, times), markerData, notes: ex.notes,
        typeInfo: ex.typeInfo, times, rawBursts: bursts, directionPref: direction, transition, profile,
      });
    } catch (err) {
      log('처리 중 오류: ' + err.message);
      setConfirming(false);
    }
  }

  return (
    <div>
      <div className="block">
        <div className="block-head"><span>스크롤형 — TAB 영역 지정 및 대표 프레임 추출</span></div>
        <p className="hint-text">
          화면이 계속 흐르듯 넘어가는(스크롤형) 영상용입니다. 영상을 고른 뒤 TAB 영역을 드래그로 지정하고,
          "분석 시작"으로 이동/정지 구간을 계산한 다음 임계값 슬라이더로 스크롤 구간을 조정하세요.
          "대표 프레임 확정"을 누르면 전처리 → 이어붙이기까지 자동으로 이어서 진행되고, 마디선 검출은
          다음 화면에서 슬라이더로 직접 조정하며 확인할 수 있습니다.
        </p>
        <div className="controls">
          <label>영상 파일: <input type="file" accept="video/*" onChange={handleFileChange} /></label>
          <label>영상 유형:
            <select value={transition} onChange={e => setTransition(e.target.value)} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="auto">자동 (겹침 유무로 판별)</option>
              <option value="smooth">부드러운 스크롤 (NCC 겹침)</option>
              <option value="cut">컷 전환 (타일링)</option>
            </select>
          </label>
          <label>스크롤 방향:
            <select value={direction} onChange={e => setDirection(e.target.value)} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="auto">자동 감지 (첫 이음매로 판단)</option>
              <option value="vertical">세로 스크롤</option>
              <option value="horizontal">가로 스크롤</option>
            </select>
          </label>
        </div>

        <ScrollRoiPicker videoRef={videoRef} videoLoaded={videoLoaded} roi={roi} setRoi={setRoi} />
        <div className="slider-label">
          {roi
            ? ('지정된 영역: 가로 ' + (roi.x0 * 100).toFixed(0) + '%~' + (roi.x1 * 100).toFixed(0) + '%, 세로 ' + (roi.y0 * 100).toFixed(0) + '%~' + (roi.y1 * 100).toFixed(0) + '%')
            : '아직 영역을 지정하지 않았습니다. (지정하지 않으면 화면 전체로 분석합니다)'}
        </div>

        <div className="toolbar">
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            영상 상태 확인:
            <input type="range" min="0" max={duration || 0} step="0.1" value={seekT} disabled={!videoLoaded}
              style={{ flex: 1 }} onChange={onSeekSliderChange} />
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>{seekT.toFixed(1)}s / {duration.toFixed(1)}s</span>
          </label>
        </div>

        <div className="slider-label" style={{ marginTop: '10px' }}>
          분석할 구간 선택 — {rangeStart.toFixed(1)}s ~ {rangeEnd.toFixed(1)}s (비워두면 영상 전체가 대상 — 불필요한 인트로/아웃트로를
          빼면 스크롤(burst) 판정이 더 정확해집니다)
        </div>
        {videoLoaded && (
          <div className="range-slider-track" ref={rangeTrackRef}>
            <div className="range-slider-fill" style={{
              left: (rangeStart / duration * 100) + '%',
              width: ((rangeEnd - rangeStart) / duration * 100) + '%',
            }} />
            <div className="range-slider-handle" style={{ left: (rangeStart / duration * 100) + '%' }}
              onPointerDown={e => startRangeDrag(e, 'start')} title={'시작: ' + rangeStart.toFixed(1) + 's'} />
            <div className="range-slider-handle" style={{ left: (rangeEnd / duration * 100) + '%' }}
              onPointerDown={e => startRangeDrag(e, 'end')} title={'끝: ' + rangeEnd.toFixed(1) + 's'} />
          </div>
        )}
        <div className="toolbar">
          <button className="icon-btn" onClick={() => { setRangeStart(0); setRangeEnd(duration); }} disabled={!videoLoaded}>구간 초기화(전체)</button>
          <button className="icon-btn" onClick={() => setRoi(null)} disabled={!roi}>영역 초기화</button>
        </div>
      </div>

      <ScrollPreprocPanel scrollDefaults={scrollDefaults} setScrollDefaults={setScrollDefaults} />

      {videoLoaded && (
        <div className="block">
          <div className="block-head"><span>전처리 전/후 미리보기 (현재 프레임 기준)</span></div>
          <p className="hint-text">ROI를 지정하거나 위 전처리 설정을 바꾸면 자동으로 갱신됩니다. 실제로는 항상 원본 해상도로 처리한 뒤 여기서는 표시용으로만 축소합니다.</p>
          <div className="row" style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
            <div>
              <div className="slider-label">원본 (ROI 크롭만)</div>
              <canvas ref={ppRawRef} style={{ maxWidth: '420px', height: 'auto', border: '1px solid var(--border-strong)' }} />
            </div>
            <div>
              <div className="slider-label">전처리 후</div>
              <canvas ref={ppProcessedRef} style={{ maxWidth: '420px', height: 'auto', border: '1px solid var(--border-strong)' }} />
            </div>
          </div>
        </div>
      )}

      <div className="block">
        <div className="toolbar">
          <label>샘플링 간격(초): <input type="number" value={stepSec} step="0.05" min="0.02" onChange={e => setStepSec(e.target.value)} style={{ width: '4em' }} /></label>
          <button onClick={analyze} disabled={!videoLoaded || analyzing}>{analyzing ? '분석 중...' : '분석 시작 (diff 계산)'}</button>
        </div>
        {analyzing && (
          <div className="progress-bar-wrap">
            <div className="progress-bar-fill" style={{ width: analyzeProgress + '%' }} />
            <div className="progress-bar-label">{analyzeProgress}%</div>
          </div>
        )}
        {analysis && (
          <div className="toolbar">
            <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>전환(스크롤) 판정 임계값</span>
              <input type="range" min={thresholdRange.min} max={thresholdRange.max} step={thresholdRange.step}
                value={threshold} style={{ flex: 1 }} onChange={e => setThreshold(parseFloat(e.target.value))} />
              <span className="slider-label" style={{ margin: 0 }}>{threshold.toFixed(2)}</span>
            </label>
            <span className="save-msg">스크롤 {bursts.length}회 → 대표 프레임 {repCount}장 예상</span>
          </div>
        )}
        <div className="slider-label" style={{ whiteSpace: 'pre-wrap' }}>{statusMsg}</div>
        <canvas ref={chartRef} className="chart-canvas" />
      </div>

      <div className="toolbar">
        <button className="icon-btn" onClick={onModeBack} disabled={confirming}>← 모드 다시 선택</button>
        <button onClick={confirmAndRun} disabled={!analysis || confirming}>
          {confirming ? '처리 중...' : '대표 프레임 확정 (이어서 자동 진행) →'}
        </button>
      </div>
    </div>
  );
}
// 그룹(마디 범위)의 신뢰도 = 그 범위와 겹치는 이음매(seam)들 중 최저 NCC. 겹치는 이음매가 없으면
// (그룹이 이음매 없이 한 대표 프레임 안에만 있으면) 신뢰도 문제 없음(=1)으로 본다.
function groupConfidence(seams, startX, endX) {
  let minScore = 1;
  let any = false;
  for (const s of seams) {
    if (s.pos > startX - 1 && s.pos < endX + 1) {
      // 컷 이음새는 NCC가 없으므로 마디 검증(flagged) 결과로 판단. dup 이음새는 신뢰 문제 없음.
      const sc = s.cut ? (s.flagged ? 0.5 : 1) : s.score;
      any = true;
      if (sc != null && sc < minScore) minScore = sc;
    }
  }
  return any ? minScore : 1;
}

function cropCanvasRegion(canvas, x0, y0, x1, y1) {
  const w = Math.max(1, Math.round(x1 - x0)), h = Math.max(1, Math.round(y1 - y0));
  const out = document.createElement('canvas');
  out.width = w; out.height = h;
  out.getContext('2d').drawImage(canvas, x0, y0, w, h, 0, 0, w, h);
  return out;
}

// 그룹 목록(현재 N/축 기준)에서 각 그룹의 표시용 canvas를 잘라낸다 — direction에 따라 폭 방향으로
// 자르는지 높이 방향으로 자르는지가 다르다.
function cropGroupCanvas(stitchedCanvas, direction, group) {
  if (direction === 'vertical') {
    return cropCanvasRegion(stitchedCanvas, 0, group.startX, stitchedCanvas.width, group.endX);
  }
  return cropCanvasRegion(stitchedCanvas, group.startX, 0, group.endX, stitchedCanvas.height);
}

// ---- 5단계: 이미지 업로드 후 크롭 (수동 오버라이드 옵션 b) ----
function ImageCropPicker({ src, crop, setCrop }) {
  const canvasRef = useRef(null);
  const boxRef = useRef(null);
  const dragStartRef = useRef(null);
  const [natural, setNatural] = useState(null);

  useEffect(() => {
    if (!src) return;
    loadImage(src).then(img => {
      setNatural({ w: img.naturalWidth, h: img.naturalHeight });
      const canvas = canvasRef.current;
      const maxW = 700;
      const scale = Math.min(1, maxW / img.naturalWidth);
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
    });
  }, [src]);

  function canvasPoint(e) {
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    return { x: (e.clientX - rect.left) / rect.width, y: (e.clientY - rect.top) / rect.height };
  }
  function onDown(e) { dragStartRef.current = canvasPoint(e); }
  function onMove(e) {
    if (!dragStartRef.current) return;
    const cur = canvasPoint(e);
    const box = boxRef.current;
    const canvas = canvasRef.current;
    const x0 = Math.min(dragStartRef.current.x, cur.x) * canvas.width;
    const y0 = Math.min(dragStartRef.current.y, cur.y) * canvas.height;
    const w = Math.abs(cur.x - dragStartRef.current.x) * canvas.width;
    const h = Math.abs(cur.y - dragStartRef.current.y) * canvas.height;
    box.style.left = x0 + 'px'; box.style.top = y0 + 'px';
    box.style.width = w + 'px'; box.style.height = h + 'px';
    box.style.display = 'block';
  }
  useEffect(() => {
    function onUp(e) {
      if (!dragStartRef.current || !natural) return;
      const start = dragStartRef.current;
      dragStartRef.current = null;
      const cur = canvasPoint(e);
      const x0 = Math.max(0, Math.min(1, Math.min(start.x, cur.x)));
      const x1 = Math.max(0, Math.min(1, Math.max(start.x, cur.x)));
      const y0 = Math.max(0, Math.min(1, Math.min(start.y, cur.y)));
      const y1 = Math.max(0, Math.min(1, Math.max(start.y, cur.y)));
      if (x1 - x0 < 0.01 || y1 - y0 < 0.01) return;
      setCrop({ x0, y0, x1, y1 });
    }
    window.addEventListener('mouseup', onUp);
    return () => window.removeEventListener('mouseup', onUp);
  }, [natural]);

  return (
    <div className="roi-wrap">
      <canvas ref={canvasRef} className="roi-canvas" onMouseDown={onDown} onMouseMove={onMove} />
      <div ref={boxRef} className="roi-box" style={crop ? {
        display: 'block',
        left: (crop.x0 * 100) + '%', top: (crop.y0 * 100) + '%',
        width: ((crop.x1 - crop.x0) * 100) + '%', height: ((crop.y1 - crop.y0) * 100) + '%',
      } : undefined} />
    </div>
  );
}

// ---- 5단계: 저신뢰/누락 의심 그룹 보완용 "이 구간 다시 만들기" ----

// 영상 한 프레임을 작게 그리고 ROI 박스를 겹쳐 표시 (영상 컨텍스트용 썸네일)
function drawVideoFrameWithRoi(canvasEl, video, roi) {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return;
  const w = 260, h = Math.max(1, Math.round(w * vh / vw));
  canvasEl.width = w; canvasEl.height = h;
  const ctx = canvasEl.getContext('2d');
  ctx.drawImage(video, 0, 0, w, h);
  if (roi) {
    ctx.strokeStyle = '#e03030'; ctx.lineWidth = 2;
    ctx.strokeRect(roi.x0 * w, roi.y0 * h, (roi.x1 - roi.x0) * w, (roi.y1 - roi.y0) * h);
  }
}
// seeked가 안 오는 극단적인 경우에도 큐가 멈추지 않도록 시간 제한을 둔 seek
function seekSafe(video, t) {
  return Promise.race([seekTo(video, t), new Promise(r => setTimeout(r, 2500))]);
}

// 전체 영상 미니 타임라인 — CaptureStep 트림 UI(.range-slider-*)와 같은 구조·같은 포인터 드래그 패턴.
// 최신 값은 ref로 읽어 드래그 중 stale closure가 생기지 않게 한다.
function MiniRangeTimeline({ duration, start, end, onChange }) {
  const trackRef = useRef(null);
  const dragRef = useRef(null);
  const latestRef = useRef({ start, end, duration, onChange });
  latestRef.current = { start, end, duration, onChange };
  useEffect(() => {
    function onMove(e) {
      const which = dragRef.current;
      if (!which || !trackRef.current) return;
      const rect = trackRef.current.getBoundingClientRect();
      const frac = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      const L = latestRef.current;
      const t = frac * L.duration;
      if (which === 'start') L.onChange(Math.min(t, L.end - 0.1), L.end, 'start');
      else L.onChange(L.start, Math.max(t, L.start + 0.1), 'end');
    }
    function onUp() { dragRef.current = null; }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => { window.removeEventListener('pointermove', onMove); window.removeEventListener('pointerup', onUp); };
  }, []);
  const d = duration || 1;
  return (
    <div className="range-slider-track" ref={trackRef}>
      <div className="range-slider-fill" style={{ left: (start / d * 100) + '%', width: ((end - start) / d * 100) + '%' }} />
      <div className="range-slider-handle" style={{ left: (start / d * 100) + '%' }}
        onPointerDown={e => { e.preventDefault(); dragRef.current = 'start'; }} title={'시작: ' + start.toFixed(2) + 's'} />
      <div className="range-slider-handle" style={{ left: (end / d * 100) + '%' }}
        onPointerDown={e => { e.preventDefault(); dragRef.current = 'end'; }} title={'끝: ' + end.toFixed(2) + 's'} />
    </div>
  );
}

// ---- 구간 재스캔 서브패널 — "이 구간 다시 스캔"과 "영상에서 직접 구간 선택"이 시작 구간 값/힌트 문구만 다르고
// 동작은 같으므로 하나의 컴포넌트를 재사용한다. 결과는 그룹 이미지 한 장을 대체하는 대신 전역 스티치의 해당
// 구간만 패치한다(onApplyStitch) — 마디 검출·그룹핑·timeRange는 결과 화면이 전부 자동 재계산. ----
function RangeRescanPanel({ videoRef, roi, scrollDefaults, direction, initialStart, initialEnd, maxDuration, hint, groupImgSrc, timeAtFrac, onApplyStitch, onCancel }) {
  const [startT, setStartT] = useState(initialStart);
  const [endT, setEndT] = useState(initialEnd);
  const [diffThreshold, setDiffThreshold] = useState(null); // null = 아직 자동 추정 전
  const [thresholdRange, setThresholdRange] = useState({ min: 0, max: 1, step: 0.01 });
  const [result, setResult] = useState(null);
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState(null);
  const [scrubT, setScrubT] = useState(initialStart);
  const [hoverT, setHoverT] = useState(null);
  const [pinnedT, setPinnedT] = useState(null);
  const ranOnceRef = useRef(false);
  const queueRef = useRef(Promise.resolve());
  const startThumbRef = useRef(null), endThumbRef = useRef(null), scrubCanvasRef = useRef(null), hoverCanvasRef = useRef(null);
  const scrubTargetRef = useRef(initialStart), scrubPendingRef = useRef(false);
  const hoverTargetRef = useRef(0), hoverPendingRef = useRef(false);

  // 같은 <video> 하나를 썸네일·스크럽·재스캔이 함께 쓰므로 모든 seek를 한 줄로 직렬화한다.
  function enqueue(fn) {
    const p = queueRef.current.then(fn);
    queueRef.current = p.catch(() => {});
    return p;
  }
  function drawAt(canvasRef, t) {
    enqueue(async () => {
      const video = videoRef.current;
      if (!video || !canvasRef.current) return;
      await seekSafe(video, t);
      if (canvasRef.current) drawVideoFrameWithRoi(canvasRef.current, video, roi);
    });
  }
  function requestLatestDraw(canvasRef, targetRef, pendingRef) {
    if (pendingRef.current) return;
    pendingRef.current = true;
    enqueue(async () => {
      const tt = targetRef.current;
      const video = videoRef.current;
      if (video && canvasRef.current) {
        await seekSafe(video, tt);
        if (canvasRef.current) drawVideoFrameWithRoi(canvasRef.current, video, roi);
      }
      pendingRef.current = false;
      if (targetRef.current !== tt) requestLatestDraw(canvasRef, targetRef, pendingRef);
    });
  }

  async function rescan(explicitThreshold) {
    const video = videoRef.current;
    if (!video) return;
    setBusy(true);
    setError(null);
    try {
      const res = await enqueue(() => runMiniStitchForRange(
        video, roi, startT, endT, explicitThreshold != null ? explicitThreshold : diffThreshold, scrollDefaults, direction
      ));
      setResult(res);
      setDiffThreshold(res.threshold);
      setThresholdRange({ min: 0, max: Math.max(0.001, res.maxObserved * 1.3), step: Math.max(0.001, res.maxObserved / 200) });
    } catch (err) {
      setError(err.message);
    } finally {
      setBusy(false);
    }
  }

  useEffect(() => {
    if (ranOnceRef.current) return;
    ranOnceRef.current = true;
    rescan(null);
  }, []);
  useEffect(() => { const id = setTimeout(() => drawAt(startThumbRef, startT), 350); return () => clearTimeout(id); }, [startT]);
  useEffect(() => { const id = setTimeout(() => drawAt(endThumbRef, endT), 350); return () => clearTimeout(id); }, [endT]);

  const previewUrl = useMemo(() => (result ? result.canvas.toDataURL('image/png') : null), [result]);

  function fracFromEvent(e) {
    const r = e.currentTarget.getBoundingClientRect();
    return Math.max(0, Math.min(1, (e.clientX - r.left) / Math.max(1, r.width)));
  }
  function onGroupHover(e) {
    if (!timeAtFrac) return;
    const t = timeAtFrac(fracFromEvent(e));
    setHoverT(t);
    hoverTargetRef.current = t;
    requestLatestDraw(hoverCanvasRef, hoverTargetRef, hoverPendingRef);
  }
  function onGroupClick(e) {
    if (!timeAtFrac) return;
    setPinnedT(timeAtFrac(fracFromEvent(e)));
  }
  function onScrub(e) {
    const t = parseFloat(e.target.value);
    setScrubT(t);
    scrubTargetRef.current = t;
    requestLatestDraw(scrubCanvasRef, scrubTargetRef, scrubPendingRef);
  }
  const clampT = t => Math.max(0, Math.min(maxDuration || t, t));

  return (
    <React.Fragment>
      {hint && <p className="hint-text">{hint}</p>}

      <div className="slider-label">전체 영상에서의 재스캔 구간 — {startT.toFixed(2)}s ~ {endT.toFixed(2)}s (핸들을 드래그해 넓히거나 옮기세요)</div>
      <MiniRangeTimeline duration={maxDuration} start={startT} end={endT} onChange={(a, b) => { setStartT(a); setEndT(b); }} />
      <div className="row" style={{ display: 'flex', gap: '10px', flexWrap: 'wrap' }}>
        <div><div className="slider-label">시작 프레임 ({startT.toFixed(2)}s)</div><canvas ref={startThumbRef} style={{ maxWidth: '260px', border: '1px solid var(--border-strong)' }} /></div>
        <div><div className="slider-label">끝 프레임 ({endT.toFixed(2)}s)</div><canvas ref={endThumbRef} style={{ maxWidth: '260px', border: '1px solid var(--border-strong)' }} /></div>
      </div>

      <div className="toolbar">
        <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
          <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>영상 상태 확인</span>
          <input type="range" min="0" max={maxDuration || 0} step="0.05" value={scrubT} style={{ flex: 1 }} onChange={onScrub} />
          <span className="slider-label" style={{ margin: 0 }}>{scrubT.toFixed(2)}s</span>
        </label>
        <button className="icon-btn" onClick={() => setStartT(clampT(Math.min(scrubT, endT - 0.1)))}>현재 위치를 시작으로</button>
        <button className="icon-btn" onClick={() => setEndT(clampT(Math.max(scrubT, startT + 0.1)))}>현재 위치를 끝으로</button>
      </div>
      <canvas ref={scrubCanvasRef} style={{ maxWidth: '260px', border: '1px solid var(--border-strong)' }} />

      {groupImgSrc && timeAtFrac && (
        <div>
          <div className="slider-label">이 그룹의 현재 스티치 — 마우스를 올리면 그 위치의 원본 프레임이 옆에 표시되고, 클릭하면 그 시각이 고정됩니다.</div>
          <div className="row" style={{ display: 'flex', gap: '10px', flexWrap: 'wrap', alignItems: 'flex-start' }}>
            <img src={groupImgSrc} className="merge-preview-img" style={{ cursor: 'crosshair', maxWidth: '100%' }}
              onMouseMove={onGroupHover} onClick={onGroupClick} alt="현재 그룹 스티치" />
            <div>
              <canvas ref={hoverCanvasRef} style={{ maxWidth: '260px', border: '1px solid var(--border-strong)' }} />
              <div className="slider-label">{hoverT != null ? ('마우스 위치 시각 ' + hoverT.toFixed(2) + 's') : ''}{pinnedT != null ? (' · 고정 ' + pinnedT.toFixed(2) + 's') : ''}</div>
            </div>
          </div>
          <div className="toolbar">
            <button className="icon-btn" disabled={pinnedT == null} onClick={() => { setStartT(clampT(pinnedT)); setEndT(clampT(Math.max(endT, pinnedT + 1))); }}>여기부터 다시 만들기</button>
            <button className="icon-btn" disabled={pinnedT == null} onClick={() => setEndT(clampT(Math.max(pinnedT, startT + 0.1)))}>여기까지로 끝 지정</button>
          </div>
        </div>
      )}

      <details>
        <summary className="slider-label" style={{ cursor: 'pointer' }}>고급: 시작/끝 시각 직접 입력</summary>
        <div className="toolbar">
          <label>시작(s): <input type="number" step="0.1" min="0" max={maxDuration}
            value={startT} onChange={e => setStartT(clampT(parseFloat(e.target.value) || 0))} style={{ width: '5.5em' }} /></label>
          <label>끝(s): <input type="number" step="0.1" min="0" max={maxDuration}
            value={endT} onChange={e => setEndT(clampT(parseFloat(e.target.value) || 0))} style={{ width: '5.5em' }} /></label>
        </div>
      </details>

      <div className="toolbar">
        <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
          <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>diff 임계값</span>
          <input type="range" min={thresholdRange.min} max={thresholdRange.max} step={thresholdRange.step}
            value={diffThreshold != null ? diffThreshold : 0} disabled={busy} style={{ flex: 1 }}
            onChange={e => setDiffThreshold(parseFloat(e.target.value))} />
          <span className="slider-label" style={{ margin: 0 }}>{diffThreshold != null ? diffThreshold.toFixed(3) : '-'}</span>
        </label>
        <button className="icon-btn" onClick={() => rescan(diffThreshold)} disabled={busy}>{busy ? '스캔 중...' : '다시 스캔'}</button>
      </div>
      {error && <p className="hint-text" style={{ color: '#c0392b' }}>재스캔 중 오류: {error}</p>}
      {result && (
        <div>
          <img src={previewUrl} className="merge-preview-img" alt="재스캔 미리보기" />
          <p className="hint-text">
            {result.mode === 'cut' ? '컷 전환(타일링)' : '부드러운 스크롤'} · 조각 {result.repCount}개 · 스크롤(이동) {result.bursts.length}회 감지됨 ·
            적용하면 전역 스티치의 해당 구간만 교체되고 마디 검출·그룹·시간이 자동으로 다시 계산됩니다.
          </p>
        </div>
      )}
      <div className="toolbar">
        <button onClick={() => onApplyStitch(result, result.startT, result.endT)} disabled={busy || !result}>이 결과 적용</button>
        <button className="icon-btn" onClick={onCancel} disabled={busy}>취소</button>
      </div>
    </React.Fragment>
  );
}

function GroupOverridePanel({ videoRef, scrollDefaults, roi, direction, timeRange, groupImgSrc, timeAtFrac, onApply, onApplyStitch, onCancel }) {
  const [mode, setMode] = useState('rescan'); // 'rescan' | 'manual-range' | 'upload'
  const [duration, setDuration] = useState(videoRef.current ? videoRef.current.duration || 0 : 0);
  // upload 방식
  const [uploadSrc, setUploadSrc] = useState(null);
  const [uploadCrop, setUploadCrop] = useState(null);
  const [busy, setBusy] = useState(false);

  useEffect(() => {
    const video = videoRef.current;
    if (video && video.duration) setDuration(video.duration);
  }, []);

  function onUploadFile(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    setUploadSrc(URL.createObjectURL(file));
    setUploadCrop(null);
  }

  async function applyFromUpload() {
    if (!uploadSrc) { alert('이미지를 먼저 선택하세요.'); return; }
    setBusy(true);
    try {
      const img = await loadImage(uploadSrc);
      const crop = uploadCrop || { x0: 0, y0: 0, x1: 1, y1: 1 };
      const sx = Math.round(crop.x0 * img.naturalWidth), sy = Math.round(crop.y0 * img.naturalHeight);
      const sw = Math.max(1, Math.round((crop.x1 - crop.x0) * img.naturalWidth));
      const sh = Math.max(1, Math.round((crop.y1 - crop.y0) * img.naturalHeight));
      const c = document.createElement('canvas');
      c.width = sw; c.height = sh;
      c.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
      scrollApplyPreprocInPlace(c, scrollDefaults);
      onApply(c.toDataURL('image/png'));
    } finally {
      setBusy(false);
    }
  }

  // "이 구간 다시 스캔"은 이 그룹의 원래 구간(정밀 동기화로 이미 알고 있는 timeRange)을 시작값으로,
  // "영상에서 직접 구간 선택"은 앞뒤로 여유를 둔 더 넓은 구간을 기본값으로 제시한다.
  const groupStart = timeRange ? timeRange.start : 0;
  const groupEnd = timeRange ? timeRange.end : (duration || 1);
  const pad = Math.max(0.3, (groupEnd - groupStart) * 0.3);
  const common = { videoRef, roi, scrollDefaults, direction, maxDuration: duration, groupImgSrc, timeAtFrac, onApplyStitch, onCancel };

  return (
    <div className="block" style={{ borderColor: 'var(--accent)' }}>
      <div className="block-head"><span>이 구간 다시 만들기</span></div>
      <div className="toolbar">
        <button className="icon-btn" style={mode === 'rescan' ? { borderColor: 'var(--accent)', color: 'var(--accent)' } : undefined} onClick={() => setMode('rescan')}>이 구간 다시 스캔</button>
        <button className="icon-btn" style={mode === 'manual-range' ? { borderColor: 'var(--accent)', color: 'var(--accent)' } : undefined} onClick={() => setMode('manual-range')}>영상에서 직접 구간 선택</button>
        <button className="icon-btn" style={mode === 'upload' ? { borderColor: 'var(--accent)', color: 'var(--accent)' } : undefined} onClick={() => setMode('upload')}>로컬 이미지 업로드</button>
      </div>
      {mode === 'rescan' && (
        <RangeRescanPanel key={'rescan-' + groupStart + '-' + groupEnd} {...common}
          initialStart={Math.max(0, groupStart)} initialEnd={Math.min(duration || groupEnd, groupEnd)}
          hint="원래 이 그룹이 차지했던 구간을 그대로 다시 스캔합니다 (여러 프레임에 걸친 내용도 놓치지 않습니다)." />
      )}
      {mode === 'manual-range' && (
        <RangeRescanPanel key={'manual-' + groupStart + '-' + groupEnd} {...common}
          initialStart={Math.max(0, groupStart - pad)} initialEnd={Math.min(duration || groupEnd, groupEnd + pad)}
          hint="구간을 자유롭게 넓히거나 옮겨서 앞/뒤 누락분까지 포함해 다시 스캔할 수 있습니다." />
      )}
      {mode === 'upload' && (
        <React.Fragment>
          <div className="controls">
            <label>이미지 파일: <input type="file" accept="image/*" onChange={onUploadFile} /></label>
          </div>
          {uploadSrc && <ImageCropPicker src={uploadSrc} crop={uploadCrop} setCrop={setUploadCrop} />}
          <div className="toolbar">
            <button onClick={applyFromUpload} disabled={busy || !uploadSrc}>{busy ? '처리 중...' : '이 이미지로 대체'}</button>
            <button className="icon-btn" onClick={onCancel} disabled={busy}>취소</button>
          </div>
        </React.Fragment>
      )}
    </div>
  );
}

// 이음새 주변 2배 확대 미리보기 (초록선 = 현재 이음새 위치, 내보내는 이미지에는 포함되지 않음)
function SeamZoom({ canvas, pos, space }) {
  const ref = useRef(null);
  useEffect(() => {
    const cv = ref.current;
    if (!cv) return;
    const half = Math.max(48, Math.round((space || 12) * 5));
    const x0 = Math.max(0, Math.round(pos) - half), x1 = Math.min(canvas.width, Math.round(pos) + half);
    const w = Math.max(1, x1 - x0);
    cv.width = w * 2; cv.height = canvas.height * 2;
    const ctx = cv.getContext('2d');
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(canvas, x0, 0, w, canvas.height, 0, 0, w * 2, canvas.height * 2);
    ctx.strokeStyle = 'rgba(0,160,0,0.85)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo((pos - x0) * 2, 0); ctx.lineTo((pos - x0) * 2, cv.height); ctx.stroke();
  }, [canvas, pos, space]);
  return <canvas ref={ref} style={{ maxWidth: '100%', border: '1px solid var(--border-strong)' }} />;
}

function ScrollResultStep({ videoRef, scrollCapture, scrollDefaults, onBack, onModeBack }) {
  const { videoFile, roi, bursts } = scrollCapture;
  // 영상 유형 재선택("이 유형으로 다시 만들기")으로 통째로 바뀔 수 있는 값들은 built 상태에 둔다
  const [built, setBuilt] = useState({
    direction: scrollCapture.direction, directionNcc: scrollCapture.directionNcc, mode: scrollCapture.mode,
    frameLen: scrollCapture.frameLen, notes: scrollCapture.notes, typeInfo: scrollCapture.typeInfo, markerRaw: scrollCapture.markerData,
    profile: scrollCapture.profile,
  });
  const { direction, directionNcc, mode, frameLen, notes, typeInfo, markerRaw, profile } = built;
  const barsProfRef = useRef(0), groupProfRef = useRef(0);
  const [typeChoice, setTypeChoice] = useState(scrollCapture.transition || 'auto');
  const [rebuilding, setRebuilding] = useState(false);
  const [rebuildMsg, setRebuildMsg] = useState('');
  // 단일 진실 = 조각(frame) 목록. 이음새 미세 조정·구간 재스캔 패치는 이 목록만 편집하고, 스티치 이미지·
  // 이음새 위치·마커 좌표·시간 매핑은 모두 여기서 다시 파생된다.
  const [rawFrames, setRawFrames] = useState(scrollCapture.rawFrames);
  const layout = useMemo(() => renderFrames(rawFrames, direction), [rawFrames, direction]);
  const stitchedCanvas = layout.canvas;
  const placed = layout.placed;
  const stitchAxisLen = direction === 'vertical' ? stitchedCanvas.height : stitchedCanvas.width;
  const markerData = useMemo(() => {
    if (!markerRaw) return null;
    const allPoints = markerPointsToGlobal(markerRaw.rawPoints, placed);
    return { ...validateMarkerTrack(allPoints), allPoints };
  }, [markerRaw, placed]);

  // "몇 마디씩 묶기(목표)"의 기본값 — 사용자가 아직 직접 입력하지 않았다면(null) 이미 감지된 총
  // 마디 수를 그대로 따라가며 채워둔다. 한 번이라도 직접 타이핑하면 그 값을 그대로 쓴다.
  const [groupSizeUser, setGroupSizeUser] = useState(null);
  const [maxBarsUser, setMaxBarsUser] = useState(null);
  const [overrides, setOverrides] = useState({}); // key -> dataUrl (로컬 이미지 업로드로 대체한 그룹)
  const [overrideOpenKey, setOverrideOpenKey] = useState(null);
  const [sending, setSending] = useState(false);
  const [showAllFix, setShowAllFix] = useState(false);
  const [groupBasis, setGroupBasis] = useState('auto'); // 'auto' | 'bar' | 'width'
  const [showOverlay, setShowOverlay] = useState(true);
  const [seamSel, setSeamSel] = useState(null);
  const [seamAdjAll, setSeamAdjAll] = useState(true);
  const groupResultRef = useRef(null);
  const overlayRef = useRef(null);

  // 마디선 감지 임계값 — 슬라이더를 드래그하는 동안 매 틱마다 O(전체 픽셀) 재계산이 도는 걸 막기 위해
  // 표시값(Input)과 실제 계산에 쓰는 값(Thresh)을 분리해 살짝 debounce한다. 연속도 임계는 기본 자동 보정
  // (plateau)이고, 슬라이더를 건드리면 수동 override(자동 해제).
  const [staffThreshInput, setStaffThreshInput] = useState(0.6);
  const [barThreshInput, setBarThreshInput] = useState(0.95);
  const [staffThresh, setStaffThresh] = useState(0.6);
  const [barThresh, setBarThresh] = useState(0.95);
  const [barAuto, setBarAuto] = useState(true);
  useEffect(() => {
    const t = setTimeout(() => { setStaffThresh(staffThreshInput); setBarThresh(barThreshInput); }, 200);
    return () => clearTimeout(t);
  }, [staffThreshInput, barThreshInput]);

  const detection = useMemo(
    () => {
      const tb = performance.now();
      const r = detectStaffAndBars(stitchedCanvas, staffThresh, barAuto ? null : barThresh, frameLen, direction === 'vertical' ? null : placed);
      barsProfRef.current = (performance.now() - tb) / 1000;
      return r;
    },
    [stitchedCanvas, staffThresh, barThresh, barAuto, frameLen, placed, direction]
  );
  const bars = detection.bars;
  const staffFound = detection.staffFound;
  const quality = detection.quality;
  const measureCount = Math.max(0, bars.length - 1);
  // 묶기 기본값: 목표 = round(화면 1장 폭 ÷ 중앙값 마디 폭)을 2~6으로 제한, 최대 = 목표+2. 사용자가 입력하기
  // 전까지만 자동이고, 목표 > 최대면 최대를 목표로 올린다.
  const autoGroupSize = quality.medianWidth ? Math.max(2, Math.min(6, Math.round(frameLen / quality.medianWidth))) : 4;
  const groupSize = groupSizeUser != null ? groupSizeUser : autoGroupSize;
  const maxBarsPerGroup = Math.max(maxBarsUser != null ? maxBarsUser : groupSize + 2, groupSize);
  const measureW = useMemo(() => robustMeasureWidth(bars), [bars]);
  const blank = useMemo(
    () => (detection.system ? computeBlankColumns(detection.gray, detection.system, 140) : new Uint8Array(stitchedCanvas.width)),
    [detection, stitchedCanvas]
  );

  // 오선 자체를 못 찾았을 때만 "전체를 하나의 이미지로" 자동 제안 — 오선은 찾았는데 마디선이 부족/불안정하면
  // 폭 기준 분할로 계속 진행한다. 사용자가 체크박스를 직접 만지면 그 선택을 따른다.
  const [wholeImageFallback, setWholeImageFallback] = useState(null);
  const effectiveFallback = wholeImageFallback !== null ? wholeImageFallback : !staffFound;

  const useBarGroups = !effectiveFallback && bars.length >= 2 && (groupBasis === 'bar' || (groupBasis === 'auto' && !quality.low));

  const tg = performance.now();
  let groups;
  if (effectiveFallback) groups = [{ startIdx: 0, endIdx: measureCount, startX: 0, endX: stitchAxisLen, count: measureCount || null, whole: true }];
  else if (useBarGroups) groups = groupBarsByTargetWidth(bars, groupSize, maxBarsPerGroup);
  else groups = groupByWidth(stitchAxisLen, groupSize, maxBarsPerGroup, measureW, frameLen, bars, blank, detection.system ? detection.system.space : 8);

  groupProfRef.current = (performance.now() - tg) / 1000;
  // 컷 이음새 자동 검증 — 이음새를 낀 마디 폭, 양쪽 내용 중복 흔적. 통과 못 한 이음새만 저신뢰.
  const seamChecks = useMemo(() => validateCutSeams(layout.seams, bars, detection, quality.low), [layout.seams, bars, detection, quality.low]);
  const seamsV = layout.seams.map((s, i) => ({
    ...s, flagged: !!(seamChecks[i] && seamChecks[i].flagged),
    reason: (seamChecks[i] && seamChecks[i].reason) || (s.dupSuspect ? '이음매 양쪽에 같은 마디가 반복됨 (자동 수정 실패)' : (s.ovl && s.ovl.kind === 'unverifiable' ? ('겹침 판단 불가' + (s.ovl.why ? ' (' + s.ovl.why + ')' : '')) : null)),
  }));
  const seamsInfo = seamsV.map((s, i) => ({
    ...s, widthRatio: seamChecks[i] ? seamChecks[i].widthRatio : null,
    needsFix: s.flagged || s.dupSuspect || (s.ovl && s.ovl.kind === 'unverifiable') || (!s.cut && !s.dup && s.score != null && s.score < 0.7),
  }));
  const fixSeams = seamsInfo.filter(s => s.needsFix); // 수정 후 검증을 다시 통과하면 자동으로 목록·깃발에서 빠진다
  const curSeam = fixSeams.length ? (fixSeams.find(s => s.i === seamSel) || fixSeams[0]) : null;
  // 전처리에서 복원한 오선 줄의 y좌표들 (가로 스크롤: 스티치 y == 타일 y)
  const restoredRows = [];
  for (const f of placed) if (f.staffPre) for (const r of f.staffPre) if (r.restored || r.weakAdded) restoredRows.push((r.y0 + r.y1) / 2);
  const isRestoredY = y => restoredRows.some(ry => Math.abs(ry - y) <= 2);
  const overlayScale = Math.min(1, 150 / stitchedCanvas.height, 12000 / stitchedCanvas.width);
  const stripW = Math.max(1, Math.round(stitchedCanvas.width * overlayScale));
  const stripH = Math.max(1, Math.round(stitchedCanvas.height * overlayScale));
  const stripScrollRef = useRef(null);
  const zoomBlockRef = useRef(null);
  const CIRCLED = ['①','②','③','④','⑤','⑥','⑦','⑧','⑨','⑩','⑪','⑫','⑬','⑭','⑮','⑯','⑰','⑱','⑲','⑳'];
  const circled = n => CIRCLED[n - 1] || ('(' + n + ')');

  const groupsBase = groups.map(g => {
    const confidence = groupConfidence(seamsV, g.startX, g.endX);
    const key = g.whole ? 'whole' : ((g.byWidth ? 'w' : '') + g.startIdx + '-' + g.endIdx);
    const timeRange = {
      start: timeForGlobalX(markerData, placed, g.startX),
      end: timeForGlobalX(markerData, placed, g.endX),
    };
    return { ...g, key, confidence, lowConfidence: confidence < 0.7, override: overrides[key], timeRange };
  });
  // 누락 의심: (timeRange 길이 ÷ 픽셀 폭)이 전체 중앙값 대비 ±40%를 넘는 그룹
  const timePerPx = groupsBase.map(g => (g.timeRange.end - g.timeRange.start) / Math.max(1, g.endX - g.startX));
  const medTpp = medianOf(timePerPx);
  const groupsWithMeta = groupsBase.map((g, i) => ({
    ...g,
    suspect: groupsBase.length >= 3 && medTpp > 0 && Math.abs(timePerPx[i] / medTpp - 1) > 0.4,
  }));

  const outlierBursts = bursts.filter(b => b.isOutlier);

  // 디버그 오버레이 — 사용된 밴드(파랑 사각형)·마디선(빨강)·이음새(초록 가는 선). 화면용 canvas에만 그리며
  // 내보내는 이미지(stitchedCanvas에서 직접 crop)에는 포함되지 않는다.
  useEffect(() => {
    const cv = overlayRef.current;
    if (!cv || !showOverlay) return;
    const h0 = stitchedCanvas.height, w0 = stitchedCanvas.width;
    const scale = overlayScale;
    cv.width = Math.max(1, Math.round(w0 * scale)); cv.height = Math.max(1, Math.round(h0 * scale));
    const ctx = cv.getContext('2d');
    ctx.drawImage(stitchedCanvas, 0, 0, cv.width, cv.height);
    if (detection.system) {
      ctx.lineWidth = 1;
      for (const sy of detection.system.systems) {
        ctx.strokeStyle = sy === detection.system.main ? 'rgba(0,90,255,0.9)' : 'rgba(150,150,150,0.9)';
        for (const st of sy.staves) {
          const y0 = st[0].y0 * scale, y1 = st[st.length - 1].y1 * scale;
          ctx.strokeRect(0.5, y0, cv.width - 1, Math.max(1, y1 - y0));
        }
      }
    }
    // 마디선: 모든 단 통과 = 빨강, 단 사이 간격 구간까지 연속 = 진한 빨강, 시작/끝 경계 = 연한 빨강
    bars.forEach((b, i) => {
      const info = detection.barInfos && detection.barInfos[i];
      ctx.strokeStyle = !info || info.kind !== 'bar' ? 'rgba(255,120,120,0.6)' : (info.gapConn ? 'rgb(140,0,0)' : 'rgba(230,30,30,0.9)');
      ctx.beginPath(); ctx.moveTo(b * scale + 0.5, 0); ctx.lineTo(b * scale + 0.5, cv.height); ctx.stroke();
    });
    // 검출된 오선 줄: 실선 = 일반, 점선(주황) = 복원/보강된 줄
    if (detection.system) {
      for (const l of detection.system.main.lines) {
        const dashed = l.weak || l.synth || isRestoredY(l.y);
        ctx.setLineDash(dashed ? [4, 3] : []);
        ctx.strokeStyle = dashed ? 'rgba(240,128,0,0.95)' : 'rgba(0,90,255,0.35)';
        ctx.beginPath(); ctx.moveTo(0, l.y * scale + 0.5); ctx.lineTo(cv.width, l.y * scale + 0.5); ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    ctx.strokeStyle = 'rgba(0,160,0,0.9)';
    for (const s of layout.seams) {
      if (s.dup) continue;
      ctx.beginPath(); ctx.moveTo(s.pos * scale + 0.5, 0); ctx.lineTo(s.pos * scale + 0.5, cv.height); ctx.stroke();
    }
  }, [stitchedCanvas, detection, bars, layout.seams, showOverlay, overlayScale]);

  function applyOverride(key, dataUrl) {
    setOverrides(prev => ({ ...prev, [key]: dataUrl }));
    setOverrideOpenKey(null);
  }

  // 재스캔 결과 패치: 재스캔 시간 구간 [startT,endT]에 해당하는 전역 좌표 구간만 교체. 뒤쪽 조각(= 이음새
  // 위치)은 폭 차이만큼 자동으로 밀리고, 마커 점은 (조각 id, 로컬 좌표)로 저장돼 있어 같이 이동한다.
  function applyStitchPatch(mini, startT, endT) {
    if (!mini) return;
    if (mini.direction !== direction) { alert('스크롤 방향이 달라 적용할 수 없습니다.'); return; }
    const lo = Math.min(startT, endT), hi = Math.max(startT, endT);
    let xA = Math.round(globalXForTime(markerData, placed, stitchAxisLen, lo));
    let xB = Math.round(globalXForTime(markerData, placed, stitchAxisLen, hi));
    xA = Math.max(0, Math.min(stitchAxisLen - 1, xA));
    xB = Math.max(xA + 1, Math.min(stitchAxisLen, xB));
    setRawFrames(patchFrames(placed, xA, xB, mini.rawFrames));
    setOverrides({}); // 그룹 경계가 바뀌므로 로컬 업로드로 대체한 그룹 이미지는 초기화
    setOverrideOpenKey(null);
    setSeamSel(null);
  }

  function selectSeam(i) {
    setSeamSel(i);
    const sm = layout.seams.find(x => x.i === i);
    const el = stripScrollRef.current;
    if (sm && el) el.scrollTo({ left: Math.max(0, sm.pos * overlayScale - el.clientWidth / 2), behavior: 'smooth' });
    if (zoomBlockRef.current) zoomBlockRef.current.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  // 이음매 디버그 내보내기 — 앞 타일 A / 뒤 타일 B의 전처리 전·후 원본 해상도 PNG 4개 + 탐지 후보·파라미터 JSON 1개
  async function exportSeamDebug(seam) {
    const B = placed[seam.i + 1];
    if (!B) return;
    let ai = seam.i;
    while (ai > 0 && placed[ai].dup) ai--;
    const A = placed[ai];
    const n = seam.i + 1;
    const infoA = tileInfoOf(A.canvas), infoB = tileInfoOf(B.canvas);
    const sysRef = infoA.sys || infoB.sys;
    const space = sysRef ? sysRef.space : null;
    const frameMeta = (f, inf) => ({
      t: f.t, t0: f.t0 != null ? f.t0 : null, t1: f.t1 != null ? f.t1 : null,
      srcX: f.srcX, len: f.len, dup: !!f.dup, start: f.start,
      staff: { xL: inf.xL, xR: inf.xR, touchL: inf.touchL, touchR: inf.touchR, space: inf.sys ? inf.sys.space : null },
    });
    const meta = {
      seam: n, type: seam.cut ? 'cut' : 'smooth', posX: seam.pos,
      roiFraction: roi || null, roiSizePx: { w: A.canvas.width, h: A.canvas.height },
      videoDuration: videoRef.current ? videoRef.current.duration : null,
      params: {
        staffSpace: space, levels: space ? overlapLevels(space) : null, trimPx: 2,
        commonDelta: notes ? notes.commonDelta : null,
      },
      tileA: frameMeta(A, infoA), tileB: frameMeta(B, infoB),
      result: {
        score: seam.score, weight: seam.weight, delta: seam.delta,
        overlapKind: B.ovl ? B.ovl.kind : null, overlapPx: B.ovl ? B.ovl.px : null, overlapIou: B.ovl ? B.ovl.iou : null,
        why: B.ovl ? B.ovl.why || null : null,
        dupSuspect: !!B.dupSuspect, dupFixedPx: B.dupFixed || 0,
      },
      candidates: (B.ovl && B.ovl.cands) ? B.ovl.cands.map(c => ({ shift: c.s, iou: c.iou, ink: c.ink, source: c.src, weakInk: !!c.weak })) : [],
    };
    const pause = ms => new Promise(r => setTimeout(r, ms));
    const files = [
      ['seam' + n + '_A_original.png', A.orig || A.canvas], ['seam' + n + '_A_processed.png', A.canvas],
      ['seam' + n + '_B_original.png', B.orig || B.canvas], ['seam' + n + '_B_processed.png', B.canvas],
    ];
    for (const [name, cv] of files) { await downloadCanvasPng(cv, name); await pause(250); }
    downloadBlobFile(new Blob([JSON.stringify(meta, null, 2)], { type: 'application/json' }), 'seam' + n + '_debug.json');
  }

  async function rebuildWithType(type) {
    const video = videoRef.current;
    if (!video) return;
    setRebuilding(true);
    setRebuildMsg('다시 만드는 중...');
    try {
      const r = await buildScrollResult({
        video, roi, times: scrollCapture.times, bursts: scrollCapture.rawBursts, scrollDefaults,
        direction: scrollCapture.directionPref, transition: type, log: setRebuildMsg,
      });
      setRawFrames(r.ex.rawFrames);
      setBuilt({
        direction: r.ex.direction, directionNcc: r.ex.directionNcc, mode: r.ex.mode, frameLen: r.ex.frameLen,
        notes: r.ex.notes, typeInfo: r.ex.typeInfo, markerRaw: r.markerData, profile: r.profile,
      });
      setOverrides({}); setOverrideOpenKey(null); setSeamSel(null); setWholeImageFallback(null);
      setRebuildMsg('');
    } catch (err) {
      setRebuildMsg('다시 만들기 오류: ' + err.message);
    } finally {
      setRebuilding(false);
    }
  }

  function nudgeSeam(d) {
    if (!curSeam) return;
    setRawFrames(prev => adjustCutSeam(prev, curSeam.i, d, seamAdjAll));
  }
  function onSeamKey(e) {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const step = e.shiftKey ? 10 : 1;
    nudgeSeam(e.key === 'ArrowLeft' ? step : -step);
  }

  async function handleSendToScoreBuilder() {
    setSending(true);
    try {
      const sourceId = videoFile ? ('vsrc_' + Date.now() + '_' + Math.random().toString(36).slice(2)) : null;
      const finalItems = groupsWithMeta.map((g, idx) => {
        const canvas = g.override ? null : cropGroupCanvas(stitchedCanvas, direction, g);
        const src = g.override || canvas.toDataURL('image/png');
        return {
          id: 'scroll_' + Date.now() + '_' + idx,
          type: 'image', src,
          invert: false, override: { ...MERGED_ROW_NEUTRAL_OVERRIDE },
          lyrics: { tags: [], areaHeightRatio: null },
          playheadExcluded: [], barLayout: null,
          stitchMeta: {
            source: 'scroll', direction, directionNcc, groupIndex: idx, transition: mode,
            barRange: [g.startIdx, g.endIdx], barCount: g.count, byWidth: !!g.byWidth, confidence: g.confidence,
            manuallyReplaced: !!g.override,
          },
          timeRange: g.timeRange,
          videoSourceId: sourceId,
        };
      });
      if (sourceId && videoFile) {
        await dbPut(VIDEO_SOURCE_KEY_PREFIX + sourceId, { videoBlob: videoFile, onsets: [], savedAt: Date.now() });
      }
      await dbPut(VIDEO_IMPORT_KEY, { items: finalItems, importedAt: Date.now() });
      window.location.href = 'tab-score-builder.html';
    } catch (err) {
      alert('전달 중 오류가 발생했습니다: ' + err.message);
      setSending(false);
    }
  }

  const barSliderValue = barAuto ? detection.threshUsed : barThreshInput;

  return (
    <div>
      <div className="block">
        <div className="block-head"><span>결과 — 이어붙이기 · 마디선 · 그룹 (재조정 가능)</span></div>
        <p className="hint-text">
          방향: {direction === 'vertical' ? '세로' : '가로'} 스크롤{directionNcc != null ? ' (첫 이음매 NCC=' + directionNcc.toFixed(3) + ')' : ''} ·
          전환 방식: {mode === 'cut' ? '컷 전환(타일링, 맞대어 붙이기)' : '부드러운 스크롤(NCC 겹침)'} ·
          이어붙인 조각 {rawFrames.length}개 ·{' '}
          {markerData && markerData.confident
            ? <span className="badge badge-precise">정밀 동기화됨 (재생 표시 감지 · 추적점 {markerData.count}개)</span>
            : <span className="badge badge-estimate">추정값 (재생 표시 없음 — {mode === 'cut' ? '타일 내 선형 보간' : '구간별 보간'}){markerData ? ' · 추적점 ' + markerData.count + '개(부족)' : ''}</span>}
        </p>
        <div className="toolbar">
          <label>영상 유형:
            <select value={typeChoice} onChange={e => setTypeChoice(e.target.value)} disabled={rebuilding} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="auto">자동</option>
              <option value="smooth">부드러운 스크롤</option>
              <option value="cut">컷 전환</option>
            </select>
          </label>
          <button className="icon-btn" onClick={() => rebuildWithType(typeChoice)} disabled={rebuilding}>{rebuilding ? '다시 만드는 중...' : '이 유형으로 다시 만들기'}</button>
          {rebuildMsg && <span className="save-msg">{rebuildMsg}</span>}
        </div>
        {profile && (() => {
          const st = profile.stages || {};
          const barsSec = barsProfRef.current, grpSec = groupProfRef.current;
          const pipeKeys = ['분류', '캡처', '이음', '재생표시'];
          const pipeSum = pipeKeys.reduce((a, k) => a + (st[k] ? st[k].sec : 0), 0);
          const other = Math.max(0, profile.pipelineSec - pipeSum) + grpSec;
          const total = (profile.diff ? profile.diff.sec : 0) + profile.pipelineSec + barsSec + grpSec;
          const rows = [
            ['diff 스캔', profile.diff], ['burst 분류', st['분류']], ['타일 대표 프레임 캡처', st['캡처']],
            ['타일 이음(겹침 탐지 포함)', st['이음']], ['재생 표시 추적', st['재생표시']],
            ['마디선 검출', { sec: barsSec, seeks: 0, captures: 0, hits: 0 }], ['그룹화·기타', { sec: other, seeks: 0, captures: 0, hits: 0 }],
          ];
          return (
            <details>
              <summary className="slider-label" style={{ cursor: 'pointer' }}>
                단계별 소요 시간 — 총 {total.toFixed(1)}초{profile.videoDuration ? ' (영상 ' + profile.videoDuration.toFixed(1) + '초 대비 ' + (total / profile.videoDuration).toFixed(2) + '배)' : ''}
              </summary>
              <div style={{ fontSize: '12px' }}>
                {rows.map(([name, r]) => (
                  <div key={name}>{name}: {r ? r.sec.toFixed(2) : '0.00'}초 · seek {r ? r.seeks : 0}회 · 캡처 {r ? r.captures : 0}회{r && r.hits ? ' (캐시 재사용 ' + r.hits + '회)' : ''}</div>
                ))}
              </div>
            </details>
          );
        })()}
        {seamsInfo.some(x => x.cut && !x.dup) && (
          <p className="hint-text" style={{ margin: '4px 0' }}>
            겹침 확정 {seamsInfo.filter(x => x.cut && !x.dup && x.ovl && x.ovl.kind === 'overlap').length} / 없음 {seamsInfo.filter(x => x.cut && !x.dup && x.ovl && x.ovl.kind === 'none').length} / 판단 불가 {seamsInfo.filter(x => x.cut && !x.dup && x.ovl && x.ovl.kind === 'unverifiable').length}
          </p>
        )}
        {typeInfo && <p className="hint-text" style={{ margin: '4px 0' }}>선택된 유형: <b>{typeInfo.decided === 'cut' ? '컷 전환(타일링)' : '부드러운 스크롤(NCC)'}</b> — {typeInfo.reason}</p>}
        {notes && notes.roiNarrow && (
          <p className="hint-text" style={{ color: '#c0392b' }}>
            ⚠ 오선이 영역(ROI) 양쪽 끝까지 닿아 있습니다. 지정한 영역이 뷰어의 악보 영역보다 좁아 이음새에서 내용이 빠질 수 있으니, 영역을 더 넓게 지정해서 다시 시도하세요.
          </p>
        )}
        {outlierBursts.length > 0 && (
          <p className="hint-text" style={{ color: '#c0392b' }}>
            ⚠ 다른 구간보다 유독 길거나 짧은 스크롤 구간이 {outlierBursts.length}개 있습니다 (아래 그룹 중 테두리가 강조된 곳을 확인하세요).
          </p>
        )}

        <div className="hr" />
        <div className="toolbar">
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>6선 감지 임계값</span>
            <input type="range" min="0.1" max="0.95" step="0.01" value={staffThreshInput} style={{ flex: 1 }}
              onChange={e => setStaffThreshInput(parseFloat(e.target.value))} />
            <span className="slider-label" style={{ margin: 0 }}>{staffThreshInput.toFixed(2)}</span>
          </label>
        </div>
        <div className="toolbar">
          <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
            <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }}>마디선 연속도 임계값</span>
            <input type="range" min="0.5" max="1" step="0.01" value={barSliderValue} style={{ flex: 1 }}
              onChange={e => { setBarAuto(false); setBarThreshInput(parseFloat(e.target.value)); }} />
            <span className="slider-label" style={{ margin: 0 }}>{barSliderValue.toFixed(2)}{barAuto ? ' (자동)' : ''}</span>
          </label>
          <label><input type="checkbox" checked={barAuto} onChange={e => setBarAuto(e.target.checked)} /> 자동 보정</label>
        </div>
        <p className="hint-text" style={{ margin: '4px 0' }}>
          {staffFound ? ('보표 구조 인식됨 · 보표 ' + detection.system.main.staves.length + '개 · 마디선 ' + bars.length + '개 (마디 ' + measureCount + '개) 검출됨') : '보표(오선)를 찾지 못했습니다.'}
          {staffFound && (' · 보표 간 연결 점수: ' + (detection.system.connScores.length
            ? detection.system.connScores.map(c => c.toFixed(2)).join(', ')
            : (detection.system.splitScores.length ? ('연결 획 없음 → 분리됨 (' + detection.system.splitScores.map(c => c.toFixed(2)).join(', ') + ')') : '단일 보표')))}
          {staffFound && (
            <span><br />검출된 오선 줄 (y좌표 · 행별 어두움 비율): {detection.system.main.lines.map((l, k) =>
              (k > 0 ? ' / ' : '') + Math.round(l.y) + ' (' + (l.ratio != null ? l.ratio.toFixed(2) : '-') + ')' + (l.weak ? ' 보강' : '') + (isRestoredY(l.y) ? ' 복원' : '')).join('')}
              · 밴드 {Math.round(detection.system.main.top)}~{Math.round(detection.system.main.bottom)}</span>
          )}
          {staffFound && detection.stats && (
            <span><br />마디선 검출: 후보 {detection.stats.cand} → 단별 통과 {detection.stats.allStaff} → 헤더제외 후 {detection.stats.afterHeader} → 정리 후 {detection.stats.afterPrune} (삐져나옴으로 제외 {detection.stats.protruded}개 / 지속성으로 제외 {detection.stats.notPersistent}개 / 양 끝 불일치 {detection.stats.endMismatch}개) (사용 T={detection.threshUsed.toFixed(2)}{detection.auto ? ' 자동' : ' 수동'})</span>
          )}
          {staffFound && quality.weak && <b style={{ color: '#c0392b' }}> · 마디선 인식 약함 — 폭 기준 그룹화로 자동 전환</b>}
          {staffFound && quality.low && !quality.weak && (
            <b style={{ color: '#c0392b' }}> · 마디 인식 신뢰도 낮음
              ({quality.measureCount < 1 ? '마디선 없음' : ('폭 정상 비율 ' + Math.round(quality.widthOk * 100) + '%' + (quality.perView != null ? ', ROI 폭당 ' + quality.perView.toFixed(1) + '마디' : ''))})
              {!effectiveFallback && !useBarGroups && ' — 폭 기준 분할로 자동 전환됨'}
            </b>
          )}
        </p>
        <div className="toolbar">
          <label><input type="checkbox" checked={effectiveFallback} onChange={e => setWholeImageFallback(e.target.checked)} />
            마디선 없이 스티칭 결과 전체를 그대로 하나의 이미지로 사용</label>
          <label><input type="checkbox" checked={showOverlay} onChange={e => setShowOverlay(e.target.checked)} /> 디버그 오버레이 표시</label>
          <button className="icon-btn" onClick={() => stitchedCanvas.toBlob(blob => {
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob); a.download = 'stitched-original.png';
            document.body.appendChild(a); a.click(); a.remove();
            setTimeout(() => URL.revokeObjectURL(a.href), 1000);
          }, 'image/png')}>스티치 원본 PNG 다운로드 (디버그)</button>
        </div>
        {fixSeams.length > 0 ? (
          <div className="toolbar">
            <b style={{ color: '#e07000' }}>수정 필요 이음매 {fixSeams.length}개:</b>
            {fixSeams.map((s, n) => (
              <button key={s.i} className="icon-btn" title={s.reason || ('NCC ' + (s.score != null ? s.score.toFixed(2) : '-'))}
                style={{ color: '#e07000', borderColor: '#e07000', fontWeight: 700, background: curSeam && curSeam.i === s.i ? '#fff1de' : undefined }}
                onClick={() => selectSeam(s.i)}>{circled(n + 1)}</button>
            ))}
          </div>
        ) : (seamsInfo.some(s => !s.dup) && <p className="hint-text" style={{ margin: '4px 0', color: '#1e7d3c' }}>수정 필요한 이음매 없음 (모든 이음매가 검증 통과)</p>)}
        {showOverlay && (
          <div ref={stripScrollRef} style={{ overflowX: 'auto', border: '1px solid var(--border-strong)', background: '#fff' }}>
            <div style={{ position: 'relative', width: stripW, paddingTop: 22 }}>
              <canvas ref={overlayRef} style={{ display: 'block' }} />
              {fixSeams.map((s, n) => {
                const sel = curSeam && curSeam.i === s.i;
                return (
                  <React.Fragment key={s.i}>
                    <div style={{ position: 'absolute', left: s.pos * overlayScale - (sel ? 2 : 1), top: 22, width: sel ? 4 : 2, height: stripH, background: 'rgba(240,128,0,0.9)', pointerEvents: 'none' }} />
                    <button onClick={() => selectSeam(s.i)} title={s.reason || 'NCC 낮음'}
                      style={{ position: 'absolute', left: s.pos * overlayScale, top: 0, transform: 'translateX(-50%)', fontSize: sel ? 18 : 12, fontWeight: 700, color: '#fff', background: '#f08000', border: 'none', borderRadius: 4, padding: '0 5px', lineHeight: '20px', cursor: 'pointer', whiteSpace: 'nowrap' }}>
                      ▼{n + 1}
                    </button>
                  </React.Fragment>
                );
              })}
            </div>
          </div>
        )}
        <details open={fixSeams.length > 0}>
          <summary className="slider-label" style={{ cursor: 'pointer' }}>이음매 점수 목록 ({seamsInfo.length}개, 정상 포함 — 실패 기준을 같이 표시)</summary>
          <div style={{ fontSize: '12px' }}>
            {seamsInfo.map(s => {
              let scoreText, criterion;
              if (s.dup) { scoreText = '중복 타일(제외됨)'; criterion = '-'; }
              else if (s.cut) {
                scoreText = (s.score == null || !(s.weight >= 4)) ? ('연속도 판단 보류 (가중 ' + (s.weight || 0) + ')') : ('연속도 ' + s.score.toFixed(2) + ' (가중 ' + s.weight + ')');
                criterion = (quality.low ? '실패 기준: 연속도 < 0.40 (가중 ≥ 4) 또는 내용 중복' : '실패 기준: 낀 마디 폭이 중앙값의 0.4~2.5배 밖 또는 내용 중복')
                  + (s.widthRatio != null ? ' · 마디 폭 비 ' + s.widthRatio.toFixed(2) : '');
                const o = s.ovl;
                const ovText = s.dupSuspect ? '중복 의심 (자동 수정 실패)'
                  : (s.dupFixed ? ('중복 의심 → 자동 수정 (' + s.dupFixed + 'px 제거)')
                    : (o && o.kind === 'overlap' ? ('겹침 ' + o.px + 'px 제거 (IoU ' + o.iou.toFixed(2) + ')')
                      : (o && o.kind === 'unverifiable' ? ('겹침 판단 불가' + (o.why ? '(' + o.why + ')' : '') + ' — 맞대어 붙임, 확인 필요') : '겹침 없음')));
                scoreText = ovText + ' · ' + scoreText;
                if (o && o.cands && o.cands.length) {
                  criterion += ' · 후보: ' + o.cands.map(c => 'shift ' + c.s + ' / IoU ' + c.iou.toFixed(2) + ' / 잉크 ' + c.ink + ' (' + (c.src === 'bar' ? '마디선' : 'NCC') + (c.weak ? ', 잉크 부족' : '') + ')').join(' ; ');
                }
              } else { scoreText = 'NCC ' + (s.score != null ? s.score.toFixed(2) : '-'); criterion = '실패 기준: NCC < 0.70'; }
              return (
                <div key={s.i} onClick={() => !s.dup && selectSeam(s.i)}
                  style={{ padding: '2px 4px', cursor: s.dup ? 'default' : 'pointer', color: s.needsFix ? '#c05000' : undefined, fontWeight: s.needsFix ? 700 : 400 }}>
                  #{s.i + 1} · {s.cut ? '컷' : 'NCC'} · x={Math.round(s.pos)}px · {scoreText} · {criterion} · {s.dup ? '제외' : (s.needsFix ? ('수정 필요' + (s.reason ? ' (' + s.reason + ')' : '')) : '정상')}
                  {!s.dup && <button className="icon-btn" style={{ marginLeft: '8px', fontSize: '11px' }} onClick={e => { e.stopPropagation(); exportSeamDebug(s); }}>디버그 내보내기</button>}
                </div>
              );
            })}
          </div>
        </details>
        {showOverlay && <p className="hint-text" style={{ margin: '4px 0' }}>파랑 = 사용된 시스템의 각 보표 밴드(회색 = 다른 시스템) · 빨강 = 모든 단 통과 마디선 / 진한 빨강 = 단 사이 간격까지 연속 · 초록 = 이음새 위치 · 주황 깃발 = 수정 필요 이음새 (화면 표시용, 내보내는 이미지에는 포함되지 않음)</p>}

        <div className="hr" />
        <div className="toolbar">
          <label>몇 마디씩 묶기(목표): <input type="number" min="1" max="16" value={groupSize} disabled={effectiveFallback}
            onChange={e => setGroupSizeUser(Math.max(1, parseInt(e.target.value) || 1))} style={{ width: '4em' }} /></label>
          <label>그룹당 최대 마디수: <input type="number" min="1" max="20" value={maxBarsPerGroup} disabled={effectiveFallback}
            onChange={e => setMaxBarsUser(Math.max(1, parseInt(e.target.value) || 1))} style={{ width: '4em' }} /></label>
          <span className="hint-text" style={{ margin: 0 }}>자동 기준: 화면 1장 분량{groupSizeUser == null ? ' (목표 ' + autoGroupSize + '마디, 최대 ' + (autoGroupSize + 2) + ')' : ''}</span>
          <label>그룹 기준:
            <select value={groupBasis} onChange={e => setGroupBasis(e.target.value)} disabled={effectiveFallback} style={{ width: 'auto', marginLeft: '6px' }}>
              <option value="auto">자동 (신뢰도 낮으면 폭 기준)</option>
              <option value="bar">마디선 기준</option>
              <option value="width">폭 기준</option>
            </select>
          </label>
          <span className="save-msg">{effectiveFallback ? '전체 1개 그룹' : (useBarGroups ? (measureCount + '마디 → ' + groups.length + '개 그룹') : ('폭 기준 분할 → ' + groups.length + '개 그룹'))}</span>
        </div>
      </div>

      {fixSeams.length > 0 && curSeam && (
        <div className="block" style={{ borderColor: '#c0392b' }} ref={zoomBlockRef}>
          <div className="block-head"><span>이음새 미세 조정 — 수정 필요 이음새 {fixSeams.length}개</span></div>
          <p className="hint-text">
            선택한 이음새 {circled(fixSeams.findIndex(s => s.i === curSeam.i) + 1)}: {curSeam.reason || ('NCC ' + (curSeam.score != null ? curSeam.score.toFixed(2) : '-') + ' (기준 0.70 미만)')}. 아래 확대 미리보기를 클릭한 뒤 ←/→ 키(1px, Shift+키는 10px) 또는 버튼으로 오른쪽 타일의 위치를 맞추세요. 초록선이 현재 이음새입니다.
          </p>
          <div className="toolbar">
            {fixSeams.map((s, n) => (
              <button key={s.i} className="icon-btn" style={s.i === curSeam.i ? { borderColor: 'var(--accent)', color: 'var(--accent)' } : undefined}
                onClick={() => selectSeam(s.i)}>{circled(n + 1)} 이음새 {s.i + 1}</button>
            ))}
          </div>
          <div tabIndex={0} onKeyDown={onSeamKey} style={{ outline: 'none' }}>
            <SeamZoom canvas={stitchedCanvas} pos={curSeam.pos} space={detection.system ? detection.system.space : 12} />
          </div>
          <div className="toolbar">
            <button className="icon-btn" onClick={() => nudgeSeam(10)}>⇤ 10px</button>
            <button className="icon-btn" onClick={() => nudgeSeam(1)}>← 1px</button>
            <button className="icon-btn" onClick={() => nudgeSeam(-1)}>→ 1px</button>
            <button className="icon-btn" onClick={() => nudgeSeam(-10)}>10px ⇥</button>
            <label><input type="radio" checked={seamAdjAll} onChange={() => setSeamAdjAll(true)} /> 전체 이음새에 적용</label>
            <label><input type="radio" checked={!seamAdjAll} onChange={() => setSeamAdjAll(false)} /> 이 이음새만</label>
          </div>
        </div>
      )}

      <div className="toolbar">
        <label><input type="checkbox" checked={showAllFix} onChange={e => setShowAllFix(e.target.checked)} /> 모든 그룹에 수동 보정 버튼 표시 (기본: 자동 처리로 해결 안 된 그룹에만 표시)</label>
      </div>

      <div className="list" ref={groupResultRef}>
        {(() => {
          // 마지막(또는 마디 수가 적은) 그룹이 확대되어 보이지 않도록 — 모든 그룹에 같은 displayScale(px 단위)을 적용.
          function nativeSize(g) {
            return direction === 'vertical'
              ? { w: stitchedCanvas.width, h: g.endX - g.startX }
              : { w: g.endX - g.startX, h: stitchedCanvas.height };
          }
          const containerW = (groupResultRef.current && groupResultRef.current.clientWidth) || 900;
          const widestW = Math.max(1, ...groupsWithMeta.map(g => nativeSize(g).w));
          const displayScale = Math.min(1, containerW / widestW);
          return groupsWithMeta.map((g, idx) => {
            const canvas = g.override ? null : cropGroupCanvas(stitchedCanvas, direction, g);
            const src = g.override || (canvas && canvas.toDataURL('image/png'));
            const nsize = nativeSize(g);
            const imgStyle = g.override
              ? undefined
              : { width: Math.round(nsize.w * displayScale) + 'px', height: Math.round(nsize.h * displayScale) + 'px', maxWidth: 'none' };
            const flagged = g.lowConfidence || g.suspect;
            return (
              <div key={g.key} className="block" style={flagged ? { borderColor: '#c0392b', borderWidth: '2px' } : undefined}>
                <div className="block-head">
                  <span>
                    그룹 {idx + 1}: {g.whole ? '전체 (마디선 미사용)' : (g.byWidth ? '폭 기준 분할' : (g.count + '마디'))}
                    <span className="save-msg"> · {g.timeRange.start.toFixed(2)}s ~ {g.timeRange.end.toFixed(2)}s</span>
                    {g.lowConfidence && <b style={{ color: '#c0392b' }}> · 저신뢰 구간 ({seamsV.some(s => s.cut && s.flagged && s.pos > g.startX - 1 && s.pos < g.endX + 1) ? '이음새 검증 실패' : 'NCC ' + g.confidence.toFixed(2)})</b>}
                    {g.suspect && <b style={{ color: '#c0392b' }}> · 누락 의심 (시간 대비 내용량 불일치)</b>}
                    {g.override && <span className="save-msg"> · 수동으로 다시 만듦</span>}
                  </span>
                  {(flagged || showAllFix) && (
                    <button className="icon-btn" onClick={() => setOverrideOpenKey(overrideOpenKey === g.key ? null : g.key)}>
                      이 구간 다시 만들기
                    </button>
                  )}
                </div>
                {src && <img src={src} className="merge-preview-img" style={imgStyle} alt={'그룹 ' + (idx + 1)} />}
                {overrideOpenKey === g.key && (
                  <GroupOverridePanel videoRef={videoRef} scrollDefaults={scrollDefaults} roi={roi}
                    direction={direction} timeRange={g.timeRange} groupImgSrc={src}
                    timeAtFrac={frac => timeForGlobalX(markerData, placed, g.startX + frac * (g.endX - g.startX))}
                    onApply={dataUrl => applyOverride(g.key, dataUrl)}
                    onApplyStitch={applyStitchPatch}
                    onCancel={() => setOverrideOpenKey(null)} />
                )}
              </div>
            );
          });
        })()}
      </div>

      <div className="toolbar">
        <button className="icon-btn" onClick={onBack} disabled={sending}>← 대표 프레임 다시 고르기</button>
        <button className="icon-btn" onClick={onModeBack} disabled={sending}>모드 다시 선택</button>
        <button onClick={handleSendToScoreBuilder} disabled={sending}>
          {sending ? '전달 중...' : 'TAB 악보 만들기로 넘기기 (' + groups.length + '개) →'}
        </button>
      </div>
    </div>
  );
}

// ================================================================================================
// 연속 이동형(flow) 모드 — 악보가 멈춤 없이 가로로 계속 흐르는 영상 (오른쪽에서 들어와 왼쪽으로 나감)
// 1단계: 이동량 추적 + 악보 스트립 재구성. 기존 페이지전환형/스크롤형 로직은 건드리지 않고(공용 함수는 호출만)
// 이 모드 전용 함수는 모두 flow 접두어로 독립 구현한다.
// ================================================================================================

const flowInternalPlayRef = { current: false }; // 분석 패스(rVFC)가 내부적으로 재생 중임을 알리는 플래그
function flowRvfcSupported(video) { return typeof video.requestVideoFrameCallback === 'function'; }
function flowYield() { return new Promise(r => setTimeout(r, 0)); }

// 순차 재생 기반 프레임 수집 — requestVideoFrameCallback으로 프레임이 실제로 표시될 때마다 호출되며 미디어 시간
// 간격 ≥ minGap인 프레임만 onFrame(mediaTime)으로 넘긴다(seek 금지: 시작 위치를 잡을 때 한 번만 seek).
// 미지원 브라우저는 기존 seek 방식으로 폴백한다.
async function flowPlayPass(video, { startT, endT, rate, minGap, onFrame, onProgress, abortRef }) {
  const span = Math.max(0.001, endT - startT);
  if (!flowRvfcSupported(video)) {
    for (let t = startT; t <= endT && !(abortRef && abortRef.current); t += minGap) {
      await seekTo(video, t);
      onFrame(t);
      if (onProgress) onProgress((t - startT) / span);
    }
    return;
  }
  video.muted = true;
  video.playbackRate = Math.max(0.25, Math.min(3, rate || 1));
  flowInternalPlayRef.current = true; // 분석 패스의 내부 재생 — play 가드가 막지 않게 한다
  let failure = null;
  try {
    await seekSafe(video, startT);
    await new Promise(resolve => {
      let last = -Infinity, done = false;
      const finish = () => {
        if (done) return;
        done = true;
        video.pause();
        video.removeEventListener('ended', finish);
        resolve();
      };
      video.addEventListener('ended', finish);
      const cb = (now, meta) => {
        if (done) return;
        if (abortRef && abortRef.current) { finish(); return; }
        const t = meta.mediaTime;
        if (t - last >= minGap) {
          last = t;
          try { onFrame(t); } catch (err) { failure = err; finish(); return; }
          if (onProgress) onProgress(Math.min(1, (t - startT) / span));
        }
        if (t >= endT) { finish(); return; }
        video.requestVideoFrameCallback(cb);
      };
      video.requestVideoFrameCallback(cb);
      video.play().catch(err => { failure = err; finish(); });
    });
  } finally {
    // 정상 종료·에러·취소 모두 항상 복구
    flowInternalPlayRef.current = false;
    video.pause(); video.muted = true; video.playbackRate = 1;
  }
  if (failure) throw failure;
}

// ---- 1패스: ROI를 저해상도 그레이로 수집 ----
function flowMakeLowCapture(video, roi, maxW) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const scale = Math.min(1, maxW / rw);
  const w = Math.max(8, Math.round(rw * scale)), h = Math.max(4, Math.round(rh * scale));
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d', { willReadFrequently: true });
  return t => {
    ctx.drawImage(video, rx0, ry0, rw, rh, 0, 0, w, h);
    const d = ctx.getImageData(0, 0, w, h).data;
    const gray = new Uint8Array(w * h);
    for (let i = 0, p = 0; i < d.length; i += 4, p++) gray[p] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) | 0;
    return { t, gray, w, h };
  };
}

// 오선 행 평균 제거(기존 scrollRemoveAxisMean과 같은 방식: 행별 평균을 빼서 오선을 없앰) — 행 단위 Float32 배열로
function flowToZeroMeanRows(sample) {
  const { gray, w, h } = sample;
  const f = new Float32Array(w * h);
  for (let y = 0; y < h; y++) {
    let m = 0;
    const b = y * w;
    for (let x = 0; x < w; x++) m += gray[b + x];
    m /= w;
    for (let x = 0; x < w; x++) f[b + x] = gray[b + x] - m;
  }
  return f;
}

// 정적 열 자동 감지 — "이웃 열은 크게 변하는데 프레임 간 거의 변하지 않는 열"(재생바, 좌우 잘림 경계, 고정 오버레이)
function flowDetectStaticCols(samples, w, h) {
  const mask = new Uint8Array(w);
  const n = samples.length;
  if (n < 6) return mask;
  const diffs = [];
  for (let k = 1; k < n; k++) {
    let sum = 0;
    const a = samples[k - 1].gray, b = samples[k].gray;
    for (let i = 0; i < a.length; i += 4) sum += Math.abs(a[i] - b[i]);
    diffs.push({ k, v: sum });
  }
  diffs.sort((p, q) => q.v - p.v);
  const picked = [];
  for (const d of diffs) {
    if (picked.length >= 60) break;
    if (picked.every(p => Math.abs(p - d.k) >= 3)) picked.push(d.k);
  }
  if (picked.length < 5) return mask;
  const tc = new Float64Array(w);
  for (const k of picked) {
    const fa = flowToZeroMeanRows(samples[k - 1]), fb = flowToZeroMeanRows(samples[k]);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) tc[x] += Math.abs(fb[y * w + x] - fa[y * w + x]);
  }
  for (let x = 0; x < w; x++) tc[x] /= (picked.length * h);
  const isStatic = new Uint8Array(w);
  for (let x = 0; x < w; x++) {
    let s = 0, c = 0;
    for (let dx = -10; dx <= 10; dx++) {
      if (Math.abs(dx) <= 2) continue;
      const xx = x + dx;
      if (xx >= 0 && xx < w) { s += tc[xx]; c++; }
    }
    const ref = c ? s / c : 0;
    if (ref >= 2 && tc[x] < 0.25 * ref) isStatic[x] = 1;
  }
  for (let x = 0; x < w; x++) if (isStatic[x] || (x > 0 && isStatic[x - 1]) || (x + 1 < w && isStatic[x + 1])) mask[x] = 1;
  return mask;
}

// B(x) = A(x + s) 관계(내용이 왼쪽으로 s만큼 이동)에서의 NCC. 마스크된 열(정적 열)은 양쪽에서 제외.
function flowNccAt(a, b, w, h, mask, s) {
  let num = 0, da = 0, db = 0;
  const xe = w - s;
  for (let y = 0; y < h; y++) {
    const base = y * w;
    for (let x = 0; x < xe; x++) {
      if (mask[x] || mask[x + s]) continue;
      const va = a[base + x + s], vb = b[base + x];
      num += va * vb; da += va * va; db += vb * vb;
    }
  }
  if (da < 1e-6 || db < 1e-6) return -1;
  return num / Math.sqrt(da * db);
}

// 정수 shift 범위 탐색 + 포물선 보정(서브픽셀) + 신뢰도(피크 NCC, 2위 피크와의 차이)
function flowFindShift(a, b, w, h, mask, sMin, sMax) {
  sMin = Math.max(0, Math.floor(sMin));
  sMax = Math.min(w - 8, Math.ceil(sMax));
  if (sMax < sMin) sMax = sMin;
  const lo = Math.max(0, sMin - 1), hi = Math.min(w - 8, sMax + 1);
  const vals = [];
  for (let s = lo; s <= hi; s++) vals.push(flowNccAt(a, b, w, h, mask, s));
  let bi = 0;
  for (let i = 1; i < vals.length; i++) if (vals[i] > vals[bi]) bi = i;
  const peak = vals[bi];
  let second = -1;
  for (let i = 0; i < vals.length; i++) if (Math.abs(i - bi) >= 3 && vals[i] > second) second = vals[i];
  let shift = lo + bi;
  if (bi > 0 && bi < vals.length - 1) {
    const l = vals[bi - 1], r = vals[bi + 1], den = l - 2 * peak + r;
    if (Math.abs(den) > 1e-9) shift += Math.max(-0.5, Math.min(0.5, 0.5 * (l - r) / den));
  }
  const margin = peak - Math.max(second, 0);
  return { shift, peak, second, margin, ok: peak >= 0.5 && margin >= 0.1 };
}

// 샘플 시각들에서 누적 이동량 x(t)(원본 해상도 px)를 구한다.
async function flowTrackMotion(samples, nativeW, playbarFrac, abortRef, onProgress) {
  const n = samples.length;
  const w = samples[0].w, h = samples[0].h;
  const scale = nativeW / w;
  const staticLow = flowDetectStaticCols(samples, w, h);
  const mask = new Uint8Array(staticLow);
  let barCols = null;
  if (playbarFrac != null) {
