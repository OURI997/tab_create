<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>영상에서 TAB 추출</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>
<style>
  :root{
    --bg:#faf8f3;
    --card:#ffffff;
    --border:#ddd8cc;
    --border-strong:#bdb6a4;
    --text:#1a1a1a;
    --text2:#6b6b63;
    --accent:#3c3489;
    --accent-bg:#eeedfe;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  .app{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
  .titlebar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px;}
  .titlebar h1{flex:1;font-family:Georgia,"Noto Serif KR",serif;font-size:22px;font-weight:600;margin:0;}
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  button{
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;
  }
  button:hover{background:var(--accent-bg);}
  button:disabled{opacity:0.4;cursor:default;}
  .icon-btn{padding:6px 8px;font-size:13px;}
  .nav-link{border:1px solid var(--border-strong);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;}
  .nav-link:hover{background:var(--accent-bg);}
  .save-msg{font-size:13px;color:var(--accent);}
  .block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--text2);gap:10px;}
  .merge-group-card{border:1px solid var(--border);border-radius:8px;padding:8px;margin:6px 0;background:var(--surface, #fff);}
  .merge-seam-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:4px;}
  .merge-seam-mark{position:absolute;top:6px;bottom:0;width:0;border-left:2px dashed rgba(231,76,60,0.75);pointer-events:none;}
  .merge-seam-mark span{position:absolute;top:0;left:2px;background:#e74c3c;color:#fff;font-size:11px;border-radius:3px;padding:0 4px;}
  .merge-preview-img{max-width:100%;display:block;background:#fff;border:1px solid var(--border);border-radius:8px;margin-top:6px;}
  canvas.preview{width:100%;display:block;background:#fff;border:1px solid var(--border);border-radius:8px;}
  .adv-toggle-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text2);gap:8px;}
  .controls{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .controls label{display:flex;align-items:center;gap:8px;font-size:13px;}
  .slider-label{font-size:12px;color:var(--text2);margin-bottom:4px;}
  input[type=range]{width:100%;}
  input[type=number]{border:1px solid var(--border-strong);border-radius:8px;padding:5px 6px;font-size:13px;width:70px;}
  select{border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;font-size:13px;background:var(--card);color:var(--text);width:100%;}
  .list{display:flex;flex-direction:column;gap:12px;}
  .hr{border:none;border-top:1px solid var(--border);margin:4px 0;}

  .notice-banner{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;
    padding:12px 14px;font-size:12.5px;line-height:1.6;color:var(--text);
  }
  .notice-banner b{color:var(--accent);}

  .mode-card-row{display:flex;gap:14px;flex-wrap:wrap;margin-top:10px;}
  .mode-card{
    flex:1;min-width:220px;text-align:left;background:var(--card);border:2px solid var(--border-strong);
    border-radius:12px;padding:18px;cursor:pointer;font-family:inherit;
  }
  .mode-card:hover{border-color:var(--accent);background:var(--accent-bg);}
  .mode-card .mode-card-title{font-size:16px;font-weight:700;margin-bottom:6px;}
  .mode-card .mode-card-desc{font-size:12.5px;color:var(--text2);line-height:1.5;}

  .badge{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;}
  .badge-precise{background:#e6f6ec;color:#1e7d3c;border:1px solid #b6e3c4;}
  .badge-estimate{background:#fdf3e2;color:#9a6a12;border:1px solid #f0d9a6;}

  .step-nav{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--text2);}
  .step-nav .step{padding:4px 10px;border-radius:999px;border:1px solid var(--border);}
  .step-nav .step.active{border-color:var(--accent);color:var(--accent);background:var(--accent-bg);font-weight:600;}
  .step-nav .arrow{color:var(--border-strong);}

  .hint-text{font-size:12.5px;color:var(--text2);line-height:1.6;margin:0 0 8px;}

  /* Kept in the layout (not display:none) so hidden-video frame decoding still works in Safari etc —
     only visually hidden via near-zero size/opacity. Always rendered at the App root so it is never
     nested inside a step wrapper that gets hidden during step navigation. */
  video.hidden-video{position:fixed;top:0;left:0;width:2px;height:2px;opacity:0.01;pointer-events:none;}

  .roi-wrap{position:relative;display:inline-block;margin:10px 0;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;max-width:100%;}
  .roi-canvas{display:block;max-width:100%;cursor:crosshair;background:#000;}
  /* 영상 바깥 여백에서 시작해도 영역 드래그가 되도록 둘러싼 잡기 영역 — 시작점은 영상 가장자리로 고정된다 */
  .roi-grab{display:inline-block;max-width:100%;padding:14px;margin:-4px -14px;cursor:crosshair;box-sizing:content-box;}
  .roi-grab .roi-wrap{margin:0;}
  .roi-box{position:absolute;border:2px solid #e74c3c;background:rgba(231,76,60,0.15);display:none;pointer-events:none;}
  .chart-canvas{width:100%;height:120px;border:1px solid var(--border);border-radius:8px;margin:10px 0;background:#fff;display:block;}

  .progress-bar-wrap{position:relative;width:100%;height:22px;border:1px solid var(--border-strong);border-radius:999px;background:var(--accent-bg);overflow:hidden;margin:8px 0;}
  .progress-bar-fill{position:absolute;top:0;left:0;bottom:0;background:var(--accent);transition:width 0.15s ease-out;}
  .progress-bar-label{position:relative;height:100%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--text);}

  .range-slider-track{position:relative;height:28px;background:var(--border);border-radius:999px;margin:10px 2px 18px;}
  .range-slider-fill{position:absolute;top:0;bottom:0;background:var(--accent-bg);border:1px solid var(--accent);border-radius:999px;}
  .range-slider-handle{
    position:absolute;top:50%;width:22px;height:22px;border-radius:50%;
    background:#ffffff;border:2px solid var(--accent);transform:translate(-50%,-50%);
    cursor:grab;touch-action:none;box-shadow:0 1px 4px rgba(0,0,0,0.25);z-index:1;
  }
  .range-slider-handle:active{cursor:grabbing;}

  .thumb-grid{display:flex;flex-wrap:wrap;gap:12px;margin:12px 0;}
  .thumb-card{position:relative;width:180px;border:1px solid var(--border-strong);border-radius:8px;padding:6px;background:var(--card);}
  .thumb-card.view-only{cursor:zoom-in;}
  .thumb-card.view-only:hover{border-color:var(--accent);}
  .thumb-card.selectable{display:block;cursor:pointer;}
  .thumb-card.selected{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-bg);}
  .thumb-card img{width:100%;display:block;border-radius:4px;background:#fff;}
  .thumb-card input[type=checkbox]{position:absolute;top:10px;left:10px;width:18px;height:18px;z-index:2;}
  .thumb-meta{font-size:11px;color:var(--text2);margin-top:4px;text-align:center;}

  .preview-modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;
  }
  .preview-modal{
    background:var(--card);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.3);
    width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .preview-modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);
  }
  .preview-modal-body{overflow:auto;padding:12px;background:#f4f2ea;}
  .preview-modal-body img{width:100%;display:block;background:#fff;}
.mos-ask-row { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 12px; padding: 5px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
.mos-ask-row .seg { display: inline-flex; gap: 0; }
.mos-ask-row .seg-btn { padding: 4px 10px; border: 1px solid var(--border); background: var(--panel, #fff); color: inherit; border-radius: 0; margin: 0 -1px 0 0; font-size: 12px; cursor: pointer; }
.mos-ask-row .seg-btn:first-child { border-radius: 6px 0 0 6px; }
.mos-ask-row .seg-btn:last-child { border-radius: 0 6px 6px 0; }
.mos-ask-row .seg-btn.on { background: var(--accent); color: #fff; border-color: var(--accent); position: relative; z-index: 1; }
.mos-scenes { margin: 6px 0 10px; }
.mos-scenes > summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 4px 0; }
.mos-scene-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 8px; max-height: 520px; overflow: auto; padding: 2px; }
.mos-scene { border: 1px solid var(--border); border-radius: 8px; padding: 6px; background: var(--panel, #fff); font-size: 12px; display: flex; flex-direction: column; gap: 4px; }
.mos-scene.off { opacity: .45; }
.mos-scene img { width: 100%; height: 64px; object-fit: contain; object-position: left center; background: #fff; border-radius: 4px; }
.mos-scene-head { display: flex; align-items: center; gap: 6px; }
.mos-scene-head span { flex: 1; color: var(--muted, #666); }
.mos-scene-ctl { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.mos-scene-ctl select { width: auto; font-size: 12px; padding: 2px 4px; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect, useMemo, useCallback } = React;

// ==== copied (near-)verbatim from tab-score-builder.html so preprocessing here reproduces exactly
// what will happen after handoff — these two files are fully independent static pages with no shared
// module system, so duplication is the deliberate architecture (same pattern index.html already uses). ====

const DB_NAME = 'tab_score_builder_db';
const STORE_NAME = 'scores';
// Matches tab-score-builder.html's own VIDEO_IMPORT_KEY exactly — same database, same store, this
// page only ever writes this one key right before navigating over.
const VIDEO_IMPORT_KEY = '__video_import__';
// One entry per extraction session, keyed by VIDEO_SOURCE_KEY_PREFIX + a generated id (see
// App.goToPreprocess) — holds the original video file (for on-demand audio decode/playback later, in
// tab-score-builder.html's syllable-placement mode) plus its detected onsets, stored once and shared
// by every TAB item built from that same video rather than duplicated per item.
const VIDEO_SOURCE_KEY_PREFIX = '__video_source__';

function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(STORE_NAME)) {
        req.result.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function sampleAvgLuminance(img) {
  const c = document.createElement('canvas');
  const w = 60;
  const h = Math.max(1, Math.round((60 * img.naturalHeight) / img.naturalWidth));
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let sum = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    n++;
  }
  return sum / n;
}

function smoothstep(edge0, edge1, x) {
  if (edge0 === edge1) return x < edge0 ? 0 : 1;
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function applyThreshold(imageData, threshold, invert, softness) {
  const d = imageData.data;
  const lo = threshold - softness;
  const hi = threshold + softness;
  for (let i = 0; i < d.length; i += 4) {
    const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const t = smoothstep(lo, hi, lum);
    const v = invert ? 255 * (1 - t) : 255 * t;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
}

function despeckleBinary(imageData, w, h, maxArea) {
  if (!maxArea || maxArea <= 0) return;
  const data = imageData.data;
  const total = w * h;
  const visited = new Uint8Array(total);
  const stack = new Int32Array(total);
  const isInk = (idx) => data[idx*4] < 128;
  for (let start = 0; start < total; start++) {
    if (visited[start] || !isInk(start)) continue;
    let sp = 0;
    stack[sp++] = start; visited[start] = 1;
    let head = 0;
    while (head < sp) {
      const p = stack[head++];
      const x = p % w, y = (p - x) / w | 0;
      if (x > 0) { const n = p-1; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (x < w-1) { const n = p+1; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (y > 0) { const n = p-w; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (y < h-1) { const n = p+w; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
    }
    if (sp <= maxArea) {
      for (let i = 0; i < sp; i++) {
        const idx = stack[i]*4;
        data[idx]=255; data[idx+1]=255; data[idx+2]=255;
      }
    }
  }
}

// Copied verbatim from tab-score-builder.html (rgbToHsv/hueDist/scanVerticalRuns/detectPlayheadRuns/
// removePlayheadRuns) — used only by the new scroll-mode pipeline further down this file, through its
// own applyPreprocInPlace. The page-transition flow's drawProcessed above never calls these (see its
// comment).
function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  return { h, s, v: max };
}
function hueDist(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}
function scanVerticalRuns(imageData, w, h, isMatchFn, minRunRatio, maxRunWidthPx) {
  const d = imageData.data;
  const colMatch = new Uint8Array(w);
  for (let x = 0; x < w; x++) {
    let hits = 0;
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      if (isMatchFn(d[i], d[i + 1], d[i + 2])) hits++;
    }
    colMatch[x] = (hits / h) >= minRunRatio ? 1 : 0;
  }
  const runs = [];
  let x = 0;
  while (x < w) {
    if (!colMatch[x]) { x++; continue; }
    const startX = x;
    while (x < w && colMatch[x]) x++;
    const endX = x;
    if (!maxRunWidthPx || (endX - startX) <= maxRunWidthPx) {
      runs.push({ startX, endX, centerXPct: ((startX + endX) / 2 / w) * 100 });
    }
  }
  return runs;
}
function detectPlayheadRuns(imageData, w, h, colorBand) {
  const band = colorBand || { hue: 210, hueTolerance: 35, satMin: 0.35 };
  const isMatch = (r, g, b) => {
    const { h: hue, s: sat } = rgbToHsv(r, g, b);
    return sat >= band.satMin && hueDist(hue, band.hue) <= band.hueTolerance;
  };
  const runs = scanVerticalRuns(imageData, w, h, isMatch, 0.6, 14);
  return runs.map(r => ({ ...r, key: Math.round(r.centerXPct * 2) / 2 }));
}
function removePlayheadRuns(imageData, w, h, runs, excludedKeys, fillColor) {
  const fill = fillColor || { r: 255, g: 255, b: 255 };
  const excluded = new Set(excludedKeys || []);
  const d = imageData.data;
  for (const run of runs) {
    if (excluded.has(run.key)) continue;
    const x0 = Math.max(0, run.startX - 1), x1 = Math.min(w, run.endX + 1);
    for (let y = 0; y < h; y++) {
      for (let x = x0; x < x1; x++) {
        const i = (y * w + x) * 4;
        d[i] = fill.r; d[i + 1] = fill.g; d[i + 2] = fill.b; d[i + 3] = 255;
      }
    }
  }
}
// avg luminance from an already-captured canvas (not an Image element) — same downscale+average
// approach as sampleAvgLuminance above, adapted for the scroll pipeline's canvas-based frames instead
// of re-wrapping them as <img> elements just to reuse that function.
function computeAvgLuminanceFromCanvas(canvas) {
  const w = 60;
  const h = Math.max(1, Math.round((60 * canvas.height) / canvas.width));
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(canvas, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let sum = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) { sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2]; n++; }
  return sum / n;
}

function clampPct(v) { return Math.min(100, Math.max(0, v || 0)); }
function clampCropPair(a, b) {
  a = clampPct(a); b = clampPct(b);
  const maxSum = 90;
  if (a + b > maxSum) {
    const ratio = maxSum / (a + b);
    a = Math.floor(a * ratio);
    b = Math.floor(b * ratio);
  }
  return [a, b];
}

// drawProcessed itself is copied verbatim from tab-score-builder.html. Its s.playheadRemove branch
// stays dead code here (the page-transition flow's own settings always set playheadRemove:false,
// since playhead removal isn't exposed in THAT flow's UI — out of scope for it) — but
// detectPlayheadRuns/removePlayheadRuns themselves ARE copied below (also verbatim from
// tab-score-builder.html), because the new scroll-mode pipeline further down this file does use
// them, through its own separate applyPreprocInPlace, not through this function.
function drawProcessed(canvas, img, s) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const [cropTop, cropBottom] = clampCropPair(s.cropTop, s.cropBottom);
  const [cropLeft, cropRight] = clampCropPair(s.cropLeft, s.cropRight);
  const sx = Math.floor(W * cropLeft / 100);
  const sy = Math.floor(H * cropTop / 100);
  const sw = Math.max(1, Math.floor(W * (100 - cropLeft - cropRight) / 100));
  const sh = Math.max(1, Math.floor(H * (100 - cropTop - cropBottom) / 100));
  canvas.width = sw; canvas.height = sh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  if (s.playheadRemove) {
    // unreachable in this page — see comment above
  }
  if (s.removeBg) {
    const imageData = ctx.getImageData(0, 0, sw, sh);
    applyThreshold(imageData, s.threshold, s.invert, s.softness || 0);
    if (s.cleanPicture !== false) cleanPictureBackground(imageData, sw, sh);
    if (s.despeckle) despeckleBinary(imageData, sw, sh, s.despeckleSize || 0);
    ctx.putImageData(imageData, 0, 0);
  }
}

// 그림 배경 지우기 (페이지 전환형): 반투명 악보 뒤로 비친 연주 영상(기타 몸통·마이크 등)이 흑백 처리 뒤 회색 얼룩으로 남는 문제.
// 검은 탑햇(닫힘 − 원본)은 커널보다 가는 구조(오선·숫자·글자·마디선)만 남기고 넓은 얼룩을 지운다.
// 지워지는 양이 화면의 1.5% 미만이면(흰 바탕 영상 — 지울 얼룩이 없음) 원본을 그대로 둔다 → 깨끗한 영상의 결과는 바뀌지 않는다.
function cleanPictureBackground(imageData, w, h) {
  const d = imageData.data, n = w * h, buf = new Uint8Array(n);
  for (let p = 0, i = 0; p < n; p++, i += 4) buf[p] = (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) | 0;
  // 어두운 바탕 그대로인 결과(반전 안 함)는 대상이 아니다
  let sum = 0;
  for (let p = 0; p < n; p++) sum += buf[p];
  if (sum / n < 150) return false;
  const out = buf.slice();
  const k = Math.max(7, Math.round(h * 0.06) | 1); // 오선 간격의 약 1.2배 (영역 높이 ≈ 오선 간격 × 17~20)
  mosTopHatClean(out, w, h, k);
  // 얼룩 = 탑햇이 바탕으로 판정한 연한~중간 회색. 옅은 그라데이션 얼룩도 잡도록 235 미만까지 센다
  let removed = 0;
  for (let p = 0; p < n; p++) if (buf[p] < 235 && out[p] > 245) removed++;
  if (removed / n < 0.01) return false;
  // 탑햇 결과와 원본 중 밝은 쪽: 넓은 얼룩은 종이색이 되고, 가는 선·숫자(회색 오선 포함)는 원래 밝기 그대로 남는다
  for (let p = 0, i = 0; p < n; p++, i += 4) { const v = Math.max(buf[p], out[p]); d[i] = d[i + 1] = d[i + 2] = v; }
  return true;
}

// Same shape/logic as tab-score-builder.html's effectiveImageSettings — crop and playhead removal
// are fixed at "off" since this page doesn't expose UI for them (out of scope for this task); the
// fields still exist so drawProcessed's contract matches exactly.
function effectiveImageSettings(item, defaults) {
  const o = item.override;
  if (o) {
    return {
      removeBg: o.removeBg, invert: o.invert, threshold: o.threshold, softness: o.softness,
      despeckle: o.despeckle, despeckleSize: o.despeckleSize, cleanPicture: o.cleanPicture !== false,
      playheadRemove: false, playheadColor: null,
      cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
    };
  }
  return {
    removeBg: defaults.removeBg, invert: item.invert, threshold: defaults.threshold, softness: defaults.softness,
    despeckle: defaults.despeckle, despeckleSize: defaults.despeckleSize, cleanPicture: defaults.cleanPicture !== false,
    playheadRemove: false, playheadColor: null,
    cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
  };
}

const VIDEO_DEFAULTS_INIT = {
  removeBg: true, invertMode: 'auto', threshold: 170, softness: 60, // 다른 모드의 DEFAULT_PREPROC와 같은 값
  despeckle: true, despeckleSize: 3,
  cleanPicture: true, // 그림 배경 지우기 (얼룩이 있을 때만 작동)
};

// ==== new for this page: video capture / ROI diff detection ====

// Diff sampling stays small+downscaled (cheap, noise-tolerant). Representative-frame capture below
// uses a SEPARATE canvas at the ROI's own native resolution — no downscaling — since that becomes the
// actual TAB source image handed off to tab-score-builder.
const DIFF_SAMPLE_MAXDIM = 160;
const diffSampleCanvas = document.createElement('canvas');
const diffSampleCtx = diffSampleCanvas.getContext('2d', { willReadFrequently: true });
const roiCaptureCanvas = document.createElement('canvas');
const roiCaptureCtx = roiCaptureCanvas.getContext('2d');

function roiRectPx(video, roi) {
  const vw = video.videoWidth, vh = video.videoHeight;
  const rx0 = roi ? roi.x0 * vw : 0;
  const ry0 = roi ? roi.y0 * vh : 0;
  const rw = roi ? (roi.x1 - roi.x0) * vw : vw;
  const rh = roi ? (roi.y1 - roi.y0) * vh : vh;
  return { rx0, ry0, rw, rh };
}

function getRoiPixelsForDiff(video, roi) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const scale = Math.min(1, DIFF_SAMPLE_MAXDIM / Math.max(rw, rh));
  const outW = Math.max(1, Math.round(rw * scale));
  const outH = Math.max(1, Math.round(rh * scale));
  diffSampleCanvas.width = outW; diffSampleCanvas.height = outH;
  diffSampleCtx.drawImage(video, rx0, ry0, rw, rh, 0, 0, outW, outH);
  return diffSampleCtx.getImageData(0, 0, outW, outH).data;
}


// ==== 재생 위치 표시(플레이헤드) 자동 추적 — 마디별 정밀 시간 동기화 ====
// 목적: 그룹의 timeRange가 "대표 프레임 캡처 시각 사이의 선형 보간"이라 오차가 있는 문제를,
// 많은 스크롤형 TAB 영상에 있는 "현재 재생 위치를 보여주는 움직이는 표시"(하이라이트/커서선/진행
// 바 등, 색은 영상마다 다름 — 하드코딩하지 않는다)를 안정(정지) 구간에서 자동으로 찾아 추적해서
// 보정한다. 실패하면(표시가 없거나 ROI 밖에 있으면) 4)의 개선된 폴백으로 자동 전환된다.

const MARKER_SAMPLE_MAXDIM = 300;
const markerSampleCanvasA = document.createElement('canvas');
const markerSampleCtxA = markerSampleCanvasA.getContext('2d', { willReadFrequently: true });
const markerSampleCanvasB = document.createElement('canvas');
const markerSampleCtxB = markerSampleCanvasB.getContext('2d', { willReadFrequently: true });
const MARKER_FINE_STEP_SEC = 0.12;
const MARKER_DIFF_LUM_THRESH = 25;
const MARKER_MAX_AREA_FRACTION = 0.15; // ROI 면적의 이 비율을 넘는 "덩어리"는 전체 화면 변화(페이드
// 등)로 보고 후보에서 제외 — 1)의 "적당히 작은" 요건
const MARKER_MIN_GAP_DURATION_SEC = 0.3; // 이보다 짧은 안정 구간은 촘촘 샘플링해도 점이 부족해 스킵
const MARKER_MIN_POINTS_FOR_CONFIDENCE = 3;
const MARKER_MAX_SAMPLES_PER_GAP = 60; // 비정상적으로 긴 안정 구간에서 과도한 seek이 걸리지 않도록

function getRoiPixelsForMarker(video, roi, useA) {
  const { rx0, ry0, rw, rh } = roiRectPx(video, roi);
  const scale = Math.min(1, MARKER_SAMPLE_MAXDIM / Math.max(rw, rh));
  const outW = Math.max(1, Math.round(rw * scale)), outH = Math.max(1, Math.round(rh * scale));
  const canvas = useA ? markerSampleCanvasA : markerSampleCanvasB;
  const ctx = useA ? markerSampleCtxA : markerSampleCtxB;
  canvas.width = outW; canvas.height = outH;
  ctx.drawImage(video, rx0, ry0, rw, rh, 0, 0, outW, outH);
  return { data: ctx.getImageData(0, 0, outW, outH).data, w: outW, h: outH };
}

// 1) 두 프레임(같은 크기) 사이에서 "바뀐" 픽셀들의 연결영역(despeckleBinary와 같은 flood-fill
// 방식) 중, 너무 크지 않은(MARKER_MAX_AREA_FRACTION 이하) 것들 중 가장 큰 덩어리의 중심좌표를
// 반환한다. 안정 구간에서는 배경이 고정이므로, 바뀐 부분은 "재생 위치 표시" 자체일 가능성이 높다.
function findChangedBlobCentroid(dataA, dataB, w, h, diffThresh, maxAreaFraction) {
  const total = w * h;
  const isChanged = new Uint8Array(total);
  let changedCount = 0;
  for (let i = 0, p = 0; i < dataA.length; i += 4, p++) {
    const dr = dataA[i] - dataB[i], dg = dataA[i + 1] - dataB[i + 1], db = dataA[i + 2] - dataB[i + 2];
    const lum = 0.299 * Math.abs(dr) + 0.587 * Math.abs(dg) + 0.114 * Math.abs(db);
    if (lum > diffThresh) { isChanged[p] = 1; changedCount++; }
  }
  if (changedCount === 0) return null;
  const maxArea = Math.max(4, Math.round(total * maxAreaFraction));
  const visited = new Uint8Array(total);
  const stack = new Int32Array(total);
  let best = null, bestArea = 0;
  for (let start = 0; start < total; start++) {
    if (visited[start] || !isChanged[start]) continue;
    let sp = 0; stack[sp++] = start; visited[start] = 1;
    let head = 0, sumX = 0, sumY = 0, cnt = 0;
    while (head < sp) {
      const p = stack[head++];
      const x = p % w, y = (p - x) / w | 0;
      sumX += x; sumY += y; cnt++;
      if (x > 0) { const n = p - 1; if (!visited[n] && isChanged[n]) { visited[n] = 1; stack[sp++] = n; } }
      if (x < w - 1) { const n = p + 1; if (!visited[n] && isChanged[n]) { visited[n] = 1; stack[sp++] = n; } }
      if (y > 0) { const n = p - w; if (!visited[n] && isChanged[n]) { visited[n] = 1; stack[sp++] = n; } }
      if (y < h - 1) { const n = p + w; if (!visited[n] && isChanged[n]) { visited[n] = 1; stack[sp++] = n; } }
    }
    if (cnt <= maxArea && cnt > bestArea) { bestArea = cnt; best = { x: sumX / cnt, y: sumY / cnt, area: cnt }; }
  }
  return best;
}

// ==== 프레임 모델 — 스티칭 결과를 "그려진 조각(frame)들의 목록"으로 표현한다 ====
// frame = { id, canvas, t, srcX, len, dup, score, ok, shift?, cut?, t0?, t1?, weight?, delta? }
//  - canvas: 전처리가 끝난 원본 해상도 캡처(ROI 크롭), srcX/len: 그 canvas에서 실제로 그려지는 축 방향 구간
//  - t: 대표 시각, cut 타일은 t0~t1이 그 타일이 화면에 떠 있던 정확한 시간 구간(컷 시각으로 고정)
//  - score/ok: 이전 조각과의 이음새 품질(첫 조각은 null)
// 이렇게 "조각 목록"을 단일 진실로 두면 이음새 미세 조정, 구간 재스캔 패치, 마커 좌표 이동이
// 모두 목록 편집 + renderFrames 재실행만으로 일관되게 처리된다.
let scrollFrameIdSeq = 1;
function newScrollFrame(props) {
  return { id: scrollFrameIdSeq++, dup: false, score: null, ok: true, ...props };
}

function renderFrames(frames, direction) {
  const vertical = direction === 'vertical';
  const first = frames[0].canvas;
  const crossLen = vertical ? first.width : first.height;
  let total = 0;
  for (const f of frames) if (!f.dup) total += f.len;
  total = Math.max(1, Math.round(total));
  const out = document.createElement('canvas');
  if (vertical) { out.width = crossLen; out.height = total; } else { out.width = total; out.height = crossLen; }
  const octx = out.getContext('2d');
  octx.fillStyle = '#ffffff';
  octx.fillRect(0, 0, out.width, out.height);
  const placed = [], seams = [];
  let cursor = 0;
  frames.forEach((f, i) => {
    placed.push({ ...f, start: cursor });
    if (i > 0) {
      seams.push({
        i: i - 1, pos: cursor, score: f.score, dup: !!f.dup, ok: f.ok,
        shift: f.shift != null ? f.shift : f.len, cut: !!f.cut, weight: f.weight, delta: f.delta,
        ovl: f.ovl, dupSuspect: !!f.dupSuspect, dupFixed: f.dupFixed || 0,
      });
    }
    if (f.dup) return;
    if (vertical) octx.drawImage(f.canvas, 0, f.srcX, f.canvas.width, f.len, 0, cursor, f.canvas.width, f.len);
    else octx.drawImage(f.canvas, f.srcX, 0, f.len, f.canvas.height, cursor, 0, f.len, f.canvas.height);
    cursor += f.len;
  });
  return { canvas: out, placed, seams, total };
}

// 구간 재스캔 결과를 전역 조각 목록의 [xA, xB) 구간에 패치한다. 걸쳐 있는 조각은 경계에서 잘라
// 남기고(시간 구간도 비례해서 줄임), 그 뒤 조각들은 renderFrames가 새 폭만큼 자동으로 밀어준다.
// 마커 점은 (조각 id, 로컬 좌표)로 저장돼 있어 남은 조각의 점은 따로 옮길 필요 없이 같이 이동한다.
function patchFrames(placed, xA, xB, miniFrames) {
  const lead = [], trail = [];
  for (const f of placed) {
    const fs = f.start, fe = f.dup ? f.start : f.start + f.len;
    const { start: _s, ...base } = f;
    if (f.dup) {
      if (fs < xA) lead.push(base); else if (fs >= xB) trail.push({ ...base, score: 1, ok: true });
      continue;
    }
    if (fe <= xA) { lead.push(base); continue; }
    if (fs >= xB) { trail.push(base); continue; }
    const hasLead = fs < xA, hasTrail = fe > xB;
    if (hasLead) {
      const keep = xA - fs;
      const piece = { ...base, len: keep };
      if (f.t0 != null) piece.t1 = f.t0 + (keep / f.len) * (f.t1 - f.t0);
      lead.push(piece);
    }
    if (hasTrail) {
      const skip = xB - fs;
      const piece = { ...base, srcX: f.srcX + skip, len: f.len - skip, score: 1, ok: true };
      if (f.t0 != null) piece.t0 = f.t0 + (skip / f.len) * (f.t1 - f.t0);
      if (hasLead) piece.id = scrollFrameIdSeq++;
      trail.push(piece);
    }
  }
  const mini = miniFrames.map((f, i) => ({ ...f, id: scrollFrameIdSeq++, score: i === 0 ? 1 : f.score, ok: i === 0 ? true : f.ok }));
  const merged = [...lead, ...mini, ...trail];
  merged[0] = { ...merged[0], dup: false };
  return merged;
}

// 컷 이음새 미세 조정 — 이음새 i는 조각 i+1의 시작 경계. d>0이면 오른쪽 타일 내용이 왼쪽으로(d px)
// 이동(타일 앞부분 d열을 잘라냄), d<0이면 오른쪽으로 이동(앞쪽 여백 열을 포함). all이면 모든 컷 이음새.
function adjustCutSeam(frames, seamIdx, d, all) {
  return frames.map((f, idx) => {
    const target = all ? (idx > 0 && f.cut && !f.dup) : (idx === seamIdx + 1 && !f.dup);
    if (!target) return f;
    const end = f.srcX + f.len;
    const ns = Math.max(0, Math.min(end - 1, f.srcX + d));
    return { ...f, srcX: ns, len: end - ns, delta: (f.delta || 0) + (ns - f.srcX) };
  });
}

// ---- 시간 ↔ 좌표 매핑 (조각 기반 폴백) ----
// 각 조각의 시간 구간: cut 타일은 [t0,t1](컷 시각으로 고정), 부드러운 스크롤 조각은 [t, 다음 조각 t]
// (burst 구간은 그 구간의 평균 속도, 정지 구간은 이어지는 두 조각의 t가 같아 기울기 0).
function frameTimeSpan(placed, i) {
  const f = placed[i];
  const tS = f.t0 != null ? f.t0 : f.t;
  let tE;
  if (f.t1 != null) tE = f.t1;
  else if (i + 1 < placed.length) tE = placed[i + 1].t0 != null ? placed[i + 1].t0 : placed[i + 1].t;
  else tE = f.t;
  return [tS, tE];
}
function timeForXByFrames(placed, x) {
  let lastTE = null;
  for (let i = 0; i < placed.length; i++) {
    const f = placed[i];
    if (f.dup) continue;
    const [tS, tE] = frameTimeSpan(placed, i);
    if (lastTE == null && x < f.start) return tS;
    if (x >= f.start && x < f.start + f.len) {
      const frac = f.len > 0 ? (x - f.start) / f.len : 0;
      return tS + frac * (tE - tS);
    }
    lastTE = tE;
  }
  return lastTE;
}
function xForTimeByFrames(placed, totalLen, t) {
  let first = true;
  for (let i = 0; i < placed.length; i++) {
    const f = placed[i];
    if (f.dup) continue;
    const [tS, tE] = frameTimeSpan(placed, i);
    if (first && t < tS) return 0;
    first = false;
    if (t >= tS && t <= tE) return tE > tS ? f.start + ((t - tS) / (tE - tS)) * f.len : f.start;
  }
  return totalLen;
}

// repIndices(대표 프레임을 뽑은 시각 인덱스들)의 인접한 두 항목 사이가 "안정 구간"(그 사이에
// 감지된 burst가 없음)이면 재생 표시 추적용 세그먼트로 만든다. frameIdx는 그 구간이 속한(시작
// 쪽) 대표 프레임의 인덱스.
function smoothMarkerSegments(repIdx, times, bursts) {
  const segs = [];
  for (let k = 0; k < repIdx.length - 1; k++) {
    const a = repIdx[k], b = repIdx[k + 1];
    if (bursts.some(bu => (bu.start - 1) === a && (bu.end + 1) === b)) continue;
    segs.push({ tA: times[a], tB: times[b], frameIdx: k });
  }
  return segs;
}

// 2) 안정 구간(세그먼트)마다 촘촘히 샘플링해서 "시각 → (조각 id, 조각 내 로컬 좌표)" 후보 목록을
// 모은다. 구간당 샘플 수 상한(MARKER_MAX_SAMPLES_PER_GAP)을 둔다. 중복(dup) 조각에 속한 구간은
// 내용이 같은 직전의 실제 그려진 조각으로 앵커링한다(로컬 좌표가 동일하므로 그대로 유효).
async function detectPlaybackMarker({ video, roi, direction, segments, frames, frameLen, onProgress }) {
  const rawPoints = [];
  for (const seg of segments) {
    const { tA, tB } = seg;
    if (tB - tA < MARKER_MIN_GAP_DURATION_SEC) continue;
    let anchor = seg.frameIdx;
    while (anchor > 0 && frames[anchor].dup) anchor--;
    const f = frames[anchor];
    let step = MARKER_FINE_STEP_SEC;
    const rawCount = Math.ceil((tB - tA) / step) + 1;
    if (rawCount > MARKER_MAX_SAMPLES_PER_GAP) step = (tB - tA) / MARKER_MAX_SAMPLES_PER_GAP;
    const fineTimes = [];
    for (let t = tA; t < tB; t += step) fineTimes.push(t);
    fineTimes.push(tB);

    let prev = null;
    for (let i = 0; i < fineTimes.length; i++) {
      await seekTo(video, fineTimes[i]);
      const sample = getRoiPixelsForMarker(video, roi, i % 2 === 0);
      if (prev) {
        const blob = findChangedBlobCentroid(prev.data, sample.data, sample.w, sample.h, MARKER_DIFF_LUM_THRESH, MARKER_MAX_AREA_FRACTION);
        if (blob) {
          const localSample = direction === 'vertical' ? blob.y : blob.x;
          const sampleAxisLen = direction === 'vertical' ? sample.h : sample.w;
          rawPoints.push({ time: fineTimes[i], fid: f.id, local: (localSample / sampleAxisLen) * frameLen });
        }
      }
      prev = sample;
      if (onProgress) onProgress();
    }
  }
  rawPoints.sort((a, b) => a.time - b.time);
  return { rawPoints };
}

// 저장된 (조각 id, 로컬 좌표) 점들을 "현재" 레이아웃 기준 전역 좌표로 변환 — 이음새 조정/패치로
// 레이아웃이 바뀌어도 항상 최신 좌표를 쓴다. 사라진 조각이거나 잘려나간 로컬 구간의 점은 버린다.
function markerPointsToGlobal(rawPoints, placed) {
  const byId = new Map();
  for (const f of placed) byId.set(f.id, f);
  const out = [];
  for (const p of rawPoints) {
    const f = byId.get(p.fid);
    if (!f || f.dup) continue;
    if (p.local < f.srcX || p.local >= f.srcX + f.len) continue;
    out.push({ time: p.time, globalPos: f.start + (p.local - f.srcX) });
  }
  out.sort((a, b) => a.time - b.time);
  return out;
}

// 3) 신뢰도 검증 — 최소 개수 이상, 스크롤 진행 방향(=global 좌표가 커지는 방향, 스티칭 관례상
// 항상 그 방향)과 대체로 일치하는 단조 이동인지.
function validateMarkerTrack(allPoints) {
  if (allPoints.length < MARKER_MIN_POINTS_FOR_CONFIDENCE) {

  }
  let forward = 0, backward = 0;
  for (let i = 1; i < allPoints.length; i++) {

// 목표 global 위치를 지나는 시각을 추적된 점들 사이에서 선형보간 — 점 목록은 이미 시간순 정렬됨.

// x → 시간. 재생 표시가 신뢰할 만하면 그 궤적(타일 경계는 위 조각 모델이 컷 시각으로 고정), 아니면

// 시간 → x (구간 재스캔 패치 범위 계산용). 마커 궤적의 추적 구간 안이면 그 궤적의 역변환.

      for (let i = 0; i < pts.length - 1; i++) {

// ==== onset (sound-start) detection — spectral flux, reused from the verified onset-detect-test.html

function nextPow2(n) { let p = 1; while (p < n) p *= 2; return p; }

function fftMagnitude(real) {

    let bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j) { [re[i], re[j]] = [re[j], re[i]]; [im[i], im[j]] = [im[j], im[i]]; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len;
    const wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len) {
      let curWr = 1, curWi = 0;
      for (let j = 0; j < len / 2; j++) {

        const vr = re[i + j + len/2] * curWr - im[i + j + len/2] * curWi;
        const vi = re[i + j + len/2] * curWi + im[i + j + len/2] * curWr;
        re[i + j] = ur + vr; im[i + j] = ui + vi;
        re[i + j + len/2] = ur - vr; im[i + j + len/2] = ui - vi;
        const nWr = curWr * wr - curWi * wi;
        curWi = curWr * wi + curWi * wr;
        curWr = nWr;

  for (let i = 0; i < n / 2; i++) mags[i] = Math.hypot(re[i], im[i]);

// video later gets split into pages or merged into rows.
function detectOnsets(monoData, sampleRate) {

  const numFrames = Math.max(0, Math.floor((monoData.length - FRAME_SIZE) / HOP));
  const flux = new Float64Array(numFrames);
  let prevMag = null;
  const frameBuf = new Float64Array(FRAME_SIZE);
  for (let f = 0; f < numFrames; f++) {
    const start = f * HOP;
    for (let i = 0; i < FRAME_SIZE; i++) frameBuf[i] = monoData[start + i] * win[i];
    const mag = fftMagnitude(frameBuf);

      flux[f] = sum;

  for (let i = 0; i < flux.length; i++) flux[i] /= maxFlux;

    for (let k = lo; k < hi; k++) mean += flux[k];
    mean /= (hi - lo);

    for (let k = lo; k < hi; k++) variance += (flux[k] - mean) ** 2;

    if (isLocalPeak && flux[i] > threshold && flux[i] > 0.02) candidates.push({ frame: i, score: flux[i] });

  candidates.sort((a, b) => a.frame - b.frame);
  const filtered = [];
  for (const c of candidates) {
    if (filtered.length === 0 || c.frame - filtered[filtered.length - 1].frame >= minGapFrames) {
      filtered.push(c);

      filtered[filtered.length - 1] = c;

  return filtered.map(c => (c.frame * HOP) / sampleRate);
}

// 반환: [{ s, e, rep, dropped? }] — s/e/rep는 샘플 인덱스
const PAGE_MIN_SEG_SEC = 0.5;
function pageBuildSegments(times, scores, th, samples, step, mode) {
  const raw = [];
  let segStart = 0;
  for (let i = 0; i < scores.length; i++) {
    if (scores[i] > th) { if (i > segStart) raw.push([segStart, i]); segStart = i + 1; }
  }
  if (segStart < times.length) raw.push([segStart, times.length - 1]);
  const removed = { short: 0, blank: 0, dup: 0 };
  const kept = [];
  for (const [s, e] of raw) {
    const span = (times[e] - times[s]) + step;
    if (span < PAGE_MIN_SEG_SEC && raw.length > 1) { removed.short++; continue; }
    const rep = Math.max(s, e - 1);
    if (samples && samples[rep] && pageIsBlank(samples[rep], mode)) { removed.blank++; continue; }
    kept.push({ s, e, rep });
  }
  // "같은 페이지" 기준: 평소 변화량(중앙값)과 전환 임계값의 중간 — 재생바 위치만 다른 같은 페이지는 합치고,
  // 차이가 작은 서로 다른 페이지(전환 점수가 임계값 근처)는 합치지 않도록 여유를 둔다.
  const sameThr = (pageBaseline(scores).med + th) / 2;
  const merged = [];
  for (const g of kept) {
    const last = merged[merged.length - 1];
    // 바로 앞 구간과 대표 프레임 차이가 전환 기준 이하면 같은 페이지(중간에 잠깐 튄 프레임 때문에 쪼개진 것) — 하나로 합친다.
    if (last && samples && samples[last.rep] && samples[g.rep] && pageChangeScore(samples[last.rep], samples[g.rep], mode) <= sameThr) {
      last.e = g.e; // 같은 페이지 — 시간 범위만 늘린다 (대표 프레임은 앞 구간 것 유지)
      removed.dup++;
      continue;
    }
    merged.push({ ...g });
  }
  return { segments: merged, removed };
}

function Lightbox({ src, onClose }) {
  if (!src) return null;
  return (
    <div className="preview-modal-backdrop" onClick={onClose}>
      <div className="preview-modal" onClick={e => e.stopPropagation()}>
        <div className="preview-modal-head">
          <span>프레임 크게 보기</span>
          <button className="icon-btn" onClick={onClose}>닫기</button>
        </div>
        <div className="preview-modal-body"><img src={src} alt="프레임 크게 보기" /></div>
      </div>
    </div>
  );
}

function CaptureStep({ videoRef, frames, setFrames, onsets, setOnsets, videoFile, setVideoFile, onNext }) {
  const roiCanvasRef = useRef(null);
  const roiBoxRef = useRef(null);
  const chartRef = useRef(null);
  const dragStartRef = useRef(null);
  const roiRef = useRef(null);
  const seekBusyRef = useRef(false);
  const pendingSeekRef = useRef(null);
  const rangeTrackRef = useRef(null);
  const rangeDragRef = useRef(null); // 'start' | 'end' | null, which handle (if any) is being dragged
  const rangeStartRef = useRef(0);
  const rangeEndRef = useRef(0);
  const durationRef = useRef(0);
  const busyRef = useRef(false);
  const [autoRoiMsg, setAutoRoiMsg] = useState('');
  const [autoRoiBusy, setAutoRoiBusy] = useState(false);
  const autoRoiSrcRef = useRef(null);          // 분석·추출 중에는 다른 seek(슬라이더·구간 핸들)이 끼어들지 않게 막는다
  const samplesRef = useRef([]);          // 분석 때 모은 저해상도 샘플 — 빈 화면/중복 페이지 판정용
  const lastSegmentsRef = useRef(null);

  const [videoLoaded, setVideoLoaded] = useState(false);
  const [duration, setDuration] = useState(0);
  const [seekT, setSeekT] = useState(0);
  const [roi, setRoi] = useState(null);
  const [stepSec, setStepSec] = useState(0.3);
  const [rangeStart, setRangeStart] = useState(0);
  const [rangeEnd, setRangeEnd] = useState(0);
  const [analysis, setAnalysis] = useState(null);
  const [threshold, setThreshold] = useState(0);
  const [thresholdRange, setThresholdRange] = useState({ min: 0, max: 50, step: 0.1 });
  const [analyzing, setAnalyzing] = useState(false);
  const [analyzeProgress, setAnalyzeProgress] = useState(0);
  const [extracting, setExtracting] = useState(false);
  const [statusMsg, setStatusMsg] = useState('영상 파일을 선택하세요.');
  const [lightboxSrc, setLightboxSrc] = useState(null);
  const [onsetDetecting, setOnsetDetecting] = useState(false);

  function log(msg) { setStatusMsg(msg); }

  function drawRoiBoxOverlay() {
    const box = roiBoxRef.current, canvas = roiCanvasRef.current;
    if (!box || !canvas) return;
    const r = roiRef.current;
    if (!r) { box.style.display = 'none'; return; }
    const rect = canvas.getBoundingClientRect();
    box.style.left = (r.x0 * rect.width) + 'px';
    box.style.top = (r.y0 * rect.height) + 'px';
    box.style.width = ((r.x1 - r.x0) * rect.width) + 'px';
    box.style.height = ((r.y1 - r.y0) * rect.height) + 'px';
    box.style.display = 'block';
  }
  useEffect(() => { roiRef.current = roi; drawRoiBoxOverlay(); }, [roi]);
  useEffect(() => {
    window.addEventListener('resize', drawRoiBoxOverlay);
    return () => window.removeEventListener('resize', drawRoiBoxOverlay);
  }, []);

  useEffect(() => { rangeStartRef.current = rangeStart; }, [rangeStart]);
  useEffect(() => { rangeEndRef.current = rangeEnd; }, [rangeEnd]);
  useEffect(() => { durationRef.current = duration; }, [duration]);

  function startRangeDrag(e, which) {
    e.preventDefault();
    if (busyRef.current) return;
    rangeDragRef.current = which;
  }
  // Subscribed once (refs carry the live values) so dragging never has to re-attach listeners mid-drag.
  // Reuses requestScrub — the SAME scrub path the "영상 상태 확인" slider uses — so previewing a handle's
  // current position while dragging goes through the identical seekTo() call, never a second one.
  useEffect(() => {
    function onMove(e) {
      const which = rangeDragRef.current;
      const dur = durationRef.current;
      if (!which || !rangeTrackRef.current || !dur) return;
      const rect = rangeTrackRef.current.getBoundingClientRect();
      const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
      let t = pct * dur;
      if (which === 'start') {
        t = Math.max(0, Math.min(t, rangeEndRef.current - 0.1));
        setRangeStart(t);
      } else {
        t = Math.min(dur, Math.max(t, rangeStartRef.current + 0.1));
        setRangeEnd(t);
      }
      setSeekT(t);
      requestScrub(t);
    }
    function onUp() { rangeDragRef.current = null; }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    return () => {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    };
  }, []);

  function drawChart(times, diffs, th) {
    const canvas = chartRef.current;
    if (!canvas || !diffs || diffs.length === 0) return;
    const ctx = canvas.getContext('2d');
    const w = canvas.width = canvas.clientWidth;
    const h = canvas.height = 120;
    ctx.clearRect(0, 0, w, h);
    // Always scaled to the actual observed max — never to the threshold — so the graph stays honest
    // regardless of where the threshold slider currently sits.
    const maxDiff = Math.max(...diffs, 1) * 1.15;
    ctx.strokeStyle = '#3c3489';
    ctx.beginPath();
    diffs.forEach((d, i) => {
      const x = (i / Math.max(1, diffs.length - 1)) * w;
      const y = h - (d / maxDiff) * h;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    });
    ctx.stroke();
    const ty = h - (th / maxDiff) * h;
    ctx.strokeStyle = '#cc3333';
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(0, ty); ctx.lineTo(w, ty); ctx.stroke();
    ctx.setLineDash([]);
  }
  useEffect(() => { if (analysis) drawChart(analysis.times, analysis.diffs, threshold); }, [threshold, analysis]);

  async function showFrameAt(t) {
    const video = videoRef.current;
    await seekRobust(video, Math.min(t, Math.max(0, video.duration - 0.05)));
    const canvas = roiCanvasRef.current;
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    drawRoiBoxOverlay();
  }

  async function runAutoRoi(manual) {
    const video = videoRef.current;
    const src = video && (video.currentSrc || video.src);
    if (!src || busyRef.current) return;
    setAutoRoiBusy(true); setAutoRoiMsg('TAB 영역을 찾는 중...');
    const r = await autoFindTabRoi(src);
    setAutoRoiBusy(false);
    if (r) { setRoi({ x0: r.x0, y0: r.y0, x1: r.x1, y1: r.y1, core: r.core }); setAutoRoiMsg('TAB 오선을 찾아 영역을 자동으로 지정했습니다 (' + r.frames + '/5 장면). 다르면 드래그로 다시 지정하세요.'); }
    else setAutoRoiMsg(manual ? 'TAB 오선을 찾지 못했습니다 — 드래그로 직접 지정하세요.' : '');
  }
  // TAB 영역 자동 찾기는 없앴다 — 정답 악보 7곡 채점에서 코드 패널·자막 줄을 잘못 포함해 페이지를 놓쳤다. 영역은 항상 사용자가 지정한다

  function requestScrub(t) {
    if (busyRef.current) return; // 분석·추출 중 seek 금지 — 분석 루프가 엉뚱한 시점의 프레임을 읽게 된다
    pendingSeekRef.current = t;
    if (seekBusyRef.current) return;
    seekBusyRef.current = true;
    (async () => {
      try {
        while (pendingSeekRef.current != null) {
          const target = pendingSeekRef.current;
          pendingSeekRef.current = null;
          await showFrameAt(target);
        }
      } catch (err) {
        console.warn('미리보기 이동 실패', err);
      } finally {
        seekBusyRef.current = false; // 한 번 실패해도 슬라이더·구간 핸들이 계속 동작하게
      }
    })();
  }

  function handleFileChange(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const video = videoRef.current;
    video.src = URL.createObjectURL(file);
    setVideoLoaded(false);
    setRoi(null);
    setAnalysis(null);
    setFrames([]);
    setVideoFile(file);
    setOnsets([]);
    video.onloadedmetadata = async () => {
      setVideoLoaded(true);
      setDuration(video.duration);
      setSeekT(0);
      setRangeStart(0);
      setRangeEnd(video.duration);
      log('영상 로드됨: ' + video.duration.toFixed(2) + '초, ' + video.videoWidth + 'x' + video.videoHeight);
      // 자동 재생을 일으키던 play()/pause() 워밍업은 제거 — seek만으로 첫 프레임을 그린다
      await seekSafe(video, 0.001);
      await showFrameAt(0);
    };
  }

  function onSeekSliderChange(e) {
    const t = parseFloat(e.target.value);
    setSeekT(t);
    requestScrub(t);
  }

  function canvasPoint(e) {
    const canvas = roiCanvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width, scaleY = canvas.height / rect.height;
    return { x: (e.clientX - rect.left) * scaleX, y: (e.clientY - rect.top) * scaleY, scaleX, scaleY };
  }
  // 드래그를 시작한 뒤에는 커서가 영상 밖으로 나가도 계속 추적하고, 좌표는 영상 가장자리(0~100%)로 고정한다.
  function clampedCanvasPoint(e) {
    const canvas = roiCanvasRef.current;
    const p = canvasPoint(e);
    return { ...p, x: Math.max(0, Math.min(canvas.width, p.x)), y: Math.max(0, Math.min(canvas.height, p.y)) };
  }
  function onRoiMouseDown(e) {
    if (busyRef.current || e.button !== 0) return;
    e.preventDefault(); // 드래그 중 텍스트 선택 방지
    dragStartRef.current = clampedCanvasPoint(e);
  }
  useEffect(() => {
    function onMove(e) {
      if (!dragStartRef.current || !roiCanvasRef.current) return;
      const cur = clampedCanvasPoint(e);
      const box = roiBoxRef.current;
      const x0 = Math.min(dragStartRef.current.x, cur.x) / cur.scaleX;
      const y0 = Math.min(dragStartRef.current.y, cur.y) / cur.scaleY;
      const w = Math.abs(cur.x - dragStartRef.current.x) / cur.scaleX;
      const h = Math.abs(cur.y - dragStartRef.current.y) / cur.scaleY;
      box.style.left = x0 + 'px'; box.style.top = y0 + 'px';
      box.style.width = w + 'px'; box.style.height = h + 'px';
      box.style.display = 'block';
    }
    window.addEventListener('mousemove', onMove);
    return () => window.removeEventListener('mousemove', onMove);
  }, []);
  useEffect(() => {
    function onUp(e) {
      if (!dragStartRef.current) return;
      const canvas = roiCanvasRef.current;
      const start = dragStartRef.current;
      dragStartRef.current = null;
      const cur = canvasPoint(e);
      const curX = Math.max(0, Math.min(canvas.width, cur.x));
      const curY = Math.max(0, Math.min(canvas.height, cur.y));
      const x0 = Math.min(start.x, curX), x1 = Math.max(start.x, curX);
      const y0 = Math.min(start.y, curY), y1 = Math.max(start.y, curY);
      if (x1 - x0 < 5 || y1 - y0 < 5) { drawRoiBoxOverlay(); return; } // too small — treat as an accidental click, not a drag
      setRoi({ x0: x0 / canvas.width, y0: y0 / canvas.height, x1: x1 / canvas.width, y1: y1 / canvas.height });
    }
    window.addEventListener('mouseup', onUp);
    return () => window.removeEventListener('mouseup', onUp);
  }, []);

  async function analyze() {
    if (!videoLoaded) { log('영상을 먼저 선택하세요.'); return; }
    setAnalyzing(true);
    setAnalyzeProgress(0);
    setFrames([]);

    // Onset detection runs independently of (and concurrently with) the page-transition diff loop
    // below — it's a one-time whole-file audio decode + FFT pass, unrelated to the ROI/ threshold/
    // seek work the diff loop does, so there's no reason to block on it or repeat it on every re-run
    // of "분석 시작" for the same file.
    if (videoFile && onsets.length === 0 && !onsetDetecting) {
      setOnsetDetecting(true);
      decodeAudioOnsets(videoFile).then(result => {
        setOnsets(result.onsets);
        setOnsetDetecting(false);
      }).catch(() => setOnsetDetecting(false));
    }

    const video = videoRef.current;
    const step = Math.max(0.05, parseFloat(stepSec) || 0.3);
    // Only the user-selected range is sampled — defaults to the whole video (0..duration) when no
    // range has been narrowed, so intro/outro noise outside the actual TAB content never has a chance
    // to get mistaken for a page transition.
    const rangeS = Math.max(0, Math.min(rangeStart, video.duration));
    const rangeE = Math.max(rangeS, Math.min(rangeEnd || video.duration, video.duration));
    const totalSteps = Math.max(1, Math.ceil((rangeE - rangeS) / step));
    // diffs[i] = times[i]와 times[i+1] 사이의 변화 점수(1 − NCC), meanDiffs[i] = 같은 쌍의 평균 밝기 차이(참고용)
    const times = [], diffs = [], meanDiffs = [], samples = [];
    const roiAtStart = roiRef.current; // 분석 도중 영역이 바뀌어도 이 값으로 끝까지 분석
    // 비교는 오선 띠 위쪽(코드 이름·연주 영상이 비치는 곳)을 빼고, 오선부터 영역 아래 끝(리듬·가사)까지만 한다.
    // 위쪽에 연주 영상이 조금만 들어와도 그 움직임이 잡음이 되어, 첫 마디 숫자 몇 개만 다른 페이지 전환을 놓쳤다(Deja vu 채점에서 확인).
    // 영역을 손으로 지정하면(core 없음) 영역 전체를 그대로 비교한다
    const cmpRoi = roiAtStart && roiAtStart.core ? { ...roiAtStart, y0: Math.max(roiAtStart.y0, roiAtStart.core.y0) } : roiAtStart;
    const cap = pageMakeCapture(video, cmpRoi);
    busyRef.current = true;
    try {
      // 빠른 재생(8배속)으로 흘려보내며 step 간격의 프레임만 집는다 — 샘플마다 seek하던 방식(샘플당 0.1~0.3초)보다 몇 배 빠르다.
      // 프레임 시각은 실제 표시된 프레임의 mediaTime을 쓴다. rVFC가 없는 브라우저는 flowPlayPass가 seek 방식으로 대신한다.
      let lastLog = -1;
      const pageStats = {};
      await flowPlayPass(video, {
        startT: rangeS, endT: Math.max(rangeS, rangeE - 0.02), rate: PAGE_ANALYZE_RATE, maxRate: PAGE_ANALYZE_RATE, minGap: step,
        onFrame: t => {
          times.push(t);
          samples.push(cap(t));
          if (samples.length - lastLog >= 10) { lastLog = samples.length; log('분석 중... ' + t.toFixed(1) + 's / ' + rangeE.toFixed(1) + 's'); }
        },
        onProgress: p => setAnalyzeProgress(Math.min(100, Math.round(p * 100))),
        onRestart: () => { times.length = 0; samples.length = 0; lastLog = -1; },
        onNotice: m => log(m),
        stats: pageStats,
      });
      // 빠른 재생 중 디코더가 따라가지 못해 프레임이 건너뛰어진 구간(샘플 간격 > 2.5×step)은 seek로 채운다 —
      // 건너뛴 곳에 페이지 전환이 있으면 통째로 놓치기 때문(실측: 1080p 영상에서 18초 구멍).
      {
        const gaps = [];
        const edges = [rangeS - step, ...times, rangeE];
        for (let i = 1; i < edges.length; i++) if (edges[i] - edges[i - 1] > step * 2.5) gaps.push([edges[i - 1], edges[i]]);
        let filled = 0;
        let need = 0;
        for (const [g0, g1] of gaps) need += Math.max(0, Math.ceil((Math.min(g1, rangeE) - g0) / step) - 1);
        for (const [g0, g1] of gaps) {
          for (let t = Math.max(rangeS, g0 + step); t < g1 - step * 0.5 && t < rangeE; t += step) {
            await seekRobust(video, t);
            times.push(t); samples.push(cap(t)); filled++;
            if (filled % 5 === 0) log('빠른 재생 중 건너뛴 곳을 채우는 중... ' + filled + '/' + need + '장');
          }
        }
        if (filled) {
          const order = times.map((t, i) => i).sort((i, j) => times[i] - times[j]);
          const t2 = order.map(i => times[i]), s2 = order.map(i => samples[i]);
          times.length = 0; samples.length = 0; times.push(...t2); samples.push(...s2);
          log('빠른 재생 중 건너뛴 구간 ' + gaps.length + '곳을 seek로 보충했습니다 (' + filled + '장).');
        }
      }
      if (samples.length < 2) throw new Error('프레임을 충분히 읽지 못했습니다 (' + samples.length + '개)');
      setAnalyzeProgress(100);
      // 다 모은 뒤 배경(밝은/어두운)을 정하고 비교한다 — 영상 전체를 보고 정해야 인트로 한 장에 휘둘리지 않는다
      const prep = pagePrepareCompare(samples);
      for (let i = 1; i < samples.length; i++) {
        diffs.push(pageChangeScore(prep.cmp[i - 1], prep.cmp[i], prep.mode));
        meanDiffs.push(pageMeanAbsDiff(samples[i - 1], samples[i]));
      }
      samplesRef.current = prep.cmp;
      setAnalysis({ times, diffs, meanDiffs, step, roi: roiAtStart, rangeS, rangeE,
        compare: { mode: prep.mode, darkBackground: prep.dark, inkThreshold: prep.inkTh, inkFracMedian: prep.inkFracMedian, busyColumnsExcluded: prep.busyFrac } });
      const maxObserved = Math.max(...diffs, 0);
      setThresholdRange({ min: 0, max: Math.max(1, maxObserved * 1.1), step: 0.005 });
      const initialThreshold = pageAutoThreshold(diffs);
      setThreshold(initialThreshold);
      const over = diffs.filter(d => d > initialThreshold).length;
      log('분석 완료 (비교 방식: ' + (prep.mode === 'ink' ? (prep.dark ? '어두운 배경의 밝은 글자' : '밝은 배경의 어두운 글자') : '회색 영상')
        + (prep.busyCols ? ', 자주 바뀌는 칸(코드 다이어그램 등) 폭 ' + Math.round(prep.busyFrac * 100) + '% 제외' : '') + '). 변화 점수(0=같은 화면, 1=완전히 다른 화면) 범위 ' + Math.min(...diffs, 0).toFixed(2) + ' ~ ' + maxObserved.toFixed(2)
        + ', 자동 임계값 ' + initialThreshold.toFixed(2) + ' (넘는 지점 ' + over + '곳). 대표 프레임을 자동으로 뽑습니다...');
      await reextract({ times, diffs, step, roi: roiAtStart, compare: { mode: prep.mode } }, initialThreshold, prep.cmp);
    } catch (err) {
      log('분석 중 오류: ' + err.message);
    } finally {
      busyRef.current = false;
      setAnalyzing(false);
    }
  }

  async function reextract(an, th, samplesArg) {
    const A = an || analysis;
    const TH = th != null ? th : threshold;
    if (!A) { log('먼저 "분석 시작"을 누르세요.'); return; }
    setExtracting(true);
    busyRef.current = true;
    try {
      const { times, diffs } = A;
      const step = A.step || (parseFloat(stepSec) || 0.3);
      const { segments, removed } = pageBuildSegments(times, diffs, TH, samplesArg || samplesRef.current, step, A.compare ? A.compare.mode : 'gray');
      lastSegmentsRef.current = { threshold: TH, segments, removed };
      const video = videoRef.current;
      const newFrames = [];
      for (let s = 0; s < segments.length; s++) {
        const g = segments[s];
        const repTime = times[g.rep];
        log('대표 프레임 뽑는 중... ' + (s + 1) + '/' + segments.length);
        await seekRobust(video, repTime);
        const captured = captureRoiNative(video, (A.roi !== undefined ? A.roi : roiRef.current));
        newFrames.push({
          id: 'f_' + Date.now() + '_' + s,
          dataUrl: captured.dataUrl, w: captured.w, h: captured.h,
          segStartT: times[g.s], segEndT: times[g.e], repT: repTime,
          roi: (A.roi !== undefined ? A.roi : roiRef.current) || null,
          hasStaff: canvasHasTabStaff(roiCaptureCanvas) || !!uniFindBand(roiCaptureCanvas, DEFAULT_PREPROC),
        });
      }
      // 맨 앞·맨 뒤의 TAB 없는 짧은 장면(제목 화면 등)은 뺀다.
      // 오선 판정 두 가지가 모두 실패하고 6초 이하일 때만 — 어두운 반투명 바탕(4K 등)에선 오선 판정이 실제 페이지에서도 틀려,
      // 판정만 믿고 빼면 첫·마지막 페이지가 사라졌다(정답 악보 채점에서 확인). 가운데 장면은 건드리지 않는다
      let noStaffEdge = 0;
      const dropable = f => !f.hasStaff && f.segEndT - f.segStartT <= 6;
      if (newFrames.some(f => f.hasStaff)) {
        while (newFrames.length > 1 && dropable(newFrames[0])) { newFrames.shift(); noStaffEdge++; }
        while (newFrames.length > 1 && dropable(newFrames[newFrames.length - 1])) { newFrames.pop(); noStaffEdge++; }
      }
      setFrames(newFrames);
      const notes = [];
      if (noStaffEdge) notes.push('앞뒤 TAB 없는 화면(제목 등) ' + noStaffEdge + '개');
      if (removed.short) notes.push('전환 도중 프레임 ' + removed.short + '개');
      if (removed.blank) notes.push('빈 화면 ' + removed.blank + '개');
      if (removed.dup) notes.push('바로 앞과 같은 페이지 ' + removed.dup + '개');
      log('완료. 임계값 ' + TH.toFixed(2) + ' 기준, 대표 프레임 ' + newFrames.length + '장 추출됨'
        + (notes.length ? ' (자동 제외: ' + notes.join(', ') + ')' : '') + '. 결과가 마음에 안 들면 슬라이더를 조절해서 다시 뽑아보세요.');
    } catch (err) {
      log('추출 중 오류: ' + err.message);
    } finally {
      busyRef.current = false;
      setExtracting(false);
    }
  }

  function exportPageDebug() {
    if (!analysis) return;
    const segInfo = lastSegmentsRef.current;
    const data = {
      kind: 'page_frames_debug',
      params: { step: analysis.step, rangeS: analysis.rangeS, rangeE: analysis.rangeE, roi: analysis.roi, threshold,
        autoThreshold: pageAutoThreshold(analysis.diffs), minSegSec: PAGE_MIN_SEG_SEC, blankStd: PAGE_BLANK_STD, compare: analysis.compare },
      frames: analysis.diffs.map((d, i) => ({ t0: analysis.times[i], t: analysis.times[i + 1], change: d, meanDiff: analysis.meanDiffs[i],
        std: samplesRef.current[i + 1] ? samplesRef.current[i + 1].std : null,
        inkFrac: samplesRef.current[i + 1] && samplesRef.current[i + 1].inkFrac != null ? +samplesRef.current[i + 1].inkFrac.toFixed(4) : null, overThreshold: d > threshold })),
      segments: segInfo ? segInfo.segments.map(g => ({ start: analysis.times[g.s], end: analysis.times[g.e], rep: analysis.times[g.rep] })) : [],
      removed: segInfo ? segInfo.removed : null,
    };
    downloadBlobFile(new Blob([JSON.stringify(data, null, 1)], { type: 'application/json' }), 'page_frames_debug.json');
  }

  return (
    <div>

          (영상마다 TAB 위치 비율이 다르므로 직접 지정해야 합니다 — 지정하지 않으면 화면 전체를 사용합니다).
          아래 "영상 상태 확인" 슬라이더로 다른 시점도 확인하며 영역을 잡을 수 있습니다.
        </p>
        <div className="controls">

        </div>

        <div className="roi-grab" onMouseDown={onRoiMouseDown}>
          <div className="roi-wrap">

        </div>
        {videoLoaded && (
          <div className="toolbar" style={{ marginTop: 6 }}>

            {autoRoiMsg && <span className="hint-text">{autoRoiMsg}</span>}
          </div>
        )}
        <div className="slider-label">
          {roi
            ? ('지정된 영역: 가로 ' + (roi.x0*100).toFixed(0) + '%~' + (roi.x1*100).toFixed(0) + '%, 세로 ' + (roi.y0*100).toFixed(0) + '%~' + (roi.y1*100).toFixed(0) + '%')
            : '아직 영역을 지정하지 않았습니다. (지정하지 않으면 화면 전체로 분석합니다)'}

        <div className="toolbar">

              style={{ flex: 1 }} onChange={onSeekSliderChange} />

        <div className="toolbar">
          <button className="icon-btn" onClick={() => { setRangeStart(0); setRangeEnd(duration); }} disabled={!videoLoaded || analyzing || extracting}>구간 초기화(전체)</button>
        </div>

        <div className="toolbar">
          <button className="icon-btn" onClick={() => setRoi(null)} disabled={!roi || analyzing || extracting}>영역 초기화</button>
          <button onClick={analyze} disabled={!videoLoaded || analyzing || extracting}>{analyzing ? '분석 중...' : '분석 시작 (전환 감지)'}</button>
          <span className="slider-label" style={{ margin: 0 }}>샘플링 간격(초)</span>
          <input type="number" value={stepSec} step="0.1" min="0.05" disabled={analyzing || extracting} onChange={e => setStepSec(e.target.value)} />

        {analyzing && (

            <div className="progress-bar-fill" style={{ width: analyzeProgress + '%' }} />

          </div>
        )}

        {analysis && (
          <div className="toolbar">
            <label style={{ flex: 1, display: 'flex', alignItems: 'center', gap: '8px' }}>
              <span className="slider-label" style={{ margin: 0, whiteSpace: 'nowrap' }} title="변화 점수(0=같은 화면, 1=완전히 다른 화면)가 이 값을 넘으면 페이지 전환으로 봅니다">전환 판정 임계값</span>
              <input type="range" min={thresholdRange.min} max={thresholdRange.max} step={thresholdRange.step}
                value={threshold} style={{ flex: 1 }} disabled={analyzing || extracting} onChange={e => setThreshold(parseFloat(e.target.value))} />
              <span className="slider-label" style={{ margin: 0 }}>{threshold.toFixed(2)}</span>
            </label>
            <button className="icon-btn" onClick={() => reextract()} disabled={extracting || analyzing}>
              {extracting ? '추출 중...' : '이 임계값으로 대표 프레임 다시 뽑기'}

        <div className="slider-label" style={{ whiteSpace: 'pre-wrap' }}>{statusMsg}</div>
        {(onsetDetecting || onsets.length > 0) && (
          <div className="slider-label">
            {onsetDetecting ? '오디오 온셋(소리 시작 지점) 감지 중...' : ('오디오 온셋 ' + onsets.length + '개 감지됨 (가사 배치 단계에서 사용됩니다)')}
          </div>

      {frames.length > 0 && (

      <div className="toolbar">

      <Lightbox src={lightboxSrc} onClose={() => setLightboxSrc(null)} />

  );
}

function SelectStep({ frames, selectedFrameIds, setSelectedFrameIds, onBack, onNext }) {
  function toggle(id) {
    setSelectedFrameIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }
  return (
    <div>
      <div className="block">
        <div className="block-head"><span>2단계 — 악보로 쓸 프레임 선택</span></div>
        <p className="hint-text">실제로 악보에 쓸 프레임만 체크하세요. 필요 없는 프레임(장면 전환 중 어중간한 프레임 등)은 해제하면 됩니다.</p>
        <div className="toolbar">
          <button className="icon-btn" onClick={() => setSelectedFrameIds(new Set(frames.map(f => f.id)))}>전체 선택</button>
          <button className="icon-btn" onClick={() => setSelectedFrameIds(new Set())}>전체 해제</button>
          <span className="save-msg">{selectedFrameIds.size} / {frames.length}장 선택됨</span>
        </div>
        <div className="thumb-grid">
          {frames.map((f, i) => (
            <label key={f.id} className={selectedFrameIds.has(f.id) ? 'thumb-card selectable selected' : 'thumb-card selectable'}>
              <input type="checkbox" checked={selectedFrameIds.has(f.id)} onChange={() => toggle(f.id)} />
              <img src={f.dataUrl} alt={'프레임 ' + (i + 1)} />
              <div className="thumb-meta">#{i + 1} · {f.repT.toFixed(1)}s</div>
            </label>
          ))}
        </div>
      </div>
      <div className="toolbar">
        <button className="icon-btn" onClick={onBack}>← 이전</button>
        <button onClick={onNext} disabled={selectedFrameIds.size === 0}>선택한 {selectedFrameIds.size}장으로 전처리 계속 →</button>
      </div>
    </div>
  );
}

// 정수 입력칸: 숫자를 지우고 새로 칠 수 있게 입력 중에는 빈칸·범위 밖 값을 그대로 둔다.
// 예전엔 지우는 순간 1로 바뀌어(빈칸 → 1) "4"를 치면 "14"가 되고, 위아래 화살표로만 바꿀 수 있었다.
// 범위 안의 정수가 되면 바로 반영하고, 칸을 벗어날 때(또는 Enter) 범위 밖이면 가장 가까운 값으로 맞춘다.
function IntInput({ value, min, max, onCommit, disabled, style }) {
  const [draft, setDraft] = useState(String(value));
  const focusRef = useRef(false);
  useEffect(() => { if (!focusRef.current) setDraft(String(value)); }, [value]);
  const clamp = n => Math.max(min, Math.min(max, n));
  function finish() {
    focusRef.current = false;
    const n = parseInt(draft, 10);
    if (isNaN(n)) { setDraft(String(value)); return; }
    const c = clamp(n);
    setDraft(String(c));
    if (c !== value) onCommit(c);
  }
  return (
    <input type="number" inputMode="numeric" min={min} max={max} step="1" value={draft} disabled={disabled} style={style}
      onFocus={e => { focusRef.current = true; e.target.select(); }}
      onChange={e => {
        const v = e.target.value;
        setDraft(v);
        const n = parseInt(v, 10);
        if (!isNaN(n) && String(n) === v.trim() && n >= min && n <= max) onCommit(n);
      }}
      onBlur={finish}
      onKeyDown={e => { if (e.key === 'Enter') e.target.blur(); }} />
  );
}

// ---- 미리보기 다시 그리기 지연·분산 ----
// 설정 슬라이더를 움직일 때마다 모든 그림을 한꺼번에 다시 그려(흑백 처리는 그림 한 장에 수십 ms) 슬라이더가 끊기듯 움직였다.
// → 화면에 보이는 그림만, 마지막 변경 후 잠깐 기다렸다가 한 장씩 차례로(사이사이 입력 처리) 다시 그린다.
//   화면 밖 그림은 보일 때 그린다.
const lazyDrawQ = { q: new Map(), timer: null };
function lazyDrawRun() {
  lazyDrawQ.timer = null;
  const it = lazyDrawQ.q.entries().next();
  if (it.done) return;
  const [id, fn] = it.value;
  lazyDrawQ.q.delete(id);
  try { fn(); } catch (e) { console.error(e); }
  if (lazyDrawQ.q.size) lazyDrawQ.timer = setTimeout(lazyDrawRun, 0);
}
function scheduleLazyDraw(id, fn, delay) {
  lazyDrawQ.q.delete(id);
  lazyDrawQ.q.set(id, fn);
  if (!lazyDrawQ.timer) lazyDrawQ.timer = setTimeout(lazyDrawRun, delay == null ? 60 : delay);
}
function useLazyRedraw(elRef, deps, draw) {
  const idRef = useRef(null);
  if (!idRef.current) idRef.current = {};
  const visRef = useRef(true), dirtyRef = useRef(false), drawRef = useRef(draw);
  drawRef.current = draw;
  useEffect(() => {
    const el = elRef.current;
    if (!el || typeof IntersectionObserver === 'undefined') return;
    const io = new IntersectionObserver(ents => {
      const v = ents[ents.length - 1].isIntersecting;
      visRef.current = v;
      if (v && dirtyRef.current) { dirtyRef.current = false; scheduleLazyDraw(idRef.current, () => drawRef.current(), 0); }
    }, { rootMargin: '600px 0px' });
    io.observe(el);
    return () => { io.disconnect(); lazyDrawQ.q.delete(idRef.current); };
  }, []);
  useEffect(() => {
    if (visRef.current) scheduleLazyDraw(idRef.current, () => drawRef.current());
    else dirtyRef.current = true;
  }, deps);
}

const FrameCard = React.memo(function FrameCard({ item, index, defaults, onChange, onRecrop }) {
  const canvasRef = useRef(null);
  const imgRef = useRef(null);
  const [advanced, setAdvanced] = useState(!!item.override);
  const eff = effectiveImageSettings(item, defaults);

  useEffect(() => {
    let active = true;
    loadImage(item.src).then(img => {
      if (!active) return;
      imgRef.current = img;
      redraw();
    });
    return () => { active = false; };
  }, [item.src]);

  const rootRef = useRef(null);
  useLazyRedraw(rootRef, [item.src, JSON.stringify(eff)], redraw);

  function redraw() {
    if (!imgRef.current || !canvasRef.current) return;
    drawProcessed(canvasRef.current, imgRef.current, effectiveImageSettings(item, defaults));
  }

  function updateOverride(patch) {
    const base = item.override || eff;
    onChange({ ...item, override: { ...base, ...patch } });
  }
  function enableAdvanced() {
    setAdvanced(true);
    if (!item.override) onChange({ ...item, override: { ...eff } });
  }
  function clearOverride() {
    setAdvanced(false);
    onChange({ ...item, override: null });
  }

  return (
    <div className="block" ref={rootRef}>
      <div className="block-head">
        <span>프레임 {index + 1}{item.recropped ? ' · 영역 다시 잡음' : ''}</span>
        {onRecrop && item.repT != null && (
          <button className="icon-btn" onClick={() => onRecrop(item)} title="이 페이지만 영상 화면에서 영역을 더 넓게(또는 다르게) 다시 잘라냅니다">이 페이지만 영역 다시 잡기</button>
        )}
      </div>
      <canvas ref={canvasRef} className="preview" />
      <div className="controls">
        {!advanced ? (
          <div className="adv-toggle-row">
            <span>기본 설정을 따르는 중</span>
            <button className="icon-btn" onClick={enableAdvanced}>고급 설정 사용</button>
          </div>
        ) : (
          <React.Fragment>
            <div className="adv-toggle-row">
              <span>이 프레임만의 고급 설정 사용 중</span>
              <button className="icon-btn" onClick={clearOverride}>기본값 따르기로 되돌리기</button>
            </div>
            <label>
              <input type="checkbox" checked={eff.removeBg} onChange={e => updateOverride({ removeBg: e.target.checked })} />
              배경 제거 (사진 배경 → 흰색)
            </label>
            {eff.removeBg && (
              <React.Fragment>
                <label>
                  <input type="checkbox" checked={eff.invert} onChange={e => updateOverride({ invert: e.target.checked })} />
                  어두운 배경 (밝은 글씨/선을 검정으로 변환)
                </label>
                <div>
                  <div className="slider-label">배경 제거 강도 ({eff.threshold})</div>
                  <input type="range" min="0" max="255" step="1" value={eff.threshold}
                    onChange={e => updateOverride({ threshold: Number(e.target.value) })} />
                </div>
                <div>
                  <div className="slider-label">부드러운 경계 — 안티앨리어싱 유지 ({eff.softness})</div>
                  <input type="range" min="0" max="60" step="1" value={eff.softness}
                    onChange={e => updateOverride({ softness: Number(e.target.value) })} />
                </div>
                <label>
                  <input type="checkbox" checked={eff.despeckle} onChange={e => updateOverride({ despeckle: e.target.checked })} />
                  잡티(고립 노이즈) 제거
                </label>
                {eff.despeckle && (
                  <div>
                    <div className="slider-label">제거할 잡티 크기 ({eff.despeckleSize}px 이하)</div>
                    <input type="range" min="1" max="12" step="1" value={eff.despeckleSize}
                      onChange={e => updateOverride({ despeckleSize: Number(e.target.value) })} />
                  </div>
                )}
              </React.Fragment>
            )}
          </React.Fragment>
        )}
      </div>
    </div>
  );
});

// ---- "N장씩 합치기" (batch merge) — copied verbatim from tab-score-builder.html so the two pages'
// merge behavior/output stay byte-for-byte identical. Only the exclude-range sub-feature (not part
// of this page's spec) was left out; group-size, inter-piece gap and the front-2-images preview are
// all reused as-is. See tab-score-builder.html for the extensive design-rationale comments.
const STAFF_LINE_LUM_THRESHOLD = 235;
const STAFF_WOBBLE_BAND_PX = 4;
const STAFF_GAP_TOLERANCE_PX = 20;
const STAFF_MIN_SPAN_FRACTION = 0.3;
const STAFF_MIN_SPAN_FLOOR_PX = 90;
const STAFF_MAX_GROUP_THICKNESS = STAFF_WOBBLE_BAND_PX * 2 + 6;
const STAFF_GAP_Y_TOLERANCE = 0.25;
const STAFF_MIN_X_OVERLAP_FRACTION = 0.6;

function detectStaffBand(imageData, w, h) {
  const d = imageData.data;
  const isDark = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      isDark[y * w + x] = lum < STAFF_LINE_LUM_THRESHOLD ? 1 : 0;
    }
  }
  const minSpan = Math.max(STAFF_MIN_SPAN_FLOOR_PX, w * STAFF_MIN_SPAN_FRACTION);
  const rowLeft = new Int32Array(h).fill(-1);
  const rowRight = new Int32Array(h).fill(-1);
  const rowLen = new Int32Array(h);
  const bandOr = new Uint8Array(w);
  for (let y = 0; y < h; y++) {
    const lo = Math.max(0, y - STAFF_WOBBLE_BAND_PX), hi = Math.min(h - 1, y + STAFF_WOBBLE_BAND_PX);
    bandOr.fill(0);
    for (let yy = lo; yy <= hi; yy++) {
      const rowOff = yy * w;
      for (let x = 0; x < w; x++) if (isDark[rowOff + x]) bandOr[x] = 1;
    }
    let bestStart = -1, bestEnd = -1, bestLen = 0;
    let x = 0;
    while (x < w) {
      if (!bandOr[x]) { x++; continue; }
      const start = x;
      let gap = 0, xe = x;
      while (xe < w) {
        if (bandOr[xe]) { gap = 0; xe++; }
        else { gap++; if (gap > STAFF_GAP_TOLERANCE_PX) break; xe++; }
      }
      let end = xe;
      while (end > start && !bandOr[end - 1]) end--;
      if (end - start > bestLen) { bestLen = end - start; bestStart = start; bestEnd = end; }
      x = xe;
    }
    if (bestLen >= minSpan) { rowLeft[y] = bestStart; rowRight[y] = bestEnd; rowLen[y] = bestLen; }
  }
  const groups = [];
  let y = 0;
  while (y < h) {
    if (rowLen[y] === 0) { y++; continue; }
    const start = y;
    while (y < h && rowLen[y] > 0) y++;
    const end = y;
    if (end - start > STAFF_MAX_GROUP_THICKNESS) continue;
    let peakY = start;
    for (let yy = start + 1; yy < end; yy++) if (rowLen[yy] > rowLen[peakY]) peakY = yy;
    groups.push({ y: (start + end - 1) / 2, left: rowLeft[peakY], right: rowRight[peakY] });
  }
  if (groups.length < 6) return null;
  let best = null;
  for (let i = 0; i < groups.length; i++) {
    for (let j = i + 1; j < groups.length; j++) {
      const gap = groups[j].y - groups[i].y;
      if (gap <= 0) continue;
      const chain = [groups[i]];
      let ok = true;
      for (let k = 1; k < 6; k++) {
        const target = groups[i].y + gap * k;
        let closest = null, closestDiff = Infinity;
        for (const g of groups) {
          const diff = Math.abs(g.y - target);
          if (diff < closestDiff) { closestDiff = diff; closest = g; }
        }
        if (closest === null || closestDiff > gap * STAFF_GAP_Y_TOLERANCE) { ok = false; break; }
        chain.push(closest);
      }
      if (!ok || chain.length !== 6) continue;
      const lefts = chain.map(c => c.left), rights = chain.map(c => c.right);
      const overlapLeft = Math.max(...lefts), overlapRight = Math.min(...rights);
      const avgSpan = chain.reduce((s, c) => s + (c.right - c.left), 0) / 6;
      if (avgSpan <= 0 || (overlapRight - overlapLeft) < avgSpan * STAFF_MIN_X_OVERLAP_FRACTION) continue;
      const gaps = [];
      for (let k = 1; k < 6; k++) gaps.push(chain[k].y - chain[k - 1].y);
      const meanGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      const variance = gaps.reduce((a, b) => a + (b - meanGap) * (b - meanGap), 0) / gaps.length;
      const confidence = 1 / (1 + variance);
      if (!best || confidence > best.confidence) {
        best = {
          staffTop: chain[0].y, staffBottom: chain[5].y,
          staffLeft: overlapLeft, staffRight: overlapRight,
          lineYs: chain.map(c => c.y), confidence,
        };
      }
    }
  }
  return best;
}

function resolvedSrc(item) {
  return (item.barLayout && item.barLayout.appliedSrc) || item.src;
}

const MERGED_ROW_NEUTRAL_OVERRIDE = {
  removeBg: false, invert: false, threshold: 140, softness: 0,
  despeckle: false, despeckleSize: 0,
  playheadRemove: false, playheadColor: null,
  cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
};
const MERGE_GAP_MIN_PCT = -10;
const MERGE_GAP_MAX_PCT = 5;

// ---- N장씩 합치기 v2 (video-tab-extractor.html · tab-score-builder.html 공통 — 두 파일에 같은 코드) ----
// 예전 방식은 흑백 처리된 그림에서 "끊기지 않은 진한 오선 6줄"을 찾았다. 영상 악보는 오선이 연한 회색이라 흑백 처리 뒤
// 끊기거나 거의 사라져(정답 악보 7곡 중 7곡 모두 실패), 오선 일부만 잡혀 오른쪽 끝을 엉뚱한 곳(폭의 30~60%)으로 보고
// 다음 장을 그 위에 겹쳐 그리거나, 아예 못 찾아 여백째 이어 붙였다.
// 새 방식: 처리 전 원본(자르기만 적용)에서 위아래보다 어둡거나(흰 바탕) 밝은(어두운 바탕) 가는 가로줄을 찾고,
// 같은 간격으로 4~6줄 늘어선 묶음을 오선으로 본다. 오선의 왼쪽·오른쪽 끝 = 그 줄들의 절반 이상이 지나가는 가장 긴 가로 구간.
function mergeStaffExtent(canvas) {
  const W = canvas.width, H = canvas.height;
  if (W < 40 || H < 20) return null;
  const d0 = canvas.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, W, H).data;
  const g = new Uint8Array(W * H);
  for (let p = 0, i = 0; p < W * H; p++, i += 4) g[p] = (d0[i] * 77 + d0[i + 1] * 150 + d0[i + 2] * 29) >> 8;
  const d = Math.max(2, Math.round(H * 0.008));
  let best = null;
  for (const pol of [1, -1]) {
    const L = new Uint8Array(W * H);
    const R = new Float32Array(H);
    for (let y = d; y < H - d; y++) {
      let c = 0;
      const o = y * W, ou = (y - d) * W, od = (y + d) * W;
      for (let x = 0; x < W; x++) {
        const v = g[o + x], a = g[ou + x], b = g[od + x];
        const hit = pol > 0 ? (Math.min(a, b) - v > 10) : (v - Math.max(a, b) > 10);
        if (hit) { L[o + x] = 1; c++; }
      }
      R[y] = c / W;
    }
    const R2 = new Float32Array(H);
    for (let y = 0; y < H; y++) R2[y] = Math.max(R[y], y + 1 < H ? R[y + 1] : 0);
    let pk = [];
    for (let y = 1; y < H - 1; y++) if (R2[y] >= 0.2 && R2[y] >= R2[y - 1] && R2[y] > R2[y + 1]) pk.push(y);
    if (pk.length > 60) pk = pk.sort((a, b) => R2[b] - R2[a]).slice(0, 60).sort((a, b) => a - b);
    for (let i = 0; i < pk.length; i++) {
      for (let j = i + 1; j < pk.length; j++) {
        const gap = pk[j] - pk[i];
        if (gap < 4 || gap > H / 3) continue;
        const ch = [pk[i]];
        for (let k = 1; k < 6; k++) {
          const t = pk[i] + gap * k;
          let c = -1, cd = Infinity;
          for (const p of pk) { const dd = Math.abs(p - t); if (dd < cd) { cd = dd; c = p; } }
          if (cd > Math.max(2, gap * 0.15)) break;
          ch.push(c);
        }
        if (ch.length < 4) continue;
        let sc = 0; for (const y of ch) sc += R2[y];
        if (!best || sc > best.sc) best = { sc, ch, gap, L };
      }
    }
  }
  if (!best) return null;
  const { ch, gap, L } = best;
  const cov = new Uint8Array(W);
  for (const y of ch) {
    for (let x = 0; x < W; x++) {
      let hit = 0;
      for (let yy = Math.max(0, y - 1); yy <= Math.min(H - 1, y + 2); yy++) if (L[yy * W + x]) { hit = 1; break; }
      cov[x] += hit;
    }
  }
  const need = Math.max(2, Math.ceil(ch.length / 2));
  let bestRun = null, s = -1, last = -1;
  for (let x = 0; x <= W; x++) {
    const on = x < W && cov[x] >= need;
    if (on) { if (s < 0) s = x; else if (x - last > gap * 2) { if (!bestRun || last - s > bestRun[1] - bestRun[0]) bestRun = [s, last]; s = x; } last = x; }
  }
  if (s >= 0 && (!bestRun || last - s > bestRun[1] - bestRun[0])) bestRun = [s, last];
  if (!bestRun || bestRun[1] - bestRun[0] < W * 0.3) return null;
  return { left: bestRun[0], right: bestRun[1] + 1, top: ch[0], gap, lines: ch.length, W, H };
}

// parts: [{ canvas(처리된 그림), ext(mergeStaffExtent 결과 또는 null) }]
// gapPct: 모든 이음새의 기본 간격(오선 폭의 %), seamGaps[k]: k번째 이음새(조각 k와 k+1 사이)만 따로 정한 간격(%) — null이면 기본값.
// 간격 0 = 앞 장 오선 끝과 다음 장 오선 시작이 맞닿음. 음수 = 겹침 → 겹치는 폭의 절반씩 앞 장 오른쪽·다음 장 왼쪽을 잘라 맞붙인다
// (예전처럼 다음 장의 흰 바탕이 앞 장 위를 덮어 지우지 않는다).
function composeMergedRow(parts, gapPct, seamGaps) {
  const n = parts.length;
  const ref = parts[0].ext;
  const sc = parts.map(p => {
    if (!ref || !p.ext) return 1;
    let s = ref.gap / p.ext.gap;
    if (!isFinite(s) || Math.abs(s - 1) < 0.03) s = 1; // 같은 영상·같은 영역이면 확대·축소하지 않는다(흐려짐 방지)
    return Math.max(0.5, Math.min(2, s));
  });
  const P = parts.map((p, i) => {
    const s = sc[i], w = Math.max(1, Math.round(p.canvas.width * s)), h = Math.max(1, Math.round(p.canvas.height * s));
    const L = i > 0 && p.ext ? Math.round(p.ext.left * s) : 0;
    const R = i < n - 1 && p.ext ? Math.round(p.ext.right * s) : w;
    return { canvas: p.canvas, s, w, h, L, R: Math.max(L + 1, R), top: p.ext ? p.ext.top * s : null };
  });
  // 세로 맞춤: 첫 장은 움직이지 않는다(가사 위치 보존), 오선이 없는 장은 위쪽 맞춤
  const top0 = P[0].top;
  let offs = P.map(q => (top0 != null && q.top != null) ? Math.round(top0 - q.top) : 0);
  const minOff = Math.min(...offs);
  if (minOff < 0) offs = offs.map(o => o - minOff);
  const staffWs = P.map(q => q.R - q.L).filter(v => v > 0);
  const refW = staffWs.reduce((a, b) => a + b, 0) / Math.max(1, staffWs.length);
  const gapsPx = [];
  for (let k = 0; k < n - 1; k++) {
