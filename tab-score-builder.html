function FloatingPreview({ title, items, titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricLetterSpacing, lyricAreaHeight, defaults }) {
  const [previewSrc, setPreviewSrc] = useState(null);
  const [busy, setBusy] = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  const [expanded, setExpanded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    if (items.length === 0) { setPreviewSrc(null); return; }
    setBusy(true);
    const timer = setTimeout(async () => {
      try {
        const canvas = await composeScore(items, title, 800, { titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricLetterSpacing, lyricAreaHeight, defaults });
        if (cancelled) return;
        setPreviewSrc(canvas.toDataURL('image/png'));
      } finally {
        if (!cancelled) setBusy(false);
      }
    }, 450);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [title, items, titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricLetterSpacing, lyricAreaHeight, defaults]);

  if (items.length === 0) return null;

  return (
    <React.Fragment>
      <div className={collapsed ? 'float-preview collapsed' : 'float-preview'}>
        <div className="float-preview-head">
          <span>미리보기{busy ? ' ...' : ''}</span>

          <div className="float-preview-body">
            {previewSrc && <img src={previewSrc} alt="미리보기" />}

function TabScoreBuilder() {
  const [title, setTitle] = useState('');
  const [items, setItems] = useState([]);
  const [defaults, setDefaults] = useState(DEFAULTS_INIT);
  const [titleFontSize, setTitleFontSize] = useState(44);
  const [lyricFontSize, setLyricFontSize] = useState(26);
  const [lyricLetterSpacing, setLyricLetterSpacing] = useState(0);
  const [exporting, setExporting] = useState(false);
  const [pagedFormat, setPagedFormat] = useState('pdf');
  const [pagedExporting, setPagedExporting] = useState(false);
  const [savedList, setSavedList] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState('');
  const [noticeDismissed, setNoticeDismissed] = useState(true);
  const [mergeSelectedIds, setMergeSelectedIds] = useState(new Set());
  const [merging, setMerging] = useState(false);
  const [mergeGapPct, setMergeGapPct] = useState(0);
  const [mergePreviewSrc, setMergePreviewSrc] = useState(null);
  const [mergePreviewBusy, setMergePreviewBusy] = useState(false);
  const [batchGroupSize, setBatchGroupSize] = useState(2);
  const [batchMerging, setBatchMerging] = useState(false);
  const [batchPanelOpen, setBatchPanelOpen] = useState(false);
  const [batchExcludeStart, setBatchExcludeStart] = useState('');
  const [batchExcludeEnd, setBatchExcludeEnd] = useState('');
  const [batchPreviewSrc, setBatchPreviewSrc] = useState(null);
  const [batchPreviewBusy, setBatchPreviewBusy] = useState(false);
  const fileInputRef = useRef(null);
  const listRef = useRef(null);
  function getReferenceWidth() {
    return (listRef.current && listRef.current.getBoundingClientRect().width) || 780;
  }

  useEffect(() => {
    try {
      setNoticeDismissed(localStorage.getItem('tab_score_builder_notice_dismissed') === '1');
    } catch (e) {}
  }, []);
  function dismissNotice() {
    setNoticeDismissed(true);
    try { localStorage.setItem('tab_score_builder_notice_dismissed', '1'); } catch (e) {}
  }

  useEffect(() => {
    (async () => {
      try {
        const draft = await dbGet(DRAFT_KEY);
        if (draft) {
          setTitle(draft.title || '');
          setItems(draft.items || []);
          if (draft.defaults) setDefaults({ ...DEFAULTS_INIT, ...draft.defaults });
          if (draft.titleFontSize) setTitleFontSize(draft.titleFontSize);
          if (draft.lyricFontSize) setLyricFontSize(draft.lyricFontSize);
          if (draft.lyricLetterSpacing) setLyricLetterSpacing(draft.lyricLetterSpacing);
        }
        // Consumed once, right after the draft above (so it appends on top rather than racing it) —
        // deleted immediately after reading so a page refresh never re-imports the same batch.
        const imported = await dbGet(VIDEO_IMPORT_KEY);
        if (imported && Array.isArray(imported.items) && imported.items.length > 0) {
          setItems(prev => [...prev, ...imported.items]);
          await dbDelete(VIDEO_IMPORT_KEY);
          setSaveMsg('영상에서 추출한 이미지 ' + imported.items.length + '장을 불러왔습니다.');
          setTimeout(() => setSaveMsg(''), 3000);
        }
        const keys = await dbAllKeys();
        setSavedList(keys.filter(k => k !== DRAFT_KEY && k !== VIDEO_IMPORT_KEY));
      } catch (e) {
        console.warn('IndexedDB 사용 불가:', e);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(() => {
      dbPut(DRAFT_KEY, { title, items, defaults, titleFontSize, lyricFontSize, lyricLetterSpacing }).catch(() => {});
    }, 800);
    return () => clearTimeout(t);
  }, [title, items, defaults, titleFontSize, lyricFontSize, lyricLetterSpacing, loaded]);

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        const src = ev.target.result;
        const probe = new Image();
        probe.onload = () => {
          const avg = sampleAvgLuminance(probe);
          const invert = defaults.invertMode === 'auto' ? (avg < 128) : defaults.invertMode === 'on';
          const baseId = Date.now() + '_' + Math.random().toString(36).slice(2);
          setItems(prev => [
            ...prev,
            {
              id: baseId, type: 'image', src,
              invert,
              override: null,
              lyrics: { tags: [], areaHeightRatio: null },
              playheadExcluded: [],
              barLayout: null,
              stitchMeta: null,
            },
          ]);
        };
        probe.src = src;
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

  function toggleMergeSelect(id) {
    setMergeSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  // Shared by the live preview effect and the final merge, so both always agree on exactly which
  // items are being merged and in what order.
  function getContiguousMergeIndices() {
    const indices = items
      .map((it, idx) => (mergeSelectedIds.has(it.id) ? idx : -1))
      .filter(idx => idx !== -1);
    if (indices.length < 2) return null;
    const isContiguous = indices.every((idx, i) => i === 0 || idx === indices[i - 1] + 1);
    return isContiguous ? indices : null;
  }

  // Live preview of the merge result as the gap slider moves, so the user can see whether an overlap
  // (negative gap) starts eating into actual bar content before committing to the irreversible merge.
  useEffect(() => {
    let cancelled = false;
    const indices = getContiguousMergeIndices();
    if (!indices) { setMergePreviewSrc(null); return; }
    setMergePreviewBusy(true);
    const timer = setTimeout(async () => {
      try {
        const sourceItems = indices.map(idx => items[idx]);
        const result = await mergeImagesIntoRow(sourceItems, defaults, mergeGapPct);
        if (cancelled) return;
        setMergePreviewSrc(result.canvas.toDataURL('image/png'));
      } finally {
        if (!cancelled) setMergePreviewBusy(false);
      }
    }, 350);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [mergeSelectedIds, mergeGapPct, items, defaults]);

  async function handleMergeSelected() {
    const indices = getContiguousMergeIndices();
    if (!indices) {
      if (mergeSelectedIds.size < 2) { alert('합칠 이미지를 2개 이상 선택해주세요.'); return; }
      alert('선택한 이미지들이 목록에서 서로 떨어져 있습니다. 합치려면 연속된(붙어 있는) 이미지들만 선택해주세요.');
      return;
    }
    if (!window.confirm(indices.length + '개의 이미지를 하나의 줄로 합칩니다. 원래 이미지들은 사라지고 되돌릴 수 없습니다. 계속할까요?')) return;

    setMerging(true);
    try {
      const startIdx = indices[0];
      const sourceItems = indices.map(idx => items[idx]);
      const result = await mergeImagesIntoRow(sourceItems, defaults, mergeGapPct);
      const newItem = {
        id: Date.now() + '_' + Math.random().toString(36).slice(2),
        type: 'image', src: result.canvas.toDataURL('image/png'),
        invert: false, override: { ...MERGED_ROW_NEUTRAL_OVERRIDE },
        lyrics: result.lyrics,
        playheadExcluded: [], barLayout: null, stitchMeta: null,
      };
      setItems(prev => {
        const next = [...prev];
        next.splice(startIdx, indices.length, newItem);
        return next;
      });
      setMergeSelectedIds(new Set());
      setMergeGapPct(0);
      if (result.anyStaffMissing) {
        const positions = result.missingStaffIndices.map(i => i + 1).join(', ');
        alert(
          (indices.length + '장 중 ' + positions + '번째 이미지에서 보표선을 인식하지 못해, ') +
          '그 이미지는 크기 보정과 겹침(콘텐츠 경계 기준 자르기) 보정을 모두 건너뛰고 원본 폭 그대로 이어붙여졌습니다. 결과를 확인해주세요.'
        );
      }
    } catch (err) {
      console.error(err);
      alert('이미지를 합치는 중 오류가 발생했습니다.');
    } finally {
      setMerging(false);
    }
  }

  // Splits `list` into consecutive chunks of `n` — only the LAST chunk can end up shorter than n
  // (whatever's left over after grouping front-to-back), never any earlier one.
  function chunkForBatchMerge(list, n) {
    const groups = [];
    for (let i = 0; i < list.length; i += n) groups.push(list.slice(i, i + n));
    return groups;
  }

  // Resolves the (optional) 1-indexed start/end exclude range against the current item count.
  // Returns null whenever the range doesn't apply — both fields blank (no exclusion requested) and
  // an invalid range (out of bounds, end before start, non-numeric) are treated identically as "no
  // exclusion", so a half-typed or stale range value never silently blocks the whole batch action.
  function resolveBatchExcludeRange(itemCount, startStr, endStr) {
    const start = parseInt(startStr, 10);
    const end = parseInt(endStr, 10);
    if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end < start || start > itemCount) {
      return null;
    }
    return { startIdx: start - 1, endIdx: Math.min(end, itemCount) - 1 };
  }

  // Splits the full item list into the untouched "before" and "excluded" ranges plus the "after"
  // range that batch-merge actually groups — shared by the live preview and the real run so they
  // always agree on exactly which images are in play.
  function splitBatchTargets(list) {
    const range = resolveBatchExcludeRange(list.length, batchExcludeStart, batchExcludeEnd);
    if (!range) return { before: [], excluded: [], after: list, range: null };
    return {
      before: list.slice(0, range.startIdx),
      excluded: list.slice(range.startIdx, range.endIdx + 1),
      after: list.slice(range.endIdx + 1),
      range,
    };
  }

  // Live preview of just the first 2 images that would actually be grouped, so the gap/overlap
  // setting can be sanity-checked without waiting on the full (irreversible) batch run.
  useEffect(() => {
    let cancelled = false;
    if (!batchPanelOpen) { setBatchPreviewSrc(null); return; }
    const { after } = splitBatchTargets(items);
    if (after.length < 2) { setBatchPreviewSrc(null); return; }
    setBatchPreviewBusy(true);
    const timer = setTimeout(async () => {
      try {
        const result = await mergeImagesIntoRow(after.slice(0, 2), defaults, mergeGapPct);
        if (cancelled) return;
        setBatchPreviewSrc(result.canvas.toDataURL('image/png'));
      } finally {
        if (!cancelled) setBatchPreviewBusy(false);
      }
    }, 350);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [batchPanelOpen, items, batchExcludeStart, batchExcludeEnd, mergeGapPct, defaults]);

  async function handleBatchMerge() {
    const n = Math.max(2, Math.floor(batchGroupSize) || 2);
    const { before, excluded, after } = splitBatchTargets(items);
    if (after.length < 2) {
      alert('일괄 합치기 대상 이미지가 2장 이상 있어야 합니다 (제외 범위를 확인해주세요).');
      return;
    }

    const groups = chunkForBatchMerge(after, n);
    const lastGroup = groups[groups.length - 1];
    const lastIsPartial = lastGroup.length < n;

    let confirmMsg = excluded.length > 0
      ? ((before.length + 1) + '번째~' + (before.length + excluded.length) + '번째 제외, 나머지 ' + after.length + '장을 '
          + n + '장씩 묶어 ' + groups.length + '개 그룹으로 합칩니다.')
      : ('전체 ' + after.length + '장을 ' + n + '장씩 묶어 ' + groups.length + '개 그룹으로 합칩니다.');
    if (lastIsPartial) {
      confirmMsg += ' (마지막 그룹은 ' + lastGroup.length + '장으로, 다른 줄과 같은 크기로 왼쪽 정렬되고 오른쪽에 여백이 남습니다.)';
    }
    confirmMsg += ' 합쳐지는 이미지들은 원래 상태로 되돌릴 수 없습니다. 계속할까요?';
    if (!window.confirm(confirmMsg)) return;

    setBatchMerging(true);
    try {
      const mergedResults = [];
      const staffMissingGroupNumbers = [];
      for (const [groupIdx, group] of groups.entries()) {
        const result = await mergeImagesIntoRow(group, defaults, mergeGapPct);
        if (result.anyStaffMissing) staffMissingGroupNumbers.push(groupIdx + 1);
        mergedResults.push(result);
      }

      // A too-short trailing group (1-2 leftover pieces) is kept at the EXACT SAME per-piece scale as
      // every other row — scaling it up to match the other rows' width was tried and rejected (made
      // its text/numbers visibly larger than every other row, which read as more wrong, not less).
      // Instead its unscaled canvas is left-aligned onto a canvas as wide as the other (full) rows,
      // with plain white space on the right filling whatever room the missing pieces would have used.
      if (lastIsPartial) {
        const fullWidths = groups
          .map((g, i) => (g.length === n ? mergedResults[i].canvas.width : null))
          .filter(w => w != null);
        if (fullWidths.length > 0) {
          const avgFullWidth = Math.round(fullWidths.reduce((a, b) => a + b, 0) / fullWidths.length);
          const lastCanvas = mergedResults[mergedResults.length - 1].canvas;
          mergedResults[mergedResults.length - 1] = {
            ...mergedResults[mergedResults.length - 1],
            canvas: padCanvasRightTo(lastCanvas, avgFullWidth),
          };
        }
      }

      const newBlocks = mergedResults.map((result, i) => ({
        id: Date.now() + '_' + Math.random().toString(36).slice(2) + '_' + i,
        type: 'image', src: result.canvas.toDataURL('image/png'),
        invert: false, override: { ...MERGED_ROW_NEUTRAL_OVERRIDE },
        lyrics: result.lyrics,
        playheadExcluded: [], barLayout: null, stitchMeta: null,
      }));

      setItems([...before, ...excluded, ...newBlocks]);
      setMergeSelectedIds(new Set());
      setBatchPanelOpen(false);
      setBatchExcludeStart('');
      setBatchExcludeEnd('');

      let summary = excluded.length > 0
        ? (excluded.length + '장 제외, 나머지 ' + after.length + '장을 ' + n + '장씩 묶어 총 ' + groups.length + '개 그룹으로 합쳐졌습니다.')
        : (n + '장씩 묶어 총 ' + groups.length + '개 그룹으로 합쳐졌습니다.');
      if (staffMissingGroupNumbers.length > 0) {
        summary += ' (' + staffMissingGroupNumbers.join(', ') + '번째 그룹은 일부 이미지의 보표선을 인식하지 못해, '
          + '크기 보정과 겹침(콘텐츠 경계 기준 자르기) 보정을 모두 건너뛰고 원본 폭 그대로 합쳐졌습니다 — 결과를 확인해주세요.)';
      }
      alert(summary);
    } catch (err) {
      console.error(err);
      alert('일괄 합치기 중 오류가 발생했습니다.');
    } finally {
      setBatchMerging(false);
    }
  }

  function applyDefaultsToAll() {
    if (items.length === 0) return;
    if (!window.confirm('모든 이미지의 개별(고급) 설정을 지우고 위쪽 기본값을 따르도록 되돌립니다. 계속할까요?')) return;
    setItems(prev => prev.map(it => ({ ...it, override: null })));
  }

  function applyLyricAreaHeightToAll() {
    if (items.length === 0) return;
    if (!window.confirm('모든 가사 입력 영역의 개별 높이 설정을 지우고 위쪽 기본값을 따르도록 되돌립니다. 계속할까요?')) return;
    setItems(prev => prev.map(it => it.lyrics ? { ...it, lyrics: { ...it.lyrics, areaHeightRatio: null } } : it));
  }

  function updateItem(id, next) {
    setItems(prev => prev.map(it => it.id === id ? next : it));
  }
  function deleteItem(id) {
    setItems(prev => prev.filter(it => it.id !== id));
    setMergeSelectedIds(prev => {
      if (!prev.has(id)) return prev;
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
  }
  function moveItem(id, dir) {
    setItems(prev => {
      const idx = prev.findIndex(it => it.id === id);
      const next = idx + dir;
      if (next < 0 || next >= prev.length) return prev;
      const copy = [...prev];
      [copy[idx], copy[next]] = [copy[next], copy[idx]];
      return copy;
    });
  }

  async function handleExport() {
    if (items.length === 0) return;
    setExporting(true);
    try {
      // 'auto': use the largest original image's own resolution as the export width, instead of a
      // fixed 1400px that was silently downscaling (blurring) exports whenever a source capture was
      // wider than that — which real screenshots/scans commonly are. Capped by EXPORT_MAX_WIDTH.
      const canvas = await composeScore(items, title, 'auto', {
        titleFontSize, referenceWidth: getReferenceWidth(), imageGap: defaults.imageGap,
        lyricFontSize, lyricLetterSpacing, lyricAreaHeight: defaults.lyricAreaHeight, defaults,
      });
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (title.trim() || 'tab_score') + '.png';
        a.click();
        URL.revokeObjectURL(url);
        setExporting(false);
      });
    } catch (err) {
      console.error(err);
      setExporting(false);
    }
  }

  async function handleExportPaged() {
    if (items.length === 0) return;
    setPagedExporting(true);
    try {
      const { canvases, overflowCount } = await composeScorePages(items, title, {
        titleFontSize, referenceWidth: getReferenceWidth(), imageGap: defaults.imageGap,
        lyricFontSize, lyricLetterSpacing, lyricAreaHeight: defaults.lyricAreaHeight, defaults,
      });
      if (pagedFormat === 'pdf') {
        await exportPagesAsPdf(canvases, title);
      } else {
        await exportPagesAsZip(canvases, title, pagedFormat);
      }
      if (overflowCount > 0) {
        alert('일부 줄(' + overflowCount + '개)이 A4 한 페이지보다 길어서 해당 페이지는 A4 비율보다 길게 내보내졌습니다.');
      }
    } catch (err) {
      console.error(err);
      alert('분할 내보내기에 실패했습니다.');
    } finally {
      setPagedExporting(false);
    }
  }

  async function handleFinalSave() {
    const name = title.trim();
    if (!name) { alert('저장하려면 먼저 제목을 입력해주세요.'); return; }
    try {
      await dbPut(name, { title, items, defaults, titleFontSize, lyricFontSize, lyricLetterSpacing });
      const keys = await dbAllKeys();
      setSavedList(keys.filter(k => k !== DRAFT_KEY));
      setSaveMsg('"' + name + '" 저장됨');
      setTimeout(() => setSaveMsg(''), 2500);
    } catch (e) {
      alert('저장에 실패했습니다 (브라우저 저장소를 사용할 수 없음).');
    }
  }

  async function handleLoad(name) {
    try {
      const data = await dbGet(name);
      if (data) {
        setTitle(data.title || '');
        setItems(data.items || []);
        if (data.defaults) setDefaults({ ...DEFAULTS_INIT, ...data.defaults });
        if (data.titleFontSize) setTitleFontSize(data.titleFontSize);
        if (data.lyricFontSize) setLyricFontSize(data.lyricFontSize);
        if (data.lyricLetterSpacing) setLyricLetterSpacing(data.lyricLetterSpacing);
      }
    } catch (e) {}
  }

  async function handleDeleteSaved(name) {
    if (!window.confirm('"' + name + '" 악보를 삭제할까요?')) return;
    try {
      await dbDelete(name);
      const keys = await dbAllKeys();
      setSavedList(keys.filter(k => k !== DRAFT_KEY));
    } catch (e) {}
  }

  async function handleReset() {
    if (!window.confirm('현재 작업 중인 내용을 모두 지울까요? (저장된 악보 목록은 유지됩니다)')) return;
    setTitle('');
    setItems([]);
    try { await dbDelete(DRAFT_KEY); } catch (e) {}
  }

  return (
    <div className="app">
      <div className="titlebar">
        <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="악보 제목을 입력하세요" />
        <a className="nav-link" href="video-tab-extractor.html">영상에서 추출 →</a>
        <a className="nav-link" href="index.html">코드보 만들기 →</a>
      </div>

      {!noticeDismissed && (
        <div className="notice-banner">
          <div className="notice-text">
            <b>안내:</b> 본 도구는 사용자가 직접 보유한 이미지를 편집·정리하기 위한 <b>개인 연습용 도구</b>입니다.
            모든 데이터는 이 브라우저에만 저장되며 서버로 전송되거나 다른 사용자와 공유되지 않습니다.
            업로드하는 이미지에 대한 저작권 및 이용 책임은 사용자 본인에게 있습니다.
          </div>
          <button className="icon-btn" onClick={dismissNotice}>확인</button>
        </div>
      )}

      <GlobalSettings
        defaults={defaults}
        setDefaults={setDefaults}
        titleFontSize={titleFontSize}
        setTitleFontSize={setTitleFontSize}
        lyricFontSize={lyricFontSize}
        setLyricFontSize={setLyricFontSize}
        lyricLetterSpacing={lyricLetterSpacing}
        setLyricLetterSpacing={setLyricLetterSpacing}
        onApplyAll={applyDefaultsToAll}
        onApplyLyricAreaHeight={applyLyricAreaHeightToAll}
        hasItems={items.length > 0}
      />

      <div className="toolbar">
        <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={handleFiles} style={{ display: 'none' }} />
        <button onClick={() => fileInputRef.current && fileInputRef.current.click()}>TAB 이미지 추가</button>
        <button onClick={handleExport} disabled={items.length === 0 || exporting}>
          {exporting ? '내보내는 중...' : 'PNG로 내보내기'}
        </button>
        <select value={pagedFormat} onChange={e => setPagedFormat(e.target.value)} title="A4 자동 분할 내보내기 형식" disabled={pagedExporting} style={{ width: 'auto' }}>
          <option value="pdf">PDF (여러 페이지)</option>
          <option value="png">PNG (여러 파일, zip)</option>
          <option value="jpeg">JPEG (여러 파일, zip)</option>
        </select>
        <button className="icon-btn" onClick={handleExportPaged} disabled={items.length === 0 || pagedExporting}>
          {pagedExporting ? '분할 내보내는 중...' : 'A4로 분할 저장'}
        </button>
        <button onClick={handleFinalSave} disabled={items.length === 0}>최종 저장</button>
        <button onClick={handleReset} disabled={items.length === 0 && !title}>초기화</button>
        {saveMsg && <span className="save-msg">{saveMsg}</span>}
      </div>

      {items.length >= 2 && !batchPanelOpen && (
        <div className="toolbar">
          <button className="icon-btn" onClick={() => setBatchPanelOpen(true)}>일괄 합치기</button>
        </div>
      )}

      {items.length >= 2 && batchPanelOpen && (
        <div className="merge-panel">
          <div className="toolbar merge-toolbar">
            <span className="slider-label" style={{ margin: 0 }}>이미지</span>
            <input type="number" min="2" max={Math.max(2, items.length)} step="1" value={batchGroupSize}
              style={{ width: '60px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
              onChange={e => setBatchGroupSize(Math.max(2, Number(e.target.value) || 2))} />
            <span className="slider-label" style={{ margin: 0 }}>장씩 순서대로 일괄 합치기</span>
            <button onClick={handleBatchMerge} disabled={batchMerging || merging}>
              {batchMerging ? '일괄 합치는 중...' : '일괄 합치기 진행'}
            </button>
            <button className="icon-btn" onClick={() => setBatchPanelOpen(false)} disabled={batchMerging}>접기</button>
          </div>

          <div className="toolbar">
            <span className="slider-label" style={{ margin: 0 }}>제외할 범위 (선택)</span>
            <input type="number" min="1" max={items.length} placeholder="시작" value={batchExcludeStart}
              style={{ width: '64px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
              onChange={e => setBatchExcludeStart(e.target.value)} />
            <span className="slider-label" style={{ margin: 0 }}>번째 ~</span>
            <input type="number" min="1" max={items.length} placeholder="끝" value={batchExcludeEnd}
              style={{ width: '64px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
              onChange={e => setBatchExcludeEnd(e.target.value)} />
            <span className="slider-label" style={{ margin: 0 }}>번째 (비워두면 전체가 대상)</span>
          </div>

          <div>
            <div className="slider-label">조각 사이 간격 ({mergeGapPct}%, 각 조각 폭 기준 — 음수면 겹쳐서 이어붙임)</div>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <input type="range" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                style={{ flex: 1 }}
                onChange={e => setMergeGapPct(Number(e.target.value))} />
              <input type="number" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                style={{ width: '70px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
                onChange={e => setMergeGapPct(Math.min(MERGE_GAP_MAX_PCT, Math.max(MERGE_GAP_MIN_PCT, Number(e.target.value) || 0)))} />
            </div>
          </div>

          {(batchPreviewSrc || batchPreviewBusy) && (
            <div className="merge-preview">
              <div className="lyric-head-mini">
                <span>대상 앞 2장 미리보기{batchPreviewBusy ? ' (갱신 중...)' : ''} — 겹치는 부분에 마디 내용이 가려지지 않는지 확인하세요</span>
              </div>
              {batchPreviewSrc && <img src={batchPreviewSrc} alt="일괄 합치기 미리보기" className="merge-preview-img" />}
            </div>
          )}
        </div>
      )}

      {savedList.length > 0 && (
        <div className="saved-list">
          <span>저장된 악보:</span>
          {savedList.map(name => (
            <span className="saved-chip" key={name}>
              <button className="icon-btn" onClick={() => handleLoad(name)}>{name}</button>
              <button className="icon-btn" onClick={() => handleDeleteSaved(name)}>삭제</button>
            </span>
          ))}
        </div>
      )}

      {items.length === 0 && (
        <div className="empty">
          위 "기본 설정"에서 배경 제거 강도·가사 글자 크기 등을 먼저 맞춰두면, 추가하는 이미지마다 그 값이 실시간 적용됩니다.<br />
          TAB 캡쳐 이미지를 순서대로 추가하고, 각 이미지 아래에서 가사를 원하는 위치로 끌어다 놓으세요. 작업 내용은 자동으로 임시저장됩니다.
        </div>
      )}

      {mergeSelectedIds.size > 0 && (
        <div className="merge-panel">
          <div className="toolbar merge-toolbar">
            <span className="save-msg">{mergeSelectedIds.size}개 선택됨 (연속된 이미지만 합칠 수 있어요)</span>
            <button onClick={handleMergeSelected} disabled={mergeSelectedIds.size < 2 || merging}>
              {merging ? '합치는 중...' : '선택한 이미지 한 줄로 합치기'}
            </button>
            <button className="icon-btn" onClick={() => setMergeSelectedIds(new Set())} disabled={merging}>선택 해제</button>
          </div>

          <div>
            <div className="slider-label">조각 사이 간격 ({mergeGapPct}%, 각 조각 폭 기준 — 음수면 겹쳐서 이어붙임)</div>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <input type="range" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                style={{ flex: 1 }}
                onChange={e => setMergeGapPct(Number(e.target.value))} />
              <input type="number" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                style={{ width: '70px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
                onChange={e => setMergeGapPct(Math.min(MERGE_GAP_MAX_PCT, Math.max(MERGE_GAP_MIN_PCT, Number(e.target.value) || 0)))} />
            </div>
          </div>

          {(mergePreviewSrc || mergePreviewBusy) && (
            <div className="merge-preview">
              <div className="lyric-head-mini">
                <span>미리보기{mergePreviewBusy ? ' (갱신 중...)' : ''} — 겹치는 부분에 마디 내용이 가려지지 않는지 확인하세요</span>
              </div>
              {mergePreviewSrc && <img src={mergePreviewSrc} alt="합치기 미리보기" className="merge-preview-img" />}
            </div>
          )}
        </div>
      )}

      <div className="list" ref={listRef}>
        {items.map((item, idx) => (
          <ImageBlock key={item.id} item={item} index={idx} total={items.length}
            defaults={defaults}
            lyricFontSize={lyricFontSize}
            lyricLetterSpacing={lyricLetterSpacing}
            defaultLyricAreaHeight={defaults.lyricAreaHeight}
            onChange={next => updateItem(item.id, next)}
            onDelete={() => deleteItem(item.id)}
            onMove={dir => moveItem(item.id, dir)}
            mergeSelected={mergeSelectedIds.has(item.id)}
            onToggleMergeSelect={() => toggleMergeSelect(item.id)}
            nextItemId={items[idx + 1] ? items[idx + 1].id : null} />
        ))}
      </div>

      <FloatingPreview title={title} items={items} titleFontSize={titleFontSize}
        referenceWidth={getReferenceWidth()} imageGap={defaults.imageGap}
        lyricFontSize={lyricFontSize} lyricLetterSpacing={lyricLetterSpacing}
        lyricAreaHeight={defaults.lyricAreaHeight} defaults={defaults} />

      <div className="disclaimer-footer">
        본 도구는 이미지 편집·정리 기능만 제공하는 개인 연습용 소프트웨어이며, 악보나 이미지를 수집·배포하지 않습니다.<br />
        모든 데이터는 사용자의 브라우저에만 저장되고, 업로드·내보내기 하는 콘텐츠의 저작권 준수 책임은 사용자에게 있습니다.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TabScoreBuilder />);
</script>
</body>
</html>
