<!DOCTYPE html>

<style>

  }

    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;

  button:hover{background:var(--accent-bg);}
  button:disabled{opacity:0.4;cursor:default;}
  .icon-btn{padding:6px 8px;font-size:13px;}
  .nav-link{border:1px solid var(--border-strong);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;}

  .save-msg{font-size:13px;color:var(--accent);}

  .empty{
    text-align:center;padding:48px 16px;color:var(--text2);font-size:14px;
    border:1px dashed var(--border-strong);border-radius:12px;line-height:1.6;
  }
  .block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--text2);gap:10px;}
  .block-actions{display:flex;gap:6px;}
  .merge-select-label{display:flex;align-items:center;gap:5px;white-space:nowrap;cursor:pointer;}
  .merge-panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px;}

  .adv-toggle-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text2);gap:8px;}

  .onset-lyric-panel:focus{outline:2px solid var(--accent);outline-offset:2px;}
  .onset-line-input{width:100%;box-sizing:border-box;font-size:13px;padding:6px 8px;border:1px solid var(--border-strong);border-radius:8px;resize:vertical;margin-bottom:8px;font-family:inherit;}
  .onset-syllable-queue{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:8px;}
  .syllable-chip{display:inline-block;padding:2px 7px;border-radius:6px;font-size:13px;background:var(--card);border:1px solid var(--border);color:var(--text2);}

  .onset-wave-canvas{width:100%;display:block;border:1px solid var(--border);border-radius:8px;}

  .lyric-head-mini{

  .lane-wrap{display:flex;flex-direction:column;}
  .lane-ref-strip-standalone{
    width:100%;flex-shrink:0;

  .lyric-lane{
    position:relative;width:100%;min-height:20px;

  .lane-empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:8px;font-size:11.5px;color:var(--text2);line-height:1.5;

  input[type=range]{width:100%;}

  .float-preview{

  .canvas-overlay-wrap{position:relative;}

    position:absolute;top:0;bottom:0;background:rgba(230,60,60,0.28);

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const DB_NAME = 'tab_score_builder_db';
const STORE_NAME = 'scores';
const DRAFT_KEY = '__draft__';
// Same IndexedDB database/store, a separate key — video-tab-extractor.html (a fully independent
// static page) writes a batch of extracted+preprocessed items here right before navigating to this
// page, so the handoff needs no server and no localStorage size risk for many/large frames.
const VIDEO_IMPORT_KEY = '__video_import__';
// One entry per video-extraction session (written once by video-tab-extractor.html, keyed by the
// videoSourceId every item from that session carries): { videoBlob, onsets, savedAt }. Read here to
// drive the syllable-onset-snap lyric placement mode's mini waveform + playback.
const VIDEO_SOURCE_KEY_PREFIX = '__video_source__';

const DEFAULTS_INIT = {
  removeBg: true,
  invertMode: 'auto',
  threshold: 140,
  softness: 18,
  despeckle: true,
  despeckleSize: 3,
  playheadRemove: false,
  playheadColor: null,
  cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
  imageGap: 18,
  lyricFontSize: 26,
  lyricAreaHeight: 90,
};

function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(STORE_NAME)) {
        req.result.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbAllKeys() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAllKeys();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

// Same-axis floor: top+bottom (and left+right) may never eat more than 100-this, guaranteeing at
// least CROP_MIN_REMAIN_PCT of the image survives along that axis. This is the ONLY limit on either
// side individually — there is deliberately no separate flat per-side cap, since real content is
// often lopsided (e.g. only the bottom 15% of a capture), and a flat cap on one side would prevent an
// asymmetric crop like top=80%/bottom=2% just as much as it prevents a runaway top=98%/bottom=98%.
const CROP_MIN_REMAIN_PCT = 10;
// The most any single side could ever take, i.e. when its sibling is 0 — used only to size the UI
// slider's track; the real ceiling for a given slider is always (100 - CROP_MIN_REMAIN_PCT - sibling).
const CROP_MAX_PCT = 100 - CROP_MIN_REMAIN_PCT;

function clampPct(v) { return Math.min(100, Math.max(0, v || 0)); }

// Clamps a same-axis crop pair (top/bottom or left/right) so their sum never exceeds
// 100 - CROP_MIN_REMAIN_PCT, WITHOUT forcing the pair toward any particular balance — an already
// asymmetric pair (e.g. 80/2) that fits under the sum cap passes through completely untouched, and
// only a pair that together exceeds the cap gets scaled down (preserving its ratio, so it stays just
// as asymmetric, only smaller). Applied both when the user drags a slider (via clampCropSlider below)
// and again here at crop-compute time, so even a saved draft with an old/unsafe combination can't
// collapse an image to nothing.
function clampCropPair(a, b) {
  a = clampPct(a); b = clampPct(b);
  const maxSum = 100 - CROP_MIN_REMAIN_PCT;
  if (a + b > maxSum) {
    const ratio = maxSum / (a + b);
    a = Math.floor(a * ratio);
    b = Math.floor(b * ratio);
  }
  return [a, b];
}

// Clamps the value a single crop slider may take given its sibling's CURRENT value — the sibling
// itself is never touched here, so this can only ever restrict THIS slider, never silently move the
// other one. The allowed ceiling is purely "however much room the sibling hasn't already used" (up to
// 100 - CROP_MIN_REMAIN_PCT), so a near-zero sibling lets this slider run all the way up near that cap.
function clampCropSlider(value, otherValue) {
  const maxAllowed = Math.max(0, (100 - CROP_MIN_REMAIN_PCT) - clampPct(otherValue));
  return Math.min(maxAllowed, Math.max(0, value || 0));
}

// Slider `max` attribute for one side, given its sibling's current value — kept in sync with
// clampCropSlider's real ceiling so the native slider's track always matches what's actually reachable.
function cropSliderMax(otherValue) {
  return Math.max(0, (100 - CROP_MIN_REMAIN_PCT) - clampPct(otherValue));
}

function sampleAvgLuminance(img) {
  const c = document.createElement('canvas');
  const w = 60;
  const h = Math.max(1, Math.round((60 * img.naturalHeight) / img.naturalWidth));
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let sum = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    n++;
  }
  return sum / n;
}

function smoothstep(edge0, edge1, x) {
  if (edge0 === edge1) return x < edge0 ? 0 : 1;
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function applyThreshold(imageData, threshold, invert, softness) {
  const d = imageData.data;
  const lo = threshold - softness;
  const hi = threshold + softness;
  for (let i = 0; i < d.length; i += 4) {
    const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const t = smoothstep(lo, hi, lum);
    const v = invert ? 255 * (1 - t) : 255 * t;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
}

function despeckleBinary(imageData, w, h, maxArea) {
  if (!maxArea || maxArea <= 0) return;
  const data = imageData.data;
  const total = w * h;
  const visited = new Uint8Array(total);
  const stack = new Int32Array(total);
  const isInk = (idx) => data[idx*4] < 128;
  for (let start = 0; start < total; start++) {
    if (visited[start] || !isInk(start)) continue;
    let sp = 0;
    stack[sp++] = start; visited[start] = 1;
    let head = 0;
    while (head < sp) {
      const p = stack[head++];
      const x = p % w, y = (p - x) / w | 0;
      if (x > 0) { const n = p-1; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (x < w-1) { const n = p+1; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (y > 0) { const n = p-w; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (y < h-1) { const n = p+w; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
    }
    if (sp <= maxArea) {
      for (let k = 0; k < sp; k++) {
        const idx = stack[k] * 4;
        data[idx]=255; data[idx+1]=255; data[idx+2]=255;
      }
    }
  }
}

// ---- playhead removal (color + shape based, always previewed/reversible) ----
const PLAYHEAD_HUE_DEFAULT = 210;        // blue/cyan estimate, degrees — only used until the user eyedropper-picks a real color
const PLAYHEAD_HUE_TOLERANCE_DEFAULT = 35;
const PLAYHEAD_SAT_MIN_DEFAULT = 0.35;

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  return { h, s, v: max };
}

function sampleColorAtPoint(imageData, w, h, xPx, yPx) {
  const x = Math.min(w - 1, Math.max(0, Math.round(xPx)));
  const y = Math.min(h - 1, Math.max(0, Math.round(yPx)));
  const i = (y * w + x) * 4;
  const d = imageData.data;
  const { h: hue, s: sat } = rgbToHsv(d[i], d[i + 1], d[i + 2]);
  return { hue, sat };
}

function hueDist(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

// columnwise scan; a column matches if the isMatchFn-passing pixel fraction exceeds minRunRatio;
// adjacent matching columns are merged into runs (capped at maxRunWidthPx to avoid wide false positives)
function scanVerticalRuns(imageData, w, h, isMatchFn, minRunRatio, maxRunWidthPx) {
  const d = imageData.data;
  const colMatch = new Uint8Array(w);
  for (let x = 0; x < w; x++) {
    let hits = 0;
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      if (isMatchFn(d[i], d[i + 1], d[i + 2])) hits++;
    }
    colMatch[x] = (hits / h) >= minRunRatio ? 1 : 0;
  }
  const runs = [];
  let x = 0;
  while (x < w) {
    if (!colMatch[x]) { x++; continue; }
    const startX = x;
    while (x < w && colMatch[x]) x++;
    const endX = x;
    if (!maxRunWidthPx || (endX - startX) <= maxRunWidthPx) {
      runs.push({ startX, endX, centerXPct: ((startX + endX) / 2 / w) * 100 });
    }
  }
  return runs;
}

function detectPlayheadRuns(imageData, w, h, colorBand) {
  const band = colorBand || { hue: PLAYHEAD_HUE_DEFAULT, hueTolerance: PLAYHEAD_HUE_TOLERANCE_DEFAULT, satMin: PLAYHEAD_SAT_MIN_DEFAULT };
  const isMatch = (r, g, b) => {
    const { h: hue, s: sat } = rgbToHsv(r, g, b);
    return sat >= band.satMin && hueDist(hue, band.hue) <= band.hueTolerance;
  };
  const runs = scanVerticalRuns(imageData, w, h, isMatch, 0.6, 14);
  return runs.map(r => ({ ...r, key: Math.round(r.centerXPct * 2) / 2 }));
}

function removePlayheadRuns(imageData, w, h, runs, excludedKeys, fillColor) {
  const fill = fillColor || { r: 255, g: 255, b: 255 };
  const excluded = new Set(excludedKeys || []);
  const d = imageData.data;
  for (const run of runs) {
    if (excluded.has(run.key)) continue;
    const x0 = Math.max(0, run.startX - 1), x1 = Math.min(w, run.endX + 1);
    for (let y = 0; y < h; y++) {
      for (let x = x0; x < x1; x++) {
        const i = (y * w + x) * 4;
        d[i] = fill.r; d[i + 1] = fill.g; d[i + 2] = fill.b; d[i + 3] = 255;
      }
    }
  }
}

// ---- bar-line pixel detection (feature 3) — suggestion only, never auto-applied ----
function detectBarLinesByPixels(imageData, w, h) {
  const isMatch = (r, g, b) => (0.299 * r + 0.587 * g + 0.114 * b) < 100;
  const runs = scanVerticalRuns(imageData, w, h, isMatch, 0.85, 6);
  return runs.map(r => r.centerXPct);
}


// ---- TAB staff-band auto-detection ----
// Finds the actual Y-range (and, best-effort, X-range) of the 6 horizontal TAB staff lines,
// regardless of how much album art / playback-UI chrome surrounds them or how the capture was
// cropped — so overlap detection and bar-number OCR can compare/scan the part of the image that's
// actually stable across captures of the same content, instead of a fixed top-% guess.
//
// A row-width-percentage test (the original approach) assumes a clean single-page scan where the
// staff spans most of the image width. Verified against real screen-recording captures (a TAB
// playback app filmed/recorded, with a video feed and other chrome around it) that this fails
// completely: the real staff lines there covered as little as ~8-18% of the full image width, so
// no row ever crossed a 55% threshold and detection silently returned null every time.
// Also verified that recorded/compressed captures render staff lines much fainter than the shared
// 140 ink threshold used elsewhere (for background-removal etc.) — down to luminance ~185-230
// against a ~244 background, well above 140 — and that the true line position can visibly drift a
// few pixels vertically across its width (capture/encoding artifact), which breaks any detector
// that only looks at one exact row.
const STAFF_LINE_LUM_THRESHOLD = 235;   // lenient vs. the shared 140 — tuned against real faint captures
const STAFF_WOBBLE_BAND_PX = 4;         // absorbs the line's vertical drift across its width
const STAFF_GAP_TOLERANCE_PX = 20;      // bridges small interruptions (numbers, anti-aliasing, compression)
const STAFF_MIN_SPAN_FRACTION = 0.3;    // a real staff line still needs to cover a decent share of the width...
const STAFF_MIN_SPAN_FLOOR_PX = 90;     // ...but never require more than this in absolute px (tunable)
const STAFF_MAX_GROUP_THICKNESS = STAFF_WOBBLE_BAND_PX * 2 + 6; // a real line stays this thin even with wobble absorbed
const STAFF_GAP_Y_TOLERANCE = 0.25;     // relative tolerance for "nearly evenly spaced" lines
const STAFF_MIN_X_OVERLAP_FRACTION = 0.6; // the 6 lines must share roughly this much of their x-range

function detectStaffBand(imageData, w, h) {
  const d = imageData.data;
  const isDark = new Uint8Array(w * h);
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      isDark[y * w + x] = lum < STAFF_LINE_LUM_THRESHOLD ? 1 : 0;
    }
  }
  const minSpan = Math.max(STAFF_MIN_SPAN_FLOOR_PX, w * STAFF_MIN_SPAN_FRACTION);

  // For each row, OR together a small vertical band around it (absorbs wobble), then find the
  // longest run of ink in that combined row allowing small gaps (bridges interruptions) — this is
  // "does a staff line's worth of ink live near this row", not "what % of the row is dark".
  const rowLeft = new Int32Array(h).fill(-1);
  const rowRight = new Int32Array(h).fill(-1);
  const rowLen = new Int32Array(h);
  const bandOr = new Uint8Array(w);
  for (let y = 0; y < h; y++) {
    const lo = Math.max(0, y - STAFF_WOBBLE_BAND_PX), hi = Math.min(h - 1, y + STAFF_WOBBLE_BAND_PX);
    bandOr.fill(0);
    for (let yy = lo; yy <= hi; yy++) {
      const rowOff = yy * w;
      for (let x = 0; x < w; x++) if (isDark[rowOff + x]) bandOr[x] = 1;
    }
    let bestStart = -1, bestEnd = -1, bestLen = 0;
    let x = 0;
    while (x < w) {
      if (!bandOr[x]) { x++; continue; }
      const start = x;
      let gap = 0, xe = x;
      while (xe < w) {
        if (bandOr[xe]) { gap = 0; xe++; }
        else { gap++; if (gap > STAFF_GAP_TOLERANCE_PX) break; xe++; }
      }
      let end = xe;
      while (end > start && !bandOr[end - 1]) end--;
      if (end - start > bestLen) { bestLen = end - start; bestStart = start; bestEnd = end; }
      x = xe;
    }
    if (bestLen >= minSpan) { rowLeft[y] = bestStart; rowRight[y] = bestEnd; rowLen[y] = bestLen; }
  }

  // group consecutive passing rows into line candidates; reject blobs too thick to be a real line
  const groups = [];
  let y = 0;
  while (y < h) {
    if (rowLen[y] === 0) { y++; continue; }
    const start = y;
    while (y < h && rowLen[y] > 0) y++;
    const end = y;
    if (end - start > STAFF_MAX_GROUP_THICKNESS) continue;
    let peakY = start;
    for (let yy = start + 1; yy < end; yy++) if (rowLen[yy] > rowLen[peakY]) peakY = yy;
    groups.push({ y: (start + end - 1) / 2, left: rowLeft[peakY], right: rowRight[peakY] });
  }
  if (groups.length < 6) return null;

  let best = null;
  for (let i = 0; i < groups.length; i++) {
    for (let j = i + 1; j < groups.length; j++) {
      const gap = groups[j].y - groups[i].y;
      if (gap <= 0) continue;
      const chain = [groups[i]];
      let ok = true;
      for (let k = 1; k < 6; k++) {
        const target = groups[i].y + gap * k;
        let closest = null, closestDiff = Infinity;
        for (const g of groups) {
          const diff = Math.abs(g.y - target);
          if (diff < closestDiff) { closestDiff = diff; closest = g; }
        }
        if (closest === null || closestDiff > gap * STAFF_GAP_Y_TOLERANCE) { ok = false; break; }
        chain.push(closest);
      }
      if (!ok || chain.length !== 6) continue;

      // the 6 lines should share roughly the same x-range (they're parallel rules of one staff) —
      // this is what tells a real staff apart from 6 coincidentally evenly-spaced but unrelated
      // horizontal streaks scattered around the image
      const lefts = chain.map(c => c.left), rights = chain.map(c => c.right);
      const overlapLeft = Math.max(...lefts), overlapRight = Math.min(...rights);
      const avgSpan = chain.reduce((s, c) => s + (c.right - c.left), 0) / 6;
      if (avgSpan <= 0 || (overlapRight - overlapLeft) < avgSpan * STAFF_MIN_X_OVERLAP_FRACTION) continue;

      const gaps = [];
      for (let k = 1; k < 6; k++) gaps.push(chain[k].y - chain[k - 1].y);
      const meanGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      const variance = gaps.reduce((a, b) => a + (b - meanGap) * (b - meanGap), 0) / gaps.length;
      const confidence = 1 / (1 + variance);
      if (!best || confidence > best.confidence) {
        best = {
          staffTop: chain[0].y, staffBottom: chain[5].y,
          staffLeft: overlapLeft, staffRight: overlapRight,
          lineYs: chain.map(c => c.y), confidence,
        };
      }
    }
  }
  return best;
}

// ---- bar-slice regrouping ("한 줄에 몇 마디") ----
async function rebuildBarsPerRow(img, sortedMarkersXPct, barsPerRow) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const boundaries = [0, ...sortedMarkersXPct, 100].filter((v, i, arr) => arr.indexOf(v) === i).sort((a, b) => a - b);
  const slices = [];
  for (let i = 0; i < boundaries.length - 1; i++) {
    const sx = Math.round((boundaries[i] / 100) * W);
    const sw = Math.max(1, Math.round(((boundaries[i + 1] - boundaries[i]) / 100) * W));
    slices.push({ sx, sw });
  }
  const rows = [];
  for (let i = 0; i < slices.length; i += barsPerRow) rows.push(slices.slice(i, i + barsPerRow));
  const rowWidths = rows.map(row => row.reduce((s, sl) => s + sl.sw, 0));
  const outW = Math.max(1, ...rowWidths);
  const outH = H * rows.length;

  const canvas = document.createElement('canvas');
  canvas.width = outW; canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, outW, outH);
  rows.forEach((row, rowIdx) => {
    let x = 0;
    for (const sl of row) {
      ctx.drawImage(img, sl.sx, 0, sl.sw, H, x, rowIdx * H, sl.sw, H);
      x += sl.sw;
    }
  });
  return canvas;
}

function resolvedSrc(item) {
  return (item.barLayout && item.barLayout.appliedSrc) || item.src;
}

function drawProcessed(canvas, img, s) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const [cropTop, cropBottom] = clampCropPair(s.cropTop, s.cropBottom);
  const [cropLeft, cropRight] = clampCropPair(s.cropLeft, s.cropRight);
  const sx = Math.floor(W * cropLeft / 100);
  const sy = Math.floor(H * cropTop / 100);
  const sw = Math.max(1, Math.floor(W * (100 - cropLeft - cropRight) / 100));
  const sh = Math.max(1, Math.floor(H * (100 - cropTop - cropBottom) / 100));
  canvas.width = sw; canvas.height = sh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  let playheadRuns = [];
  if (s.playheadRemove) {
    const imageData = ctx.getImageData(0, 0, sw, sh);
    playheadRuns = detectPlayheadRuns(imageData, sw, sh, s.playheadColor);
    const excluded = s.playheadExcluded || [];
    removePlayheadRuns(imageData, sw, sh, playheadRuns, excluded, { r: 255, g: 255, b: 255 });
    ctx.putImageData(imageData, 0, 0);
  }
  if (s.removeBg) {
    const imageData = ctx.getImageData(0, 0, sw, sh);
    applyThreshold(imageData, s.threshold, s.invert, s.softness || 0);
    if (s.despeckle) despeckleBinary(imageData, sw, sh, s.despeckleSize || 0);
    ctx.putImageData(imageData, 0, 0);
  }
  return { playheadRuns };
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function effectiveImageSettings(item, defaults) {
  const o = item.override;
  const playheadExcluded = item.playheadExcluded || [];
  if (o) {
    return {
      removeBg: o.removeBg, invert: o.invert,
      threshold: o.threshold, softness: o.softness,
      despeckle: o.despeckle, despeckleSize: o.despeckleSize,
      playheadRemove: o.playheadRemove, playheadColor: o.playheadColor, playheadExcluded,
      cropTop: o.cropTop, cropBottom: o.cropBottom, cropLeft: o.cropLeft, cropRight: o.cropRight,
    };
  }
  return {
    removeBg: defaults.removeBg,
    invert: item.invert,
    threshold: defaults.threshold,
    softness: defaults.softness,
    despeckle: defaults.despeckle,
    despeckleSize: defaults.despeckleSize,
    playheadRemove: defaults.playheadRemove, playheadColor: defaults.playheadColor, playheadExcluded,
    cropTop: defaults.cropTop, cropBottom: defaults.cropBottom,
    cropLeft: defaults.cropLeft, cropRight: defaults.cropRight,
  };
}

// ---- merge already-processed images into one side-by-side row ----
// This takes items that are already fully processed (background removed, cropped, etc. — each
// already rendered once via drawProcessed) and whose content does NOT overlap at all (different
// bars), and simply places them next to each other to build one multi-bar row out of several
// narrow single/two-bar captures. No overlap search of any kind is used here.

// A neutral per-item override: crop 0 on all sides, every cleanup step off. Applied to the merged
// result so it is never reprocessed — the merge draws from each source's ALREADY-drawProcessed pixels,
// so re-running background removal/despeckle on top (e.g. via inherited global defaults) could alter
// pixels the user already dialed in per-source-image, or double-threshold an already-binary image.
const MERGED_ROW_NEUTRAL_OVERRIDE = {
  removeBg: false, invert: false, threshold: 140, softness: 0,
  despeckle: false, despeckleSize: 0,
  playheadRemove: false, playheadColor: null,
  cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
};

// Merges `sourceItems` (already in the order they should appear left-to-right) into one canvas plus
// a remapped lyric-tag list. Each source's staff-line spacing (detectStaffBand) is measured on its own
// drawProcessed output; every image is uniformly scaled (never stretched) to match the spacing of the
// first source where a staff was actually detected, and then vertically shifted so the staffs line up
// — otherwise two captures at slightly different zoom/DPI would merge into a row with jagged staff
// lines. Returns null-safe metadata (`anyStaffMissing`) so the caller can warn without failing.
// Range for the inter-piece gap slider, as a % of the pieces' own (post-scale) width — negative
// overlaps adjacent pieces to eat the padding many captures already have baked into their edges;
// positive adds extra space. Capped well short of ±100% since either extreme would either overlap
// past all the actual bar content or leave a visibly broken-looking gap.
const MERGE_GAP_MIN_PCT = -10;
const MERGE_GAP_MAX_PCT = 5;

// Computes each piece's draw x-position (and the resulting total width) given a uniform gapPct
// applied at every seam. Each piece's `.w`/`.contentRight` here are already POST-TRIM (see
// mergeImagesIntoRow below — a piece's own blank lead-in margin, if any, is cropped away entirely
// before it ever reaches this function), so a piece's own local x=0 always means "where its content
// starts" and `.contentRight` means "how far its content extends from there". At gapPct=0 a seam
// lands exactly where the previous piece's content ends and the next piece's content begins — no
// visible gap, and nothing left to accidentally paint a margin over the previous piece's content with.
// Negative gapPct then intentionally overlaps CONTENT with content (by that literal percentage of the
// two pieces' average content width), never margin-over-content, since margin was never drawn at all.
// Shared by the final merge draw and the live preview so both always agree pixel-for-pixel.
function computeMergeSeamPositions(pieces, gapPct) {
  const xs = [];
  let x = 0;
  for (let i = 0; i < pieces.length; i++) {
    if (i > 0) {
      const prev = pieces[i - 1], cur = pieces[i];
      const refW = (prev.contentRight + cur.contentRight) / 2;
      x = (xs[i - 1] + prev.contentRight) + Math.round((gapPct / 100) * refW);
    }
    xs.push(x);
    x += pieces[i].w;
  }
  return { xs, totalW: x };
}

async function mergeImagesIntoRow(sourceItems, defaults, gapPct) {
  gapPct = gapPct || 0;
  const processed = [];
  for (const it of sourceItems) {
    const img = await loadImage(resolvedSrc(it));
    const canvas = document.createElement('canvas');
    drawProcessed(canvas, img, effectiveImageSettings(it, defaults));
    const imageData = canvas.getContext('2d').getImageData(0, 0, canvas.width, canvas.height);
    const staff = detectStaffBand(imageData, canvas.width, canvas.height);
    processed.push({ item: it, canvas, staff });
  }

  const ref = processed.find(p => p.staff);
  const refSpacing = ref ? (ref.staff.staffBottom - ref.staff.staffTop) / 5 : null;

  const scaled = processed.map(p => {
    let scale = 1;
    if (refSpacing && p.staff) {
      const spacing = (p.staff.staffBottom - p.staff.staffTop) / 5;
      if (spacing > 0) scale = refSpacing / spacing;
    }
    const w = Math.max(1, Math.round(p.canvas.width * scale));
    const h = Math.max(1, Math.round(p.canvas.height * scale));
    const staffTopScaled = p.staff ? p.staff.staffTop * scale : null;
    // The staff line span, not raw ink, is what marks real bar content — detectStaffBand already
    // requires 6 evenly-spaced unbroken lines to match, which decorative shading/watermarks/chord
    // boxes (common in YouTube captures) don't produce, so this stays reliable where a naive
    // ink-density scan would mistake those for content. staffLeftNative stays in the ORIGINAL
    // (pre-scale) canvas's own pixel coordinates since that's what the drawImage source rect below
    // needs; contentLeft/contentRight are the scaled equivalents used for seam layout math.
    const staffLeftNative = p.staff ? p.staff.staffLeft : null;
    const contentLeft = p.staff ? p.staff.staffLeft * scale : null;
    const contentRight = p.staff ? p.staff.staffRight * scale : null;
    return { item: p.item, canvas: p.canvas, w, h, staffTopScaled, staffLeftNative, contentLeft, contentRight };
  });

  // Shift each image down so every (scaled) staff top lands on the same y — images with no detected
  // staff are simply top-aligned (offsetY 0), since there's nothing to align them to.
  const knownTops = scaled.map(s => s.staffTopScaled).filter(v => v != null);
  const refTop = knownTops.length ? Math.max(...knownTops) : 0;
  const withOffsets = scaled.map(s => ({
    ...s, offsetY: s.staffTopScaled != null ? Math.round(refTop - s.staffTopScaled) : 0,
  }));

  // Crop away every non-first piece's own blank lead-in margin (from its left edge to its detected
  // content start) BEFORE it's ever composited — this is what guarantees that margin can never be
  // drawn on top of the previous piece's real content, no matter how wide it is or how much overlap
  // the user dials in. The first piece keeps its own leading margin (nothing precedes it to protect).
  // Falls back to "no trim, content-right = full width" whenever staff detection failed for a piece,
  // reproducing the old plain edge-to-edge behavior for exactly that piece.
  const trimmed = withOffsets.map((s, i) => {
    const trimNative = (i > 0 && s.staffLeftNative != null) ? s.staffLeftNative : 0;
    const trimScaled = (i > 0 && s.contentLeft != null) ? s.contentLeft : 0;
    const w = s.w - trimScaled;
    const contentRight = s.contentRight != null ? (s.contentRight - trimScaled) : w;
    return { ...s, fullW: s.w, w, contentRight, trimNative, trimScaled };
  });

  const { xs, totalW: seamTotalW } = computeMergeSeamPositions(trimmed, gapPct);
  const totalW = Math.max(1, seamTotalW);
  const totalH = Math.max(...trimmed.map(s => s.offsetY + s.h));

  const out = document.createElement('canvas');
  out.width = totalW;
  out.height = Math.max(1, totalH);
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);

  const mergedTags = [];
  trimmed.forEach((s, i) => {
    const x = xs[i];
    const srcW = s.canvas.width - s.trimNative;
    ctx.drawImage(s.canvas, s.trimNative, 0, srcW, s.canvas.height, x, s.offsetY, s.w, s.h);
    // Lyric tag xPct is "% across this item's own ORIGINAL (pre-trim) image width" — remap through
    // where that original image's x=0 would fall in the merged canvas (conceptually, even though the
    // cropped-away margin portion of it, if any, is never actually drawn there). yPct is "% down the
    // lyric lane" (a UI concept shared by whichever single item owns the lane), not tied to image
    // width, so it carries over unchanged.
    const conceptualFullX = x - s.trimScaled;
    const tags = (s.item.lyrics && s.item.lyrics.tags) || [];
    for (const t of tags) {
      const localXPx = (t.xPct / 100) * s.fullW;
      const globalXPct = ((conceptualFullX + localXPx) / totalW) * 100;
      mergedTags.push({ ...t, id: Date.now() + '_' + Math.random().toString(36).slice(2), xPct: globalXPct });
    }
  });

  const areaHeightRatios = sourceItems
    .map(it => (it.lyrics && it.lyrics.areaHeightRatio) || 0)
    .filter(v => v > 0);
  const areaHeightRatio = areaHeightRatios.length ? Math.max(...areaHeightRatios) : null;

  // 0-based indices (within sourceItems) whose staff detection failed — these pieces got NEITHER
  // the scale correction NOR the content-boundary trim/overlap (both derive from the same
  // detectStaffBand result), and silently fell back to plain edge-to-edge concatenation at their
  // own native scale. Returned so the caller can tell the user exactly which pieces this happened
  // to, instead of a single generic flag that only mentions the scale side of it.
  const missingStaffIndices = processed.map((p, i) => (p.staff ? null : i)).filter(i => i !== null);

  return {
    canvas: out,
    lyrics: { tags: mergedTags, areaHeightRatio },
    anyStaffMissing: missingStaffIndices.length > 0,
    missingStaffIndices,
  };
}

// Left-aligns a too-short trailing batch-merge row's already-merged canvas onto a wider blank canvas
// matching the other rows' width — content stays at its own natural scale (no stretching/zooming;
// that was tried and rejected, since scaling up made the last row's text/numbers visibly larger than
// every other row instead of matching them) and any leftover width is plain white space on the right.
// A no-op (returns the original canvas) if it's already at least as wide as targetWidth.
function padCanvasRightTo(canvas, targetWidth) {
  if (canvas.width >= targetWidth) return canvas;
  const out = document.createElement('canvas');
  out.width = targetWidth; out.height = canvas.height;
  const ctx = out.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, out.width, out.height);
  ctx.drawImage(canvas, 0, 0);
  return out;
}

// Safety cap for 'auto'-width export: without one, stitching several very large originals could
// produce a canvas wide/tall enough to freeze the browser or take a very long time to render/encode.
const EXPORT_MAX_WIDTH = 4500;

// Shared by composeScore (single-canvas export/preview) and composeScorePages (A4-split export) —
// decodes + measures everything once, so page-break math can reuse the exact same per-item heights
// the single-canvas renderer uses, instead of re-deriving them.
async function buildScoreLayout(items, title, targetW, opts) {
  opts = opts || {};
  const defaults = opts.defaults || {};

  // First pass: decode + process each item at its own NATIVE (post-crop) resolution — this is also
  // where we learn each item's actual width, needed below when targetW is 'auto'.
  const rawProcessed = [];
  for (const it of items) {
    const img = await loadImage(resolvedSrc(it));
    const off = document.createElement('canvas');
    drawProcessed(off, img, effectiveImageSettings(it, defaults));
    rawProcessed.push({ item: it, canvas: off });
  }

  // targetW === 'auto' (used for the real export) picks the largest original's own resolution as the
  // canvas width, instead of a fixed value smaller than most real captures — which was silently
  // downscaling (blurring) every export regardless of how high-res the source images actually were.
  // A plain number (used for the small live preview) is kept as an explicit fixed width, unchanged.
  let W = targetW;
  if (W === 'auto' || W == null) {
    const maxNaturalWidth = rawProcessed.reduce((m, p) => Math.max(m, p.canvas.width), 1);
    W = Math.min(maxNaturalWidth, EXPORT_MAX_WIDTH);
  }

  const scale = W / (opts.referenceWidth || 780);
  const PAD = Math.round(50 * scale);
  const titleH = Math.round(90 * scale);
  const gapAfterImage = Math.round((opts.imageGap != null ? opts.imageGap : 18) * scale);
  const titleFontPx = Math.max(10, Math.round((opts.titleFontSize || 44) * scale));
  const titleFont = 'bold ' + titleFontPx + 'px serif';
  const lyricFontPx = Math.max(8, Math.round((opts.lyricFontSize || 26) * scale));
  const lyricFont = lyricFontPx + 'px Georgia, "Noto Serif KR", serif';
  const lyricLineH = Math.round(lyricFontPx * 1.3);
  // Scales with resolution the same way lyricFontPx does, so letter-spacing stays visually
  // proportional at any export size instead of looking wider/narrower relative to the text at
  // different resolutions.
  const lyricLetterSpacingPx = (opts.lyricLetterSpacing || 0) * scale;
  const defaultLyricRatio = (opts.lyricAreaHeight != null ? opts.lyricAreaHeight : 90) / (opts.referenceWidth || 780);

  const processed = rawProcessed.map(({ item: it, canvas: off }) => {
    const scaledH = Math.round(off.height * W / off.width);
    const tags = ((it.lyrics && it.lyrics.tags) || []).filter(t => (t.text || '').trim() !== '');
    const ratio = (it.lyrics && it.lyrics.areaHeightRatio != null) ? it.lyrics.areaHeightRatio : defaultLyricRatio;
    const laneH = tags.length > 0 ? Math.max(lyricLineH, Math.round(ratio * W)) : 0;
    return { canvas: off, scaledH, tags, laneH, groupH: scaledH + laneH };
  });

  let totalH = PAD + titleH;
  for (const p of processed) totalH += p.groupH + gapAfterImage;
  totalH += PAD;

  return {
    W, PAD, titleH, gapAfterImage, titleFont, titleFontPx, lyricFont, lyricFontPx, lyricLineH,
    lyricLetterSpacingPx, processed, totalH: Math.max(Math.round(totalH), titleH + PAD * 2),
  };
}

// Canvas fillText has no letter-spacing support portable across browsers, so a nonzero spacing draws
// the string one character at a time, advancing by each glyph's measured width plus the spacing —
// zero spacing falls back to a single fillText call, identical to the previous behavior/positioning.
// Only textAlign 'left' is needed here (lyric tags are always left-aligned), so that's all this supports.
function fillTextWithSpacing(ctx, text, x, y, spacing) {
  if (!spacing) { ctx.fillText(text, x, y); return; }
  let cx = x;
  for (const ch of text) {
    ctx.fillText(ch, cx, y);
    cx += ctx.measureText(ch).width + spacing;
  }
}

function drawScoreTitleCustom(ctx, W, title, titleFont, titleH, y) {
  ctx.fillStyle = '#1a1a1a';
  ctx.textAlign = 'center';
  ctx.font = titleFont;
  ctx.fillText(title.trim() || '제목 없음', W / 2, y + Math.round(titleH * 0.55));
}

function drawScoreTitle(ctx, W, title, layout, y) {
  drawScoreTitleCustom(ctx, W, title, layout.titleFont, layout.titleH, y);
}

// Draws one item's image + (optional) lyric lane at y, returns the y position right after it
// (caller adds the page's gap) — this is the single unbreakable unit a page break may never cut
// through. `scale` (default 1) uniformly shrinks the image + lyric text/lane for THIS page only
// (step-2 "A" fallback below) — the image is centered so the shrink reads as a print margin, not a
// left-aligned resize.
function drawScoreItem(ctx, W, p, y, layout, scale) {
  scale = scale || 1;
  const dw = Math.round(W * scale);
  const dx = Math.round((W - dw) / 2);
  const dh = Math.round(p.scaledH * scale);
  ctx.textAlign = 'left';
  ctx.drawImage(p.canvas, dx, y, dw, dh);
  y += dh;
  if (p.tags.length > 0) {
    const lyricFontPx = Math.max(8, Math.round(layout.lyricFontPx * scale));
    const lyricFont = lyricFontPx + 'px Georgia, "Noto Serif KR", serif';
    const lyricLineH = Math.round(layout.lyricLineH * scale);
    const lyricLetterSpacingPx = layout.lyricLetterSpacingPx * scale;
    const laneH = Math.round(p.laneH * scale);
    ctx.font = lyricFont;
    ctx.fillStyle = '#1a1a1a';
    ctx.textBaseline = 'middle';
    for (const t of p.tags) {
      const tx = Math.min(W - 4, Math.max(4, (t.xPct / 100) * W));
      const half = lyricLineH / 2;
      const cy = y + Math.min(laneH - half, Math.max(half, (t.yPct / 100) * laneH));
      fillTextWithSpacing(ctx, t.text, tx, cy, lyricLetterSpacingPx);
    }
    ctx.textBaseline = 'alphabetic';
    y += laneH;
  }
  return y;
}

async function composeScore(items, title, targetW, opts) {
  const layout = await buildScoreLayout(items, title, targetW, opts);
  const canvas = document.createElement('canvas');
  canvas.width = layout.W; canvas.height = layout.totalH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = layout.PAD;
  drawScoreTitle(ctx, layout.W, title, layout, y);
  y += layout.titleH;

  for (const p of layout.processed) {
    y = drawScoreItem(ctx, layout.W, p, y, layout);
    y += layout.gapAfterImage;
  }
  return canvas;
}

// A4 height:width ratio (sqrt(2)) — each split page targets this proportion at the export's own
// (resolution-preserving) width, so pages look like real A4 sheets regardless of source resolution.
const A4_HEIGHT_RATIO = 1.41421356;

// Step 1: the title-only page's header (top margin + title box) is noticeably roomier than it needs
// to be, which was the main reason a page-1 export left a big trailing gap — shrink it toward this
// ratio, but never past a floor that still leaves the title legible and lightly padded.
const PAGE1_HEADER_SHRINK = 0.75;
// Step 2B floor: a page may narrow its own image-to-image gaps to reclaim room for one more line,
// but never past half the normal gap (avoids a cramped, dida-dida look).
const PAGE_GAP_MIN_RATIO = 0.5;
// Step 2A floor: a page may shrink its whole content (images + text) to pull in one more line, but
// never by more than 5% — beyond that the size difference between pages would become noticeable.
const PAGE_SCALE_MIN = 0.95;

function computePagedTitleMetrics(layout) {
  const headerFull = layout.PAD + layout.titleH;
  // Floor: enough room for the title glyphs themselves (titleFontPx) plus a little breathing room,
  // plus a reduced-but-nonzero top margin — this is the "최소 여백" the shrink may never go below.
  const floor = Math.round(layout.titleFontPx * 1.8 + layout.PAD * 0.5);
  const headerH = Math.max(floor, Math.round(headerFull * PAGE1_HEADER_SHRINK));
  const ratio = headerH / headerFull;
  const pad = Math.round(layout.PAD * ratio);
  const titleH = headerH - pad;
  return { pad, titleH };
}

// Groups layout.processed items into pages, never splitting an item (image + its lyric lane) across
// a page boundary — a break can only happen in the gap BETWEEN items. If a single item is taller than
// a whole A4 page on its own, it is kept whole on its own page (that one page is allowed to exceed
// maxPageH) rather than silently cutting it, per the "never cut mid-line" requirement.
//
// After the greedy normal-spacing fill, each page gets ONE attempt to additionally pull in the next
// line so pages read as "full" instead of leaving a dangling gap at the bottom: first by narrowing
// this page's own gaps (step 2B), and only if that isn't enough, by uniformly shrinking this page's
// content by up to 5% (step 2A). A page that already fills up on its own is left untouched by either.
function paginateScoreLayout(layout, maxPageH) {
  const pages = [];
  const overflowIdx = [];
  const n = layout.processed.length;
  const pagedTitle = computePagedTitleMetrics(layout);
  let idx = 0;
  let pageIsFirst = true;

  while (idx < n) {
    const headerPad = pageIsFirst ? pagedTitle.pad : layout.PAD;
    const titleH = pageIsFirst ? pagedTitle.titleH : 0;
    const headerH = headerPad + titleH;

    // Greedy fill at normal spacing/scale.
    const items = [];
    let sumGroupH = 0;
    let i = idx;
    let forcedOverflow = false;
    while (i < n) {
      const p = layout.processed[i];
      const count = items.length + 1;
      const neededH = headerH + sumGroupH + p.groupH + count * layout.gapAfterImage + layout.PAD;
      if (items.length > 0 && neededH > maxPageH) break;
      items.push(p);
      sumGroupH += p.groupH;
      i++;
      if (items.length === 1 && neededH > maxPageH) {
        overflowIdx.push(i - 1);
        forcedOverflow = true;
        break;
      }
    }

    const page = {
      items, hasTitle: pageIsFirst, headerPad, titleH, titleFontPx: layout.titleFontPx,
      gap: layout.gapAfterImage, scale: 1,
    };

    if (!forcedOverflow && i < n) {
      const nextP = layout.processed[i];
      const m = items.length + 1;
      const sumWithNext = sumGroupH + nextP.groupH;

      // Step 2B: narrow this page's own gaps just enough to fit the next line.
      const requiredGap = (maxPageH - headerH - sumWithNext - layout.PAD) / m;
      const minGap = layout.gapAfterImage * PAGE_GAP_MIN_RATIO;
      let pulledIn = false;
      if (requiredGap >= minGap) {
        const gapUsed = Math.max(minGap, Math.min(layout.gapAfterImage, Math.floor(requiredGap)));
        if (headerH + sumWithNext + m * gapUsed + layout.PAD <= maxPageH) {
          page.items = [...items, nextP];
          page.gap = gapUsed;
          i++;
          pulledIn = true;
        }
      }

      // Step 2A: only if 2B alone wasn't enough — shrink this page's whole content by up to 5%.
      if (!pulledIn) {
        const titlePortion = pageIsFirst ? titleH : 0;
        const scalableBase = sumWithNext + m * layout.gapAfterImage + titlePortion;
        const fixedBase = headerPad + layout.PAD;
        const neededScalable = maxPageH - fixedBase;
        if (scalableBase > 0 && neededScalable > 0) {
          const s = Math.min(1, neededScalable / scalableBase);
          if (s >= PAGE_SCALE_MIN) {
            page.items = [...items, nextP];
            page.scale = s;
            i++;
          }
        }
      }
    }

    pages.push(page);
    pageIsFirst = false;
    idx = i;
  }
  return { pages, overflowIdx };
}

function computePageContentHeight(layout, page) {
  let h = page.hasTitle ? (page.headerPad + Math.round(page.titleH * page.scale)) : layout.PAD;
  for (const p of page.items) {
    h += Math.round(p.scaledH * page.scale);
    if (p.tags.length > 0) h += Math.round(p.laneH * page.scale);
    h += Math.round(page.gap * page.scale);
  }
  h += layout.PAD;
  return h;
}

function renderScorePageCanvas(layout, title, page, W, H) {
  const canvas = document.createElement('canvas');
  canvas.width = W;
  canvas.height = H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, W, H);

  let y = page.hasTitle ? page.headerPad : layout.PAD;
  if (page.hasTitle) {
    const titleFontPx = Math.max(10, Math.round(page.titleFontPx * page.scale));
    const titleFont = 'bold ' + titleFontPx + 'px serif';
    const titleH = Math.round(page.titleH * page.scale);
    drawScoreTitleCustom(ctx, W, title, titleFont, titleH, y);
    y += titleH;
  }
  for (const p of page.items) {
    y = drawScoreItem(ctx, W, p, y, layout, page.scale);
    y += Math.round(page.gap * page.scale);
  }
  return canvas;
}

// Splits the score into A4-proportioned page canvases, always at natural (resolution-preserving)
// width — the same 'auto' sizing used by the single-file PNG export, so splitting never loses quality.
async function composeScorePages(items, title, opts) {
  const layout = await buildScoreLayout(items, title, 'auto', opts);
  const maxPageH = Math.round(layout.W * A4_HEIGHT_RATIO);
  const { pages, overflowIdx } = paginateScoreLayout(layout, maxPageH);
  const canvases = pages.map(page => {
    const H = Math.max(maxPageH, computePageContentHeight(layout, page));
    return renderScorePageCanvas(layout, title, page, layout.W, H);
  });
  return { canvases, overflowCount: overflowIdx.length };
}

async function exportPagesAsPdf(canvases, title) {
  const { jsPDF } = window.jspdf;
  const pageWmm = 210;
  let pdf = null;
  for (let i = 0; i < canvases.length; i++) {
    const c = canvases[i];
    const pageHmm = pageWmm * (c.height / c.width);
    if (i === 0) {
      pdf = new jsPDF({ orientation: 'portrait', unit: 'mm', format: [pageWmm, pageHmm] });
    } else {
      pdf.addPage([pageWmm, pageHmm], 'portrait');
    }
    // PNG (not JPEG) to avoid re-introducing the exact quality loss this whole feature exists to fix.
    pdf.addImage(c.toDataURL('image/png'), 'PNG', 0, 0, pageWmm, pageHmm);
  }
  pdf.save((title.trim() || 'tab_score') + '.pdf');
}

async function exportPagesAsZip(canvases, title, format) {
  const zip = new JSZip();
  const ext = format === 'jpeg' ? 'jpg' : 'png';
  const mime = format === 'jpeg' ? 'image/jpeg' : 'image/png';
  const baseName = title.trim() || 'tab_score';
  for (let i = 0; i < canvases.length; i++) {
    const blob = await new Promise(resolve => canvases[i].toBlob(resolve, mime, format === 'jpeg' ? 0.92 : undefined));
    zip.file(baseName + '_' + (i + 1) + '.' + ext, blob);
  }
  const zipBlob = await zip.generateAsync({ type: 'blob' });
  const url = URL.createObjectURL(zipBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = baseName + '.zip';
  a.click();
  URL.revokeObjectURL(url);
}

// ---- syllable-onset-snap lyric placement (video-extraction blocks only) ----
// Splits a pasted lyric line into placeable tokens: each Hangul syllable becomes its own token
// (Korean lyrics are conventionally one syllable per beat/note), while a run of non-Hangul
// characters (numbers, English words, punctuation) is kept together as a single token.
function tokenizeLyricLine(text) {
  const trimmed = (text || '').trim();
  if (!trimmed) return [];
  const tokens = [];
  let buf = '';
  const isHangul = ch => /[가-힣]/.test(ch);
  for (const ch of trimmed) {
    if (/\s/.test(ch)) { if (buf) { tokens.push(buf); buf = ''; } continue; }
    if (isHangul(ch)) { if (buf) { tokens.push(buf); buf = ''; } tokens.push(ch); }
    else { buf += ch; }
  }
  if (buf) tokens.push(buf);
  return tokens;
}

// One decode per videoSourceId, shared by every block extracted from the same video (several
// ImageBlocks can carry the same id) — avoids re-fetching/re-decoding the same Blob repeatedly.
const _videoSourceMetaCache = new Map();
function loadVideoSourceMeta(videoSourceId) {
  if (!videoSourceId) return Promise.resolve(null);
  if (_videoSourceMetaCache.has(videoSourceId)) return _videoSourceMetaCache.get(videoSourceId);
  const p = (async () => {
    const rec = await dbGet(VIDEO_SOURCE_KEY_PREFIX + videoSourceId);
    if (!rec || !rec.videoBlob) return null;
    const objectUrl = URL.createObjectURL(rec.videoBlob);
    let monoData = null, sampleRate = null;
    try {
      const arrayBuffer = await rec.videoBlob.arrayBuffer();
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const audioBuffer = await ac.decodeAudioData(arrayBuffer);
      monoData = audioBuffer.getChannelData(0);
      sampleRate = audioBuffer.sampleRate;
      ac.close();
    } catch (err) {
      console.error('오디오 디코딩 실패', err);
    }
    return { objectUrl, onsets: rec.onsets || [], monoData, sampleRate };
  })();
  _videoSourceMetaCache.set(videoSourceId, p);
  return p;
}

const ONSET_LANE_Y_PCT = 50; // fixed placement row for onset-snapped syllables; drag handle fine-tunes it after

// Above a video-extraction block's existing (manual, drag-handle) lyric lane, this panel adds a
// keyboard-driven placement mode: paste the line's lyrics, they're tokenized into syllables, and
// each is snapped onto the mini waveform (cropped to this block's own video time range) at the
// exact playback position where Enter was pressed. Renders nothing (and touches nothing) for a
// manually-uploaded block, since those never carry item.timeRange/videoSourceId.
function OnsetLyricPanel({ item, addTagAt, removeTagById, removeTagsByIds, nextItemId }) {
  const hasMeta = !!(item.timeRange && item.videoSourceId);
  const [meta, setMeta] = useState(null);
  const [metaLoading, setMetaLoading] = useState(hasMeta);
  const [lineText, setLineText] = useState('');
  const [placedIds, setPlacedIds] = useState([]);
  const [activeSyllableIndex, setActiveSyllableIndex] = useState(0);
  const [activeOnsetIndex, setActiveOnsetIndex] = useState(0);
  const [guidance, setGuidance] = useState('');
  const [waveW, setWaveW] = useState(600);

  const videoElRef = useRef(null);
  const waveWrapRef = useRef(null);
  const waveCanvasRef = useRef(null);
  const cursorCanvasRef = useRef(null);
  const timeLabelRef = useRef(null);

  useEffect(() => {
    if (!hasMeta) return;
    let cancelled = false;
    setMetaLoading(true);
    loadVideoSourceMeta(item.videoSourceId).then(m => {
      if (cancelled) return;
      setMeta(m);
      setMetaLoading(false);
    });
    return () => { cancelled = true; };
  }, [item.videoSourceId, hasMeta]);

  useEffect(() => {
    function measure() { if (waveWrapRef.current) setWaveW(waveWrapRef.current.offsetWidth || 600); }
    measure();
    window.addEventListener('resize', measure);
    return () => window.removeEventListener('resize', measure);
  }, []);

  const start = item.timeRange ? item.timeRange.start : 0;
  const end = item.timeRange ? item.timeRange.end : 0;
  const blockOnsets = meta ? meta.onsets.filter(t => t >= start - 0.02 && t <= end + 0.02) : [];
  const syllables = tokenizeLyricLine(lineText);

  useEffect(() => {
    const video = videoElRef.current;
    if (!video || !meta) return;
    video.currentTime = start;
  }, [meta]);

  useEffect(() => {
    const video = videoElRef.current;
    if (!video || !meta) return;
    function onTimeUpdate() {
      if (video.currentTime < start) video.currentTime = start;
      else if (video.currentTime > end) { video.pause(); video.currentTime = end; }
    }
    video.addEventListener('timeupdate', onTimeUpdate);
    return () => video.removeEventListener('timeupdate', onTimeUpdate);
  }, [meta, start, end]);

  // Static waveform + onset ticks, redrawn whenever the decoded audio or this block's own range changes.
  useEffect(() => {
    if (!meta || !meta.monoData || !waveCanvasRef.current) return;
    const canvas = waveCanvasRef.current;
    const cursorCanvas = cursorCanvasRef.current;
    if (cursorCanvas) { cursorCanvas.width = canvas.width; cursorCanvas.height = canvas.height; }
    const sr = meta.sampleRate;
    const startSample = Math.max(0, Math.floor(start * sr));
    const endSample = Math.min(meta.monoData.length, Math.ceil(end * sr));
    const slice = meta.monoData.subarray(startSample, endSample);
    const w = canvas.width, h = canvas.height;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#f7f7f7';
    ctx.fillRect(0, 0, w, h);
    const samplesPerPx = Math.max(1, slice.length / w);
    ctx.strokeStyle = '#3366cc';
    ctx.beginPath();
    const mid = h / 2;
    for (let x = 0; x < w; x++) {
      const s0 = Math.floor(x * samplesPerPx), s1 = Math.floor((x + 1) * samplesPerPx);
      let min = 1, max = -1;
      for (let i = s0; i < s1 && i < slice.length; i++) {
        const v = slice[i];
        if (v < min) min = v;
        if (v > max) max = v;
      }
      if (min > max) { min = 0; max = 0; }
      ctx.moveTo(x, mid + min * mid * 0.9);
      ctx.lineTo(x, mid + max * mid * 0.9);
    }
    ctx.stroke();
    ctx.strokeStyle = '#e74c3c';
    ctx.lineWidth = 2;
    blockOnsets.forEach(t => {
      const x = ((t - start) / Math.max(0.001, end - start)) * w;
      ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 14); ctx.stroke();
    });
    ctx.lineWidth = 1;
    // eslint-disable-next-line
  }, [meta, waveW, start, end]);

  // Playback-position cursor, drawn on a separate overlay canvas via rAF so it never triggers a
  // React re-render (this panel can otherwise repaint dozens of times per second while playing).
  useEffect(() => {
    if (!meta) return;
    let raf;
    function tick() {
      const video = videoElRef.current, canvas = cursorCanvasRef.current;
      if (video && canvas) {
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const t = video.currentTime;
        const x = ((t - start) / Math.max(0.001, end - start)) * canvas.width;
        ctx.strokeStyle = '#2ecc71';
        ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, canvas.height); ctx.stroke();
        if (timeLabelRef.current) {
          timeLabelRef.current.textContent = Math.max(0, t - start).toFixed(2) + 's / ' + (end - start).toFixed(2) + 's';
        }
      }
      raf = requestAnimationFrame(tick);
    }
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [meta, start, end]);

  function seekToOnsetIndex(idx) {
    if (!blockOnsets.length) return;
    idx = Math.min(blockOnsets.length - 1, Math.max(0, idx));
    setActiveOnsetIndex(idx);
    const video = videoElRef.current;
    if (!video) return;
    video.pause();
    video.currentTime = blockOnsets[idx];
  }

  function placeSyllable() {
    if (activeSyllableIndex >= syllables.length) { setGuidance('먼저 이 줄의 가사를 아래에 입력하세요.'); return; }
    const video = videoElRef.current;
    if (!video) return;
    const t = Math.min(end, Math.max(start, video.currentTime));
    const xPct = ((t - start) / Math.max(0.001, end - start)) * 100;
    const id = addTagAt(syllables[activeSyllableIndex], xPct, ONSET_LANE_Y_PCT);
    setPlacedIds(prev => [...prev, id]);
    setActiveSyllableIndex(i => i + 1);
    setGuidance('');
  }

  function undoLast() {
    if (placedIds.length === 0) return;
    const lastId = placedIds[placedIds.length - 1];
    removeTagById(lastId);
    setPlacedIds(prev => prev.slice(0, -1));
    setActiveSyllableIndex(i => Math.max(0, i - 1));
    setGuidance('');
  }

  function resetLine() {
    if (placedIds.length > 0) removeTagsByIds(placedIds);
    setPlacedIds([]);
    setActiveSyllableIndex(0);
    setGuidance('');
    const video = videoElRef.current;
    if (video) { video.pause(); video.currentTime = start; }
  }

  function rewindAndReplay() {
    const video = videoElRef.current;
    if (!video) return;
    video.currentTime = Math.max(start, video.currentTime - 1);
    video.play().catch(() => {});
  }

  function advanceLine() {
    if (activeSyllableIndex < syllables.length) {
      setGuidance('아직 배치하지 않은 가사가 있습니다 — 모두 배치한 뒤 다음 줄로 이동할 수 있습니다.');
      return;
    }
    setGuidance('');
    if (nextItemId) {
      const el = document.getElementById('onset-lyric-' + nextItemId);
      if (el) el.focus();
    }
  }

  function handleKeyDown(e) {
    if (!meta) return;
    // These shortcuts only fire when the panel's own outer container has focus — while the user is
    // actually typing in the line-text textarea, every key (Space/Enter/Backspace included) must
    // behave as normal text editing instead of being hijacked as a placement command.
    if (e.target !== e.currentTarget) return;
    if (e.code === 'Space') { e.preventDefault(); const v = videoElRef.current; if (!v) return; if (v.paused) v.play().catch(() => {}); else v.pause(); return; }
    if (e.key === 'ArrowRight') { e.preventDefault(); seekToOnsetIndex(activeOnsetIndex + 1); return; }
    if (e.key === 'ArrowLeft') { e.preventDefault(); seekToOnsetIndex(activeOnsetIndex - 1); return; }
    if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); advanceLine(); return; }
    if (e.key === 'PageDown') { e.preventDefault(); advanceLine(); return; }
    if (e.key === 'Enter') { e.preventDefault(); placeSyllable(); return; }
    if (e.key === 'Backspace' && e.shiftKey) { e.preventDefault(); resetLine(); return; }
    if (e.key === 'Backspace') { e.preventDefault(); undoLast(); return; }
    if ((e.key === 'r' || e.key === 'R') && !e.ctrlKey && !e.metaKey) { e.preventDefault(); rewindAndReplay(); return; }
  }

  if (!hasMeta) return null;

  return (
    <div id={'onset-lyric-' + item.id} className="onset-lyric-panel" tabIndex={0} onKeyDown={handleKeyDown}>
      <div className="lyric-head-mini">
        <span>음절 자동 배치 (온셋 스냅) — 이 영역을 클릭해 포커스한 뒤 키보드로 조작하세요</span>
      </div>
      {metaLoading && <div className="hint-text">원본 영상 데이터를 불러오는 중...</div>}
      {!metaLoading && !meta && (
        <div className="hint-text">이 이미지의 원본 영상 데이터를 찾을 수 없어 자동 배치를 사용할 수 없습니다 (아래 손잡이로 수동 배치는 가능합니다).</div>
      )}
      {meta && (
        <React.Fragment>
          <textarea className="onset-line-input" placeholder="이 줄의 가사를 붙여넣거나 입력하세요 (음절 단위로 자동 분리됩니다)"
            value={lineText} onChange={e => setLineText(e.target.value)} rows={2} />
          <div className="onset-syllable-queue">
            {syllables.length === 0 && <span className="hint-text">위에 가사를 입력하면 음절이 여기 표시됩니다.</span>}
            {syllables.map((syl, i) => (
              <span key={i} className={'syllable-chip' + (i === activeSyllableIndex ? ' active' : (i < activeSyllableIndex ? ' done' : ''))}>{syl}</span>
            ))}
          </div>
          <div className="onset-wave-wrap" ref={waveWrapRef}>
            <canvas ref={waveCanvasRef} className="onset-wave-canvas" width={waveW} height={60} />
            <canvas ref={cursorCanvasRef} className="onset-cursor-canvas" width={waveW} height={60} />
          </div>
          <div className="onset-status-row">
            <span ref={timeLabelRef} className="save-msg">0.00s / {(end - start).toFixed(2)}s</span>
            {guidance && <span className="save-msg onset-guidance">{guidance}</span>}
          </div>
          <video ref={videoElRef} src={meta.objectUrl} preload="auto" className="hidden-video" muted={false} />
          <p className="hint-text onset-keys-hint">
            Space 재생/일시정지 · ←/→ 이전/다음 온셋으로 이동 · Enter 현재 위치에 음절 배치 · Backspace 마지막 배치 취소 ·
            Shift+Backspace 이 줄 전체 초기화 · R 약 1초 되감아 다시재생 · Shift+Enter 또는 PageDown 다음 줄로 이동 (모두 배치해야 이동됨)
          </p>
        </React.Fragment>
      )}
    </div>
  );
}

const ImageBlock = React.memo(function ImageBlock({ item, index, total, defaults, lyricFontSize, lyricLetterSpacing, defaultLyricAreaHeight, onChange, onDelete, onMove, mergeSelected, onToggleMergeSelect, nextItemId }) {
  const canvasRef = useRef(null);
  const imgRef = useRef(null);
  const laneRef = useRef(null);
  const measureCtxRef = useRef(null);
  const [advanced, setAdvanced] = useState(!!item.override);
  const [laneWidth, setLaneWidth] = useState(700);
  const [naturalRatio, setNaturalRatio] = useState(null);
  const [playheadRuns, setPlayheadRuns] = useState([]);
  const [pickingColor, setPickingColor] = useState(false);
  const [barEditOpen, setBarEditOpen] = useState(!!item.stitchMeta);
  const [barsPerRowInput, setBarsPerRowInput] = useState((item.barLayout && item.barLayout.barsPerRow) || '');
  const [barLayoutBusy, setBarLayoutBusy] = useState(false);
  const [processedSrc, setProcessedSrc] = useState(null);

  const eff = effectiveImageSettings(item, defaults);
  const resolvedItemSrc = resolvedSrc(item);

  useEffect(() => {
    let active = true;
    loadImage(resolvedItemSrc).then(img => {
      if (!active) return;
      imgRef.current = img;
      setNaturalRatio(img.naturalHeight / img.naturalWidth);
      redraw();
    });
    return () => { active = false; };
  }, [resolvedItemSrc]);

  useEffect(() => { redraw(); }, [item, defaults]);

  useEffect(() => {
    if (laneRef.current) setLaneWidth(laneRef.current.offsetWidth || 700);
  }, []);

  function redraw() {
    if (!imgRef.current || !canvasRef.current) return;
    const result = drawProcessed(canvasRef.current, imgRef.current, effectiveImageSettings(item, defaults));
    setPlayheadRuns((result && result.playheadRuns) || []);
    // The lyric-placement background strip below should show the same PROCESSED (background-removed/
    // cropped/despeckled) image the TAB preview above shows — not the raw upload — so lyric positions
    // are set against what will actually be exported, not an image whose cropped/removed regions won't
    // even be there in the final result.
    setProcessedSrc(canvasRef.current.toDataURL('image/png'));
  }

  function updateOverride(patch) {
    const base = item.override || eff;
    onChange({ ...item, override: { ...base, ...patch } });
  }
  function enableAdvanced() {
    setAdvanced(true);
    if (!item.override) onChange({ ...item, override: { ...eff } });
  }
  function clearOverride() {
    setAdvanced(false);
    onChange({ ...item, override: null });
  }

  function togglePlayheadExcluded(key) {
    const cur = item.playheadExcluded || [];
    const next = cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key];
    onChange({ ...item, playheadExcluded: next });
  }

  function startColorPick() {
    setPickingColor(true);
  }

  function handleCanvasClick(e) {
    if (!pickingColor || !canvasRef.current || !imgRef.current) return;
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const xPx = ((e.clientX - rect.left) / rect.width) * canvas.width;
    const yPx = ((e.clientY - rect.top) / rect.height) * canvas.height;
    // sample from a crop-only render of the ORIGINAL image (no bg-removal/threshold applied yet),
    // since the displayed canvas may already be thresholded to black/white, which would destroy
    // the exact color info the eyedropper needs — especially when default detection missed it
    const img = imgRef.current;
    const W = img.naturalWidth, H = img.naturalHeight;
    const [cropTop, cropBottom] = clampCropPair(eff.cropTop, eff.cropBottom);
    const [cropLeft, cropRight] = clampCropPair(eff.cropLeft, eff.cropRight);
    const sx = Math.floor(W * cropLeft / 100), sy = Math.floor(H * cropTop / 100);
    const sw = Math.max(1, Math.floor(W * (100 - cropLeft - cropRight) / 100));
    const sh = Math.max(1, Math.floor(H * (100 - cropTop - cropBottom) / 100));
    const rawCanvas = document.createElement('canvas');
    rawCanvas.width = sw; rawCanvas.height = sh;
    rawCanvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
    const imageData = rawCanvas.getContext('2d').getImageData(0, 0, sw, sh);
    const sampled = sampleColorAtPoint(imageData, sw, sh, xPx, yPx);
    const color = { hue: sampled.hue, hueTolerance: PLAYHEAD_HUE_TOLERANCE_DEFAULT, satMin: Math.max(0.15, sampled.sat - 0.15) };
    updateOverride({ playheadColor: color });
    setPickingColor(false);
  }

  const barLayout = item.barLayout;
  const barMarkers = (barLayout && barLayout.markers) || [];

  function setBarLayout(patch) {
    onChange({ ...item, barLayout: { markers: [], barsPerRow: null, appliedSrc: null, ...(item.barLayout || {}), ...patch } });
  }
  function updateMarker(id, patch) {
    setBarLayout({ markers: barMarkers.map(m => m.id === id ? { ...m, ...patch } : m) });
  }
  function addMarker() {
    const id = Date.now() + '_' + Math.random().toString(36).slice(2);
    setBarLayout({ markers: [...barMarkers, { id, xPct: 50, source: 'manual' }] });
  }
  function deleteMarker(id) {
    setBarLayout({ markers: barMarkers.filter(m => m.id !== id) });
  }
  function runPixelDetection() {
    if (!canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const xPcts = detectBarLinesByPixels(imageData, canvas.width, canvas.height);
    const newMarkers = xPcts.map(xPct => ({ id: Date.now() + '_' + Math.random().toString(36).slice(2), xPct, source: 'pixel' }));
    setBarLayout({ markers: [...barMarkers, ...newMarkers] });
  }
  async function applyBarsPerRow() {
    const n = Math.max(1, Number(barsPerRowInput) || 0);
    if (!n || barMarkers.length === 0 || !imgRef.current) return;
    setBarLayoutBusy(true);
    try {
      const sorted = [...barMarkers.map(m => m.xPct)].sort((a, b) => a - b);
      const rawImg = await loadImage(item.src);
      const out = await rebuildBarsPerRow(rawImg, sorted, n);
      setBarLayout({ barsPerRow: n, appliedSrc: out.toDataURL('image/png') });
    } finally {
      setBarLayoutBusy(false);
    }
  }
  function clearBarLayout() {
    onChange({ ...item, barLayout: null });
    setBarsPerRowInput('');
  }
  function startMarkerDrag(e, markerId) {
    e.preventDefault();
    e.stopPropagation();
    const rect = canvasRef.current.getBoundingClientRect();
    let moved = false;
    const startX = e.clientX;
    function onMove(ev) {
      if (Math.abs(ev.clientX - startX) > 2) moved = true;
      let xPct = ((ev.clientX - rect.left) / rect.width) * 100;
      xPct = Math.min(100, Math.max(0, xPct));
      updateMarker(markerId, { xPct });
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  const lyricsObj = item.lyrics || { tags: [], areaHeightRatio: null };
  const tags = lyricsObj.tags || [];
  const laneHeightRatio = lyricsObj.areaHeightRatio != null ? lyricsObj.areaHeightRatio : (defaultLyricAreaHeight / (laneWidth || 700));
  const laneHeight = Math.round(laneHeightRatio * (laneWidth || 700));
  const refStripHeight = naturalRatio ? Math.round((laneWidth || 700) * naturalRatio * 0.3) : 0;

  function updateLyrics(patch) {
    onChange({ ...item, lyrics: { ...lyricsObj, ...patch } });
  }
  function addTag() {
    const id = Date.now() + '_' + Math.random().toString(36).slice(2);
    updateLyrics({ tags: [...tags, { id, text: '가사', xPct: 8, yPct: Math.min(90, 15 + tags.length * 20) }] });
  }
  function updateTag(id, patch) {
    updateLyrics({ tags: tags.map(t => t.id === id ? { ...t, ...patch } : t) });
  }
  function deleteTag(id) {
    updateLyrics({ tags: tags.filter(t => t.id !== id) });
  }
  // Used by OnsetLyricPanel's keyboard-driven placement — same shape as addTag/deleteTag above,
  // just with an explicit text/position instead of the "+ 가사 추가" button's fixed default.
  function addTagAt(text, xPct, yPct) {
    const id = Date.now() + '_' + Math.random().toString(36).slice(2);
    updateLyrics({ tags: [...tags, { id, text, xPct, yPct }] });
    return id;
  }
  function removeTagById(id) {
    updateLyrics({ tags: tags.filter(t => t.id !== id) });
  }
  // Bulk variant for OnsetLyricPanel's "reset whole line" — removing N ids via N separate
  // removeTagById calls in the same synchronous burst would each read the same pre-update `tags`
  // closure and only the last call's result would stick, silently losing all but one removal.
  function removeTagsByIds(ids) {
    const idSet = new Set(ids);
    updateLyrics({ tags: tags.filter(t => !idSet.has(t.id)) });
  }
  function startDrag(e, tagId) {
    e.preventDefault();
    e.stopPropagation();
    const rect = laneRef.current.getBoundingClientRect();
    function onMove(ev) {
      let xPct = ((ev.clientX - rect.left) / rect.width) * 100;
      let yPct = ((ev.clientY - rect.top) / rect.height) * 100;
      xPct = Math.min(100, Math.max(0, xPct));
      yPct = Math.min(100, Math.max(0, yPct));
      updateTag(tagId, { xPct, yPct });
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  function startResize(e) {
    e.preventDefault();
    e.stopPropagation();
    const startY = e.clientY;
    const startH = laneHeight;
    const w = (laneRef.current && laneRef.current.offsetWidth) || laneWidth || 700;
    function onMove(ev) {
      const newH = Math.max(20, Math.round(startH + (ev.clientY - startY)));
      updateLyrics({ areaHeightRatio: newH / w });
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  function sizeInput(el, text) {
    if (!el) return;
    if (!measureCtxRef.current) measureCtxRef.current = document.createElement('canvas').getContext('2d');
    const mctx = measureCtxRef.current;
    mctx.font = lyricFontSize + 'px Georgia, "Noto Serif KR", serif';
    const t = text || ' ';
    const w = mctx.measureText(t).width + lyricLetterSpacing * Math.max(0, t.length - 1);
    el.style.width = Math.max(20, w + 12) + 'px';
  }

  return (
    <div className="block">
      <div className="block-head">
        <label className="merge-select-label">
          <input type="checkbox" checked={mergeSelected} onChange={onToggleMergeSelect} />
          합치기 선택
        </label>
        <span>TAB 이미지 {index + 1}</span>
        <div className="block-actions">
          <button className="icon-btn" onClick={() => onMove(-1)} disabled={index === 0}>위</button>
          <button className="icon-btn" onClick={() => onMove(1)} disabled={index === total - 1}>아래</button>
          <button className="icon-btn" onClick={onDelete}>삭제</button>
        </div>
      </div>

      <div className={pickingColor ? 'canvas-overlay-wrap picking' : 'canvas-overlay-wrap'}>
        <canvas ref={canvasRef} className="preview" onClick={handleCanvasClick} />
        {eff.playheadRemove && playheadRuns.length > 0 && (
          <div className="playhead-overlay">
            {playheadRuns.map(run => {
              const excluded = (item.playheadExcluded || []).includes(run.key);
              return (
                <div key={run.key}
                  className={excluded ? 'playhead-run-highlight excluded' : 'playhead-run-highlight'}
                  style={{ left: run.centerXPct + '%', width: '10px', marginLeft: '-5px' }}
                  title={excluded ? '클릭하면 다시 제거 대상에 포함' : '클릭하면 제거 대상에서 제외'}
                  onClick={() => togglePlayheadExcluded(run.key)} />
              );
            })}
          </div>
        )}
        {barEditOpen && (
          <div className="barline-overlay">
            {barMarkers.map(m => (
              <div key={m.id} className="bar-marker" style={{ left: m.xPct + '%' }} onPointerDown={e => startMarkerDrag(e, m.id)}>
                <button className="bar-marker-del" onPointerDown={e => e.stopPropagation()} onClick={() => deleteMarker(m.id)}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="controls">
        {!advanced ? (
          <div className="adv-toggle-row">
            <span>이 이미지: 기본 설정을 따르는 중</span>
            <button className="icon-btn" onClick={enableAdvanced}>고급 설정 사용</button>
          </div>
        ) : (
          <React.Fragment>
            <div className="adv-toggle-row">
              <span>이 이미지만의 고급 설정 사용 중</span>
              <button className="icon-btn" onClick={clearOverride}>기본값 따르기로 되돌리기</button>
            </div>
            <label>
              <input type="checkbox" checked={eff.removeBg} onChange={e => updateOverride({ removeBg: e.target.checked })} />
              배경 제거 (사진 배경 → 흰색)
            </label>
            {eff.removeBg && (
              <React.Fragment>
                <label>
                  <input type="checkbox" checked={eff.invert} onChange={e => updateOverride({ invert: e.target.checked })} />
                  어두운 사진 배경 (밝은 글씨/선을 검정으로 변환)
                </label>
                <div>
                  <div className="slider-label">배경 제거 강도 ({eff.threshold})</div>
                  <input type="range" min="0" max="255" step="1" value={eff.threshold}
                    onChange={e => updateOverride({ threshold: Number(e.target.value) })} />
                </div>
                <div>
                  <div className="slider-label">부드러운 경계 — 안티앨리어싱 유지 ({eff.softness})</div>
                  <input type="range" min="0" max="60" step="1" value={eff.softness}
                    onChange={e => updateOverride({ softness: Number(e.target.value) })} />
                </div>
                <label>
                  <input type="checkbox" checked={eff.despeckle} onChange={e => updateOverride({ despeckle: e.target.checked })} />
                  잡티(고립 노이즈) 제거
                </label>
                {eff.despeckle && (
                  <div>
                    <div className="slider-label">제거할 잡티 크기 ({eff.despeckleSize}px 이하)</div>
                    <input type="range" min="1" max="12" step="1" value={eff.despeckleSize}
                      onChange={e => updateOverride({ despeckleSize: Number(e.target.value) })} />
                  </div>
                )}
              </React.Fragment>
            )}
            <label>
              <input type="checkbox" checked={!!eff.playheadRemove} onChange={e => updateOverride({ playheadRemove: e.target.checked })} />
              재생 표시줄 제거 (세로로 긴 색상 커서 줄 감지 후 제거)
            </label>
            {eff.playheadRemove && (
              <div className="eyedrop-row">
                <button type="button" className="icon-btn" onClick={startColorPick}>
                  {pickingColor ? '이미지에서 클릭하세요...' : '스포이드로 색 지정'}
                </button>
                <span className="color-swatch" style={{
                  background: 'hsl(' + (eff.playheadColor ? eff.playheadColor.hue : PLAYHEAD_HUE_DEFAULT) + ', 80%, 50%)'
                }} />
                <span style={{ fontSize: '11.5px', color: 'var(--text2)' }}>
                  {eff.playheadColor ? '지정된 색 사용 중' : '기본 추정 색(파란/청록 계열) 사용 중'}
                </span>
              </div>
            )}
            {eff.playheadRemove && playheadRuns.length > 0 && (
              <div className="save-msg">
                빨간 표시가 제거 대상입니다. 실제 마디선이라면 클릭해서 제외하세요 — 체크 해제하면 언제든 원본으로 즉시 복구됩니다.
              </div>
            )}
            <div className="grid2">
              <div>
                <div className="slider-label">위쪽 자르기 ({eff.cropTop}%)</div>
                <input type="range" min="0" max={cropSliderMax(eff.cropBottom)} step="1" value={eff.cropTop}
                  onChange={e => updateOverride({ cropTop: clampCropSlider(Number(e.target.value), eff.cropBottom) })} />
              </div>
              <div>
                <div className="slider-label">아래쪽 자르기 ({eff.cropBottom}%)</div>
                <input type="range" min="0" max={cropSliderMax(eff.cropTop)} step="1" value={eff.cropBottom}
                  onChange={e => updateOverride({ cropBottom: clampCropSlider(Number(e.target.value), eff.cropTop) })} />
              </div>
              <div>
                <div className="slider-label">왼쪽 자르기 ({eff.cropLeft}%)</div>
                <input type="range" min="0" max={cropSliderMax(eff.cropRight)} step="1" value={eff.cropLeft}
                  onChange={e => updateOverride({ cropLeft: clampCropSlider(Number(e.target.value), eff.cropRight) })} />

          )}

        </div>
        {barEditOpen && (
          <div className="controls">
