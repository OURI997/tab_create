function FloatingPreview({ title, items, titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricAreaHeight, defaults }) {
  const [previewSrc, setPreviewSrc] = useState(null);
  const [busy, setBusy] = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  const [expanded, setExpanded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    if (items.length === 0) { setPreviewSrc(null); return; }
    setBusy(true);
    const timer = setTimeout(async () => {
      try {
        const canvas = await composeScore(items, title, 800, { titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricAreaHeight, defaults });
        if (cancelled) return;
        setPreviewSrc(canvas.toDataURL('image/png'));
      } finally {
        if (!cancelled) setBusy(false);
      }
    }, 450);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [title, items, titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricAreaHeight, defaults]);

  if (items.length === 0) return null;

  return (
    <React.Fragment>
      <div className={collapsed ? 'float-preview collapsed' : 'float-preview'}>
        <div className="float-preview-head">
          <span>미리보기{busy ? ' ...' : ''}</span>
          <div className="block-actions">
            {!collapsed && <button className="icon-btn" onClick={() => setExpanded(true)}>크게 보기</button>}
            <button className="icon-btn" onClick={() => setCollapsed(c => !c)}>{collapsed ? '펼치기' : '접기'}</button>
          </div>
        </div>
        {!collapsed && (
          <div className="float-preview-body">
            {previewSrc && <img src={previewSrc} alt="미리보기" />}
          </div>
        )}
      </div>

      {expanded && (
        <div className="preview-modal-backdrop" onClick={() => setExpanded(false)}>
          <div className="preview-modal" onClick={e => e.stopPropagation()}>
            <div className="preview-modal-head">
              <span>전체 미리보기{busy ? ' (갱신 중...)' : ''}</span>
              <button className="icon-btn" onClick={() => setExpanded(false)}>닫기</button>
            </div>
            <div className="preview-modal-body">
              {previewSrc && <img src={previewSrc} alt="전체 미리보기" />}
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function StitchUploadModal({ defaults, onComplete, onClose }) {
  const [files, setFiles] = useState([]);
  const [playheadRemove, setPlayheadRemove] = useState(!!defaults.playheadRemove);
  const [phase, setPhase] = useState('pick'); // pick | processing | conflict | error
  const [progress, setProgress] = useState({ stage: '', i: 0, total: 0 });
  const [stitchState, setStitchState] = useState(null); // { resolvedResult, seams, unresolvedPairs }
  const [conflictChoices, setConflictChoices] = useState({});
  const [errorMsg, setErrorMsg] = useState('');
  const fileRef = useRef(null);

  async function start() {
    if (files.length === 0) return;
    setPhase('processing');
    setErrorMsg('');
    try {
      const result = await stitchImages(files, { playheadRemove, playheadColor: defaults.playheadColor }, p => setProgress(p));
      setStitchState(result);
      if (result.unresolvedPairs.length > 0) {
        setPhase('conflict');
      } else {
        finish(result, {});
      }
    } catch (e) {
      console.error(e);
      setErrorMsg('이어붙이기 중 오류가 발생했습니다: ' + (e && e.message ? e.message : e));
      setPhase('error');
    }
  }

  function chooseConflict(pairKey, choice) {
    setConflictChoices(prev => ({ ...prev, [pairKey]: choice }));
  }

  function allConflictsResolved() {
    if (!stitchState) return false;
    return stitchState.unresolvedPairs.every(p => conflictChoices[p.indexA] != null);
  }

  function finishAfterConflicts() {
    finish(stitchState, conflictChoices);
  }

  function finish(result, choices) {
    const composed = result.resolvedResult(choices);
    const newItems = composed.canvases.map((canvas, idx) => {
      const baseId = Date.now() + '_' + Math.random().toString(36).slice(2) + '_' + idx;
      return {
        id: baseId, type: 'image', src: canvas.toDataURL('image/png'),
        invert: false, override: null,
        lyrics: { tags: [], areaHeightRatio: null },
        playheadExcluded: [],
        barLayout: null,
        stitchMeta: { sourceCount: result.sourceCount, seamMethods: composed.seamMethods, warnings: composed.warnings },
      };
    });
    onComplete(newItems);
  }

  return (
    <div className="preview-modal-backdrop" onClick={onClose}>
      <div className="preview-modal" onClick={e => e.stopPropagation()}>
        <div className="preview-modal-head">
          <span>여러 장 이어붙이기</span>
          <button className="icon-btn" onClick={onClose}>닫기</button>
        </div>
        <div className="preview-modal-body">
          {phase === 'pick' && (
            <div className="controls">
              <div className="slider-label">이어붙일 이미지를 순서대로 여러 장 선택하세요 (왼쪽→오른쪽 순서)</div>
              <input ref={fileRef} type="file" accept="image/*" multiple
                onChange={e => setFiles(Array.from(e.target.files || []))} />
              <label>
                <input type="checkbox" checked={playheadRemove} onChange={e => setPlayheadRemove(e.target.checked)} />
                재생 표시줄 제거 적용 (이어붙이기 전 각 이미지에 먼저 적용)
              </label>
              <button onClick={start} disabled={files.length === 0}>이어붙이기 시작</button>
            </div>
          )}
          {phase === 'processing' && (
            <div className="stitch-progress-row">
              <span>
                {progress.stage === 'ocr' && `${progress.i}/${progress.total} 이미지 분석 중 (마디 번호 인식)...`}
                {progress.stage === 'seam' && `${progress.i}/${progress.total} 겹침 위치 계산 중...`}
                {!progress.stage && '처리 중...'}
              </span>
            </div>
          )}
          {phase === 'conflict' && stitchState && (
            <div className="controls">
              <div className="slider-label">겹침 위치를 자동으로 찾지 못한 이미지 쌍이 있습니다. 각각 선택해주세요.</div>
              {stitchState.unresolvedPairs.map(p => (
                <div className="stitch-conflict-card" key={p.indexA}>
                  <span>{p.indexA + 1}번째, {p.indexB + 1}번째 이미지는 자동으로 겹침 위치를 못 찾았습니다. 순서대로 이어붙이기만 하시겠습니까, 아니면 개별 이미지로 각각 업로드하시겠습니까?</span>
                  <div className="block-actions">
                    <button className={conflictChoices[p.indexA] === 'concat' ? '' : 'icon-btn'}
                      onClick={() => chooseConflict(p.indexA, 'concat')}>순서대로 이어붙이기</button>
                    <button className={conflictChoices[p.indexA] === 'split' ? '' : 'icon-btn'}
                      onClick={() => chooseConflict(p.indexA, 'split')}>개별 이미지로 추가</button>
                  </div>
                </div>
              ))}
              <button onClick={finishAfterConflicts} disabled={!allConflictsResolved()}>계속</button>
            </div>
          )}
          {phase === 'error' && (
            <div className="controls">
              <div className="save-msg" style={{ color: '#c0392b' }}>{errorMsg}</div>
              <div className="slider-label">자동 이어붙이기에 실패해도 각 이미지를 "TAB 이미지 추가"로 개별 업로드해서 계속 작업하실 수 있습니다.</div>
              <button onClick={onClose}>닫기</button>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function TabScoreBuilder() {
  const [title, setTitle] = useState('');
  const [items, setItems] = useState([]);
  const [defaults, setDefaults] = useState(DEFAULTS_INIT);
  const [titleFontSize, setTitleFontSize] = useState(44);
  const [lyricFontSize, setLyricFontSize] = useState(26);
  const [exporting, setExporting] = useState(false);
  const [savedList, setSavedList] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState('');
  const [noticeDismissed, setNoticeDismissed] = useState(true);
  const [showStitchModal, setShowStitchModal] = useState(false);
  const fileInputRef = useRef(null);
  const listRef = useRef(null);
  function getReferenceWidth() {
    return (listRef.current && listRef.current.getBoundingClientRect().width) || 780;
  }

  useEffect(() => {
    try {
      setNoticeDismissed(localStorage.getItem('tab_score_builder_notice_dismissed') === '1');
    } catch (e) {}
  }, []);
  function dismissNotice() {
    setNoticeDismissed(true);
    try { localStorage.setItem('tab_score_builder_notice_dismissed', '1'); } catch (e) {}
  }

  useEffect(() => {
    (async () => {
      try {
        const draft = await dbGet(DRAFT_KEY);
        if (draft) {
          setTitle(draft.title || '');
          setItems(draft.items || []);
          if (draft.defaults) setDefaults({ ...DEFAULTS_INIT, ...draft.defaults });
          if (draft.titleFontSize) setTitleFontSize(draft.titleFontSize);
          if (draft.lyricFontSize) setLyricFontSize(draft.lyricFontSize);
        }
        const keys = await dbAllKeys();
        setSavedList(keys.filter(k => k !== DRAFT_KEY));
      } catch (e) {
        console.warn('IndexedDB 사용 불가:', e);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(() => {
      dbPut(DRAFT_KEY, { title, items, defaults, titleFontSize, lyricFontSize }).catch(() => {});
    }, 800);
    return () => clearTimeout(t);
  }, [title, items, defaults, titleFontSize, lyricFontSize, loaded]);

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        const src = ev.target.result;
        const probe = new Image();
        probe.onload = () => {
          const avg = sampleAvgLuminance(probe);
          const invert = defaults.invertMode === 'auto' ? (avg < 128) : defaults.invertMode === 'on';
          const baseId = Date.now() + '_' + Math.random().toString(36).slice(2);
          setItems(prev => [
            ...prev,
            {
              id: baseId, type: 'image', src,
              invert,
              override: null,
              lyrics: { tags: [], areaHeightRatio: null },
              playheadExcluded: [],
              barLayout: null,
              stitchMeta: null,
            },
          ]);
        };
        probe.src = src;
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

  function handleStitchComplete(newItems) {
    setItems(prev => [...prev, ...newItems]);
    setShowStitchModal(false);
  }

  function applyDefaultsToAll() {
    if (items.length === 0) return;
    if (!window.confirm('모든 이미지의 개별(고급) 설정을 지우고 위쪽 기본값을 따르도록 되돌립니다. 계속할까요?')) return;
    setItems(prev => prev.map(it => ({ ...it, override: null })));
  }

  function applyLyricAreaHeightToAll() {
    if (items.length === 0) return;
    if (!window.confirm('모든 가사 입력 영역의 개별 높이 설정을 지우고 위쪽 기본값을 따르도록 되돌립니다. 계속할까요?')) return;
    setItems(prev => prev.map(it => it.lyrics ? { ...it, lyrics: { ...it.lyrics, areaHeightRatio: null } } : it));
  }

  function updateItem(id, next) {
    setItems(prev => prev.map(it => it.id === id ? next : it));
  }
  function deleteItem(id) {
    setItems(prev => prev.filter(it => it.id !== id));
  }
  function moveItem(id, dir) {
    setItems(prev => {
      const idx = prev.findIndex(it => it.id === id);
      const next = idx + dir;
      if (next < 0 || next >= prev.length) return prev;
      const copy = [...prev];
      [copy[idx], copy[next]] = [copy[next], copy[idx]];
      return copy;
    });
  }

  async function handleExport() {
    if (items.length === 0) return;
    setExporting(true);
    try {
      const canvas = await composeScore(items, title, 1400, {
        titleFontSize, referenceWidth: getReferenceWidth(), imageGap: defaults.imageGap,
        lyricFontSize, lyricAreaHeight: defaults.lyricAreaHeight, defaults,
      });
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (title.trim() || 'tab_score') + '.png';
        a.click();
        URL.revokeObjectURL(url);
        setExporting(false);
      });
    } catch (err) {
      console.error(err);
      setExporting(false);
    }
  }

  async function handleFinalSave() {
    const name = title.trim();
    if (!name) { alert('저장하려면 먼저 제목을 입력해주세요.'); return; }
    try {
      await dbPut(name, { title, items, defaults, titleFontSize, lyricFontSize });
      const keys = await dbAllKeys();
      setSavedList(keys.filter(k => k !== DRAFT_KEY));
      setSaveMsg('"' + name + '" 저장됨');
      setTimeout(() => setSaveMsg(''), 2500);
    } catch (e) {
      alert('저장에 실패했습니다 (브라우저 저장소를 사용할 수 없음).');
    }
  }

  async function handleLoad(name) {
    try {
      const data = await dbGet(name);
      if (data) {
        setTitle(data.title || '');
        setItems(data.items || []);
        if (data.defaults) setDefaults({ ...DEFAULTS_INIT, ...data.defaults });
        if (data.titleFontSize) setTitleFontSize(data.titleFontSize);
        if (data.lyricFontSize) setLyricFontSize(data.lyricFontSize);
      }
    } catch (e) {}
  }

  async function handleDeleteSaved(name) {
    if (!window.confirm('"' + name + '" 악보를 삭제할까요?')) return;
    try {
      await dbDelete(name);
      const keys = await dbAllKeys();
      setSavedList(keys.filter(k => k !== DRAFT_KEY));
    } catch (e) {}
  }

  async function handleReset() {
    if (!window.confirm('현재 작업 중인 내용을 모두 지울까요? (저장된 악보 목록은 유지됩니다)')) return;
    setTitle('');
    setItems([]);
    try { await dbDelete(DRAFT_KEY); } catch (e) {}
  }

  return (
    <div className="app">
      <div className="titlebar">
        <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="악보 제목을 입력하세요" />
        <a className="nav-link" href="index.html">코드보 만들기 →</a>
      </div>

      {!noticeDismissed && (
        <div className="notice-banner">
          <div className="notice-text">
            <b>안내:</b> 본 도구는 사용자가 직접 보유한 이미지를 편집·정리하기 위한 <b>개인 연습용 도구</b>입니다.
            모든 데이터는 이 브라우저에만 저장되며 서버로 전송되거나 다른 사용자와 공유되지 않습니다.
            업로드하는 이미지에 대한 저작권 및 이용 책임은 사용자 본인에게 있습니다.
          </div>
          <button className="icon-btn" onClick={dismissNotice}>확인</button>
        </div>
      )}

      <GlobalSettings
        defaults={defaults}
        setDefaults={setDefaults}
        titleFontSize={titleFontSize}
        setTitleFontSize={setTitleFontSize}
        lyricFontSize={lyricFontSize}
        setLyricFontSize={setLyricFontSize}
        onApplyAll={applyDefaultsToAll}
        onApplyLyricAreaHeight={applyLyricAreaHeightToAll}
        hasItems={items.length > 0}
      />

      <div className="toolbar">
        <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={handleFiles} style={{ display: 'none' }} />
        <button onClick={() => fileInputRef.current && fileInputRef.current.click()}>TAB 이미지 추가</button>
        <button className="icon-btn" onClick={() => setShowStitchModal(true)}>여러 장 이어붙이기</button>
        <button onClick={handleExport} disabled={items.length === 0 || exporting}>
          {exporting ? '내보내는 중...' : 'PNG로 내보내기'}
        </button>
        <button onClick={handleFinalSave} disabled={items.length === 0}>최종 저장</button>
        <button onClick={handleReset} disabled={items.length === 0 && !title}>초기화</button>
        {saveMsg && <span className="save-msg">{saveMsg}</span>}
      </div>

      {savedList.length > 0 && (
        <div className="saved-list">
          <span>저장된 악보:</span>
          {savedList.map(name => (
            <span className="saved-chip" key={name}>
              <button className="icon-btn" onClick={() => handleLoad(name)}>{name}</button>
              <button className="icon-btn" onClick={() => handleDeleteSaved(name)}>삭제</button>
            </span>
          ))}
        </div>
      )}

      {items.length === 0 && (
        <div className="empty">
          위 "기본 설정"에서 배경 제거 강도·가사 글자 크기 등을 먼저 맞춰두면, 추가하는 이미지마다 그 값이 실시간 적용됩니다.<br />
          TAB 캡쳐 이미지를 순서대로 추가하고, 각 이미지 아래에서 가사를 원하는 위치로 끌어다 놓으세요. 작업 내용은 자동으로 임시저장됩니다.
        </div>
      )}

      <div className="list" ref={listRef}>
        {items.map((item, idx) => (
          <ImageBlock key={item.id} item={item} index={idx} total={items.length}
            defaults={defaults}
            lyricFontSize={lyricFontSize}
            defaultLyricAreaHeight={defaults.lyricAreaHeight}
            onChange={next => updateItem(item.id, next)}
            onDelete={() => deleteItem(item.id)}
            onMove={dir => moveItem(item.id, dir)} />
        ))}
      </div>

      <FloatingPreview title={title} items={items} titleFontSize={titleFontSize}
        referenceWidth={getReferenceWidth()} imageGap={defaults.imageGap}
        lyricFontSize={lyricFontSize} lyricAreaHeight={defaults.lyricAreaHeight} defaults={defaults} />

      {showStitchModal && (
        <StitchUploadModal defaults={defaults} onComplete={handleStitchComplete} onClose={() => setShowStitchModal(false)} />
      )}

      <div className="disclaimer-footer">
        본 도구는 이미지 편집·정리 기능만 제공하는 개인 연습용 소프트웨어이며, 악보나 이미지를 수집·배포하지 않습니다.<br />
        모든 데이터는 사용자의 브라우저에만 저장되고, 업로드·내보내기 하는 콘텐츠의 저작권 준수 책임은 사용자에게 있습니다.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TabScoreBuilder />);
</script>
</body>
</html>
