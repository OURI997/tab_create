<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TAB 악보 결합 도구</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

<style>
  :root{
    --bg:#faf8f3;
    --card:#ffffff;
    --border:#ddd8cc;
    --border-strong:#bdb6a4;
    --text:#1a1a1a;
    --text2:#6b6b63;
    --accent:#3c3489;
    --accent-bg:#eeedfe;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
    background:var(--bg);
    color:var(--text);
    padding:24px;
  }
  .app{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:20px;}
  .titlebar{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border);padding-bottom:12px;}
  .titlebar input{
    flex:1;font-family:Georgia,"Noto Serif KR",serif;font-size:22px;font-weight:600;
    border:none;background:transparent;outline:none;color:var(--text);
  }
  .toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  button{
    border:1px solid var(--border-strong);background:var(--card);color:var(--text);
    border-radius:8px;padding:8px 14px;font-size:14px;cursor:pointer;
  }
  button:hover{background:var(--accent-bg);}
  button:disabled{opacity:0.4;cursor:default;}
  .icon-btn{padding:6px 8px;font-size:13px;}
  .nav-link{border:1px solid var(--border-strong);background:var(--card);color:var(--text);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;white-space:nowrap;}
  .nav-link:hover{background:var(--accent-bg);}
  .save-msg{font-size:13px;color:var(--accent);}
  .saved-list{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--text2);}
  .saved-chip{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden;}
  .saved-chip button{border:none;border-radius:0;}
  .saved-chip button:first-child{border-right:1px solid var(--border-strong);}
  .empty{
    text-align:center;padding:48px 16px;color:var(--text2);font-size:14px;
    border:1px dashed var(--border-strong);border-radius:12px;line-height:1.6;
  }
  .block{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;}
  .block-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-size:13px;color:var(--text2);}
  .block-actions{display:flex;gap:6px;}
  canvas.preview{width:100%;display:block;background:#fff;border:1px solid var(--border);border-radius:8px;}
  .adv-toggle-row{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--text2);gap:8px;}
  .lyric-section{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
  .lyric-head-mini{
    display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--text2);margin-bottom:8px;gap:8px;
  }
  .lyric-head-mini .icon-btn{font-size:11px;padding:3px 8px;}
  .lane-wrap{display:flex;flex-direction:column;}
  .lane-ref-strip-standalone{
    width:100%;flex-shrink:0;
    background-repeat:no-repeat;background-size:100% auto;background-position:bottom;
    opacity:0.32;pointer-events:none;
    border:1px dashed var(--border-strong);border-bottom:none;border-radius:8px 8px 0 0;
  }
  .lyric-lane{
    position:relative;width:100%;min-height:20px;
    border:1px dashed var(--border-strong);border-radius:0 0 8px 8px;
    background-color:#fdfdfb;
    background-image:repeating-linear-gradient(to right, var(--border) 0, var(--border) 1px, transparent 1px, transparent 5%);
  }
  .lyric-lane.no-ref{border-radius:8px;}
  .lane-empty{
    position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    text-align:center;padding:8px;font-size:11.5px;color:var(--text2);line-height:1.5;
  }
  .lyric-tag{
    position:absolute;transform:translate(0,-50%);
    z-index:1;
  }
  .lyric-tag-row{
    display:flex;align-items:center;gap:3px;
    background:#ffffff;border:1px solid var(--border-strong);border-radius:6px;
    padding:2px 4px;box-shadow:0 1px 4px rgba(0,0,0,0.14);

    position:absolute;left:0;bottom:100%;margin-bottom:2px;

  }

  .lane-resize-handle{
    position:absolute;left:50%;bottom:2px;transform:translateX(-50%);
    width:40px;height:11px;border-radius:4px;background:var(--border-strong);
    cursor:ns-resize;touch-action:none;
  }
  .controls{display:flex;flex-direction:column;gap:10px;margin-top:12px;}
  .controls label{display:flex;align-items:center;gap:8px;font-size:13px;}
  .slider-label{font-size:12px;color:var(--text2);margin-bottom:4px;}
  input[type=range]{width:100%;}
  select{border:1px solid var(--border-strong);border-radius:8px;padding:6px 8px;font-size:13px;background:var(--card);color:var(--text);width:100%;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;}
  textarea{
    width:100%;resize:vertical;font-family:Georgia,"Noto Serif KR",serif;font-size:15px;
    border:none;background:transparent;outline:none;color:var(--text);
  }
  .list{display:flex;flex-direction:column;gap:12px;}
  .hr{border:none;border-top:1px solid var(--border);margin:4px 0;}

  .notice-banner{
    display:flex;align-items:flex-start;gap:10px;
    background:var(--accent-bg);border:1px solid var(--accent);border-radius:10px;

  .disclaimer-footer{

  }

  .float-preview{
    position:fixed;bottom:16px;right:16px;width:300px;max-width:90vw;
    max-height:70vh;background:var(--card);border:1px solid var(--border-strong);
    border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,0.18);
    display:flex;flex-direction:column;overflow:hidden;z-index:50;
  }
  .float-preview.collapsed{width:auto;max-height:none;}
  .float-preview-head{
    display:flex;justify-content:space-between;align-items:center;gap:8px;
    padding:8px 10px;font-size:12px;color:var(--text2);
    border-bottom:1px solid var(--border);background:var(--card);
  }
  .float-preview.collapsed .float-preview-head{border-bottom:none;}
  .float-preview-body{overflow:auto;padding:8px;}
  .float-preview-body img{width:100%;display:block;}
  @media (max-width:640px){
    .float-preview{width:46vw;}
  }
  .preview-modal-backdrop{
    position:fixed;inset:0;background:rgba(0,0,0,0.5);
    display:flex;align-items:center;justify-content:center;z-index:100;padding:24px;
  }
  .preview-modal{
    background:var(--card);border-radius:12px;box-shadow:0 8px 40px rgba(0,0,0,0.3);
    width:min(900px,100%);max-height:90vh;display:flex;flex-direction:column;overflow:hidden;
  }
  .preview-modal-head{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 16px;border-bottom:1px solid var(--border);font-size:13px;color:var(--text2);
  }
  .preview-modal-body{overflow:auto;padding:12px;}
  .preview-modal-body img{width:100%;display:block;}

  .canvas-overlay-wrap{position:relative;}
  .canvas-overlay-wrap.picking canvas.preview{cursor:crosshair;}
  .playhead-overlay,.barline-overlay{position:absolute;inset:0;pointer-events:none;}
  .playhead-run-highlight{
    position:absolute;top:0;bottom:0;background:rgba(230,60,60,0.28);
    cursor:pointer;pointer-events:auto;border-left:1px dashed rgba(230,60,60,0.7);border-right:1px dashed rgba(230,60,60,0.7);
  }
  .playhead-run-highlight.excluded{background:rgba(120,120,120,0.12);border-color:rgba(120,120,120,0.4);}
  .bar-marker{position:absolute;top:0;bottom:0;width:2px;background:var(--accent);cursor:ew-resize;pointer-events:auto;}
  .bar-marker:hover{background:#c0392b;}
  .bar-marker-del{
    position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    width:16px;height:16px;border-radius:50%;background:#fff;border:1px solid var(--border-strong);
    font-size:10px;line-height:1;cursor:pointer;padding:0;pointer-events:auto;
  }
  .color-swatch{display:inline-block;width:14px;height:14px;border-radius:50%;border:1px solid var(--border-strong);vertical-align:middle;}
  .eyedrop-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .stitch-progress-row{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--text2);}
  .stitch-conflict-card{border:1px solid var(--border);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;font-size:13px;}
  .barline-section{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;}
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useRef, useEffect } = React;

const DB_NAME = 'tab_score_builder_db';
const STORE_NAME = 'scores';
const DRAFT_KEY = '__draft__';

const DEFAULTS_INIT = {
  removeBg: true,
  invertMode: 'auto',
  threshold: 140,
  softness: 18,
  despeckle: true,
  despeckleSize: 3,
  playheadRemove: false,
  playheadColor: null,
  cropTop: 0, cropBottom: 0, cropLeft: 0, cropRight: 0,
  imageGap: 18,
  lyricFontSize: 26,
  lyricAreaHeight: 90,
};

function openDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error('IndexedDB unavailable')); return; }
    const req = indexedDB.open(DB_NAME, 1);
    req.onupgradeneeded = () => {
      if (!req.result.objectStoreNames.contains(STORE_NAME)) {
        req.result.createObjectStore(STORE_NAME);
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbPut(key, value) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).put(value, key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbGet(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).get(key);
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function dbDelete(key) {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readwrite');
    tx.objectStore(STORE_NAME).delete(key);
    tx.oncomplete = () => resolve();
    tx.onerror = () => reject(tx.error);
  });
}
async function dbAllKeys() {
  const db = await openDB();
  return new Promise((resolve, reject) => {
    const tx = db.transaction(STORE_NAME, 'readonly');
    const req = tx.objectStore(STORE_NAME).getAllKeys();
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}

function clampPct(v) { return Math.min(45, Math.max(0, v || 0)); }

function sampleAvgLuminance(img) {
  const c = document.createElement('canvas');
  const w = 60;
  const h = Math.max(1, Math.round((60 * img.naturalHeight) / img.naturalWidth));
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const d = ctx.getImageData(0, 0, w, h).data;
  let sum = 0, n = 0;
  for (let i = 0; i < d.length; i += 4) {
    sum += 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    n++;
  }
  return sum / n;
}

function smoothstep(edge0, edge1, x) {
  if (edge0 === edge1) return x < edge0 ? 0 : 1;
  const t = Math.min(1, Math.max(0, (x - edge0) / (edge1 - edge0)));
  return t * t * (3 - 2 * t);
}

function applyThreshold(imageData, threshold, invert, softness) {
  const d = imageData.data;
  const lo = threshold - softness;
  const hi = threshold + softness;
  for (let i = 0; i < d.length; i += 4) {
    const lum = 0.299*d[i] + 0.587*d[i+1] + 0.114*d[i+2];
    const t = smoothstep(lo, hi, lum);
    const v = invert ? 255 * (1 - t) : 255 * t;
    d[i] = v; d[i+1] = v; d[i+2] = v; d[i+3] = 255;
  }
}

function despeckleBinary(imageData, w, h, maxArea) {
  if (!maxArea || maxArea <= 0) return;
  const data = imageData.data;
  const total = w * h;
  const visited = new Uint8Array(total);
  const stack = new Int32Array(total);
  const isInk = (idx) => data[idx*4] < 128;
  for (let start = 0; start < total; start++) {
    if (visited[start] || !isInk(start)) continue;
    let sp = 0;
    stack[sp++] = start; visited[start] = 1;
    let head = 0;
    while (head < sp) {
      const p = stack[head++];
      const x = p % w, y = (p - x) / w | 0;
      if (x > 0) { const n = p-1; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (x < w-1) { const n = p+1; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (y > 0) { const n = p-w; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
      if (y < h-1) { const n = p+w; if (!visited[n] && isInk(n)) { visited[n]=1; stack[sp++]=n; } }
    }
    if (sp <= maxArea) {
      for (let k = 0; k < sp; k++) {
        const idx = stack[k] * 4;
        data[idx]=255; data[idx+1]=255; data[idx+2]=255;
      }
    }
  }
}

// ---- playhead removal (color + shape based, always previewed/reversible) ----
const PLAYHEAD_HUE_DEFAULT = 210;        // blue/cyan estimate, degrees — only used until the user eyedropper-picks a real color
const PLAYHEAD_HUE_TOLERANCE_DEFAULT = 35;
const PLAYHEAD_SAT_MIN_DEFAULT = 0.35;

function rgbToHsv(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b);
  const d = max - min;
  let h = 0;
  if (d !== 0) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  const s = max === 0 ? 0 : d / max;
  return { h, s, v: max };
}

function sampleColorAtPoint(imageData, w, h, xPx, yPx) {
  const x = Math.min(w - 1, Math.max(0, Math.round(xPx)));
  const y = Math.min(h - 1, Math.max(0, Math.round(yPx)));
  const i = (y * w + x) * 4;
  const d = imageData.data;
  const { h: hue, s: sat } = rgbToHsv(d[i], d[i + 1], d[i + 2]);
  return { hue, sat };
}

function hueDist(a, b) {
  const d = Math.abs(a - b) % 360;
  return d > 180 ? 360 - d : d;
}

// columnwise scan; a column matches if the isMatchFn-passing pixel fraction exceeds minRunRatio;
// adjacent matching columns are merged into runs (capped at maxRunWidthPx to avoid wide false positives)
function scanVerticalRuns(imageData, w, h, isMatchFn, minRunRatio, maxRunWidthPx) {
  const d = imageData.data;
  const colMatch = new Uint8Array(w);
  for (let x = 0; x < w; x++) {
    let hits = 0;
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      if (isMatchFn(d[i], d[i + 1], d[i + 2])) hits++;
    }
    colMatch[x] = (hits / h) >= minRunRatio ? 1 : 0;
  }
  const runs = [];
  let x = 0;
  while (x < w) {
    if (!colMatch[x]) { x++; continue; }
    const startX = x;
    while (x < w && colMatch[x]) x++;
    const endX = x;
    if (!maxRunWidthPx || (endX - startX) <= maxRunWidthPx) {
      runs.push({ startX, endX, centerXPct: ((startX + endX) / 2 / w) * 100 });
    }
  }
  return runs;
}

function detectPlayheadRuns(imageData, w, h, colorBand) {
  const band = colorBand || { hue: PLAYHEAD_HUE_DEFAULT, hueTolerance: PLAYHEAD_HUE_TOLERANCE_DEFAULT, satMin: PLAYHEAD_SAT_MIN_DEFAULT };
  const isMatch = (r, g, b) => {
    const { h: hue, s: sat } = rgbToHsv(r, g, b);
    return sat >= band.satMin && hueDist(hue, band.hue) <= band.hueTolerance;
  };
  const runs = scanVerticalRuns(imageData, w, h, isMatch, 0.6, 14);
  return runs.map(r => ({ ...r, key: Math.round(r.centerXPct * 2) / 2 }));
}

function removePlayheadRuns(imageData, w, h, runs, excludedKeys, fillColor) {
  const fill = fillColor || { r: 255, g: 255, b: 255 };
  const excluded = new Set(excludedKeys || []);
  const d = imageData.data;
  for (const run of runs) {
    if (excluded.has(run.key)) continue;
    const x0 = Math.max(0, run.startX - 1), x1 = Math.min(w, run.endX + 1);
    for (let y = 0; y < h; y++) {
      for (let x = x0; x < x1; x++) {
        const i = (y * w + x) * 4;
        d[i] = fill.r; d[i + 1] = fill.g; d[i + 2] = fill.b; d[i + 3] = 255;
      }
    }
  }
}

// ---- bar-line pixel detection (feature 3) — suggestion only, never auto-applied ----
function detectBarLinesByPixels(imageData, w, h) {
  const isMatch = (r, g, b) => (0.299 * r + 0.587 * g + 0.114 * b) < 100;
  const runs = scanVerticalRuns(imageData, w, h, isMatch, 0.85, 6);
  return runs.map(r => r.centerXPct);
}

// ---- bar-number OCR (feature 2) ----
function extractTopStripCanvas(source, opts) {
  // source: an <img> (naturalWidth/naturalHeight) or a <canvas> (width/height) — either works
  opts = opts || {};
  const W = source.naturalWidth || source.width, H = source.naturalHeight || source.height;
  let stripTop, stripBottom;
  if (opts.staffTopPx != null) {
    // bar numbers sit just above the top staff line — use a band ending right at the detected
    // staff top, regardless of how much varying album-art/UI chrome sits above it in this capture
    const margin = opts.aboveMarginPx != null ? opts.aboveMarginPx : Math.round(H * 0.08);
    stripBottom = Math.max(1, Math.round(opts.staffTopPx));
    stripTop = Math.max(0, stripBottom - margin);
  } else {
    // fallback: fixed top percentage, used when staff-band detection failed
    stripTop = 0;
    stripBottom = Math.max(1, Math.round(H * (opts.heightPct || 0.15)));
  }
  const stripH = Math.max(1, stripBottom - stripTop);
  const scale = 3;
  const c = document.createElement('canvas');
  c.width = W * scale; c.height = stripH * scale;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(source, 0, stripTop, W, stripH, 0, 0, c.width, c.height);
  return c;
}

let _ocrWorkerPromise = null;
async function getOcrWorker() {
  if (!_ocrWorkerPromise) {
    _ocrWorkerPromise = Tesseract.createWorker('eng').then(async w => {
      await w.setParameters({ tessedit_char_whitelist: '0123456789' });
      return w;
    });
  }
  return _ocrWorkerPromise;
}

async function recognizeBarNumbers(stripCanvas, ocrWorker) {
  try {
    const { data } = await ocrWorker.recognize(stripCanvas);
    const words = (data.words || []);
    const candidates = [];
    for (const w of words) {
      const val = parseInt((w.text || '').trim(), 10);
      if (!Number.isFinite(val) || val < 0 || val > 999) continue;
      const bbox = w.bbox || {};
      const xPct = ((((bbox.x0 || 0) + (bbox.x1 || 0)) / 2) / stripCanvas.width) * 100;
      candidates.push({ value: val, xPct });
    }
    return { candidates };
  } catch (e) {
    return { candidates: [] };
  }
}

function validateBarNumberSequence(candidates) {
  const sorted = [...candidates].sort((a, b) => a.xPct - b.xPct);
  let best = [];
  for (let i = 0; i < sorted.length; i++) {
    let run = [sorted[i]];
    for (let j = i + 1; j < sorted.length; j++) {
      const gap = sorted[j].value - run[run.length - 1].value;
      if (gap >= 1 && gap <= 4) run.push(sorted[j]);
      else break;
    }
    if (run.length > best.length) best = run;
  }
  if (best.length < 2) return null;
  return { numbers: best.map(c => c.value), xPcts: best.map(c => c.xPct) };
}

// ---- horizontal overlap detection (feature 2) ----
function computeOverlapFromBarNumbers(seqA, seqB) {
  if (!seqA || !seqB) return null;
  const common = seqA.numbers.filter(n => seqB.numbers.includes(n));
  if (common.length === 0) return null;
  const firstCommon = Math.min(...common);
  const bIdx = seqB.numbers.indexOf(firstCommon);
  const cutBLeftPct = seqB.xPcts[bIdx];
  return { cutBLeftPct, seamBars: common };
}

// ---- TAB staff-band auto-detection ----
// Finds the actual Y-range of the 6 horizontal TAB staff lines, regardless of how much
// album art / playback-UI chrome surrounds them or how the capture was cropped — so overlap
// detection and bar-number OCR can compare/scan the part of the image that's actually stable
// across captures of the same content, instead of a fixed top-% guess.
function detectStaffBand(imageData, w, h) {
  const d = imageData.data;
  const inkRatio = new Float32Array(h);
  for (let y = 0; y < h; y++) {
    let dark = 0;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      if (lum < 140) dark++;
    }
    inkRatio[y] = dark / w;
  }
  // a real staff line spans almost the full width and is only a few px thick — this combination
  // is what separates it from a chord-box border (narrow) or bold title text (thick, uneven)
  const LINE_RATIO_MIN = 0.55;
  const MAX_LINE_THICKNESS = 4;
  const candidates = [];
  let y = 0;
  while (y < h) {
    if (inkRatio[y] < LINE_RATIO_MIN) { y++; continue; }
    const startY = y;
    while (y < h && inkRatio[y] >= LINE_RATIO_MIN) y++;
    const endY = y;
    if (endY - startY <= MAX_LINE_THICKNESS) candidates.push((startY + endY - 1) / 2);
  }
  if (candidates.length < 6) return null;

  const GAP_TOLERANCE = 0.25; // relative tolerance for "nearly evenly spaced"
  let best = null;
  for (let i = 0; i < candidates.length; i++) {
    for (let j = i + 1; j < candidates.length; j++) {
      const gap = candidates[j] - candidates[i];
      if (gap <= 0) continue;
      const chain = [candidates[i]];
      let ok = true;
      for (let k = 1; k < 6; k++) {
        const target = candidates[i] + gap * k;
        let closest = null, closestDiff = Infinity;
        for (const c of candidates) {
          const diff = Math.abs(c - target);
          if (diff < closestDiff) { closestDiff = diff; closest = c; }
        }
        if (closest === null || closestDiff > gap * GAP_TOLERANCE) { ok = false; break; }
        chain.push(closest);
      }
      if (!ok || chain.length !== 6) continue;
      const gaps = [];
      for (let k = 1; k < 6; k++) gaps.push(chain[k] - chain[k - 1]);
      const meanGap = gaps.reduce((a, b) => a + b, 0) / gaps.length;
      const variance = gaps.reduce((a, b) => a + (b - meanGap) * (b - meanGap), 0) / gaps.length;
      const confidence = 1 / (1 + variance);
      if (!best || confidence > best.confidence) {
        best = { staffTop: chain[0], staffBottom: chain[5], lineYs: chain, confidence };
      }
    }
  }
  return best;
}

function analyzeLumRow(canvas, opts) {
  opts = opts || {};
  const ctx = canvas.getContext('2d');
  const w = canvas.width;
  const yTop = opts.yTop != null ? Math.max(0, Math.round(opts.yTop)) : 0;
  const yBottom = opts.yBottom != null ? Math.min(canvas.height, Math.round(opts.yBottom)) : canvas.height;
  const h = Math.max(1, yBottom - yTop);
  const d = ctx.getImageData(0, yTop, w, h).data;
  const lum = new Float32Array(w * h);
  const bin = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) {
    const l = 0.299 * d[i * 4] + 0.587 * d[i * 4 + 1] + 0.114 * d[i * 4 + 2];
    lum[i] = l;
    bin[i] = l < 140 ? 1 : 0;
  }
  return { lum, bin, w, h };
}

// ---- uniform-border auto-crop ----
// Letterboxing/frame borders added by a screen-capture or photo (usually solid black or white,
// unbroken from the very edge) can otherwise get matched to each other as a "perfect overlap" by
// findOverlapByCorrelation, since they're maximally self-similar. Detected once per image and used
// for ALL downstream analysis (staff detection, overlap search, OCR) — but the final composited
// image still draws from the original, uncropped canvas; only the analysis coordinates are adjusted.
function detectContentRect(imageData, w, h) {
  const d = imageData.data;
  function rowVariance(y) {
    let sum = 0, sumSq = 0;
    for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4;
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      sum += lum; sumSq += lum * lum;
    }
    const mean = sum / w;
    return sumSq / w - mean * mean;
  }
  function colVariance(x) {
    let sum = 0, sumSq = 0;
    for (let y = 0; y < h; y++) {
      const i = (y * w + x) * 4;
      const lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
      sum += lum; sumSq += lum * lum;
    }
    const mean = sum / h;
    return sumSq / h - mean * mean;
  }
  const VARIANCE_THRESHOLD = 20;   // near-zero variance = a uniform-color row/column
  const MIN_BORDER_RUN = 6;        // require several unbroken uniform rows/cols before trusting it as a real border, not noise
  const MAX_BORDER_FRACTION = 0.25; // never trim more than this fraction from any one side, as a safety cap

  function scanEdge(size, statFn, forward) {
    const maxTrim = Math.floor(size * MAX_BORDER_FRACTION);
    let runStart = -1, trimTo = 0;
    for (let k = 0; k < maxTrim; k++) {
      const idx = forward ? k : (size - 1 - k);
      if (statFn(idx) < VARIANCE_THRESHOLD) {
        if (runStart === -1) runStart = k;
        if (k - runStart + 1 >= MIN_BORDER_RUN) trimTo = k + 1;
      } else {
        break; // a real border is unbroken from the edge — stop at the first non-uniform row/col
      }
    }
    return trimTo;
  }

  const top = scanEdge(h, rowVariance, true);
  const bottomTrim = scanEdge(h, rowVariance, false);
  const left = scanEdge(w, colVariance, true);
  const rightTrim = scanEdge(w, colVariance, false);
  const rect = { left, top, right: w - rightTrim, bottom: h - bottomTrim };

  // safety: never let this crop away most of the image (e.g. a genuinely blank/near-empty capture)
  if (rect.right - rect.left < w * 0.5 || rect.bottom - rect.top < h * 0.5) {
    return { left: 0, top: 0, right: w, bottom: h };
  }
  return rect;
}

function cropCanvasToRect(canvas, rect) {
  const w = rect.right - rect.left, h = rect.bottom - rect.top;
  const out = document.createElement('canvas');
  out.width = Math.max(1, w); out.height = Math.max(1, h);
  out.getContext('2d').drawImage(canvas, rect.left, rect.top, out.width, out.height, 0, 0, out.width, out.height);
  return out;
}

function findOverlapByCorrelation(canvasA, canvasB, opts) {
  opts = opts || {};
  const minOverlapPx = opts.minOverlapPx || 20;
  const maxOverlapPx = Math.min(opts.maxOverlapPx || 300, canvasA.width, canvasB.width);
  const step = opts.step || 4;

  // Compare only the actual TAB staff band when we know where it is — this is the part of the
  // image that's stable across captures of the same content; album art / playback UI / chord
  // diagrams above or below it vary capture-to-capture and would otherwise corrupt the match.
  // Falls back to the full canvas height when staff detection failed for either image.
  const rangeA = opts.staffBandA ? { yTop: opts.staffBandA.staffTop, yBottom: opts.staffBandA.staffBottom } : { yTop: 0, yBottom: canvasA.height };
  const rangeB = opts.staffBandB ? { yTop: opts.staffBandB.staffTop, yBottom: opts.staffBandB.staffBottom } : { yTop: 0, yBottom: canvasB.height };

  const binA = analyzeLumRow(canvasA, rangeA);
  const binB = analyzeLumRow(canvasB, rangeB);
  const h = Math.min(binA.h, binB.h);
  const sampleRows = 40;
  const rowStep = Math.max(1, Math.floor(h / sampleRows));

  // Score by Jaccard similarity of the INK pixels only (not raw agreement) — two mostly-blank/white
  // strips would otherwise "agree" almost everywhere by sharing background, producing a false-positive
  // high score even for genuinely unrelated images. Requiring real ink overlap avoids that.
  function scoreAt(overlapPx) {
    let inkAgree = 0, inkUnion = 0, samples = 0;
    let sumLum = 0, sumLumSq = 0, lumSamples = 0;
    for (let y = 0; y < h; y += rowStep) {
      for (let k = 0; k < overlapPx; k++) {
        const ax = canvasA.width - overlapPx + k;
        const bx = k;
        if (ax < 0 || ax >= canvasA.width || bx >= canvasB.width) continue;
        const av = binA.bin[y * binA.w + ax];
        const bv = binB.bin[y * binB.w + bx];
        samples++;
        if (av || bv) {
          inkUnion++;
          if (av && bv) inkAgree++;
        }
        const alum = binA.lum[y * binA.w + ax], blum = binB.lum[y * binB.w + bx];
        sumLum += alum + blum; sumLumSq += alum * alum + blum * blum; lumSamples += 2;
      }
    }
    // require a minimum ink DENSITY relative to the window size, not just a flat count — a flat
    // minimum can be trivially satisfied by a wide, sparse window and let a low-signal match through
    const MIN_INK_DENSITY = 0.03;
    if (samples === 0 || inkUnion < 15 || (inkUnion / samples) < MIN_INK_DENSITY) return null;
    // require real pixel variety in the compared window — a solid-color region (e.g. an uncropped
    // border, or a plain colored UI block) can satisfy the ink-density check above (100% "dark")
    // while carrying zero actual information; only a genuinely mixed ink/background region (real
    // notes, text, staff lines) should be trusted as a match signal
    const MIN_LUM_VARIANCE = 300;
    const meanLum = sumLum / lumSamples;
    const lumVariance = sumLumSq / lumSamples - meanLum * meanLum;
    if (lumVariance < MIN_LUM_VARIANCE) return null;
    return { overlapPx, score: inkAgree / inkUnion };
  }

  const scored = [];
  for (let overlapPx = minOverlapPx; overlapPx <= maxOverlapPx; overlapPx += step) {
    const s = scoreAt(overlapPx);
    if (s) scored.push(s);
  }
  if (scored.length === 0) return null;
  scored.sort((a, b) => b.score - a.score);
  let best = scored[0];

  // A coarse step (used for wide images, to keep the search affordable) can step right over a sharp,
  // narrow true peak — real content can have fine detail that only aligns within a couple of exact
  // pixels. Refine locally around the coarse best at step=1 so the reported offset is pixel-exact
  // rather than whatever coarse grid point happened to be sampled nearest to it.
  if (step > 1) {
    for (let overlapPx = Math.max(minOverlapPx, best.overlapPx - step); overlapPx <= Math.min(maxOverlapPx, best.overlapPx + step); overlapPx++) {
      const s = scoreAt(overlapPx);
      if (s && s.score > best.score) best = s;
    }
  }
  // NOTE: an earlier version also rejected matches whose best score was too close to a "far"
  // runner-up's score, to guard against ambiguous matches. That rule ended up rejecting genuinely
  // correct matches on real TAB content: the staff/bar lines repeat across the whole width, so
  // several unrelated offsets can legitimately score not-too-far-below the true best one just from
  // that repetition — that's expected structure, not ambiguity. The uniform-region false-positive
  // this was originally meant to catch (e.g. a border matching another border) is now caught earlier
  // and more precisely by MIN_LUM_VARIANCE above, so the confidence threshold alone is sufficient.
  const CONFIDENCE_THRESHOLD = 0.78;
  if (best.score < CONFIDENCE_THRESHOLD) return null;
  return best;
}

// ---- bar-slice regrouping ("한 줄에 몇 마디") ----
async function rebuildBarsPerRow(img, sortedMarkersXPct, barsPerRow) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const boundaries = [0, ...sortedMarkersXPct, 100].filter((v, i, arr) => arr.indexOf(v) === i).sort((a, b) => a - b);
  const slices = [];
  for (let i = 0; i < boundaries.length - 1; i++) {
    const sx = Math.round((boundaries[i] / 100) * W);
    const sw = Math.max(1, Math.round(((boundaries[i + 1] - boundaries[i]) / 100) * W));
    slices.push({ sx, sw });
  }
  const rows = [];
  for (let i = 0; i < slices.length; i += barsPerRow) rows.push(slices.slice(i, i + barsPerRow));
  const rowWidths = rows.map(row => row.reduce((s, sl) => s + sl.sw, 0));
  const outW = Math.max(1, ...rowWidths);
  const outH = H * rows.length;

  const canvas = document.createElement('canvas');
  canvas.width = outW; canvas.height = outH;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, outW, outH);
  rows.forEach((row, rowIdx) => {
    let x = 0;
    for (const sl of row) {
      ctx.drawImage(img, sl.sx, 0, sl.sw, H, x, rowIdx * H, sl.sw, H);
      x += sl.sw;
    }
  });
  return canvas;
}

// ---- stitch orchestration (feature 2) ----
function loadFileAsImage(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = ev => {
      const img = new Image();
      img.onload = () => resolve(img);
      img.onerror = reject;
      img.src = ev.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function canvasFromImage(img) {
  const c = document.createElement('canvas');
  c.width = img.naturalWidth; c.height = img.naturalHeight;
  c.getContext('2d').drawImage(img, 0, 0);
  return c;
}

async function stitchImages(files, opts, onProgress) {
  opts = opts || {};
  const total = files.length;
  const imgs = await Promise.all(files.map(f => loadFileAsImage(f)));
  let canvases = imgs.map(img => canvasFromImage(img));

  if (opts.playheadRemove) {
    canvases = canvases.map(c => {
      const ctx = c.getContext('2d');
      const imageData = ctx.getImageData(0, 0, c.width, c.height);
      const runs = detectPlayheadRuns(imageData, c.width, c.height, opts.playheadColor);
      removePlayheadRuns(imageData, c.width, c.height, runs, [], { r: 255, g: 255, b: 255 });
      ctx.putImageData(imageData, 0, 0);
      return c;
    });
  }

  // Auto-crop any uniform-color border (letterboxing from the capture/photo) once per image, BEFORE
  // any analysis — staff detection, overlap search, and OCR all run on these content-only canvases
  // so a border can never get mistaken for real content. The final composite still draws from the
  // original uncropped canvases (see cutLeftPx conversion back to original coordinates below).
  const contentRects = canvases.map(c => {
    const imageData = c.getContext('2d').getImageData(0, 0, c.width, c.height);
    return detectContentRect(imageData, c.width, c.height);
  });
  const contentCanvases = canvases.map((c, i) => cropCanvasToRect(c, contentRects[i]));

  // Detect each image's actual TAB staff-line band ONCE and reuse it for both bar-number OCR and
  // overlap detection below — this is what makes both steps robust to captures where album art /
  // playback-UI chrome takes up a different proportion of the image each time.
  const staffBands = contentCanvases.map(c => {
    const imageData = c.getContext('2d').getImageData(0, 0, c.width, c.height);
    return detectStaffBand(imageData, c.width, c.height);
  });
  // staffBands[i].staffTop is in contentCanvases[i]'s coordinate space; this converts it back to the
  // original (uncropped) canvas's coordinate space, needed wherever we composite from the original.
  function originalStaffTop(i) {
    const band = staffBands[i];
    return band ? contentRects[i].top + band.staffTop : null;
  }

  const ocrResults = [];
  if (total > 1) {
    const worker = await getOcrWorker();
    for (let i = 0; i < contentCanvases.length; i++) {
      onProgress && onProgress({ stage: 'ocr', i: i + 1, total });
      // OCR the (possibly playhead-cleaned, border-cropped) canvas's bar-number strip
      const band = staffBands[i];
      // scale the "how far above the staff" margin to the staff's OWN line spacing rather than a
      // fraction of the whole image — the surrounding UI chrome height has nothing to do with how
      // far bar numbers sit above the staff, but the staff's own line spacing does
      const stripFromCanvas = band
        ? extractTopStripCanvas(contentCanvases[i], {
            staffTopPx: band.staffTop,
            aboveMarginPx: Math.max(40, Math.round(((band.staffBottom - band.staffTop) / 5) * 3)),
          })
        : extractTopStripCanvas(contentCanvases[i], { heightPct: 0.15 });
      const { candidates } = await recognizeBarNumbers(stripFromCanvas, worker);
      ocrResults[i] = validateBarNumberSequence(candidates);
    }
  }

  const seams = [];
  for (let i = 0; i < canvases.length - 1; i++) {
    onProgress && onProgress({ stage: 'seam', i: i + 1, total: canvases.length - 1 });
    const A = ocrResults[i], B = ocrResults[i + 1];
    const barOverlap = computeOverlapFromBarNumbers(A, B);
    if (barOverlap) {
      // cutBLeftPct is a % of contentCanvases[i+1]'s width — convert to an absolute pixel offset in
      // the ORIGINAL (uncropped) canvas B, since that's what actually gets composited
      const contentWidthB = contentRects[i + 1].right - contentRects[i + 1].left;
      const cutLeftPx = contentRects[i + 1].left + Math.round((barOverlap.cutBLeftPct / 100) * contentWidthB);
      seams.push({ i, method: 'ocr', cutLeftPx });
      continue;
    }
    const narrowerContentWidth = Math.min(contentCanvases[i].width, contentCanvases[i + 1].width);
    // search up to 70% of the narrower image's (content-only) width — a fixed small cap would miss
    // genuinely large overlaps from tightly-spaced scroll captures. step is kept at 1 (exhaustive)
    // rather than widened for large images: real TAB content (thin staff/bar lines, small digits)
    // can have a very sharp true-alignment peak that a coarser step risks stepping right over,
    // locking onto an unrelated offset instead — verified this actually happens while testing this
    // fix. The search is cheap enough in absolute terms (milliseconds) that there's no real need to
    // trade accuracy for it, especially next to the OCR pass this only runs alongside.
    const maxOverlapPx = Math.max(20, Math.round(narrowerContentWidth * 0.7));
    const step = 1;
    const pxOverlap = findOverlapByCorrelation(contentCanvases[i], contentCanvases[i + 1], {
      staffBandA: staffBands[i], staffBandB: staffBands[i + 1], maxOverlapPx, step,
    });
    if (pxOverlap) {
      // pxOverlap.overlapPx is in contentCanvases[i+1]'s own coordinate space (counted from its own
      // left edge) — convert to the original canvas B's coordinate space the same way as above
      const cutLeftPx = contentRects[i + 1].left + pxOverlap.overlapPx;
      seams.push({ i, method: 'pixel', cutLeftPx });
      continue;
    }
    seams.push({ i, method: 'unresolved' });
  }

  function resolvedResult(seamChoices) {
    seamChoices = seamChoices || {};
    const parts = [{ canvas: canvases[0], cutLeftPx: 0, srcIndex: 0 }];
    const seamMethods = [];
    const warnings = [];
    for (let i = 0; i < seams.length; i++) {
      const seam = seams[i];
      const nextCanvas = canvases[i + 1];
      if (seam.method === 'ocr' || seam.method === 'pixel') {
        // seam.cutLeftPx is already converted to the ORIGINAL (uncropped) canvas B's coordinate
        // space — see the border/content-crop conversion where each seam was built above
        parts.push({ canvas: nextCanvas, cutLeftPx: seam.cutLeftPx, srcIndex: i + 1 });
        seamMethods.push(seam.method);
      } else {
        const choice = seamChoices[i] || 'concat';
        if (choice === 'concat') {
          parts.push({ canvas: nextCanvas, cutLeftPx: 0, srcIndex: i + 1 });
          seamMethods.push('concat');
          warnings.push('이미지 ' + (i + 1) + '↔' + (i + 2) + ': 겹침을 찾지 못해 그대로 이어붙임');
        } else {
          parts.push({ canvas: nextCanvas, cutLeftPx: 0, srcIndex: i + 1 });
          seamMethods.push('split');
          warnings.push('이미지 ' + (i + 1) + '↔' + (i + 2) + ': 겹침을 찾지 못해 개별 이미지로 분리됨');
        }
      }
    }
    const splitAfter = new Set();
    Object.keys(seamChoices).forEach(k => { if (seamChoices[k] === 'split') splitAfter.add(Number(k)); });

    const groups = [[parts[0]]];
    for (let i = 1; i < parts.length; i++) {
      if (splitAfter.has(i - 1)) groups.push([parts[i]]);
      else groups[groups.length - 1].push(parts[i]);
    }

    const finalCanvases = groups.map(group => {
      // Captures of the same content can have very different album-art/playback-UI chrome heights
      // above the staff, so naively drawing each segment at y=0 would leave the actual TAB lines
      // jumping up/down at every seam. Align every segment's staff band to the first segment's
      // (using the same staffBands already computed above — no extra detection work here), falling
      // back to y=0 alignment for any segment whose staff band wasn't detected.
      const refTop = originalStaffTop(group[0].srcIndex);
      const offsets = group.map(p => {
        const t = originalStaffTop(p.srcIndex);
        return (refTop != null && t != null) ? (refTop - t) : 0;
      });
      const minOffset = Math.min(0, ...offsets);
      const maxOffset = Math.max(0, ...offsets);
      let w = 0;
      group.forEach((p, idx) => { w += (idx === 0 ? p.canvas.width : (p.canvas.width - p.cutLeftPx)); });
      const h = Math.max(...group.map((p, idx) => p.canvas.height + offsets[idx])) - minOffset;

      const out = document.createElement('canvas');
      out.width = Math.max(1, w); out.height = Math.max(1, Math.round(h));
      const ctx = out.getContext('2d');
      ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, out.width, out.height);
      let x = 0;
      group.forEach((p, idx) => {
        const cutLeftPx = idx === 0 ? 0 : p.cutLeftPx;
        const sw = p.canvas.width - cutLeftPx;
        const y = Math.round(offsets[idx] - minOffset);
        ctx.drawImage(p.canvas, cutLeftPx, 0, sw, p.canvas.height, x, y, sw, p.canvas.height);
        x += sw;
      });
      return out;
    });

    return { canvases: finalCanvases, seamMethods, warnings };
  }

  const unresolvedPairs = seams.filter(s => s.method === 'unresolved').map(s => ({ indexA: s.i, indexB: s.i + 1 }));

  return { resolvedResult, seams, unresolvedPairs, sourceCount: total };
}

function resolvedSrc(item) {
  return (item.barLayout && item.barLayout.appliedSrc) || item.src;
}

function drawProcessed(canvas, img, s) {
  const W = img.naturalWidth, H = img.naturalHeight;
  const cropTop = clampPct(s.cropTop), cropBottom = clampPct(s.cropBottom);
  const cropLeft = clampPct(s.cropLeft), cropRight = clampPct(s.cropRight);
  const sx = Math.floor(W * cropLeft / 100);
  const sy = Math.floor(H * cropTop / 100);
  const sw = Math.max(1, Math.floor(W * (100 - cropLeft - cropRight) / 100));
  const sh = Math.max(1, Math.floor(H * (100 - cropTop - cropBottom) / 100));
  canvas.width = sw; canvas.height = sh;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  let playheadRuns = [];
  if (s.playheadRemove) {
    const imageData = ctx.getImageData(0, 0, sw, sh);
    playheadRuns = detectPlayheadRuns(imageData, sw, sh, s.playheadColor);
    const excluded = s.playheadExcluded || [];
    removePlayheadRuns(imageData, sw, sh, playheadRuns, excluded, { r: 255, g: 255, b: 255 });
    ctx.putImageData(imageData, 0, 0);
  }
  if (s.removeBg) {
    const imageData = ctx.getImageData(0, 0, sw, sh);
    applyThreshold(imageData, s.threshold, s.invert, s.softness || 0);
    if (s.despeckle) despeckleBinary(imageData, sw, sh, s.despeckleSize || 0);
    ctx.putImageData(imageData, 0, 0);
  }
  return { playheadRuns };
}

function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = src;
  });
}

function effectiveImageSettings(item, defaults) {
  const o = item.override;
  const playheadExcluded = item.playheadExcluded || [];
  if (o) {
    return {
      removeBg: o.removeBg, invert: o.invert,
      threshold: o.threshold, softness: o.softness,
      despeckle: o.despeckle, despeckleSize: o.despeckleSize,
      playheadRemove: o.playheadRemove, playheadColor: o.playheadColor, playheadExcluded,
      cropTop: o.cropTop, cropBottom: o.cropBottom, cropLeft: o.cropLeft, cropRight: o.cropRight,
    };
  }
  return {
    removeBg: defaults.removeBg,
    invert: item.invert,
    threshold: defaults.threshold,
    softness: defaults.softness,
    despeckle: defaults.despeckle,
    despeckleSize: defaults.despeckleSize,
    playheadRemove: defaults.playheadRemove, playheadColor: defaults.playheadColor, playheadExcluded,
    cropTop: defaults.cropTop, cropBottom: defaults.cropBottom,
    cropLeft: defaults.cropLeft, cropRight: defaults.cropRight,
  };
}

async function composeScore(items, title, W, opts) {
  opts = opts || {};
  const defaults = opts.defaults || {};
  const scale = W / (opts.referenceWidth || 780);
  const PAD = Math.round(50 * scale);
  const titleH = Math.round(90 * scale);
  const gapAfterImage = Math.round((opts.imageGap != null ? opts.imageGap : 18) * scale);
  const titleFontPx = Math.max(10, Math.round((opts.titleFontSize || 44) * scale));
  const titleFont = 'bold ' + titleFontPx + 'px serif';
  const lyricFontPx = Math.max(8, Math.round((opts.lyricFontSize || 26) * scale));
  const lyricFont = lyricFontPx + 'px Georgia, "Noto Serif KR", serif';
  const lyricLineH = Math.round(lyricFontPx * 1.3);
  const defaultLyricRatio = (opts.lyricAreaHeight != null ? opts.lyricAreaHeight : 90) / (opts.referenceWidth || 780);

  const processed = [];
  for (const it of items) {
    const img = await loadImage(resolvedSrc(it));
    const off = document.createElement('canvas');
    drawProcessed(off, img, effectiveImageSettings(it, defaults));
    const scaledH = Math.round(off.height * W / off.width);
    const tags = ((it.lyrics && it.lyrics.tags) || []).filter(t => (t.text || '').trim() !== '');
    const ratio = (it.lyrics && it.lyrics.areaHeightRatio != null) ? it.lyrics.areaHeightRatio : defaultLyricRatio;
    const laneH = tags.length > 0 ? Math.max(lyricLineH, Math.round(ratio * W)) : 0;
    processed.push({ canvas: off, scaledH, tags, laneH });
  }

  let totalH = PAD + titleH;
  for (const p of processed) totalH += p.scaledH + p.laneH + gapAfterImage;
  totalH += PAD;

  const canvas = document.createElement('canvas');
  canvas.width = W; canvas.height = Math.max(Math.round(totalH), titleH + PAD * 2);
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  let y = PAD;
  ctx.fillStyle = '#1a1a1a';
  ctx.textAlign = 'center';
  ctx.font = titleFont;
  ctx.fillText(title.trim() || '제목 없음', W / 2, y + Math.round(titleH * 0.55));
  y += titleH;

  ctx.textAlign = 'left';
  for (const p of processed) {
    ctx.drawImage(p.canvas, 0, y, W, p.scaledH);
    y += p.scaledH;
    if (p.tags.length > 0) {
      ctx.font = lyricFont;
      ctx.fillStyle = '#1a1a1a';
      ctx.textBaseline = 'middle';
      for (const t of p.tags) {
        const tx = Math.min(W - 4, Math.max(4, (t.xPct / 100) * W));
        const half = lyricLineH / 2;
        const cy = y + Math.min(p.laneH - half, Math.max(half, (t.yPct / 100) * p.laneH));
        ctx.fillText(t.text, tx, cy);
      }
      ctx.textBaseline = 'alphabetic';
      y += p.laneH;
    }
    y += gapAfterImage;
  }
  return canvas;
}

const ImageBlock = React.memo(function ImageBlock({ item, index, total, defaults, lyricFontSize, defaultLyricAreaHeight, onChange, onDelete, onMove }) {
  const canvasRef = useRef(null);
  const imgRef = useRef(null);
  const laneRef = useRef(null);
  const measureCtxRef = useRef(null);
  const [advanced, setAdvanced] = useState(!!item.override);
  const [laneWidth, setLaneWidth] = useState(700);
  const [naturalRatio, setNaturalRatio] = useState(null);
  const [playheadRuns, setPlayheadRuns] = useState([]);
  const [pickingColor, setPickingColor] = useState(false);
  const [barEditOpen, setBarEditOpen] = useState(!!item.stitchMeta);
  const [barsPerRowInput, setBarsPerRowInput] = useState((item.barLayout && item.barLayout.barsPerRow) || '');
  const [barLayoutBusy, setBarLayoutBusy] = useState(false);

  const eff = effectiveImageSettings(item, defaults);
  const resolvedItemSrc = resolvedSrc(item);

  useEffect(() => {
    let active = true;
    loadImage(resolvedItemSrc).then(img => {
      if (!active) return;
      imgRef.current = img;
      setNaturalRatio(img.naturalHeight / img.naturalWidth);
      redraw();
    });
    return () => { active = false; };
  }, [resolvedItemSrc]);

  useEffect(() => { redraw(); }, [item, defaults]);

  useEffect(() => {
    if (laneRef.current) setLaneWidth(laneRef.current.offsetWidth || 700);
  }, []);

  function redraw() {
    if (!imgRef.current || !canvasRef.current) return;
    const result = drawProcessed(canvasRef.current, imgRef.current, effectiveImageSettings(item, defaults));
    setPlayheadRuns((result && result.playheadRuns) || []);
  }

  function updateOverride(patch) {
    const base = item.override || eff;
    onChange({ ...item, override: { ...base, ...patch } });
  }
  function enableAdvanced() {
    setAdvanced(true);
    if (!item.override) onChange({ ...item, override: { ...eff } });
  }
  function clearOverride() {
    setAdvanced(false);
    onChange({ ...item, override: null });
  }

  function togglePlayheadExcluded(key) {
    const cur = item.playheadExcluded || [];
    const next = cur.includes(key) ? cur.filter(k => k !== key) : [...cur, key];
    onChange({ ...item, playheadExcluded: next });
  }

  function startColorPick() {
    setPickingColor(true);
  }

  function handleCanvasClick(e) {
    if (!pickingColor || !canvasRef.current || !imgRef.current) return;
    const canvas = canvasRef.current;
    const rect = canvas.getBoundingClientRect();
    const xPx = ((e.clientX - rect.left) / rect.width) * canvas.width;
    const yPx = ((e.clientY - rect.top) / rect.height) * canvas.height;
    // sample from a crop-only render of the ORIGINAL image (no bg-removal/threshold applied yet),
    // since the displayed canvas may already be thresholded to black/white, which would destroy
    // the exact color info the eyedropper needs — especially when default detection missed it
    const img = imgRef.current;
    const W = img.naturalWidth, H = img.naturalHeight;
    const cropTop = clampPct(eff.cropTop), cropBottom = clampPct(eff.cropBottom);
    const cropLeft = clampPct(eff.cropLeft), cropRight = clampPct(eff.cropRight);
    const sx = Math.floor(W * cropLeft / 100), sy = Math.floor(H * cropTop / 100);
    const sw = Math.max(1, Math.floor(W * (100 - cropLeft - cropRight) / 100));
    const sh = Math.max(1, Math.floor(H * (100 - cropTop - cropBottom) / 100));
    const rawCanvas = document.createElement('canvas');
    rawCanvas.width = sw; rawCanvas.height = sh;
    rawCanvas.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
    const imageData = rawCanvas.getContext('2d').getImageData(0, 0, sw, sh);
    const sampled = sampleColorAtPoint(imageData, sw, sh, xPx, yPx);
    const color = { hue: sampled.hue, hueTolerance: PLAYHEAD_HUE_TOLERANCE_DEFAULT, satMin: Math.max(0.15, sampled.sat - 0.15) };
    updateOverride({ playheadColor: color });
    setPickingColor(false);
  }

  const barLayout = item.barLayout;
  const barMarkers = (barLayout && barLayout.markers) || [];

  function setBarLayout(patch) {
    onChange({ ...item, barLayout: { markers: [], barsPerRow: null, appliedSrc: null, ...(item.barLayout || {}), ...patch } });
  }
  function updateMarker(id, patch) {
    setBarLayout({ markers: barMarkers.map(m => m.id === id ? { ...m, ...patch } : m) });
  }
  function addMarker() {
    const id = Date.now() + '_' + Math.random().toString(36).slice(2);
    setBarLayout({ markers: [...barMarkers, { id, xPct: 50, source: 'manual' }] });
  }
  function deleteMarker(id) {
    setBarLayout({ markers: barMarkers.filter(m => m.id !== id) });
  }
  function runPixelDetection() {
    if (!canvasRef.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext('2d');
    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const xPcts = detectBarLinesByPixels(imageData, canvas.width, canvas.height);
    const newMarkers = xPcts.map(xPct => ({ id: Date.now() + '_' + Math.random().toString(36).slice(2), xPct, source: 'pixel' }));
    setBarLayout({ markers: [...barMarkers, ...newMarkers] });
  }
  async function applyBarsPerRow() {
    const n = Math.max(1, Number(barsPerRowInput) || 0);
    if (!n || barMarkers.length === 0 || !imgRef.current) return;
    setBarLayoutBusy(true);
    try {
      const sorted = [...barMarkers.map(m => m.xPct)].sort((a, b) => a - b);
      const rawImg = await loadImage(item.src);
      const out = await rebuildBarsPerRow(rawImg, sorted, n);
      setBarLayout({ barsPerRow: n, appliedSrc: out.toDataURL('image/png') });
    } finally {
      setBarLayoutBusy(false);
    }
  }
  function clearBarLayout() {
    onChange({ ...item, barLayout: null });
    setBarsPerRowInput('');
  }
  function startMarkerDrag(e, markerId) {
    e.preventDefault();
    e.stopPropagation();
    const rect = canvasRef.current.getBoundingClientRect();
    let moved = false;
    const startX = e.clientX;
    function onMove(ev) {
      if (Math.abs(ev.clientX - startX) > 2) moved = true;
      let xPct = ((ev.clientX - rect.left) / rect.width) * 100;
      xPct = Math.min(100, Math.max(0, xPct));
      updateMarker(markerId, { xPct });
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }

  const lyricsObj = item.lyrics || { tags: [], areaHeightRatio: null };
  const tags = lyricsObj.tags || [];
  const laneHeightRatio = lyricsObj.areaHeightRatio != null ? lyricsObj.areaHeightRatio : (defaultLyricAreaHeight / (laneWidth || 700));
  const laneHeight = Math.round(laneHeightRatio * (laneWidth || 700));
  const refStripHeight = naturalRatio ? Math.round((laneWidth || 700) * naturalRatio * 0.3) : 0;

  function updateLyrics(patch) {
    onChange({ ...item, lyrics: { ...lyricsObj, ...patch } });
  }
  function addTag() {
    const id = Date.now() + '_' + Math.random().toString(36).slice(2);
    updateLyrics({ tags: [...tags, { id, text: '가사', xPct: 8, yPct: Math.min(90, 15 + tags.length * 20) }] });
  }
  function updateTag(id, patch) {
    updateLyrics({ tags: tags.map(t => t.id === id ? { ...t, ...patch } : t) });
  }
  function deleteTag(id) {
    updateLyrics({ tags: tags.filter(t => t.id !== id) });
  }
  function startDrag(e, tagId) {
    e.preventDefault();
    e.stopPropagation();
    const rect = laneRef.current.getBoundingClientRect();
    function onMove(ev) {
      let xPct = ((ev.clientX - rect.left) / rect.width) * 100;
      let yPct = ((ev.clientY - rect.top) / rect.height) * 100;
      xPct = Math.min(100, Math.max(0, xPct));
      yPct = Math.min(100, Math.max(0, yPct));
      updateTag(tagId, { xPct, yPct });
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  function startResize(e) {
    e.preventDefault();
    e.stopPropagation();
    const startY = e.clientY;
    const startH = laneHeight;
    const w = (laneRef.current && laneRef.current.offsetWidth) || laneWidth || 700;
    function onMove(ev) {
      const newH = Math.max(20, Math.round(startH + (ev.clientY - startY)));
      updateLyrics({ areaHeightRatio: newH / w });
    }
    function onUp() {
      window.removeEventListener('pointermove', onMove);
      window.removeEventListener('pointerup', onUp);
    }
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
  }
  function sizeInput(el, text) {
    if (!el) return;
    if (!measureCtxRef.current) measureCtxRef.current = document.createElement('canvas').getContext('2d');
    const mctx = measureCtxRef.current;
    mctx.font = lyricFontSize + 'px Georgia, "Noto Serif KR", serif';
    const w = mctx.measureText(text || ' ').width;
    el.style.width = Math.max(20, w + 12) + 'px';
  }

  return (
    <div className="block">
      <div className="block-head">
        <span>TAB 이미지 {index + 1}</span>
        <div className="block-actions">
          <button className="icon-btn" onClick={() => onMove(-1)} disabled={index === 0}>위</button>
          <button className="icon-btn" onClick={() => onMove(1)} disabled={index === total - 1}>아래</button>
          <button className="icon-btn" onClick={onDelete}>삭제</button>
        </div>
      </div>

      <div className={pickingColor ? 'canvas-overlay-wrap picking' : 'canvas-overlay-wrap'}>
        <canvas ref={canvasRef} className="preview" onClick={handleCanvasClick} />
        {eff.playheadRemove && playheadRuns.length > 0 && (
          <div className="playhead-overlay">
            {playheadRuns.map(run => {
              const excluded = (item.playheadExcluded || []).includes(run.key);
              return (
                <div key={run.key}
                  className={excluded ? 'playhead-run-highlight excluded' : 'playhead-run-highlight'}
                  style={{ left: run.centerXPct + '%', width: '10px', marginLeft: '-5px' }}
                  title={excluded ? '클릭하면 다시 제거 대상에 포함' : '클릭하면 제거 대상에서 제외'}
                  onClick={() => togglePlayheadExcluded(run.key)} />
              );
            })}
          </div>
        )}
        {barEditOpen && (
          <div className="barline-overlay">
            {barMarkers.map(m => (
              <div key={m.id} className="bar-marker" style={{ left: m.xPct + '%' }} onPointerDown={e => startMarkerDrag(e, m.id)}>
                <button className="bar-marker-del" onPointerDown={e => e.stopPropagation()} onClick={() => deleteMarker(m.id)}>×</button>
              </div>
            ))}
          </div>
        )}
      </div>

      <div className="controls">
        {!advanced ? (
          <div className="adv-toggle-row">
            <span>이 이미지: 기본 설정을 따르는 중</span>
            <button className="icon-btn" onClick={enableAdvanced}>고급 설정 사용</button>
          </div>
        ) : (
          <React.Fragment>
            <div className="adv-toggle-row">
              <span>이 이미지만의 고급 설정 사용 중</span>
              <button className="icon-btn" onClick={clearOverride}>기본값 따르기로 되돌리기</button>
            </div>
            <label>
              <input type="checkbox" checked={eff.removeBg} onChange={e => updateOverride({ removeBg: e.target.checked })} />
              배경 제거 (사진 배경 → 흰색)
            </label>
            {eff.removeBg && (
              <React.Fragment>
                <label>
                  <input type="checkbox" checked={eff.invert} onChange={e => updateOverride({ invert: e.target.checked })} />
                  어두운 사진 배경 (밝은 글씨/선을 검정으로 변환)
                </label>
                <div>
                  <div className="slider-label">배경 제거 강도 ({eff.threshold})</div>
                  <input type="range" min="0" max="255" step="1" value={eff.threshold}
                    onChange={e => updateOverride({ threshold: Number(e.target.value) })} />
                </div>
                <div>
                  <div className="slider-label">부드러운 경계 — 안티앨리어싱 유지 ({eff.softness})</div>
                  <input type="range" min="0" max="60" step="1" value={eff.softness}
                    onChange={e => updateOverride({ softness: Number(e.target.value) })} />
                </div>
                <label>
                  <input type="checkbox" checked={eff.despeckle} onChange={e => updateOverride({ despeckle: e.target.checked })} />
                  잡티(고립 노이즈) 제거
                </label>
                {eff.despeckle && (
                  <div>
                    <div className="slider-label">제거할 잡티 크기 ({eff.despeckleSize}px 이하)</div>
                    <input type="range" min="1" max="12" step="1" value={eff.despeckleSize}
                      onChange={e => updateOverride({ despeckleSize: Number(e.target.value) })} />
                  </div>
                )}
              </React.Fragment>
            )}
            <label>
              <input type="checkbox" checked={!!eff.playheadRemove} onChange={e => updateOverride({ playheadRemove: e.target.checked })} />
              재생 표시줄 제거 (세로로 긴 색상 커서 줄 감지 후 제거)
            </label>
            {eff.playheadRemove && (
              <div className="eyedrop-row">
                <button type="button" className="icon-btn" onClick={startColorPick}>
                  {pickingColor ? '이미지에서 클릭하세요...' : '스포이드로 색 지정'}
                </button>
                <span className="color-swatch" style={{
                  background: 'hsl(' + (eff.playheadColor ? eff.playheadColor.hue : PLAYHEAD_HUE_DEFAULT) + ', 80%, 50%)'
                }} />
                <span style={{ fontSize: '11.5px', color: 'var(--text2)' }}>
                  {eff.playheadColor ? '지정된 색 사용 중' : '기본 추정 색(파란/청록 계열) 사용 중'}
                </span>
              </div>
            )}
            {eff.playheadRemove && playheadRuns.length > 0 && (
              <div className="save-msg">
                빨간 표시가 제거 대상입니다. 실제 마디선이라면 클릭해서 제외하세요 — 체크 해제하면 언제든 원본으로 즉시 복구됩니다.
              </div>
            )}
            <div className="grid2">
              <div>
                <div className="slider-label">위쪽 자르기 ({eff.cropTop}%)</div>
                <input type="range" min="0" max="40" step="1" value={eff.cropTop}
                  onChange={e => updateOverride({ cropTop: Number(e.target.value) })} />
              </div>
              <div>
                <div className="slider-label">아래쪽 자르기 ({eff.cropBottom}%)</div>
                <input type="range" min="0" max="40" step="1" value={eff.cropBottom}
                  onChange={e => updateOverride({ cropBottom: Number(e.target.value) })} />
              </div>
              <div>
                <div className="slider-label">왼쪽 자르기 ({eff.cropLeft}%)</div>
                <input type="range" min="0" max="40" step="1" value={eff.cropLeft}
                  onChange={e => updateOverride({ cropLeft: Number(e.target.value) })} />
              </div>
              <div>
                <div className="slider-label">오른쪽 자르기 ({eff.cropRight}%)</div>
                <input type="range" min="0" max="40" step="1" value={eff.cropRight}
                  onChange={e => updateOverride({ cropRight: Number(e.target.value) })} />
              </div>
            </div>
          </React.Fragment>
        )}
      </div>

      <div className="lyric-section">
        <div className="lyric-head-mini">
          <span>가사 배치 — 손잡이(⠿)로 위치 이동, 하단 막대로 입력 영역 높이 조절 (이미지 하단 30%는 참고용 미리보기)</span>
          <button className="icon-btn" onClick={addTag}>+ 가사 추가</button>
        </div>
        <div className="lane-wrap">
          {refStripHeight > 0 && (
            <div className="lane-ref-strip-standalone" style={{ height: refStripHeight + 'px', backgroundImage: 'url(' + item.src + ')' }} />
          )}
          <div className={refStripHeight > 0 ? 'lyric-lane' : 'lyric-lane no-ref'} ref={laneRef} style={{ height: laneHeight + 'px' }}>
            {tags.length === 0 && (
              <div className="lane-empty">"+ 가사 추가"로 가사를 추가한 뒤 원하는 위치로 끌어서 놓으세요.</div>
            )}
            {tags.map(t => (
              <div className="lyric-tag" key={t.id} style={{ left: t.xPct + '%', top: t.yPct + '%', fontSize: lyricFontSize + 'px' }}>
                <span className="tag-handle" onPointerDown={e => startDrag(e, t.id)}>⠿</span>
                <div className="lyric-tag-row">
                  <input
                    ref={el => sizeInput(el, t.text)}
                    value={t.text}
                    onChange={e => { updateTag(t.id, { text: e.target.value }); sizeInput(e.target, e.target.value); }}
                  />
                  <button className="tag-del" onClick={() => deleteTag(t.id)}>×</button>
                </div>
              </div>
            ))}
            <div className="lane-resize-handle" onPointerDown={startResize} title="드래그해서 입력 영역 높이 조절" />
          </div>
        </div>
      </div>

      <div className="barline-section">
        <div className="lyric-head-mini">
          <span>마디선 감지 및 재배열 (선택 사항 — 감지 결과는 제안일 뿐이며, 직접 조정 후 사용하세요)</span>
          <button className="icon-btn" onClick={() => setBarEditOpen(o => !o)}>{barEditOpen ? '접기' : '펼치기'}</button>
        </div>
        {barEditOpen && (
          <div className="controls">
            <div className="stitch-progress-row">
              <button className="icon-btn" onClick={runPixelDetection}>마디선 자동 감지</button>
              <button className="icon-btn" onClick={addMarker}>+ 마디선 추가</button>
              {barLayout && <button className="icon-btn" onClick={clearBarLayout}>원본으로 되돌리기</button>}
            </div>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <div className="slider-label" style={{ margin: 0 }}>한 줄에 몇 마디</div>
              <input type="number" min="1" step="1" value={barsPerRowInput}
                style={{ width: '70px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
                onChange={e => setBarsPerRowInput(e.target.value)}
                onBlur={applyBarsPerRow}
                onKeyDown={e => { if (e.key === 'Enter') { e.target.blur(); } }} />
              {barLayoutBusy && <span className="save-msg">재배열 중...</span>}
            </div>
