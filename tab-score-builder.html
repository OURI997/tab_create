    const imageLeftPx = rect.left + rect.width * marginFrac;
    const imageWidthPx = rect.width * (1 - 2 * marginFrac);
    return ((clientX - imageLeftPx) / Math.max(1, imageWidthPx)) * 100;
  }
  function snapXPct(rawXPct) {
    if (!noteColumns || noteColumns.length === 0) return { xPct: rawXPct, snapped: false };
    let best = null, bestDist = Infinity;
    for (const c of noteColumns) {
      const d = Math.abs(c - rawXPct);
      if (d < bestDist) { bestDist = d; best = c; }
    }
    if (best !== null && bestDist <= SNAP_TOLERANCE_PCT) return { xPct: best, snapped: true };
    return { xPct: rawXPct, snapped: false };
  }

  // Plays a short clip around `timeSec`, restarting from scratch every time it's called — the rule
  // requested for every placement/reselect/nudge: stop whatever was playing and replay the new
  // position's own 0.5s-before .. 2s-after window from its start, not just resume/extend a stream.
  // A placement immediately followed by a reselect/nudge (or several nudges in a row) calls this
  // repeatedly in quick succession — each call's own stop-watcher must recognize it's been
  // superseded and stop silently instead of pausing playback out from under whichever call is
  // newest, which is what previewGenRef (bumped on every call, checked inside the watcher)
  // prevents. The stop-watcher itself listens for the video's own 'timeupdate' rather than
  // polling via requestAnimationFrame — rAF is throttled/paused for a backgrounded or unfocused
  // tab, which let a preview silently run past its intended stop point and on to the end of the
  // whole video when this used rAF; 'timeupdate' keeps firing as long as the video is actually
  // playing, regardless of tab visibility.
  function playSnippetAround(timeSec) {
    const video = videoElRef.current;
    if (!video) return;
    const myGen = ++previewGenRef.current;
    const t = Math.max(0, timeSec);
    const seekTo = Math.max(0, t - PREVIEW_LEAD_SEC);
    const stopAt = t + PREVIEW_TAIL_SEC;
    video.pause();
    // Wait for the seek to actually land before calling play() — starting playback immediately
    // after setting currentTime races the browser's own seek algorithm: reading currentTime right
    // back after the assignment already reports the NEW value even though the real seek is still
    // pending, so that readback can't be used to detect "did it actually land" — only the 'seeked'
    // event (or an unchanged position, checked BEFORE assigning) can. Without this wait, play() can
    // start from wherever the video already was and only jump to the real position later, which is
    // exactly the "audio starts a few seconds late" symptom this fixes.
    const wasAlready = Math.abs(video.currentTime - seekTo) < 0.001;
    function startPlayback() {
      if (previewGenRef.current !== myGen) return;
      video.play().catch(() => {});
      function onTimeUpdate() {
        if (previewGenRef.current !== myGen) { video.removeEventListener('timeupdate', onTimeUpdate); return; }
        if (video.currentTime >= stopAt) {
          video.pause();
          video.removeEventListener('timeupdate', onTimeUpdate);
        }
      }
      video.addEventListener('timeupdate', onTimeUpdate);
    }
    if (wasAlready) {
      startPlayback();
    } else {
      // A 'seeked' event can also arrive here from an UNRELATED, still-pending seek — e.g. the
      // previous playback's own stop handler snapping currentTime back to its stop position, which
      // schedules its own async 'seeked' that can land after this new seek has already started. That
      // stale event must not be mistaken for confirmation that THIS seek landed, so re-check the
      // actual position on every 'seeked' and keep waiting if it doesn't match yet.
      video.addEventListener('seeked', function onSeeked() {
        if (Math.abs(video.currentTime - seekTo) > 0.05) return;
        video.removeEventListener('seeked', onSeeked);
        startPlayback();
      });
      video.currentTime = seekTo;
    }
  }

  function handleTrackClick(e) {
    if (selectedTagId) { setSelectedTagId(null); return; }
    const raw = xPctFromClientX(e.clientX);
    const { xPct, snapped } = snapXPct(raw);
    setPendingXPct(xPct);
    setPendingSnapped(snapped);
    setGuidance('');
  }

  function selectTag(id) {
    setPendingXPct(null);
    setSelectedTagId(id);
    const tag = tags.find(t => t.id === id);
    if (tag) playSnippetAround(xPctToTime(tag.xPct));
  }

  function confirmPlacement() {
    if (placedCount >= words.length) { setGuidance('먼저 이 줄의 가사를 입력하세요.'); return; }
    if (pendingXPct === null) { setGuidance('먼저 트랙 위를 클릭해 위치를 지정하세요.'); return; }
    if (pendingXPct < lastPlacedXPct) {
      setGuidance('이미 배치한 단어보다 앞에는 놓을 수 없습니다 — 시간 순서대로만 배치할 수 있습니다.');
      return;
    }
    const confirmedTime = xPctToTime(pendingXPct);
    addClickTag(words[placedCount], pendingXPct, confirmedTime);
    playSnippetAround(confirmedTime);
    setPendingXPct(null);
    setPendingSnapped(false);
    setGuidance('');
  }

  function undoLast() {
    if (clickTags.length === 0) return;
    removeClickTagById(clickTags[clickTags.length - 1].id);
    setGuidance('');
  }

  function advanceLine() {
    if (placedCount < words.length) {
      setGuidance('아직 배치하지 않은 가사가 있습니다 — 모두 배치한 뒤 다음 줄로 이동할 수 있습니다.');
      return;
    }
    setGuidance('');
    if (nextItemId) {
      const el = document.getElementById('lyric-focus-' + nextItemId);
      if (el) el.focus();
    }
  }

  // Nudging a word that's part of a merged chunk needs to know whether it's the chunk's ANCHOR
  // (its first/leftmost word — the one the chunk's whole on-screen position is pinned to) or a
  // later word merged in after it. Moving the anchor moves the whole chunk together (so it stays
  // one merged label at its new position); moving any other word splits it — and everything after
  // it in the same chunk — off to move independently, leaving the earlier word(s) exactly where
  // they were. No explicit "split" bookkeeping is needed: chunks are recomputed from xPct on every
  // render, so this natural regroups/ungroups itself the next time mergeOverlappingLabels runs.
  function nudgeSelected(deltaPct) {
    if (!selectedTag) return;
    const chunk = chunks.find(c => c.ids.includes(selectedTagId));
    let idsToMove;
    if (!chunk || chunk.words[0].id === selectedTagId) {
      idsToMove = chunk ? chunk.ids : [selectedTagId];
    } else {
      const idx = chunk.words.findIndex(w => w.id === selectedTagId);
      idsToMove = chunk.words.slice(idx).map(w => w.id);
    }
    const idSet = new Set(idsToMove);
    // Each moved tag's `time` is recalibrated too (not just xPct) — using the calibration already
    // in effect from the OTHER (unmoved) points, same as a fresh confirm would — so a corrective
    // nudge actually updates what this point contributes as a calibration anchor for its neighbors,
    // instead of leaving it pinned to whatever the flat line said when it was first confirmed.
    updateLyrics({
      tags: tags.map(t => idSet.has(t.id) ? { ...t, xPct: t.xPct + deltaPct, time: xPctToTime(t.xPct + deltaPct) } : t),
    });
    const nextXPct = selectedTag.xPct + deltaPct;
    playSnippetAround(xPctToTime(nextXPct));
  }

  // Before Enter confirms a placement — move the pending (unconfirmed) marker between detected
  // note/fret-number candidates one at a time, the same candidate list the click-to-place magnet
  // snap already uses, instead of only being reachable by clicking each one directly.
  function movePendingToAdjacentNote(direction) {
    if (pendingXPct === null || !noteColumns || noteColumns.length === 0) return;
    const sorted = [...noteColumns].sort((a, b) => a - b);
    let next;
    if (direction > 0) {
      next = sorted.find(c => c > pendingXPct + 1e-6);
      if (next === undefined) next = sorted[sorted.length - 1];
    } else {
      const before = sorted.filter(c => c < pendingXPct - 1e-6);
      next = before.length ? before[before.length - 1] : sorted[0];
    }
    setPendingXPct(next);
    setPendingSnapped(true);
    playSnippetAround(xPctToTime(next));
  }

  function handleLyricFocusKeyDown(e) {
    // Fires only when this wrapper itself has focus — while the user types in the line-text
    // textarea, a manual tag's text input, or the selected-word text input, every key (Enter/
    // Backspace included) behaves as normal text editing instead of a placement command.
    if (e.target !== e.currentTarget) return;
    const isSpace = e.key === ' ' || e.code === 'Space';
    if (selectedTagId) {
      // A selected word is this line's "재생 기준점" until a different word is selected (or
      // deselected) — Space always replays that same point's 0.5s-before..2s-after window from
      // scratch (the same rule confirmPlacement uses), so repeated presses re-listen to the exact
      // same spot rather than toggling continuous play/pause of the whole line.
      if (isSpace) {
        e.preventDefault();
        if (selectedTag) playSnippetAround(xPctToTime(selectedTag.xPct));
        return;
      }
      if (e.key === 'ArrowLeft') { e.preventDefault(); nudgeSelected(e.shiftKey ? -NUDGE_LARGE_PCT : -NUDGE_SMALL_PCT); return; }
      if (e.key === 'ArrowRight') { e.preventDefault(); nudgeSelected(e.shiftKey ? NUDGE_LARGE_PCT : NUDGE_SMALL_PCT); return; }
      if (e.key === 'Escape' || e.key === 'Enter') { e.preventDefault(); setSelectedTagId(null); return; }
      return;
    }
    // Play/pause toggle for the whole line — only when no word is selected (see above). The
    // e.target !== e.currentTarget guard above already keeps this out of the way of the lyric
    // textarea, a manual tag's text input, and the selected-word text input (Space there still
    // just types a space, as normal).
    if (isSpace) { e.preventDefault(); toggleBarPlay(); return; }
    if (pendingXPct !== null && e.key === 'ArrowLeft') { e.preventDefault(); movePendingToAdjacentNote(-1); return; }
    if (pendingXPct !== null && e.key === 'ArrowRight') { e.preventDefault(); movePendingToAdjacentNote(1); return; }
    if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); advanceLine(); return; }
    if (e.key === 'PageDown') { e.preventDefault(); advanceLine(); return; }
    if (e.key === 'Enter') { e.preventDefault(); confirmPlacement(); return; }
    // Ctrl+Z / Cmd+Z alongside Backspace — same undoLast(), same placement in this branch (so it's
    // a no-op while a word is selected, exactly like Backspace already is above).
    if (e.key === 'Backspace' || ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z'))) {
      e.preventDefault(); undoLast(); return;
    }
    if (e.key === 'Escape') { e.preventDefault(); setPendingXPct(null); setGuidance(''); return; }
  }

  // ---- independent play bar (bottom of block) ----
  function handleBarClick(e) {
    const rect = e.currentTarget.getBoundingClientRect();
    const pct = Math.min(1, Math.max(0, (e.clientX - rect.left) / rect.width));
    const video = videoElRef.current;
    if (!video) return;
    video.pause();
    // pct is the same 0-1 position space barPos01/the bar fill use, so route it through the same
    // piecewise calibration (pct*100 == xPct) instead of assuming a constant rate across the bar.
    video.currentTime = xPctToTime(pct * 100);
  }
  function toggleBarPlay() {
    const video = videoElRef.current;
    if (!video) return;
    if (video.paused) {
      // Shares previewGenRef with playSnippetAround so starting the bar invalidates any still-
      // running placement-preview watcher, and vice versa — only the most recently started
      // playback intent is ever allowed to call pause() when its own stop condition is reached.
      // 'timeupdate' rather than requestAnimationFrame for the same reason as playSnippetAround:
      // rAF is throttled while the tab is backgrounded/unfocused, which let this run past `end`
      // and on to the end of the whole video instead of stopping there.
      const myGen = ++previewGenRef.current;
      const needsSeek = video.currentTime < start || video.currentTime >= end;
      const seekTo = needsSeek ? start : null;
      function startPlayback() {
        if (previewGenRef.current !== myGen) return;
        video.play().catch(() => {});
        function onTimeUpdate() {
          if (previewGenRef.current !== myGen) { video.removeEventListener('timeupdate', onTimeUpdate); return; }
          if (video.currentTime >= end) {
            video.pause();
            // Snap back to the start (not `end`) so pressing 재생/Space again always starts a
            // fresh play-through from the beginning, instead of needing a manual re-seek first.
            video.currentTime = start;
            video.removeEventListener('timeupdate', onTimeUpdate);
          }
        }
        video.addEventListener('timeupdate', onTimeUpdate);
      }
      if (seekTo === null) {
        startPlayback();
      } else {
        // Same reasoning as playSnippetAround: wait for the seek to actually land before playing,
        // instead of racing play() against the async seek (currentTime reads back as the new value
        // immediately even before the seek really lands, so it can't be used to detect completion —
        // only 'seeked', or an unchanged position checked before assigning, as done above via
        // needsSeek). Also re-check the landed position on every 'seeked', not just the first one to
        // arrive — a still-pending 'seeked' from the PREVIOUS playback's own stop handler (which snaps
        // currentTime back to `end`) can otherwise be mistaken for confirmation that this new seek
        // (to `start`) has landed.
        video.addEventListener('seeked', function onSeeked() {
          if (Math.abs(video.currentTime - seekTo) > 0.05) return;
          video.removeEventListener('seeked', onSeeked);
          startPlayback();
        });
        video.currentTime = seekTo;
      }
    } else {
      video.pause();
    }
  }

  return (
    <div className="block">
      <div className="block-head">
        <label className="merge-select-label">
          <input type="checkbox" checked={mergeSelected} onChange={onToggleMergeSelect} />
          합치기 선택
        </label>
        <span>TAB 이미지 {index + 1}</span>
        <div className="block-actions">
          <button className="icon-btn" onClick={() => onMove(-1)} disabled={index === 0}>위</button>
          <button className="icon-btn" onClick={() => onMove(1)} disabled={index === total - 1}>아래</button>
          <button className="icon-btn" onClick={() => setSettingsOpen(o => !o)}>{settingsOpen ? '이미지 고급 닫기' : '이미지 고급'}</button>
          <button className="icon-btn" onClick={onDelete}>삭제</button>
        </div>
      </div>

      {/* Off-screen render target only — drawProcessed paints into this and it's read back via
          toDataURL/getImageData for processedSrc, playhead/note-column detection, and the eyedropper.
          Nothing draws it visibly; the "가사 배치" section below is now the block's only visible
          image, so there's no more duplicate rendering of the same TAB image. */}
      <canvas ref={canvasRef} style={{ display: 'none' }} />

      {settingsOpen && (
      <div className="controls">
        {!advanced ? (
          <div className="adv-toggle-row">
            <span>이 이미지: 기본 설정을 따르는 중</span>
            <button className="icon-btn" onClick={enableAdvanced}>고급 설정 사용</button>
          </div>
        ) : (
          <React.Fragment>
            <div className="adv-toggle-row">
              <span>이 이미지만의 고급 설정 사용 중</span>
              <button className="icon-btn" onClick={clearOverride}>기본값 따르기로 되돌리기</button>
            </div>
            <label>
              <input type="checkbox" checked={eff.removeBg} onChange={e => updateOverride({ removeBg: e.target.checked })} />
              배경 제거 (사진 배경 → 흰색)
            </label>
            {eff.removeBg && (
              <label>
                <input type="checkbox" checked={eff.invert} onChange={e => updateOverride({ invert: e.target.checked })} />
                어두운 사진 배경 (밝은 글씨/선을 검정으로 변환)
              </label>
            )}
            {/* Same full item set as the global "기본 설정" panel (threshold/softness/despeckle were
                previously hidden here whenever removeBg was off, unlike the global panel where they're
                always visible) — kept unconditional now so this panel always has parity with global. */}
            <div>
              <div className="slider-label">배경 제거 강도 ({eff.threshold})</div>
              <input type="range" min="0" max="255" step="1" value={eff.threshold}
                onChange={e => updateOverride({ threshold: Number(e.target.value) })} />
            </div>
            <div>
              <div className="slider-label">부드러운 경계 — 안티앨리어싱 유지 ({eff.softness})</div>
              <input type="range" min="0" max="60" step="1" value={eff.softness}
                onChange={e => updateOverride({ softness: Number(e.target.value) })} />
            </div>
            <label>
              <input type="checkbox" checked={eff.despeckle} onChange={e => updateOverride({ despeckle: e.target.checked })} />
              잡티(고립 노이즈) 제거
            </label>
            {eff.despeckle && (
              <div>
                <div className="slider-label">제거할 잡티 크기 ({eff.despeckleSize}px 이하)</div>
                <input type="range" min="1" max="12" step="1" value={eff.despeckleSize}
                  onChange={e => updateOverride({ despeckleSize: Number(e.target.value) })} />
              </div>
            )}
            <label>
              <input type="checkbox" checked={!!eff.playheadRemove} onChange={e => updateOverride({ playheadRemove: e.target.checked })} />
              재생 표시줄 제거 (세로로 긴 색상 커서 줄 감지 후 제거)
            </label>
            {eff.playheadRemove && (
              <div className="eyedrop-row">
                <button type="button" className="icon-btn" onClick={startColorPick}>
                  {pickingColor ? '이미지에서 클릭하세요...' : '스포이드로 색 지정'}
                </button>
                <span className="color-swatch" style={{
                  background: 'hsl(' + (eff.playheadColor ? eff.playheadColor.hue : PLAYHEAD_HUE_DEFAULT) + ', 80%, 50%)'
                }} />
                <span style={{ fontSize: '11.5px', color: 'var(--text2)' }}>
                  {eff.playheadColor ? '지정된 색 사용 중' : '기본 추정 색(파란/청록 계열) 사용 중'}
                </span>
              </div>
            )}
            {eff.playheadRemove && playheadRuns.length > 0 && (
              <div className="save-msg">
                빨간 표시가 제거 대상입니다. 실제 마디선이라면 클릭해서 제외하세요 — 체크 해제하면 언제든 원본으로 즉시 복구됩니다.
              </div>
            )}
            <div className="grid2">
              <div>
                <div className="slider-label">위쪽 자르기 ({eff.cropTop}%)</div>
                <input type="range" min="0" max={cropSliderMax(eff.cropBottom)} step="1" value={eff.cropTop}
                  onChange={e => updateOverride({ cropTop: clampCropSlider(Number(e.target.value), eff.cropBottom) })} />
              </div>
              <div>
                <div className="slider-label">아래쪽 자르기 ({eff.cropBottom}%)</div>
                <input type="range" min="0" max={cropSliderMax(eff.cropTop)} step="1" value={eff.cropBottom}
                  onChange={e => updateOverride({ cropBottom: clampCropSlider(Number(e.target.value), eff.cropTop) })} />
              </div>
              <div>
                <div className="slider-label">왼쪽 자르기 ({eff.cropLeft}%)</div>
                <input type="range" min="0" max={cropSliderMax(eff.cropRight)} step="1" value={eff.cropLeft}
                  onChange={e => updateOverride({ cropLeft: clampCropSlider(Number(e.target.value), eff.cropRight) })} />
              </div>
              <div>
                <div className="slider-label">오른쪽 자르기 ({eff.cropRight}%)</div>
                <input type="range" min="0" max={cropSliderMax(eff.cropLeft)} step="1" value={eff.cropRight}
                  onChange={e => updateOverride({ cropRight: clampCropSlider(Number(e.target.value), eff.cropLeft) })} />
              </div>
            </div>
          </React.Fragment>
        )}
      </div>
      )}

      <div id={'lyric-focus-' + item.id} className="lyric-section" tabIndex={0} onKeyDown={handleLyricFocusKeyDown}>
        <div className="lyric-head-mini">
          <span>이 줄 가사 — 띄어쓰기로 단어가 나뉩니다. 아래 트랙을 클릭해 배치하세요.</span>
        </div>
        <textarea className="onset-line-input" placeholder="이 줄의 가사를 붙여넣거나 입력하세요 (띄어쓰기 기준으로 단어가 나뉩니다)"
          value={lineText} onChange={e => setLineText(e.target.value)} rows={2} />
        <div className="onset-syllable-queue">
          {words.length === 0 && <span className="hint-text">위에 가사를 입력하면 단어가 여기 표시됩니다.</span>}
          {words.slice(placedCount).map((w, i) => (
            <span key={placedCount + i} className={'syllable-chip' + (i === 0 ? ' active' : '')}>{w}</span>
          ))}
        </div>

        <div className="lyric-head-mini">
          <span>가사 배치 — 이미지를 보고 그 아래 트랙에서 같은 x 위치를 클릭해 가사를 배치하세요 (수동으로 추가한 가사는 ⠿ 손잡이로 끌어서 이동)</span>
          <button className="icon-btn" onClick={addTag}>+ 가사 추가</button>
        </div>
        <div className="lane-wrap">
          {refStripHeight > 0 && processedSrc && (
            <div className="lane-ref-strip-standalone" style={{ height: refStripHeight + 'px' }}>
              <div ref={refStripInnerRef} className={pickingColor ? 'ref-img-inner picking' : 'ref-img-inner'}
                style={{ position: 'absolute', top: 0, left: (marginFrac * 100) + '%', width: (100 - 2 * marginFrac * 100) + '%', height: '100%' }}
                onClick={handleRefStripClick}>
                <img src={processedSrc} alt="" draggable={false}
                  style={{ position: 'absolute', top: 0, left: 0, width: '100%', height: '100%' }} />
                {eff.playheadRemove && playheadRuns.length > 0 && (
                  <div className="playhead-overlay">
                    {playheadRuns.map(run => {
                      const excluded = (item.playheadExcluded || []).includes(run.key);
                      return (
                        <div key={run.key}
                          className={excluded ? 'playhead-run-highlight excluded' : 'playhead-run-highlight'}
                          style={{ left: run.centerXPct + '%', width: '10px', marginLeft: '-5px' }}
                          title={excluded ? '클릭하면 다시 제거 대상에 포함' : '클릭하면 제거 대상에서 제외'}
                          onClick={e => { e.stopPropagation(); togglePlayheadExcluded(run.key); }} />
                      );
                    })}
                  </div>
                )}
                {barEditOpen && (
                  <div className="barline-overlay">
                    {barMarkers.map(m => (
                      <div key={m.id} className="bar-marker" style={{ left: m.xPct + '%' }} onPointerDown={e => startMarkerDrag(e, m.id)}>
                        <button className="bar-marker-del" onPointerDown={e => e.stopPropagation()} onClick={() => deleteMarker(m.id)}>×</button>
                      </div>
                    ))}
                  </div>
                )}
                {/* Playback position cursor — barPos01/barPlaying already track the ONE shared
                    <video> element via native play/pause/timeupdate listeners regardless of whether
                    playback was started from the play bar below or from a placement/nudge auto-preview
                    (playSnippetAround calls play()/pause() on that same element), so no separate state
                    is needed to cover both sources. */}
                {hasAudio && barPlaying && (
                  <div className="playback-cursor" style={{ left: (barPos01 * 100) + '%' }} />
                )}
              </div>
            </div>
          )}
          <div className={(refStripHeight > 0 ? 'lyric-lane clickable' : 'lyric-lane no-ref clickable')}
            ref={laneRef} style={{ height: laneHeight + 'px' }} onClick={handleTrackClick}>

function FloatingPreview({ title, items, titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricLetterSpacing, lyricAreaHeight, defaults }) {
  const [previewSrc, setPreviewSrc] = useState(null);
  const [busy, setBusy] = useState(false);
  const [collapsed, setCollapsed] = useState(false);
  const [expanded, setExpanded] = useState(false);

  useEffect(() => {
    let cancelled = false;
    if (items.length === 0) { setPreviewSrc(null); return; }
    setBusy(true);
    const timer = setTimeout(async () => {
      try {
        const canvas = await composeScore(items, title, 800, { titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricLetterSpacing, lyricAreaHeight, defaults });
        if (cancelled) return;
        setPreviewSrc(canvas.toDataURL('image/png'));
      } finally {
        if (!cancelled) setBusy(false);
      }
    }, 450);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [title, items, titleFontSize, referenceWidth, imageGap, lyricFontSize, lyricLetterSpacing, lyricAreaHeight, defaults]);

  if (items.length === 0) return null;

  return (
    <React.Fragment>
      <div className={collapsed ? 'float-preview collapsed' : 'float-preview'}>
        <div className="float-preview-head">
          <span>미리보기{busy ? ' ...' : ''}</span>
          <div className="block-actions">
            {!collapsed && <button className="icon-btn" onClick={() => setExpanded(true)}>크게 보기</button>}
            <button className="icon-btn" onClick={() => setCollapsed(c => !c)}>{collapsed ? '펼치기' : '접기'}</button>
          </div>
        </div>
        {!collapsed && (
          <div className="float-preview-body">
            {previewSrc && <img src={previewSrc} alt="미리보기" />}
          </div>
        )}
      </div>

      {expanded && (
        <div className="preview-modal-backdrop" onClick={() => setExpanded(false)}>
          <div className="preview-modal" onClick={e => e.stopPropagation()}>
            <div className="preview-modal-head">
              <span>전체 미리보기{busy ? ' (갱신 중...)' : ''}</span>
              <button className="icon-btn" onClick={() => setExpanded(false)}>닫기</button>
            </div>
            <div className="preview-modal-body">
              {previewSrc && <img src={previewSrc} alt="전체 미리보기" />}
            </div>
          </div>
        </div>
      )}
    </React.Fragment>
  );
}

function TabScoreBuilder() {
  const [title, setTitle] = useState('');
  const [items, setItems] = useState([]);
  const [defaults, setDefaults] = useState(DEFAULTS_INIT);
  const [titleFontSize, setTitleFontSize] = useState(44);
  const [lyricFontSize, setLyricFontSize] = useState(26);
  const [lyricLetterSpacing, setLyricLetterSpacing] = useState(0);
  const [exporting, setExporting] = useState(false);
  const [pagedFormat, setPagedFormat] = useState('pdf');
  const [pagedExporting, setPagedExporting] = useState(false);
  const [savedList, setSavedList] = useState([]);
  const [loaded, setLoaded] = useState(false);
  const [saveMsg, setSaveMsg] = useState('');
  const [noticeDismissed, setNoticeDismissed] = useState(true);
  const [mergeSelectedIds, setMergeSelectedIds] = useState(new Set());
  const [merging, setMerging] = useState(false);
  const [mergeGapPct, setMergeGapPct] = useState(0);
  const [mergePreviewSrc, setMergePreviewSrc] = useState(null);
  const [mergePreviewBusy, setMergePreviewBusy] = useState(false);
  const [batchGroupSize, setBatchGroupSize] = useState(2);
  const [batchMerging, setBatchMerging] = useState(false);
  const [batchPanelOpen, setBatchPanelOpen] = useState(false);
  const [batchExcludeStart, setBatchExcludeStart] = useState('');
  const [batchExcludeEnd, setBatchExcludeEnd] = useState('');
  const [batchPreviewSrc, setBatchPreviewSrc] = useState(null);
  const [batchPreviewBusy, setBatchPreviewBusy] = useState(false);
  const fileInputRef = useRef(null);
  const listRef = useRef(null);
  function getReferenceWidth() {
    return (listRef.current && listRef.current.getBoundingClientRect().width) || 780;
  }

  useEffect(() => {
    try {
      setNoticeDismissed(localStorage.getItem('tab_score_builder_notice_dismissed') === '1');
    } catch (e) {}
  }, []);
  function dismissNotice() {
    setNoticeDismissed(true);
    try { localStorage.setItem('tab_score_builder_notice_dismissed', '1'); } catch (e) {}
  }

  useEffect(() => {
    (async () => {
      try {
        const draft = await dbGet(DRAFT_KEY);
        let draftItems = [];
        if (draft) {
          draftItems = draft.items || [];
          setTitle(draft.title || '');
          setItems(draftItems);
          if (draft.defaults) setDefaults({ ...DEFAULTS_INIT, ...draft.defaults });
          if (draft.titleFontSize) setTitleFontSize(draft.titleFontSize);
          if (draft.lyricFontSize) setLyricFontSize(draft.lyricFontSize);
          if (draft.lyricLetterSpacing) setLyricLetterSpacing(draft.lyricLetterSpacing);
        }
        // Consumed once, right after the draft above (so it appends on top rather than racing it) —
        // deleted immediately after reading so a page refresh never re-imports the same batch.
        const imported = await dbGet(VIDEO_IMPORT_KEY);
        let mergedItems = draftItems;
        if (imported && Array.isArray(imported.items) && imported.items.length > 0) {
          mergedItems = [...draftItems, ...imported.items];
          setItems(prev => [...prev, ...imported.items]);
          await dbDelete(VIDEO_IMPORT_KEY);
          setSaveMsg('영상에서 추출한 이미지 ' + imported.items.length + '장을 불러왔습니다.');
          setTimeout(() => setSaveMsg(''), 3000);
        }
        const keys = await dbAllKeys();
        // Pass the actual merged item list in memory, not a re-read of DRAFT_KEY — see
        // cleanupOrphanVideoSources' own comment for why that used to delete a freshly-imported
        // video's blob before the debounced autosave had a chance to persist it.
        await cleanupOrphanVideoSources(keys, mergedItems);
        setSavedList(keys.filter(isScoreKey));
      } catch (e) {
        console.warn('IndexedDB 사용 불가:', e);
      }
      setLoaded(true);
    })();
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const t = setTimeout(() => {
      dbPut(DRAFT_KEY, { title, items, defaults, titleFontSize, lyricFontSize, lyricLetterSpacing }).catch(() => {});
    }, 800);
    return () => clearTimeout(t);
  }, [title, items, defaults, titleFontSize, lyricFontSize, lyricLetterSpacing, loaded]);

  function handleFiles(e) {
    const files = Array.from(e.target.files || []);
    files.forEach(file => {
      const reader = new FileReader();
      reader.onload = ev => {
        const src = ev.target.result;
        const probe = new Image();
        probe.onload = () => {
          const avg = sampleAvgLuminance(probe);
          const invert = defaults.invertMode === 'auto' ? (avg < 128) : defaults.invertMode === 'on';
          const baseId = Date.now() + '_' + Math.random().toString(36).slice(2);
          setItems(prev => [
            ...prev,
            {
              id: baseId, type: 'image', src,
              invert,
              override: null,
              lyrics: { tags: [], areaHeightRatio: null },
              playheadExcluded: [],
              barLayout: null,
              stitchMeta: null,
            },
          ]);
        };
        probe.src = src;
      };
      reader.readAsDataURL(file);
    });
    e.target.value = '';
  }

  function toggleMergeSelect(id) {
    setMergeSelectedIds(prev => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id); else next.add(id);
      return next;
    });
  }

  // Shared by the live preview effect and the final merge, so both always agree on exactly which
  // items are being merged and in what order.
  function getContiguousMergeIndices() {
    const indices = items
      .map((it, idx) => (mergeSelectedIds.has(it.id) ? idx : -1))
      .filter(idx => idx !== -1);
    if (indices.length < 2) return null;
    const isContiguous = indices.every((idx, i) => i === 0 || idx === indices[i - 1] + 1);
    return isContiguous ? indices : null;
  }

  // Live preview of the merge result as the gap slider moves, so the user can see whether an overlap
  // (negative gap) starts eating into actual bar content before committing to the irreversible merge.
  useEffect(() => {
    let cancelled = false;
    const indices = getContiguousMergeIndices();
    if (!indices) { setMergePreviewSrc(null); return; }
    setMergePreviewBusy(true);
    const timer = setTimeout(async () => {
      try {
        const sourceItems = indices.map(idx => items[idx]);
        const result = await mergeImagesIntoRow(sourceItems, defaults, mergeGapPct);
        if (cancelled) return;
        setMergePreviewSrc(result.canvas.toDataURL('image/png'));
      } finally {
        if (!cancelled) setMergePreviewBusy(false);
      }
    }, 350);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [mergeSelectedIds, mergeGapPct, items, defaults]);

  async function handleMergeSelected() {
    const indices = getContiguousMergeIndices();
    if (!indices) {
      if (mergeSelectedIds.size < 2) { alert('합칠 이미지를 2개 이상 선택해주세요.'); return; }
      alert('선택한 이미지들이 목록에서 서로 떨어져 있습니다. 합치려면 연속된(붙어 있는) 이미지들만 선택해주세요.');
      return;
    }
    if (!window.confirm(indices.length + '개의 이미지를 하나의 줄로 합칩니다. 원래 이미지들은 사라지고 되돌릴 수 없습니다. 계속할까요?')) return;

    setMerging(true);
    try {
      const startIdx = indices[0];
      const sourceItems = indices.map(idx => items[idx]);
      const result = await mergeImagesIntoRow(sourceItems, defaults, mergeGapPct);
      const newItem = {
        id: Date.now() + '_' + Math.random().toString(36).slice(2),
        type: 'image', src: result.canvas.toDataURL('image/png'),
        invert: false, override: { ...MERGED_ROW_NEUTRAL_OVERRIDE },
        lyrics: result.lyrics,
        playheadExcluded: [], barLayout: null, stitchMeta: null,
      };
      setItems(prev => {
        const next = [...prev];
        next.splice(startIdx, indices.length, newItem);
        return next;
      });
      setMergeSelectedIds(new Set());
      setMergeGapPct(0);
      if (result.anyStaffMissing) {
        const positions = result.missingStaffIndices.map(i => i + 1).join(', ');
        alert(
          (indices.length + '장 중 ' + positions + '번째 이미지에서 보표선을 인식하지 못해, ') +
          '그 이미지는 크기 보정과 겹침(콘텐츠 경계 기준 자르기) 보정을 모두 건너뛰고 원본 폭 그대로 이어붙여졌습니다. 결과를 확인해주세요.'
        );
      }
    } catch (err) {
      console.error(err);
      alert('이미지를 합치는 중 오류가 발생했습니다.');
    } finally {
      setMerging(false);
    }
  }

  // Splits `list` into consecutive chunks of `n` — only the LAST chunk can end up shorter than n
  // (whatever's left over after grouping front-to-back), never any earlier one.
  function chunkForBatchMerge(list, n) {
    const groups = [];
    for (let i = 0; i < list.length; i += n) groups.push(list.slice(i, i + n));
    return groups;
  }

  // Resolves the (optional) 1-indexed start/end exclude range against the current item count.
  // Returns null whenever the range doesn't apply — both fields blank (no exclusion requested) and
  // an invalid range (out of bounds, end before start, non-numeric) are treated identically as "no
  // exclusion", so a half-typed or stale range value never silently blocks the whole batch action.
  function resolveBatchExcludeRange(itemCount, startStr, endStr) {
    const start = parseInt(startStr, 10);
    const end = parseInt(endStr, 10);
    if (!Number.isInteger(start) || !Number.isInteger(end) || start < 1 || end < start || start > itemCount) {
      return null;
    }
    return { startIdx: start - 1, endIdx: Math.min(end, itemCount) - 1 };
  }

  // Splits the full item list into the untouched "before" and "excluded" ranges plus the "after"
  // range that batch-merge actually groups — shared by the live preview and the real run so they
  // always agree on exactly which images are in play.
  function splitBatchTargets(list) {
    const range = resolveBatchExcludeRange(list.length, batchExcludeStart, batchExcludeEnd);
    if (!range) return { before: [], excluded: [], after: list, range: null };
    return {
      before: list.slice(0, range.startIdx),
      excluded: list.slice(range.startIdx, range.endIdx + 1),
      after: list.slice(range.endIdx + 1),
      range,
    };
  }

  // Live preview of just the first 2 images that would actually be grouped, so the gap/overlap
  // setting can be sanity-checked without waiting on the full (irreversible) batch run.
  useEffect(() => {
    let cancelled = false;
    if (!batchPanelOpen) { setBatchPreviewSrc(null); return; }
    const { after } = splitBatchTargets(items);
    if (after.length < 2) { setBatchPreviewSrc(null); return; }
    setBatchPreviewBusy(true);
    const timer = setTimeout(async () => {
      try {
        const result = await mergeImagesIntoRow(after.slice(0, 2), defaults, mergeGapPct);
        if (cancelled) return;
        setBatchPreviewSrc(result.canvas.toDataURL('image/png'));
      } finally {
        if (!cancelled) setBatchPreviewBusy(false);
      }
    }, 350);
    return () => { cancelled = true; clearTimeout(timer); };
  }, [batchPanelOpen, items, batchExcludeStart, batchExcludeEnd, mergeGapPct, defaults]);

  async function handleBatchMerge() {
    const n = Math.max(2, Math.floor(batchGroupSize) || 2);
    const { before, excluded, after } = splitBatchTargets(items);
    if (after.length < 2) {
      alert('일괄 합치기 대상 이미지가 2장 이상 있어야 합니다 (제외 범위를 확인해주세요).');
      return;
    }

    const groups = chunkForBatchMerge(after, n);
    const lastGroup = groups[groups.length - 1];
    const lastIsPartial = lastGroup.length < n;

    let confirmMsg = excluded.length > 0
      ? ((before.length + 1) + '번째~' + (before.length + excluded.length) + '번째 제외, 나머지 ' + after.length + '장을 '
          + n + '장씩 묶어 ' + groups.length + '개 그룹으로 합칩니다.')
      : ('전체 ' + after.length + '장을 ' + n + '장씩 묶어 ' + groups.length + '개 그룹으로 합칩니다.');
    if (lastIsPartial) {
      confirmMsg += ' (마지막 그룹은 ' + lastGroup.length + '장으로, 다른 줄과 같은 크기로 왼쪽 정렬되고 오른쪽에 여백이 남습니다.)';
    }
    confirmMsg += ' 합쳐지는 이미지들은 원래 상태로 되돌릴 수 없습니다. 계속할까요?';
    if (!window.confirm(confirmMsg)) return;

    setBatchMerging(true);
    try {
      const mergedResults = [];
      const staffMissingGroupNumbers = [];
      for (const [groupIdx, group] of groups.entries()) {
        const result = await mergeImagesIntoRow(group, defaults, mergeGapPct);
        if (result.anyStaffMissing) staffMissingGroupNumbers.push(groupIdx + 1);
        mergedResults.push(result);
      }

      // A too-short trailing group (1-2 leftover pieces) is kept at the EXACT SAME per-piece scale as
      // every other row — scaling it up to match the other rows' width was tried and rejected (made
      // its text/numbers visibly larger than every other row, which read as more wrong, not less).
      // Instead its unscaled canvas is left-aligned onto a canvas as wide as the other (full) rows,
      // with plain white space on the right filling whatever room the missing pieces would have used.
      if (lastIsPartial) {
        const fullWidths = groups
          .map((g, i) => (g.length === n ? mergedResults[i].canvas.width : null))
          .filter(w => w != null);
        if (fullWidths.length > 0) {
          const avgFullWidth = Math.round(fullWidths.reduce((a, b) => a + b, 0) / fullWidths.length);
          const lastCanvas = mergedResults[mergedResults.length - 1].canvas;
          mergedResults[mergedResults.length - 1] = {
            ...mergedResults[mergedResults.length - 1],
            canvas: padCanvasRightTo(lastCanvas, avgFullWidth),
          };
        }
      }

      const newBlocks = mergedResults.map((result, i) => ({
        id: Date.now() + '_' + Math.random().toString(36).slice(2) + '_' + i,
        type: 'image', src: result.canvas.toDataURL('image/png'),
        invert: false, override: { ...MERGED_ROW_NEUTRAL_OVERRIDE },
        lyrics: result.lyrics,
        playheadExcluded: [], barLayout: null, stitchMeta: null,
      }));

      setItems([...before, ...excluded, ...newBlocks]);
      setMergeSelectedIds(new Set());
      setBatchPanelOpen(false);
      setBatchExcludeStart('');
      setBatchExcludeEnd('');

      let summary = excluded.length > 0
        ? (excluded.length + '장 제외, 나머지 ' + after.length + '장을 ' + n + '장씩 묶어 총 ' + groups.length + '개 그룹으로 합쳐졌습니다.')
        : (n + '장씩 묶어 총 ' + groups.length + '개 그룹으로 합쳐졌습니다.');
      if (staffMissingGroupNumbers.length > 0) {
        summary += ' (' + staffMissingGroupNumbers.join(', ') + '번째 그룹은 일부 이미지의 보표선을 인식하지 못해, '
          + '크기 보정과 겹침(콘텐츠 경계 기준 자르기) 보정을 모두 건너뛰고 원본 폭 그대로 합쳐졌습니다 — 결과를 확인해주세요.)';
      }
      alert(summary);
    } catch (err) {
      console.error(err);
      alert('일괄 합치기 중 오류가 발생했습니다.');
    } finally {
      setBatchMerging(false);
    }
  }

  function applyDefaultsToAll() {
    if (items.length === 0) return;
    if (!window.confirm('모든 이미지의 개별(고급) 설정을 지우고 위쪽 기본값을 따르도록 되돌립니다. 계속할까요?')) return;
    setItems(prev => prev.map(it => ({ ...it, override: null })));
  }

  function applyLyricAreaHeightToAll() {
    if (items.length === 0) return;
    if (!window.confirm('모든 가사 입력 영역의 개별 높이 설정을 지우고 위쪽 기본값을 따르도록 되돌립니다. 계속할까요?')) return;
    setItems(prev => prev.map(it => it.lyrics ? { ...it, lyrics: { ...it.lyrics, areaHeightRatio: null } } : it));
  }

  function updateItem(id, next) {
    setItems(prev => prev.map(it => it.id === id ? next : it));
  }
  function deleteItem(id) {
    setItems(prev => prev.filter(it => it.id !== id));
    setMergeSelectedIds(prev => {
      if (!prev.has(id)) return prev;
      const next = new Set(prev);
      next.delete(id);
      return next;
    });
  }
  function moveItem(id, dir) {
    setItems(prev => {
      const idx = prev.findIndex(it => it.id === id);
      const next = idx + dir;
      if (next < 0 || next >= prev.length) return prev;
      const copy = [...prev];
      [copy[idx], copy[next]] = [copy[next], copy[idx]];
      return copy;
    });
  }

  async function handleExport() {
    if (items.length === 0) return;
    setExporting(true);
    try {
      // 'auto': use the largest original image's own resolution as the export width, instead of a
      // fixed 1400px that was silently downscaling (blurring) exports whenever a source capture was
      // wider than that — which real screenshots/scans commonly are. Capped by EXPORT_MAX_WIDTH.
      const canvas = await composeScore(items, title, 'auto', {
        titleFontSize, referenceWidth: getReferenceWidth(), imageGap: defaults.imageGap,
        lyricFontSize, lyricLetterSpacing, lyricAreaHeight: defaults.lyricAreaHeight, defaults,
      });
      canvas.toBlob(blob => {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = (title.trim() || 'tab_score') + '.png';
        a.click();
        URL.revokeObjectURL(url);
        setExporting(false);
      });
    } catch (err) {
      console.error(err);
      setExporting(false);
    }
  }

  async function handleExportPaged() {
    if (items.length === 0) return;
    setPagedExporting(true);
    try {
      const { canvases, overflowCount } = await composeScorePages(items, title, {
        titleFontSize, referenceWidth: getReferenceWidth(), imageGap: defaults.imageGap,
        lyricFontSize, lyricLetterSpacing, lyricAreaHeight: defaults.lyricAreaHeight, defaults,
      });
      if (pagedFormat === 'pdf') {
        await exportPagesAsPdf(canvases, title);
      } else {
        await exportPagesAsZip(canvases, title, pagedFormat);
      }
      if (overflowCount > 0) {
        alert('일부 줄(' + overflowCount + '개)이 A4 한 페이지보다 길어서 해당 페이지는 A4 비율보다 길게 내보내졌습니다.');
      }
    } catch (err) {
      console.error(err);
      alert('분할 내보내기에 실패했습니다.');
    } finally {
      setPagedExporting(false);
    }
  }

  async function handleFinalSave() {
    const name = title.trim();
    if (!name) { alert('저장하려면 먼저 제목을 입력해주세요.'); return; }
    try {
      await dbPut(name, { title, items, defaults, titleFontSize, lyricFontSize, lyricLetterSpacing });
      const keys = await dbAllKeys();
      setSavedList(keys.filter(isScoreKey));
      setSaveMsg('"' + name + '" 저장됨');
      setTimeout(() => setSaveMsg(''), 2500);
    } catch (e) {
      alert('저장에 실패했습니다 (브라우저 저장소를 사용할 수 없음).');
    }
  }

  async function handleLoad(name) {
    try {
      const data = await dbGet(name);
      if (data) {
        setTitle(data.title || '');
        setItems(data.items || []);
        if (data.defaults) setDefaults({ ...DEFAULTS_INIT, ...data.defaults });
        if (data.titleFontSize) setTitleFontSize(data.titleFontSize);
        if (data.lyricFontSize) setLyricFontSize(data.lyricFontSize);
        if (data.lyricLetterSpacing) setLyricLetterSpacing(data.lyricLetterSpacing);
      }
    } catch (e) {}
  }

  async function handleDeleteSaved(name) {
    if (!window.confirm('"' + name + '" 악보를 삭제할까요?')) return;
    try {
      await dbDelete(name);
      const keys = await dbAllKeys();
      setSavedList(keys.filter(isScoreKey));
    } catch (e) {}
  }

  async function handleReset() {
    if (!window.confirm('현재 작업 중인 내용을 모두 지울까요? (저장된 악보 목록은 유지됩니다)')) return;
    setTitle('');
    setItems([]);
    try { await dbDelete(DRAFT_KEY); } catch (e) {}
  }

  return (
    <div className="app">
      <div className="titlebar">
        <input type="text" value={title} onChange={e => setTitle(e.target.value)} placeholder="악보 제목을 입력하세요" />
        <a className="nav-link" href="video-tab-extractor.html">영상에서 추출 →</a>
        <a className="nav-link" href="index.html">코드보 만들기 →</a>
      </div>

      {!noticeDismissed && (
        <div className="notice-banner">
          <div className="notice-text">
            <b>안내:</b> 본 도구는 사용자가 직접 보유한 이미지를 편집·정리하기 위한 <b>개인 연습용 도구</b>입니다.
            모든 데이터는 이 브라우저에만 저장되며 서버로 전송되거나 다른 사용자와 공유되지 않습니다.
            업로드하는 이미지에 대한 저작권 및 이용 책임은 사용자 본인에게 있습니다.
          </div>
          <button className="icon-btn" onClick={dismissNotice}>확인</button>
        </div>
      )}

      <GlobalSettings
        defaults={defaults}
        setDefaults={setDefaults}
        titleFontSize={titleFontSize}
        setTitleFontSize={setTitleFontSize}
        lyricFontSize={lyricFontSize}
        setLyricFontSize={setLyricFontSize}
        lyricLetterSpacing={lyricLetterSpacing}
        setLyricLetterSpacing={setLyricLetterSpacing}
        onApplyAll={applyDefaultsToAll}
        onApplyLyricAreaHeight={applyLyricAreaHeightToAll}
        hasItems={items.length > 0}
      />

      <div className="toolbar">
        <input ref={fileInputRef} type="file" accept="image/*" multiple onChange={handleFiles} style={{ display: 'none' }} />
        <button onClick={() => fileInputRef.current && fileInputRef.current.click()}>TAB 이미지 추가</button>
        <button onClick={handleExport} disabled={items.length === 0 || exporting}>
          {exporting ? '내보내는 중...' : 'PNG로 내보내기'}
        </button>
        <select value={pagedFormat} onChange={e => setPagedFormat(e.target.value)} title="A4 자동 분할 내보내기 형식" disabled={pagedExporting} style={{ width: 'auto' }}>
          <option value="pdf">PDF (여러 페이지)</option>
          <option value="png">PNG (여러 파일, zip)</option>
          <option value="jpeg">JPEG (여러 파일, zip)</option>
        </select>
        <button className="icon-btn" onClick={handleExportPaged} disabled={items.length === 0 || pagedExporting}>
          {pagedExporting ? '분할 내보내는 중...' : 'A4로 분할 저장'}
        </button>
        <button onClick={handleFinalSave} disabled={items.length === 0}>최종 저장</button>
        <button onClick={handleReset} disabled={items.length === 0 && !title}>초기화</button>
        {saveMsg && <span className="save-msg">{saveMsg}</span>}
      </div>

      {items.length >= 2 && !batchPanelOpen && (
        <div className="toolbar">
          <button className="icon-btn" onClick={() => setBatchPanelOpen(true)}>일괄 합치기</button>
        </div>
      )}

      {items.length >= 2 && batchPanelOpen && (
        <div className="merge-panel">
          <div className="toolbar merge-toolbar">
            <span className="slider-label" style={{ margin: 0 }}>이미지</span>
            <input type="number" min="2" max={Math.max(2, items.length)} step="1" value={batchGroupSize}
              style={{ width: '60px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
              onChange={e => setBatchGroupSize(Math.max(2, Number(e.target.value) || 2))} />
            <span className="slider-label" style={{ margin: 0 }}>장씩 순서대로 일괄 합치기</span>
            <button onClick={handleBatchMerge} disabled={batchMerging || merging}>
              {batchMerging ? '일괄 합치는 중...' : '일괄 합치기 진행'}
            </button>
            <button className="icon-btn" onClick={() => setBatchPanelOpen(false)} disabled={batchMerging}>접기</button>
          </div>

          <div className="toolbar">
            <span className="slider-label" style={{ margin: 0 }}>제외할 범위 (선택)</span>
            <input type="number" min="1" max={items.length} placeholder="시작" value={batchExcludeStart}
              style={{ width: '64px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
              onChange={e => setBatchExcludeStart(e.target.value)} />
            <span className="slider-label" style={{ margin: 0 }}>번째 ~</span>
            <input type="number" min="1" max={items.length} placeholder="끝" value={batchExcludeEnd}
              style={{ width: '64px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
              onChange={e => setBatchExcludeEnd(e.target.value)} />
            <span className="slider-label" style={{ margin: 0 }}>번째 (비워두면 전체가 대상)</span>
          </div>

          <div>
            <div className="slider-label">조각 사이 간격 ({mergeGapPct}%, 각 조각 폭 기준 — 음수면 겹쳐서 이어붙임)</div>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <input type="range" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                style={{ flex: 1 }}
                onChange={e => setMergeGapPct(Number(e.target.value))} />
              <input type="number" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                style={{ width: '70px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
                onChange={e => setMergeGapPct(Math.min(MERGE_GAP_MAX_PCT, Math.max(MERGE_GAP_MIN_PCT, Number(e.target.value) || 0)))} />
            </div>
          </div>

          {(batchPreviewSrc || batchPreviewBusy) && (
            <div className="merge-preview">
              <div className="lyric-head-mini">
                <span>대상 앞 2장 미리보기{batchPreviewBusy ? ' (갱신 중...)' : ''} — 겹치는 부분에 마디 내용이 가려지지 않는지 확인하세요</span>
              </div>
              {batchPreviewSrc && <img src={batchPreviewSrc} alt="일괄 합치기 미리보기" className="merge-preview-img" />}
            </div>
          )}
        </div>
      )}

      {savedList.length > 0 && (
        <div className="saved-list">
          <span>저장된 악보:</span>
          {savedList.map(name => (
            <span className="saved-chip" key={name}>
              <button className="icon-btn" onClick={() => handleLoad(name)}>{name}</button>
              <button className="icon-btn" onClick={() => handleDeleteSaved(name)}>삭제</button>
            </span>
          ))}
        </div>
      )}

      {items.length === 0 && (
        <div className="empty">
          위 "기본 설정"에서 배경 제거 강도·가사 글자 크기 등을 먼저 맞춰두면, 추가하는 이미지마다 그 값이 실시간 적용됩니다.<br />
          TAB 캡쳐 이미지를 순서대로 추가하고, 각 이미지 아래에서 가사를 원하는 위치로 끌어다 놓으세요. 작업 내용은 자동으로 임시저장됩니다.
        </div>
      )}

      {mergeSelectedIds.size > 0 && (
        <div className="merge-panel">
          <div className="toolbar merge-toolbar">
            <span className="save-msg">{mergeSelectedIds.size}개 선택됨 (연속된 이미지만 합칠 수 있어요)</span>
            <button onClick={handleMergeSelected} disabled={mergeSelectedIds.size < 2 || merging}>
              {merging ? '합치는 중...' : '선택한 이미지 한 줄로 합치기'}
            </button>
            <button className="icon-btn" onClick={() => setMergeSelectedIds(new Set())} disabled={merging}>선택 해제</button>
          </div>

          <div>
            <div className="slider-label">조각 사이 간격 ({mergeGapPct}%, 각 조각 폭 기준 — 음수면 겹쳐서 이어붙임)</div>
            <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
              <input type="range" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                style={{ flex: 1 }}
                onChange={e => setMergeGapPct(Number(e.target.value))} />
              <input type="number" min={MERGE_GAP_MIN_PCT} max={MERGE_GAP_MAX_PCT} step="0.5" value={mergeGapPct}
                style={{ width: '70px', border: '1px solid var(--border-strong)', borderRadius: '8px', padding: '5px 6px', fontSize: '13px' }}
                onChange={e => setMergeGapPct(Math.min(MERGE_GAP_MAX_PCT, Math.max(MERGE_GAP_MIN_PCT, Number(e.target.value) || 0)))} />
            </div>
          </div>

          {(mergePreviewSrc || mergePreviewBusy) && (
            <div className="merge-preview">
              <div className="lyric-head-mini">
                <span>미리보기{mergePreviewBusy ? ' (갱신 중...)' : ''} — 겹치는 부분에 마디 내용이 가려지지 않는지 확인하세요</span>
              </div>
              {mergePreviewSrc && <img src={mergePreviewSrc} alt="합치기 미리보기" className="merge-preview-img" />}
            </div>
          )}
        </div>
      )}

      <div className="list" ref={listRef}>
        {items.map((item, idx) => (
          <ImageBlock key={item.id} item={item} index={idx} total={items.length}
            defaults={defaults}
            lyricFontSize={lyricFontSize}
            lyricLetterSpacing={lyricLetterSpacing}
            defaultLyricAreaHeight={defaults.lyricAreaHeight}
            onChange={next => updateItem(item.id, next)}
            onDelete={() => deleteItem(item.id)}
            onMove={dir => moveItem(item.id, dir)}
            mergeSelected={mergeSelectedIds.has(item.id)}
            onToggleMergeSelect={() => toggleMergeSelect(item.id)}
            nextItemId={items[idx + 1] ? items[idx + 1].id : null} />
        ))}
      </div>

      <FloatingPreview title={title} items={items} titleFontSize={titleFontSize}
        referenceWidth={getReferenceWidth()} imageGap={defaults.imageGap}
        lyricFontSize={lyricFontSize} lyricLetterSpacing={lyricLetterSpacing}
        lyricAreaHeight={defaults.lyricAreaHeight} defaults={defaults} />

      <div className="disclaimer-footer">
        본 도구는 이미지 편집·정리 기능만 제공하는 개인 연습용 소프트웨어이며, 악보나 이미지를 수집·배포하지 않습니다.<br />
        모든 데이터는 사용자의 브라우저에만 저장되고, 업로드·내보내기 하는 콘텐츠의 저작권 준수 책임은 사용자에게 있습니다.
      </div>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<TabScoreBuilder />);
</script>
</body>
</html>
